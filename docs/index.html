<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 🟢 GEA 協同修改：將標題改為 MARKET INSIGHTS -->
<title>MARKET INSIGHTS</title>
<!-- 🟢 GEA 協同修改：將 viewBox 縮為 3 3 34 34 讓 Logo 放大 15% -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='3 3 34 34' color='%23D9A441'><circle cx='20' cy='20' r='16.5' fill='none' stroke='currentColor' stroke-width='1.4' opacity='.45'/><path d='M8 12.5 A15 15 0 0 1 32 12.5' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><path d='M8 27.5 A15 15 0 0 0 32 27.5' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><line x1='1.5' y1='20' x2='38.5' y2='20' stroke='currentColor' stroke-width='1.4'/><circle cx='26' cy='20' r='3.6' fill='currentColor'/></svg>" type="image/svg+xml">
<meta name="description" content="台股盤面結構、期權籌碼、法人與信用交易的每日整理。">
<style>
/* ══ 色票 ═══════════════════════════════════════════════════════ */
:root{
  --up:#E5484D; --down:#12A366; --acc:#D9A441;
  --r:12px; --w:1320px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
/* 🟢 GEA 協同修改：黑化設計，純黑背景與深灰線條，拿掉海軍藍 */
[data-theme="dark"]{
  --bg:#000000; --surface:#111111; --raise:#1E1E1E; --chip:#2B2B2B;
  --ink-1:#F5F5F5; --ink-2:#A3A3A3; --ink-3:#666666; --line:#2A2A2A;
  --barbg:#1F1F1F;
}
[data-theme="light"]{
  --bg:#F4F6F4; --surface:#FFFFFF; --raise:#EDF0EE; --chip:#E4E9E6;
  --ink-1:#0F161D; --ink-2:#44515E; --ink-3:#68757F; --line:#DDE3E0;
  --barbg:#E7ECE9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink-1); font-family:var(--sans);
  font-size:16px; line-height:1.6; letter-spacing:.005em; font-weight:450;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--w); margin:0 auto; padding:0 20px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.015em; font-weight:500}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-2)}
.eyebrow{font-size:14px; font-weight:800; letter-spacing:.14em; color:var(--ink-1)}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px; border-radius:5px}

/* ══ 標誌 ══ */
/* 🟢 GEA 協同修改：將網頁內大 Logo 從 30px 放寬至 38px */
.mark{width:38px; height:38px; flex:0 0 auto; color:var(--acc)}
button.brandbox{background:none; border:0; padding:0; margin:0; font:inherit; color:inherit;
  cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent}
button.brandbox:hover .mark{opacity:.75}
button.brandbox:hover .bname{color:var(--acc)}

/* ══ 頁首 ══ */
header{border-bottom:1px solid var(--line); background:var(--surface)}
.hbar{display:flex; align-items:center; gap:14px; padding:16px 0 15px; flex-wrap:wrap}
.brandbox{display:flex; align-items:center; gap:11px}
/* 🟢 GEA 協同修改：設計感標題 */
.bname{font-size:22px; font-weight:800; letter-spacing:0.08em; font-family:var(--mono); text-transform:uppercase;}
.stamp{font-size:13.5px; color:var(--ink-2)}
/* 🟢 GEA 2026-08-20（G-1b）：資料日退化警示帶。用琥珀不用紅綠 —— 紅綠在這一站是漲跌。 */
.alert{margin:16px 0 0; padding:12px 15px; border:1px solid var(--acc);
       border-left-width:5px; border-radius:9px; background:rgba(217,164,65,.10)}
.alert .t{font-size:16px; font-weight:800; color:var(--acc); letter-spacing:.02em}
.alert .sub{font-size:14px; color:var(--ink-2); margin-top:5px; line-height:1.6}
.stamp .warn{color:var(--acc); font-weight:800}
.stamp b{font-family:var(--mono); color:var(--ink-1); font-weight:600}
.spacer{flex:1}
button.theme{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--raise); color:var(--ink-1); border:1px solid var(--line);
  border-radius:999px; padding:7px 15px; font:inherit; font-size:13.5px;
  font-weight:600; cursor:pointer;
}
button.theme:hover{border-color:var(--acc)}
button.theme svg{width:15px; height:15px}

/* ══ 結構軸 ══ */
.axis{padding:24px 0 10px}
.axis-head{display:flex; align-items:baseline; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.axis-note{font-size:15.5px; color:var(--ink-1); font-weight:600; line-height:1.5}
.track{display:grid; grid-template-columns:88px 1fr 110px; align-items:center; gap:14px; padding:8px 0}
.track .who{font-size:14.5px; color:var(--ink-1); font-weight:700}
.rail{position:relative; height:26px; background:var(--barbg); border-radius:6px; overflow:hidden}
.rail::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:1.5px; background:var(--acc); opacity:.75}
.fill{position:absolute; top:5px; bottom:5px; border-radius:3px}
.track .val{text-align:right; font-size:16px; font-weight:700}
.track .val .s{font-size:15px; color:var(--ink-1); font-weight:700; opacity:.82}
/* 副值原本 12px + ink-3，跟旁邊 16px 粗體的百分比落差太大，灰到根本不會去看。
   對齊成 15px / 700，只用透明度做主次區分。 */
.axis-scale{display:flex; justify-content:space-between; font-size:15px; font-weight:700;
  color:var(--ink-2); font-family:var(--mono); padding:9px 124px 0 102px}

/* ══ 數字磚 ══ */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; margin:20px 0 4px}
.tile{background:var(--surface); padding:15px 17px 16px}
.tile .k{font-size:12px; color:var(--ink-2); letter-spacing:.05em; margin-bottom:6px; font-weight:600}
.tile .v{font-size:25px; font-weight:800; line-height:1.15}
.tile .s{font-size:13px; color:var(--ink-2); margin-top:4px}

/* ══ 頁籤 ══ */
/* 🟢 GEA 協同修改：支援 11 個頁籤雙排折行 (flex-wrap)，取消不換行限制 */
nav.tabs{display:flex; gap:3px; flex-wrap:wrap; margin:26px 0 0;
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line); padding-bottom: 2px;}
nav.tabs button{background:none; border:0; border-bottom:2.5px solid transparent;
  color:var(--ink-2); font:inherit; font-size:15px; font-weight:700; padding:10px 14px;
  cursor:pointer; flex: 1 1 auto; text-align: center; white-space:nowrap}
nav.tabs button:hover{color:var(--ink-1); background: var(--raise); border-radius: 4px 4px 0 0;}
nav.tabs button[aria-selected="true"]{color:var(--ink-1); border-bottom-color:var(--acc)}

/* ══ 卡片 ══ */
main{padding:24px 0 48px}
.panel[hidden]{display:none}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 19px 20px; margin-bottom:18px}
.card>h3{margin:0 0 4px; font-size:17px; font-weight:800; letter-spacing:.02em}
.card .sub{font-size:13.5px; color:var(--ink-2); margin-bottom:14px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(400px,1fr)); gap:18px; align-items:start}
.grid2>.card{margin-bottom:0}

/* 🟢 GEA 協同修改：新增 Drawdown 每 10% 分層專屬色塊 */
.dd-0 { color: var(--ink-1); }
.dd-10 { color: #F1C40F; font-weight: 700; }
.dd-20 { color: #F39C12; font-weight: 700; }
.dd-30 { color: #E67E22; font-weight: 700; }
.dd-40 { color: #E74C3C; font-weight: 700; }
.dd-50 { color: #C0392B; font-weight: 900; }
.dd-60 { color: #8E44AD; font-weight: 900; }

table{width:100%; border-collapse:collapse; font-size:14.5px}
td .name{display:inline-block; max-width:9.5em; overflow:hidden; text-overflow:ellipsis;
  vertical-align:bottom; white-space:nowrap}
.grp td{white-space:normal}
th{text-align:left; font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-2); padding:0 9px 8px 0; border-bottom:1.5px solid var(--line); white-space:nowrap}
td{padding:7px 9px 7px 0; border-bottom:1px solid var(--line); white-space:nowrap}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.c{text-align:center}
.name{font-weight:700}
.code{font-family:var(--mono); font-size:12px; background:var(--chip); color:var(--ink-2);
  border-radius:4px; padding:1px 5px; margin-left:6px; font-weight:600}
.tbl{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%}
.scroll{max-height:520px; overflow:auto}
.card{overflow:hidden}
.chartrow{max-width:100%; overflow:hidden}
.scroll thead th{position:sticky; top:0; background:var(--surface); z-index:1}
.grp td{background:var(--raise); font-weight:800; font-size:14px; letter-spacing:.04em;
  color:var(--acc); border-left:3px solid var(--acc)}
/* 🟢 GEA 協同修改：解決族群名稱被截斷切邊的問題 */
.gcode{display:inline-block; white-space:normal; height:auto;
  font-size:12px; background:transparent; color:var(--acc); border:1px solid var(--acc);
  border-radius:4px; padding:1px 6px; margin-right:7px; font-weight:700; letter-spacing:.02em}
.grp .gcode{max-width:none}
th.s{cursor:pointer; user-select:none} th.s:hover{color:var(--acc)}
th.s .ar{color:var(--acc); font-size:10px; margin-left:3px}
.pager{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:2px 0 12px;
  font-size:13.5px; color:var(--ink-2)}
.pager button{background:var(--raise); color:var(--ink-1); border:1px solid var(--line);
  border-radius:7px; padding:5px 12px; font:inherit; font-size:13.5px; font-weight:700; cursor:pointer}
.pager button:disabled{opacity:.4; cursor:default}
.pager button:not(:disabled):hover{border-color:var(--acc)}
.pager select{padding:5px 9px; font-size:13.5px}

/* ══ 圖表 ══ */
.chart{width:100%; display:block; overflow:visible}
.chart .zero{stroke:var(--ink-3); stroke-width:1; opacity:.55}
.splitrow{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start}
.widerow{display:grid; grid-template-columns:minmax(0,3.6fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:1100px){.splitrow,.widerow{grid-template-columns:1fr}}
.chart .lbl.sm{font-size:12px; font-weight:500}
.pager button.on{border-color:var(--acc); color:var(--acc)}
.submeta{font-size:11px; color:var(--ink-3); font-family:var(--mono); margin-top:2px}
.sumlist{display:flex; flex-direction:column; gap:8px}
.sumcell{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--raise)}
.sumwho{font-size:14px; font-weight:700; color:var(--ink-1)}
.sumnet{font-family:var(--mono); font-size:20px; font-weight:700}
.sumnet i{font-style:normal; font-size:12px; margin-left:3px; color:var(--ink-2)}
/* 期權籌碼那幾張表的數字原本比下面柱狀圖的標籤還小，一眼掃過去會直接略過。 */
.bigtable table td{font-size:15.5px}
.bigtable table td .num{font-size:16px; font-weight:700}
.bigtable table th{font-size:13px}
.fundwrap{display:flex; flex-wrap:wrap; gap:5px; justify-content:flex-start; padding:2px 0}
.fundchip{display:inline-flex; align-items:baseline; gap:5px; padding:3px 8px; border-radius:6px;
  background:var(--chip); border:1px solid var(--line); font-size:12.5px; color:var(--ink-1);
  white-space:nowrap; line-height:1.5}
.fundchip i{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--ink-2)}
.fundchip b{font-family:var(--mono); font-size:11.5px; color:var(--acc); font-weight:600}
.fundmore{display:inline-flex; align-items:center; padding:3px 9px; border-radius:6px;
  border:1px dashed var(--line); font-size:12.5px; color:var(--ink-2); cursor:pointer}
.fundmore:hover{color:var(--acc); border-color:var(--acc)}
.fundwrap-d summary{list-style:none; cursor:pointer}
.fundwrap-d summary::-webkit-details-marker{display:none}
.fundwrap-d[open] .fundmore{display:none}
.chart .grid{stroke:var(--ink-3); stroke-width:.8; opacity:.25; stroke-dasharray:2 4}
.chart .settle{stroke:var(--acc); stroke-width:1; stroke-dasharray:3 3; opacity:.8}
.chart text{font-family:var(--mono); fill:var(--ink-2); font-size:15px; font-weight:600}
.chart .lbl{fill:var(--ink-2); font-size:15px; font-weight:600}
.chart .lbl.up{fill:var(--up)} .chart .lbl.down{fill:var(--down)}
.chartrow{margin:6px 0 16px}
.chartrow .hd{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px}
.chartrow .hd .t{font-size:15px; font-weight:700}
.chartrow .hd .v{font-size:19px; font-weight:800}

/* ══ 支撐壓力 ══ */
.ladder{display:grid; grid-template-columns:1fr 92px 1fr; align-items:center; gap:10px; padding:1px 0}
.ladder .strike{text-align:center; font-family:var(--mono); font-size:13.5px; color:var(--ink-1);
  font-variant-numeric:tabular-nums; font-weight:600}
.ladder .lb,.ladder .rb{height:19px; position:relative; background:var(--barbg); border-radius:3px}
.ladder i{position:absolute; top:0; bottom:0; border-radius:3px; display:block}
.ladder .lb i{right:0; background:var(--up)} .ladder .rb i{left:0; background:var(--down)}
.ladder b{position:absolute; top:0; font-size:11.5px; font-family:var(--mono); line-height:19px;
  font-weight:700; color:var(--ink-1); padding:0 6px}
.ladder .lb b{left:0} .ladder .rb b{right:0}
.ladder .peak{box-shadow:0 0 0 1.5px var(--acc)}

/* ══ Roster20 連動選單 ══ */
/* 🟢 GEA 協同修改：加入互動式連動面板的 CSS */
.roster-ui { display: flex; gap: 18px; align-items: flex-start; margin-top: 8px;}
.roster-nav { flex: 0 0 180px; display: flex; flex-direction: column; gap: 4px; max-height: 400px; overflow-y: auto; padding-right: 6px; }
.roster-btn { background: var(--raise); color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;}
.roster-btn:hover { border-color: var(--acc); color: var(--ink-1); }
.roster-btn.active { background: var(--acc); color: #000; border-color: var(--acc); }
.roster-btn .c { font-family: var(--mono); font-size: 12px; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; }
.roster-content { flex: 1; background: var(--raise); border-radius: 8px; padding: 16px; border: 1px solid var(--line); min-height: 200px; }
.roster-content h4 { margin: 0 0 12px 0; font-size: 16px; color: var(--acc); border-bottom: 1px solid var(--line); padding-bottom: 8px;}
.stock-pill { display: inline-block; background: var(--surface); color: var(--ink-1); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--line); margin: 0 6px 6px 0; font-size: 13.5px; }

details{margin-top:14px}
summary{cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:7px;
  font-size:13.5px; font-weight:700; color:var(--ink-1); background:var(--raise);
  border:1px solid var(--line); border-radius:999px; padding:6px 14px}
summary::-webkit-details-marker{display:none}
summary:hover{border-color:var(--acc)}
summary .chev{width:13px; height:13px; transition:transform .18s}
details[open] summary .chev{transform:rotate(90deg)}
details .body{font-size:14px; color:var(--ink-2); padding:11px 2px 2px; line-height:1.7}

select{background:var(--raise); color:var(--ink-1); border:1px solid var(--line);
  border-radius:8px; padding:8px 12px; font:inherit; font-size:14.5px; font-weight:600;
  cursor:pointer; max-width:100%}
select:hover{border-color:var(--acc)}
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:9px; overflow:hidden; margin:14px 0}
.kv>div{background:var(--surface); padding:11px 13px}
.kv .k{font-size:11.5px; color:var(--ink-2); font-weight:600; margin-bottom:3px}
.kv .v{font-size:23px; font-weight:800}

.empty{color:var(--ink-2); font-size:14.5px; padding:6px 0}

footer{border-top:1px solid var(--line); background:var(--surface);
  font-size:13px; color:var(--ink-2); padding:20px 0 32px}
footer p{margin:4px 0}

@media (max-width:680px){
  body{font-size:15.5px}
  .track{grid-template-columns:66px 1fr 104px; gap:9px}
  .track .val .s{font-size:13px}
  .axis-scale{padding:7px 106px 0 78px}
  .tile .v{font-size:21px}
  .card{padding:15px 14px 17px}
  .grid2{grid-template-columns:1fr}
  .roster-ui { flex-direction: column; }
  .roster-nav { flex: auto; max-height: 200px; width: 100%; }
}
@media (prefers-reduced-motion:no-preference){ .fill{transition:width .4s ease,left .4s ease} }
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <button class="brandbox" id="home-btn" type="button" title="回首頁" aria-label="回首頁">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="16.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".45"/>
        <path d="M8 12.5 A15 15 0 0 1 32 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M8 27.5 A15 15 0 0 0 32 27.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="1.5" y1="20" x2="38.5" y2="20" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="26" cy="20" r="3.6" fill="currentColor"/>
      </svg>
      <div>
        <div class="bname">MARKET INSIGHTS</div>
      </div>
    </button>
    <div class="stamp">資料日 <b id="stamp-date">—</b> · 更新 <b id="stamp-time">—</b></div>
    <div class="spacer"></div>
    <button class="theme" id="theme-btn" type="button"><span id="theme-ico"></span><span id="theme-txt">淺色</span></button>
  </div>
</header>

<div class="wrap"><div class="alert" id="stale-alert" hidden></div></div>

<div class="wrap">
  <section class="axis">
    <div class="axis-head">
      <div class="eyebrow">今日結構</div>
      <div class="axis-note" id="axis-note">—</div>
    </div>
    <div id="axis-tracks"></div>
    <div class="axis-scale"><span>-10%</span><span>-5%</span><span>0</span><span>+5%</span><span>+10%</span></div>
  </section>
  <section class="tiles" id="tiles"></section>
</div>

<div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <p>資料來源：臺灣證券交易所、證券櫃檯買賣中心、臺灣期貨交易所公開資訊。</p>
    <p id="foot-note">—</p>
    <p id="foot-disc">—</p>
  </div>

function settleDay(y, m) {
  let d = new Date(y, m - 1, 1), c = 0;
  while (true) { if (d.getDay() === 3) { c++; if (c === 3) break; } d.setDate(d.getDate() + 1); }

/* 🟢 GEA 2026-08-18：全卡片共用同一條 X 軸。
   柱寬公式是 min(26, (W/n)*0.6) —— 同樣的 W 之下，n 不一樣柱寬與槽距的比例就不一樣：
     n=30 → 槽距 40、柱寬 24（佔 60%，就是散戶多空比與 P/C 比那個好看的比例）
     n=11 → 槽距 109、柱寬被 26 夾住（只佔 24%）＝「牙縫」
   所以牙縫的根因是 **N 對不齊**，不是柱寬公式。把 N 對齊，比例自動一致。

   基準軸取最長的那條序列（build_web `_align_all` 產出的 30 個交易日）。
   缺的日期補 null（前段留白＝那幾天還沒有資料，跟散戶／PC 現況同一個樣子）；
   比基準軸新的日期接到尾巴，不會被吃掉。 */
function alignAxis(series, axis) {
  if (!Array.isArray(series) || !series.length) return series;
  const m = Object.fromEntries(series);
  return axis.map(d => [d, m[d] === undefined ? null : m[d]]);
}

function buildAxis(bases, extras) {
  let ax = [];
  (bases || []).forEach(s => { if (Array.isArray(s) && s.length > ax.length) ax = s.map(r => r[0]); });
  const seen = new Set(ax);
  (extras || []).forEach(s => (s || []).forEach(r => {
    if (!seen.has(r[0])) { seen.add(r[0]); ax.push(r[0]); }
  }));
  return ax;
}

  const every = Math.ceil(n / 10);
  
  rows.forEach((r, i) => {
    const [lab, v] = r;
    const x = (i + 0.5) * (W / n);
    if (lab === SETTLE) svg.appendChild(sv("line", {class: "settle", x1: x, y1: 0, x2: x, y2: H}));

    // X 軸標籤要在 null 檢查之前畫 —— 序列對齊之後前段是 null，
    // 若跟著一起 return，軸標籤會整段消失，看起來像圖從中間才開始。
    if (i % every === 0 || i === n - 1) {
      let anchor0 = "middle", tx0 = x;
      if (i === 0) { anchor0 = "start"; tx0 = 2; }
      else if (i === n - 1) { anchor0 = "end"; tx0 = W - 2; }
      const t0 = sv("text", {x: tx0, y: H + 19, "text-anchor": anchor0,
                             "font-size": opt.dense ? 30 : 15});
      t0.textContent = lab; svg.appendChild(t0);
    }

    if (v === null || v === undefined) return;
    const h = Math.abs(scale(v));
    const rect = sv("rect", {x: x - bw / 2, y: v >= 0 ? mid - h : mid, width: bw,
      height: Math.max(1.5, h), rx: 1.5,
      fill: `var(--${opt.mono ? "acc" : (v >= 0 ? "up" : "down")})`});
    const ti = sv("title"); ti.textContent = `${lab} ${opt.fmt ? opt.fmt(v) : nf(v)}`;
    rect.appendChild(ti); svg.appendChild(rect);
    

  });
  return svg;
}

/* 大盤日 K ＋ 成交金額。上半 K 棒（開高低收，缺 OHLC 時退化成收盤折線），
   下半成交金額柱，共用同一條 X 軸與同一組日期標籤。
   資料來源：收盤/成交金額 = TWSE FMTQIK，開高低 = TWSE MI_5MINS_HIST，都是官方。 */
function priceVolumeChart(series, opt = {}) {
  const n = series.length || 1;
  const W = opt.width || Math.max(800, n * 30);
  const KH = opt.kHeight || 180, VH = opt.vHeight || 70, GAP = 10, LBL = 24;
  const H = KH + GAP + VH;
  const svg = sv("svg", {class: "chart", viewBox: `0 0 ${W} ${H + LBL}`, role: "img",
                         style: "width:100%; height:auto;"});

  const hasK = series.some(r => r.o != null);
  const his = series.map(r => (r.h != null ? r.h : r.close)).filter(v => v != null);
  const los = series.map(r => (r.l != null ? r.l : r.close)).filter(v => v != null);
  if (!his.length) return svg;
  let hi = Math.max(...his), lo = Math.min(...los);
  const pad = (hi - lo) * 0.08 || 1;
  hi += pad; lo -= pad;
  const py = v => KH - ((v - lo) / (hi - lo)) * KH;

  const amts = series.map(r => r.amt || 0);
  const amx = Math.max(1, ...amts);
  const vy = v => KH + GAP + VH - (v / amx) * VH;

  /* 價格軸的三條參考線：高、中、低 */
  [hi - pad, (hi + lo) / 2, lo + pad].forEach(v => {
    svg.appendChild(sv("line", {class: "grid", x1: 0, y1: py(v), x2: W, y2: py(v)}));
    const t = sv("text", {x: 2, y: py(v) - 4, "text-anchor": "start", class: "lbl"});
    t.textContent = nf(v, 0); svg.appendChild(t);
  });
  svg.appendChild(sv("line", {class: "zero", x1: 0, y1: KH + GAP + VH, x2: W, y2: KH + GAP + VH}));

  const step = W / n;
  const bw = Math.max(2, Math.min(14, step * 0.55));
  const every = Math.ceil(n / 10);

  series.forEach((r, i) => {
    const x = (i + 0.5) * step;
    const up = (r.chg_pt || 0) >= 0;
    const col = `var(--${up ? "up" : "down"})`;

    if (hasK && r.o != null) {
      svg.appendChild(sv("line", {x1: x, y1: py(r.h), x2: x, y2: py(r.l),
                                  stroke: col, "stroke-width": 1.2}));
      const yTop = py(Math.max(r.o, r.close)), yBot = py(Math.min(r.o, r.close));
      svg.appendChild(sv("rect", {x: x - bw / 2, y: yTop, width: bw,
        height: Math.max(1.2, yBot - yTop), fill: col, rx: 0.8}));
    } else if (r.close != null) {
      svg.appendChild(sv("circle", {cx: x, cy: py(r.close), r: 2, fill: col}));
      if (i > 0 && series[i - 1].close != null) {
        svg.appendChild(sv("line", {x1: (i - 0.5) * step, y1: py(series[i - 1].close),
          x2: x, y2: py(r.close), stroke: col, "stroke-width": 1.4}));
      }
    }

    if (r.amt) {
      const y = vy(r.amt);
      svg.appendChild(sv("rect", {x: x - bw / 2, y: y, width: bw,
        height: Math.max(1, KH + GAP + VH - y), fill: col, opacity: .55, rx: 0.8}));
    }

    const hit = sv("rect", {x: x - step / 2, y: 0, width: step, height: H,
                            fill: "transparent"});
    const ti = sv("title");
    ti.textContent = `${r.date}　收 ${nf(r.close, 2)}　${sgn(r.chg_pt, 2)} 點`
      + (r.o != null ? `\n開 ${nf(r.o, 2)}　高 ${nf(r.h, 2)}　低 ${nf(r.l, 2)}` : "")
      + (r.amt ? `\n成交金額 ${nf(r.amt / 1e8, 0)} 億` : "");
    hit.appendChild(ti); svg.appendChild(hit);

    if (i % every === 0 || i === n - 1) {
      let anchor = "middle", tx = x;
      if (i === 0) { anchor = "start"; tx = 2; }
      else if (i === n - 1) { anchor = "end"; tx = W - 2; }
      const t = sv("text", {x: tx, y: H + 16, "text-anchor": anchor});
      t.textContent = r.date.slice(5).replace("-", "/"); svg.appendChild(t);
    }
  });

  const vl = sv("text", {x: 2, y: KH + GAP + 14, "text-anchor": "start", class: "lbl"});
  vl.textContent = `成交金額（峰值 ${nf(amx / 1e8, 0)} 億）`;
  svg.appendChild(vl);
  return svg;
}

/* 券商副圖式疊圖：主圖日 K，下面接成交金額與任意條副圖，全部共用同一條 X 軸。
   跟原本「一張圖一個卡片」的差別在於：垂直對齊之後，
   同一天的 K 棒、成交量、外資、投信、自營商在螢幕上是同一條垂直線，
   「大盤這天漲，是誰在買」一眼就看得出來。 */
function overlayChart(dates, kmap, panes, opt = {}) {
  const n = dates.length || 1;
  const W = opt.width || Math.max(900, n * 34);
  // 左側留出刻度欄，繪圖區從 PAD_L 開始 —— 價格刻度與柱體因此不可能重疊。
  const PAD_L = 58;
  const PW = W - PAD_L;
  // 每個 pane 上緣留一條 HEAD 高的文字帶，柱體只畫在文字帶下方，名稱與數值也不會壓到柱子。
  const HEAD = 21;   // 文字帶高度。太小的話標籤下緣會擦到柱子頂端（機械檢查抓到過 1px）
  const KH = opt.kHeight || 230, VH = 78, PH = opt.paneHeight || 82, GAP = 8, LBL = 28;
  let y = 0;
  const kTop = y; y += KH + GAP;
  const vTop = y; y += VH + GAP;
  const pTops = panes.map(() => { const t = y; y += PH + GAP; return t; });
  const H = y - GAP;
  const svg = sv("svg", {class: "chart", viewBox: `0 0 ${W} ${H + LBL}`,
                         style: "width:100%; height:auto;"});
  const step = PW / n;
  const bw = Math.max(2, Math.min(13, step * 0.5));
  const every = Math.ceil(n / 10);
  const X = i => PAD_L + (i + 0.5) * step;
  const FS = opt.fontSize || 16;

  const gline = (yy) => svg.appendChild(sv("line", {class: "grid",
    x1: PAD_L, y1: yy, x2: W, y2: yy}));
  const gtext = (yy, txt) => {
    const t = sv("text", {x: PAD_L - 6, y: yy + 4, "text-anchor": "end",
                          class: "lbl", "font-size": FS - 2});
    t.textContent = txt; svg.appendChild(t);
  };
  const headText = (top, left, right, rcls) => {
    const a = sv("text", {x: 2, y: top + FS - 2, "text-anchor": "start",
                          class: "lbl", "font-size": FS});
    a.textContent = left; svg.appendChild(a);
    if (right !== undefined) {
      const b = sv("text", {x: W - 2, y: top + FS - 2, "text-anchor": "end",
                            class: `lbl ${rcls || ""}`, "font-size": FS});
      b.textContent = right; svg.appendChild(b);
    }
  };

  // ── 主圖：日 K（文字帶之下）
  const ks = dates.map(d => kmap[d]).filter(Boolean);
  if (ks.length) {
    const kBody = KH - HEAD, kBase = kTop + HEAD;
    let hi = Math.max(...ks.map(r => r.h ?? r.close));
    let lo = Math.min(...ks.map(r => r.l ?? r.close));
    const pad = (hi - lo) * 0.08 || 1; hi += pad; lo -= pad;
    const py = v => kBase + kBody - ((v - lo) / (hi - lo)) * kBody;
    const lastK = ks[ks.length - 1];
    headText(kTop, "大盤日 K",
      `${nf(lastK.close, 2)}　${sgn(lastK.chg_pt, 2)}`, cls(lastK.chg_pt));
    [hi - pad, (hi + lo) / 2, lo + pad].forEach(v => { gline(py(v)); gtext(py(v), nf(v, 0)); });
    dates.forEach((d, i) => {
      const r = kmap[d]; if (!r) return;
      const x = X(i), col = `var(--${(r.chg_pt || 0) >= 0 ? "up" : "down"})`;
      if (r.o != null) {
        svg.appendChild(sv("line", {x1: x, y1: py(r.h), x2: x, y2: py(r.l),
                                    stroke: col, "stroke-width": 1.2}));
        const yT = py(Math.max(r.o, r.close)), yB = py(Math.min(r.o, r.close));
        svg.appendChild(sv("rect", {x: x - bw / 2, y: yT, width: bw,
          height: Math.max(1.2, yB - yT), fill: col}));
      } else {
        svg.appendChild(sv("circle", {cx: x, cy: py(r.close), r: 2, fill: col}));
      }
    });

    // ── 成交金額
    const amx = Math.max(1, ...ks.map(r => r.amt || 0));
    const vBody = VH - HEAD, vBase = vTop + HEAD;
    headText(vTop, "成交金額", `${nf((lastK.amt || 0) / 1e8, 0)} 億`);
    gtext(vBase + vBody, "0");
    svg.appendChild(sv("line", {class: "zero", x1: PAD_L, y1: vBase + vBody, x2: W, y2: vBase + vBody}));
    dates.forEach((d, i) => {
      const r = kmap[d]; if (!r || !r.amt) return;
      const h = (r.amt / amx) * vBody;
      // 成交金額改單色：原本紅綠與正下方籌碼副圖同色、中間只隔 GAP=8，兩排連成一片
      svg.appendChild(sv("rect", {x: X(i) - bw / 2, y: vBase + vBody - h, width: bw,
        height: Math.max(1, h), fill: "var(--ink-2)", opacity: .45}));
    });
  }

  // ── 副圖：零軸置中，柱體只在文字帶下方
  panes.forEach((p, pi) => {
    const top = pTops[pi], body = PH - HEAD, base = top + HEAD, mid = base + body / 2;
    const m = Object.fromEntries(p.rows || []);
    const mx = Math.max(1, ...dates.map(d => Math.abs(m[d] ?? 0)));
    const last = [...dates].reverse().find(d => m[d] !== null && m[d] !== undefined);
    headText(top, p.name,
      last === undefined ? "—" : (p.fmt || (v => sgn(v, 0)))(m[last]),
      last === undefined ? "" : cls(m[last]));
    svg.appendChild(sv("line", {class: "zero", x1: PAD_L, y1: mid, x2: W, y2: mid}));
    dates.forEach((d, i) => {
      const v = m[d];
      if (v === null || v === undefined) return;
      const h = Math.abs(v) / mx * (body / 2 - 2);
      svg.appendChild(sv("rect", {x: X(i) - bw / 2, y: v >= 0 ? mid - h : mid,
        width: bw, height: Math.max(1, h),
        fill: `var(--${v >= 0 ? "up" : "down"})`}));
    });
  });

  // ── X 軸只畫一次
  dates.forEach((d, i) => {
    if (i % every !== 0 && i !== n - 1) return;
    let a = "middle", tx = X(i);
    if (i === 0) { a = "start"; tx = PAD_L; }
    else if (i === n - 1) { a = "end"; tx = W - 2; }
    const t = sv("text", {x: tx, y: H + 18, "text-anchor": a, "font-size": FS});
    t.textContent = d; svg.appendChild(t);
  });
  return svg;
}
/* 把 market.taiex_series 轉成 {MM/DD: row}，方便跟籌碼序列用同一組標籤對齊 */
function kmapByMMDD() {
  const out = {};
  ((D.market && D.market.taiex_series) || []).forEach(r => {
    out[r.date.slice(5).replace("-", "/")] = r;
  });
  return out;
}

function overlayBox(title, sub, panes) {
  const km = kmapByMMDD();
  const base = panes.find(p => (p.rows || []).length);
  if (!base) return null;
  const dates = base.rows.map(r => r[0]);
  const box = el("div", "chartrow");
  box.appendChild(el("div", "hd", `<span class="t">${esc(title)}</span>`));
  box.appendChild(overlayChart(dates, km, panes, {width: 1250}));
  if (sub) box.appendChild(el("div", "sub", sub));
  return box;
}

function taiexKBox() {

  return box;
}

function chartRow(title, rows, opt) {

      opt && opt.fmt ? opt.fmt(last) : sgn(last)}</span>`));

  return box;
}

function sortTable(cols, rows, opt = {}) {
  const box = el("div");
  const st = {key: opt.sortKey ?? null, dir: opt.dir || -1, page: 0,
              size: opt.size || 30, grouped: !!opt.group};
  const pager = el("div", "pager"), body = el("div");
  box.appendChild(pager); box.appendChild(body);

  function view() {
    if (st.grouped || st.key === null) {
      const g = {};
      rows.forEach(r => (g[r.g || "—"] = g[r.g || "—"] || []).push(r));
      const order = opt.groupOrder ? opt.groupOrder(g) : Object.keys(g);
      const out = [];
      order.forEach(k => {
        out.push({_grp: (opt.groupLabel ? opt.groupLabel(k, g[k]) : esc(k))});
        (opt.inGroupSort ? [...g[k]].sort(opt.inGroupSort) : g[k]).forEach(r => out.push(r.c));
      });
      return out;
    }
    const sorted = [...rows].sort((a, b) => {
      const x = a.v[st.key], y = b.v[st.key];
      if (x === y) return 0;
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      return (x > y ? 1 : -1) * st.dir;
    });
    return sorted.map(r => (opt.group
      ? [`<span class="gcode" title="${esc(r.g)}">${esc(r.g)}</span>`, ...r.c] : r.c));
  }

  function render() {
    const all = view();
    const flat = !st.grouped && st.key !== null;
    const useCols = (flat && opt.group) ? ["族群", ...cols] : cols;
    const useAl = (flat && opt.group) ? ["", ...(opt.aligns || [])] : (opt.aligns || []);
    const total = flat ? rows.length : all.filter(r => !r._grp).length;
    const size = st.size;
    let shown = all;
    if (size && flat) shown = all.slice(st.page * size, st.page * size + size);
    body.innerHTML = "";
    
    const t = table(useCols, shown, useAl, !flat, opt.widths);
    
    [...t.querySelectorAll("th")].forEach((th, i) => {
      const key = (flat && opt.group) ? i - 1 : i;
      if (key < 0 || !(opt.sortable || []).includes(key)) return;
      th.className = (th.className + " s").trim();
      if (st.key === key) th.insertAdjacentHTML("beforeend", `<span class="ar">${st.dir < 0 ? "▼" : "▲"}</span>`);
      th.onclick = () => {
        if (st.key === key) st.dir = -st.dir; else { st.key = key; st.dir = -1; }
        st.grouped = false; st.page = 0; render();
      };
    });
    body.appendChild(t);
    pager.innerHTML = "";
    if (opt.group) {
      // 原本按下去就 disabled，看起來像「開關不見了」。改成雙向切換。
      const b = el("button", st.grouped ? "on" : "", st.grouped ? "✓ 依族群分群" : "依族群分群");
      b.onclick = () => {
        if (st.grouped) { st.grouped = false; st.key = opt.sortKey ?? 0; }
        else { st.grouped = true; st.key = null; }
        st.page = 0; render();
      };
      pager.appendChild(b);
    }
    if (!flat) {
      // 分群模式也給每頁筆數選單，不然要先點欄位才看得到，很難找
      const sel0 = el("select");
      [[30, "每頁 30"], [60, "每頁 60"], [120, "每頁 120"], [0, "全部"]].forEach(([v, l]) => {
        const o = new Option(l, v); if (v === size) o.selected = true; sel0.appendChild(o);
      });
      sel0.onchange = () => { st.size = Number(sel0.value); st.page = 0; render(); };
      pager.appendChild(sel0);
    }
    if (flat) {
      const prev = el("button", "", "上一頁"), next = el("button", "", "下一頁");
      const pages = size ? Math.ceil(total / size) : 1;
      prev.disabled = st.page === 0; next.disabled = !size || st.page >= pages - 1;
      prev.onclick = () => { st.page--; render(); };
      next.onclick = () => { st.page++; render(); };
      pager.appendChild(prev); pager.appendChild(next);
      const from = size ? st.page * size + 1 : 1, to = size ? Math.min(total, (st.page + 1) * size) : total;
      pager.appendChild(el("span", "", `第 ${from}–${to} 筆，共 ${total} 筆`));
      const sel = el("select");
      [[30, "每頁 30"], [60, "每頁 60"], [120, "每頁 120"], [0, "全部"]].forEach(([v, l]) => {
        const o = new Option(l, v); if (v === size) o.selected = true; sel.appendChild(o);
      });
      sel.onchange = () => { st.size = Number(sel.value); st.page = 0; render(); };
      pager.appendChild(sel);
    } else {
      pager.appendChild(el("span", "", `共 ${total} 筆 · 點欄位標題可排序`));
    }
  }
  render();
  return box;
}

      holdBox.appendChild(el("div", "empty", "這檔基金沒有持股明細資料。"));

    holdBox.appendChild(el("div", "sub",
      `${hs.length} 檔成分股 · 權重合計 ${tot.toFixed(2)}% · 市值合計 ${nf(mvTot / 1e8, 2)} 億`,
      "margin-bottom:10px"));

      hs.map((r, i) => ({g: "", v: [i + 1, r.name, r.weight, r.lots, r.mv],
        c: [`<span class="num flat">${i + 1}</span>`, chip(r.name, r.code),

          `<span class="num flat">${nf(r.lots, 0)}</span>`,
          `<span class="num flat">${yi(r.mv)}</span>`]})),
      {sortable: [0, 2, 3, 4], sortKey: 2, dir: -1, size: 30,

  }
  renderHold("");
  // 兩張卡欄位都不多，並排比上下堆疊省空間；下面的「被最多 ETF 持有」留整排
  const erow = el("div", "splitrow");
  erow.appendChild(moveCard); erow.appendChild(holdCard);
  f.appendChild(erow);

  const cross = Object.entries(e.cross || {}).map(([code, v]) => ({code, ...v}))
    .sort((a, b) => b.held_by - a.held_by);
  f.appendChild(card("被最多主動式 ETF 持有的標的",
    `${list.length} 檔主動式 ETF · 共出現 ${cross.length} 檔成分股`,
    table(["個股", "持有檔數", "平均權重", "持有的基金"],
      cross.slice(0, 80).map(r => {
        const avg = r.by.reduce((s, x) => s + (x.weight || 0), 0) / (r.by.length || 1);
        return [chip(r.name, r.code), `<span class="num">${r.held_by}</span>`,
          `<span class="num flat">${avg.toFixed(2)}%</span>`,
          fundChips(r.by, r.code)];
      }), ["", "r", "r", ""], true, ["16%", "10%", "11%", "63%"]),
    "被越多主動式基金持有，代表經理人共識越集中。共識高不等於後續表現好——擁擠的交易也可能一起出場。"));
  return f;
}

/* 🟢 GEA 協同修改：轉強雷達嚴格分出月線上、月線下季線上、季線下、金融股，加入量能圖 */
function tabStrength() {
  const s = D.screen || {}, f = document.createDocumentFragment();
  const st = s.strength || {};
  
  // 置頂格局與條件
  const hd = el("div", "");
  hd.appendChild(el("div", "eyebrow", "轉強條件：站上 5 日線 且 站上 EMA9", "margin-bottom:8px;font-size:13px;"));
  hd.appendChild(el("div", "sub", `大盤格局：${st.regime || "—"}`, "margin-bottom:16px;color:var(--ink-2);"));
  
  const trows = (st.rows || []).map(r => {
    let grp = "未知";
    const isFin = r.sector && (r.sector.includes("金控") || r.sector.includes("銀行") || r.sector.includes("壽險") || r.sector.includes("證券") || r.sector.includes("票券"));
    
    // 三層分類邏輯
    if (isFin) {
        grp = "🏦 金融股";
    } else if (r.d20 > 0) {
        grp = "🟢 月線上";
    } else if (r.d20 <= 0 && r.d60 > 0) {
        grp = "🟡 月線下 季線上";
    } else {
        grp = "🔴 季線下";
    }
    
    return {
        g: grp, 
        v: [r.vol_icon, r.name, r.last, r.r1, r.d5, r.d20, r.turn ? 1 : 0],
        c: [
            `<span style="font-size:14px">${esc(r.vol_icon || "")}</span>`,
            chip(r.name, r.code), 
            `<span class="num flat">${nf(r.last, 2)}</span>`,
            `<span class="num ${cls(r.r1)}">${pc(r.r1)}</span>`,
            `<span class="num ${cls(r.d5)}">${pc(r.d5)}</span>`,
            `<span class="num ${cls(r.d20)}">${pc(r.d20)}</span>`,
            r.turn ? '<span class="up">●</span>' : '<span class="flat">·</span>'
        ]
    };
  });
  
  // 自訂群組排序：綠、黃、紅、金融
  const goMap = {"🟢 月線上":1, "🟡 月線下 季線上":2, "🔴 季線下":3, "🏦 金融股":4};
  
  // 金融股欄位少、檔數也不多，跟三個位階群擠在同一張長表裡左右都是空白。
  // 拆到右側單獨一塊，內部排兩欄，版面利用率好很多。
  const finRows = trows.filter(r => r.g === "🏦 金融股");
  const mainRows = trows.filter(r => r.g !== "🏦 金融股");

  const c = card("轉強雷達", `${mainRows.length} 檔（不含金融）`,
    sortTable(["量能", "個股", "價格", "當日", "5日", "20日", "轉強"], mainRows,
      {group: true, sortable: [2, 3, 4, 5], size: 30, aligns: ["c", "", "r", "r", "r", "r", "r"],
       groupOrder: gr => Object.keys(gr).sort((a, b) => (goMap[a] || 99) - (goMap[b] || 99)),
       groupLabel: (k, v) => `<span class="gcode" style="font-size:14px;">${esc(k)}</span><span class="num" style="font-weight:500;color:var(--ink-2)">${v.length} 檔</span>`,
       inGroupSort: (a, b) => (b.v[5] || 0) - (a.v[5] || 0)}),
    "雷達名單已嚴格依據長線位階分為三大區。點欄位標題可改成全體排序。");

  c.insertBefore(hd, c.querySelector("h3").nextSibling);

  if (finRows.length) {
    // 金融股一樣用 sortTable，欄位標題照樣可以點排序（上一版做成卡片格就不能排了）
    const fc = card("🏦 金融股", `${finRows.length} 檔`,
      sortTable(["量能", "個股", "價格", "當日", "5日", "20日", "轉強"],
        finRows.map(r => ({g: "", v: r.v, c: r.c})),
        {sortable: [2, 3, 4, 5], sortKey: 5, dir: -1, size: 30,
         aligns: ["c", "", "r", "r", "r", "r", "r"]}),
      "金融股走勢與電子／傳產脫鉤，混在同一張表裡排序會互相干擾，所以獨立出來。");
    const split = el("div", "splitrow");
    split.appendChild(c); split.appendChild(fc);
    f.appendChild(split);
    return f;
  }

  f.appendChild(c);
  return f;
}

function tabInstSummary() {
  const i = D.inst || {}, f = document.createDocumentFragment();
  const S = i.series?.inst || {};
  // 今日買賣超摘要 —— 排成像市場結構「四軌對照」那樣的一整排橫表，
  // 放在圖上方。擺右邊窄欄會把 K 棒擠小，而且四欄一定橫捲。
  // 照證交所「三大法人買賣金額統計表」的原始五列格式，最後一列合計。
  const todayRows = [];
  const sr = i.summary_rows || [];
  let tb = 0, ts = 0, tn = 0;
  sr.forEach(r => {
    tb += r.buy || 0; ts += r.sell || 0; tn += r.net || 0;
    todayRows.push([`<span class="name">${esc(r.name)}</span>`,
      `<span class="num">${nf(r.buy, 2)}</span>`,
      `<span class="num">${nf(r.sell, 2)}</span>`,
      `<span class="num ${cls(r.net)}">${sgn(r.net, 2)}</span>`]);
  });
  if (todayRows.length) {
    todayRows.push([`<span class="name" style="font-weight:800">合　計</span>`,
      `<span class="num" style="font-weight:800">${nf(tb, 2)}</span>`,
      `<span class="num" style="font-weight:800">${nf(ts, 2)}</span>`,
      `<span class="num ${cls(tn)}" style="font-weight:800">${sgn(tn, 2)}</span>`]);
    const amt = D.market?.taiex?.amt;
    const ratio = amt ? ((tb + ts) * 1e8 / (amt * 2)) : null;
    const c0 = card("三大法人買賣金額統計表",
      `資料日 ${i.summary_date || i.date || "—"} · 單位：億元`
      + (ratio ? ` · 法人成交比重 ${(ratio * 100).toFixed(2)}%` : ""),
      table(["單位名稱", "買進金額", "賣出金額", "買賣差額"], todayRows, ["", "r", "r", "r"]),
      "格式與證交所公布的統計表一致。買進與賣出是當日成交總額，買賣差額才是實際加減碼。");
    c0.classList.add("bigtable");
    f.appendChild(c0);
  }

  // 券商副圖式疊圖：K棒／成交金額／外資／投信／自營 共用同一條 X 軸，全寬顯示。
  const ov = overlayBox("大盤日 K ＋ 成交金額 ＋ 三大法人買賣超",
    "副圖單位億元，紅為買超、綠為賣超。",
    Object.entries(S).map(([who, rows]) =>
      ({name: who, rows: rows, fmt: v => sgn(v, 1) + " 億"})));
  if (ov) {
    const oc = card("大盤與法人同軸對照", null, null);
    oc.appendChild(ov);
    f.appendChild(oc);
  }
  return f;
}

/* 🟢 GEA 協同修改：外資投信買賣超與同買，新增「佔當日成交比」欄位 */
function tabInstTop() {
  const i = D.inst || {}, f = document.createDocumentFragment();

          `<span class="num ${cls(r.short_chg)}">${sgn(r.short_chg)}</span>`]})),
      {sortable: [1, 2, 3, 4], sortKey: 2, dir: -1, size: 30, aligns: ["", "r", "r", "r", "r"]})
      : el("div", "empty", "個股明細還沒進資料檔——重跑 build_web.py 即可。")));
  return f;
}

function tabOptions() {
  const o = D.options || {}, f = document.createDocumentFragment();
  const ROLE = {foreign: "外資", trust: "投信", dealer: "自營商"};
  const CN = {TX: "臺股期貨", MXF: "小型臺指", TMF: "微型臺指"};
  const S = o.series || {};

  const rows = [];
  Object.keys(CN).forEach(k => {
    const c = o.fut_inst?.[k]; if (!c) return;
    rows.push({_grp: esc(CN[k])});
    Object.keys(ROLE).forEach(r => {
      const net = c[r]?.net;
      const prev = (o.prev_all?.[k]?.[r] !== undefined) ? o.prev_all[k][r]
        : ((k === "TX" && o.prev?.fut) ? o.prev.fut[r] : undefined);
      rows.push([`<span class="name">${ROLE[r]}</span>`,
        `<span class="num ${cls(net)}">${sgn(net)}</span>`,
        prev === undefined ? '<span class="flat">—</span>' : `<span class="num ${cls(net - prev)}">${sgn(net - prev)}</span>`,
        `<span class="num flat">${nf(c[r]?.long)} / ${nf(c[r]?.short)}</span>`]);
    });
  });
  const futCard = card("三大法人期貨未平倉", `資料日 ${o.lock_date || "—"} · 增減對前一交易日 ${o.prev_date || "—"}`,
    table(["身分", "淨部位", "增減", "多 / 空"], rows, ["", "r", "r", "r"]));
  futCard.classList.add("bigtable");
  const cw = el("div");
  const hasSettle = (S.fut?.foreign || []).some(r => r[0] === SETTLE);
  cw.appendChild(el("div", "eyebrow", "臺股期貨逐日淨部位"
    + (hasSettle ? ` · 琥珀虛線＝本月結算日 ${SETTLE}` : ` · 本月結算日 ${SETTLE}，到期前會在圖上標出`)));
  
  const SA = o.series_all || {};
  // 全部柱狀圖共用同一條軸：N 一致 → 柱寬與槽距的比例一致。
  const SA_ALL = [];
  Object.values(SA).forEach(roles => Object.values(roles || {}).forEach(s => SA_ALL.push(s)));
  const AXIS = buildAxis(
    [S.fut?.foreign, S.opt?.["call.top10_all"], S.retail?.MXF, S.pcr?.oi],
    SA_ALL);
  Object.keys(CN).forEach(k => {
    const src = SA[k] || (k === "TX" ? S.fut : null);
    if (!src) return;
    cw.appendChild(el("div", "eyebrow", CN[k], ));
    ["foreign", "trust", "dealer"].forEach(r => {
      if (src[r]) cw.appendChild(chartRow(`${CN[k]} ${ROLE[r]}`, alignAxis(src[r], AXIS), {height: 100, width: 1200, fmt: v => nf(v, 0) + " 口", dense: true}));
    });
  });
  futCard.insertBefore(cw, futCard.querySelector("details") || null);
  f.appendChild(futCard);

  const or = [];
  ["call", "put"].forEach(side => {
    or.push({_grp: side === "call" ? "買權 CALL" : "賣權 PUT"});
    Object.keys(ROLE).forEach(r => {
      const v = o.opt_cp?.[side]?.[r], p = o.prev?.opt?.[side]?.[r];
      const ls = o.opt_cp?.[side]?._ls?.[r] || {};
      or.push([`<span class="name">${ROLE[r]}</span>`,
        `<span class="num up">${ls.long == null ? "—" : nf(ls.long)}</span>`,
        `<span class="num down">${ls.short == null ? "—" : nf(ls.short)}</span>`,
        `<span class="num ${cls(v)}">${sgn(v)}</span>`,
        p === undefined ? '<span class="flat">—</span>' : `<span class="num ${cls(v - p)}">${sgn(v - p)}</span>`]);
    });
    const lo = o.large_opt?.[side], lp = o.prev?.large_opt?.[side];
    if (lo) [["top10_all", "十大交易人"], ["top10_spec", "十大特定法人"]].forEach(([k, lab]) =>
      or.push([`<span class="name">${lab}</span>`,
        '<span class="flat">—</span>', '<span class="flat">—</span>',
        `<span class="num ${cls(lo[k])}">${sgn(lo[k])}</span>`,
        lp ? `<span class="num ${cls(lo[k] - lp[k])}">${sgn(lo[k] - lp[k])}</span>` : '<span class="flat">—</span>']));
  });
  const optCard = card("選擇權淨部位", "買權與賣權同頁對照，十條逐日走勢一次看完。",
    table(["身分", "多方口數", "空方口數", "淨部位", "增減"], or,
          ["", "r", "r", "r", "r"]));
  optCard.classList.add("bigtable");
  const og = el("div", "grid2");
  ["call", "put"].forEach(side => {
    const b = el("div");
    b.appendChild(el("div", "eyebrow", side === "call" ? "買權 CALL 逐日" : "賣權 PUT 逐日"));
    [["foreign", "外資"], ["trust", "投信"], ["dealer", "自營商"], ["top10_all", "十大交易人"], ["top10_spec", "十大特定法人"]]
      .forEach(([k, lab]) => { 
        const s = S.opt?.[`${side}.${k}`]; 
        if (s) b.appendChild(chartRow(lab, s, {height: 100, width: 1200, fmt: v => nf(v, 0) + " 口", dense: true})); 
      });
    og.appendChild(b);
  });
  optCard.insertBefore(og, optCard.querySelector("details") || null);
  f.appendChild(optCard);

  const lad = el("div", "grid2");
  ["week", "month"].forEach(k => {
    const s = o.support?.[k]; if (!s) return;
    const [contract, ladder, cmax, pmax] = s;
    const peak = Math.max(cmax || 0, pmax || 0) || 1;
    const box = el("div");
    box.appendChild(el("div", "eyebrow", (k === "week" ? "週選 " : "月選 ") + esc(contract)));
    ladder.forEach(([strike, call, put]) => {
      const row = el("div", "ladder");
      const l = el("div", "lb", `<i style="width:${(call / peak * 100).toFixed(1)}%"></i>` + (call ? `<b>${nf(call)}</b>` : ""));
      const r = el("div", "rb", `<i style="width:${(put / peak * 100).toFixed(1)}%"></i>` + (put ? `<b>${nf(put)}</b>` : ""));
      if (call === cmax && call) l.querySelector("i").classList.add("peak");
      if (put === pmax && put) r.querySelector("i").classList.add("peak");
      row.appendChild(l); row.appendChild(el("div", "strike", nf(strike))); row.appendChild(r);
      box.appendChild(row);
    });
    lad.appendChild(box);
  });
  f.appendChild(card("支撐與壓力", "左紅＝買權未平倉（上方壓力），右綠＝賣權未平倉（下方支撐）。琥珀外框是各自最大量。",
    lad, "未平倉最大的履約價常被視為多空攻防的關卡。這是籌碼分布的事實，不是價格預測。"));

  const rt = o.retail || {};
  const rc = card("散戶多空比", `資料日 ${rt.date || "—"}`, null,
    "以全市場未平倉減去三大法人部位推估散戶部位。正值代表散戶偏多，通常被當作反向參考。");
  const rbox = el("div");
  [["MXF", "小型臺指"], ["TMF", "微型臺指"]].forEach(([k, lab]) => {
    const cur = rt[k] ? rt[k][0] : null;
    rbox.appendChild(el("div", "hd", ""));
    const s = S.retail?.[k];
    if (s) rbox.appendChild(chartRow(`${lab} 現值 ${cur !== null ? cur.toFixed(2) + "%" : "—"}`, s,
      {height: 96, width: 1200, dense: true, fmt: v => v.toFixed(2) + "%"}));
    else rbox.appendChild(el("div", "empty", `${lab}：${cur !== null ? cur.toFixed(2) + "%" : "—"}（尚無逐日資料）`));
  });
  rc.insertBefore(rbox, rc.querySelector("details"));
  f.appendChild(rc);

  // P/C 比改吃已經對齊共同日期軸的序列，跟散戶多空比、買賣權同一條 X 軸。
  const pser = S.pcr || {};
  const pn = (pser.oi || []).filter(r => r[1] !== null).length;
  const pcCard = card("Put / Call 比", `${pn} 個交易日有值`, null,
    "未平倉比高代表賣權部位相對多，一般解讀為避險需求上升；長期偏高或偏低才有意義，單日跳動雜訊很大。前段留白是那幾天期交所還沒給資料，會隨每日累積補上。");
  const pbox = el("div");
  if ((pser.oi || []).length) {
    pbox.appendChild(chartRow("未平倉比 %", pser.oi,
      {height: 104, width: 1200, zero: false, mono: true, dense: true, fmt: v => v.toFixed(2) + "%"}));
    pbox.appendChild(chartRow("成交量比 %", pser.vol,
      {height: 104, width: 1200, zero: false, mono: true, dense: true, fmt: v => v.toFixed(2) + "%"}));
  } else {
    pbox.appendChild(el("div", "empty", "尚無 P/C 比資料。"));
  }
  pcCard.insertBefore(pbox, pcCard.querySelector("details"));
  f.appendChild(pcCard);
  return f;
}

function tabWave() {
  const w = D.wave || {}, f = document.createDocumentFragment();
  const A = w.anchor || {}, P = w.params || {};
  const br = (A.bench_ret ?? 0) * 100;
  const waveCls = t => (t || "").indexOf("第一波") === 0 ? "up" : (t === "落後" ? "down" : "flat");

  function waveTable(rows, label) {
    if (!rows || !rows.length) return el("div", "empty", "今日無資料。");
    const R = rows.map(r => ({
      g: r.wave,
      v: [r.wave, r.name, r.n, r.med, r.medpeakc, r.medpeak, r.excess, r.sleep, r.best, r.worst],
      c: [`<span class="num ${waveCls(r.wave)}" style="font-weight:800">${esc(r.wave)}</span>`,
          `<span class="gcode">${esc(r.name)}</span>`,
          `<span class="num flat">${r.n}</span>`,
          `<span class="num ${cls(r.med)}" style="font-size:16px;font-weight:800">${sgn(r.med, 2)}</span>`,
          `<span class="num ${cls(r.medpeakc)}">${sgn(r.medpeakc, 2)}</span>`,
          `<span class="num flat">${sgn(r.medpeak, 2)}</span>`,
          `<span class="num ${cls(r.excess)}" style="font-weight:700">${sgn(r.excess, 2)}</span>`,
          `<span class="num">${r.sleep} / ${r.climb} / ${r.fail}</span>`,
          esc(r.best), esc(r.worst)],
    }));
    return sortTable(["波次", label, "檔數", "中位漲幅%", "中位收高%", "中位盤高%", "超額%", "睡/墊/退", "最強", "最弱"],
      R, {sortable: [2, 3, 4, 5, 6], sortKey: 3, dir: -1, size: 0,
          aligns: ["", "", "r", "r", "r", "r", "r", "c", "", ""]});
  }

  const sub0 = `${A.real || A.date || "—"} 收盤 → ${A.asof || "—"} 收盤`
    + (A.intraday ? "〔今天還沒收盤，數字還會動〕" : "")
    + ` · 大盤 ${sgn(br, 2)}% · 產業鏈標的 ${w.n_stock || 0} 檔`
    + ` · 位階帶 ±${P.band ?? 15}% · 不足 ${P.minn ?? 3} 檔的族群不列`
    + (w.note ? ` · ${w.note}` : "");

  const HELP = `波次是<b>相對大盤</b>切出來的：贏過大盤的依中位漲幅切三分位＝第一波(領漲)／第二波／第三波，輸給大盤的一律「落後」。
    「睡/墊/退」是族群內三種型態的檔數 —— <b>沉睡未動</b>（期間最高沒攻過 ${P.peak ?? 10}%，資金還沒發現）／
    <b>緩步墊高</b>（攻上去沒吐回來，資金穩穩進駐）／<b>攻後敗退</b>（攻過又吐回 ≥${P.giveback ?? 10}pp，資金試過沒續航）。
    同樣的中位漲幅，睡的多與退的多意義完全相反。
    <b>中位收高%</b>是收盤最高（站上去過的），<b>中位盤高%</b>是盤中最高（含上影線、衝到過的）。
    型態一律用收盤版判定 —— 資金有沒有真的進駐看的是收盤守不守得住，
    盤中插一根上影線恰恰是沒守住。
    中位數用的是整個族群，一兩檔特別強不會把族群拉上去；<b>不足 ${P.minn ?? 3} 檔的族群不列</b>，
    避免「族群中位數」實質變成單一個股的數字。
    這是量化統計結果，描述的是已經發生的價格變化，不是個股買賣建議。`;

  if (w.missing && w.missing.length) {
    f.appendChild(card("今天有 " + w.missing.length + " 檔抓不到",
      "這幾檔已被剔除，下面的族群中位數是「少了它們」算出來的：" + w.missing.join("、")
      + "。代號查不到通常是資料源那邊出問題，不是它們下市。", null, null));
  }
  f.appendChild(card("大類波次", sub0, waveTable(w.big, "大類"), HELP));
  f.appendChild(card("題材波次", "跨族群的資金主題。一檔可以同時屬於多個題材，所以各表檔數會重複計。",
    waveTable(w.theme, "題材"), null));
  f.appendChild(card("細類波次", "大類底下的分層。上下游刻意切開 —— 有採購關係就有時間差，混在一起會把要偵測的輪動自己抹平。",
    waveTable(w.sub, "細類"), null));
  return f;
}

function tabWaveStocks() {
  const w = D.wave || {}, S = w.stocks || [], P = w.params || {}, A = w.anchor || {};
  const f = document.createDocumentFragment();
  const T = {"沉睡未動": "up", "緩步墊高": "flat", "攻後敗退": "down"};

  function stockTable(list, size) {
    const R = list.map(r => ({
      g: r.type,
      v: [r.type, r.name, r.ret, r.peakc, r.gbc, r.peak, r.excess, r.big],
      c: [`<span class="num ${T[r.type] || "flat"}" style="font-weight:800">${esc(r.type)}</span>`,
          chip(r.name, r.code, "tw") + (r.dream ? ' <span title="股價驅動≠營收驅動，本業是' + esc(r.core) + '">💭</span>' : ""),
          `<span class="num ${cls(r.ret)}" style="font-size:16px;font-weight:800">${sgn(r.ret, 2)}</span>`,
          `<span class="num ${cls(r.peakc)}">${sgn(r.peakc, 2)}</span>`,
          `<span class="num ${r.gbc >= (P.giveback ?? 10) ? "down" : "flat"}">${nf(r.gbc, 2)}</span>`,
          `<span class="num flat">${sgn(r.peak, 2)}</span>`,
          `<span class="num ${cls(r.excess)}">${sgn(r.excess, 2)}</span>`,
          `<span class="gcode">${esc(r.big)}</span>`],
    }));
    return sortTable(["型態", "個股", "漲幅%", "收高%", "收回吐pp", "盤高%", "超額%", "大類"],
      R, {sortable: [2, 3, 4, 5, 6], sortKey: 2, dir: -1, size: size,
          aligns: ["", "", "r", "r", "r", "r", "r", ""]});
  }

  const cand = S.filter(r => r.hot && r.inband).sort((a, b) => a.ret - b.ret);
  const nd = cand.filter(r => r.dream).length;
  f.appendChild(card(`布局候選 ${cand.length} 檔`,
    `族群有動、自己還停在轉折日 ±${P.band ?? 15}% 位階帶內`
    + `　·　${A.real || "—"} 收盤 → ${A.asof || "—"} 收盤`
    + (A.intraday ? "〔今天還沒收盤〕" : "")
    + (nd ? `　·　💭 ${nd} 檔股價驅動≠營收驅動` : ""),
    cand.length ? stockTable(cand, 0) : el("div", "empty", "今天沒有符合的個股。"),
    `<b>沉睡未動</b>＝收盤最高沒攻過 ${P.peak ?? 10}%，資金還沒發現，最接近「在還沒漲之前介入」。
     <b>緩步墊高</b>＝攻上去收盤守住了。<b>攻後敗退</b>＝收盤攻過又吐回 ≥${P.giveback ?? 10}pp，資金試過沒續航。
     「收回吐」是收盤最高減現在漲幅（型態用這個判），「盤高%」含上影線只供參考。
     💭 是本業族群與大類不同的股票，夢沒兌現時 PE 會修正回本業族群的倍數。
     <b>這一頁只在你自己電腦上的完整版，不會上線。</b>`));

  f.appendChild(card(`全部 ${S.length} 檔位階`, "依自轉折日漲幅排序，點欄位標題可改排序。",
    stockTable(S, 30), null));
  return f;
}

// 🟢 GEA 協同修改：依要求分流為 11 個獨立頁籤與順序
const TABS = [
  ["市場結構", tabMarket, "market"],
  ["成交金額", tabVolume, "screen"],
  ["主動 ETF", tabEtf, "etf"],
  ["族群輪動雷達", tabWave, "wave"],
  ["轉強雷達", tabStrength, "screen"],
  ["高點回檔", tabDrawdown, "screen"],
  ["綜合評分", tabScore, "screen"],
  ["三大法人買賣超", tabInstSummary, "inst"],
  ["外資投信買賣超", tabInstTop, "inst"],
  ["外資投信同買", tabInstCo, "inst"],
  ["信用交易", tabMargin, "market"],
  ["期權籌碼", tabOptions, "options"],
];

// 個股位階只存在於 _private/index_full.html（本機完整版）。
// 線上的 web_data.json 沒有 wave.stocks，這個頁籤就不會被建出來。
if (D.wave && D.wave.stocks && D.wave.stocks.length) {
  TABS.splice(TABS.findIndex(t => t[1] === tabWave) + 1, 0,
              ["個股位階", tabWaveStocks, "wave"]);
}

const nav = document.getElementById("tabs"), main = document.getElementById("main"), panels = [];
TABS.forEach(([label, fn, key], i) => {
  const b = el("button", "", esc(label));
  b.setAttribute("role", "tab");
  b.setAttribute("aria-selected", i === 0 ? "true" : "false");
  const p = el("section", "panel");
  p.hidden = i !== 0;
  if (D.meta.status?.[key] !== "ok") {
    // 🟢 GEA 2026-08-20（G-1b）：market 因資料日退化被標 stale 時，講明白是哪一天對不上，
    // 不要用「今天沒有取得資料」這種看不出差別的說法。
    const stale = key === "market" && FRESH && FRESH.stale;
    p.appendChild(card(stale ? "這一區的資料不是今天的" : "資料更新中",
      stale ? `${FRESH.reason}。寧可不畫，也不要拿舊資料當今天的盤面。其餘分頁不受影響。`
            : `這一區今天沒有取得資料（狀態：${D.meta.status?.[key] || "未產出"}）。其餘分頁不受影響。`,
      null));
  } else {
    try { p.appendChild(fn()); }
    catch (err) { p.appendChild(card("這一區沒有畫出來", String(err), null)); }
  }
  b.onclick = () => {
    nav.querySelectorAll("button").forEach(x => x.setAttribute("aria-selected", "false"));
    b.setAttribute("aria-selected", "true");
    panels.forEach(x => x.hidden = true);
    p.hidden = false;
  };
  nav.appendChild(b); main.appendChild(p); panels.push(p);
});

// 點左上角圖示回首頁：切回第一個頁籤並捲到最上。
// 參考的那幾個站都沒有這個，點了 logo 沒反應會讓人以為卡住。
document.getElementById("home-btn").onclick = () => {
  const first = nav.querySelector("button");
  if (first) first.click();
  window.scrollTo({top: 0, behavior: "smooth"});
};
</script>
