<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>觀市 MarketWatch</title>
<meta name="description" content="台股盤面結構、期權籌碼、法人與信用交易的每日整理。">
<style>
/* ══ 色票 ═══════════════════════════════════════════════════════
   紅漲綠跌是台股慣例，不是配色偏好。
   琥珀只出現在三處：標誌、結構軸零線、作用中的頁籤。 */
:root{
  --up:#E5484D; --down:#12A366; --acc:#D9A441;
  --r:12px; --w:1320px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
[data-theme="dark"]{
  --bg:#0C1117; --surface:#151C25; --raise:#1E2733; --chip:#26313F;
  --ink-1:#EDF2F7; --ink-2:#A8B4C2; --ink-3:#7C8896; --line:#26303C;
  --barbg:#222C38;
}
[data-theme="light"]{
  --bg:#F4F6F4; --surface:#FFFFFF; --raise:#EDF0EE; --chip:#E4E9E6;
  --ink-1:#0F161D; --ink-2:#44515E; --ink-3:#68757F; --line:#DDE3E0;
  --barbg:#E7ECE9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink-1); font-family:var(--sans);
  font-size:16px; line-height:1.6; letter-spacing:.005em; font-weight:450;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--w); margin:0 auto; padding:0 20px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.015em; font-weight:500}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-2)}
.eyebrow{font-size:11.5px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-3)}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px; border-radius:5px}

/* ══ 標誌 ══
   圓＝市場，橫軸＝重力平衡軸，軸上的實心點＝偏離的重心，
   上下兩道對稱弧＝張力上下界。整個標誌就是策略本身的側寫。 */
.mark{width:30px; height:30px; flex:0 0 auto; color:var(--acc)}

/* ══ 頁首 ══ */
header{border-bottom:1px solid var(--line); background:var(--surface)}
.hbar{display:flex; align-items:center; gap:14px; padding:16px 0 15px; flex-wrap:wrap}
.brandbox{display:flex; align-items:center; gap:11px}
.bname{font-size:21px; font-weight:800; letter-spacing:.14em; line-height:1.1}
.bsub{font-size:10.5px; font-weight:700; letter-spacing:.34em; color:var(--ink-3); text-transform:uppercase}
.stamp{font-size:13.5px; color:var(--ink-2)}
.stamp b{font-family:var(--mono); color:var(--ink-1); font-weight:600}
.spacer{flex:1}
button.theme{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--raise); color:var(--ink-1); border:1px solid var(--line);
  border-radius:999px; padding:7px 15px; font:inherit; font-size:13.5px;
  font-weight:600; cursor:pointer;
}
button.theme:hover{border-color:var(--acc)}
button.theme svg{width:15px; height:15px}

/* ══ 結構軸 ══ */
.axis{padding:24px 0 10px}
.axis-head{display:flex; align-items:baseline; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.axis-note{font-size:14px; color:var(--ink-2)}
.track{display:grid; grid-template-columns:88px 1fr 110px; align-items:center; gap:14px; padding:8px 0}
.track .who{font-size:14.5px; color:var(--ink-1); font-weight:700}
.rail{position:relative; height:26px; background:var(--barbg); border-radius:6px; overflow:hidden}
.rail::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:1.5px; background:var(--acc); opacity:.75}
.fill{position:absolute; top:5px; bottom:5px; border-radius:3px}
.track .val{text-align:right; font-size:16px; font-weight:700}
.track .val .s{font-size:12px; color:var(--ink-3); font-weight:500}
.axis-scale{display:flex; justify-content:space-between; font-size:15px; font-weight:700;
  color:var(--ink-2); font-family:var(--mono); padding:9px 124px 0 102px}

/* ══ 數字磚 ══ */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; margin:20px 0 4px}
.tile{background:var(--surface); padding:15px 17px 16px}
.tile .k{font-size:12px; color:var(--ink-2); letter-spacing:.05em; margin-bottom:6px; font-weight:600}
.tile .v{font-size:25px; font-weight:800; line-height:1.15}
.tile .s{font-size:13px; color:var(--ink-2); margin-top:4px}

/* ══ 頁籤 ══ */
nav.tabs{display:flex; gap:3px; overflow-x:auto; margin:26px 0 0;
  border-bottom:1px solid var(--line); scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none; border:0; border-bottom:2.5px solid transparent;
  color:var(--ink-2); font:inherit; font-size:15px; font-weight:700; padding:12px 17px;
  cursor:pointer; white-space:nowrap}
nav.tabs button:hover{color:var(--ink-1)}
nav.tabs button[aria-selected="true"]{color:var(--ink-1); border-bottom-color:var(--acc)}

/* ══ 卡片 ══ */
main{padding:24px 0 48px}
.panel[hidden]{display:none}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 19px 20px; margin-bottom:18px}
.card>h3{margin:0 0 4px; font-size:17px; font-weight:800; letter-spacing:.02em}
.card .sub{font-size:13.5px; color:var(--ink-2); margin-bottom:14px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(400px,1fr)); gap:18px; align-items:start}
.grid2>.card{margin-bottom:0}

table{width:100%; border-collapse:collapse; font-size:14.5px}
/* 只限制名稱本身的寬度，不動整張表的版面演算法。
   （上一版用 table-layout:fixed ＋ width:1% 去壓右側欄，結果所有分頁的
     表格欄寬全被硬套、擠成一團——欄寬問題要在儲存格解，不要動整表。） */
td .name{display:inline-block; max-width:9.5em; overflow:hidden; text-overflow:ellipsis;
  vertical-align:bottom; white-space:nowrap}
td .sect{display:inline-block; max-width:12em; overflow:hidden; text-overflow:ellipsis;
  vertical-align:bottom; white-space:nowrap}
.grp td{white-space:normal}
th{text-align:left; font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-2); padding:0 9px 8px 0; border-bottom:1.5px solid var(--line); white-space:nowrap}
td{padding:7px 9px 7px 0; border-bottom:1px solid var(--line); white-space:nowrap}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.name{font-weight:700}
.code{font-family:var(--mono); font-size:12px; background:var(--chip); color:var(--ink-2);
  border-radius:4px; padding:1px 5px; margin-left:6px; font-weight:600}
.sect{color:var(--ink-2); font-size:13px}
.scroll{max-height:520px; overflow:auto}
.scroll thead th{position:sticky; top:0; background:var(--surface); z-index:1}
.grp td{background:var(--raise); font-weight:800; font-size:14px; letter-spacing:.04em;
  color:var(--acc); border-left:3px solid var(--acc)}
.gcode{display:inline-block; max-width:11em; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; vertical-align:bottom;
  font-size:12px; background:transparent; color:var(--acc); border:1px solid var(--acc);
  border-radius:4px; padding:1px 6px; margin-right:7px; font-weight:700; letter-spacing:.02em}
.grp .gcode{max-width:none}                     /* 分群標題那列給它整行，不必截斷 */
th.s{cursor:pointer; user-select:none} th.s:hover{color:var(--acc)}
th.s .ar{color:var(--acc); font-size:10px; margin-left:3px}
.pager{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:2px 0 12px;
  font-size:13.5px; color:var(--ink-2)}
.pager button{background:var(--raise); color:var(--ink-1); border:1px solid var(--line);
  border-radius:7px; padding:5px 12px; font:inherit; font-size:13.5px; font-weight:700; cursor:pointer}
.pager button:disabled{opacity:.4; cursor:default}
.pager button:not(:disabled):hover{border-color:var(--acc)}
.pager select{padding:5px 9px; font-size:13.5px}

/* ══ 圖表 ══ */
.chart{width:100%; display:block; overflow:visible}
.chart .zero{stroke:var(--ink-3); stroke-width:1; opacity:.55}
.chart .settle{stroke:var(--acc); stroke-width:1; stroke-dasharray:3 3; opacity:.8}
.chart text{font-family:var(--mono); fill:var(--ink-2); font-size:15px; font-weight:600}
.chart .lbl{fill:var(--ink-2); font-size:15px; font-weight:600}
.chartrow{margin:6px 0 16px}
.chartrow .hd{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px}
.chartrow .hd .t{font-size:15px; font-weight:700}
.chartrow .hd .v{font-size:19px; font-weight:800}

/* ══ 支撐壓力 ══ */
.ladder{display:grid; grid-template-columns:1fr 92px 1fr; align-items:center; gap:10px; padding:1px 0}
.ladder .strike{text-align:center; font-family:var(--mono); font-size:13.5px; color:var(--ink-1);
  font-variant-numeric:tabular-nums; font-weight:600}
.ladder .lb,.ladder .rb{height:19px; position:relative; background:var(--barbg); border-radius:3px}
.ladder i{position:absolute; top:0; bottom:0; border-radius:3px; display:block}
.ladder .lb i{right:0; background:var(--up)} .ladder .rb i{left:0; background:var(--down)}
.ladder b{position:absolute; top:0; font-size:11.5px; font-family:var(--mono); line-height:19px;
  font-weight:700; color:var(--ink-1); padding:0 6px}      /* 數字放在柱子外側，不會被柱子吃掉 */
.ladder .lb b{left:0} .ladder .rb b{right:0}
.ladder .peak{box-shadow:0 0 0 1.5px var(--acc)}

/* ══ 說明摺疊：做成看得出來可以點的按鈕 ══ */
details{margin-top:14px}
summary{cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:7px;
  font-size:13.5px; font-weight:700; color:var(--ink-1); background:var(--raise);
  border:1px solid var(--line); border-radius:999px; padding:6px 14px}
summary::-webkit-details-marker{display:none}
summary:hover{border-color:var(--acc)}
summary .chev{width:13px; height:13px; transition:transform .18s}
details[open] summary .chev{transform:rotate(90deg)}
details .body{font-size:14px; color:var(--ink-2); padding:11px 2px 2px; line-height:1.7}

select{background:var(--raise); color:var(--ink-1); border:1px solid var(--line);
  border-radius:8px; padding:8px 12px; font:inherit; font-size:14.5px; font-weight:600;
  cursor:pointer; max-width:100%}
select:hover{border-color:var(--acc)}
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:9px; overflow:hidden; margin:14px 0}
.kv>div{background:var(--surface); padding:11px 13px}
.kv .k{font-size:11.5px; color:var(--ink-2); font-weight:600; margin-bottom:3px}
.kv .v{font-size:23px; font-weight:800}

.empty{color:var(--ink-2); font-size:14.5px; padding:6px 0}

footer{border-top:1px solid var(--line); background:var(--surface);
  font-size:13px; color:var(--ink-2); padding:20px 0 32px}
footer p{margin:4px 0}

@media (max-width:680px){
  body{font-size:15.5px}
  .track{grid-template-columns:66px 1fr 92px; gap:9px}
  .axis-scale{padding:7px 106px 0 78px}
  .tile .v{font-size:21px}
  .card{padding:15px 14px 17px}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .fill{transition:width .4s ease,left .4s ease} }
</style>
</head>

const nf = (n, d = 0) => (n === null || n === undefined || Number.isNaN(n)) ? "—"
  : Number(n).toLocaleString("zh-TW", {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (n, d = 0) => (n === null || n === undefined) ? "—" : (n > 0 ? "+" : "") + nf(n, d);
const pc = (x, d = 2) => (x === null || x === undefined) ? "—" : (x > 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
const cls = n => n > 0 ? "up" : (n < 0 ? "down" : "flat");
const yi = v => (v === null || v === undefined) ? "—" : nf(v / 1e8, 0) + " 億";
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[m]));
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const sv = (t, a) => { const e = document.createElementNS(SVGNS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const chip = (name, code, mkt) =>
  `<span class="name">${esc(name)}</span><span class="code">${esc(code)}</span>` + (mkt === "櫃" ? '<span class="code">櫃</span>' : "");

/* 台指期月結算＝當月第三個星期三。柱狀圖用它畫分界虛線。 */
function settleDay(y, m) {
  let d = new Date(y, m - 1, 1), c = 0;
  while (true) { if (d.getDay() === 3) { c++; if (c === 3) break; } d.setDate(d.getDate() + 1); }
  return `${String(m).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
}
const SETTLE = (() => { const n = new Date(); return settleDay(n.getFullYear(), n.getMonth() + 1); })();

/* ══ 柱狀圖 ══
   rows = [[label, value], ...]；零軸置中、正紅負綠、每根柱下面都有日期。 */
function barChart(rows, opt = {}) {
  /* viewBox 寬度固定 1200、等比縮放（preserveAspectRatio 用預設值）。
     先前設成 "none" 會把 SVG 橫向拉滿容器，文字跟著被拉扁——日期看起來
     又寬又矮就是這個原因。 */
  const H = opt.height || 130, W = 1200, LBL = 24;
  const n = rows.length || 1;
  const vals = rows.map(r => r[1]).filter(v => v !== null && v !== undefined);
  const mx = Math.max(1e-9, ...vals.map(Math.abs));
  const svg = sv("svg", {class: "chart", viewBox: `0 0 ${W} ${H + LBL}`, role: "img"});
  const mid = opt.zero === false ? H - 8 : H / 2;
  const bw = Math.max(2, Math.min(26, (W / n) * 0.6));
  const scale = v => (opt.zero === false ? (v / mx) * (H - 20) : (v / mx) * (H / 2 - 8));
  svg.appendChild(sv("line", {class: "zero", x1: 0, y1: mid, x2: W, y2: mid}));
  const every = n <= 22 ? 1 : Math.ceil(n / 18);
  rows.forEach((r, i) => {
    const [lab, v] = r;
    const x = (i + 0.5) * (W / n);
    if (lab === SETTLE) svg.appendChild(sv("line", {class: "settle", x1: x, y1: 0, x2: x, y2: H}));
    if (v === null || v === undefined) return;
    const h = Math.abs(scale(v));
    const rect = sv("rect", {x: x - bw / 2, y: v >= 0 ? mid - h : mid, width: bw,
      height: Math.max(1.5, h), rx: 1.5,
      fill: `var(--${opt.mono ? "acc" : (v >= 0 ? "up" : "down")})`});
    const ti = sv("title"); ti.textContent = `${lab}　${opt.fmt ? opt.fmt(v) : nf(v)}`;
    rect.appendChild(ti); svg.appendChild(rect);
    if (i % every === 0 || i === n - 1) {
      const t = sv("text", {x, y: H + 16, "text-anchor": "middle"});
      t.textContent = lab; svg.appendChild(t);
    }
  });
  return svg;
}
function chartRow(title, rows, opt) {
  const box = el("div", "chartrow");
  const last = rows.length ? rows[rows.length - 1][1] : null;
  box.appendChild(el("div", "hd",
    `<span class="t">${esc(title)}</span><span class="v num ${opt && opt.mono ? "" : cls(last)}">${
      opt && opt.fmt ? opt.fmt(last) : sgn(last)}</span>`));
  box.appendChild(barChart(rows, opt));
  return box;
}

function card(title, sub, node, help) {

function table(cols, rows, aligns, scroll) {
  const box = el("div", scroll ? "scroll" : "");
  const t = el("table"), thead = el("thead"), tr = el("tr");
  cols.forEach((c, i) => tr.appendChild(el("th", aligns && aligns[i] === "r" ? "r" : "", esc(c))));
  thead.appendChild(tr); t.appendChild(thead);
  const tb = el("tbody");
  rows.forEach(r => {
    const x = el("tr");
    if (r._grp) { x.className = "grp"; const td = el("td"); td.colSpan = cols.length; td.innerHTML = r._grp; x.appendChild(td); }
    else r.forEach((cell, i) => { const td = el("td", aligns && aligns[i] === "r" ? "r" : ""); td.innerHTML = cell; x.appendChild(td); });
    tb.appendChild(x);
  });
  t.appendChild(tb); box.appendChild(t);
  return box;
}
/* ══ 可排序 ＋ 分頁表格 ══
   rows = [{c:[儲存格 html…], v:[排序值…], g:"族群"}]
   點欄位標題＝切成平表排序（族群變成一欄），按「依族群」回到分群。 */
function sortTable(cols, rows, opt = {}) {
  const box = el("div");
  const st = {key: opt.sortKey ?? null, dir: opt.dir || -1, page: 0,
              size: opt.size || 30, grouped: !!opt.group};
  // 控制列放在表格「上方」：按了排序之後不必捲到最底下才找得到按鈕。
  const pager = el("div", "pager"), body = el("div");
  box.appendChild(pager); box.appendChild(body);

  function view() {
    if (st.grouped || st.key === null) {
      const g = {};
      rows.forEach(r => (g[r.g || "—"] = g[r.g || "—"] || []).push(r));
      const order = opt.groupOrder ? opt.groupOrder(g) : Object.keys(g);
      const out = [];
      order.forEach(k => {
        out.push({_grp: (opt.groupLabel ? opt.groupLabel(k, g[k]) : esc(k))});
        (opt.inGroupSort ? [...g[k]].sort(opt.inGroupSort) : g[k]).forEach(r => out.push(r.c));
      });
      return out;
    }
    const sorted = [...rows].sort((a, b) => {
      const x = a.v[st.key], y = b.v[st.key];
      if (x === y) return 0;
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      return (x > y ? 1 : -1) * st.dir;
    });
    return sorted.map(r => (opt.group
      ? [`<span class="gcode" title="${esc(r.g)}">${esc(r.g)}</span>`, ...r.c] : r.c));
  }

  function render() {
    const all = view();
    const flat = !st.grouped && st.key !== null;
    const useCols = (flat && opt.group) ? ["族群", ...cols] : cols;
    const useAl = (flat && opt.group) ? ["", ...(opt.aligns || [])] : (opt.aligns || []);
    const total = flat ? rows.length : all.filter(r => !r._grp).length;
    const size = st.size;
    let shown = all;
    if (size && flat) shown = all.slice(st.page * size, st.page * size + size);
    body.innerHTML = "";
    const t = table(useCols, shown, useAl, !flat);
    // 標題列掛排序
    [...t.querySelectorAll("th")].forEach((th, i) => {
      const key = (flat && opt.group) ? i - 1 : i;
      if (key < 0 || !(opt.sortable || []).includes(key)) return;
      th.className = (th.className + " s").trim();
      if (st.key === key) th.insertAdjacentHTML("beforeend", `<span class="ar">${st.dir < 0 ? "▼" : "▲"}</span>`);
      th.onclick = () => {
        if (st.key === key) st.dir = -st.dir; else { st.key = key; st.dir = -1; }
        st.grouped = false; st.page = 0; render();
      };
    });
    body.appendChild(t);
    pager.innerHTML = "";
    if (opt.group) {
      const b = el("button", "", st.grouped ? "已依族群分群" : "依族群分群");
      b.disabled = st.grouped;
      b.onclick = () => { st.grouped = true; st.key = null; st.page = 0; render(); };
      pager.appendChild(b);
    }
    if (flat) {
      const prev = el("button", "", "上一頁"), next = el("button", "", "下一頁");
      const pages = size ? Math.ceil(total / size) : 1;
      prev.disabled = st.page === 0; next.disabled = !size || st.page >= pages - 1;
      prev.onclick = () => { st.page--; render(); };
      next.onclick = () => { st.page++; render(); };
      pager.appendChild(prev); pager.appendChild(next);
      const from = size ? st.page * size + 1 : 1, to = size ? Math.min(total, (st.page + 1) * size) : total;
      pager.appendChild(el("span", "", `第 ${from}–${to} 筆，共 ${total} 筆`));
      const sel = el("select");
      [[30, "每頁 30"], [60, "每頁 60"], [120, "每頁 120"], [0, "全部"]].forEach(([v, l]) => {
        const o = new Option(l, v); if (v === size) o.selected = true; sel.appendChild(o);
      });
      sel.onchange = () => { st.size = Number(sel.value); st.page = 0; render(); };
      pager.appendChild(sel);
    } else {
      pager.appendChild(el("span", "", `共 ${total} 筆　·　點欄位標題可排序`));
    }
  }
  render();
  return box;
}

const STATS = D.screen?.stats || {}, UNI = D.screen?.universe || {};
function bySector() {                       // 產業 → [{code,name,...stats}]，全部保留
  const out = {};
  Object.entries(UNI).forEach(([code, u]) => {
    const st = STATS[code]; if (!st) return;
    (out[u.sector] = out[u.sector] || []).push({code, name: u.name, ...st});
  });
  return out;
}

/* ══ 1. 市場結構 ══ */
function tabMarket() {
  const m = D.market || {}, f = document.createDocumentFragment();
  const row = (label, o, extra) => [
    `<span class="name">${esc(label)}</span>`,
    `<span class="num ${cls(o?.r1)}">${pc(o?.r1)}</span>`,
    `<span class="num">${esc(extra.price)}</span>`,
    extra.contrib,
    `<span class="num ${cls(o?.dd_52w)}">${pc(o?.dd_52w)}</span>`,
    `<span class="num ${cls(o?.dsma?.["20"])}">${pc(o?.dsma?.["20"])}</span>`,
    `<span class="num ${cls(o?.dema?.["23"])}">${pc(o?.dema?.["23"])}</span>`,
  ];
  const WW = D.screen?.weights || {}, IPC = D.screen?.index_prev_close;
  const tsmcW = WW["2330"];
  const tsmcC = (tsmcW && IPC && m.tsmc?.r1 !== undefined) ? IPC * tsmcW * m.tsmc.r1
    : m.tsmc?.contribution_pt;
  f.appendChild(card("三軌對照",
    "加權指數是市值加權，市場體感是追蹤名單的中位數——兩者背離就是權值撐盤。",
    table(["", "當日", "價位", "指數貢獻", "距52週高", "距月線", "距 EMA23"], [
      row("加權指數", m.taiex, {price: nf(m.taiex?.last, 2), contrib: `<span class="num ${cls(m.taiex?.chg_pt)}">${sgn(m.taiex?.chg_pt, 2)} 點</span>`}),
      row("台積電", m.tsmc, {price: nf(m.tsmc?.last, 0) + " 元", contrib: `<span class="num ${cls(tsmcC)}">${sgn(tsmcC, 1)} 點</span>`}),
      row("市場體感", {r1: m.feel?.r1, dd_52w: m.feel?.dd, dsma: {20: m.feel?.d20}, dema: {23: m.feel?.e23}},
        {price: "中位數", contrib: `<span class="flat">—</span>`}),
      ...(m.otc ? [row("櫃買指數", m.otc,
        {price: nf(m.otc.last, 2), contrib: `<span class="num ${cls(m.otc.chg_pt)}">${sgn(m.otc.chg_pt, 2)} 點</span>`})] : []),
    ], ["", "r", "r", "r", "r", "r", "r"]),
    `台積電權重約 ${((m.tsmc?.weight || 0) * 100).toFixed(0)}%。指數漲但體感沒漲，代表漲勢集中在少數權值股；反過來就是中小型股在補漲。`));

  /* 市場廣度：多條均線，最長到年線 */
  const MAS = [["sma", 5, "5日線"], ["ema", 9, "EMA9"], ["sma", 20, "月線 SMA20"], ["ema", 23, "EMA23"],
    ["sma", 60, "季線 SMA60"], ["ema", 60, "EMA60"], ["ema", 97, "EMA97"], ["ema", 113, "EMA113"],
    ["sma", 120, "半年線 SMA120"], ["sma", 240, "年線 SMA240"]];
  const codes = Object.keys(STATS).filter(c => UNI[c]);
  const brows = MAS.map(([kind, n, label]) => {
    let above = 0, tot = 0;
    codes.forEach(c => {
      const v = STATS[c][kind === "sma" ? "dsma" : "dema"]?.[n];
      if (v === undefined || v === null) return;
      tot++; if (v >= 0) above++;
    });
    const p = tot ? above / tot : 0;
    return [`<span class="name">${esc(label)}</span>`,
      `<span class="num">${above}</span>`, `<span class="num flat">${tot}</span>`,
      `<span class="num ${p >= 0.5 ? "up" : "down"}">${(p * 100).toFixed(0)}%</span>`];
  });
  f.appendChild(card("市場廣度", `近五日狀態：${m.state?.d5 || "—"}`,
    table(["均線", "站上", "追蹤", "比例"], brows, ["", "r", "r", "r"]),
    "由短到長排列。短天期高、長天期低＝剛起漲；長天期也高＝趨勢已經確立。年線以上的更長週期對日內判斷幫助不大，這裡不列。"));

  const rst = Object.entries(m.roster20 || {}).sort((a, b) => b[1].length - a[1].length);
  f.appendChild(card("站上月線名單", `${rst.length} 個族群`,

      `<span class="sect">${esc(s)}</span>`, `<span class="num">${arr.length}</span>`,
      `<span style="white-space:normal">${esc(arr.join("、"))}</span>`]), ["", "r", ""], true)));
  return f;
}

/* ══ 3. 法人籌碼 ══ */
function tabInst() {
  const i = D.inst || {}, f = document.createDocumentFragment();
  // 四碼且非 00 開頭＝個股；0050、00685L 這些 ETF 排除，否則會霸佔買賣超榜。
  const rank = (i.rank || []).filter(r => /^\d{4}$/.test(r.code) && !/^00/.test(r.code));

  const S = i.series?.inst || {};
  const sc = card("三大法人買賣超金額", "單位：億元。這裡是全市場合計，下面的排行才是個股。", null);
  const sbox = el("div");
  Object.entries(S).forEach(([who, rows]) =>
    sbox.appendChild(chartRow(who, rows.slice(-60), {height: 100, fmt: v => nf(v, 1) + " 億"})));
  sc.appendChild(sbox);
  f.appendChild(sc);

  const mk = (key, label) => {
    const srt = [...rank].sort((a, b) => (b[key] || 0) - (a[key] || 0));
    const mkRows = arr => arr.map(r => {
      const amt = (r[key] || 0) * 1000 * (r.px || 0);
      return {g: "", v: [r.name, r[key], amt, r.px],
        c: [chip(r.name, r.code, r.market),
          `<span class="num ${cls(r[key])}">${sgn(r[key])}</span>`,
          `<span class="num ${cls(amt)}">${sgn(amt / 1e8, 2)} 億</span>`,
          `<span class="num flat">${nf(r.px, 2)}</span>`]};
    });
    const cols = ["個股", "張數", "估算金額", "價格"], al = ["", "r", "r", "r"];
    const g = el("div", "grid2");
    // 預設按金額排。按張數排會讓低價股霸榜——台積電一張兩千四、金融股一張三十，
    // 同樣一億元買超，張數差了近百倍。
    g.appendChild(card(label + " 買超", `張數前 ${Math.min(80, srt.length)} 檔，預設依金額排序`,
      sortTable(cols, mkRows(srt.slice(0, 80)), {sortable: [1, 2, 3], sortKey: 2, dir: -1, size: 30, aligns: al})));
    g.appendChild(card(label + " 賣超", `張數前 ${Math.min(80, srt.length)} 檔，預設依金額排序`,
      sortTable(cols, mkRows(srt.slice(-80).reverse()), {sortable: [1, 2, 3], sortKey: 2, dir: 1, size: 30, aligns: al})));
    return g;
  };
  f.appendChild(el("div", "eyebrow", `法人買賣超　資料日 ${esc(i.date || "—")}　·　共 ${rank.length} 檔個股`));
  f.appendChild(mk("foreign_lots", "外資"));
  f.appendChild(mk("trust_lots", "投信"));

  const both = rank.filter(r => r.foreign_lots > 0 && r.trust_lots > 0)
    .sort((a, b) => (b.foreign_lots + b.trust_lots) - (a.foreign_lots + a.trust_lots));
  const neither = rank.filter(r => r.foreign_lots < 0 && r.trust_lots < 0)
    .sort((a, b) => (a.foreign_lots + a.trust_lots) - (b.foreign_lots + b.trust_lots));
  const mk2 = (arr, label) => card(label, `${arr.length} 檔`,
    sortTable(["個股", "外資", "投信", "合計張數", "估算金額"],
      arr.map(r => {
        const lot = r.foreign_lots + r.trust_lots, amt = lot * 1000 * (r.px || 0);
        return {g: "", v: [r.name, r.foreign_lots, r.trust_lots, lot, amt],
          c: [chip(r.name, r.code, r.market),
            `<span class="num ${cls(r.foreign_lots)}">${sgn(r.foreign_lots)}</span>`,
            `<span class="num ${cls(r.trust_lots)}">${sgn(r.trust_lots)}</span>`,
            `<span class="num ${cls(lot)}">${sgn(lot)}</span>`,
            `<span class="num ${cls(amt)}">${sgn(amt / 1e8, 2)} 億</span>`]};
      }), {sortable: [1, 2, 3, 4], sortKey: 4, dir: label.includes("買") ? -1 : 1, size: 30,
           aligns: ["", "r", "r", "r", "r"]}),
    "估算金額＝買賣超張數 × 1000 × 當日參考價，與券商實際成交均價會有差距。");
  const g2 = el("div", "grid2");
  g2.appendChild(mk2(both, "外資投信同步買超"));
  g2.appendChild(mk2(neither, "外資投信同步賣超"));
  f.appendChild(g2);
  return f;
}

      g: sec, v: [sec, v.median, v.n, v.factors.rs, v.factors.trend, v.factors.pull, v.factors.vol, v.factors.mom],
      c: [`<span class="gcode">${esc(sec)}</span>`,
          `<span class="num" style="font-size:16px;font-weight:800">${nf(v.median, 1)}</span>`,
          `<span class="num flat">${v.n}</span>`,
          ...["rs", "trend", "pull", "vol", "mom"].map(k =>

    }));
    f.appendChild(card("族群綜合評分",
      `${rows.length} 個族群　·　權重：相對強度 ${(W.rs * 100) || 32}％、趨勢 ${(W.trend * 100) || 24}％、回檔 ${(W.pullback * 100) || 16}％、量能 ${(W.volume * 100) || 16}％、動能 ${(W.momentum * 100) || 12}％`,
      sortTable(["族群", "評分中位數", "檔數", "強度", "趨勢", "回檔", "量能", "動能"], rows,
        {sortable: [1, 2, 3, 4, 5, 6, 7], sortKey: 1, dir: -1, size: 30,
         aligns: ["", "r", "r", "r", "r", "r", "r", "r"]}),
      `五個因子各自標準化到 0–100 再加權，取族群內的中位數。因子欄位是族群中位數，不是加總。
       中位數用的是整個族群，所以一兩檔特別強不會把族群拉上去——這正是族群評分比個股名次耐看的地方。
       這是量化統計結果，不是個股買賣建議。`));
  }

  /* 轉強雷達 */
  const trows = (st.rows || []).map(r => ({
    g: r.sector, v: [r.name, r.last, r.r1, r.d5, r.d20, r.turn ? 1 : 0],
    c: [chip(r.name, r.code), `<span class="num flat">${nf(r.last, 2)}</span>`,
        `<span class="num ${cls(r.r1)}">${pc(r.r1)}</span>`,
        `<span class="num ${cls(r.d5)}">${pc(r.d5)}</span>`,
        `<span class="num ${cls(r.d20)}">${pc(r.d20)}</span>`,
        r.turn ? '<span class="up">●</span>' : '<span class="flat">·</span>'],
  }));

  /* 高點回檔：所有族群都留著 */
  const dmed = {};
  Object.entries(sect).forEach(([sec, arr]) => {
    dmed[sec] = arr.map(x => x.dd_52w).sort((a, b) => a - b)[Math.floor(arr.length / 2)];
  });
  const drows = [];
  Object.entries(sect).forEach(([sec, arr]) => arr.forEach(r => drows.push({
    g: sec, v: [r.name, r.dd_52w, r.ytd, r.last],
    c: [chip(r.name, r.code), `<span class="num ${cls(r.dd_52w)}">${pc(r.dd_52w, 1)}</span>`,
        `<span class="num ${cls(r.ytd)}">${pc(r.ytd, 1)}</span>`,
        `<span class="num flat">${nf(r.last, 2)}</span>`],
  })));

  const g = el("div", "grid2");
  g.appendChild(card("轉強雷達", `大盤格局：${st.regime || "—"}　·　${trows.length} 檔`,
    sortTable(["個股", "價格", "當日", "5日", "20日", "轉強"], trows,
      {group: true, sortable: [1, 2, 3, 4, 5], size: 30, aligns: ["", "r", "r", "r", "r", "r"],
       groupOrder: gr => Object.keys(gr).sort((a, b) => gr[b].length - gr[a].length),
       groupLabel: (k, v) => `<span class="gcode">${esc(k)}</span><span class="num" style="font-weight:500">${v.length} 檔</span>`,
       inGroupSort: (a, b) => (b.v[4] || 0) - (a.v[4] || 0)}),
    "轉強＝站上 5 日線且站上 EMA9。點欄位標題可改成全體排序，點「依族群分群」回到族群檢視。"));

  g.appendChild(card("高點回檔追蹤",
    `全部 ${Object.keys(sect).length} 個族群、${drows.length} 檔`,
    sortTable(["個股", "距52週高", "今年以來", "收盤"], drows,
      {group: true, sortable: [1, 2, 3], size: 30, aligns: ["", "r", "r", "r"],
       groupOrder: gr => Object.keys(gr).sort((a, b) => dmed[a] - dmed[b]),
       groupLabel: k => `<span class="gcode">${esc(k)}</span><span class="num ${cls(dmed[k])}" style="font-weight:700">中位 ${pc(dmed[k], 1)}</span>`,
       inGroupSort: (a, b) => a.v[1] - b.v[1]}),
    "族群依回檔中位數由深到淺排列。點「距52週高」可以直接跨族群排序，跌最深的個股一次浮上來。"));
  f.appendChild(g);
  return f;
}

/* ══ 6. 成交金額 ══ */
function tabVolume() {
  const v = D.screen?.volume || {}, f = document.createDocumentFragment();
  const tot = v.total_amt || (v.rows || []).reduce((a, r) => a + (r[2] || 0), 0);
  const W = D.screen?.weights || {}, IP = D.screen?.index_prev_close;
  const rows = (v.rows || []).map((r, i) => {
    const [code, name, amt, px, chg, otc, shares] = r;
    const lots = shares ? shares / 1000 : null;
    const w = W[code];
    const cont = (w && IP && chg !== null && chg !== undefined) ? IP * w * chg : null;
    return {g: "", v: [i + 1, name, amt, lots, cont, tot ? amt / tot : null, px, chg],
      c: [`<span class="num flat">${i + 1}</span>`, chip(name, code, otc ? "櫃" : ""),
          `<span class="num">${yi(amt)}</span>`,
          `<span class="num flat">${lots === null ? "—" : nf(lots, 0)}</span>`,
          `<span class="num ${cls(cont)}">${cont === null ? "—" : sgn(cont, 1)}</span>`,
          `<span class="num flat">${tot ? (amt / tot * 100).toFixed(2) + "%" : "—"}</span>`,
          `<span class="num flat">${nf(px, 2)}</span>`,
          `<span class="num ${cls(chg)}">${pc(chg)}</span>`]};
  });
  const src = v.shares_official ? `官方成交股數 ${v.shares_official}/${v.shares_total} 檔`
    : "成交股數取不到，張數以金額÷價格推估";
  f.appendChild(card("成交金額排行",
    `${v.date || "—"}　${v.is_live ? "盤中即時" : "收盤"}　·　${rows.length} 檔　·　全市場合計 ${yi(tot)}　·　${src}`,
    sortTable(["#", "個股", "成交金額", "成交張數", "指數貢獻", "佔全市場", "收盤", "漲跌"], rows,
      {sortable: [0, 2, 3, 4, 5, 6, 7], sortKey: 2, dir: -1, size: 30,
       aligns: ["r", "", "r", "r", "r", "r", "r", "r"]}),
    `指數貢獻點數＝前日指數 × 該股權重 × 漲跌幅。權重用實收資本額推算發行股數再乘收盤價，
     與證交所發行量加權指數同一個口徑，但不含少數特殊調整，會有小幅誤差。`));
  return f;
}

/* ══ 7. 主動 ETF ══ */
function tabEtf() {
  const e = D.etf || {}, f = document.createDocumentFragment();
  const list = e.etfs || [];

  const sel = el("select");
  sel.appendChild(new Option("全部基金（今日進出合計）", ""));
  list.forEach(x => sel.appendChild(new Option(`${x.name}（${x.code}）`, x.code)));
  const holder = el("div");
  const moveCard = card("經理人今日進出", `資料日 ${list[0]?.date || "—"}`, null,
    "張數＝持股股數變動除以 1000。幅度是相對前一交易日的持股比例變化，「新增」代表前一日沒有這檔。");
  moveCard.insertBefore(sel, moveCard.querySelector("details"));
  moveCard.insertBefore(holder, moveCard.querySelector("details"));

  const LBL = {fundSize: ["資產規模", v => nf(v / 1e8, 2) + " 億"], nav: ["淨值", v => nf(v, 2) + " 元"],
    marketPrice: ["市價", v => nf(v, 2) + " 元"], premiumDiscount: ["折溢價", v => (v > 0 ? "+" : "") + nf(v, 2) + "%"],
    stockRatio: ["持股比例", v => nf(v, 2) + "%"], cashRatio: ["現金比例", v => nf(v, 2) + "%"],
    totalUnits: ["流通單位數", v => nf(v / 1e4, 0) + " 萬單位"], netCreationUnits: ["今日淨申贖", v => sgn(v / 1e4, 0) + " 萬單位"]};

  function render(code) {
    holder.innerHTML = "";
    if (code) {
      const c = e.changes?.[code], s = c?.summary || {};
      const kv = el("div", "kv");
      Object.entries(LBL).forEach(([k, [lab, fmt]]) => {
        if (s[k] === undefined || s[k] === null) return;
        const cl = k === "premiumDiscount" || k === "netCreationUnits" ? cls(s[k]) : "";
        kv.appendChild(el("div", "", `<div class="k">${lab}</div><div class="v num ${cl}">${esc(fmt(s[k]))}</div>`));
      });
      if (kv.children.length) holder.appendChild(kv);
      const rows = (c?.diff || []).map(r => ({g: "", v: [r.name, r.delta_shares, r.pct, r.weight],
        c: [chip(r.name, r.code),
          `<span class="num ${cls(r.delta_shares)}">${sgn(r.delta_shares / 1000)}</span>`,
          r.pct === null ? '<span class="flat">新增</span>' : `<span class="num ${cls(r.pct)}">${pc(r.pct, 0)}</span>`,
          `<span class="num flat">${(r.weight || 0).toFixed(2)}%</span>`]}));
      holder.appendChild(rows.length
        ? sortTable(["標的", "異動張數", "幅度", "權重"], rows,
            {sortable: [1, 2, 3], sortKey: 1, dir: -1, size: 30, aligns: ["", "r", "r", "r"]})
        : el("div", "empty", "今日無持股數量異動。"));
    } else {
      const moves = [];
      list.forEach(x => (e.changes?.[x.code]?.diff || []).forEach(r =>
        moves.push({etf: x.code, etfName: x.name, ...r})));
      holder.appendChild(sortTable(["基金", "標的", "異動張數", "幅度", "權重"],
        moves.map(r => ({g: "", v: [r.etfName, r.name, r.delta_shares, r.pct, r.weight],
          c: [`<span class="sect">${esc(r.etfName)}</span><span class="code">${esc(r.etf)}</span>`,
            chip(r.name, r.code), `<span class="num ${cls(r.delta_shares)}">${sgn(r.delta_shares / 1000)}</span>`,
            r.pct === null ? '<span class="flat">新增</span>' : `<span class="num ${cls(r.pct)}">${pc(r.pct, 0)}</span>`,
            `<span class="num flat">${(r.weight || 0).toFixed(2)}%</span>`]})),
        {sortable: [2, 3, 4], sortKey: 2, dir: -1, size: 30, aligns: ["", "", "r", "r", "r"]}));
    }
  }
  sel.onchange = () => render(sel.value);
  render("");
  f.appendChild(moveCard);

  const cross = Object.entries(e.cross || {}).map(([code, v]) => ({code, ...v}))
    .sort((a, b) => b.held_by - a.held_by);
  f.appendChild(card("被最多主動式 ETF 持有的標的",
    `${list.length} 檔主動式 ETF　·　共出現 ${cross.length} 檔成分股`,
    table(["個股", "持有檔數", "平均權重", "持有的基金"],
      cross.slice(0, 80).map(r => {
        const avg = r.by.reduce((s, x) => s + (x.weight || 0), 0) / (r.by.length || 1);
        return [chip(r.name, r.code), `<span class="num">${r.held_by}</span>`,
          `<span class="num flat">${avg.toFixed(2)}%</span>`,
          `<span class="sect" style="white-space:normal;font-size:12px">${esc(r.by.map(x => x.etf).join(" "))}</span>`];
      }), ["", "r", "r", ""], true),
    "被越多主動式基金持有，代表經理人共識越集中。共識高不等於後續表現好——擁擠的交易也可能一起出場。"));
  return f;
}

/* ══ 頁籤 ══ */
const TABS = [
  ["市場結構", tabMarket, "market"],
  ["期權籌碼", tabOptions, "options"],
  ["法人籌碼", tabInst, "inst"],
  ["信用交易", tabMargin, "market"],
  ["綜合評分", tabScore, "screen"],
  ["成交金額", tabVolume, "screen"],
  ["主動 ETF", tabEtf, "etf"],
];
const nav = document.getElementById("tabs"), main = document.getElementById("main"), panels = [];
TABS.forEach(([label, fn, key], i) => {
  const b = el("button", "", esc(label));
  b.setAttribute("role", "tab");
  b.setAttribute("aria-selected", i === 0 ? "true" : "false");
  const p = el("section", "panel");
  p.hidden = i !== 0;
  if (D.meta.status?.[key] !== "ok") {
    p.appendChild(card("資料更新中", `這一區今天沒有取得資料（狀態：${D.meta.status?.[key] || "未產出"}）。其餘分頁不受影響。`, null));
  } else {
    try { p.appendChild(fn()); }
    catch (err) { p.appendChild(card("這一區沒有畫出來", String(err), null)); }
  }
  b.onclick = () => {
    nav.querySelectorAll("button").forEach(x => x.setAttribute("aria-selected", "false"));
    b.setAttribute("aria-selected", "true");
    panels.forEach(x => x.hidden = true);
    p.hidden = false;
    window.scrollTo({top: 0, behavior: "smooth"});
  };
  nav.appendChild(b); main.appendChild(p); panels.push(p);
});
</script>
