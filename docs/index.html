<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEA 戰情面板</title>
    <style>
        /* 參考 kidd0368.github.io 的高密度技術風格 */
        :root {
            --bg-dark: #121212;
            --panel-bg: #1E1E1E;
            --text-main: #E0E0E0;
            --text-sub: #888888;
            --border-color: #333333;
            --c-up: #C0392B;    /* 台股漲：紅 */
            --c-down: #1A9E4B;  /* 台股跌：綠 */
            --c-flat: #666666;
            --c-title: #D4AF37; /* 標題金 */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            font-size: 14px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; color: var(--c-title); font-size: 24px; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background-color: #2D2D2D;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }
        button:hover { background-color: #3D3D3D; border-color: var(--c-title); }
        
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .panel-title {
            color: var(--c-title);
            font-size: 16px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .panel-sub {
            color: var(--text-sub);
            font-size: 12px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            padding: 8px 4px;
            text-align: right;
            border-bottom: 1px solid #2A2A2A;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        th {
            color: var(--text-sub);
            font-weight: normal;
            border-bottom: 1px solid var(--border-color);
        }
        th:first-child, td:first-child { text-align: left; }
        
        /* 工具類 */
        .color-up { color: var(--c-up) !important; }
        .color-down { color: var(--c-down) !important; }
        .color-flat { color: var(--c-flat) !important; }
        
        /* 加載動畫 */
        #loader { display: none; color: var(--c-title); margin-bottom: 15px; }
        
        /* 原始 JSON 顯示區 (Debug 用) */
        pre { background: #000; padding: 10px; overflow-x: auto; font-size: 12px; display: none;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>GEA 戰情面板</h1>
        <div id="status">Ready</div>
    </div>

    <div class="controls">
        <!-- 注意：這裡必須替換成你的 Render 網址，並帶上你在環境變數設定的 WEB_KEY -->
        <input type="hidden" id="api_base" value="https://你的Render網址.onrender.com/api/cmd">
        <input type="hidden" id="web_key" value="你的WEB_KEY">
        
        <button onclick="fetchData('盤勢')">🧭 盤勢</button>
        <button onclick="fetchData('量榜')">🔥 量榜</button>
        <!-- 這些按鈕你可以自己擴充，只要有寫解析邏輯 -->
        <button onclick="fetchData('轉強')">⚡ 轉強</button>
        <button onclick="fetchData('籌碼')">💰 籌碼</button>
        <button onclick="fetchData('日選')">💎 VIP 日選</button>
    </div>

    <div id="loader">連線中，讀取資料...</div>
    
    <!-- 渲染結果區 -->
    <div id="dashboard">
        <div class="panel">
            <h2 class="panel-title">請點擊上方按鈕取得資料</h2>
            <div class="panel-sub">系統將直接向 Render 伺服器請求最新成品。</div>
        </div>
    </div>
    
    <!-- Debug 用：看看伺服器吐了什麼出來 -->
    <button onclick="document.getElementById('raw_json').style.display='block'" style="margin-top:20px; font-size: 10px;">檢視原始 JSON</button>
    <pre id="raw_json"></pre>
</div>

<script>
    // 取得資料
    async function fetchData(cmd) {
        const apiBase = document.getElementById('api_base').value;
        const webKey = document.getElementById('web_key').value;
        const url = `${apiBase}/${cmd}?key=${webKey}`;
        
        const loader = document.getElementById('loader');
        const dashboard = document.getElementById('dashboard');
        const status = document.getElementById('status');
        const rawJson = document.getElementById('raw_json');
        
        loader.style.display = 'block';
        status.innerText = `Fetching ${cmd}...`;
        dashboard.innerHTML = '';
        
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            rawJson.innerText = JSON.stringify(data, null, 2);
            
            // 根據指令交給對應的解析器
            if (cmd === '盤勢') {
                renderMarketStructure(data, dashboard);
            } else if (cmd === '量榜') {
                renderVolumeRanking(data, dashboard);
            } else {
                dashboard.innerHTML = `<div class="panel"><h2 class="panel-title">🚧 功能開發中</h2><div class="panel-sub">已取得資料，但前端渲染邏輯尚未實作。請點擊下方「檢視原始 JSON」。</div></div>`;
            }
            status.innerText = `Last updated: ${new Date().toLocaleTimeString()}`;
        } catch (error) {
            dashboard.innerHTML = `<div class="panel"><h2 class="panel-title color-down">連線失敗</h2><div class="panel-sub">${error.message}</div></div>`;
            status.innerText = "Error";
        } finally {
            loader.style.display = 'none';
        }
    }

    // --- 解析器區 ---

    // 台股漲跌色碼判斷
    function getColorClass(valStr) {
        if (!valStr) return '';
        const s = String(valStr);
        if (s.includes('🔻') || s.startsWith('-')) return 'color-down';
        if (s.includes('🔺') || s.includes('🟢') || s.startsWith('+')) return 'color-up';
        return '';
    }

    // 處理非 10 元面額標的 (如國巨) 格式保護
    function formatTicker(nameStr) {
        // 這邊只是防禦性處理，後端 Python 應該已經處理好了
        if (nameStr.includes('國巨') && !nameStr.includes('國巨*')) {
             return nameStr.replace('國巨', '國巨*');
        }
        return nameStr;
    }

    // 解析 @盤勢 (處理 Flex Message JSON)
    function renderMarketStructure(data, container) {
        // data 應該是一個 Array，包含兩個 Flex Message (盤勢儀表板、月線名單)
        if (!Array.isArray(data) || data.length === 0) return;

        let html = '';
        
        // 處理第一則訊息 (盤勢儀表板)
        const boardMsg = data[0];
        if (boardMsg.contents && boardMsg.contents.body && boardMsg.contents.body.contents) {
            const items = boardMsg.contents.body.contents;
            
            // 提取標題
            const title = items[0].text || "盤勢結構儀";
            html += `<div class="panel"><h2 class="panel-title">${title}</h2><div class="panel-sub">加權指數 vs 台積電 vs 市場廣度</div>`;
            
            // 建立概況表格
            html += `<table><tbody>`;
            // 跳過標題，尋找 kv 結構
            for(let i=1; i<items.length; i++) {
                const item = items[i];
                if (item.type === 'separator') {
                   // 遇到分隔線就中斷這個區塊
                   break;
                }
                if (item.type === 'box' && item.layout === 'horizontal') {
                    const label = item.contents[0].text || '';
                    const val = item.contents[1].text || '';
                    html += `<tr><td>${label}</td><td>${val}</td></tr>`;
                }
            }
            html += `</tbody></table>`;
            
            // 尋找「當日/回檔/月線」的多欄表格區
            let tableStarted = false;
            for(let i=1; i<items.length; i++) {
                const item = items[i];
                if (item.type === 'box' && item.layout === 'horizontal' && item.contents.length > 2) {
                    if (!tableStarted) {
                        html += `<h3 style="margin-top:20px; font-size:14px; border-bottom:1px solid var(--border-color); padding-bottom:5px;">結構對比</h3><table>`;
                        tableStarted = true;
                    }
                    html += `<tr style="${item.backgroundColor ? 'background-color:'+item.backgroundColor : ''}">`;
                    item.contents.forEach(cell => {
                        const t = cell.text || '';
                        const cls = getColorClass(t);
                        // Header row check
                        if (t === '當日' || t === '回檔') {
                             html += `<th style="text-align:right">${t}</th>`;
                        } else if(item.contents[0].text === '') { // 這是 header 欄
                             html += `<th style="${cell.align==='start'?'text-align:left':'text-align:right'}">${t}</th>`;
                        } else {
                             html += `<td class="${cls}">${t}</td>`;
                        }
                    });
                    html += `</tr>`;
                } else if (tableStarted && item.type !== 'box') {
                    html += `</table>`;
                    tableStarted = false;
                }
            }
            if(tableStarted) html += `</table>`;
            
            // 尋找底部的狀態判讀
            let statusText = '';
            for(let i=items.length-1; i>=0; i--) {
                const item = items[i];
                if (item.type === 'text' && item.text && item.text.includes('▍')) {
                    statusText = `<div style="margin-top:5px;">${getColorClass(item.text) ? '<span class="'+getColorClass(item.text)+'">'+item.text+'</span>' : item.text}</div>` + statusText;
                } else if (item.type === 'text' && item.text === '狀態判讀') {
                    statusText = `<h3 style="margin-top:20px; font-size:14px; color:var(--c-title);">狀態判讀</h3>` + statusText;
                    break;
                }
            }
            html += statusText;
            html += `</div>`;
        }

        // 處理第二則訊息 (站上月線名單)
        if (data.length > 1) {
            const listMsg = data[1];
            if (listMsg.contents && listMsg.contents.body && listMsg.contents.body.contents) {
                const items = listMsg.contents.body.contents;
                const title = items[0].text || "站上月線名單";
                html += `<div class="panel"><h2 class="panel-title">${title}</h2><table><tbody>`;
                
                for(let i=1; i<items.length; i++) {
                    const item = items[i];
                    if (item.type === 'box' && item.layout === 'horizontal') {
                        const sector = item.contents[0].text || '';
                        // 應用國巨保護
                        const stocks = formatTicker(item.contents[1].text || '');
                        html += `<tr><td style="width:120px; color:var(--text-sub);">${sector}</td><td style="white-space:normal;">${stocks}</td></tr>`;
                    }
                }
                html += `</tbody></table></div>`;
            }
        }
        
        container.innerHTML = html;
    }

    // 解析 @量榜 (處理 Flex Message JSON)
    function renderVolumeRanking(data, container) {
        // data 是一個包含多個 bubble 的 array (因分頁而切開)
        if (!Array.isArray(data) || data.length === 0) return;
        
        let html = '';
        
        // 抓第一頁的標題和副標
        const firstMsg = data[0];
        const bodyContents = firstMsg.contents.body.contents;
        const title = bodyContents[0].text || "成交金額排行榜";
        const sub = bodyContents[1].text || "";
        
        html += `<div class="panel"><h2 class="panel-title">${title}</h2><div class="panel-sub">${sub}</div>`;
        html += `<table><thead><tr>`;
        
        // 抓 Header
        const headerBox = bodyContents[3];
        if (headerBox && headerBox.type === 'box') {
            headerBox.contents.forEach(cell => {
                html += `<th style="${cell.align==='start'?'text-align:left':'text-align:right'}">${cell.text||''}</th>`;
            });
        }
        html += `</tr></thead><tbody>`;
        
        // 遍歷所有分頁抓取 Row
        data.forEach(msg => {
            const items = msg.contents.body.contents;
            for(let i=4; i<items.length; i++) {
                const item = items[i];
                if (item.type === 'box' && item.layout === 'horizontal') {
                     html += `<tr style="${item.backgroundColor ? 'background-color:'+item.backgroundColor : ''}">`;
                     item.contents.forEach((cell, idx) => {
                         let text = cell.text || '';
                         if (idx === 0) text = formatTicker(text); // 第一欄是名稱，應用國巨保護
                         const cls = getColorClass(text);
                         html += `<td class="${cls}">${text}</td>`;
                     });
                     html += `</tr>`;
                     
                     // 檢查有沒有 sub
                     const nextItem = items[i+1];
                     if (nextItem && nextItem.type === 'text' && nextItem.color === '#888888') {
                         html += `<tr><td colspan="${item.contents.length}" style="font-size:11px; color:var(--text-sub); border-bottom:1px solid #2A2A2A; padding-top:0;">↳ ${nextItem.text}</td></tr>`;
                         i++; // 跳過這個 text item
                     }
                }
            }
        });
        
        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }
</script>

</body>
</html>
