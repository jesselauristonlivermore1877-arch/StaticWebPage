<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEA 戰情儀表板</title>
    <style>
        :root, [data-theme="light"] {
            --bg-dark: #f9f9f7;
            --panel-bg: #fcfcfb;
            --text-main: #0b0b0b;
            --text-sub: #52514e;
            --border-color: #e1e0d9;
            --c-up: #C0392B;    
            --c-down: #1A9E4B;  
            --c-flat: #666666;
            --c-title: #2a78d6;
            --zebra: #f4f4f4;
        }
        [data-theme="dark"] {
            --bg-dark: #0d0d0d;
            --panel-bg: #1a1a19;
            --text-main: #ffffff;
            --text-sub: #c3c2b7;
            --border-color: #2c2c2a;
            --c-up: #e66767;    
            --c-down: #199e70;  
            --c-flat: #898781;
            --c-title: #D4AF37; 
            --zebra: #1f1f1d;
        }
        body { font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px 16px 56px; font-size: 14px; line-height: 1.55; }
        .wrap { max-width: 1180px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 14px; }
        h1 { margin: 0; color: var(--c-title); font-size: 20px; font-weight: 700; }
        .timestamp { color: var(--text-sub); font-size: 12.5px; }
        
        .panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
        .panel-title { color: var(--c-title); font-size: 16px; font-weight: 700; margin-top: 0; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .panel-sub { color: var(--text-sub); font-size: 12px; margin-bottom: 8px; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
        th, td { padding: 4px 9px; text-align: right; border-bottom: 1px solid var(--border-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
        th { color: var(--text-sub); font-weight: normal; }
        th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--panel-bg); }
        
        tbody tr:nth-child(even) { background-color: var(--zebra) !important; }
        tbody tr:nth-child(odd) { background-color: transparent !important; }
        
        .color-up { color: var(--c-up) !important; font-weight: 600; }
        .color-down { color: var(--c-down) !important; font-weight: 600; }
        .color-flat { color: var(--c-flat) !important; }
        
        .table-responsive { max-height: 400px; overflow: auto; margin-top: 6px; border: 1px solid var(--border-color); border-radius: 8px; }
        
        details.how { margin: 2px 0 8px; }
        details.how summary { cursor: pointer; font-size: 12px; color: var(--c-title); user-select: none; }
        
        footer { color: var(--text-sub); font-size: 11.5px; margin-top: 22px; border-top: 1px solid var(--border-color); padding-top: 10px; }
    </style>
</head>
<body>

<div class="wrap">
    <div class="header">
        <h1>GEA 戰情面板</h1>
        <div class="timestamp" id="last-update"></div>
    </div>

    <!-- 瀑布流掛載區 -->
    <div id="section-盤勢"></div>
    <div id="section-量榜"></div>
    <div id="section-轉強"></div>
    <div id="section-回檔"></div>
    <div id="section-籌碼"></div>
    <div id="section-期權籌碼"></div>
    <div id="section-法人結構"></div>
    <div id="section-外資"></div>
    <div id="section-投信"></div>
    <div id="section-信用"></div>
    <div id="section-主動ETF"></div>

    <footer>
        資料來源：台灣證券交易所、證券櫃檯買賣中心、台灣期貨交易所公開資料。<br>
        <strong>合規聲明：以上為量化篩選結果，數據僅供資訊參考，非投資建議。</strong>
    </footer>
</div>

<script>
    // 透過 Python 腳本烘焙進來的靜態資料
    const IND = __DATA__;
    
    // 主題偵測與切換
    let theme = (matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    if(matchMedia){
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        });
    }

    window.onload = () => {
        document.getElementById('last-update').innerText = `烘焙時間：${IND.generated}｜資料日：${IND.asof}`;
        
        const commands = ['盤勢', '量榜', '轉強', '回檔', '籌碼', '期權籌碼', '法人結構', '外資', '投信', '信用', '主動ETF'];
        
        commands.forEach(cmd => {
            const container = document.getElementById(`section-${cmd}`);
            const data = IND.sections[cmd];
            if (!data || data.length === 0) return;
            
            if (cmd === '盤勢') renderMarketStructure(data, container);
            else if (cmd === '量榜') renderVolumeRanking(data, container);
            else if (cmd === '轉強') renderStrengthRadar(data, container);
            else if (cmd === '回檔') renderDrawdown(data, container);
            else if (cmd === '籌碼' || cmd === '外資' || cmd === '投信' || cmd === '信用') renderStandardTable(cmd, data, container);
            else if (cmd === '期權籌碼') renderOptionChips(data, container);
            else if (cmd === '法人結構') renderInstStructure(data, container);
            else if (cmd === '主動ETF') renderActiveETFList(data, container);
        });
    };

    function getColorClass(valStr) {
        if (!valStr) return '';
        const s = String(valStr);
        if (s.includes('🔻') || s.startsWith('-') || s.includes('🔴') || s.includes('🧊')) return 'color-down';
        if (s.includes('🔺') || s.includes('🟢') || s.startsWith('+') || s.includes('🔥')) return 'color-up';
        return '';
    }

    function formatTicker(nameStr) {
        if (nameStr.includes('國巨') && !nameStr.includes('國巨*')) {
             return nameStr.replace('國巨', '國巨*');
        }
        return nameStr;
    }

    // --- 盤勢 ---
    function renderMarketStructure(data, container) {
        let html = '';
        const boardMsg = data[0];
        if (boardMsg.contents && boardMsg.contents.body && boardMsg.contents.body.contents) {
            const items = boardMsg.contents.body.contents;
            html += `<div class="panel"><h2 class="panel-title">${items[0].text || '今日盤勢'}</h2><div class="panel-sub">加權指數 vs 台積電 vs 市場廣度</div><div class="table-responsive"><table><tbody>`;
            
            for(let i=1; i<items.length; i++) {
                const item = items[i];
                if (item.type === 'separator') break;
                if (item.type === 'box' && item.layout === 'horizontal') {
                    html += `<tr><td>${item.contents[0].text||''}</td><td class="${getColorClass(item.contents[1].text)}">${item.contents[1].text||''}</td></tr>`;
                }
            }
            html += `</tbody></table></div>`;
            
            let tableStarted = false;
            for(let i=1; i<items.length; i++) {
                const item = items[i];
                if (item.type === 'box' && item.layout === 'horizontal' && item.contents.length > 2) {
                    if (!tableStarted) {
                        html += `<h3 style="margin-top:14px; font-size:14px; border-bottom:1px solid var(--border-color); padding-bottom:5px;">結構對比</h3><div class="table-responsive"><table>`;
                        tableStarted = true;
                    }
                    html += `<tr>`;
                    item.contents.forEach(cell => {
                        const t = cell.text || '';
                        if (t === '當日' || t === '回檔') html += `<th style="text-align:right">${t}</th>`;
                        else if(item.contents[0].text === '') html += `<th style="${cell.align==='start'?'text-align:left':'text-align:right'}">${t}</th>`;
                        else html += `<td class="${getColorClass(t)}">${t}</td>`;
                    });
                    html += `</tr>`;
                } else if (tableStarted && item.type !== 'box') {
                    html += `</table></div>`;
                    tableStarted = false;
                }
            }
            if(tableStarted) html += `</table></div>`;
            
            let statusText = '';
            for(let i=items.length-1; i>=0; i--) {
                const item = items[i];
                if (item.type === 'text' && item.text && item.text.includes('▍')) {
                    statusText = `<div style="margin-top:4px;">${getColorClass(item.text) ? '<span class="'+getColorClass(item.text)+'">'+item.text+'</span>' : item.text}</div>` + statusText;
                } else if (item.type === 'text' && item.text === '狀態判讀') {
                    statusText = `<h3 style="margin-top:14px; font-size:14px;">💡 狀態判讀</h3>` + statusText;
                    break;
                }
            }
            html += statusText;
            html += `</div>`;
        }
        
        if (data.length > 1) {
            const listMsg = data[1];
            if (listMsg.contents && listMsg.contents.body && listMsg.contents.body.contents) {
                const items = listMsg.contents.body.contents;
                html += `<div class="panel"><details class="how"><summary>${items[0].text || '站上月線名單'}</summary><div class="hb"><div class="table-responsive"><table><tbody>`;
                for(let i=1; i<items.length; i++) {
                    const item = items[i];
                    if (item.type === 'box' && item.layout === 'horizontal') {
                        html += `<tr><td style="width:140px;">${item.contents[0].text||''}</td><td style="white-space:normal;">${formatTicker(item.contents[1].text||'')}</td></tr>`;
                    }
                }
                html += `</tbody></table></div></div></details></div>`;
            }
        }
        container.innerHTML = html;
    }

    // --- 量榜 ---
    function renderVolumeRanking(data, container) {
        let html = '';
        const firstMsg = data[0];
        const bodyContents = firstMsg.contents.body.contents;
        
        html += `<div class="panel"><h2 class="panel-title">${bodyContents[0].text || '成交量榜'}</h2><div class="panel-sub">${bodyContents[1].text || ''}</div><div class="table-responsive"><table><thead><tr>`;
        
        const headerBox = bodyContents[3];
        if (headerBox && headerBox.type === 'box') {
            headerBox.contents.forEach(cell => {
                html += `<th style="${cell.align==='start'?'text-align:left':'text-align:right'}">${cell.text||''}</th>`;
            });
        }
        html += `</tr></thead><tbody>`;
        
        data.forEach(msg => {
            const items = msg.contents.body.contents;
            for(let i=4; i<items.length; i++) {
                const item = items[i];
                if (item.type === 'box' && item.layout === 'horizontal') {
                     html += `<tr>`;
                     item.contents.forEach((cell, idx) => {
                         let text = cell.text || '';
                         if (idx === 0) text = formatTicker(text);
                         html += `<td class="${getColorClass(text)}">${text}</td>`;
                     });
                     html += `</tr>`;
                     
                     const nextItem = items[i+1];
                     if (nextItem && nextItem.type === 'text' && nextItem.color === '#888888') {
                         html += `<tr style="background-color: transparent !important;"><td colspan="${item.contents.length}" style="font-size:11px; color:var(--text-sub); border-bottom:1px solid var(--border-color); padding-top:0;">↳ ${nextItem.text}</td></tr>`;
                         i++; 
                     }
                }
            }
        });
        html += `</tbody></table></div></div>`;
        container.innerHTML = html;
    }

    // --- 轉強 ---
    function renderStrengthRadar(data, container) {
        let html = `<div class="panel"><h2 class="panel-title">轉強雷達</h2>`;
        const headMsg = data[0];
        if(headMsg.contents && headMsg.contents.body) {
             const items = headMsg.contents.body.contents;
             html += `<div class="table-responsive" style="margin-bottom: 14px;"><table><tbody>`;
             for(let i=2; i<items.length; i++) {
                 if(items[i].type === 'separator') break;
                 if(items[i].type === 'box') {
                     html += `<tr><td>${items[i].contents[0].text}</td><td class="${getColorClass(items[i].contents[1].text)}">${items[i].contents[1].text}</td></tr>`;
                 }
             }
             html += `</tbody></table></div>`;
        }

        if(data.length > 1) {
            html += `<h3 style="margin-top:14px; font-size:14px;">📊 相對強度排行</h3>`;
            html += `<div class="table-responsive"><table><thead><tr><th style="text-align:left">名稱</th><th>收盤</th><th>當日</th><th>5日線</th><th>月線</th><th>轉強</th></tr></thead><tbody>`;
            for(let j=1; j<data.length; j++) {
                const items = data[j].contents.body.contents;
                for(let i=3; i<items.length; i++) {
                    const item = items[i];
                    if(item.type === 'text' && item.text.startsWith('▍')) {
                        html += `<tr><td colspan="6" style="color:var(--c-title); font-weight:bold; text-align:left; padding-top:10px;">${item.text.substring(1)}</td></tr>`;
                    } else if (item.type === 'box') {
                        html += `<tr>`;
                        item.contents.forEach((cell, idx) => {
                            let text = cell.text || '';
                            if(idx === 0) text = formatTicker(text);
                            html += `<td class="${getColorClass(text)}" style="${idx===0?'text-align:left':''}">${text}</td>`;
                        });
                        html += `</tr>`;
                    }
                }
            }
            html += `</tbody></table></div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    // --- 回檔 ---
    function renderDrawdown(data, container) {
        let html = `<div class="panel"><h2 class="panel-title">回檔追蹤</h2><div class="panel-sub">距52週最高價回檔逾10%之標的</div><div class="table-responsive"><table><thead><tr><th style="text-align:left">名稱</th><th>收盤</th><th>今年高→現</th><th>回檔</th></tr></thead><tbody>`;
        data.forEach(msg => {
            const items = msg.contents.body.contents;
            for(let i=3; i<items.length; i++) {
                const item = items[i];
                if(item.type === 'text' && item.text.startsWith('▍')) {
                    html += `<tr><td colspan="4" style="color:var(--c-title); font-weight:bold; text-align:left; padding-top:10px;">${item.text.substring(1)}</td></tr>`;
                } else if (item.type === 'box' && item.layout === 'horizontal') {
                    html += `<tr>`;
                    item.contents.forEach((cell, idx) => {
                        let text = cell.text || '';
                        if(idx === 0) text = formatTicker(text);
                        html += `<td class="${getColorClass(text)}" style="${idx===0?'text-align:left':''}">${text}</td>`;
                    });
                    html += `</tr>`;
                }
            }
        });
        html += `</tbody></table></div></div>`;
        container.innerHTML = html;
    }

    // --- 法人動向、信用與籌碼總表 ---
    function renderStandardTable(cmd, data, container) {
        let html = `<div class="panel"><h2 class="panel-title">${cmd}</h2>`;
        data.forEach(msg => {
             const items = msg.contents.body.contents;
             html += `<h3 style="margin-top:14px; font-size:14px;">${items[0].text}</h3>`;
             html += `<div class="panel-sub">${items[1]?items[1].text:''}</div>`;
             
             html += `<div class="table-responsive"><table><thead><tr>`;
             const headerBox = items[3];
             if(headerBox && headerBox.type === 'box') {
                 headerBox.contents.forEach((cell, idx) => {
                     html += `<th style="${idx===0?'text-align:left':'text-align:right'}">${cell.text||''}</th>`;
                 });
             }
             html += `</tr></thead><tbody>`;
             
             for(let i=4; i<items.length; i++) {
                 const item = items[i];
                 if(item.type === 'box' && item.layout === 'horizontal') {
                     html += `<tr>`;
                     item.contents.forEach((cell, idx) => {
                         let text = cell.text || '';
                         if(idx === 0) text = formatTicker(text);
                         html += `<td class="${getColorClass(text)}" style="${idx===0?'text-align:left':''}">${text}</td>`;
                     });
                     html += `</tr>`;
                 }
             }
             html += `</tbody></table></div>`;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    // --- 法人結構 ---
    function renderInstStructure(data, container) {
        let html = `<div class="panel"><h2 class="panel-title">法人結構</h2>`;
        data.forEach(msg => {
             const items = msg.contents.body.contents;
             html += `<h3 style="margin-top:14px; font-size:14px;">${items[0].text}</h3>`;
             html += `<div class="table-responsive"><table><thead><tr><th style="text-align:left">名稱</th><th>金額</th><th>當日</th><th>回檔</th></tr></thead><tbody>`;
             
             for(let i=3; i<items.length; i++) {
                 const item = items[i];
                 if(item.type === 'box' && item.layout === 'horizontal') {
                     html += `<tr>`;
                     item.contents.forEach((cell, idx) => {
                         let text = cell.text || '';
                         if(idx === 0) text = formatTicker(text);
                         html += `<td class="${getColorClass(text)}" style="${idx===0?'text-align:left':''}">${text}</td>`;
                     });
                     html += `</tr>`;
                     
                     const nextItem = items[i+1];
                     if (nextItem && nextItem.type === 'text' && nextItem.color === '#888888') {
                         html += `<tr style="background-color: transparent !important;"><td colspan="4" style="font-size:11px; color:var(--text-sub); border-bottom:1px solid var(--border-color); padding-top:0;">↳ ${nextItem.text}</td></tr>`;
                         i++; 
                     }
                 }
             }
             html += `</tbody></table></div>`;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    // --- 期權籌碼 ---
    function renderOptionChips(data, container) {
        let html = `<div class="panel"><h2 class="panel-title">期權籌碼</h2>`;
        data.forEach((msg, index) => {
            const items = msg.contents.body.contents;
            const title = items[0].text;
            html += `<h3 style="margin-top:14px; font-size:14px; color:var(--c-title);">${title}</h3>`;
            if(items[1] && items[1].color === '#888888') html += `<div class="panel-sub">${items[1].text}</div>`;
            
            if(title.includes('散戶多空比')) {
                html += `<div class="table-responsive"><table><tbody>`;
                for(let i=2; i<items.length; i++) {
                    const item = items[i];
                    if(item.type === 'box' && item.layout === 'vertical') {
                         const subItems = item.contents;
                         if(subItems[0].type === 'box') {
                             const lbl = subItems[0].contents[0].text;
                             const val = subItems[0].contents[1].text;
                             html += `<tr><td style="text-align:left; font-weight:bold;">${lbl}</td><td class="${getColorClass(val)}">${val}</td></tr>`;
                         }
                         const lastText = subItems[subItems.length-1].text;
                         if(lastText) html += `<tr style="background-color:transparent !important"><td colspan="2" style="font-size:11px; color:var(--text-sub); border-bottom:1px solid var(--border-color); padding-top:0;">${lastText}</td></tr>`;
                    }
                }
                html += `</tbody></table></div>`;
            } 
            else if (title.includes('支撐壓力')) {
                html += `<div class="table-responsive"><table><tbody>`;
                for(let i=2; i<items.length; i++) {
                    const item = items[i];
                    if(item.type === 'text' && item.text.startsWith('🧱')) {
                        html += `<tr><td colspan="3" style="color:var(--c-title); font-weight:bold; text-align:center; padding-top:10px;">${item.text.substring(1)}</td></tr>`;
                    } else if (item.type === 'box' && item.contents.length === 5) { 
                        const putVol = item.contents[0].text;
                        const strike = item.contents[2].text;
                        const callVol = item.contents[4].text;
                        if(strike !== '履約價') {
                            html += `<tr><td style="text-align:right; color:var(--c-down); width:35%;">${putVol}</td><td style="text-align:center; font-weight:bold; width:30%;">${strike}</td><td style="text-align:left; color:var(--c-up); width:35%;">${callVol}</td></tr>`;
                        } else {
                            html += `<tr><th style="text-align:right; color:var(--c-down);">Put 支撐</th><th style="text-align:center;">履約價</th><th style="text-align:left; color:var(--c-up);">Call 壓力</th></tr>`;
                        }
                    }
                }
                html += `</tbody></table></div>`;
            }
            else {
                html += `<div class="table-responsive"><table><thead><tr>`;
                const headerBox = items[3];
                if(headerBox && headerBox.type === 'box') {
                     headerBox.contents.forEach((cell, idx) => {
                         html += `<th style="${idx===0?'text-align:left':'text-align:right'}">${cell.text||''}</th>`;
                     });
                }
                html += `</tr></thead><tbody>`;
                for(let i=4; i<items.length; i++) {
                     const item = items[i];
                     if(item.type === 'box' && item.layout === 'horizontal') {
                         html += `<tr>`;
                         item.contents.forEach((cell, idx) => {
                             let text = cell.text || '';
                             html += `<td class="${getColorClass(text)}" style="${idx===0?'text-align:left':''}">${text}</td>`;
                         });
                         html += `</tr>`;
                     } else if (item.type === 'text' && item.text.startsWith('▍')) {
                         html += `<tr><td colspan="3" style="font-weight:bold; text-align:left; padding-top:10px;">${item.text.substring(1)}</td></tr>`;
                     }
                }
                html += `</tbody></table></div>`;
            }
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    // --- 主動 ETF ---
    function renderActiveETFList(data, container) {
        let html = `<div class="panel"><h2 class="panel-title">主動式 ETF</h2><div class="panel-sub">全市場清單 (成分股明細需透過 LINE 指令查閱)</div><div class="table-responsive"><table><thead><tr><th style="text-align:left">代號</th><th style="text-align:left">名稱</th></tr></thead><tbody>`;
        data.forEach(msg => {
            const items = msg.contents.body.contents;
            for(let i=4; i<items.length; i++) {
                const item = items[i];
                if (item.type === 'box' && item.layout === 'horizontal') {
                    html += `<tr><td style="text-align:left; color:var(--c-title); font-weight:bold;">${item.contents[0].text}</td><td style="text-align:left;">${item.contents[1].text}</td></tr>`;
                }
            }
        });
        html += `</tbody></table></div></div>`;
        container.innerHTML = html;
    }
</script>

</body>
</html>
