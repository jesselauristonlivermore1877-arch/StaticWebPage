<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>選股 EDM 預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* 預覽頁本身 */
:root{--bg:#EEE9DD;--ink:#1B2A4A}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
.pv-head{max-width:1120px;margin:0 auto;padding:20px 16px 4px}
.pv-head h1{font-size:22px;margin:0 0 6px}.pv-head p{margin:4px 0;font-size:14px;line-height:1.7}
.pv-grid{max-width:1120px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(540px,100%),1fr));gap:18px}
.pv-item{min-width:0;background:#fff;border-radius:12px;padding:10px;border:1px solid #DDD4BF}
.pv-item h2{font-size:16px;margin:2px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.pv-item button{font:inherit;font-size:13px;background:#1B2A4A;color:#fff;border:0;border-radius:8px;padding:5px 12px;cursor:pointer}
.pv-frame{width:100%;overflow:hidden;border-radius:8px}
.pv-frame>.pe-card{transform-origin:0 0}
@media (max-width:600px){.pv-grid{grid-template-columns:1fr}.pv-frame{width:100%}}

/* ── 選股 EDM（pe- 前綴；配色、字級沿用 AI 研究報告 EDM 的 cre- 引擎）── */
.pe-card{--k:1;width:1080px;height:1350px;box-sizing:border-box;overflow:hidden;background:#F6F2E8;color:#1B2A4A;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;display:flex;flex-direction:column;gap:16px;padding:0 0 18px}
.pe-top{position:relative;background:linear-gradient(135deg,#1B2A4A 0%,#26406e 70%,#B8862B 140%);color:#fff;padding:30px 48px 26px 220px;min-height:150px}
.pe-date{position:absolute;left:44px;top:30px;width:148px;background:#fff;color:#1B2A4A;border-radius:14px;text-align:center;overflow:hidden;border:3px solid #F3E3C0}
.pe-date small{display:block;background:#C8361E;color:#fff;font-size:20px;font-weight:900;padding:3px 0}
.pe-date b{display:block;font-size:44px;font-weight:900;line-height:1.15;margin-top:4px}
.pe-date em{display:block;font-style:normal;font-size:22px;font-weight:900;padding-bottom:6px}
.pe-tag{display:inline-block;background:#F3E3C0;color:#1B2A4A;font-weight:900;border-radius:8px;padding:3px 14px;font-size:22px}
.pe-brand{position:absolute;right:48px;top:30px;text-align:right;font-weight:900;font-size:26px;color:#F3E3C0;line-height:1.1}.pe-brand small{display:block;font-size:15px;font-weight:700;opacity:.85}
.pe-title{font-size:54px;font-weight:900;line-height:1.2;margin-top:10px}
.pe-title span{color:#FFC35A}
.pe-subt{font-size:23px;line-height:1.5;margin-top:8px;opacity:.95}
.pe-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:0 36px}
.pe-kpi div{background:#fff;border-radius:14px;border:1px solid #E7DFCC;padding:12px 10px;text-align:center}
.pe-kpi small{display:block;white-space:nowrap;font-size:20px;font-weight:700;color:#4A4636}
.pe-kpi b{display:block;font-size:46px;font-weight:900;color:#1B2A4A;line-height:1.2;margin:2px 0;white-space:nowrap}.pe-kpi b u{text-decoration:none;font-size:.48em;margin-left:4px}
.pe-kpi em{display:block;font-style:normal;font-size:18px;font-weight:700;color:#B8862B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe-kpi .up b{color:#C8361E}.pe-kpi .dn b{color:#1E7B4F}.pe-kpi .gd b{color:#B8862B}
.pe-box{background:#fff;border-radius:14px;padding:14px 20px;border:1px solid #E7DFCC;box-sizing:border-box}
.pe-box h4{margin:0 0 8px;font-size:27px;font-weight:900;color:#1B2A4A;display:flex;align-items:baseline;gap:10px}
.pe-box h4::before{content:"";display:inline-block;width:8px;height:.9em;background:#B8862B;border-radius:2px;align-self:center}
.pe-box h4 small{font-size:17px;font-weight:700;color:#6B6452}
.pe-mx{margin:0 36px}
.pe-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 36px;flex:1 0 auto}
.pe-sec{border-top:1px dashed #E7DFCC;padding:7px 0 6px}
.pe-sec:first-of-type{border-top:0}
.pe-sec b{display:block;font-size:23px;font-weight:900;line-height:1.3}
.pe-sec i{font-style:normal;font-size:15px;font-weight:700;color:#fff;background:#B8862B;border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:3px}
.pe-sec small{display:block;font-size:17px;font-weight:700;color:#6B6452;line-height:1.45}
.pe-sec span{display:block;font-size:18.5px;font-weight:700;line-height:1.45}
.pe-hd{display:block;text-align:center;font-size:24px;font-weight:900;color:#fff;border-radius:10px;padding:5px 0;margin:-2px 0 6px}
.pe-hd.lead{background:#C8361E}.pe-hd.imp{background:#E2802C}.pe-hd.lag{background:#1E7B4F}.pe-hd.f{background:#1B2A4A}.pe-hd.t{background:#7A4FA0}.pe-hd.b{background:#B8862B}
.up{color:#C8361E}.dn{color:#1E7B4F}
.pe-line{margin:0 36px;background:#fff;border-radius:12px;padding:10px 20px;font-size:20px;font-weight:700;line-height:1.5;border:1px solid #E7DFCC}
.pe-line b{color:#B8862B;margin-right:10px}
.pe-tb{width:100%;border-collapse:collapse;font-size:21px}
.pe-tb th{font-size:17px;color:#6B6452;font-weight:700;text-align:left;padding:4px 6px;border-bottom:2px solid #E7DFCC;white-space:nowrap}
.pe-tb td{padding:7px 6px;border-bottom:1px solid #F0EADB;font-weight:700;vertical-align:middle}
.pe-tb td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pe-tb td.c{white-space:nowrap}.pe-tb td.c small{color:#6B6452;font-size:16px;margin-right:6px}
.pe-tb td.fs{font-size:16px;color:#4A4636;line-height:1.35}
.pe-rk{display:inline-block;width:32px;height:32px;line-height:32px;border-radius:50%;background:#1B2A4A;color:#fff;text-align:center;font-size:17px;font-weight:900}
.pe-dots{letter-spacing:2px;color:#C8361E;font-size:18px}
.pe-li{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid #F0EADB;font-size:20px;font-weight:700}
.pe-li:last-child{border-bottom:0}
.pe-li i{flex:none;font-style:normal;width:26px;height:26px;line-height:26px;border-radius:50%;background:#EFE7D3;text-align:center;font-size:15px;font-weight:900;align-self:center}
.pe-li em{font-style:normal;color:#6B6452;font-size:16px}
.pe-li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe-li b{white-space:nowrap;font-variant-numeric:tabular-nums}
.pe-li small{font-size:14px;color:#B8862B;margin-left:4px;white-space:nowrap}
.pe-foot{margin:auto 36px 0;display:flex;align-items:center;gap:16px}
.pe-foot b{flex:none;background:#1B2A4A;color:#FFC35A;border-radius:10px;padding:8px 16px;font-size:23px;font-weight:900}
.pe-foot span{font-size:15px;color:#6B6452;line-height:1.5}
.pe-empty{font-size:21px;font-weight:700;color:#6B6452;line-height:1.6;padding:6px 0}
.pe-ph{flex:1;margin:0 36px;border:4px dashed #CFC4AA;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#6B6452;text-align:center}
.pe-ph b{font-size:46px;color:#1B2A4A}.pe-ph span{font-size:24px;font-weight:700;line-height:1.6}
.pe-c2 .pe-tb td{padding:11px 6px}.pe-c3 .pe-li{padding:15px 0;font-size:22px}
.pe-rrg text{font-family:"Noto Sans TC",sans-serif}
.pe-q4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 36px;flex:1 0 auto}
.pe-hd.q0{background:#C8361E}.pe-hd.q1{background:#E2802C}.pe-hd.q2{background:#4F8A6A}.pe-hd.q3{background:#1E7B4F}
.pe-hd.tu{background:#C8361E}.pe-hd.td{background:#1E7B4F}
.pe-tr{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:3px 10px;border-top:1px dashed #E7DFCC;padding:9px 0 8px;align-items:center}
.pe-tr:first-of-type{border-top:0}
.pe-tr b{font-size:23px;font-weight:900;line-height:1.25;white-space:nowrap;overflow:hidden}
.pe-tr i{font-style:normal;font-size:15px;font-weight:700;color:#fff;border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:3px}
.pe-tr i.up{background:#C8361E}.pe-tr i.dn{background:#1E7B4F}
.pe-tr small{display:block;font-size:16.5px;font-weight:700;color:#4A4636;line-height:1.45;white-space:nowrap}
.pe-tr span{display:block;font-size:17px;font-weight:700;line-height:1.4;color:#4A4636;white-space:nowrap;overflow:hidden}
.pe-tr svg{grid-row:1 / span 3;grid-column:2}
.pe-q4 .pe-sec{padding:5px 0 4px}.pe-q4 .pe-sec b{font-size:22px}.pe-q4 .pe-sec small{font-size:16px}.pe-q4 .pe-sec span{font-size:18px}
.pe-note{margin:0 36px;font-size:17px;font-weight:700;color:#6B6452;line-height:1.5}
</style>
</head>
<body>
<div class="pv-head">
  <h1>選股 EDM 系列預覽（1080×1350）</h1>
  <p>資料全部取自平台現有檔案，由 <code>tools/pick_edm.py</code> 計算，並用另一份原始資料重算核對：<b id="pv-ver">載入中…</b></p>
  <p>族群輪動拆成五張、每張一個主題（①～⑤），口徑與網站上同名的圖表相同；⑥⑦ 保留；⑧ 權證留版位，等覆蓋率 80%。每張右上角「下載 PNG」＝正式上線後網站上的下載鈕（含浮水印）。</p>
</div>
<div class="pv-grid" id="pv-grid"></div>
<script>
const H2C = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const WD = "日一二三四五六";
const sg = (v, d) => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const cls = v => v > 0 ? "up" : v < 0 ? "dn" : "";
const yi = (v, d) => (v / 1e8).toFixed(d == null ? 2 : d);               // 元 → 億
const yiM = v => (v / 100).toFixed(2);                                     // 百萬 → 億
const nm5 = (t, n) => (t = String(t || "")).length > (n || 5) ? t.slice(0, n || 5) : t;   // 長名稱截短（html2canvas 畫不好省略號）
const QN = {lead: "領先", imp: "改善", weak: "轉弱", lag: "落後"};
function peScript(u) { return new Promise((ok, no) => { if (document.querySelector(`script[src="${u}"]`)) return ok(); const t = document.createElement("script"); t.src = u; t.onload = ok; t.onerror = no; document.head.appendChild(t); }); }

function peTop(date, tag, title, subt) {
  const d = new Date(date + "T12:00:00Z");
  return `<div class="pe-top"><div class="pe-date"><small>${d.getUTCFullYear() - 1911} 年</small><b>${d.getUTCMonth() + 1}/${d.getUTCDate()}</b><em>（${WD[d.getUTCDay()]}）</em></div>` +
    `<div class="pe-brand">GEA 戰情<small>量化選股</small></div><div class="pe-tag">${esc(tag)}</div>` +
    `<div class="pe-title">${title}</div><div class="pe-subt">${esc(subt)}</div></div>`;
}
const peKpi = a => `<div class="pe-kpi">${a.map(k => `<div class="${k.c || ""}"><small>${esc(k.lab)}</small><b>${esc(k.num)}<u>${esc(k.u || "")}</u></b><em>${esc(k.sub || "")}</em></div>`).join("")}</div>`;
const peFoot = (P, src) => `<div class="pe-foot"><b>${esc(P.foot)}</b><span>${esc(src)}　不含目標價、評等；數字由程式從平台資料計算並重算核對。</span></div>`;

/* ① 價量四象限（radar.json，同網站「量價象限」） */
const BRQ = [["價強・資金偏多", "q0", "#C8361E"], ["價強・資金偏空", "q1", "#E2802C"], ["價弱・資金偏多", "q2", "#4F8A6A"], ["價弱・資金偏空", "q3", "#1E7B4F"]];
function peQuadSvg(Q) {
  const W = 1008, H = 276, pad = 28, S = Q.secs;
  const mx = Math.max(...S.map(s => Math.abs(s.x))) * 1.15 || 1, my = Math.max(...S.map(s => Math.abs(s.y))) * 1.15 || 1;
  const X = v => W / 2 + v / mx * (W / 2 - pad), Y = v => H / 2 - v / my * (H / 2 - pad + 4);
  const bg = ["#FBE9E4", "#FDF1E2", "#EAF2EC", "#E3F0E8"];
  let g = `<rect x="${W / 2}" y="0" width="${W / 2}" height="${H / 2}" fill="${bg[0]}"/><rect x="0" y="0" width="${W / 2}" height="${H / 2}" fill="${bg[1]}"/>` +
    `<rect x="${W / 2}" y="${H / 2}" width="${W / 2}" height="${H / 2}" fill="${bg[2]}"/><rect x="0" y="${H / 2}" width="${W / 2}" height="${H / 2}" fill="${bg[3]}"/>` +
    `<line x1="${W / 2}" x2="${W / 2}" y1="0" y2="${H}" stroke="#B9AE93" stroke-width="2"/><line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="#B9AE93" stroke-width="2"/>` +
    `<text x="${W - 10}" y="28" text-anchor="end" font-size="22" font-weight="900" fill="${BRQ[0][2]}">${BRQ[0][0]}</text>` +
    `<text x="10" y="28" font-size="22" font-weight="900" fill="${BRQ[1][2]}">${BRQ[1][0]}</text>` +
    `<text x="${W - 10}" y="${H - 12}" text-anchor="end" font-size="22" font-weight="900" fill="${BRQ[2][2]}">${BRQ[2][0]}</text>` +
    `<text x="10" y="${H - 12}" font-size="22" font-weight="900" fill="${BRQ[3][2]}">${BRQ[3][0]}</text>` +
    `<text x="${W / 2 + 8}" y="${H - 12}" font-size="15" fill="#6B6452">資金流向 →</text><text x="${W / 2 + 8}" y="18" font-size="15" fill="#6B6452">↑ ${Q.win} 日漲跌</text>`;
  const am = Math.max(...S.map(s => s.amt));
  const lab = [];
  const named = new Set([0, 1, 2, 3].flatMap(i => S.filter(s => s.q === i).slice(0, 2).map(s => s.sec)));   // 只標下面四格列出的族群，其餘只畫點
  S.forEach(s => { const r = 5 + 13 * Math.sqrt(s.amt / am);
    g += `<circle cx="${X(s.x).toFixed(1)}" cy="${Y(s.y).toFixed(1)}" r="${r.toFixed(1)}" fill="${BRQ[s.q][2]}" fill-opacity=".75" stroke="#fff" stroke-width="1.5"/>`;
    if (named.has(s.sec)) lab.push({x: X(s.x), y: Y(s.y), r, t: s.sec, c: BRQ[s.q][2]}); });
  lab.sort((a, b) => a.y - b.y).forEach((l, i, A) => {
    l.ly = l.y;
    for (let j = 0; j < i; j++) if (Math.abs(A[j].ly - l.ly) < 20 && Math.abs(A[j].x - l.x) < 150) l.ly = A[j].ly + 20;
    const right = l.x < W - 150;
    g += `<text x="${right ? l.x + l.r + 4 : l.x - l.r - 4}" y="${l.ly + 6}" text-anchor="${right ? "start" : "end"}" font-size="16" font-weight="900" fill="${l.c}" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(l.t)}</text>`;
  });
  return `<svg class="pe-rrg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}</svg>`;
}
function peCardQ(P) {
  const Q = P.quad, S = Q.secs, by = q => S.filter(s => s.q === q);
  const sec = s => `<div class="pe-sec"><b>${esc(s.sec)}${s.q5 != null && s.q5 !== s.q ? `<i>5 日前${BRQ[s.q5][0].replace("・", "")}</i>` : ""}</b>` +
    `<small>${Q.win} 日漲跌中位 <span class="${cls(s.y)}" style="display:inline">${sg(s.y, 2)}%</span>　資金流向 ${sg(s.x, 2)} pp</small>` +
    `<span>${s.reps.map(r => `${esc(nm5(r.name))} <b class="${cls(r.r3)}" style="display:inline">${sg(r.r3, 1)}%</b>`).join("　")}</span></div>`;
  const box = i => `<div class="pe-box"><span class="pe-hd ${BRQ[i][1]}">${BRQ[i][0]}（${by(i).length}）</span>${by(i).slice(0, 2).map(sec).join("") || `<div class="pe-empty">沒有族群在這一區</div>`}</div>`;
  const c = document.createElement("div"); c.className = "pe-card"; c.dataset.date = Q.date;
  c.innerHTML = peTop(Q.date, "選股 EDM ①｜價量四象限", `價量四象限：<span>錢往哪裡去</span>`,
      `${S.length} 個族群：近 ${Q.win} 日漲跌（成員中位）× 資金流向；泡泡＝當日成交金額`) +
    peKpi(BRQ.map((q, i) => ({lab: q[0], num: by(i).length, u: "族群", c: ["up", "gd", "", "dn"][i], sub: by(i)[0] ? by(i)[0].sec : "—"}))) +
    `<div class="pe-box pe-mx" style="padding:8px 14px">${peQuadSvg(Q)}</div>` +
    `<div class="pe-q4">${[0, 1, 2, 3].map(box).join("")}</div>` +
    peFoot(P, `資料日 ${Q.date}｜同網站「量價象限」：資金流向＝近 ${Q.win} 日族群成交占全市場比重減之前 20 日平均（pp）；漲跌＝成員 ${Q.win} 日漲跌幅中位數；代表個股＝成員 ${Q.win} 日漲跌，價強取最強 2 檔、價弱取最弱 2 檔。`);
  return c;
}

/* ②③④ 軌跡（trail，同網站「軌跡」頁籤：族群、近 20 日） */
const TRK = {
  B: {no: "②", tag: "動能軌跡", title: `動能軌跡：<span>誰改善、誰轉弱</span>`, up: "動能改善", dn: "動能轉弱", u: "%", d: 1,
      subt: "族群成員每日漲跌幅平均，近 20 日累計；看近 5 日累計往上還是往下", rep: "近 5 日漲跌加總", ru: "%",
      foot: "動能＝族群成員當日漲跌幅平均（%）"},
  A: {no: "③", tag: "量能軌跡", title: `量能軌跡：<span>誰放量、誰縮量</span>`, up: "放量", dn: "縮量", u: "pp", d: 2,
      subt: "族群成交金額占全市場比重，跟自己近 20 日平均比；近 20 日累計", rep: "近 5 日占比變化", ru: "pp",
      foot: "量能＝成員（當日成交占全市場比重 − 近 20 日平均）加總（pp）"},
  C: {no: "④", tag: "籌碼軌跡", title: `籌碼軌跡：<span>法人資金流入、流出</span>`, up: "法人流入", dn: "法人流出", u: "%", d: 1,
      subt: "外資＋投信淨買賣金額占族群成交金額比例，近 20 日累計", rep: "近 5 日法人淨額", ru: "億",
      foot: "籌碼＝（外資＋投信）淨買賣金額加總 ÷ 族群成交金額加總（%）；ETF 異動已含在投信裡，不重複加"}};
function peSpark(cum) {
  const W = 130, H = 70, n = cum.length, lo = Math.min(0, ...cum), hi = Math.max(0, ...cum), sp = (hi - lo) || 1;
  const X = i => 3 + i / (n - 1) * (W - 6), Y = v => 4 + (hi - v) / sp * (H - 8);
  const last = cum[n - 1], col = last >= 0 ? "#C8361E" : "#1E7B4F";
  const pts = cum.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect x="${X(n - 6)}" y="0" width="${X(n - 1) - X(n - 6) + 3}" height="${H}" fill="#F3E3C0" fill-opacity=".6"/>` +
    `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#B9AE93" stroke-width="1.5" stroke-dasharray="4 3"/>` +
    `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3"/><circle cx="${X(n - 1)}" cy="${Y(last)}" r="4" fill="${col}"/></svg>`;
}
function peCardT(P, kind) {

/* ⑤ 族群循環圖（RRG） */
function peRrg(R) {
  const W = 1008, H = 340, pad = 40, S = R.secs;
  const xs = S.flatMap(s => s.path.map(p => p[0])), ys = S.flatMap(s => s.path.map(p => p[1]));
  const span = (a, c) => { const m = Math.max(...a.map(v => Math.abs(v - c))) * 1.12 || 1; return [c - m, c + m]; };
  const [x0, x1] = span(xs, 100), [y0, y1] = span(ys, 100);
  const X = v => pad + (v - x0) / (x1 - x0) * (W - pad * 2), Y = v => H - pad + 6 - (v - y0) / (y1 - y0) * (H - pad * 2);
  const show = new Set(["lead", "imp", "lag"].flatMap(q => S.filter(s => s.q === q).slice(0, 3).map(s => s.sec)));
  const col = {lead: "#C8361E", imp: "#E2802C", weak: "#8A7B4E", lag: "#1E7B4F"};
  let g = `<rect x="${X(100)}" y="${Y(y1)}" width="${X(x1) - X(100)}" height="${Y(100) - Y(y1)}" fill="#FBE9E4"/>` +
    `<rect x="${X(x0)}" y="${Y(y1)}" width="${X(100) - X(x0)}" height="${Y(100) - Y(y1)}" fill="#FDF1E2"/>` +
    `<rect x="${X(100)}" y="${Y(100)}" width="${X(x1) - X(100)}" height="${Y(y0) - Y(100)}" fill="#F4F0E4"/>` +
    `<rect x="${X(x0)}" y="${Y(100)}" width="${X(100) - X(x0)}" height="${Y(y0) - Y(100)}" fill="#E6F2EA"/>` +
    `<line x1="${X(100)}" x2="${X(100)}" y1="${Y(y1)}" y2="${Y(y0)}" stroke="#B9AE93" stroke-width="2"/><line x1="${X(x0)}" x2="${X(x1)}" y1="${Y(100)}" y2="${Y(100)}" stroke="#B9AE93" stroke-width="2"/>` +
    `<text x="${X(x1) - 10}" y="${Y(y1) + 30}" text-anchor="end" font-size="26" font-weight="900" fill="#C8361E">領先</text>` +
    `<text x="${X(x0) + 10}" y="${Y(y1) + 30}" font-size="26" font-weight="900" fill="#E2802C">改善</text>` +
    `<text x="${X(x1) - 10}" y="${Y(y0) - 12}" text-anchor="end" font-size="26" font-weight="900" fill="#8A7B4E">轉弱</text>` +
    `<text x="${X(x0) + 10}" y="${Y(y0) - 12}" font-size="26" font-weight="900" fill="#1E7B4F">落後</text>` +
    `<text x="${W - pad}" y="${H - 6}" text-anchor="end" font-size="16" fill="#6B6452">相對大盤強弱 RS-Ratio →</text>` +
    `<text x="8" y="${pad - 14}" font-size="16" fill="#6B6452">↑ 強弱變化 RS-Momentum</text>`;
  const lab = [];
  S.forEach(s => {
    const c = col[s.q], on = show.has(s.sec), pts = s.path.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
    if (on) g += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" stroke-opacity=".55"/>`;
    g += `<circle cx="${X(s.x)}" cy="${Y(s.y)}" r="${on ? 8 : 5}" fill="${c}" fill-opacity="${on ? 1 : .45}"/>`;
    if (on) lab.push({x: X(s.x), y: Y(s.y), t: s.sec, c});
  });
  lab.sort((a, b) => a.y - b.y).forEach((l, i, A) => {          // 簡單避讓：同一帶的標籤往下錯開
    for (let j = 0; j < i; j++) if (Math.abs(A[j].ly - l.y) < 24 && Math.abs(A[j].x - l.x) < 170) l.y = A[j].ly + 24;
    l.ly = l.y;
    g += `<text x="${l.x + 12}" y="${l.y + 7}" font-size="19" font-weight="900" fill="${l.c}" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(l.t)}</text>`;
  });
  return `<svg class="pe-rrg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}</svg>`;
}
function peCard1(P) {

function peWatermark(cv, date) {

  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = .13; g.fillStyle = "#7a7468"; g.font = "bold 30px sans-serif"; g.rotate(-Math.PI / 7);
  for (let y = -cv.width; y < cv.height + cv.width; y += 260) for (let x = -cv.width; x < cv.width * 2; x += 520) g.fillText(wm, x, y);
  g.restore();
}
async function pePng(mk, P, name, btn) {

    document.body.appendChild(host); const c = mk(P); host.appendChild(c);
    const cv = await window.html2canvas(c, {scale: 1, width: 1080, height: 1350, backgroundColor: "#ffffff", logging: false});
    peWatermark(cv, c.dataset.date || P.chips.date); host.remove();
    const blob = await new Promise(ok => cv.toBlob(ok, "image/png")), a = document.createElement("a");

}
