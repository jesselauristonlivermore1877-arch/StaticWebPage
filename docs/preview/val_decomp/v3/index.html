<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>估值拆解 v3 圖版（預覽）</title>
<style>
/* 預覽外殼：只放頁面底色與頂列；圖表本體全在 vd3.js（日後正式套版載入同一支） */
:root{--vd-pbg:#f6f5f1;--vd-pink:#1d1d1b;--vd-pink2:#5c5b57;--vd-pline:#dcd9d0;--vd-pcard:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--vd-pbg:#16171a;--vd-pink:#ecebe7;--vd-pink2:#a4a29c;--vd-pline:#34363b;--vd-pcard:#1f2125}}
:root[data-theme="dark"]{--vd-pbg:#16171a;--vd-pink:#ecebe7;--vd-pink2:#a4a29c;--vd-pline:#34363b;--vd-pcard:#1f2125}
*{box-sizing:border-box}
body{margin:0;background:var(--vd-pbg);color:var(--vd-pink);font:15px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}
.vd-ptop{padding:8px 16px;border-bottom:1px solid var(--vd-pline);display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--vd-pink2)}
.vd-ptop a{color:inherit}
.vd-ptop button{background:var(--vd-pcard);color:var(--vd-pink);border:1px solid var(--vd-pline);border-radius:6px;padding:2px 10px;cursor:pointer;font:inherit}
.vd-pmain{max-width:1132px;margin:0 auto;padding:0 16px}
</style></head><body>
<div class="vd-ptop"><b style="color:var(--vd-pink)">預覽 v3：估值拆解改成圖</b><a href="../">對照 v2（表格版）</a><button id="vd-pth" type="button">切換深淺色</button></div>
<div class="vd-pmain"><div id="vd-pv">載入中…</div></div>
<script src="vd3.js"></script>
<script>
(function () {
  var root = document.getElementById("vd-pv"), v = "?v=" + Date.now();
  document.getElementById("vd-pth").onclick = function () {
    var h = document.documentElement, dk = h.dataset.theme ? h.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    h.dataset.theme = dk ? "light" : "dark";
  };
  /* 讀正式檔 docs/data/val_decomp.json（每日戰情更新產出）；讀不到才退回 v2 資料夾的快照 data.json */
  var SRC = "每日戰情更新正式檔 data/val_decomp.json";
  fetch("../../../data/val_decomp.json" + v).then(function (r) { if (!r.ok) throw r.status; return r.json(); })
    .catch(function () { SRC = "預覽快照 preview/val_decomp/data.json"; return fetch("../data.json" + v).then(function (r) { return r.json(); }); })
    .then(function (d) { if (!window.vd3Mount) throw "vd3.js 沒有載入"; window.vd3Mount(root, d, SRC); })
    .catch(function (e) { root.textContent = "資料載入失敗：" + e; });
})();
</script></body></html>
