<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>河流圖估值通則預覽</title>
<script>try{if(matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.dataset.theme="light"}catch(e){}</script>
<style>
:root{
  --up:#E5484D; --down:#12A366; --acc:#D9A441;
  --r:12px; --w:2400px;
}
:root{
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
/* 🟢 GEA 協同修改：黑化設計，純黑背景與深灰線條，拿掉海軍藍 */
[data-theme="dark"]{
  --bg:#000000; --surface:#111111; --raise:#1E1E1E; --chip:#2B2B2B;
  --ink-1:#F5F5F5; --ink-2:#A3A3A3; --ink-3:#666666; --line:#2A2A2A;
  --barbg:#1F1F1F;
}
[data-theme="light"]{
  --bg:#F4F6F4; --surface:#FFFFFF; --raise:#EDF0EE; --chip:#E4E9E6;
  --ink-1:#0F161D; --ink-2:#44515E; --ink-3:#68757F; --line:#DDE3E0;
  --barbg:#E7ECE9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink-1); font-family:var(--sans);
  font-size:16px; line-height:1.6; letter-spacing:.005em; font-weight:450;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--w); margin:0 auto; padding:0 20px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.015em; font-weight:500}
:root{--rvfwd:#6fb3d9}
.rv-root,.rv-box{min-width:0}
.rv-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.rv-bar input[type=date]{background:var(--chip);border:1px solid var(--line);color:var(--ink-1);border-radius:6px;padding:1px 5px;font-size:12px}
.rv-pill{background:var(--chip);color:var(--ink-1);border:1px solid var(--line);border-radius:999px;padding:2px 11px;font-size:12.5px;cursor:pointer}
.rv-pill.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.rv-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.rv-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--chip);font-size:12.5px;cursor:pointer;border:1px solid transparent}
.rv-chip.on{border-color:var(--acc);background:var(--raise);font-weight:700}
.rv-chip i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.rv-chip i.hot{background:var(--acc)} .rv-chip i.cold{background:var(--rvfwd)}
.rv-chip b{font-weight:500;color:var(--ink-3);font-size:11px}
.rv-h{font-size:15px;font-weight:700;margin:6px 0 2px}
.rv-heat{font-size:11px;border-radius:5px;padding:0 5px;font-weight:700;vertical-align:middle}
.rv-heat.hot{background:rgba(217,164,65,.18);color:var(--acc)} .rv-heat.cold{background:rgba(111,179,217,.16);color:var(--rvfwd)} .rv-heat.norm{background:var(--chip);color:var(--ink-3)}
.rv-chart{position:relative;margin-top:4px} .rv-chart svg{display:block;width:100%;height:auto}
.rv-tip{position:absolute;pointer-events:none;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;display:none;z-index:3}
.rv-twrap{overflow-x:auto}
.rv-t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;min-width:640px}
.rv-t th{color:var(--ink-3);font-weight:600;text-align:right;padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.rv-t th:first-child,.rv-t td:first-child{text-align:left}
.rv-t td{padding:4px 5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.rv-t tr.m{cursor:pointer} .rv-t tr.m:hover td,.rv-t tr.m.on td{background:var(--raise)}
.rv-hl{color:var(--acc);font-weight:700} .rv-fw{color:var(--rvfwd)} .rv-dim{color:var(--ink-3)}
.rv-legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);margin:4px 0;flex-wrap:wrap}
.rv-legend span::before{content:"";display:inline-block;width:16px;border-top:2px solid var(--c);margin-right:4px;vertical-align:middle}
.rv-legend span.d::before{border-top-style:dashed} .rv-legend span.rv-dim::before{display:none}
.rv-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;font-size:12.5px;margin:6px 0;padding:8px 10px;background:var(--raise);border-radius:8px}
.rv-kv b{color:var(--ink-3);font-weight:500;margin-right:6px} .rv-kv a{color:var(--rvfwd)}
.rv-note{font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.7}
.rv-box{margin-top:10px}
:root{--rv-ttm:#B79CFF;--rv-cy:#FFB020;--rv-fwd:#3FC4FF;--rv-tagtxt:#111}
[data-theme="light"]{--rv-ttm:#6A44E0;--rv-cy:#C06A00;--rv-fwd:#0073C4;--rv-tagtxt:#fff}
.rv-key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin:6px 0 4px;align-items:center}
.rv-key .k{display:inline-flex;align-items:center;gap:6px}
.rv-key .k i{display:inline-block;width:22px;height:4px;border-radius:2px}
.rv-key .k b{font-weight:800}
.rv-key .ttm i{background:var(--rv-ttm)} .rv-key .ttm b{color:var(--rv-ttm)}
.rv-key .cy i{background:var(--rv-cy)} .rv-key .cy b{color:var(--rv-cy)}
.rv-key .fwd i{background:var(--rv-fwd)} .rv-key .fwd b{color:var(--rv-fwd)}
.rv-key .px i{background:var(--ink-1)}
:root{--br-up2:#FF9F7A;--br-dn2:#6FD3A0;--bk-tp:#FF6FB5;--bk-rep:#FFD166}
.rv-adj{font-size:12px;font-weight:700;color:var(--ink-1);background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
.rv-kv b.ttm{color:var(--rv-ttm);font-weight:800} .rv-kv b.cy{color:var(--rv-cy);font-weight:800} .rv-kv b.fwd{color:var(--rv-fwd);font-weight:800}
.rv-t th.cy,.rv-t td.cy{color:var(--rv-cy);font-weight:700} .rv-t th.fwd,.rv-t td.fwd{color:var(--rv-fwd);font-weight:700}
.rv-note b.ttm{color:var(--rv-ttm)} .rv-note b.cy{color:var(--rv-cy)} .rv-note b.fwd{color:var(--rv-fwd)}
.rv-root,.rv-box,.rv-stk,.rv-kv,.rv-key,.rv-note,.ir-root,.ir-box,.ir-wrap,.ir-sec,.ir-links,.ir-warn{white-space:normal}
.rv-kv>div{min-width:0;overflow-wrap:anywhere;line-height:1.6}
/* 預覽頁自己的版面（af- 前綴） */
.af{max-width:1500px;margin:0 auto;padding:16px}
.af h1{font-size:22px;margin:4px 0 6px} .af h2{font-size:18px;margin:22px 0 8px} .af h3{font-size:16px;margin:0}
.af p,.af li{font-size:14px;color:var(--ink-2);line-height:1.7}
.af-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;min-width:0}
.af-con li{color:var(--ink-1);font-size:15px}
.af-tw{overflow-x:auto} .af-t{border-collapse:collapse;font-size:13px;width:100%}
.af-t th,.af-t td{padding:4px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.af-t th:first-child,.af-t td:first-child{text-align:left}
.af-t th{color:var(--ink-3);font-weight:600}
.af-t td.on{color:var(--acc);font-weight:800}
.af-pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:800;background:var(--acc);color:#000;margin-left:6px;vertical-align:middle}
.af-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.af-hd small{color:var(--ink-3);font-size:12.5px}
.af-why{font-size:13.5px;color:var(--ink-1);margin:6px 0}
.af-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:8px}
@media (min-width:1100px){.af-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.af-cap{font-size:13px;font-weight:800;margin-bottom:2px}
.af a{color:var(--rv-fwd)}
.af-nav{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.af-nav a{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink-1);text-decoration:none}
.af-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:4px 0}
.af-key i{display:inline-block;width:22px;height:4px;border-radius:2px;background:var(--acc);vertical-align:middle;margin-right:5px}
@media (max-width:560px){.af{padding:10px} .af-t{font-size:12px}}
</style>
</head>
<body>
<div class="af" id="af"></div>
<script>
const nf = (n, d = 0) => (n === null || n === undefined || Number.isNaN(n)) ? "—"
  : Number(n).toLocaleString("zh-TW", {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (n, d = 0) => (n === null || n === undefined) ? "—" : (n > 0 ? "+" : "") + nf(n, d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[m]));
const el = (t, c, h, s) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; if (s) e.style.cssText = s; return e; };
const pgZoom = () => parseFloat(getComputedStyle(document.body).zoom) || 1;
var _rvData = null, _rvErr = null, _rvWait = null;
function rvLoad() {
  if (_rvData || _rvErr) return Promise.resolve(_rvData);
  if (_rvWait) return _rvWait;
  _rvWait = fetch("data/river.json" + _dv(), {cache: "force-cache"})
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(j => (_rvData = j))
    .catch(e => { _rvErr = e; return null; });
  return _rvWait;
}
async function rvBarsAll() {
  await stkBars("2330");                     // 借 stkBars 的快取把整份 stock_bars 載進來
  return _barsCache;
}
const RV_HL = {hot: "high", norm: "mid", cold: "low"}, RV_HLP = {hot: "p75", norm: "p50", cold: "p25"},
      RV_HN = {hot: "熱", norm: "常", cold: "冷"}, RV_LMH = {low: "低", mid: "中", high: "高"};
const rvF2 = x => x == null ? "—" : (+x).toLocaleString("en", {maximumFractionDigits: 2, minimumFractionDigits: 2});
const rvF0 = x => x == null ? "—" : Math.round(x).toLocaleString("en");
const rvFq = x => x ? `${Math.floor(x / 10)}Q${x % 10}` : "—";
function rvQ(v, p) { if (!v.length) return null; const a = [...v].sort((x, y) => x - y), i = (a.length - 1) * p,
  lo = Math.floor(i), hi = Math.ceil(i); return a[lo] + (a[hi] - a[lo]) * (i - lo); }
function rvRank(v, x) { if (x == null || !v.length) return null; return Math.round(v.filter(y => y <= x).length / v.length * 100); }
function rvHeat(R, s) { return ((R.sectors[s] || {}).heat || {}).state || "norm"; }
function rvStart(R, sec, win, cust) {
  const D0 = R.pe_dates, last = D0.length - 1;
  if (win === "cust" && cust) return cust;
  if (win === "auto" && sec && R.sectors[sec] && R.sectors[sec].rerate) return R.sectors[sec].rerate;
  const n = {"1y": 252, "3y": 756, "5y": 1260}[win === "auto" ? "3y" : win] || 756;
  return D0[Math.max(0, last - n + 1)];
}
function rvBand(R, sec, win, cust) {
  const P = R.pops[R.sectors[sec].pop] || {pe: [], label: "—", n: 0}, st = rvStart(R, sec, win, cust);
  const idx = Math.max(0, R.pe_dates.findIndex(d => d >= st));
  const v = P.pe.slice(idx).filter(x => x != null);
  return {p25: rvQ(v, .25), p50: rvQ(v, .5), p75: rvQ(v, .75), vals: v, start: st, label: P.label, n: P.n, series: P.pe, from: idx};
}
/* 🟢 2026-09-25 股本還原：事件日之前的收盤 ÷ f，跟 river.json 的 EPS 同一套股本（現在的股本）。
   只在河流圖這裡還原；stock_bars 的 K 線保持原始價格（Evans：要跟券商軟體對得上）。 */
function rvAdjClose(st, D0, c) {
  const A = st.adj || [];
  if (!A.length) return c;
  return c.map((v, i) => { if (v == null) return v; let f = 1; for (const [d, x] of A) if (D0[i] < d) f *= x; return v / f; });
}
function rvAdjTag(st, D0) {
  return (st.adj || []).filter(([d]) => d > D0[0])
    .map(([d, x, k]) => `<span class="rv-adj">已還原${esc(k)} 1:${(+x).toFixed(2)}（${esc(d)}）</span>`).join("");
}
/* 🟢 10-11（Evans P0-4）：按月推進 —— 最新一季財報之後，每月營收公布（次月 10 日）就把近四季 EPS 換成「月營收推估入帳」（river.json eps_m） */
/* 🟢 10-26 08:50（總指揮雲端 3）：新一季三個月營收都已公布、財報還沒出 → 暫估步階（旗標 2，基本盤 TTM 畫虛線；river.json qest），取代同期的月推估 */
function rvEpsSteps(st) {
  const E = st.eps || [], last = E.at(-1), X = st.qest;
  let M = last ? (st.eps_m || []).filter(x => x[1] === last[1] && x[0] > last[0]).map(x => [x[0], x[1], x[2], 1]) : [];
  if (X && last && X.d >= last[0]) { M = M.filter(x => x[0] < X.d); M.push([X.d, +X.q.replace("Q", ""), X.eps, 2]); }
  return E.concat(M);
}
/* 🟢 10-26 08:50（總指揮雲端 4）：最新財報季狀態（river.json fst）——「2026Q2（Q3 法定 11/14 前公布）」，讓人知道不是資料壞掉 */
function rvFst(f) {
  if (!f) return "—";
  const nq = f.nx.slice(4), dl = nq === "Q4" ? `年報法定 ${f.due} 前公布` : `${nq} 法定 ${f.due} 前公布`;
  if (f.src !== "財報") return `${esc(f.q)}（<span class="rv-tag">${esc(f.src)}</span>${f.d ? ` ${esc(f.d.slice(5))}` : ""}；正式財報 ${esc(f.due)} 前公布）`;
  return `${esc(f.q)}（${dl}${f.est ? "；已用月營收暫估" : ""}）`;
}
function rvEpsAt(st, d) { let e = null, q = null, m = 0; for (const s of rvEpsSteps(st)) { if (s[0] <= d) { e = s[2]; q = s[1]; m = s[3] || 0; } } return [e, q, m]; }

/* 折線（窄圖一律把提示框放在點的旁邊：左半放右、右半放左） */
function rvSvg(o) {
  const {dates, lines, hlines = [], h = 220, dots = []} = o, W = 1000, PL = 58, PR = 150, PT = 10, PB = 22, all = [];
  lines.forEach(l => l.v.forEach(x => x != null && all.push(x))); hlines.forEach(l => l.y != null && all.push(l.y));
  (o.bands || []).forEach(b => { b.lo.forEach(x => x != null && all.push(x)); b.hi.forEach(x => x != null && all.push(x)); });
  dots.forEach(d => d.y != null && all.push(d.y));      // 🟢 09-25：法人報告版的單篇目標價點
  const box = el("div", "rv-chart");
  if (!all.length || dates.length < 2) { box.appendChild(el("div", "sub", "資料不足，畫不出來")); return box; }
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * .06 || 1; lo -= pad; hi += pad;
  const X = i => PL + (W - PL - PR) * i / (dates.length - 1), Y = v => PT + (h - PT - PB) * (1 - (v - lo) / (hi - lo));
  const path = (v, step) => { let s = "", pen = false; v.forEach((y, i) => { if (y == null) { pen = false; return; }
    if (!pen) { s += `M${X(i)},${Y(y)}`; pen = true; } else s += step ? `H${X(i)}V${Y(y)}` : `L${X(i)},${Y(y)}`; }); return s; };
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4;
    g += `<line x1="${PL}" x2="${W - PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${PL - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(1)}</text>`; }
  [0, Math.floor(dates.length / 2), dates.length - 1].forEach((i, k) => g += `<text x="${X(i)}" y="${h - 5}" text-anchor="${k === 0 ? "start" : k === 2 ? "end" : "middle"}" font-size="11" fill="var(--ink-3)">${dates[i]}</text>`);
  hlines.forEach(l => { if (l.y == null) return; g += `<line x1="${PL}" x2="${W - PR}" y1="${Y(l.y)}" y2="${Y(l.y)}" stroke="${l.c}" stroke-width="${l.w}" stroke-dasharray="${l.dash || ""}"/><text x="${W - PR + 6}" y="${Y(l.y) + 4}" font-size="11" fill="${l.c}">${l.name} ${l.y.toFixed(1)}</text>`; });
  (o.bands || []).forEach(b => {        // 同一把尺的低～高之間鋪一層淡色帶：一眼看出區間
    const pts = []; b.lo.forEach((y, i) => { if (y != null && b.hi[i] != null) pts.push(i); });
    if (pts.length > 1) g += `<path d="M${X(pts[0])},${Y(b.hi[pts[0]])}` + pts.map(i => `L${X(i)},${Y(b.hi[i])}`).join("") +
      pts.slice().reverse().map(i => `L${X(i)},${Y(b.lo[i])}`).join("") + `Z" fill="${b.c}" fill-opacity="${b.a || .12}"/>`;
  });
  dots.forEach(d => { if (d.y == null) return;
    g += `<circle cx="${X(d.i)}" cy="${Y(d.y)}" r="5" fill="${d.c}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(d.t || "")}</title></circle>`; });
  const tags = [];
  lines.forEach(l => { g += `<path d="${path(l.v, l.step)}" fill="none" stroke="${l.c}" stroke-width="${l.w}" stroke-dasharray="${l.dash || ""}" stroke-linecap="round"/>`;
    const li = l.v.map((y, i) => y == null ? -1 : i).filter(i => i >= 0).at(-1);
    if (l.tag && li != null) tags.push({y: Y(l.v[li]), t: l.tag, c: l.c}); });
  tags.sort((a, b) => a.y - b.y);                  // 右側標籤由上往下排開，不互相壓住
  for (let k = 1; k < tags.length; k++) if (tags[k].y - tags[k - 1].y < 16) tags[k].y = tags[k - 1].y + 16;
  tags.forEach(t => { const tw = t.t.length * 11.5 + 10;
    g += `<rect x="${W - PR + 3}" y="${t.y - 9}" width="${tw}" height="17" rx="4" fill="${t.c}"/>` +
         `<text x="${W - PR + 8}" y="${t.y + 4}" font-size="11.5" font-weight="700" fill="var(--rv-tagtxt)">${t.t}</text>`; });
  g += `<line class="rv-x" y1="${PT}" y2="${h - PB}" stroke="var(--ink-3)" stroke-dasharray="2 3" style="display:none"/>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${h}">${g}<rect x="${PL}" y="0" width="${W - PL - PR}" height="${h}" fill="transparent"/></svg><div class="rv-tip"></div>`;
  const svg = box.querySelector("svg"), tip = box.querySelector(".rv-tip"), vx = box.querySelector(".rv-x");
  svg.onmousemove = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(dates.length - 1, Math.round((sx - PL) / (W - PL - PR) * (dates.length - 1))));
    vx.setAttribute("x1", X(i)); vx.setAttribute("x2", X(i)); vx.style.display = "";
    tip.innerHTML = `<b>${dates[i]}</b><br>` + lines.filter(l => l.v[i] != null).map(l => `${esc(l.name)} ${rvF2(l.v[i])}`).join("<br>");
    tip.style.display = "block";
    const rw = r.width / pgZoom(), px = X(i) / W * rw;     // ÷ zoom：字級放大時不偏（見 pgZoom）
    tip.style.left = (px < rw / 2 ? px + 14 : px - 14 - tip.offsetWidth) + "px"; tip.style.top = "6px";
  };
  svg.onmouseleave = () => { tip.style.display = "none"; vx.style.display = "none"; };
  return box;
}

          `<td class="num">${v.n ?? 0}／${p.days}</td><td class="num">${v.cv_full == null ? "—" : f3(v.cv_full)}</td>` +
          `<td class="num">${v.p25 == null ? "—" : `${f2(v.p25)}／${f2(v.p50)}／${f2(v.p75)}`}</td><td class="num">${f2(now)}</td></tr>`; }).join("") +
      `</tbody></table></div>`));
    box.appendChild(el("div", "rv-note", `比較窗 ${esc(p.w0 || "—")} 起（PB 有資料的期間）；變異係數＝標準差 ÷ 平均，越小越穩；有效天數不到比較窗 6 成的不參選。`));
    const g = el("div", "af-grid"), a = el("div"), b = el("div");
    a.appendChild(el("div", "af-cap", "原版（正式河流圖）"));
    a.appendChild(rvMainNode(R, SB, c, "auto"));
    b.appendChild(el("div", "af-cap", mk ? `主尺版：${BASE[mk]} × 自身 ${mk} 25／50／75 分位` : "主尺版：無（三把尺都不夠資料）"));
    if (mk) {
      const D0 = SB.dates, v = p.cv[mk], bars = SB.bars[c];
      const base = mk === "PE" ? D0.map(dd => rvEpsAt(st, dd)[0]) : rvAdjClose(st, D0, mk === "PB" ? p.bvps : p.rps);
      const L = q => base.map(x => x == null ? null : x * q);
      const lo = L(v.p25), mid = L(v.p50), hi = L(v.p75), cA = rvAdjClose(st, D0, bars.c);
      const last = arr => arr.filter(x => x != null).at(-1);
      b.appendChild(el("div", "af-key", `<span><i></i><b>${mk} 主尺</b>${BASE[mk]} × 自身 ${mk}（粗線＝50 分位、虛線＝25／75 分位、色帶＝25～75）</span><span><i style="background:var(--ink-1)"></i><b>收盤</b></span>` + rvAdjTag(st, D0)));
      b.appendChild(rvSvg({dates: D0, h: 280, bands: [{lo, hi, c: "var(--acc)", a: .12}], lines: [
        {v: lo, c: "var(--acc)", w: 1.6, dash: "7 5", name: `${mk} 25 分位`, step: 1},
        {v: mid, c: "var(--acc)", w: 2.8, name: `${mk} 50 分位`, tag: `${mk} 中 ${rvF0(last(mid))}`, step: 1},
        {v: hi, c: "var(--acc)", w: 1.6, dash: "7 5", name: `${mk} 75 分位`, step: 1},
        {v: cA, c: "var(--ink-1)", w: 2, name: "收盤", tag: `收盤 ${rvF0(last(cA))}`}]}));
      const now = mk === "PE" ? (st.loss ? null : +st.pe) : p.now[mk.toLowerCase()];
      const pos = now == null ? "—" : now < v.p25 ? "25 分位以下" : now < v.p50 ? "25～50 分位" : now < v.p75 ? "50～75 分位" : "75 分位以上";
      b.appendChild(el("div", "rv-kv", `<div><b>${BASE[mk]}</b><span class="num">${f2(last(base))}</span>${mk === "PS" && (p.rps_m || []).at(-1) === 1 ? "（近 12 月月營收）" : mk === "PS" ? "（近四季營收）" : ""}</div>` +
        `<div><b>價格帶 25／50／75</b><span class="num">${rvF0(last(lo))}／${rvF0(last(mid))}／${rvF0(last(hi))}</span></div>` +
        `<div><b>現在 ${mk}</b><span class="num">${f2(now)}</span>，位於自身歷史 ${pos}</div>`));
    } else b.appendChild(el("div", "sub", "PE、PB、PS 有效天數都不足，維持原版。"));
    g.appendChild(a); g.appendChild(b); box.appendChild(g);
    root.appendChild(box);
  });
  root.appendChild(el("div", "rv-note", "量化統計結果，非投資建議。圖上只寫分位，不寫高估低估；價格帶＝每股數字 × 自身歷史倍數分位，不是目標價。"));
})();
</script>
