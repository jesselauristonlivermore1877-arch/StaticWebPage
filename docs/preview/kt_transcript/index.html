得最核心的原因是 cost of living，生活成本真的變得越來越無法負擔了。那當然這邊有一部分原因是也是因為川普發起這個伊朗戰爭嘛。", "point": "講者認為生活成本高漲是影響選情的關鍵，部分原因與戰爭導致的經濟壓力有關。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 11}, {"t": "0:04:48", "sec": 288, "quote": "川普發起這個伊朗戰爭嘛，那戰爭導致油價增加，然後油價增加就是當然所有東西的價格都會增加嘛，那一般的一個 average 的美國人，他不一定有股票。", "point": "講者提到川普發動伊朗戰爭導致油價上漲，進而引發物價全面連動。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 11}, {"t": "0:05:40", "sec": 340, "quote": "川普當然也是有做很多大家非常討厭、覺得不受歡迎的行為，像是 ICE，像是 Liberation Day 那些關稅政策啊，然後除此之外還有一點，我們今天特別想討論的，就是 AI 跟資料中心。", "point": "講者列舉川普受爭議的政策，包括移民執法與關稅，並引出 AI 與資料中心議題。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 13}, {"t": "0:06:24", "sec": 384, "quote": "上禮拜台股是因為這次期中選舉的結果呢，是跌到連國安基金都出來護盤的程度。那會跌得這麼誇張呢，就是因為民主黨他們是很反對資料中心的嘛。", "point": "講者指出因民主黨反對資料中心，導致台股大跌至國安基金進場護盤。", "sectors": ["晶圓代工與製造", "伺服器與品牌組裝"], "stocks": [], "area": "產業", "tone": "空", "seg": 15}, {"t": "0:06:53", "sec": 413, "quote": "我們蓋不了這麼多資料中心，當然就用不到這麼多的 GPU 伺服器，所以說整個半導體供應鏈就會跌嘛。所以這是一個很直接的一個結果。", "point": "講者分析若資料中心建設受阻，將減少 GPU 伺服器需求並衝擊半導體供應鏈。", "sectors": ["伺服器與品牌組裝", "晶圓代工與製造"], "stocks": [], "area": "產業", "tone": "空", "seg": 16}, {"t": "0:08:31", "sec": 511, "quote": "他們認為資料中心會把他們的電費變貴，讓他們的用水受到影響。因為資料中心就當然我們現在都在講一些幾瓦等級的、Gigawatt 等級的超大用電量的資料中心。", "point": "講者提到美國民眾擔心大型資料中心的高耗電與耗水會導致電費上漲及影響民生用水。", "sectors": ["伺服器電源與儲能", "電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 20}, {"t": "0:15:08", "sec": 908, "quote": "在很多人眼中，AI 資料中心就是一個大水怪嘛，對不對？超級吃水，它吃水吃得比當地的居民多超級多倍，然後會搞到沒有人有水可以用。", "point": "講者提到大眾普遍認為 AI 資料中心耗水量極大，可能導致當地居民用水短缺。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 27}, {"t": "0:20:05", "sec": 1205, "quote": "他們現在都有用兩個技術，一個叫做封閉式循環冷卻，OK，就是他們的那個冷卻的用水是在一個 close loop 當中的，是同一個封閉的水源不斷循環。", "point": "講者說明資料中心採用封閉式循環冷卻與乾式冷卻技術，以降低對外部水源的依賴。", "sectors": ["散熱與液冷", "電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 37}, {"t": "0:20:45", "sec": 1245, "quote": "在用電方面，我們完全不用幫資料中心護航，它就真的非常耗電，OK，你今天蓋個資料中心 1GW，它最高電力容量就是要 1GW。", "point": "講者指出資料中心確實非常耗電，單一資料中心的電力容量需求可達 1GW。", "sectors": ["伺服器電源與儲能", "電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 39}, {"t": "0:24:42", "sec": 1482, "quote": "科技巨頭都會做最基本的承諾，都會有，就是包括他們絕對不會影響到民生用電的電費，OK，他們自己新增的電網成本都會自己吸收。", "point": "講者提到科技巨頭在建設資料中心時，會向政府與居民承諾自行吸收電網成本，不影響民生電費。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 47}, {"t": "0:28:20", "sec": 1700, "quote": "耶魯大學的他們做的一份 AI 影響就業的報告，他們的結論是 AI 沒有造成任何的有意義的失業狀況出現。", "point": "講者引用耶魯大學研究指出，目前 AI 尚未對就業市場造成顯著的失業影響。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 54}, {"t": "0:28:42", "sec": 1722, "quote": "我們之前看到的大部分的科技公司的大裁員呢，其實 AI 主要是被拿來當藉口啊，就他們主要還是在修正組織的膨脹，修正以前的 overhire 的狀況。", "point": "講者認為科技業裁員主因是修正過去過度招聘與組織膨脹，而非 AI 取代人力。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 55}, {"t": "0:35:15", "sec": 2115, "quote": "美國人就是討厭 AI，然後討厭 AI 的人也取得了國會大多數了，就是民主黨嘛，所以我們要討論的是，首先這件事情它能夠造成的影響是什麼，然後這個想法，這個風潮。", "point": "講者指出美國民主黨在國會取得多數，且普遍存在反 AI 的情緒，這將影響 AI 產業的發展。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 69}, {"t": "0:36:50", "sec": 2210, "quote": "有一個 Microsoft 跟 Gallup 的研究，他們發現說，一個人他只要用 AI 用得越頻繁，他就越不會擔心 AI，那這件事情是橫跨全世界各個國家，在每個地方都有一樣的狀況。", "point": "講者引用研究指出，頻繁使用 AI 的使用者對 AI 的擔憂程度較低，此現象具有全球普遍性。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 72}, {"t": "0:37:30", "sec": 2250, "quote": "一般的小費者沒有那麼多事情給 AI 做，我上禮拜不是有在社群媒體跟大家分享，就是我用我的 AI Agent，就是我現在是用 OpenAI 的 Dots，它兩個禮拜幫我省了 22 萬台幣。", "point": "講者分享使用 OpenAI 的 AI Agent (Dots) 在兩週內創造了約 22 萬台幣的價值，但認為一般消費者尚缺乏高價值的應用場景。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 73}, {"t": "0:41:00", "sec": 2460, "quote": "AI Agent 今天真的要成為一個消費者的主流產品，它必須要什麼事情都能做，而且幾乎所有事情都可以 end-to-end 完全自己完成，這個時候才是消費者的 AI Agent 解鎖的時候。", "point": "講者認為 AI Agent 若要成為主流消費產品，必須具備全自動化處理各項任務的能力，而非僅止於輔助。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 80}, {"t": "0:42:00", "sec": 2520, "quote": "這些工作的價值其實全部算一算，全部加起來，它真的兩週就幫我產生了二十幾萬的價值，這是貨真價實的價值，這是真金白銀的價值喔，這真的都是如果我沒有用 Dots，我會需要花錢。", "point": "講者強調 AI Agent 在專案管理、回信及產品原型製作等工作上，能為企業主創造實質的經濟價值。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 83}, {"t": "0:41:40", "sec": 2500, "quote": "它有一個 last mile problem，它的最後這一哩路往往沒有辦法自己走完，你今天要訂餐廳的時候，它可以幫你找到說，你要的價位、你要的料理、在你要的位置有哪幾間可以選擇。", "point": "講者指出目前的 AI Agent 存在「最後一哩路」的問題，雖然能提供資訊分析，但仍難以完全獨立完成所有執行步驟。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 82}, {"t": "0:42:30", "sec": 2550, "quote": "一般的小費者，他沒有影片要剪啊，他沒有 Podcast 要賣啊，他沒有產品原型要做啊，他平時生活本來就沒有多少高價值的任務可以給 AI 處理，那 AI 怎麼能夠幫他產生價值？", "point": "講者分析 AI Agent 對一般消費者的價值有限，因為其日常生活中缺乏如剪輯影片或開發產品等高價值的任務需求。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 84}, {"t": "0:41:20", "sec": 2480, "quote": "它確實什麼事情都可以做，就從訂餐廳啊、購物啊、規劃旅行、聯絡客服啊、助理工作啊，它真的目前的 Agent 就已經什麼都可以做，但問題是出在後者，就是它並不是每一件事情都可以。", "point": "講者說明目前的 AI Agent 雖能涵蓋訂餐、旅遊規劃等多樣化功能，但仍受限於無法全自動化完成所有流程。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 81}, {"t": "0:43:30", "sec": 2610, "quote": "我覺得更需要去解決的反而工具的問題，我覺得工具這邊就真的是，畢竟因為整個網路世界都是為了人類操作而設計的，那今天我們是被迫 Agent 去用這個為人類設計出來的環境。", "point": "講者認為 AI Agent 發展的瓶頸在於現有的網路環境是為人類設計的，Agent 在串接與操作這些工具時面臨不自然的限制。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 86}, {"t": "0:43:55", "sec": 2635, "quote": "連最基本的大家最常用的 Gmail 的寄信 connector 都有很大的問題，我不知道是只有 OpenAI 這樣子還是怎樣，反正 OpenAI 的這個 Gmail 的 connector 一直有一個大問題。", "point": "講者指出 OpenAI 的 Gmail 串接器存在技術問題，例如無法正確摺疊歷史信件，影響了 AI Agent 的實用性。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 86}, {"t": "0:42:45", "sec": 2565, "quote": "Sam Altman 他上那個 Cheeky Pine 的節目，他就有提到說，他認為 Personal AI Agents 還會需要幾個小 breakthrough 才會 just works，just works 的意思就是基本上就是我們剛剛在講的那一種。", "point": "講者引用 Sam Altman 的觀點，指出個人 AI Agent 仍需技術突破才能達到完全自動化且值得信賴的運作水準。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 84}, {"t": "0:43:15", "sec": 2595, "quote": "Sam Altman 覺得我們在幾個小 breakthrough，還需要幾個小 breakthrough 啦，那他沒有具體講是什麼，但可能模型面啊、記憶面啊、這個 context 的 management 啊、whatever harness。", "point": "講者引述 Sam Altman 的看法，認為 AI 模型在記憶管理與上下文處理等方面仍有進步空間，以實現更完善的 Agent 功能。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 85}, {"t": "0:40:05", "sec": 2405, "quote": "我的 Agent 還會幫我就是當我助理嘛，幫我做專案的管理啊、幫我回信啊等等的，然後也幫我做產品的 prototype 啊，這些工作的價值其實全部算一算，全部加起來，它真的兩週就幫我產生了二十幾萬。", "point": "講者分享 AI Agent 在專案管理、回信及產品原型製作等工作上，能為企業主創造實質的經濟價值。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 79}, {"t": "0:39:20", "sec": 2360, "quote": "它都會客製化到說，去讀完之前我跟這個廠商的所有來回，了解我們所有歷史，然後也去了解點進這個公司的官網去了解他們在做的產品、他們的服務，然後做一個非常客製化的信去 outreach。", "point": "講者描述 AI Agent 能深度分析廠商歷史往來與官網資訊，生成高度客製化的開發信件，提升商務溝通效率。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 77}, {"t": "0:38:25", "sec": 2305, "quote": "我只花十分鐘喔，我就直接跟我的 Dots 說，我空出了這兩檔業配，你去幫我把它填補起來，OK，你幫我找到新的廠商把這兩檔賣給他們，那你的來源呢，可能有兩種。", "point": "講者分享如何利用 AI Agent (Dots) 在短時間內處理廣告業配的銷售與廠商開發任務。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 75}, {"t": "0:37:45", "sec": 2265, "quote": "它幫我剪了六支片，一支片我的剪輯費用是原本是兩千塊，我真的是外包給一個人付他兩千塊，但它幫我剪了六支，零到一百全部交給它剪，我完全沒有碰。", "point": "講者提到使用 AI Agent 替代原本外包的影片剪輯工作，能全自動完成剪輯流程並節省成本。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 74}, {"t": "0:31:15", "sec": 1875, "quote": "AI 並沒有實質上的影響到大量的人的生活，在資料中心這邊沒有，在失業這邊沒有，在駭客事件這邊也沒有，未來可能會有沒錯，但是歷史上我覺得真的很少有一項科技是在沒有任何真正慘劇發生之前。", "point": "講者認為目前 AI 尚未對大眾生活、就業或資安造成大規模實質負面影響，目前的擔憂多屬預防性質。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 60}, {"t": "0:30:45", "sec": 1845, "quote": "PHP 其實也是找到了致命漏洞而已，也沒有真的多少的、很大的名聲的公司真的因為這個漏洞而被攻擊，然後產生了巨大的損失，只是因為 PHP 真的是太被廣泛使用。", "point": "講者提到 PHP 雖被發現致命漏洞，但尚未造成大型企業的重大損失，其受關注主因是使用範圍極廣。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 59}, {"t": "0:35:45", "sec": 2145, "quote": "當 AI Agent 成為一個主流產品的時候，這個觀感就會反轉了，意思就是說，當大家發現 AI 的價值的時候，大家就會支持 AI 而不是反對 AI 了。", "point": "講者預測當 AI Agent 普及並讓大眾感受到實質 30", "sec": 4110}, {"i": 161, "t": "1:09:00", "sec": 4140}], "full": "withheld"}, {"id": "harry_yt:01antPWI-pc", "src": "harry_yt", "name": "哈利說（科技浪）", "kind": "youtube", "title": "EP161 - 美國掀起反 AI 浪潮！資料中心蓋不下去怎麽辦？", "date": "2026-11-09", "url": "https://www.youtube.com/watch?v=01antPWI-pc", "n_all": 46, "mentions": [{"t": "0:02:42", "sec": 162, "quote": "上禮拜美國的其中選舉的結果出來了，那這個民主黨呢是大獲全勝", "point": "講者指出美國中期選舉結果由民主黨獲得大勝。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 7}, {"t": "0:03:21", "sec": 201, "quote": "那這次民主黨呢基本上拿下了整個國會，意思就是說他們可以在立法預算人事任命", "point": "民主黨掌握國會多數席次，可在立法與預算等事項上大幅制衡川普執政。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 9}, {"t": "0:04:38", "sec": 278, "quote": "最核心的原因是 cost of living，生活成本真的變得越來越無法負擔了", "point": "講者指出美國選民對生活成本負擔過重不滿，成為影響中期選舉結果的核心因素。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 12}, {"t": "0:04:47", "sec": 287, "quote": "也是因為川普發起這個伊朗戰爭嘛對不對，那戰爭導致油價增加，然後油價增加就是", "point": "地緣衝突推升國際油價，進一步帶動民生各類物品價格普遍上漲。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 13}, {"t": "0:06:25", "sec": 385, "quote": "會跌得這麼誇張呢就是因為民主黨他們是很反對資料中心的嘛，那蓋不了這麼多資料中心", "point": "民主黨反對資料中心建設，引發市場對 GPU 伺服器及半導體供應鏈需求下滑的疑慮。", "sectors": ["晶圓代工與製造", "伺服器與品牌組裝"], "stocks": [], "area": "產業", "tone": "空", "seg": 17}, {"t": "0:07:48", "sec": 468, "quote": "有 87% 的受訪選民認為 AI 資料中心至少是某種程度上的投票考量", "point": "民調顯示大部分美國選民在投票時將 AI 資料中心議題列入考量。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 20}, {"t": "0:07:54", "sec": 474, "quote": "其中有 56% 的人認為 AI 資料中心是他投票的關鍵或是重要因素", "point": "過半數美國選民認為 AI 資料中心興建問題是影響其投票決定的關鍵因素。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 20}, {"t": "0:08:14", "sec": 494, "quote": "有 76% 的人反對自己的社區新建新的資料中心", "point": "民調顯示高達七成六的美國民眾反對在其居住社區內新建資料中心。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 21}, {"t": "0:08:31", "sec": 511, "quote": "他們認為資料中心會把他們的電費變貴，讓他們的用水受到影響", "point": "民眾反對資料中心的原因在於擔心其大量耗電耗水會提高電費與衝擊水資源。", "sectors": ["伺服器電源與儲能", "廠務工程"], "stocks": [], "area": "產業", "tone": "空", "seg": 21}, {"t": "0:31:19", "sec": 1879, "quote": "在資料中心這邊沒有，在失業這邊沒有，在駭客事件這邊也沒有，OK，未來可能會有沒錯，我認真覺得可能性不低喔。", "point": "講者認為目前 AI 尚未在資料中心、失業或駭客攻擊方面對大眾生活產生實質負面影響。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 38}, {"t": "0:31:46", "sec": 1906, "quote": "我覺得最接近的可能是核能嘛，對不對？現在大家也是非常反核，但是這也是因為我們經歷了三起非常嚴重的核能事件。", "point": "講者將大眾對 AI 的反對與核能政策進行類比，指出核能反對聲浪源於嚴重事故。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 39}, {"t": "0:33:48", "sec": 2028, "quote": "像 Anthropic、OpenAI 整天在那邊講說 AI 會怎麼樣毀滅人類、毀滅人類，讓大家都失業、失業、失業，引起好多的恐懼。", "point": "講者批評 AI 巨頭過度強調 AI 的毀滅性與失業風險，引發社會恐慌與監管壓力。", "sectors": [], "stocks": [], "area": "政治", "tone": "空", "seg": 43}, {"t": "0:34:32", "sec": 2072, "quote": "Dario Amodei 之前他超常講那種 AI 大量失業論嘛，對不對？什麼時候所有的 code 都會交給 AI 寫，什麼時候 90% 的白領工作都會消失。", "point": "講者提到 Anthropic 執行長曾多次發表 AI 將導致大量失業的言論。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 45}, {"t": "0:35:12", "sec": 2112, "quote": "討厭 AI 的人也取得了國會大多數了，就是民主黨嘛，對不對？所以我們要討論的是，首先這件事情他能夠造成的影響是什麼。", "point": "講者指出美國民主黨在國會取得多數，且該黨傾向反對 AI。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 46}, {"t": "0:35:50", "sec": 2150, "quote": "一個人他只要用 AI 用得越頻繁，他就越不會擔心 AI。那這件事情是橫跨全世界各個國家，在每個地方都有同樣的狀況。", "point": "講者引用研究指出，頻繁使用 AI 的人較不擔心其負面影響，此現象具全球普遍性。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 47}, {"t": "0:36:42", "sec": 2202, "quote": "他就會上街頭說：支持資料中心，我們要蓋資料中心！整個觀感我相信是會翻轉的啦。同時他也是在發現 AI 的價值的時候。", "point": "講者預測當民眾感受到 AI 算力不足影響生活時，會轉而支持政府建設資料中心的政策。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 49}, {"t": "0:36:55", "sec": 2215, "quote": "發現說其實資料中心真的也不會提高電費，也不會造成水資源缺乏，然後全部加起來他就會開始越來越支持資料中心了。", "point": "講者預期當大眾發現資料中心並未導致資源短缺且帶來便利時，對 AI 基礎設施的接受度將提高。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 49}, {"t": "0:37:42", "sec": 2262, "quote": "他幫我剪了六支片，一支片我的剪輯費用是原本是兩千塊，我真的是外包給一個人付他兩千塊，但他幫我剪了六支。", "point": "講者分享使用 AI Agent 替代人工剪輯外包，顯著降低了影音製作成本。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 51}, {"t": "0:38:25", "sec": 2305, "quote": "我就直接跟我的 Dots 說，我空出了這兩檔業配，你去幫我把它填補起來，你幫我找到新的廠商把這兩檔賣給他們。", "point": "講者利用 AI Agent 執行商務開發，協助尋找廣告廠商以填補 Podcast 業配檔期。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 52}, {"t": "0:40:05", "sec": 2405, "quote": "我的 Agent 還會幫我當我助理嘛，幫我做專案的管理、幫我回信，也幫我做產品的 Prototype，這些工作的價值其實全部算一算。", "point": "講者說明 AI Agent 在專案管理、郵件回覆及產品原型開發等企業流程中的應用價值。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 56}, {"t": "0:40:34", "sec": 2434, "quote": "一般的消費者他沒有影片要剪啊，他沒有 Podcast 要賣啊，他沒有產品原型要做啊，他平時生活本來就沒有多少高價值的工作。", "point": "講者分析一般消費者缺乏高價值任務，因此目前難以感受到 AI Agent 帶來的實質經濟效益。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 57}, {"t": "0:41:21", "sec": 2481, "quote": "AI Agent 今天真的要成為一個消費者的主流產品，他必須要什麼事情都能做，而且幾乎所有事情都可以 end-to-end 完全自己完成。", "point": "講者認為 AI Agent 若要普及，必須能獨立完成端到端的任務，以創造足夠的經濟價值。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性", "seg": 58}, {"t": "0:42:42", "sec": 2562, "quote": "他認為 Personal AI Agents 還會需要幾個小 breakthrough 才會 just works。Just works 的意思就是基本上就是我們剛剛在講的那種。", "point": "講者引述 Sam Altman 的觀點，指出個人 AI 助理仍需技術突破才能真正發揮效用。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 61}, {"t": "0:43:31", "sec": 2611, "quote": "我覺得工具這邊就真的，畢竟因為整個網路世界都是為了人類操作而設計的。那今天我們是被迫 Agent 去用這個為人類設計出來的環境。", "point": "講者指出目前的網路環境是為人類而非 AI 設計，這成為 AI Agent 發展的障礙。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 63}, {"t": "0:43:55", "sec": 2635, "quote": "連最基本的、大家最常用的 Gmail 的寄信 connector 都有很大的問題，就是我不知道是只有 OpenAI 這樣還是怎樣。", "point": "講者指出目前 AI 工具生態系尚不完整，連 Gmail 寄信等基礎串接功能仍存在技術問題。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 63}, {"t": "0:44:09", "sec": 2649, "quote": "他的歷史信件沒有辦法 collapse，就是你要叫 Agent 幫你寄信的時候，他會把歷史信件全部附在信裡面，然後完全展開。", "point": "講者指出目前 AI 郵件工具在處理歷史信件摺疊功能上的技術缺陷。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 64}, {"t": "0:44:39", "sec": 2679, "quote": "其他的工具生態也非不完整嘛，對不對？就像現在台灣人常用 LINE，台灣人常用蝦皮，兩個都沒有那個 API 可以接啊。", "point": "講者指出台灣在地化工具生態系不完整，缺乏與 AI Agent 介接的 API。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 65}, {"t": "0:46:27", "sec": 2787, "quote": "接下來呢，我們就來聊一下，AI 的觀感問題，跟整個民主黨取得國會的這整個選舉結果呢", "point": "講者討論民主黨贏得國會選舉對 AI 產業及資料中心建置的實質影響。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 68}, {"t": "0:47:08", "sec": 2828, "quote": "就算民主黨今天，就是不知道怎麼搞的，真的能夠把全美的資料中心計畫全部都暫停", "point": "講者認為若民主黨政策導致美國境內資料中心計畫暫停，科技公司會轉向海外建設。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 70}, {"t": "0:49:05", "sec": 2945, "quote": "那人家中東拼了命的想要蓋資料中心，想要做主權 AI，就是想要自己掌控 AI 嘛", "point": "講者指出中東國家正積極發展主權 AI，而美國若將資料中心移往海外將不利於國家競爭力。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 74}, {"t": "0:50:08", "sec": 3008, "quote": "民主黨已經很多人已經直接說了，他們的政策，他們的政見就是要阻擋資料中心嘛", "point": "講者提到民主黨的政見包含阻擋資料中心建設，這已成為分析師評估未來發展的基準情境。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性", "seg": 76}, {"t": "0:52:21", "sec": 3141, "quote": "供應鏈會如何受到影響，已經直接反應在股價上面了嘛，這個是當天其中選舉出來的那一天", "point": "講者觀察到期中選舉結果對半導體供應鏈的影響已反映在股價的大幅波動上。", "sectors": ["晶圓代工與製造", "IC設計"], "stocks": [], "area": "產業", "tone": "中性", "seg": 80}, {"t": "0:54:43", "sec": 3283, "quote": "誰會想到在電力成為瓶頸之前，政治先成為瓶頸了啦，真的，但我必須說", "point": "講者認為目前政治因素已先於電力供應，成為 AI 與半導體產業發展的主要瓶頸。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性", "seg": 85}, {"t": "0:58:49", "sec": 3529, "quote": "你如果不知道買誰，想要比較確定的話，你就買台積電就好了啦，就台積電的護城河", "point": "講者建議若投資者尋求確定性，台積電因具備極高的競爭護城河是較佳的選擇。", "sectors": ["晶圓代工與製造"], "stocks": [{"code": "2330", "name": "台積電"}], "area": "產業", "tone": "中性", "seg": 93}, {"t": "0:59:34", "sec": 3574, "quote": "美國現在是如果真的因為這一波資料中心的反對浪潮呢，真的慢下了腳步", "point": "講者擔憂美國若因反對資料中心的浪潮而放慢 AI 發展腳步，將在中美 AI 競賽中面臨風險。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "空", "seg": 95}], "context": [{"stage": "主張", "t0": "0:03:35", "t1": "0:07:43", "sec0": 215, "summary": "美國期中選舉由民主黨大獲全勝，這將導致川普的政策受到強力制衡，而生活成本與 AI 資料中心議題是影響選情的關鍵因素。", "quotes": [{"t": "0:03:35", "sec": 215, "quote": "這個藍色浪潮，美國大家應該知道上禮拜美國的期中選舉的結果出來了，那這個民主黨呢是大獲全勝。", "seg": 10}, {"t": "0:07:14", "sec": 434, "quote": "就是 AI 跟資料中心。那這一點呢其實也是在這次選舉當中的算是核心議題之一。", "seg": 19}], "seg": 10}, {"stage": "主張", "t0": "0:07:44", "t1": "0:09:40", "sec0": 464, "summary": "民主黨勝選引發市場劇烈波動，主因是市場預期民主黨反對資料中心的立場將導致相關建置計畫告吹，進而衝擊半導體供應鏈。", "quotes": [{"t": "0:08:12", "sec": 492, "quote": "會跌得這麼誇張呢，就是因為民主黨他們是很反對資料中心的嘛，對不對？所以說他們現在大獲全勝，拿下整個國會呢，想當然爾就是有很多資料中心的新建計劃，可能會因此告吹。", "seg": 21}], "seg": 20}, {"stage": "依據", "t0": "0:09:41", "t1": "0:12:34", "sec0": 581, "summary": "民調顯示多數選民反對在社區興建資料中心，主要擔憂其帶來的電費上漲、水資源消耗及噪音等直接民生影響。", "quotes": [{"t": "0:10:14", "sec": 614, "quote": "有超過一半的人都覺得 AI 資料中心的議題會影響到他的投票決定。", "seg": 25}, {"t": "0:10:48", "sec": 648, "quote": "第一個類別呢，就是資料中心的直接影響，OK，他們認為資料中心會把他們的電費變貴，讓他們的就用水受到影響。", "seg": 26}], "seg": 24}, {"stage": "依據", "t0": "0:12:35", "t1": "0:32:29", "sec0": 755, "summary": "大眾對 AI 的負面觀感源於對失業與資安風險的恐懼，且多數人尚未從中獲得實質價值，導致 AI 在未發生重大慘劇前就面臨強烈反彈。", "quotes": [{"t": "0:12:35", "sec": 755, "quote": "有 57% 的人認為 AI 這個技術是弊大於利，他們帶來的壞處是大於它的好處的。", "seg": 30}, {"t": "0:32:30", "sec": 1950, "quote": "AI 就不一樣，我們現在是在什麼嚴重的事情都還沒發生之前，就超級超級反對 AI。", "seg": 41}], "seg": 30}, {"stage": "主張", "t0": "0:32:30", "t1": "0:35:29", "sec0": 1950, "summary": "AI 引起恐懼的原因在於其觸及人類智能的核心，加上 AI 公司早期過度強調風險與失業論，形塑了負面的社會觀感。", "quotes": [{"t": "0:33:30", "sec": 2010, "quote": "AI 是比起科技它更接近一個生物的感覺，它它有碰觸到人類最神聖的一塊區域，就是我們的智能。", "seg": 43}, {"t": "0:34:00", "sec": 2040, "quote": "科技本質是一點，但溝通問題絕對也是有非常大的成分。", "seg": 44}], "seg": 41}, {"stage": "操作", "t0": "0:35:30", "t1": "0:46:59", "sec0": 2130, "summary": "扭轉 AI 負面觀感的關鍵在於讓一般大眾透過 AI Agent 獲得實質價值，但目前仍需克服模型突破與工具串接不完整等技術瓶頸。", "quotes": [{"t": "0:35:30", "sec": 2130, "quote": "當 AI agent 成為一個主流產品的時候，這個觀感就會反轉了。", "seg": 47}, {"t": "0:45:00", "sec": 2700, "quote": "對於 AI agent 來說，agent 的產品來說，最重要要轉起來的一個飛輪就是信任的飛輪。", "seg": 66}], "seg": 47}, {"stage": "主張", "t0": "0:47:00", 應該都還算是沒有問題，因為蓋的東西就是持續的還是會去做拉貨", "point": "講者評估已在興建的 AI 數據中心供應鏈至 2027 年訂單無虞，但若新執照被卡則可能影響 2028 至 2029 年營收。", "sectors": ["伺服器與品牌組裝"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:19:47", "sec": 1187, "quote": "SoftBank 在 turbine，就是在他們的那個發電機裡面的渦輪呢，有一個違約的情形", "point": "講者提到市場傳出 SoftBank 在發電機渦輪項目出現違約情形。", "sectors": ["伺服器與品牌組裝", "伺服器電源與儲能"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:20:03", "sec": 1203, "quote": "當今天要去砍單的時候呢，其實他會先去砍一些就是可能在砍單上代價沒那麼大的東西", "point": "講者分析客戶砍單時會先縮減違約或賠償代價較小的周邊零組件訂單。", "sectors": ["連接器與機構件"], "stocks": [], "area": "產業", "tone": "空"}, {"t": "0:20:27", "sec": 1227, "quote": "如果你今天要去砍，例如說你要去砍 TSMC 訂單的話，那個代價就會是蠻大的", "point": "講者說明若客戶砍台積電晶圓代工訂單，將面臨極高的違約代價及未來產能分配受阻的風險。", "sectors": ["晶圓代工與製造"], "stocks": [{"code": "2330", "name": "台積電"}], "area": "產業", "tone": "空"}, {"t": "0:22:44", "sec": 1364, "quote": "嘴巴上要怎麼樣喊隨便他喊，因為畢竟要去鞏固選民就一定要去針對這些財團開刀嘛", "point": "講者指出政治人物選前言論多為鞏固選民，實質政策仍看數據中心執照發放狀況。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性"}, {"t": "0:23:58", "sec": 1438, "quote": "甚至是有點太早，因為按照過往的慣例，其實可能還要在 3 萬點附近他才會進來", "point": "講者提及國安基金進場時間點與歷史慣例的差異。", "sectors": ["金融"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:26:09", "sec": 1569, "quote": "就 VIX 跳上去一般來講就一定是短線的好買點啦", "point": "講者說明當恐慌指數 (VIX) 飆高時，通常是市場短線相對良好的買點。", "sectors": [], "stocks": [], "area": "總經", "tone": "中性"}, {"t": "0:27:05", "sec": 1625, "quote": "他們就扼殺創新，然後一直試著去分配富人的錢、分配企業的錢", "point": "講者評論歐洲政策偏向壓抑創新與強制分配富人及企業資本，不利經濟發展。", "sectors": [], "stocks": [], "area": "政治", "tone": "空"}, {"t": "0:52:13", "sec": 3133, "quote": "今天可能因為選舉，可能因為什麼事情，可能因為國安基金，那市場原來會這樣子跑", "point": "講者建議新手可先透過指數投資感受市場受選舉或政府政策影響的走勢。", "sectors": [], "stocks": [], "area": "政治", "tone": "中性"}, {"t": "0:52:20", "sec": 3140, "quote": "如果真的要做個股的話，就是一般會去找你有優勢的東西，所以不妨就從你的本業開始", "point": "講者建議做個股投資可優先從自己具備優勢的本業（如記憶體產業）開始研究。", "sectors": ["記憶體"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:53:06", "sec": 3186, "quote": "為什麼在年初的時候我會覺得是衛星，然後或是為什麼後面會覺得是光，或是像被動元件", "point": "講者提及市場不同階段的題材輪動，包含衛星、光通訊、被動元件與功率元件等。", "sectors": ["網通與衛星", "光通訊中下游"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:53:37", "sec": 3217, "quote": "我就看到說我覺得軟體像是相對強勢，SI，system integration是相對強勢", "point": "講者觀察到系統整合（SI）軟體相關族群在盤勢回檔時展現出相對強勢。", "sectors": ["電信與雲端服務"], "stocks": [], "area": "產業", "tone": "中性"}], "context": [{"stage": "主張", "t0": "0:15:00", "t1": "0:19:36", "sec0": 900, "summary": "講者分析美國選舉與政治局勢對 AI 資料中心許可證的可能影響，認為短期至 2027 年的訂單動能無虞，但若後續建置許可遭凍結，將波及 2028 年後的營收。", "quotes": [{"t": "0:17:30", "sec": 1050, "quote": "所以如果說我們今天用這個角度去看的話呢，我覺得以短期來說，就從現在一路到 2027 的訂單應該都還是沒有問題，因為蓋的東西就是持續的還是會去做拉貨。"}, {"t": "0:18:12", "sec": 1092, "quote": "就是新的 Data Center 的建置，那因為某些理由假設真的被砍掉的話，那那個訂單影響就會是可能大概 2028 到 2029 的一個營收。"}]}, {"stage": "依據", "t0": "0:19:36", "t1": "0:22:18", "sec0": 1176, "summary": "講者引述馬斯克關於軟銀發電機渦輪訂單違約的訊息，說明產業砍單常從代價低的外圍次要零件開始，若出現連續砍單現象將是長鞭效應的警訊。", "quotes": [{"t": "0:20:17", "sec": 1217, "quote": "意思就是說可能 SoftBank 他好像要去 cancel 掉一些訂單，那他的這個傳導是這樣子，就是一般以像 2022 的案例來講，當今天要去砍單的時候呢，其實他會先去砍一些就是可能在砍單上代價是沒這麼大的東西。"}, {"t": "0:21:39", "sec": 1299, "quote": "那有機會會是一個初步的警訊啦，因為我們在 2022 或者說在前面的幾波，像 2018 有一個過年後的修正，這個都是有類似的情形，就是他會先去砍一些在旁邊看起來是小東西的，大家覺得不重要的東西，然後最終呢就是會傳導，就長鞭這樣傳上去。"}]}, {"stage": "操作", "t0": "0:23:40", "t1": "0:27:05", "sec0": 1420, "summary": "在市場情緒波動劇烈時，講者會輔以技術面觀察反彈能否站穩季線，並採取拉高現金比重的風控策略，避免盲目逢低加碼。", "quotes": [{"t": "0:25:01", "sec": 1501, "quote": "不過這個反彈呢我自己個人是這樣看，因為它一次真的太深了，所以先看季線那邊，就它彈到季線這裡，可不可以跑上去？"}, {"t": "0:25:43", "sec": 1543, "quote": "先看就是它可能彈到這個地方有沒有辦法延續，有辦法延續的話那我寧願在那個地方再去去做加碼，就是不要說什麼都還沒有彈，然後或者說彈到之後然後掉下來立刻再買。"}]}, {"stage": "自我檢討", "t0": "0:29:10", "t1": "0:29:59", "sec0": 1750, "summary": "講者坦承上一週五的操作存在失誤，並提出交易決策的合理性與最終短期結果並不總是完全相符。", "quotes": [{"t": "0:29:10", "sec": 1750, "quote": "我上禮拜五是真的做錯，那個是做錯，所以我直接在節目就也不能說是檢討自己給大家看，以前會這樣說，但我現在覺得反正我就是如實的分享我的一些感受，那不可能每次都會對。"}, {"t": "0:29:10", "sec": 1750, "quote": "就是一個正確的判斷不一定要顯現在結果，正確的判斷有可能結果是不好的，有時候會是這樣子的呈現，所以這也是比較 tricky 的地方。"}]}, {"stage": "結論", "t0": "0:48:17", "t1": "0:50:50", "sec0": 2897, "summary": "針對新手投資  is already widely implemented, but not the CPO part, right? And that is growing.", "point": "資料中心的光纖已廣泛應用，而CPO部分目前正在成長。", "sectors": ["光通訊上游"], "stocks": [], "area": "產業", "tone": "多"}, {"t": "0:22:49", "sec": 1369, "quote": "basically um transporting data through light uh it's it's better than through copper to normal wires", "point": "透過光傳輸資料在頻寬、頻率與效率上皆優於傳統銅線與導線。", "sectors": ["光通訊上游", "連接器與機構件"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:23:18", "sec": 1398, "quote": "so this is um let's say a new concept is a revolution of how um data will be um intercepted", "point": "這是一個新概念，代表資料在資料中心內被攔截與處理方式的革命。", "sectors": ["伺服器與品牌組裝"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:23:30", "sec": 1410, "quote": "the key shift is to have basically engines that have thousands of fibers all together and", "point": "關鍵轉變是擁有數千條光纖聚集在一起的引擎，並與電子元件盡可能緊密封裝。", "sectors": ["光通訊上游", "封裝測試"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:24:05", "sec": 1445, "quote": "okay when data comes out of the rack like we turn it into light, right? But now with co-packaged optics", "point": "當資料從機櫃輸出時轉換成光，但現在透過共同封裝光學，晶片一出來就直接變成光。", "sectors": ["光通訊上游", "封裝測試"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:24:37", "sec": 1477, "quote": "this kind of approach has a limitations in terms of uh let's say power efficiency and speed", "point": "這種方法在電源效率與速度上面臨限制，因此需透過光學引擎解決。", "sectors": ["光通訊上游"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:25:22", "sec": 1522, "quote": "it's hard to say, huh? I mean, uh big companies are driving this and uh", "point": "大公司正在推動這項技術，推動資料中心架構轉型。", "sectors": ["伺服器與品牌組裝"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:25:28", "sec": 1528, "quote": "what we see is that this shift is happening. Um CPU architectures have been demonstrated", "point": "這種轉變正在發生，CPU架構已獲展示，正從原型走向工程與量產。", "sectors": ["IC設計"], "stocks": [], "area": "產業", "tone": "中性"}, {"t": "0:26:12", "sec": 1572, "quote": "I would say that there are many challenges fro     }));

function ktEpisode(e, K, open) {

  const full = e.full === "private" ? `<span class="kt-badge ok">全文 ${e.segs.length} 段</span>` : e.full === "withheld" ? `<span class="kt-badge warn">全文 ${e.segs.length} 段（私有，未公開）</span>` : `<span class="kt-badge">沒有保存全文</span>`;
  const tn = {多: 0, 空: 0, 中性: 0}; e.ms.forEach(m => tn[m.tone]++);
  const h = el("div", "kt-eh", `<b>${esc(e.date)}</b><span class="kt-src">${esc(e.name)}</span><span>${esc(e.title)}</span>` +
    `<a href="${esc(e.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">原始節目 ↗</a>${full}` +
    `<span class="kt-sub">重點 ${e.context.length || Math.min(e.ms.length, 8)}・提及 ${e.ms.length}（${ktTone("多")}${tn.多} ${ktTone("空")}${tn.空} ${ktTone("中性")}${tn.中性}）</span>`);
  box.appendChild(h);
  const b = el("div", "kt-body"); b.style.display = open ? "" : "none"; box.appendChild(b);
  h.onclick = () => { b.style.display = b.style.display ? "" : "none"; };
  let tr = null;
  const jump = (seg, s) => { if (tr && seg != null) tr.ktJump(seg); else window.open(ktLink(e, s), "_blank", "noopener"); };
  const ts = (t, s, seg) => { const x = el("button", "kt-ts", esc(t)); x.title = hasSegs ? "跳到原文這一段" : "開原始節目"; x.onclick = () => jump(seg, s); return x; };
  // ① 重點摘錄（論述脈絡；沒有脈絡的集用改寫句）
  b.appendChild(el("div", "kt-h3", "① 重點摘錄 <span class='kt-sub'>（每條點時間跳到原文段落）</span>"));
  const kp = e.context.length ? e.context.map(c => ({t: c.t0, rng: c.t0 + "～" + c.t1, sec: c.sec0, seg: c.seg, stage: c.stage, text: c.summary, qs: c.quotes}))
    : e.ms.slice(0, 8).map(m => ({t: m.t, sec: m.sec, seg: m.seg, stage: ktDom(m), text: m.point, qs: []}));
  if (!kp.length) b.appendChild(el("div", "kt-sub", "這集沒有核對通過的段落。"));
  kp.forEach(k => { const r = el("div", "kt-kp"); r.appendChild(ts(k.t, k.sec, k.seg));
    r.appendChild(el("div", "", `<span class="kt-stage">${esc(k.stage)}</span>${esc(k.text)}${k.rng ? `<span class="kt-rng">${esc(k.rng)}</span>` : ""}` + k.qs.map(q => `<div class="kt-p">「${esc(q.quote)}」<span class="kt-sub"> ${esc(q.t)}</span></div>`).join(""))); b.appendChild(r); });
  if (!e.context.length && kp.length) b.appendChild(el("div", "kt-note", "這集還沒有論述脈絡（11-01 改版後的新集才有），重點先用每則提及的改寫句。"));
  // ② 提及（個股、族群、多空）
  b.appendChild(el("div", "kt-h3", "② 提及的個股與族群 <span class='kt-sub'>（原話經核對；多空為示意）</span>"));
  const U = {};
  e.ms.forEach(m => { const r = el("div", "kt-kp"); r.appendChild(ts(m.t, m.sec, m.seg));
    const tags = (m.stocks || []).map(s => `<span class="kt-tag s">${esc(s.name)} ${esc(s.code)}</span>`).concat((m.sectors || []).map(x => `<span class="kt-tag">${esc(x)}</span>`)).join("");
    r.appendChild(el("div", "", `${ktTone(m.tone)}<span class="kt-q">「${esc(m.quote)}」</span>${m.point ? `<div class="kt-p">${esc(m.point)}</div>` : ""}<div class="kt-tags"><span class="kt-tag">${esc(ktDom(m))}</span>${tags}</div>`)); b.appendChild(r); });
  if (!e.ms.length) b.appendChild(el("div", "kt-sub", "這個篩選條件下沒有提及。"));

  b.appendChild(el("div", "kt-h3", "③ 原文逐字稿"));
  if (hasSegs) {
    const qb = {};
    if (e.full !== "private") { e.mentions.forEach(m => { if (m.seg != null) (qb[m.seg] = qb[m.seg] || []).push(m.quote); });
      e.context.forEach(c => c.quotes.forEach(q => { if (q.seg != null && !(qb[q.seg] || []).includes(q.quote)) (qb[q.seg] = qb[q.seg] || []).push(q.quote); })); }
    tr = ktTranscript(e.segs, {title: `原文逐字稿（${e.segs.length} 段，點開展開；時間點可開原始節目）`, idp: "kt-" + e.id.replace(/\W/g, "") + "-", quotesBySeg: qb, link: s => ktLink(e, s)});
    b.appendChild(tr);

}
