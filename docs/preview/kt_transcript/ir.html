<!doctype html><html lang='zh-Hant' data-theme='dark'><head><meta charset='utf-8'><meta name='robots' content='noindex, nofollow'><meta name='viewport' content='width=device-width, initial-scale=1'><title>法說逐字稿</title><style>

</style></head><body><div class='kt-wrap'><div class='kt-top'><h1>法說逐字稿</h1><button class='kt-pill' onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">深／淺色</button></div><div class='kt-pv'><b>預覽（雲端AA 11-14）</b>：法說逐字稿版型＝左邊場次清單、右邊一場：標頭（轉寫完整度）→ 重點（點時間跳原文）→ 報告引用的原話 → 全文（講者分段、簡報／Q&A 分節、講者篩選、搜尋）。內容全部是我們自己的：公開資訊觀測站官方錄音轉寫（docs/data/ir/tr）、法說重點（ir/<代號>.json）、AI 研究報告原話（company_reports.json）；不抓、不引用任何第三方逐字稿網站。列 2026-10-27 以後 31 場；標「轉寫不完整」的是摘錄不是全文（W 重轉清單見 TODO）。　<a href='index.html'>意見領袖頁籤</a>｜<a href='ir.html'>法說逐字稿</a></div><div id='kt-root'></div></div><script id='kt-data' type='application/json'>[{"key": "7750_2026-11-13", "code": "7750", "name": "新代", "date": "2026-11-13", "segs": [{"i": 0, "ts": "04:52:00", "sec": 17520, "who": "財務長", "role": "公司", "text": "可以看到其實我們今年結至Q3的部分，毛利率大概來到45.3%。"}, {"i": 1, "ts": "04:58:00", "sec": 17880, "who": "財務長", "role": "公司", "text": "相較於去年同期，下降大概0.4%。"}, {"i": 2, "ts": "05:47:00", "sec": 20820, "who": "財務長", "role": "公司", "text": "毛利率區間呢，跟之前在法說會給予的指引一樣，是在43%到47%。"}, {"i": 3, "ts": "10:22:00", "sec": 37320, "who": "財務長", "role": "公司", "text": "我們去年賣了大概15萬套的控制器，那今年的成長以數量來講大概是70%到80%的成長。"}, {"i": 4, "ts": "14:46:00", "sec": 53160, "who": "財務長", "role": "公司", "text": "海外市場，今年跟去年同比大概增加了35%。"}, {"i": 5, "ts": "16:07:00", "sec": 58020, "who": "財務長", "role": "公司", "text": "各位有沒有注意到，我們的第二季的營收是82億，第三季的營收是78億。"}], "qa": null, "chars": 177, "last_min": 967, "cpm": 0, "status": "bad_ts", "memo": [{"title": "營收", "points": [{"text": "2026年Q2營收為82億元，Q3營收為78億元。", "ts": "16:07:00", "who": "財務長", "seg": 5}]}, {"title": "毛利與獲利", "points": [{"text": "2026年Q3毛利率約為45.3%，較去年同期下降約0.4%。", "ts": "04:55:00", "who": "財務長", "seg": 0}, {"text": "預期毛利率維持在43%至47%區間。", "ts": "05:47:00", "who": "財務長", "seg": 2}]}, {"title": "營運指引", "points": [{"text": "2026年營收成長以數量計算，預計成長70%至80%。", "ts": "10:32:00", "who": "財務長", "seg": 3}]}, {"title": "Q&A", "points": [{"text": "問：中國工具機產業政策對公司的影響？／答：公司在中國市場的營收成長，截至9月比去年同期成長35%。", "ts": "14:46:00", "who": "財務長", "seg": 4}]}], "quotes": [{"report": "2026-11-13", "quotes": [{"cat": "毛利率", "text": "可以看到其實我們今年結至Q3的部分，毛利率大概來到45.3%。", "anchor": "04:52:00", "who": "財務長", "seg": 0}, {"cat": "展望", "text": "我們去年賣了大概15萬套的控制器，那今年的成長以數量來講大概是70%到80%的成長。", "anchor": "10:22:00", "who": "財務長", "seg": 3}, {"cat": "營收", "text": "各位有沒有注意到，我們的第二季的營收是82億，第三季的營收是78億。", "anchor": "16:07:00", "who": "財務長", "seg": 5}]}]}, {"key": "6116_2026-11-13", "code": "6116", "name": "彩晶", "date": "2026-11-13", "segs": [{"i": 0, "ts": "00:04", "sec": 4, "who": "主持人", "role": "主持人", "text": "歡迎各位投資先進參加今天瀚宇彩晶股份有限公司的線上法人說明會。首先介紹經營團隊：簡紅懿財務主管、郭立行會計主管、陳佩雲協理、黃國書資深處長。接下來有請今天的法說會主講人簡處長，謝謝。"}, {"i": 1, "ts": "00:29", "sec": 29, "who": "簡紅懿", "role": "公司", "text": "各位投資界的前輩朋友大家午安，我是瀚宇彩晶的財務主管簡紅懿。現在由我來跟各位報告今天的法說會內容。"}, {"i": 2, "ts": "00:46", "sec": 46, "who": "簡紅懿", "role": "公司", "text": "今天的法說會內容含有一些不確定性的風險，請大家看一下 Safe Harbor Notice。接下來報告115年第三季合併綜合損益表。"}, {"i": 3, "ts": "01:04", "sec": 64, "who": "簡紅懿", "role": "公司", "text": "115年第三季的營業收入是25.62億元，營業成本是34.01億元，營業毛損金額是8.39億元，營業費用是4.29億元，營業損失為12.67億元，EBITDA是負的5.37億元。"}, {"i": 4, "ts": "01:30", "sec": 90, "who": "簡紅懿", "role": "公司", "text": "營業外收入總共來到35億元，稅前淨利是22.33億元，本期淨利來到18.1億元，歸屬於母公司業主的本期淨利是18.1億元。基本每股盈餘是0.64元。總計前三季的本期淨利是17.64億元，EPS是0.62元。"}, {"i": 5, "ts": "02:01", "sec": 121, "who": "簡紅懿", "role": "公司", "text": "第三季單季的營業毛損率是負的33%，營業淨損率是49%，EBITDA率是負的21%，淨利率是71%。"}, {"i": 6, "ts": "02:21", "sec": 141, "who": "簡紅懿", "role": "公司", "text": "接下來我們再看115年第三季合併資產負債表。現金及約當現金來到59.71億元，假設我們加上附註一，115年第三季的定存13.82億元，總計的現金及定存會來到73.53億元。"}, {"i": 7, "ts": "02:46", "sec": 166, "who": "簡紅懿", "role": "公司", "text": "庫存餘額是15.46億元，短期借款及長期借款總計是24.73億元。股權總額是386.54億元，資產總額是470.99億元。銷貨周轉天數是41天，淨債務權益比率是負的6%，淨負債淨值比率是負的9%。"}, {"i": 8, "ts": "03:17", "sec": 197, "who": "簡紅懿", "role": "公司", "text": "接下來我們看到115年第三季合併現金流量表的重要科目。首先看到第三季的折舊及攤銷是7.31億元，處分資產利益是22.18億元。"}, {"i": 9, "ts": "03:37", "sec": 217, "who": "簡紅懿", "role": "公司", "text": "接下來往下 CapEx 取得不動產廠房及設備第三季總共花了4.33億元，處分資產的收入是43.21億元。再往下短期借款的淨變動額是3,700萬元，長期借款的淨變動額是2.99億元。總計第三季的現金及約當現金增加數是21.02億元。"}, {"i": 10, "ts": "04:26", "sec": 266, "who": "簡紅懿", "role": "公司", "text": "接下來我們看到出貨量及平均售價的趨勢。115年的第三季我們的出貨量來到 2,494K，這個是我們以中小尺寸換算成19吋的換算當量。ASP的部分以美元來表示的話，從第二季到第三季能維持在美金32元。"}, {"i": 11, "ts": "04:54", "sec": 294, "who": "簡紅懿", "role": "公司", "text": "下一頁是合併營收以尺寸別來區分。首先看到115年第三季的部分，大於11吋的部分來到14%，6.06吋到10.4吋的部分大部分都是車載的尺寸來到68%，小於6吋的部分是18%。"}, {"i": 12, "ts": "05:23", "sec": 323, "who": "簡紅懿", "role": "公司", "text": "以上是今天報告瀚宇彩晶115年第三季主要的財務跟業務概況。"}, {"i": 13, "ts": "05:35", "sec": 335, "who": "主持人", "role": "主持人", "text": "謝謝簡處長的說明，接下來我們有請陳佩雲協理針對展望來做一些說明。"}, {"i": 14, "ts": "05:55", "sec": 355, "who": "陳佩雲", "role": "公司", "text": "各位投資先進以及媒體大家下午好，我是瀚宇彩晶的陳佩雲，那我負責全球銷售及營運中心。今天由我來向各位報告目前顯示器市場的展望以及瀚宇彩晶未來的產品策略跟佈局。"}, {"i": 15, "ts": "06:14", "sec": 374, "who": "陳佩雲", "role": "公司", "text": "首先我來說明目前市場的環境跟產業的變化。在2026年整個面板產業面臨兩個主要的變化：第一個主要是 AI 帶動整個半導體的需求快速成長，所以會造成部分的半導體產能以及零組件的供應非常緊張，進而影響了我們面板相關零組件的交期跟價格。"}, {"i": 16, "ts": "06:41", "sec": 401, "who": "陳佩雲", "role": "公司", "text": "第二是國際原油價格持續上漲，當然同時帶動了石化原料成本的增加。目前從個別供應商的價格預估來看，我們可以看到2026年多數的零組件都呈現上漲趨勢，尤其是 T-CON、MLCC、PCB 以及驅動 IC 等等。"}, {"i": 17, "ts": "07:04", "sec": 424, "who": "陳佩雲", "role": "公司", "text": "因此在未來，我們除了爭取合理的產品價格以外，也需要透過整個供應鏈的管理以及成本的改善來維持我們自己產品的競爭力。"}, {"i": 18, "ts": "07:18", "sec": 438, "who": "陳佩雲", "role": "公司", "text": "再來我們從全球的車載顯示器市場來看，整個市場從2024到2030年仍然是維持穩定發展。在今年預估整個車載面板為2.53億片，到2030年大概是2.6億片，所以它的整個發展是非常穩定。"}, {"i": 19, "ts": "07:40", "sec": 460, "who": "陳佩雲", "role": "公司", "text": "但是在車載面板的應用上來說，每一個應用的成長趨勢並不相同。對瀚宇彩晶來講，我們的策略並不是全面的投入所有車載產品應用，而是選擇符合我們公司既有產能能力來作為我們發展的重點。"}, {"i": 20, "ts": "08:01", "sec": 481, "who": "陳佩雲", "role": "公司", "text": "從第三方的報告數據顯示，在2026年 Q2 的預估出貨量，瀚宇彩晶排名是全球第七，出貨量大約是 380 萬片，仍然維持我們目前既有的市場地位。"}, {"i": 21, "ts": "08:17", "sec": 497, "who": "陳佩雲", "role": "公司", "text": "同時我們把2026年的上半年與去年的同期的出貨量來比較，整個 YoY 的成長來到 10%，在主要的競爭者當中我們維持正成長。這代表瀚宇彩晶在既有的車載客戶以及市場上面仍然具有一定的競爭力。接下來我們會持續深化跟我們既有客戶的合作，擴大我們市場的機會。"}, {"i": 22, "ts": "08:47", "sec": 527, "who": "陳佩雲", "role": "公司", "text": "在整個產品行銷部分，我們會用我們既有的 5.3 代平台作為基礎，發揮我們現在製造的優勢。我們會聚焦三個方向：車載、工控以及 EVD（Eco Vision Display）。"}, {"i": 23, "ts": "09:05", "sec": 545, "who": "陳佩雲", "role": "公司", "text": "車載的部分我們會持續深化跟我們目前的客戶合作；工控我們是用利基的市場應用為主；而 EVD 則是透過差異化的顯示體驗來建立新的產品發展機會。"}, {"i": 24, "ts": "09:22", "sec": 562, "who": "陳佩雲", "role": "公司", "text": "在策略方面我們會採取三個方向：第一個就是跟我們現在的 Tier 1 客戶深度的綁定，透過穩定的品質、交付以及技術支援，提高客戶跟我們之間的黏著度。第二我們會擴大重點市場。第三在產品部分，我們透過提高對比、視角以及顯示品質，來強化我們產品的競爭力，從既有的 Amorphous 平台延伸到更高價值的產品。"}, {"i": 25, "ts": "09:57", "sec": 597, "who": "陳佩雲", "role": "公司", "text": "工控的部分我們不會用大量的標準品來作為主要的競爭方向，而是聚焦在具有長期需求以及客製化特殊的應用。目前我們會鎖定三個領域：航海、特殊車輛以及工業的 HMI 為主。透過高亮度、寬溫、防水以及高可靠度的產品能力，搭配我們客戶的需求進行客製化設計，跟客戶建立長期的合作關係。"}, {"i": 26, "ts": "10:30", "sec": 630, "who": "陳佩雲", "role": "公司", "text": "最後是 EVD 的部分，Eco Vision Display 是我們建立的一個新的產品成長平台，它運用微反射的技術，建立護眼、低功耗以及類似像 E-paper 的產品體驗。"}, {"i": 27, "ts": "10:49", "sec": 649, "who": "陳佩雲", "role": "公司", "text": "它主要的差異是在於護眼，尤其是它對干眼症非常有幫助，非常適合像紙一樣的視覺體驗。更重要的是它在戶外強光下可視性非常好，所以可以讓顯示器從室內到戶外都具有一樣好的體驗。"}, {"i": 28, "ts": "11:23", "sec": 683, "who": "陳佩雲", "role": "公司", "text": "在整個產品佈局方面，在 EVD 部分我們會依照不同的尺寸來發展平板、筆電以及大型顯示器的應用。我們會結合我們的系統合作夥伴跟品牌客戶共同合作，來共同銷售擴大這個市場。以上。"}, {"i": 29, "ts": "11:45", "sec": 705, "who": "主持人", "role": "主持人", "text": "謝謝簡處長及陳協理的分享與說明，接下來我們開放 Q&A。今天我們會以文字訊息的方式進行提問，請各位投資先進點選聊天功能，輸入您的問題後即可，接下來進行 Q&A 時間。"}, {"i": 30, "ts": "12:32", "sec": 752, "who": "主持人", "role": "主持人", "text": "這邊有統一證券的提問：公司在第三季的毛利率從第二季的負5.5%降到負32.7%，財報附註中有第三季認列未分攤固定製造費用10.22億，請問這10.22億增加主要是南科廠出售或產線調整產生的閒置產能損失？還是代表5.3代線目前的稼動率出現大幅下滑？以及在資產處分完後，預計第四季及明年每季固定折舊與未分攤製造費用能下降多少？本業毛利率何時能看到轉正？我們請郭立行主管回復。"}, {"i": 31, "ts": "13:30", "sec": 810, "who": "郭立行", "role": "公司", "text": "謝謝統一顧問的提問。關於毛利率的部分，針對幾個層面來跟各位做說明。主要第一方面在產品組合的調整，剛剛陳協理這裡也有提到，我們之後也是持續聚焦在高毛利的车載、工控這些產品去聚焦。那未來也會減少我們之前比較低毛利的一些消費規的產品。那這些調整其實在我們第三季的時候就更有發酵，所以造成我們產銷調整會比較有一些明顯的下降。"}, {"i": 32, "ts": "14:11", "sec": 851, "who": "郭立行", "role": "公司", "text": "那另外在第三季也是我們生產的高峰期，第三季包含夏季電費，所以這些動力費金額相對在成本比重也有略為再提高一些。另外配合我們產品組合調配，我們相應的人員也有優化，也是在第三季去進行。"}, {"i": 33, "ts": "14:39", "sec": 879, "who": "郭立行", "role": "公司", "text": "那之後關於一些生產設備我們也會逐步做一些盤點，那未來對於我們一些折舊金額也會逐步發效，會降低一些折舊成本。那未來預計在明年的毛利也會做一些明顯改善。以上說明。"}, {"i": 34, "ts": "15:22", "sec": 922, "who": "主持人", "role": "主持人", "text": "華南證券提問：請問公司是否有玻璃基板新的應用計劃？例如 FOPLP、CoWoS 或 CPO？以及2027年的展望？我們請陳協理做回復。"}, {"i": 35, "ts": "15:40", "sec": 940, "who": "陳佩雲", "role": "公司", "text": "謝謝華南證券陳先生的問答。關於 FOPLP 或者是相關 CoWoS、CPO，這個是在我們的討論中。那再來關於27年的展望的部分，那我們這邊的話剛剛也有回復，我想我們整體會採取一個審慎樂觀的態度。因為整個市場來講，還是面臨到整個供應、需求變化以及零組件成本波動的影響，所以我們不會用單純的面板產業會有復甦成長的前題，那我們仍然會以我剛剛提到的聚焦在我們三個方向，然後來做一個整體的佈局的部分。以上。"}, {"i": 36, "ts": "16:57", "sec": 1017, "who": "主持人", "role": "主持人", "text": "群益證券提問：請問今年/明年是否可獲利？獲利主要動能來自哪些業務？我們請簡紅懿財務主管回復。"}, {"i": 37, "ts": "17:10", "sec": 1030, "who": "簡紅懿", "role": "公司", "text": "今年到了第三季為止，我們基本上財報是獲利的。那至於第四季可不可以持續獲利，最主要剛剛已經解釋過，本業上面現在在做一些產品組合的調配跟產能的配置，所以本業的部分還是比較艱辛的。因為今年到前三季最主要獲利來源都是業外的一些收益，所以我們也不能夠做一些財務預測說今年能不能獲利。主要的動能來自於哪些業務？剛剛我們的業務主管有說明過，我們最主要的產業動能就是車載的部分，我們會全力的著重在車載業務這塊持續加強。謝謝。"}, {"i": 38, "ts": "18:17", "sec": 1097, "who": "主持人", "role": "主持人", "text": "黃昂陽證券有提問：NVIDIA 的事件對公司的影響？我們一樣請簡處長做回復。"}, {"i": 39, "ts": "18:25", "sec": 1105, "who": "簡紅懿", "role": "公司", "text": "NVIDIA 的事件應該是個人的問題，那這個東西我們是沒有辦法評論。我們覺得這應該是短期的事件，長期會發展成怎麼樣我們目前沒有辦法評論。謝謝。"}, {"i": 40, "ts": "19:19", "sec": 1159, "who": "主持人", "role": "主持人", "text": "如果沒有人在提出新的問題，那我們今天的法說會到此圓滿結束，也感謝各位投資先進的參與，謝謝各位。"}], "qa": null, "chars": 3739, "last_min": 19, "cpm": 194, "status": "full", "memo": [{"title": "亮點", "points": [{"text": "2026年第三季單季本期淨利18.1億元，EPS為0.64元；前三季累計EPS為0.62元。", "ts": "01:38", "who": "CFO", "seg": 4}]}, {"title": "營收", "points": [{"text": "2026年第三季營業收入為25.62億元，前三季累計淨利17.64億元。", "ts": "01:04", "who": "CFO", "seg": 3}, {"text": "第三季中小尺寸面板出貨量換算19吋當量為2,494K片，平均售價（ASP）維持在32美元。", "ts": "04:32", "who": "CFO", "seg": 10}, {"text": "第三季產品營收比重：大於11吋佔14%、6.06至10.4吋（以車載為主）佔68%、小於6吋佔18%。", "ts": "05:04", "who": "CFO", "seg": 11}]}, {"title": "毛利與獲利", "points": [{"text": "2026年第三季毛利率為-33%，營業損失12.67億元，主因產品組合調整與夏季電費等成本增加。", "ts": "02:03", "who": "CFO", "seg": 5}, {"text": "業外收入達35億元（主要為處分資產利益），帶動第三季稅前淨利達22.33億元。", "ts": "01:32", "who": "CFO", "seg": 4}]}, {"title": "訂單與能見度", "points": [{"text": "2026上半年車載面板出貨量年增率（YoY）達10%，呈現穩健成長脈絡。", "ts": "08:24", "who": "發言人", "seg": 21}]}, {"title": "產能與擴產", "points": [{"text": "公司聚焦發揮5.3代線平台優勢，並持續盤點設備與調整人力配置以控制折舊費用。", "ts": "08:50", "who": "發言人", "seg": 22}]}, {"title": "產品與技術", "points": [{"text": "產品策略聚焦三大方向：車載、工控以及EVD（微反射護眼顯示技術）。", "ts": "08:57", "who": "發言人", "seg": 22}, {"text": "玻璃基板新應用（如FOPLP、CoWoS、CPO）目前仍在內部討論與評估階段。", "ts": "15:43", "who": "發言人", "seg": 35}]}, {"title": "產業與競爭", "points": [{"text": "AI帶動半導體需求成長致部分零組件（T-CON、MLCC、PCB、驅動IC）供應緊張與價格上漲。", "ts": "06:24", "who": "發言人", "seg": 15}, {"text": "預估全球車載面板市場自2024至2030年持續穩定成長，2026年全球規模約2.53億片。", "ts": "07:27", "who": "發言人", "seg": 18}]}, {"title": "客戶", "points": [{"text": "公司於2026Q2全球車載面板出貨量排名第七，單季出貨量約380萬片。", "ts": "08:06", "who": "發言人", "seg": 20}]}, {"title": "股利與資本", "points": [{"text": "第三季末現金及定存總計達73.53億元，存貨餘額15.46億元，周轉天數為41天。", "ts": "02:40", "who": "CFO", "seg": 6}, {"text": "第三季資本支出（取得不動產廠房及設備）為4.33億元，處分資產收入為43.21億元。", "ts": "03:38", "who": "CFO", "seg": 9}]}, {"title": "Q&A", "points": [{"text": "問：Q3毛利率降至-33%之原因及未分攤固定費用狀況？／答：主因產品組合調整、消費性產品減少、夏季高電價影響及人力設備盤點；未來折舊費用隨設備到期將逐步下降。", "ts": "13:30", "who": "CFO", "seg": 31}, {"text": "問：公司對2027年的展望為何？／答：對2027年保持審慎樂觀態度，將持續聚焦車載、工控與EVD三大產品領域。", "ts": "15:55", "who": "發言人", "seg": 35}, {"text": "問：今年與明年的獲利來源及動能？／答：前三季獲利主要來自業外利益；本業持續進行產品組合調整，車載業務為最主要的成長動能。", "ts": "17:11", "who": "CFO", "seg": 37}]}], "quotes": []}, {"key": "3665_2026-11-13", "code": "3665", "name": "貿聯-KY", "date": "2026-11-13", "segs": [{"i": 0, "ts": "00:00:00", "sec": 0, "who": "Allie Cheng", "role": "公司", "text": "Good afternoon and good morning everyone. Welcome to BizLink's Third Quarter Earnings Call hosted by UBS. I am Allie Cheng covering the industrial sector. Before we start, I'd like to ask for your support in the Institutional Investor survey. Now let me hand over the call to Mike."}, {"i": 1, "ts": "00:00:27", "sec": 27, "who": "Mike", "role": "公司", "text": "Thank you, Allie, and thanks to UBS. Welcome to BizLink's third quarter 2026 earnings conference call. Our financial results and presentation materials are available on our Investor Relations website. Today's call will begin with Charles, followed by Florian and Felix, after which we will open for Q&A."}, {"i": 2, "ts": "00:01:55", "sec": 115, "who": "Charles", "role": "公司", "text": "Thank you, Mike, and good afternoon everyone. Before reviewing our third quarter financial performance, I want to put it into the context of BizLink's continuing development and the increasingly sophisticated business we are building. Our third quarter results reflect continued progress in expanding our business and strengthening operating performance."}, {"i": 3, "ts": "00:02:47", "sec": 167, "who": "Charles", "role": "公司", "text": "Gross margin expanded while disciplined expense management brought our OPEX ratio to a record low level. Together, this improvement lifted operating margin to a new high. As we expand our revenue base, we are generating greater efficiency across manufacturing, engineering, and administrative functions."}, {"i": 4, "ts": "00:04:17", "sec": 257, "who": "Charles", "role": "公司", "text": "Turning to our business, HPC continues to benefit from sustained investment in AI infrastructure. For the first nine months of 2026, HPC power connectivity grew 97% year-on-year while data connectivity grew 49% year-on-year, contributing to overall HPC growth of 77% year-on-year."}, {"i": 5, "ts": "00:05:19", "sec": 319, "who": "Charles", "role": "公司", "text": "Our capital equipment business has also delivered exceptional performance. Since the 2023 base year, BizLink's SPE business has substantially outgrown the broader semiconductor equipment market. This outperformance continued during the first nine months of 2026 when SPE revenue grew 48% year-on-year."}, {"i": 6, "ts": "00:06:17", "sec": 377, "who": "Charles", "role": "公司", "text": "On a first nine months basis, Factory Automation sales are up 18% year-on-year, Healthcare is up 7%, Energy is up 17%, and EV is up 21%. Looking back at BizLink's development, we have doubled our monthly revenue in progressively less time even as our scale has grown."}, {"i": 7, "ts": "00:08:50", "sec": 530, "who": "Charles", "role": "公司", "text": "Interplex contributed only 7 days of revenue to our third quarter consolidated results, while October represents its first full month of consolidation. Its initial operating momentum has exceeded our expectations at the time of acquisition with October revenue approaching $67 million USD."}, {"i": 8, "ts": "00:11:43", "sec": 703, "who": "Charles", "role": "公司", "text": "As we approach 2027, our business is entering its next stage of development with a larger revenue base, broader capabilities, and stronger operating leverage. Our objective is productive scale that supports sustainable earnings and cash generation."}, {"i": 9, "ts": "00:12:31", "sec": 751, "who": "Florian", "role": "公司", "text": "Thank you, Charles. Across our business, we see a common development: customers increasingly expect suppliers to do more than deliver individual components. They require engineering support, manufacturing readiness, and supply chain flexibility."}, {"i": 10, "ts": "00:14:53", "sec": 893, "who": "Felix", "role": "公司", "text": "Thank you, Florian. We increasingly view HPC as a long-duration investment cycle rather than a single technology generation. Computing platforms are advancing rapidly, creating demanding requirements for power delivery, data connectivity, and cooling."}, {"i": 11, "ts": "00:17:04", "sec": 1024, "who": "Florian", "role": "公司", "text": "During 2026, we demonstrated optical shuffle solutions at OFC, CPO switch solutions at Computex, and a 12.8T XPO transceiver at OCP. These illustrate our growing capabilities in precision optical assembly and integration."}, {"i": 12, "ts": "00:19:14", "sec": 1154, "who": "Florian", "role": "公司", "text": "Our demonstrations at Computex and OCP also highlighted how we are preparing for liquid-cooled AI rack environments, featuring high-current power distribution, cold plates, manifolds, and leak detection capabilities."}, {"i": 13, "ts": "00:23:31", "sec": 1411, "who": "Florian", "role": "公司", "text": "Interplex adds another important set of capabilities. Its experience in precision mechanical engineering, enclosures, and subsystem integration complements our existing electrical and optical connectivity capabilities."}, {"i": 14, "ts": "00:28:31", "sec": 1711, "who": "Mike", "role": "公司", "text": "Thank you Charles, Florian, and Felix. Now let us begin the Q&A session. Please type your questions into the chat box."}, {"i": 15, "ts": "00:29:22", "sec": 1762, "who": "Charles", "role": "公司", "text": "Regarding Interplex, October revenue contributed $67 million USD in its first full consolidated month. The momentum actually exceeded our expectations at the time of acquisition and shows very promising operational synergy."}, {"i": 16, "ts": "00:34:02", "sec": 2042, "who": "Florian", "role": "公司", "text": "On optics and CPO, we demonstrated our optical shuffle and CPO switch solutions. We are advancing next-generation optical scale-up interconnects, including micro-VCSEL based technologies to support demanding connectivity requirements."}, {"i": 17, "ts": "00:38:57", "sec": 2337, "who": "Felix", "role": "公司", "text": "Power demand continues to escalate with higher compute density. We offer comprehensive power solutions spanning busbars, power whips, busways, and rack-level power distribution architecture."}, {"i": 18, "ts": "00:42:56", "sec": 2576, "who": "Felix", "role": "公司", "text": "Looking into 2027, key growth drivers remain HPC AI power and data connectivity, along with semiconductor production equipment (SPE), supported by gradual recovery in industrial and automotive segments."}, {"i": 19, "ts": "00:51:19", "sec": 3079, "who": "Mike", "role": "公司", "text": "This concludes our Q&A session. A replay will be available on our IR website within 24 hours. Thank you very much for joining today's call."}], "qa": null, "chars": 4883, "last_min": 51, "cpm": 95, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "2026年前三季 HPC 電源連接營收年增 97%，資料連接年增 49%，整體 HPC 成長 77% YoY。", "ts": "00:04:17", "who": "CEO", "seg": 4}, {"text": "半導體設備（SPE）業務在前三季營收年增 48%，展現強勁成長動能。", "ts": "00:05:19", "who": "CEO", "seg": 5}]}, {"title": "營收", "points": [{"text": "併購 Interplex 於 10 月完整併表單月營收達 6,700 萬美元，超出原先預期。", "ts": "00:08:50", "who": "CEO", "seg": 7}, {"text": "前三季各終端市場表現：工控（FA）年增 18%、醫療年增 7%、能源年增 17%、電動車（EV）年增 21%。", "ts": "00:06:17", "who": "CEO", "seg": 6}]}, {"title": "毛利與獲利", "points": [{"text": "第三季毛利率持續擴增，且營業費用率降至歷史新低，帶動營益率創下新高。", "ts": "00:02:47", "who": "CEO", "seg": 3}, {"text": "營運規模擴大帶來製造與管理效率提升，獲利能力隨營業額同步擴展。", "ts": "00:03:06", "who": "CEO", "seg": 3}]}, {"title": "營運指引", "points": [{"text": "展望2027年，公司邁入下一階段成長，具備更充沛的營收基底與營運槓桿效應。", "ts": "00:11:43", "who": "CEO", "seg": 8}]}, {"title": "產品與技術", "points": [{"text": "光通訊領域展示 OFC 光學 Shuffle、Computex CPO 交換器及 OCP 12.8T XPO 收發器技術。", "ts": "00:17:04", "who": "發言人", "seg": 11}, {"text": "全面佈局全液冷 AI 機架架構，提供高電流電源分配、冷板（Cold Plate）、分流管（Manifold）及洩漏檢測系統。", "ts": "00:19:14", "who": "發言人", "seg": 12}]}, {"title": "Q&A", "points": [{"text": "問：Interplex 併購後的營運狀況與財務貢獻為何？／答：10月完整併表單月貢獻營收6,700萬美元，展現優於預期的營運綜效。", "ts": "00:29:22", "who": "CEO", "seg": 15}, {"text": "問：光學連接（Optics）與 CPO 領域的進展為何？／答：已成功開發光纖 Shuffle 與 CPO 技術，並積極投入微型 VCSEL 下一代技術研發。", "ts": "00:34:02", "who": "發言人", "seg": 16}, {"text": "問：HPC 電源分配產品的未來發展重點為何？／答：隨晶片功耗提升，電源需求大幅成長，公司提供從匯流排到機架電源的完整解決方案。", "ts": "00:38:57", "who": "發言人", "seg": 17}, {"text": "問：2027 年主要成長動能來自哪些領域？／答：主要由 HPC、AI 伺服器電源與資料傳輸，以及半導體設備（SPE）持續驅動。", "ts": "00:42:56", "who": "發言人", "seg": 18}]}], "quotes": []}, {"key": "2481_2026-11-13", "code": "2481", "name": "強茂", "date": "2026-11-13", "segs": [{"i": 0, "ts": "00:02", "sec": 2, "who": "主持人", "role": "主持人", "text": "各位投資人下午好，感謝大家蒞臨強茂法說會。首先介紹今天的主講人為投資人關係部的廖華經歷。今天的會議分為兩階段，第一階段為公司簡報，第二階段為Q&A時間。我們現在把時間交還給公司，謝謝。"}, {"i": 1, "ts": "00:22", "sec": 22, "who": "發言人", "role": "公司", "text": "各位先進大家好，今天非常感謝統一證券邀請，也感謝大家撥空前來參加我們強茂股份有限公司2026年第三季財報的法人說明會。"}, {"i": 2, "ts": "00:44", "sec": 44, "who": "發言人", "role": "公司", "text": "首先還是要跟大家更新一下我們強茂集團整體的生態系的佈局。上面我們可以看到是強茂母公司主要產品包含MOSFET、SiC、Diode、TVS、Zener、Bridge、Transistor跟ESD protection。主要的應用會是著重在車用、HPC以及說其他我們看到相關的在上面。"}, {"i": 3, "ts": "01:17", "sec": 77, "who": "發言人", "role": "公司", "text": "那集團重要關係企業跟子公司包含左上方的螢茂光學，主要專注於高精密客製化的touch panel。左下角的凡甲科技，主要是深耕在車用、伺服器的高速連接器。"}, {"i": 4, "ts": "01:40", "sec": 100, "who": "發言人", "role": "公司", "text": "那另外就是右上角我們可以看到是專注在PMIC電源管理IC的虹冠電，以及說右下角我們看到佈局在ESD保護元件的虹冠半導體。以及最下面我們可以看到是發展、Fully focus在馬達控制器MCU、電源管理及訊號鏈IC的芯茂科技。"}, {"i": 5, "ts": "02:15", "sec": 135, "who": "發言人", "role": "公司", "text": "強茂身為全球IDM分離式元件半導體製造商，具備從晶圓設計、晶圓製造、封裝測試到全球自有通路銷售的垂直整合能力。根據研究機構2025年統計，強茂在低功率矽整流器領域位居全球第四大供應商。"}, {"i": 6, "ts": "02:44", "sec": 164, "who": "發言人", "role": "公司", "text": "集團目前有三座晶圓廠，分別是在高雄的6吋跟8吋，以及說在山東的4吋。以及5座後端封測廠，位於高雄、無錫、徐州、菲律賓的卡布友，以及我們今年在下半年最新加入營運版圖的越南胡志明市的新廠。"}, {"i": 7, "ts": "03:12", "sec": 192, "who": "發言人", "role": "公司", "text": "在營運的部分，比如說我們說regional headquarters的部分，不是只有在大中華區，也就是說中國跟台灣之外，另外在海外也搭，也搭配了歐美日韓印度的區域銷售點。那為的就是說去support local的客戶的需求，無論是在營運或是製造上面。"}, {"i": 8, "ts": "03:41", "sec": 221, "who": "發言人", "role": "公司", "text": "近年來面對半導體供應鏈的波動，強茂持續發揮IDM垂直整合與多元供應鏈的營運韌性。一方面我們積極推動海內外多元化佈局，成功鎖定關鍵製程產能配合，資應高階運算與特殊規格的專案需求。另一方面在自有產能配置上，同時逐步調整各廠區的產品分工跟外包比重，並透過今年併入的越南新的封測廠，強化未來在東南亞第三地供應的能力。"}, {"i": 9, "ts": "04:26", "sec": 266, "who": "發言人", "role": "公司", "text": "接下來進入財務概況。為各位更新我們在2026年第三季單季的合併損益表現。那我們現在在簡報上面看到都是簡表，細節的部分在公開資訊觀測站財報。本季合併營收為4349.7 million NTD，較上季增加10%，YoY增加33%。"}, {"i": 10, "ts": "04:58", "sec": 298, "who": "發言人", "role": "公司", "text": "營業毛利為1621.4個million，季增23.4%，年增58.4%。單季營業毛利率來到37.3，較上季33.2季增4.1個百分點，較去年同期31.3%增加6個百分點。營業費用本季營業費用合計為924.2個million，季增8.8%，年增23.7%。"}, {"i": 11, "ts": "05:34", "sec": 334, "who": "發言人", "role": "公司", "text": "營業淨利本季營業淨利達到697.2個million，季增50.1%，年增152.3%。營業利益率升至16.0%，較上季11.7%季增4.3個百分點，同期增加7.5個百分點。"}, {"i": 12, "ts": "05:59", "sec": 359, "who": "發言人", "role": "公司", "text": "營業外收入支出本季業外淨利益為173個million，季減5.3%，年增3.8%。本期所得稅費用為191.2個million，季增58.9%，年增149%。"}, {"i": 13, "ts": "06:27", "sec": 387, "who": "發言人", "role": "公司", "text": "本期淨利為678.9個million，季增28.9%，年增85.4%。淨利率為15.6%，較上季增加2.3個百分點，去年同期增加4.4個百分點。今年單季在第三季的EPS來到1.7，QoQ增加32.8%，YoY增加115.2%。"}, {"i": 14, "ts": "06:59", "sec": 419, "who": "發言人", "role": "公司", "text": "這是針對剛剛Income statement四個比較重要的指標給大家一個比較清楚的chart。可以看到除了營收增加之外QoQ YoY wise，另外我們在Gross margin、Operating profit margin跟Net profit margin都是三率三升的一個狀況。"}, {"i": 15, "ts": "07:20", "sec": 440, "who": "發言人", "role": "公司", "text": "接下來是針對資產負債表及重要的周轉與現金流指標。截至到2026年第三季底，現金及相當現金為2490個million，佔資產7.5%。應收帳款項為5474個million，佔資產16.6%。存貨為3499個million，佔資產10.6%。採用權益法之投資為2429個million，佔總資產7.4%。"}, {"i": 16, "ts": "08:00", "sec": 480, "who": "發言人", "role": "公司", "text": "資產總計為33032個million，較上季增4.9個百分點，YoY增加13.5%。負債總計為15861個million，權益總計為17171個million。重要的財務指標：本季平均收現日數為105天，較上季104天、去年同期110天相對來說是非常健康。平均銷貨日數為108天。第三季單季營業活動現金流量淨流入140個million。"}, {"i": 17, "ts": "08:57", "sec": 537, "who": "發言人", "role": "公司", "text": "接下來是針對前三季的累計合併損益。我們可以看到前三季的營收，無論是營收又或者是毛利額、毛利率，以及說我們可以看到OPM跟Net profit margin跟EPS都是大幅度的增加。主要的成長動能百分之百來自於核心的功率分離式元件業務，也就是強茂的本業。"}, {"i": 18, "ts": "09:45", "sec": 585, "who": "發言人", "role": "公司", "text": "接下來我們從終端市場應用、產品組合跟銷售地區三個維度來檢視2026年前三季的營收結構變化。我們看最上面的market segment的部分，車用電子35%、Consumer 20%、Computing 16%、Industrial & Green Energy 13%、Power Supply 12%、Communication 4%。"}, {"i": 19, "ts": "10:16", "sec": 616, "who": "發言人", "role": "公司", "text": "在YoY比較上面，跟去年同期，車用增加2個百分點，Computing減少1，Industrial減少2，Communication增加1個%."}, {"i": 20, "ts": "10:35", "sec": 635, "who": "發言人", "role": "公司", "text": "到產品的部分，MOSFET 32%、Schottky 23%、Rectifier 12%、TVS 9%、Switching 7%、Zener 6%、ESD 6%、BJT 4%、SiC 1%。那YoY去做比較，MOSFET比重少了一個%，Schottky減少2個%，Rectifier減少1個%，Zener增加1個%，ESD增加2個%，BJT增加1個%。"}, {"i": 21, "ts": "11:11", "sec": 671, "who": "發言人", "role": "公司", "text": "在Regional的部分我們看到，中國市場現在佔我們39%的營收占比，台灣34%、EMEA 8%、Korea 8%、美國4%、東南亞4%、日本3%。"}, {"i": 22, "ts": "11:33", "sec": 693, "who": "發言人", "role": "公司", "text": "剛剛有一件事是沒有echo到，就是說其實在今年市場高度關注的AI跟HPC領域，今年前三季AI相關應用佔我們整體營收已經超越了12個百分點。我們針對雲端資料中心與AI伺服器所開發的高階MOSFET與保護元件，目前在伺服器相關供應鏈隨著新世代平台規格推進，客戶端需求維持穩健成長。特別是在伺服器電源關鍵的高中壓應用及熱插拔方案上，強茂憑藉著業界領先的超低導通阻抗與高散熱封裝技術，建立了極高的客戶黏著度。"}, {"i": 23, "ts": "12:40", "sec": 760, "who": "發言人", "role": "公司", "text": "接下來是跟大家更新我們在車用的最新進展。強茂符合AEC-Q101規範的車規產品線自2017年以來呈現年成長趨勢。2026年前三季車用產品營收較去年同期大幅成長47個百分點。回顧2025全年，我們的車規產品出貨量達到58.1億顆。目前累計提供超過2000款車規料號，服務全球超過20個國家、300家以上的車用客戶。"}, {"i": 24, "ts": "13:34", "sec": 814, "who": "發言人", "role": "公司", "text": "另外，在我們核心的車用市場裡面，今年前三季車用營收占比已經到35%。剛剛有提到AEC-Q101車規產品營收年成長率達到47%。儘管全球車市終端總量成長趨於平緩，強茂的成長主要動能來自市占率的實質擴張。我們的車規二極體及MOSFET在多項國際一線車用與公控大廠的基準測試中，無論是在抗電磁干擾EMI或是熱阻散熱特性上，皆展現優於國際同業的水準。這也是主要原因為什麼我們跟客戶可以有那麼高的黏著度，以及說在整體市場相對來說比較趨緩的狀況下，我們可以持續在我們的汽車應用持續成長年對年的狀況下。"}, {"i": 25, "ts": "14:55", "sec": 895, "who": "發言人", "role": "公司", "text": "以上是今天的內容，這份material應該等等就會上傳到MOPS跟官網上面，如果有需要的話可以直接線上線上去下載。看大家有沒有提問？有沒有問題？"}, {"i": 26, "ts": "15:18", "sec": 918, "who": "發言人", "role": "公司", "text": "沒有問題的話，那我們就下季見。謝謝大家。"}, {"i": 27, "ts": "15:22", "sec": 922, "who": "主持人", "role": "主持人", "text": "那謝謝Ben，那我們今天的法說會就到這邊結束，謝謝大家的時間，拜拜。"}], "qa": null, "chars": 3262, "last_min": 15, "cpm": 212, "status": "full", "memo": [{"title": "亮點", "points": [{"text": "強茂低功率矽整流器領域位居全球第四大供應商。", "ts": "02:30", "who": "發言人", "seg": 5}, {"text": "2026年前三季AI相關應用佔整體營收比重已超越12%。", "ts": "11:46", "who": "發言人", "seg": 22}, {"text": "2026年前三季車用產品營收較去年同期大幅成長47%。", "ts": "12:59", "who": "發言人", "seg": 23}]}, {"title": "營收", "points": [{"text": "2026年第三季單季合併營收為43.497億元，季增10%、年增33%。", "ts": "04:46", "who": "發言人", "seg": 9}, {"text": "2026年前三季地區營收比重分別為中國39%、台灣34%、EMEA 8%、韓國8%、美國4%、東南亞4%、日本3%。", "ts": "11:15", "who": "發言人", "seg": 21}]}, {"title": "毛利與獲利", "points": [{"text": "2026年第三季營業毛利為16.214億元，單季營業毛利率達37.3%，季增4.1個百分點、年增6個百分點。", "ts": "04:58", "who": "發言人", "seg": 10}, {"text": "2026年第三季營業利益為6.972億元，營益率升至16.0%，季增4.3個百分點、年增7.5個百分點。", "ts": "05:37", "who": "發言人", "seg": 11}, {"text": "2026年第三季稅後淨利為6.789億元，單季EPS為1.7元，季增32.8%、年增115.2%。", "ts": "06:27", "who": "發言人", "seg": 13}, {"text": "2026年前三季前三季獲利成長主要來自核心功率分離式元件業務的推升。", "ts": "09:30", "who": "發言人", "seg": 17}]}, {"title": "產能與擴產", "points": [{"text": "公司目前擁有3座晶圓廠（高雄6吋與8吋、山東4吋）及5座後端封測廠。", "ts": "02:44", "who": "發言人", "seg": 6}, {"text": "2026年下半年越南胡志明市新封測廠加入營運版圖，強化東南亞第三地供應能力。", "ts": "03:04", "who": "發言人", "seg": 6}]}, {"title": "產品與技術", "points": [{"text": "2026年前三季產品營收比重：MOSFET 32%、Schottky 23%、Rectifier 12%、TVS 9%、Switching 7%、Zener 6%、ESD 6%、BJT 4%、SiC 1%。", "ts": "10:35", "who": "發言人", "seg": 20}, {"text": "針對雲端資料中心與AI伺服器開發高階MOSFET與保護元件，憑藉超低導通阻抗與高散熱封裝維持黏著度。", "ts": "11:54", "who": "發言人", "seg": 22}, {"text": "車規產品通過AEC-Q101規範，2025全年車規產品出貨量達58.1億顆，累計提供超過2000款車規料號。", "ts": "12:50", "who": "發言人", "seg": 23}]}, {"title": "客戶", "points": [{"text": "全球合作車用客戶數已超過300家，服務覆蓋全球20多個國家。", "ts": "13:21", "who": "發言人", "seg": 23}]}, {"title": "Q&A", "points": [{"text": "問：現場是否有投資人提問？／答：現場無人提問，會議結束。", "ts": "15:12", "who": "發言人", "seg": 25}]}], "quotes": [{"report": "2026-11-13", "quotes": [{"cat": "本季實績", "text": "本季合併營收為4349.7 million NTD，較上季增加10%，YoY增加33%。", "anchor": "04:26", "who": "發言人", "seg": 9}, {"cat": "本季實績", "text": "營業毛利為1621.4個million，季增23.4%，年增58.4%。", "anchor": "04:58", "who": "發言人", "seg": 10}, {"cat": "本季實績", "text": "單季營業毛利率來到37.3，較上季33.2季增4.1個百分點，較去年同期31.3%增加6個百分點。", "anchor": "04:58", "who": "發言人", "seg": 10}, {"cat": "本季實績", "text": "營業利益率升至16.0%，較上季11.7%季增4.3個百分點，同期增加7.5個百分點。", "anchor": "05:34", "who": "發言人", "seg": 11}, {"cat": "營收", "text": "剛剛有一件事是沒有echo到，就是說其實在今年市場高度關注的AI跟HPC領域，今年前三季AI相關應用佔我們整體營收已經超越了12個百分點。", "anchor": "11:33", "who": "發言人", "seg": 22}, {"cat": "營收", "text": "另外，在我們核心的車用市場裡面，今年前三季車用營收占比已經到35%。", "anchor": "13:34", "who": "發言人", "seg": 24}]}]}, {"key": "4971_2026-11-12", "code": "4971", "name": "英特磊", "date": "2026-11-12", "segs": [{"i": 0, "ts": "00:00:15", "sec": 15, "who": "主持人", "role": "主持人", "text": "各位投資先進午安，歡迎各位投資先進參與康和證券主辦法人說明會，我們很榮幸邀請到英特磊科技股份有限公司經營團隊。"}, {"i": 1, "ts": "00:00:40", "sec": 40, "who": "財務長", "role": "公司", "text": "接下來跟大家做財務報告。首先看每一季的營業額和毛利趨勢圖。"}, {"i": 2, "ts": "00:01:15", "sec": 75, "who": "財務長", "role": "公司", "text": "到第四季，希望也有可能我們可以突破到3億5千萬，基本上我們是保持樂觀。"}, {"i": 3, "ts": "00:01:28", "sec": 88, "who": "高董事長", "role": "公司", "text": "我們的 QD Laser 研發進度其實比我們預期的要好。我們在年中就開始送到不同的學術單位跟政府研究單位。"}, {"i": 4, "ts": "00:02:06", "sec": 126, "who": "廣播", "role": "公司", "text": "所有人員請注意，現在已經發生火警，請儘速往安全門方向疏散。"}, {"i": 5, "ts": "00:02:35", "sec": 155, "who": "主持人", "role": "主持人", "text": "各位投資先進不好意思，剛才是現場康和證券的火警測試，我們現在繼續我們的會議討論。"}, {"i": 6, "ts": "00:02:55", "sec": 175, "who": "高董事長", "role": "公司", "text": "明年展望正面。正常我們都是講 10 到 20%，也許我們講 15 到 25%，這是一個我們可以比較有的估計。"}], "qa": null, "chars": 295, "last_min": 3, "cpm": 101, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "2026Q3 每股盈餘（EPS）達 1.26 元，營收與毛利表現穩健。", "ts": "00:00:40", "who": "CFO", "seg": 1}]}, {"title": "營收", "points": [{"text": "2026Q3 營收為 3.19 億元，較前季及去年同期均有顯著成長。", "ts": "00:00:40", "who": "CFO", "seg": 1}]}, {"title": "毛利與獲利", "points": [{"text": "2026Q3 毛利率達到 38.7%，稅後淨利為 5933 萬元。", "ts": "00:00:40", "who": "CFO", "seg": 1}]}, {"title": "營運指引", "points": [{"text": "2026Q4 營收目標力拼突破 3.5 億元，對未來展望保持樂觀。", "ts": "00:01:15", "who": "CFO", "seg": 2}, {"text": "2027 全年營收成長指引區間定為 10% 至 25%。", "ts": "00:02:55", "who": "CEO", "seg": 6}]}, {"title": "產品與技術", "points": [{"text": "QD Laser 研發進度超前，已於年中送樣至學術及政府研究單位。", "ts": "00:01:28", "who": "CEO", "seg": 3}]}, {"title": "Q&A", "points": [{"text": "問：2027年業績展望為何？／答：展望正面，營收成長預計落在 10-25% 之間。", "ts": "00:02:55", "who": "CEO", "seg": 6}]}], "quotes": []}, {"key": "4938_2026-11-12", "code": "4938", "name": "和碩", "date": "2026-11-12", "segs": [{"i": 0, "ts": "00:14", "sec": 14, "who": "主持人", "role": "主持人", "text": "各位投資先進午安，歡迎參加和碩聯合科技股份有限公司線上法人說明會，今天我們會議的主持人為 Arthur，富邦投顧研究部主管，謝謝。"}, {"i": 1, "ts": "00:54", "sec": 54, "who": "分析師 Arthur", "role": "分析師", "text": "大家好，我是富邦的 Arthur。今天很高興來主持和碩的 3Q26 法說會。今天在場有鄭光志執行長、鄧國彥執行長，還有謝爐惠財務長以及投資人關係 Lily。因為時間關係，我就把麥克風交給 Lily，就 3Q26 的財報跟大家說明。"}, {"i": 2, "ts": "01:20", "sec": 80, "who": "發言人 Lily", "role": "公司", "text": "謝謝 Arthur。各位午安，接下來由我向各位報告和碩聯合科技第三季的財務及業務資訊。在進入今天的報告之前，請各位閱讀第二頁的 Disclaimer Notice。接著請各位看到第四頁的合併損益表。今年截至第三季的合併營收為 9076 億 2600 萬元，跟去年同期相比增加約 13.8%，主要是資訊和通訊產品營收成長所帶動。毛利部分，今年截至第三季營業毛利為 404 億 6700 萬元，毛利率為 4.5%，與去年同期 3.7% 相比較高，主要是去年第二季有匯率影響，今年另外受惠於資訊產品營業規模提高、消費性電子及車用產品線有較佳的產品組合及生產效率所帶動。在營業費用部分，今年截至第三季約 254 億 400 萬元，營業淨利約 150 億 6300 萬元，營業淨利率為 1.7%，較去年同期 0.9% 為高。接下來今年截至第三季業外收益為 60 億 5100 萬元，跟去年同期相比減少約 30%，主要是今年的淨利息收入以及投資收益較少等原因所致。今年截至第三季稅前盈餘為 211 億 1400 萬元，扣除所得稅後，本期淨利約為 162 億 3900 萬元，歸屬母公司的部分則為 100 億 2700 萬元，每股盈餘為 3.74 元。"}, {"i": 3, "ts": "03:13", "sec": 193, "who": "發言人 Lily", "role": "公司", "text": "下面第五頁是 2026 年第三季單季合併損益表的比較。今年第三季合併營收約為 3890 億 3300 萬元，與去年同期及前一季相比，分別增加了 50.9% 及 42.8%，主要是三大產品線及車用產品的營收成長所帶動。在營業毛利部分，今年第三季為 175 億 1000 萬元，毛利率為 4.5%。營業費用方面，今年第三季為 94 億 7300 萬元，營業利益則為 80 億 3600 萬元，營業利益率為 2.1%，與前一年同期及上一季相比皆有成長，主要是因為業務規模表現有增長，以及合併子公司獲利表現有顯著提升。再看到業外部分，今年第三季的業外收益為 18 億 6900 萬元，跟前一年同期及上一季相比皆有下滑，主要是今年第三季的金融資產評價利益較低所致。再往下看今年第三季的稅前盈餘為 99 億 500 萬元，扣除所得稅費用之後，本期淨利為 71 億 6600 萬元，歸屬母公司的部分則為 39 億 7700 萬元，每股盈餘為 1.49 元。"}, {"i": 4, "ts": "04:50", "sec": 290, "who": "發言人 Lily", "role": "公司", "text": "接下來請大家翻到第六頁的資產負債表。截至今年第三季，相關應收應付帳款皆在正常水位。存貨與去年同期相比有增加，主要是部分策略性備料，以及因應伺服器產品出貨規模成長所做的準備。財務比率部分，流動比率截至今年第三季為 121%，負債比率 70%，有息負債比率則為 25%。第七頁的部分，現金流量，截至今年第三季營業活動為淨現金流出約 1284 億元，投資活動之淨現金流出約 24 億元，融資活動部分淨現金流入約 1495 億元，期末現金則為 1400 億元。折舊攤銷部分，截至今年第三季折舊攤銷費用約 120 億元。"}, {"i": 5, "ts": "05:55", "sec": 355, "who": "發言人 Lily", "role": "公司", "text": "請各位翻到第九頁合併營收趨勢。今年第三季合併營收約為 3890 億元，較上季上升 42%，去年同期也成長 50%，主要是三大產品線營收成長，特別是資訊及通訊產品出貨規模提升所帶動。而下一頁可以看到各產品線營收分析年對年比較。資訊及通訊產品受惠於伺服器及手機業務出貨規模增加，營收年對年大幅成長，同時消費性電子的營收表現也略有增加。接下來請大家看到下一頁季對季的比較部分。三大產品線受惠於旺季，其營收較上一季皆有雙位數的成長。以上報告。"}, {"i": 6, "ts": "06:51", "sec": 411, "who": "分析師 Arthur", "role": "分析師", "text": "謝謝 Lily。那我們是不是請執行長這邊就 4Q26 以及展望跟我們說明好嗎？"}, {"i": 7, "ts": "06:59", "sec": 419, "who": "CEO 鄭光志", "role": "公司", "text": "好，謝謝 Arthur。那我很久就我們的三大產品線 3Q26 的現況跟 4Q26 還有 2026 的 Outlook 向各位先進報告一下。在資訊產品方面，3Q26 營收 QoQ 成長雙位數，主要受惠於伺服器出貨規模持續提升，對整體營收帶來正面影響。4Q26 預計 Server 產品能再持續帶動整體 Computing 營收，除了 GB 系列產品以外，Storage 和 Compute Server 的出貨需求仍然會持續成長。2026 今年整體 Computing 營收預估將有年對年翻倍的成長，主要來自伺服器客戶需求出貨增加以及 Desktop 產品線的出貨延續。"}, {"i": 8, "ts": "08:04", "sec": 484, "who": "CEO 鄭光志", "role": "公司", "text": "在消費性電子產品方面，3Q26 為消費性電子產品的傳統旺季，Game Console 以及 IoT 相關產品的出貨量增加，帶動整體營收也有 13% 的季對季成長。4Q26 預計消費性電子產品經過 3Q 旺季需求後，需求會逐步趨緩。今年消費性電子產品出貨表現大致符合我們的期望，唯部分產品線受到缺料影響，其營收貢獻稍不如預期。"}, {"i": 9, "ts": "08:47", "sec": 527, "who": "CEO 鄭光志", "role": "公司", "text": "在通訊產品方面，3Q26 受惠於智慧型手機新機的發表，以及網通產品的終端市場需求回溫，整體營收表現 QoQ 強勁成長。4Q26 預計整體通訊產品能延續出貨，預期季對季將有穩定的營收趨勢。今年網通產品已有實際感受到終端產品需求的回溫，智慧型手機的業務將持續依產業發展及客戶需求做相對應的調整。以上報告。"}, {"i": 10, "ts": "09:30", "sec": 570, "who": "分析師 Arthur", "role": "分析師", "text": "謝謝執行長。那在開放問題之前，我想有幾個問題先發問，待會再請 Ivy 說明發問的規則。首先我想恭喜執行長，這個業績大幅成長。那我看到第一個問題就是大部分的外資法人說，這個 9 月份的 GB300 機櫃是不是開始大量出貨？那最主要是 3Q 有較高的單價，那我們想知道對毛利的稀釋狀況如何？再來就是德州廠跟台灣廠產能利用率加高，那 AI 伺服器對 OP Margin 貢獻是不是有出現明顯的規模經濟效益？"}, {"i": 11, "ts": "10:16", "sec": 616, "who": "CEO 鄭光志", "role": "公司", "text": "Arthur 你好，還有線上的業界先進大家好。我想伺服器的產品大家應該都耳熟能詳，對於它的產品售價或甚至它的組成，還有它的生意模式應該都非常清楚。那以和碩這樣子的 ODM 代工廠其實賺的也是辛苦錢，不過因為在整個業界的需求跟客戶的組合有很多的不一樣，那以我們公司當然現在以 NeoCloud 或甚至比較白牌的方式，其實我們也在尋求這些毛利的平衡點。確實真的很辛苦，不過我想我們也在這個客戶跟產品的組合性上面去爭取到對公司更好的利潤。那其中也不是只有 GB300，其實和碩在 Compute 跟 Storage 這邊也有大量的出貨，只是因為它的單價相對於 GB 系列是稍微低的，不過我們除了客戶的組合之外，其實我們也在產品上面做一個比較平衡性的 balance。那我們來看 2027 的話，我們還是蠻審慎樂觀，也對明年的業績有一定的把握。在整體的生產規模跟分配上面，在台灣跟北美的因為人力資源特性有不一樣的考量，所以我們基本上在北美可能會是比較以 Level 11 的機櫃方式來規劃。那現在因為我們有第一步的出貨，可是因為我們預期到明年還有一些生意的把握度，所以在產能的規劃上有稍微再積極一點，那這個也在整個 CapEx 的支出也會稍微大一點，不過我們認為明年的出貨應該是可以把它 balance 回來的，謝謝。"}, {"i": 12, "ts": "13:22", "sec": 802, "who": "分析師 Arthur", "role": "分析師", "text": "好，謝謝執行長。那我第二個問題之後就開放。剛剛講到 CapEx，看到應該是營運資金的飆升，看到這個存貨跟備料都大幅上修，應該是有一些資金壓力，尤其是看到 3Q 營收爆增，看到也嚇到，從 9 月 10 月都是非常好，也比 Consensus 好很多，尤其是 10 月營收幾乎快達 Consensus 的快十成，所以是比預期的好。那目前庫存水位跟應收帳款資金壓力是否已經到巔峰？那上次有講說會上修 2026 年資本支出原定 3 到 3.5 億美金投資北美跟台灣，然後也會發行 ECB，這對利息跟財務結構會有什麼影響？"}, {"i": 13, "ts": "14:17", "sec": 857, "who": "CFO 謝爐惠", "role": "公司", "text": "我想基本上我們的財務你看前三季的報表其實還是蠻健全蠻穩定的。那當然上次董事會也通過各種籌資管道包含 ECB，那我們是備而不用啦，因為看起來目前還算健全，所以不管是已經幾個籌資的方法我們其實都經過董事會通過的，所以我們先備而不用。那當然對我們來講我們一直在講說今年是我們伺服器的元年，所以未來的成長還蠻大的，所以資金的壓力我們財務長在這邊看沒有的話是騙人的。那我們也希望 Overall 整個在資本上面的支出跟我們的應收帳款跟我們實際的營運可以多 Turn 幾次，那這樣子的資金壓力就會少很多。Overall 來看其實就算今年我們出 GB 系列的東西，其實跟外面做 GB 的 Margin 其實也可以比較的。只是因為我們的新廠很短的持續投資，所以 CapEx 或是整個成本還在 Offset 基本的毛利，所以看起來剛開始第一兩個月看起來會比較辛苦一點是沒辦法的，那就等往後看其實還蠻審慎樂觀。"}, {"i": 14, "ts": "15:56", "sec": 956, "who": "分析師 Arthur", "role": "分析師", "text": "好，那 Ivy 我們是不是麻煩您跟我們說明規則然後開放 Q&A 好嗎？"}, {"i": 15, "ts": "16:06", "sec": 966, "who": "發言人 Ivy", "role": "公司", "text": "謝謝 Arthur，那目前我們開放 Q&A 線上交流時間，各位投資先進如果有問題您可以使用系統的舉手鍵功能，還是在聊天室留下您的文字提問，我們將會依序邀請您提出問題，再邀請管理階層回答。"}, {"i": 16, "ts": "16:30", "sec": 990, "who": "發言人 Ivy", "role": "公司", "text": "那我們第一個問題來自於 KGI 的 Angela，Angela 請發言。"}, {"i": 17, "ts": "16:40", "sec": 1000, "who": "分析師 Angela", "role": "分析師", "text": "執行長、管理階層你們好，我想跟您請教一下，就是我們看到 3Q 這個 Computing 21% 算起來大概是 821 億的營收，可以幫我們大概拆解一下這裡面是屬於 Server 的部分大概佔多少？那因為之前可能公司比較不特別去把這拆出來是因為可能還不夠明顯，是想說現在這個已經看起來有蠻明顯的增長情況下是否可以未來也幫我們拆分一下這塊的數字或者是未來成長的動能？這是我第一個問題謝謝。"}, {"i": 18, "ts": "17:18", "sec": 1038, "who": "CEO 鄧國彥", "role": "公司", "text": "你好，我想我們這個資訊產品大概就是包含 Notebook、Desktop 跟 Server 嘛。那我想 Desktop 當然也是有一些特殊的產品也是呈現成長的趨勢，那 Server 當然更不用講。以 Notebook 我想今年在季跟一些原物料的限制下，數量雖然有一點下降，不過因為單價也上漲很多，所以以 Notebook 的營業額來看我們也是看到稍微持平在增加一點。那當然整體最大其實還是來自於 Server 的大量成長，那如果你看到我們同業的這些有商，其實他們的 Server 也都已經超越傳統的資訊產品非常多，那這個也是我們努力的方向，也應該要更努力去跟有商對齊才對，那這也是我們明年的目標，謝謝。"}, {"i": 19, "ts": "18:45", "sec": 1125, "who": "分析師 Angela", "role": "分析師", "text": "好，我可以大概從你們 3Q 在 Computing 裡面如果說這個金額上面的差異多半是來自於 Server 這邊的貢獻嗎？可以這樣子來想像嗎？或者是直接回答大概我們 Server 大概有 10% 在整個 category 裡面？"}, {"i": 20, "ts": "19:03", "sec": 1143, "who": "CEO 鄧國彥", "role": "公司", "text": "全年的部分，整個合併營收的 10%。對，這個也是我們上次有一直強調的目標，那我們覺得我們是可以達得到的。"}, {"i": 21, "ts": "19:26", "sec": 1166, "who": "分析師 Angela", "role": "分析師", "text": "可以再問一下這個 10% 是第三季還是 1 到 3 季？"}, {"i": 22, "ts": "19:32", "sec": 1172, "who": "CEO 鄧國彥", "role": "公司", "text": "就是全年啦。今年會 10%。OK 好，今年會 10%。那另外跟您請教一下接下來剛剛有提到說看好嘛那非常正面的想法，那今年那時候講說是可能有十倍以上的這種成長幅度，那我們換算起來就像差不多有 10%，那 2027 年可以稍微幫我們勾勒一下這塊的成長性大概怎麼樣？那可以也順便提示一下大概的產品別，比如說是 VR 或者是 HGS 或者還有一些 ASIC，還是呢在客戶端上面比較 focus 在哪一些層面 NeoCloud 還是 CSP？那這邊的動能哪些會比較明顯？這是我第二個問題謝謝。"}, {"i": 23, "ts": "20:26", "sec": 1226, "who": "CEO 鄭光志", "role": "公司", "text": "這個也是由我來回答，就像我剛剛講的我們在產品的組合上面希望要比較 balance 一點嘛，所以不管是 VR 或 GB 或者是 HGX 這一種，那甚至剛剛講的 Compute、Compute 的 tray 還有 Storage，那甚至這個 SOC 就是自研的 ASIC 我們其實做得分蠻平均的，我們這一種自研的 ASIC 也有好幾家客戶都在今年年底到明年都已經要接近要 ramp up，明年應該都是要大量出貨的狀況。那在這一個部分我們就是尋求比較平均一點，那因為每一種的產品都有它不同的利潤規範，所以也有它的風險，所以能有一些比較好的組合對公司的發展還有公司的運作其實是比較健康的。補充一下對 Hyperscale 的 CSP 其實我們也持續在推進中，那我們也希望明年可以實際上看到一些數字的貢獻。我想這那個鄭執行長講的我們審慎樂觀，那一切也都跟我們的預期蠻接近的。那明年整體來看我們其實還是有幾倍的成長，這個應該是還蠻有把握的。"}, {"i": 24, "ts": "22:25", "sec": 1345, "who": "分析師 Angela", "role": "分析師", "text": "OK 好，我再稍微確認一下就是現階段我們的 Server 營收可能多半不是 CSP 還是比較是 NeoCloud 的成分多？那明年的話就會有一些 Hyperscale 的 CSP 加入，那整體拉高一些貢獻度，然後是 coverage 整個 NVIDIA 的 GB 或 HGX 跟 ASIC 的這些系列大概都有一些 coverage，大概是這樣的一個結論是嗎？"}, {"i": 25, "ts": "22:54", "sec": 1374, "who": "CEO 鄭光志", "role": "公司", "text": "對。"}, {"i": 26, "ts": "22:57", "sec": 1377, "who": "分析師 Angela", "role": "分析師", "text": "OK 理解。那如果說是這樣子的動能明年度又翻了幾倍，規模經濟上面你覺得這塊的 OP Margin 好了，我們在講 OP Margin 的狀況跟我們公司的平均值來講的話是不是會有一個比較靠近的狀況？"}, {"i": 27, "ts": "23:20", "sec": 1400, "who": "CEO 鄭光志", "role": "公司", "text": "我想就是說你如果從業界的先進這個有商或是先進公司們你大概也可以看到一個不一樣的比例嘛，那我們其實也希望我們可以跟他們接近或甚至跟他們一樣，或在我們更精實的努力下可以超越同業，這當然是我們的終極目標啦。"}, {"i": 28, "ts": "23:51", "sec": 1431, "who": "分析師 Angela", "role": "分析師", "text": "OK 了解。好那最後一個問題也是順便可以跟我們分享一下 2027 年包括我們其他的像 Notebook 的想法或者是消費性電子明年的看法以及通訊相關產品明年的這個需求或營收動能可以稍微跟我們分享一下嗎？謝謝。"}, {"i": 29, "ts": "24:14", "sec": 1454, "who": "CEO 鄧國彥", "role": "公司", "text": "消費性電子產品來看其實我想未來的一兩年其實都很類似，就大概大概在下去也不過今年的啦，我想因為 memory 的價跌開始 stabilize 很小幅度的上漲，所以如果在 Console 來看其實有很多的新機新機的發表啦未來的發表的準備啦或一些熱門的軟體啦或一些新的東西來講這個這個也會造成我們 4Q26 其實跟 3Q26 也是有一定一定的出貨的動能。那當然當然就是對某一部分的消費性電子產品它對 memory 比較 sensitive 那一部分那一部分的影響對我們來講其實不大，因為營業額在 consumer 的 segment 裡面佔比並不大。所以大家看到的應該感覺是應該會會還好啦。那 communication 這一塊其實剛剛有跟那個各位先進報告，就是對我們來講我們看到網通這一塊其實在今年下半年開始往上走了，所以我們期待明年是比較有收穫的一年。那對 Phone 來講其實我們是跟著客人的腳步客人的 tempo 走，那這個就沒有太多可以評論的。我想就是說對網通的產品因為我們今年在團隊的努力也有拿到一些不錯的新生意啊，所以在整體市場的稍微回溫，那還有我們這個新生意的挹注其實看到明年其實是比較好的狀況。"}, {"i": 30, "ts": "26:09", "sec": 1569, "who": "分析師 Angela", "role": "分析師", "text": "OK 好謝謝。所以聽起來是三個事業部除了 communication 是可能跟著客戶走，那剩下兩個事業部裡面的各項子項目應該都是正看待的。"}, {"i": 31, "ts": "26:22", "sec": 1582, "who": "CEO 鄭光志", "role": "公司", "text": "是的，目前都是。"}, {"i": 32, "ts": "26:26", "sec": 1586, "who": "分析師 Angela", "role": "分析師", "text": "OK，那比較大的成長動能還是倍數級的就是 Server 這塊。"}, {"i": 33, "ts": "26:31", "sec": 1591, "who": "CEO 鄭光志", "role": "公司", "text": "是的，因為我們還小，所以我們還更有空間。"}, {"i": 34, "ts": "26:36", "sec": 1596, "who": "分析師 Angela", "role": "分析師", "text": "OK，應該今年會有一個千億級的 level 了吧，然後明年再再個幾倍這樣子的方向，我這樣子的想法需要做一點修正嗎？"}, {"i": 35, "ts": "26:48", "sec": 1608, "who": "CEO 鄭光志", "role": "公司", "text": "我們我們一定努力達到這個目標。"}, {"i": 36, "ts": "26:54", "sec": 1614, "who": "分析師 Angela", "role": "分析師", "text": "好的，謝謝，我的問題先到這裡，謝謝。"}, {"i": 37, "ts": "27:12", "sec": 1632, "who": "分析師 Arthur", "role": "分析師", "text": "目前線上沒有看到舉手提問，那在這個空檔時間我想還有一個問題想跟執行長請教，就是說剛剛也確認說 2026 是和碩的伺服器出貨元年，那我看到有些外資客人就是說，剛剛講是延續到 2027 年是不是還有，那看起來是，那之前我們也特別討論過就是說先前跟這個系統電在佈局這個北美 BBU 就是備用電池這一塊，然後以及跟這個重要的車用客人在這個墨西哥擴廠，那我們想了解說這個在 2027 年可不可以成為就是手持裝置還有伺服器以外的第三個穩健的支柱？"}, {"i": 38, "ts": "28:04", "sec": 1684, "who": "CEO 鄭光志", "role": "公司", "text": "我想跟這個系統電當然有一定的 synergy 啦，那除了其實一開始主要當然從車用電子的這個客戶的開發，還有這個在伺服器上面是不是有更好的 synergy，不過就就像我們的 Server 或者是他們的 BBU，這個都是有各自有各自要各自努力去尋找客戶，尤其在這些大客人身上有很多東西其實是指定性的，那我想以我們在推展業務當然是希望以一個全面性的產品線來提供給客人更多的選擇，那在這樣子的 synergy 下面其實也我們也得到一些本來沒有預期到的一些效益，比如說這個系統電在北美的工廠，他在美國的工廠是有 SMT 線的，那和碩這邊的 SMT 線其實在墨西哥，那有一些客人的需求因為一定要在美國做 SMT，那剛好有這個 synergy 就剛好擴展了更多的生意層面，那在電動車或汽車部分其實可能也會有這樣子的 synergy，有可能是和碩已經有的客人可以帶進給系統電，或者系統電原本比較小規模的生產線能不能剛好 leverage 到和碩墨西哥的生產可以在擴充更大的機會或產能，我想這個因為有一個同質性的特質在那一遍，我想很多 benefit 會因為這樣子合作而有無限的可能，好，謝謝。"}, {"i": 39, "ts": "30:26", "sec": 1826, "who": "分析師 Arthur", "role": "分析師", "text": "有一個問題我想請教兩位執行長，我們知道有一家太空中心他們明年就是很積極的在擴展算力嘛，然後公司也跟他們另外幾個公司也是非常的熟悉，然後不知道說因為他有特別說明說他想明年的算力的會增加到 4GW 在他的法說會，那我不知道公司這邊是不是有跟他們有什麼樣的機會或合作？你們怎麼看這個東西？尤其你們跟他們也非常的手在車用這邊，那我不知道執行長就是說和碩這邊的角色在這個伺服器方面有什麼樣的進展或什麼可以分享？"}, {"i": 40, "ts": "31:11", "sec": 1871, "who": "CEO 鄭光志", "role": "公司", "text": "我想就是說對於任何一個好的生意我們都不會放棄，那 Arthur 你剛剛提到的這一個面向我們也非常的注意，那只要我們的能力還有這個資金還有這個毛利的考量下面都是正面的，我們也絕不會放棄。"}, {"i": 41, "ts": "31:47", "sec": 1907, "who": "分析師 Arthur", "role": "分析師", "text": "我看到線上有一位 UBS Randy，那我大概說明一下，他是說 Can you provide more detail about driver for 45% YoY growth in communication in 3Q between smartphone and networking? 那你們看到怎樣的成長，然後 Any change in the leader share compared to when UBS year for smartphone built? 這個問題是說可以看到 communication 大幅成長，那 UBS Randy 想知道說這邊拆掉是 smartphone 跟 networking 的各方面，這個我們其實不對單一客人做任何的評論，尤其是單一客人單一產品，不好意思。"}, {"i": 42, "ts": "32:37", "sec": 1957, "who": "分析師 Arthur", "role": "分析師", "text": "另外一個就是 You see being the early wave for VR for another step up in the server growth in the first half year or be late? How is the OP dollar and margin and rack price? 就是說想請問執行長就是你們看到這個有沒有開始在出貨 VR 或者更早，在明年的上半年是不是會有大量的出貨？"}, {"i": 43, "ts": "33:04", "sec": 1984, "who": "CEO 鄭光志", "role": "公司", "text": "我們我們有有在應該說不是 VR 是在 AR 或者是 VR-like，VR-like 喔那那我想就是說 VR-like 在今年我們都有拿到少量的數量，不過那個主要是 for 我們自己公司內部的驗證，還有對一些主要客人的 remote testing，那目前的在我們自己內部的這個驗證測試跟客戶的回饋下看起來都還蠻正面的。那整個 VR 的 planning 其實還是在我們的這個主要供應商這一邊，尤其它所掌控的零組件比例相當高，所以我們這邊雖然有客人的需求時間點，那當然也要看我們主要的供應也是廠商也是客人這一邊的時程來做決定，不過我們看到明年上半年我們是肯定有貨可以出啦。我們其實還是有那個需求，需求也不少，可是最終還是要看這個供應商這裡供應的情況，因為我想不只是和碩得到很多的 demand，其他業界的有商應該也都得到非常強烈的 demand 才對。那最後這個整個供應鏈的分配其實還是在我們最大的這一個的夥伴身上。"}, {"i": 44, "ts": "34:53", "sec": 2093, "who": "分析師 Arthur", "role": "分析師", "text": "那後面的問題就是 OP dollar 跟 Margin 你們怎麼看？就是會不會有影響？"}, {"i": 45, "ts": "35:00", "sec": 2100, "who": "CEO 鄭光志", "role": "公司", "text": "這個我想比例應該都差不了太多啦，不過因為 VR 的售價往上提高很多。"}, {"i": 46, "ts": "35:12", "sec": 2112, "who": "發言人 Ivy", "role": "公司", "text": "謝謝，那我們目前有一個舉手提問來自於 J.P. Morgan 的 Elbert，謝謝。"}, {"i": 47, "ts": "35:23", "sec": 2123, "who": "分析師 Elbert", "role": "分析師", "text": "官總你們好，我是 J.P. Morgan 的 Elbert。我第一個問題是想問我看第三季的這個 OP Profit 8 個 billion 嘛，那比去年 3.2 個 billion 其實多非常多，但如果扣掉子公司合併的部分，那其實就會這個集團和碩身大概只有增加大概 800 個 million，所以如果我們就回推整個 DMS 的 margin 的話，其實今年第三季的 DMS margin 比去年第三季還來的少，那跟第二季比起來也就是小幅提升一點點，那我想問一下可不可以跟我們多分享一下這塊 margin 我們在這邊看到營收往上很多，那整個 UTR 往上，也有新業務進來，但 margin 上並沒有看到大幅改善背後的原因是什麼？謝謝。"}, {"i": 48, "ts": "36:18", "sec": 2178, "who": "CFO 謝爐惠", "role": "公司", "text": "Elbert 你講的是我們在第三季的這個 Gross Margin 嗎？DMS Margin，不是 operating，operating income 如果在其實在我們看整個 DMS 本身的毛利跟就是 OP margin 其實都跟去年同期相比大概都有相當程度的增加，那這個當然再回到說這一個季度其實在整個 revenue growth 的兩個主要的 factor，一個當然是 communication 的部分，那另外一個就是 computing 的部分。在 communication 這個 segment 上面主要的 revenue 的 taker 大家可以理解這是一個比較成熟的產品了，那在那個產品呢那再加上今年市場蠻多 component 的單價出貨單價其實也都是提高了不少，所以這個程度在 revenue growth 上面確實有一定程度的這個占比。那另外在整個 computing 部分的一個非常大的 revenue growth contributor，那這個剛剛兩位執行長也有提到了，這個對我們來說今年大概是 server 出貨元年，那我們在下半年開始的這個出貨的整個 schedule 的掌控上面還有在整個 deployment 上面的一些良率效率跟更大的這個進步，其實我們也都一樣同步在進行當中。那這個是回答 Elbert 的問題。"}, {"i": 49, "ts": "38:02", "sec": 2282, "who": "分析師 Elbert", "role": "分析師", "text": "謝謝，我想追問一下有關於 server 的部分，就剛剛管理層也有提到說我們的目標就是說最後可能接近同業或超越同業嘛，那我想問現在這個 server 的整個部門的 OP margin 是是賺錢的嗎？那如果不適的話那我們預計什麼時候會 turn around？那比較中長期的一個公司覺得一個穩態的一個 OP margin 的水準大概是在什麼階段？"}, {"i": 50, "ts": "38:39", "sec": 2319, "who": "CEO 鄭光志", "role": "公司", "text": "這個剛剛有有提到就是說因為我們預期到明年在客戶的這個需求能見度下，其實我們看到我們目前的廠房的資源跟一些人員的資源其實還是不夠的，所以其實我們在整個 Q4 甚至到明年的 Q1 都還大力的在做建廠房、廠房內的設備，還有這個總公司這邊研發人員的人力，這個其實都都還算是在持續的投資，那你也知道就是說這個現在 server 的水冷在不管是 RD 的實驗室或者是工廠在生產所需要用到的這個 facility 其實那個費用都相當驚人。那當然我們做這麼大力的投資也是因為我們有把握明年已經看到的需求的部分，那當然這個也會在今年 Q4 或明年 Q1 也許大家看到我們的一些投資其實是比較大的，那這一個部分我們當然要趕快把出貨能及時的這個這個做得到才能去 balance 這樣子的投資。所以當然這個以現在的能見度來看包含明年我們可能還有其他不一樣的客人會加入，所以這個都時時刻刻都要努力去取的這個平衡點啦。那這個很難說哪一個時間就一定做得到，不過這個是我們整個團隊需要時時刻刻提醒自己，不只要爭取更好的毛利，也要精實的控制我們的支出才行。就像我剛剛講的，業界的這些高標準絕對是我們努力的目標，謝謝。"}, {"i": 51, "ts": "41:04", "sec": 2464, "who": "分析師 Elbert", "role": "分析師", "text": "謝謝，我第三個問題想針對商業模式在澄清一下，就是說我們蠻多客戶是這個 NeoCloud，那 NeoCloud 他們以前是跟這個品牌上去買像 Dell HP 這些，那當然這些 key component 也是由這些品牌上去負責，那我問題是說當這些 NeoCloud 跑來跟我們 ODM 直接下單那這部分的 key components 是由誰負責？那這些 memory 廠商他其實目前也是供不應求，那對於 key component 的能見度目前有多高？會不會變成是明年可能訂單很好但 key component 不夠，那讓我們沒辦法順利出貨的一個風險？"}, {"i": 52, "ts": "41:48", "sec": 2508, "who": "CEO 鄭光志", "role": "公司", "text": "這這裡面的運作模式有很多啦，包含就是說這一些主要零組件到底自由 consigned 還是 AVAP，還是這個 turn key，其實每一個客人都有他的定義。那剛剛有提到這個資金的運作全球其實也很緊，所以其實我們每一個業務也很努力來跟客人做討論跟溝通，在這個風險上面在資金的運作上面，還是在毛利上面如何取得一個平衡，這個非常重要。那我想其他先進應該也都是在做同樣的事，如果可以變 free consign 那我們就盡量把它變成 free consign，或者甚至這個 APAR 可以對抵啊，這一些這個 cash flow 上面的操作都會幫助公司或是甚至幫助客人有一個雙方都是共贏的局面的局面。那至於這個 key component 這個 shortage 一直都存在，那我們目前是採取比較積極的模式，NeoCloud 當然也絕大部分都是客人他有自己的貨源，可能在某種情況下如果客戶需要我們協助的話我們也會盡力協助。那就像之前我有講過有一些客人主要也是因為我們剛好手上有一些貨源，所以順理成章的我們就做到這一筆生意，只是這個不是一定就就是這個樣子，這個還是 case by case 要來討論，謝謝。"}, {"i": 53, "ts": "43:51", "sec": 2631, "who": "分析師 Elbert", "role": "分析師", "text": "懂，謝謝。我最後一個問題就是剛剛關總有提到就是說現在整個全球資金都很緊缺嘛，那的確我們看到其他 ODM 他可能在 AI server 進展很好，那但因為可能資金的需求變高，那不被資本市場所青睞，那所以我覺得這塊感覺是一個之後和碩一定會遇到一個問題。那但和碩因為之前在整個手機的業務其實我覺得在 CCC day 這些都處理非常好，那現金流 cash 這些其實都相比同行來的好非常的多。所以我我這邊想請教關於財務長在這這一塊就是說我們之後要怎麼達到這個可能需要這個現金流，那又可以同時維持現有股中的權益達到一個平衡？那在一個 follow up 是說我看到最近我們這規師有把景碩的一些股份做處置嘛，那如果單從這個案子來看的話這個景碩他本身帶來的 ROIC 其實非常的高，有 20% 以上，那如果我們換成一個營業現金流的話那這個營業現金流還可以讓我們在這個 ROIC 上可以維持這個水準嗎？兩問題，謝謝。"}, {"i": 54, "ts": "45:08", "sec": 2708, "who": "CFO 謝爐惠", "role": "公司", "text": "Elbert 這個十分謝謝你，這個我覺得這件事情你現在應該是我們有時候幾個同業其實坐在一起都在討論的事情。那 Pegatron 以 Pegatron 自己本身的條件來說，確實如同你所說我們在過去幾年幾個季度我們的負債比那甚至是在淨負債的這個負債比都是非常低的，那因為這樣子一個過去比較好的本錢，也讓我們在邁向 server 原年的這個年度呢我們在整個舉債的空間跟這個 credit limit 的這個增加上面其實都不是太大的這個問題，所以對我們來說目前在整個資金運作上面，那當然確實看得出來我們的整個負債比例也上去了，那但跟其他幾個同業來比的話我們應該還算是在可以接受的一個程度。那也因為我們在今年這個 server 的出貨狀況，那也有其他非常多的其他同業的你可以參考，所以我們目前內部呢對業務團隊其實也都是一個比較明確的一個，就是有關這個 capital 的 turnover 的一個 requirement，那業務團隊也會基於這樣子的法條，就是這個資金 cost 上面的計算去做他們相對應跟客人的這個報價。那這個我們當然認為在 2027 年整體業務在擴展的前提之下，那當然不可否認我們就像其他幾家同業都提及過這個跟客人是需要在接下來的一些運作模式上是需要溝通跟討論的，但我相信我們大致上也一樣，我們自己本身是有這個負債能力，那董事會也授權我們一些舉債的工具，那當然仍然還是需要業務跟我們一起的努力，謝謝。"}, {"i": 55, "ts": "47:10", "sec": 2830, "who": "分析師 Elbert", "role": "分析師", "text": "講清楚，謝謝，我沒有其他問題了。"}, {"i": 56, "ts": "47:15", "sec": 2835, "who": "分析師 Arthur", "role": "分析師", "text": "線上現在有 Ivy 給你給你說好。"}, {"i": 57, "ts": "47:23", "sec": 2843, "who": "發言人 Ivy", "role": "公司", "text": "目前線上有最後有來自投資人的兩個提問。那第一個來自國泰投信這邊想要詢問公司剛剛管理層有提到 ASIC 明年會大量出貨，那請問這個是指 CPU 還是 GPU 的部分？那第二個問題是想詢問說那公司這邊營運設計的產品會是在 L6 到 L11 的哪一個部分，謝謝。"}, {"i": 58, "ts": "47:50", "sec": 2870, "who": "CEO 鄭光志", "role": "公司", "text": "因為現在就是說整個 AI 有很多 bottleneck 嘛，就是說 memory 缺貨或 memory 的 bandwidth 不夠強，甚至耗電量太大，所以每一個這個自研 ASIC 的公司其實他們都有不一樣的著墨點，有的著墨在 LLM 的這種 training，也有著墨在 inference 的，那甚至最近可能都還有比較著重在邊緣 AI 這一種應用的。那這個這個其實百花齊放遍地開花，所以我們在從去年開始 involve，當然也可能還是比業界的先進慢了一點，不過我們還是蠻審慎樂觀有這樣子的機會。那有一兩個客人其實在今年年底有少量出貨，那明年這個應該看客戶的客戶的需求，因為這些自研的 SOC 的客人其實他們的中端客人其實也是 Tier 1 的 CSP，所以我們某種程度上也可以說我們間接的做到 first tier 的 CSP 的生意，那這個明年其實這些東西都有要按照他們預期的出貨，那如果這個在 CSP 這一邊如果使用的狀況是更好的話，我想這個 demand 應該也會再增加。那這一部分也不是只有 2027，我們看到的 demand 其實是還延續到 2028 去的，甚至 second generation 的也都都在同步在討論這樣。這定位回答你的問題，我們是以 L10 L11 為大部分的。"}, {"i": 59, "ts": "50:04", "sec": 3004, "who": "發言人 Ivy", "role": "公司", "text": "謝謝管理層的回應。那最後一個問題來自於投資人想詢問公司未來在業外這一塊要怎麼樣看？本季第三季較第二季大幅衰退，主要原因來自於利息嗎？謝謝。"}, {"i": 60, "ts": "50:24", "sec": 3024, "who": "CFO 謝爐惠", "role": "公司", "text": "這個季度，這是講說今年的第三季跟今年第二季嗎？是的，文字提問是這樣表示。是的，那這個對，確實沒有錯，今年最主要是因為第三季的時候整個利息評價的這個我們持有的這個利息股票它的評價有一個評價損失的。那當然第三季在整個資金的使用上，所以在利息的部分也是有比較多的這個利息費用的支出，謝謝。"}, {"i": 61, "ts": "51:02", "sec": 3062, "who": "分析師 Arthur", "role": "分析師", "text": "好，那 Ivy 我們就最後一個就是線上的提問。"}, {"i": 62, "ts": "51:12", "sec": 3072, "who": "發言人 Ivy", "role": "公司", "text": "最後一個提問來自於投資人想詢問最新的來自於最新 information 報導美國的商務部正在敲定像新的 AI 晶片出口管制，那計劃把一些馬來西亞新加坡等七個國家納入比較嚴格的限制後國海外數據中心遠程使用先進 AI 晶片，那這個部分會涉及 NVIDIA Blackwell 以及以上更高級別的先進晶片，那請問如果這個規則制定實施的話對公司營運上有沒有什麼樣的影響？謝謝。"}, {"i": 63, "ts": "51:56", "sec": 3116, "who": "CEO 鄭光志", "role": "公司", "text": "我想這個這一項限制也不是現在才開始，其實從我們第一批出貨的 server 上面在供應商或客人的規範上面其實就有蠻嚴格的限制。那我們公司除了這個業務自行要做這些生意跟客戶的調查之外，其實我們在公司內部的邊緣 customer code 的流程上面也加入法務的一些審核的機制，所以這對我們來講並不是一個新的要求。那在回過剛剛所說的，其實和碩應該在客戶的選擇性上面還有這些資金運作還有毛利的爭取的方向應該已經取得一個平衡性，所以我覺得這樣的限制第一個不是新的，第二個本來就是我們要考慮的範圍以內。那整個業界對伺服器還有 AI 的需求看起來還是正面的，所以我我們還是審慎樂觀啦。"}, {"i": 64, "ts": "53:25", "sec": 3205, "who": "分析師 Arthur", "role": "分析師", "text": "好的，謝謝。那因為今天時間關係，我們法說會就到此，那非常感謝各位投資人的詢問，那問題非常踴躍，那謝謝。"}, {"i": 65, "ts": "53:36", "sec": 3216, "who": "發言人 Ivy", "role": "公司", "text": "謝謝管理層以及各位投資先進的參與，那今天線上說法會就到這邊告一個段落，謝謝大家。"}], "qa": 6, "chars": 13282, "last_min": 54, "cpm": 248, "status": "full", "memo": [{"title": "亮點", "points": [{"text": "2026Q3 單季營收達 3,890.33 億元，QoQ 成長 42.4%、YoY 成長 50.9%。", "ts": "03:15", "who": "Lily", "seg": 3}, {"text": "2026Q3 單季 EPS 達 1.49 元，前三季累計 EPS 達 3.74 元。", "ts": "04:30", "who": "Lily", "seg": 3}]}, {"title": "營收", "points": [{"text": "2026 前三季累計合併營收為 9,076.26 億元，較去年同期成長 13.8%。", "ts": "01:35", "who": "Lily", "seg": 2}, {"text": "三大產品線及車用產品第三季出貨均呈現強勁成長動能。", "ts": "03:30", "who": "Lily", "seg": 3}]}, {"title": "毛利與獲利", "points": [{"text": "2026 前三季毛利率為 4.5%，營業利益率為 1.7%。", "ts": "01:50", "who": "Lily", "seg": 2}, {"text": "2026Q3 單季毛利率為 4.5%，營業利益率拉升至 2.1%。", "ts": "03:40", "who": "Lily", "seg": 3}]}, {"title": "營運指引", "points": [{"text": "2026 全年資訊產品（Computing）營收預估實現年對年翻倍成長。", "ts": "07:48", "who": "CEO", "seg": 7}, {"text": "伺服器產品（Server）2026 全年目標佔公司總合併營收達到 10%。", "ts": "19:03", "who": "CEO", "seg": 20}, {"text": "2026Q4 通訊產品營收預期呈現穩定持平趨勢。", "ts": "09:05", "who": "CEO", "seg": 9}]}, {"title": "訂單與能見度", "points": [{"text": "資訊產品受惠伺服器出貨持續擴大，帶動第四季 Computing 營收動能。", "ts": "07:30", "who": "CEO", "seg": 7}, {"text": "消費性電子進入傳統旺季後，第四季需求預期將逐漸趨緩。", "ts": "08:25", "who": "CEO", "seg": 8}]}, {"title": "產能與擴產", "points": [{"text": "積極規劃與擴充北美及台灣地區伺服器產能，應對明後年需求擴大。", "ts": "12:45", "who": "CEO", "seg": 11}]}, {"title": "Q&A", "points": [{"text": "問：伺服器產品對毛利率的影響及產能利用率狀況？／答：伺服器代工雖辛苦，但公司積極改善產品組合，並彈性調配北美與台灣產能需求。", "ts": "09:44", "who": "CEO", "seg": 10}, {"text": "問：伺服器占資訊產品與總營收的比重為何？／答：伺服器占整體合併營收已達 10%，明年將延續強勁成長趨勢。", "ts": "16:40", "who": "CEO", "seg": 17}, {"text": "問：面對伺服器備料與資本支出增加，資金壓力與財務結構狀況？／答：公司財務穩健且融資管道多樣，資本支出與備料均在良好控管中。", "ts": "14:18", "who": "CFO", "seg": 13}]}], "quotes": [{"report": "2026-11-12", "quotes": [{"cat": "營收", "text": "今年截至第三季的合併營收為 9076 億 2600 萬元，跟去年同期相比增加約 13.8%，主要是資訊和通訊產品營收成長所帶動。", "anchor": "01:20", "who": "發言人 Lily", "seg": 2}, {"cat": "毛利率", "text": "毛利部分，今年截至第三季營業毛利為 404 億 6700 萬元，毛利率為 4.5%，與去年同期 3.7% 相比較高，主要是去年第二季有匯率影響，今年另外受惠於資訊產品營業規模提高、消費性電子及車用產品線有較佳的產品組合及生產效率所帶動。", "anchor": "01:20", "who": "發言人 Lily", "seg": 2}, {"cat": "營益率與費用", "text": "在營業費用部分，今年截至第三季約 254 億 400 萬元，營業淨利約 150 億 6300 萬元，營業淨利率為 1.7%，較去年同期 0.9% 為高。", "anchor": "01:20", "who": "發言人 Lily", "seg": 2}, {"cat": "本季實績", "text": "今年第三季合併營收約為 3890 億 3300 萬元，與去年同期及前一季相比，分別增加了 50.9% 及 42.8%，主要是三大產品線及車用產品的營收成長所帶動。", "anchor": "03:13", "who": "發言人 Lily", "seg": 3}, {"cat": "毛利率", "text": "在營業毛利部分，今年第三季為 175 億 1000 萬元，毛利率為 4.5%。", "anchor": "03:13", "who": "發言人 Lily", "seg": 3}, {"cat": "營益率與費用", "text": "營業費用方面，今年第三季為 94 億 7300 萬元，營業利益則為 80 億 3600 萬元，營業利益率為 2.1%，與前一年同期及上一季相比皆有成長，主要是因為業務規模表現有增長，以及合併子公司獲利表現有顯著提升。", "anchor": "03:13", "who": "發言人 Lily", "seg": 3}, {"cat": "本季實績", "text": "今年第三季合併營收約為 3890 億元，較上季上升 42%，去年同期也成長 50%，主要是三大產品線營收成長，特別是資訊及通訊產品出貨規模提升所帶動。", "anchor": "05:55", "who": "發言人 Lily", "seg": 5}, {"cat": "展望", "text": "那我很久就我們的三大產品線 3Q26 的現況跟 4Q26 還有 2026 的 Outlook 向各位先進報告一下。", "anchor": "06:59", "who": "CEO 鄭光志", "seg": 7}, {"cat": "營收", "text": "4Q26 預計 Server 產品能再持續帶動整體 Computing 營收，除了 GB 系列產品以外，Storage 和 Compute Server 的出貨需求仍然會持續成長。", "anchor": "06:59", "who": "CEO 鄭光志", "seg": 7}, {"cat": "營收", "text": "2026 今年整體 Computing 營收預估將有年對年翻倍的成長，主要來自伺服器客戶需求出貨增加以及 Desktop 產品線的出貨延續。", "anchor": "06:59", "who": "CEO 鄭光志", "seg": 7}, {"cat": "展望", "text": "4Q26 預計消費性電子產品經過 3Q 旺季需求後，需求會逐步趨緩。", "anchor": "08:04", "who": "CEO 鄭光志", "seg": 8}, {"cat": "營收", "text": "4Q26 預計整體通訊產品能延續出貨，預期季對季將有穩定的營收趨勢。", "anchor": "08:47", "who": "CEO 鄭光志", "seg": 9}, {"cat": "展望", "text": "今年網通產品已有實際感受到終端產品需求的回溫，智慧型手機的業務將持續依產業發展及客戶需求做相對應的調整。", "anchor": "08:47", "who": "CEO 鄭光志", "seg": 9}, {"cat": "展望", "text": "那當然對我們來講我們一直在講說今年是我們伺服器的元年，所以未來的成長還蠻大的，所以資金的壓力我們財務長在這邊看沒有的話是騙人的。", "anchor": "14:17", "who": "CFO 謝爐惠", "seg": 13}, {"cat": "展望", "text": "那當然整體最大其實還是來自於 Server 的大量成長，那如果你看到我們同業的這些有商，其實他們的 Server 也都已經超越傳統的資訊產品非常多，那這個也是我們努力的方向，也應該要更努力去跟有商對齊才對，那這也是我們明年的目標，謝謝。", "anchor": "17:18", "who": "CEO 鄧國彥", "seg": 18}, {"cat": "營收", "text": "全年的部分，整個合併營收的 10%。", "anchor": "19:03", "who": "CEO 鄧國彥", "seg": 20}, {"cat": "展望", "text": "那另外跟您請教一下接下來剛剛有提到說看好嘛那非常正面的想法，那今年那時候講說是可能有十倍以上的這種成長幅度，那我們換算起來就像差不多有 10%，那 2027 年可以稍微幫我們勾勒一下這塊的成長性大概怎麼樣？", "anchor": "19:32", "who": "CEO 鄧國彥", "seg": 22}]}]}, {"key": "7610_2026-11-11", "code": "7610", "name": "聯友金屬-創", "date": "2026-11-11", "segs": [{"i": 0, "ts": "00:03:00", "sec": 180, "who": "主持人", "role": "主持人", "text": "各位投資先進午安，歡迎參加連友金屬的法人說明會。"}, {"i": 1, "ts": "00:13:00", "sec": 780, "who": "主持人", "role": "主持人", "text": "首先先為大家介紹一下今日代表出席的經營團隊，吳永中董事長、廖佩芬財務長。"}, {"i": 2, "ts": "00:22:00", "sec": 1320, "who": "主持人", "role": "主持人", "text": "那接下來我們就請吳永中董事長來為大家說明一下我們公司的營運概況及未來展望。"}, {"i": 3, "ts": "00:32:00", "sec": 1920, "who": "吳永中董事長", "role": "公司", "text": "謝謝大家，那個大家午安。因為現場有錄影，我先將一些該講的講一講，好不好？"}, {"i": 4, "ts": "00:41:00", "sec": 2460, "who": "吳永中董事長", "role": "公司", "text": "我們正好碰到這次法說會，我們昨天剛剛開完董事會，整個公告完成，坦白講我們也蠻順利完成我們第三季的財報，也都順利，也都順利。"}, {"i": 5, "ts": "00:58:00", "sec": 3480, "who": "吳永中董事長", "role": "公司", "text": "我們也大概維持今年一直到目前看出來，沒有看到對公司有什麼比較不利的影響，所以目前的話大概公司就維持現在這個軌道在往前進行。"}, {"i": 6, "ts": "01:11:00", "sec": 4260, "who": "吳永中董事長", "role": "公司", "text": "那主要的待會我會報告一下就是說，現在更重要的是明年，明年公司在今年，大家也都知道我們都公告，我們有幾個重大的投資。"}, {"i": 7, "ts": "01:24:00", "sec": 5040, "who": "吳永中董事長", "role": "公司", "text": "第一個就是三廠，三廠我們未來要往APT，還有那個APT就是重物酸安，還有氧化物進行。"}, {"i": 8, "ts": "01:34:00", "sec": 5640, "who": "吳永中董事長", "role": "公司", "text": "那這個部分可能大家比較不知道就是說，我們在這個地方，烏酸鈉的產能會比原本的產能再多120%，那整體的氧化物的產能會到6000噸，到6000噸。"}, {"i": 9, "ts": "01:46:00", "sec": 6360, "who": "吳永中董事長", "role": "公司", "text": "然後平科廠會有會有那個無粉碳化物，無粉碳化物大概1000噸到1200噸。"}, {"i": 10, "ts": "03:46:00", "sec": 13560, "who": "吳永中董事長", "role": "公司", "text": "我們這次跟上次的法說會不一樣的話，主要就是我們資本額大概有一些改變，大概在5億8000萬。"}, {"i": 11, "ts": "04:00:00", "sec": 14400, "who": "吳永中董事長", "role": "公司", "text": "也不瞞大家說，昨天董事會最後也有董事提到，希望公司很積極的去做轉板，很積極的去做轉板。"}, {"i": 12, "ts": "04:12:00", "sec": 15120, "who": "吳永中董事長", "role": "公司", "text": "所以對我們來講明年很重要的事情，就是我們把資本額滿足上市的條件以後，我們會很積極的去做轉板的動作。"}, {"i": 13, "ts": "04:58:00", "sec": 17880, "who": "吳永中董事長", "role": "公司", "text": "我們主要產品以前在法說的話主要就是無酸鈉，那現在這個部分就是在先進材料這一塊，先進材料這一塊無粉已經完成完成了。"}, {"i": 14, "ts": "05:11:00", "sec": 18660, "who": "吳永中董事長", "role": "公司", "text": "大部分我們的無粉的產品的話像複式模具啊，一些全世界比較大的廠商都已經測試完成了，測試完成已經進入比較小量的交貨了。"}, {"i": 15, "ts": "33:29:00", "sec": 120540, "who": "主持人", "role": "主持人", "text": "好的，感謝董事長帶來精彩的說明，那我們今天法說會就到這邊告一個段落，那非常謝謝大家今天的參與，謝謝大家。"}], "qa": null, "chars": 763, "last_min": 2009, "cpm": 0, "status": "bad_ts", "memo": [{"title": "營運指引", "points": [{"text": "公司未來將往APT、重物酸安及氧化物發展，其中烏酸鈉產能將比原本增加120%，氧化物產能將達6000噸。", "ts": "01:27:00", "who": "董事長", "seg": 7}, {"text": "公司資本額變更為5億8000萬元，未來將積極進行轉板。", "ts": "03:53:00", "who": "董事長", "seg": 10}]}, {"title": "產品與技術", "points": [{"text": "公司主要產品為無酸鈉，目前已完成先進材料無粉產品測試，並進入小量交貨。", "ts": "05:03:00", "who": "董事長", "seg": 13}]}], "quotes": []}, {"key": "4576_2026-11-11", "code": "4576", "name": "大銀微系統", "date": "2026-11-11", "segs": [{"i": 0, "ts": "00:03", "sec": 3, "who": "主持人", "role": "主持人", "text": "我是今天法說會主持人，寬量國際QC執行長Alex Lee，李宏基。"}, {"i": 1,
