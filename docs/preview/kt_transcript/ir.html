role": "分析師", "text": "四大 CSP 中 A 客戶在 Rack 端是否有缺料或出貨遞延狀況？"}, {"i": 43, "ts": "65:41", "sec": 3941, "who": "總經理", "role": "公司", "text": "新產品研發與安規申請過程中出現長短料是實際可能發生的，但整體大趨勢目前沒有改變且開始收斂，我們送樣均照客戶要求進行，未收到變更或延遲通知，整體展望依然樂觀。"}], "qa": 11, "chars": 3950, "last_min": 66, "cpm": 60, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "2026 年第三季每股盈餘創下歷史新高達 3.27 元，年增 60%。", "ts": "07:05", "who": "CFO", "seg": 3}, {"text": "前三季累積每股盈餘 8.08 元，年增 64%，持續改寫歷年新高紀錄。", "ts": "09:58", "who": "CFO", "seg": 5}, {"text": "雲端物聯網部門第三季營收年增 57%，營業利益 71 億元，年增超過一倍。", "ts": "10:33", "who": "CFO", "seg": 6}]}, {"title": "營收", "points": [{"text": "2026 年第三季合併營收達新台幣 574 億元，年增 28%、季增 9%。", "ts": "06:40", "who": "CFO", "seg": 3}, {"text": "第三季雲端物聯網部門營收 338 億元，年增 57%，佔比提升至 59%。", "ts": "10:30", "who": "CFO", "seg": 6}, {"text": "第三季光電部門營收 81 億元，年增 17%，佔比 14%；資訊與消費性電子部門營收 155 億元，年減 6%，佔比 27%。", "ts": "10:52", "who": "CFO", "seg": 6}, {"text": "前三季累積營業收入為新台幣 1,535 億元，年增 26%。", "ts": "08:44", "who": "CFO", "seg": 5}]}, {"title": "毛利與獲利", "points": [{"text": "第三季營業毛利為 149 億元，毛利率 25.9%，年增 0.9 個百分點，優於上半年的 24.7%。", "ts": "06:44", "who": "CFO", "seg": 3}, {"text": "第三季營業利益 87 億元，營業利益率 15.1%，年增 4.7 個百分點，優於上半年的 12.8%。", "ts": "06:52", "who": "CFO", "seg": 3}, {"text": "前三季營業利益為 210 億元，年增 73%，營業利益率達 13.7%，年增 3.8 個百分點。", "ts": "08:58", "who": "CFO", "seg": 5}, {"text": "前三季 ROIC 達 34%，反映營運轉型與高價值產品比重提升的成效。", "ts": "15:23", "who": "CFO", "seg": 7}]}, {"title": "營運指引", "points": [{"text": "2026 年資本支出由原預估的 180 億元上調至 197 億元，預估 2027 年將進一步高於今年。", "ts": "35:40", "who": "CFO", "seg": 18}, {"text": "預期下半年整體毛利率將優於上半年表現。", "ts": "37:06", "who": "CEO", "seg": 20}, {"text": "預估 2027 年 AI 相關營收佔全公司整體營收比例將達到 40% 至 50%。", "ts": "38:58", "who": "CEO", "seg": 22}, {"text": "預估 2027 年光電部門維持約 10% 左右的營收成長。", "ts": "59:08", "who": "CEO", "seg": 39}, {"text": "預估 2027 年 BBU 業務營收年成長率將維持在 30% 以上。", "ts": "62:52", "who": "CEO", "seg": 41}]}, {"title": "訂單與能見度", "points": [{"text": "雲端電源第四季將持續呈現年、季雙成長趨勢，CSP 客戶新平台拉貨動能強勁。", "ts": "24:08", "who": "CEO", "seg": 10}, {"text": "800V 高壓直流 Power Rack 產品預計於 11 月進行第二批送樣，明年第一季展開出貨。", "ts": "30:14", "who": "CEO", "seg": 14}, {"text": "新取得的兩家 CSP 客戶訂單，預計於 2028 年左右帶來新一波顯著營收貢獻。", "ts": "63:46", "who": "CEO", "seg": 41}]}, {"title": "產能與擴產", "points": [{"text": "越南廣寧新廠預計下個月正式開幕，高雄二期廠亦取得使用執照，兩廠投產將使海外產能增加近一倍。", "ts": "34:22", "who": "CEO", "seg": 17}, {"text": "美國德州達拉斯廠預計於明年第二季正式展開營運，可支應未來三至五年的產能需求。", "ts": "35:03", "who": "CEO", "seg": 17}]}, {"title": "產品與技術", "points": [{"text": "10 月完成展示 800V DC-DC Power Brick 模組及 2.6MW 企業級 CDU 液冷散熱系統。", "ts": "21:16", "who": "CEO", "seg": 9}, {"text": "董事會通過分割立能精密，專注於機櫃與液冷散熱業務，並強化與 DCS 的策略合作。", "ts": "22:28", "who": "CEO", "seg": 9}, {"text": "策略性投資控制元件廠新安芮，深化 AI 資料中心電源管理之關鍵電感與高功率變壓器技術。", "ts": "23:36", "who": "CEO", "seg": 9}, {"text": "首款 120kW 企業級 CDU 已於第三季順利出貨量產，下一代 220kW CDU 正處於設計階段。", "ts": "54:31", "who": "CEO", "seg": 37}]}, {"title": "股利與資本", "points": [{"text": "光寶科技 10 月份已完成 360 億元首筆永續連結聯貸案，以支持全球 AI 佈局與策略投資。", "ts": "18:30", "who": "CFO", "seg": 7}]}, {"title": "Q&A", "points": [{"text": "問：美國資料中心面臨缺電及資金問題，對拉貨進度有何看法？／答：缺電問題使第三季拉貨微幅放緩，但客戶全年 Capex 未下修，且明年 AI 投資趨勢明確且樂觀。", "ts": "26:34", "who": "CEO", "seg": 12}, {"text": "問：缺料是否造成出貨遞延？第三季毛利率季減原因？／答：因事前策略性備料與海運出貨調節，第四季供貨無虞；第三季毛利率季減係因第二季遞延出貨基期偏高，下半年整體毛利率仍將優於上半年。", "ts": "28:50", "who": "CEO", "seg": 14}, {"text": "問：研發費用佔比未來規劃及資本支出上修之細節？／答：長期目標維持研發費用佔比達 6%，總費用率約 11-12%；今年資本支出調高至 197 億元主因產能擴充與自動化升級。", "ts": "33:04", "who": "CEO", "seg": 17}, {"text": "問：存貨金額上升是否有備抵跌價損失風險？／答：提存比例與過去數季水準一致，整體維持非常穩定，並無惡化狀況。", "ts": "44:22", "who": "CFO", "seg": 27}, {"text": "問：車用產品近期動能強勁的原因？／答：主要受惠於產品組合優化挑選高毛利專案，以及座艙內部安全監控攝影機模組已獲客戶認證出貨。", "ts": "51:41", "who": "CEO", "seg": 35}, {"text": "問：明年原物料缺料狀況與備料能見度？／答：半導體等關鍵零組件多簽訂三年期長約以鎖定產能，重點零組件備料維持半年審視週期。", "ts": "61:05", "who": "CEO", "seg": 39}]}], "quotes": []}, {"key": "2409_2026-10-29", "code": "2409", "name": "友達", "date": "2026-10-29", "segs": [{"i": 0, "ts": "00:01:51", "sec": 111, "who": "財務長李建德", "role": "公司", "text": "接下來由我來說明友達光電 2026 年第三季度營運成果的財務摘要，以及 2026 年第四季度的營運展望。首先在損益表的部分，第三季營收 669 億，較上季度減少約 5.7%。"}, {"i": 1, "ts": "00:02:18", "sec": 138, "who": "財務長李建德", "role": "公司", "text": "其中在 Display 顯示科技的部分，本季受記憶體及 Driver IC 等關鍵零組件供應吃緊，推動成本上升，品牌客戶陸續調漲終端售價，抑制 IT 產品的需求，且需求降幅高於原先預期，因此 Display 整體的營收較上季下滑 10.7%，這個低於預期。"}, {"i": 2, "ts": "00:03:02", "sec": 182, "who": "財務長李建德", "role": "公司", "text": "第三季營業毛利下降至 10.1 個百分點，較上季減少 2.9 個百分點。主因產品組合及筆電需求下滑的影響，以及 Green Solution 認列一次性的損失所致。第三季的營業淨利率為負的 3.5%，與上季相比衰退 3.8%，本業虧損 24 億元。"}, {"i": 3, "ts": "00:06:20", "sec": 380, "who": "財務長李建德", "role": "公司", "text": "接下來向各位說明公司對 2026 年第四季度的營運展望。首先在 Mobility Solution 方面，公司預計車用團隊持續爭取訂單，滿足客戶的需求，預計 Mobility Solution 營收與第三季約略持平。"}, {"i": 4, "ts": "00:06:35", "sec": 395, "who": "財務長李建德", "role": "公司", "text": "接下來在 Vertical Solution 方面，雖然需求相對穩定，惟因為能源事業自 10 月 1 號起不再併入友達的合併報表，營收預計較第三季減少 low to mid single digit 的百分比。最後是 Display 的部分，旺季備貨告一段落，且品牌客戶對面板採購趨於保守，營收預計將較第三季預計持續的減少。"}, {"i": 5, "ts": "00:07:15", "sec": 435, "who": "董事長彭双浪", "role": "公司", "text": "各位投資先進、媒體朋友們大家好，我是 Paul。回顧第三季整體營收是 669 億，較第二季減少了大概 6%。這其中主要減少來自於 Display，尤其是筆電因為記憶體跟 CPU 的短缺，終端售價大幅的提升，也造成終端的需求下滑。"}, {"i": 6, "ts": "00:08:20", "sec": 500, "who": "董事長彭双浪", "role": "公司", "text": "本季營業費用的金額並沒有隨著營收減少，反而增加了一億多，主要是由於車用的新案開發以及我們在前瞻技術的研發費用。我們希望短期能將營業費用的比例控制在 11 到 12%，中長期是希望能夠控制在 10% 以內。"}, {"i": 7, "ts": "00:11:00", "sec": 660, "who": "董事長彭双浪", "role": "公司", "text": "我們旗下友達精彩跟友達數位，長期深耕在半導體產業的供應鏈，去年的半導體加總營收已經達到一個億美金以上，而且預計今年將有兩位數成長。"}, {"i": 8, "ts": "00:14:10", "sec": 850, "who": "董事長彭双浪", "role": "公司", "text": "今年的董事會已經累計通過新增超過 240 億的資本支出，今天董事會再通過 57 億元。這其中有一部分將用於新技術的開發以及小量生產所需的資本支出。接下來會隨著各項合作的進展，而且技術的成熟度，然後我們就開始轉量產。"}, {"i": 9, "ts": "00:14:40", "sec": 880, "who": "董事長彭双浪", "role": "公司", "text": "另外今天董事會也通過了處分台中二期，這裡面包含一個五代廠、一個 7.5 代廠，售予、出售給台積電。本公司的資產活化到此會告一個段落，處分廠房的回收的資金都將作為策略性跟未來性投入的資本。"}, {"i": 10, "ts": "00:23:15", "sec": 1395, "who": "財務長李建德", "role": "公司", "text": "2026 年的折舊費用仍預計為 280 億左右，為資本支出的現金流則下修為不超過 150 億。主因驗收時程的影響，預計部分的資本支出會遞延到 2027 年支付。"}, {"i": 11, "ts": "00:32:50", "sec": 1970, "who": "總經理張博儀", "role": "公司", "text": "目前的話大概 Display 的 HMI 這一塊的營收已經超過四成。那在 Smart Cockpit 的 solution 的這一塊的發展，除了原來的 climate control 的業務以外，目前在車用的運算平台上，我們也陸續的已經導入到台灣與日本的商用的這個市場。"}, {"i": 12, "ts": "00:40:00", "sec": 2400, "who": "董事長彭双浪", "role": "公司", "text": "我們對我們的客戶承諾，就是我們每兩年降低一半的成本，這一塊目前是 on track。這裡面主要還是在整個產品的良率跟產品的設計，還有加上我們在生產線從一代轉到 4.5 代，都讓我們的成本有大幅的下降。"}, {"i": 13, "ts": "00:52:15", "sec": 3135, "who": "董事長彭双浪", "role": "公司", "text": "我們的產線也在建置，像這個 4.5 代的高解析度的線，在明年的上半年就會建置完成，也就是說它大量生產就會投入大量生產。"}], "qa": null, "chars": 1464, "last_min": 52, "cpm": 28, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "友達宣布處分台中二期廠房（含 5 代及 7.5 代廠）予台積電，活化資產。", "ts": "14:40:00", "who": "董事長", "seg": 13}, {"text": "半導體相關業務去年營收破 1 億美元，預計今年維持雙位數成長。", "ts": "11:00:00", "who": "董事長", "seg": 13}]}, {"title": "營收", "points": [{"text": "Q3 營收 669 億元，季減 5.7%，主因 Display 業務受零組件缺料及需求下滑影響。", "ts": "02:00:00", "who": "財務長", "seg": 13}, {"text": "Display 顯示科技 Q3 營收季減 10.7%，低於預期。", "ts": "02:30:00", "who": "財務長", "seg": 13}]}, {"title": "毛利與獲利", "points": [{"text": "Q3 毛利率 10.1%，季減 2.9 個百分點；本業虧損 24 億元。", "ts": "03:00:00", "who": "財務長", "seg": 13}, {"text": "Q3 稅後損失 25 億元，EPS -0.33 元。", "ts": "03:45:00", "who": "財務長", "seg": 13}]}, {"title": "營運指引", "points": [{"text": "Q4 智慧移動營收預計持平；垂直場域受能源事業切割影響，營收季減 1-6%。", "ts": "06:30:00", "who": "財務長", "seg": 13}, {"text": "Q4 顯示科技營收預計持續減少，主因品牌客戶採購趨於保守。", "ts": "06:50:00", "who": "財務長", "seg": 13}, {"text": "2026 全年折舊預計 280 億元，資本支出下修至 150 億元以下。", "ts": "23:15:00", "who": "財務長", "seg": 13}]}, {"title": "產能與擴產", "points": [{"text": "Micro LED 4.5 代高解析度生產線預計 2027 年上半年建置完成。", "ts": "52:15:00", "who": "董事長", "seg": 13}]}, {"title": "產品與技術", "points": [{"text": "成立創新研究院，投入低軌衛星天線、光引擎（CPO）及半導體先進封裝。", "ts": "10:40:00", "who": "董事長", "seg": 13}, {"text": "光引擎技術目標每兩年降低一半成本，目前進度符合預期。", "ts": "40:00:00", "who": "董事長", "seg": 13}]}, {"title": "股利與資本", "points": [{"text": "董事會通過新增資本支出 57 億元，累計已通過超過 240 億元。", "ts": "14:10:00", "who": "董事長", "seg": 13}]}, {"title": "Q&A", "points": [{"text": "問：光引擎與半導體玻璃基板進度？／答：光引擎已與客戶談規格，玻璃基板（Glass Core）已有技術佈局。", "ts": "30:20:00", "who": "董事長", "seg": 13}, {"text": "問：智慧座艙出貨狀況？／答：智慧座艙（Smart Cockpit）佔智慧移動營收已超過四成。", "ts": "32:50:00", "who": "總經理", "seg": 13}]}], "quotes": []}, {"key": "7769_2026-10-28", "code": "7769", "name": "鴻勁", "date": "2026-10-28", "segs": [{"i": 0, "ts": "00:01:09", "sec": 69, "who": "陳可欣（財務長）", "role": "公司", "text": "首先跟各位報告一下我們第三季的一個財務表現。那今年的 1 到 3 季的話，我們營業收入金額來到 407 億 3300 萬元左右，大概已經超越去年全年度的水準了。"}, {"i": 1, "ts": "00:01:26", "sec": 86, "who": "陳可欣（財務長）", "role": "公司", "text": "毛利率的話，第三季跟前面兩季相比略幅提升，所以前面三個季度的平均毛利率為 56.46%，EPS 的話來到 93.47 元。"}, {"i": 2, "ts": "00:01:43", "sec": 103, "who": "陳可欣（財務長）", "role": "公司", "text": "第三季的部分我們的營業收入金額的部分來到 161 億 9400 萬元，營業毛利的部分是 92 億 2000 萬元，毛利率的部分大約是 56.9%。"}, {"i": 3, "ts": "00:01:58", "sec": 118, "who": "陳可欣（財務長）", "role": "公司", "text": "營業費用的話，過往我們的營業費用水準大概都是在 6% 到 8% 之間，第三季也沒有什麼很特別的變化，所以整個營業費用的金額的話是 11 億 7800 萬元，營業費用率是 7.3%。"}, {"i": 4, "ts": "00:03:55", "sec": 235, "who": "翁德魁（總經理）", "role": "公司", "text": "產品組合的部分，我們在 2025 年、2026 年在整個產品的組合上面，尤其 2026 年跟 2025 年，其實變化不是很大，主要的區塊還是集中在 AI 晶片、HPC、ASIC 這方面的產品。"}, {"i": 5, "ts": "00:06:10", "sec": 370, "who": "翁德魁（總經理）", "role": "公司", "text": "AI HPC ASIC 的部分，我們在 2025 年的話是大概 72%，Q1 到 Q3 大概我們都一直 keep 在 70 幾 %，所以我們抓一下我們自己訂單上面的一個分布比例，在前三季我們大概 78%。"}, {"i": 6, "ts": "00:07:15", "sec": 435, "who": "翁德魁（總經理）", "role": "公司", "text": "Automotive 部分，2025 年大概 11%，我們前三季大概 9%，大概我們預估今年大概也就是大概 10% 左右。但是因為我們今年的營業額跟去年的營業額增加的幅度蠻大，所以如果用整個產值來看，其實是增加非常多的。"}, {"i": 7, "ts": "00:12:50", "sec": 770, "who": "翁德魁（總經理）", "role": "公司", "text": "目前這個我們看到的高階未來性的 SLT 的 handler，目前整個 ASP 如果是 full system 的話，大概可能會提升大概 30% 以上。目前我們都持續在接單，在準備這個設備。"}, {"i": 8, "ts": "00:15:25", "sec": 925, "who": "翁德魁（總經理）", "role": "公司", "text": "CPO solution 目前當然我們還是按照原先客人設定的進度在推進，所以我們在下個月底我們機器就 ready，去搭配測試機 ATE 的測試機，然後去做量產前的一些 data collection。"}, {"i": 9, "ts": "00:19:25", "sec": 1165, "who": "翁德魁（總經理）", "role": "公司", "text": "往後面推演的話，我們預計 2027 年下半年開始，如果去認列這些比較 ASP 更高的設備，那我們認為這 profit 的趨勢應該是會往上走的。"}, {"i": 10, "ts": "00:20:45", "sec": 1245, "who": "翁德魁（總經理）", "role": "公司", "text": "我們在第二季的法說大概就有跟投資人報告，就是我們希望在明年就是會擴充大概 50% 的一個機台的一個產能。產能不代表數量，因為有些機台它的複雜度更高，它做一台機台可能跟以前做兩台是一樣的。"}], "qa": null, "chars": 970, "last_min": 21, "cpm": 47, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "2026年前三季營收達407.33億元，已超越去年全年水準。", "ts": "00:01:20", "who": "CFO", "seg": 0}, {"text": "AI/HPC/ASIC產品線營收佔比從去年的72%提升至今年前三季的78%。", "ts": "00:06:15", "who": "CEO", "seg": 5}]}, {"title": "營收", "points": [{"text": "2026年Q3單季營收為161.94億元，營業利益率達49.7%。", "ts": "00:01:50", "who": "CFO", "seg": 2}, {"text": "前三季利息收入達7.86億元，外幣兌換利益約2.2億元。", "ts": "00:02:45", "who": "CFO", "seg": 3}]}, {"title": "毛利與獲利", "points": [{"text": "Q3單季毛利率56.9%，前三季平均毛利率56.46%。", "ts": "00:01:30", "who": "CFO", "seg": 1}, {"text": "前三季稅後淨利67.16億元，淨利率41.5%，EPS為93.47元。", "ts": "00:03:05", "who": "CFO", "seg": 3}]}, {"title": "營運指引", "points": [{"text": "預估2026全年車用產品營收佔比約維持在10%左右。", "ts": "00:07:20", "who": "CEO", "seg": 6}, {"text": "2027年產能（產值）目標擴充50%，以應對高階機台需求。", "ts": "00:20:50", "who": "CEO", "seg": 10}, {"text": "預期2027年毛利率隨高階產品（CPO、Mega Tray）出貨將呈上升趨勢。", "ts": "00:19:30", "who": "CEO", "seg": 9}]}, {"title": "產能與擴產", "points": [{"text": "公司已購入多處廠房，目前正進行場務設施建置，預計明年產值增長50%。", "ts": "00:21:00", "who": "CEO", "seg": 10}]}, {"title": "產品與技術", "points": [{"text": "ATC 3系列液冷溫控已推至10kW，ATC 8系列冷媒系統可達25kW。", "ts": "00:10:10", "who": "CEO", "seg": 6}, {"text": "Mega Tray解決方案HP9050/1050，系統ASP可提升30%以上。", "ts": "00:12:50", "who": "CEO", "seg": 7}, {"text": "CPO（光電同封）機台預計2026年10月底完成，2027年Q1量產。", "ts": "00:15:30", "who": "CEO", "seg": 8}]}, {"title": "Q&A", "points": [{"text": "問：CPO機台驗證進度與需求量？答：11-12月完成最後驗證，明年Q1量產，需求視測試時間推算。", "ts": "00:18:40", "who": "分析師/CEO", "seg": 8}, {"text": "問：OSAT競爭態勢？答：多數OSAT仍以鴻勁機台為主，競爭者多處於初期驗證階段。", "ts": "00:20:10", "who": "分析師/CEO", "seg": 9}, {"text": "問：影響毛利率因素？答：產品組合與Co-play（耗材），耗材營收佔比約20%且毛利較高。", "ts": "00:18:50", "who": "分析師/CEO", "seg": 8}, {"text": "問：ATC系列價格區間？答：ATC 5約1500-2800、ATC 3約1200-1500、ATC 8約1000-1500（美金）。", "ts": "00:19:50", "who": "分析師/CEO", "seg": 9}]}], "quotes": []}, {"key": "6548_2026-10-28", "code": "6548", "name": "長科", "date": "2026-10-28", "segs": [{"i": 0, "ts": "00:00:13", "sec": 13, "who": "主持人", "role": "主持人", "text": "各位投資先進，各位媒體朋友，大家午安。"}, {"i": 1, "ts": "00:00:17", "sec": 17, "who": "主持人", "role": "主持人", "text": "非常歡迎您參加長華科技股份有限公司法人說明會。"}, {"i": 2, "ts": "00:00:20", "sec": 20, "who": "主持人", "role": "主持人", "text": "本次說明會將由公司進行簡報後進入QA階段。"}, {"i": 3, "ts": "00:00:25", "sec": 25, "who": "主持人", "role": "主持人", "text": "本次法說會採發言提問，並請使用舉手功能提問，主持人唱名解除麥克風限制後，請開啟您的麥克風並進行提問。"}, {"i": 4, "ts": "00:00:34", "sec": 34, "who": "主持人", "role": "主持人", "text": "本次法說會很榮幸邀請到長華科技張副人總經理特助。"}, {"i": 5, "ts": "00:00:39", "sec": 39, "who": "主持人", "role": "主持人", "text": "張偉昌、陳明賢業務副總。"}, {"i": 6, "ts": "00:00:43", "sec": 43, "who": "主持人", "role": "主持人", "text": "陳明賢、陳冰權技術顧問。"}, {"i": 7, "ts": "00:00:48", "sec": 48, "who": "主持人", "role": "主持人", "text": "以及長華集團黃家能先生。"}, {"i": 8, "ts": "00:00:51", "sec": 51, "who": "主持人", "role": "主持人", "text": "接下來把時間交給公司，謝謝。"}, {"i": 9, "ts": "00:00:56", "sec": 56, "who": "福人", "role": "公司", "text": "各位投資先進，大家午安。"}, {"i": 10, "ts": "00:00:58", "sec": 58, "who": "福人", "role": "公司", "text": "我是長華科技的福人。"}, {"i": 11, "ts": "00:01:00", "sec": 60, "who": "福人", "role": "公司", "text": "今天由我向各位投資先進長科第三季的營運狀況，還有我們對第四季的營運展望。"}, {"i": 12, "ts": "00:01:12", "sec": 72, "who": "福人", "role": "公司", "text": "首先在資產負債在水力表方面，公司第三季的營收是49.21億，跟第二季的43.21億相比，QOQ成長14%，跟去年同期的35五億相比，YOY營收的征服更是來到41%。"}, {"i": 13, "ts": "00:13:00", "sec": 780, "who": "黃先生", "role": "公司", "text": "請問今年2026年毛利率狀況是否有明顯增加？"}, {"i": 14, "ts": "00:14:02", "sec": 842, "who": "福人", "role": "公司", "text": "是的，公司在剛才的財報揭露，事實上有看到第三季的毛利率事實上已經有來到了24.2%。"}, {"i": 15, "ts": "00:14:42", "sec": 882, "who": "黃先生", "role": "公司", "text": "我這邊在補充一個問題，我想說各位投資先進都很關心毛利率嘛，我想說做一個生產廠家，毛利率跟可能這很重要。"}, {"i": 16, "ts": "00:16:26", "sec": 986, "who": "黃先生", "role": "公司", "text": "那我們如何在目前的狀況下，如何讓我們的毛利率很健康的往上走？"}, {"i": 17, "ts": "00:36:26", "sec": 2186, "who": "黃先生", "role": "公司", "text": "上次法說會有提到，我們看到IDM客戶平均庫存天數在Q2的時候大概是到200天左右，那不知道這個數字目前Q3或是現在看大概是落在哪個水準？"}], "qa": null, "chars": 540, "last_min": 36, "cpm": 15, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "第三季營收49.21億元，季增14%，年增41%。", "ts": "00:01:16", "who": "福人", "seg": 12}, {"text": "第三季毛利率、營業利益率與淨利率皆較去年同期顯著提升。", "ts": "00:03:04", "who": "福人", "seg": 12}]}, {"title": "營收", "points": [{"text": "傳統有腳導線架征服是最為顯著的，尤其是QAP系列。", "ts": "00:01:30", "who": "福人", "seg": 12}, {"text": "第三季車用營收占比減少到3.6億元。", "ts": "00:02:42", "who": "福人", "seg": 12}, {"text": "公司連續10個季度營收持續增加。", "ts": "00:08:06", "who": "福人", "seg": 12}]}, {"title": "毛利與獲利", "points": [{"text": "第三季營業費用是3.81億，較今年第二季增加11%。", "ts": "00:02:23", "who": "福人", "seg": 12}, {"text": "第三季營業利益率是17%。", "ts": "00:02:34", "who": "福人", "seg": 12}, {"text": "綜合以上，長科第三季歸屬母公司的淨利是7.51億。", "ts": "00:02:50", "who": "福人", "seg": 12}]}, {"title": "產能與擴產", "points": [{"text": "馬來西亞由於是平地起高樓，所以時程會稍微晚一點。", "ts": "00:09:14", "who": "講者", "seg": 12}, {"text": "預計在明年6月可以取得使用執照。", "ts": "00:09:20", "who": "講者", "seg": 12}]}, {"title": "產品與技術", "points": [{"text": "我們將IC跟QFP統稱為無引腳導線架。", "ts": "00:04:13", "who": "講者", "seg": 12}, {"text": "第二部分則是無引腳導線架，包括QFN跟EMC/LED產品。", "ts": "00:04:18", "who": "講者", "seg": 12}, {"text": "第三大部分則是discrete的分離元件。", "ts": "00:04:24", "who": "講者", "seg": 12}]}, {"title": "客戶", "points": [{"text": "長科的客戶許多應用LDD，尤其是IDM客戶。", "ts": "00:05:51", "who": "講者", "seg": 12}]}, {"title": "股利與資本", "points": [{"text": "現金流量部分，流動負債部分有減少了20億。", "ts": "00:06:34", "who": "講者", "seg": 12}, {"text": "公司在今年8月有向土銀新徵了一筆72億5年的聯貸案。", "ts": "00:06:54", "who": "講者", "seg": 12}]}, {"title": "Q&A", "points": [{"text": "問：請問今年2026年毛利率狀況是否有明顯增加？／答：公司在剛才的財報揭露，事實上有看到第三季的毛利率事實上已經有來到了24.2%。", "ts": "00:13:53", "who": "黃先生", "seg": 13}, {"text": "問：想請教生產生產廠家，毛利率跟成本是不是很重要？／答：我想說作為一個生產廠家，毛利率跟成本當然是很重要的。", "ts": "00:14:53", "who": "黃先生", "seg": 15}, {"text": "問：上次法說會有提到，我們看到IDM客戶平均庫存天數在Q2的時候大概是到200天左右，那不知道這個數字目前Q3或是現在看大概是落在哪個水準？／答：問導線架交期的交期。", "ts": "00:36:26", "who": "黃先生", "seg": 17}]}], "quotes": []}, {"key": "6239_2026-10-27", "code": "6239", "name": "力成", "date": "2026-10-27", "segs": [{"i": 0, "ts": "01:58", "sec": 118, "who": "董事長 蔡篤恭", "role": "公司", "text": "各位投資朋友、各位法人大家好。首先我做一個開場白。我想我們上一季營收跟每股盈餘都超乎我們的預期。各位所關心的先進封裝進度，我們在擴廠方面目前是按照規劃在進行。"}, {"i": 1, "ts": "02:30", "sec": 150, "who": "董事長 蔡篤恭", "role": "公司", "text": "我們的先進產品有 AI Chip、Optical Engine、CPO，還有用 TSV Interconnection 的 DRAM，所有的驗證都順利在進行，我們量產的計畫維持不變。我們新加坡的 JV 現在正在經濟部投審司審核中，我想應該很快就會下來。"}, {"i": 2, "ts": "03:20", "sec": 200, "who": "董事長 蔡篤恭", "role": "公司", "text": "歷程科技經過多年來研發的 Fan-out PLP 技術，近年隨著 AI 晶片市場的成長，受到更多的關注。AI 的興起具體改變了歷程的業務、客戶需求以及我們投資的策略。"}, {"i": 3, "ts": "06:35", "sec": 395, "who": "財務長 沈俊宏", "role": "公司", "text": "接下來由我跟各位報告 PTI 目前截止到第三季的經營成果與財務概況。首先來到 QoQ 的營收比較，各位可以看到這一季的營收來到 253 億，較上個季度的 231 億增加了 9.6 個百分點。"}, {"i": 4, "ts": "06:55", "sec": 415, "who": "財務長 沈俊宏", "role": "公司", "text": "毛利率的部分也從上個季度的 21.8% 增加 2.2 個百分點來到 24。營業利益率也來到 17.7，增加 2.4 個百分點。整個稅後淨利部分來到 35 億的部分，較上個季度 28 億增加了將近有 8 億，增幅 25%。"}, {"i": 5, "ts": "07:30", "sec": 450, "who": "財務長 沈俊宏", "role": "公司", "text": "EPS 的部分也從上個季度的 3.0 塊錢增加到 3.55，增幅 18%。營收增加的部分，記憶體跟非記憶體的部分大概是各半。非記憶體部分當然就是邏輯的部分，記憶體的部分增加的 11 億裡頭主要是以 DRAM 的部分為主。"}, {"i": 6, "ts": "10:25", "sec": 625, "who": "財務長 沈俊宏", "role": "公司", "text": "展望第四季度的營收跟毛利率部分，應該會在 Q3 的基礎上持續的在增加，我們朝著一個比較樂觀的看法。挑戰全年的部分，去年 2025 的全年營收大約是 749 億的部分，EPS 7.48。我想說今年的前三季的營收跟獲利率的部分、EPS 的部分我們已經超過了去年的部分。"}, {"i": 7, "ts": "10:55", "sec": 655, "who": "財務長 沈俊宏", "role": "公司", "text": "營收的部分歷史的新高是出現在 2022 年的 834 億，我想透過第四季的努力，PTI 應該有機會來挑戰這個新高的部分。"}, {"i": 8, "ts": "12:54", "sec": 774, "who": "執行長 謝永達", "role": "公司", "text": "大家好，剛剛我們財務長已經把所有的詳細的財報數字都跟大家報告過了，那我現在來做一個財報的做個總整理如下。第一個當我們的 Revenue 剛剛財務長也講過了，我們創了非常好的一個紀錄，總共做了 25.3 個 Billion，253 億。"}, {"i": 9, "ts": "16:10", "sec": 970, "who": "執行長 謝永達", "role": "公司", "text": "DRAM Memory 部分訂單能見度高，推升營收表現穩定成長，這個大家都知道 DRAM 現在還是屬於供不應求的階段。NAND Flash 部分，伺服器帶動 SSD 需求推升營收持續成長。"}, {"i": 10, "ts": "20:45", "sec": 1245, "who": "執行長 謝永達", "role": "公司", "text": "先進封測 Fan-out PLP 部分，客戶端的產品驗證正在持續進行，並朝 2027 年量產既定目標穩定推進。此外，隨著市場需求及產業信心及量產信賴度的提升，客戶在新產品導入的需求也顯著增加。"}, {"i": 11, "ts": "23:35", "sec": 1415, "who": "執行長 謝永達", "role": "公司", "text": "菲律賓廠第四季起貢獻營收，並與客戶簽訂長期供應合約，擴大導線架封裝的產能與市佔。以上報告，謝謝。"}, {"i": 12, "ts": "26:14", "sec": 1574, "who": "董事長 蔡篤恭", "role": "公司", "text": "我想現在台積電還有一些用的名詞叫 CoWoS，就是 Chip on Panel on Substrate，它其實跟我們歷程的 Fan-out PLP 是同樣一樣的製程，只是面板尺寸的不同。我們的面板尺寸是 510 乘以 515，那台積電對外宣布的是 310 乘以 310。"}, {"i": 13, "ts": "26:55", "sec": 1615, "who": "董事長 蔡篤恭", "role": "公司", "text": "所以我們面板的尺寸比較大，所以我們的產出的產能也比較大，相對的我們的成本會比較便宜。但是要做好大尺寸面板技術的門檻會比較高，這我想是我們花這麼多年來開發這個大面板的 Fan-out PLP 的經驗。"}, {"i": 14, "ts": "31:15", "sec": 1875, "who": "執行長 謝永達", "role": "公司", "text": "事實上我們已經持續投入先進封裝技術及產品佈局非常多年，且已經逐步擴大在 AI、HPC 高階邏輯晶片領域的業務。如果將我們 Flip-chip BGA、Bumping、Fan-out PLP 以及 2.5D/3D 等先進封裝相關業務納入計算，這個部分我們營收已經佔了集團營收的三成以上。"}, {"i": 15, "ts": "33:20", "sec": 2000, "who": "董事長 蔡篤恭", "role": "公司", "text": "我們歷程已經具備有 EMIB-like 的能力。我們的製程跟 EMIB 的區別是在 Bridge Die 我們歷程是 Embedded 在 Polyimide 裡面，Intel 的 EMIB 它的 Bridge Die 是 Embedded 在 ABF Substrate 裡面。Embedded 在 Polyimide 這樣的 EMIB 呢，我們在幾年前都已經驗證過了。"}, {"i": 16, "ts": "36:15", "sec": 2175, "who": "執行長 謝永達", "role": "公司", "text": "因為最近的原物料及各項成本價格的變化，事實上像 Substrate 我們的成長被我們供應商漲價的幅度是非常的大。歷程當然我們會適時反映我們成本，那當然剛剛有講過就是我們的客戶事實上也接受這樣子的調整。至於幅度現在我們產品跟市場跟成本還有我們的市場行情，我們會有個位數到雙位數不等的漲價。"}], "qa": null, "chars": 1856, "last_min": 36, "cpm": 51, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "2026Q3 營收與毛利率均改寫歷史新高，單季 EPS 達 3.55 元。", "ts": "09:00", "who": "CFO", "seg": 5}, {"text": "先進封裝業務（含 FOPLP、2.5D/3D）營收佔比已達集團 30% 以上。", "ts": "31:30", "who": "CEO", "seg": 14}]}, {"title": "營收", "points": [{"text": "Q3 營收 253 億元，季增 9.6%，年增 26%。", "ts": "06:45", "who": "CFO", "seg": 3}, {"text": "前三季累計營收 697 億元，較去年同期成長超過 30%。",     `<a href="${esc(e.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">原始節目 ↗</a>${full}` +
    `<span class="kt-sub">重點 ${e.context.length || Math.min(e.ms.length, 8)}・提及 ${e.ms.length}（${ktTone("多")}${tn.多} ${ktTone("空")}${tn.空} ${ktTone("中性")}${tn.中性}）</span>`);
  box.appendChild(h);
  const b = el("div", "kt-body"); b.style.display = open ? "" : "none"; box.appendChild(b);
  h.onclick = () => { b.style.display = b.style.display ? "" : "none"; };
  let tr = null;
  const jump = (seg, s) => { if (tr && seg != null) tr.ktJump(seg); else window.open(ktLink(e, s), "_blank", "noopener"); };
  const ts = (t, s, seg) => { const x = el("button", "kt-ts", esc(t)); x.title = hasSegs ? "跳到原文這一段" : "開原始節目"; x.onclick = () => jump(seg, s); return x; };
  // ① 重點摘錄（論述脈絡；沒有脈絡的集用改寫句）
  b.appendChild(el("div", "kt-h3", "① 重點摘錄 <span class='kt-sub'>（每條點時間跳到原文段落）</span>"));
  const kp = e.context.length ? e.context.map(c => ({t: c.t0, rng: c.t0 + "～" + c.t1, sec: c.sec0, seg: c.seg, stage: c.stage, text: c.summary, qs: c.quotes}))
    : e.ms.slice(0, 8).map(m => ({t: m.t, sec: m.sec, seg: m.seg, stage: ktDom(m), text: m.point, qs: []}));
  if (!kp.length) b.appendChild(el("div", "kt-sub", "這集沒有核對通過的段落。"));
  kp.forEach(k => { const r = el("div", "kt-kp"); r.appendChild(ts(k.t, k.sec, k.seg));
    r.appendChild(el("div", "", `<span class="kt-stage">${esc(k.stage)}</span>${esc(k.text)}${k.rng ? `<span class="kt-rng">${esc(k.rng)}</span>` : ""}` + k.qs.map(q => `<div class="kt-p">「${esc(q.quote)}」<span class="kt-sub"> ${esc(q.t)}</span></div>`).join(""))); b.appendChild(r); });
  if (!e.context.length && kp.length) b.appendChild(el("div", "kt-note", "這集還沒有論述脈絡（11-01 改版後的新集才有），重點先用每則提及的改寫句。"));
  // ② 提及（個股、族群、多空）
  b.appendChild(el("div", "kt-h3", "② 提及的個股與族群 <span class='kt-sub'>（原話經核對；多空為示意）</span>"));
  const U = {};
  e.ms.forEach(m => { const r = el("div", "kt-kp"); r.appendChild(ts(m.t, m.sec, m.seg));
    const tags = (m.stocks || []).map(s => `<span class="kt-tag s">${esc(s.name)} ${esc(s.code)}</span>`).concat((m.sectors || []).map(x => `<span class="kt-tag">${esc(x)}</span>`)).join("");
    r.appendChild(el("div", "", `${ktTone(m.tone)}<span class="kt-q">「${esc(m.quote)}」</span>${m.point ? `<div class="kt-p">${esc(m.point)}</div>` : ""}<div class="kt-tags"><span class="kt-tag">${esc(ktDom(m))}</span>${tags}</div>`)); b.appendChild(r); });
  if (!e.ms.length) b.appendChild(el("div", "kt-sub", "這個篩選條件下沒有提及。"));
  // ③ 原文逐字稿
  b.appendChild(el("div", "kt-h3", "③ 原文逐字稿"));
  if (hasSegs) {
    const qb = {};
    if (e.full !== "private") { e.mentions.forEach(m => { if (m.seg != null) (qb[m.seg] = qb[m.seg] || []).push(m.quote); });
      e.context.forEach(c => c.quotes.forEach(q => { if (q.seg != null && !(qb[q.seg] || []).includes(q.quote)) (qb[q.seg] = qb[q.seg] || []).push(q.quote); })); }
    tr = ktTranscript(e.segs, {title: `原文逐字稿（${e.segs.length} 段，點開展開；時間點可開原始節目）`, idp: "kt-" + e.id.replace(/\W/g, "") + "-", quotesBySeg: qb, link: s => ktLink(e, s)});
    b.appendChild(tr);
    if (e.full === "withheld") b.appendChild(el("div", "kt-note", "公開預覽不放全文（Evans 11-01：意見領袖逐字稿全文只存私有 repo）。私有版同一段程式、有全文，截圖在 CustomerServiceANDSales research/kt_transcript_private/。全文要不要公開等裁示。"));
  } else b.appendChild(el("div", "kt-sub", "這集沒有保存全文（全文從 11-09 起才存；更早的集數照「回補只補 2 週」不回補）。"));
  return box;
}
/* ── 法說逐字稿 ─────────────────────────────────────────── */
function ktIr(L, root) {
  const wrap = el("div", "kt-ir"), list = el("div", "kt-list"), view = el("div");
  wrap.appendChild(list); wrap.appendChild(view); root.appendChild(wrap);
  const stb = x => x.status === "full" ? `<span class="kt-badge ok">全文</span>` : x.status === "part" ? `<span class="kt-badge warn">轉寫不完整</span>` : `<span class="kt-badge warn">時間格式錯</span>`;
  const show = x => {
    [...list.children].forEach(c => c.classList.toggle("on", c.dataset.k === x.key));
    view.innerHTML = "";
    const c = el("div", "kt-card");
    const sp = [...new Set(x.segs.map(g => g.who).filter(Boolean))];
    c.appendChild(el("div", "", `<h2>${esc(x.name)} ${esc(x.code)}　<span class="kt-sub">${esc(x.date)} 法說會・官方錄音轉寫</span></h2>` +
      `<div class="kt-tags">${stb(x)}<span class="kt-tag">${x.segs.length} 段・${x.chars.toLocaleString()} 字・轉寫到第 ${x.last_min} 分</span><span class="kt-tag">講者：${esc(sp.join("、"))}</span></div>` +
      (x.status !== "full" ? `<div class="kt-note">⚠ ${x.status === "part" ? `每分鐘只有約 ${x.cpm} 字（口說全文約 200～300 字），這份是摘錄不是全文` : "時間點格式錯（HH:MM 被寫成 MM:SS）"}；已列進 W 的重轉清單（近 14 天）。</div>` : "")));
    let tr = null;
    const ts = (t, seg) => { const b = el("button", "kt-ts", esc(t || "—")); b.title = "跳到原文這一段"; b.onclick = () => tr && tr.ktJump(seg); return b; };
    // 重點
    c.appendChild(el("div", "kt-h3", "重點 <span class='kt-sub'>（AI 依官方錄音整理；點時間跳到原文）</span>"));
    if (!x.memo.length) c.appendChild(el("div", "kt-sub", "這場沒有整理重點。"));
    x.memo.forEach(g => { const m = el("div", "kt-mg", `<b>${esc(g.title)}</b>`);
      g.points.forEach(p => { const r = el("div", "kt-kp"); r.appendChild(ts(p.ts, p.seg)); r.appendChild(el("div", "", esc(p.text) + (p.who ? `<span class="kt-sub">　— ${esc(p.who)}</span>` : ""))); m.appendChild(r); });
      c.appendChild(m); });
    // 報告引用的原話
    x.quotes.forEach(R => { c.appendChild(el("div", "kt-h3", `AI 研究報告引用的原話 <span class='kt-sub'>（${esc(R.report)} 報告；逐字在逐字稿裡）</span>`));
      R.quotes.forEach(q => { const r = el("div", "kt-kp"); r.appendChild(ts(q.anchor, q.seg)); r.appendChild(el("div", "", `<span class="kt-stage">${esc(q.cat)}</span>「${esc(q.text)}」<span class="kt-sub">— ${esc(q.who)}</span>`)); c.appendChild(r); }); });
    c.appendChild(el("div", "kt-h3", "全文（講者分段）"));
    tr = ktTranscript(x.segs, {title: `逐字稿全文（${x.segs.length} 段）`, idp: "kt-ir-" + x.key + "-", speakers: sp, qa: x.qa});
    tr.open = true; c.appendChild(tr);
    c.appendChild(el("div", "kt-note", "來源：公開資訊觀測站法說會官方錄音，本站 AI 轉寫；講者欄依錄音辨識，「公司／分析師／主持人」由程式依講者稱謂判斷。整理自公開法說會，僅供參考，不具任何臆測，非投資建議。"));
    view.appendChild(c);
  };
  L.forEach((x, i) => { const b = el("button", "kt-li", `<b>${esc(x.name)}</b> ${esc(x.code)} <small>${esc(x.date.slice(5))}</small> ${stb(x)}`); b.dataset.k = x.key; b.onclick = () => show(x); list.appendChild(b); });
  const first = L.find(x => x.status === "full") || L[0]; if (first) show(first);
}

ktIr(JSON.parse(document.getElementById('kt-data').textContent), document.getElementById('kt-root'));</script></body></html>
