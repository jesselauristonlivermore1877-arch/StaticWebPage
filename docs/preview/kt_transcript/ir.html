00V都在送樣中，期望正負400V明年年中進入量產；800V會慢一點，可能明年年底。高壓單位體積瓦數高，單顆產值與單價會比低壓高出許多。"}, {"i": 29, "ts": "35:23", "sec": 2123, "who": "主持人 Angela", "role": "主持人", "text": "投入高壓線的資本支出預計多少？產能有多大？大陸與越南產能比重為何？"}, {"i": 30, "ts": "35:40", "sec": 2140, "who": "財務長 Amy Zhang", "role": "公司", "text": "2026年資本支出大概是台幣6億元，預計明年度資本支出預算大概在8到10億元。高壓產線預計投入2到3條，單顆產值約是低壓的5到10倍。2027年預計大陸與越南產能比重可以達到一比一。"}, {"i": 31, "ts": "37:02", "sec": 2222, "who": "總經理 Jerry Song", "role": "公司", "text": "大多數新生意如Telecom、AGV、Robotics等都會放在越南生產，中國大陸產能則持續支援部分產品線。"}, {"i": 32, "ts": "38:40", "sec": 2320, "who": "主持人 Angela", "role": "主持人", "text": "非BBU業務中，LEV訂單是否回歸？庫存調整影響如何？"}, {"i": 33, "ts": "38:57", "sec": 2337, "who": "總經理 Jerry Song", "role": "公司", "text": "長達兩年的庫存調整應該告一段落，客戶狀況已回穩。Telecom明年量產規模會翻倍，AGV/AMR/Robotics等產品會在明年下半年陸續量產，毛利率保持在公司水準區間。"}, {"i": 34, "ts": "40:36", "sec": 2436, "who": "主持人 Angela", "role": "主持人", "text": "電池芯價格上漲，公司是否會反映給客戶？"}, {"i": 35, "ts": "40:46", "sec": 2446, "who": "總經理 Jerry Song", "role": "公司", "text": "今年PCB、被動元件、Power IC等各式零件漲幅不小。我們盡努力反映價格給客人，目標是維持毛利甚至進一步增加毛利。"}, {"i": 36, "ts": "42:26", "sec": 2546, "who": "總經理 Jerry Song", "role": "公司", "text": "電池芯供應方面，我們與主要電芯廠有多年合作，目前料況操控都在可控制狀況之內。"}, {"i": 37, "ts": "44:40", "sec": 2680, "who": "主持人 Angela", "role": "主持人", "text": "現在開放線上投資人提問，請舉手提問。"}, {"i": 38, "ts": "45:00", "sec": 2700, "who": "主持人 Angela", "role": "主持人", "text": "高壓產線明年增加2-3條是位在越南還是中國？"}, {"i": 39, "ts": "50:06", "sec": 3006, "who": "總經理 Jerry Song", "role": "公司", "text": "兩邊都會放。"}, {"i": 40, "ts": "50:50", "sec": 3050, "who": "分析師 Angela (KGI)", "role": "分析師", "text": "Jerry好，財務長好。想請教四大CSP在採用BBU的態度與時程？"}, {"i": 41, "ts": "55:14", "sec": 3314, "who": "總經理 Jerry Song", "role": "公司", "text": "積極的客戶幾乎是全面採用。終端一旦採用BBU架構就回不去UPS了。不論是自建還是Colocation場地，高壓BBU能節省空間、提供大瓦數，主要CSP基本上都往這個方向走。"}, {"i": 42, "ts": "59:35", "sec": 3575, "who": "主持人 Angela", "role": "主持人", "text": "前九個月BBU營收增長主要是來自量還是價？"}, {"i": 43, "ts": "59:45", "sec": 3585, "who": "總經理 Jerry Song", "role": "公司", "text": "兩者都有。今年HVDC還沒進來前主要靠量增長，明年希望量跟價兩邊都可以成長。"}, {"i": 44, "ts": "60:57", "sec": 3657, "who": "分析師 戴振傑", "role": "分析師", "text": "公司是否有在開發NVIDIA 19吋規格的HVDC BBU產品？"}, {"i": 45, "ts": "61:13", "sec": 3673, "who": "總經理 Jerry Song", "role": "公司", "text": "實際上是有，我們有跟客人搭配這件事。800V因為技術問題多，進度確實較慢，希望明年下半年能量產。"}, {"i": 46, "ts": "62:53", "sec": 3773, "who": "主持人 Angela", "role": "主持人", "text": "時間差不多了，今天的法說會就到此結束，謝謝大家的參與，祝大家週末愉快。"}], "qa": 40, "chars": 3453, "last_min": 63, "cpm": 55, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "2026前三季累計EPS達35.95元，年增25.22%。", "ts": "05:17", "who": "CFO", "seg": 6}, {"text": "2026Q3單季EPS達12.5元，營收52.34億元，QoQ成長8.87%。", "ts": "02:48", "who": "CFO", "seg": 2}]}, {"title": "營收", "points": [{"text": "2026Q3單季營業收入為52.34億元，QoQ成長8.87%，YoY成長26.76%。", "ts": "02:48", "who": "CFO", "seg": 2}, {"text": "2026年前三季累計營業收入為145億元，YoY成長26.28%。", "ts": "04:20", "who": "CFO", "seg": 5}]}, {"title": "毛利與獲利", "points": [{"text": "2026Q3單季毛利18.98億元，毛利率36.27%，營業淨利12.85億元，淨利10.67億元。 ", "ts": "03:02", "who": "CFO", "seg": 2}, {"text": "2026年前三季累計毛利54.12億元，毛利率37.14%，稅後淨利30.7億元。 ", "ts": "04:32", "who": "CFO", "seg": 5}]}, {"title": "營運指引", "points": [{"text": "第四季營運展望預期保持非常穩定成長。", "ts": "15:47", "who": "CEO", "seg": 17}, {"text": "預期明年資料中心BBU業務將持續保持強勁成長動力。", "ts": "10:00", "who": "CEO", "seg": 11}, {"text": "預計非BBU新業務（如Telecom、AGV/AMR、Robotics等）明年成長幅度將大於BBU。 ", "ts": "11:48", "who": "CEO", "seg": 13}]}, {"title": "訂單與能見度", "points": [{"text": "目前與CSP客戶保持密切溝通，明年全年預期需求與客戶反饋正面良好。 ", "ts": "16:00", "who": "CEO", "seg": 17}]}, {"title": "產能與擴產", "points": [{"text": "2026年資本支出約新台幣6億元，2027年資本支出預算約8億至10億元。 ", "ts": "35:43", "who": "CFO", "seg": 30}, {"text": "高壓產線預計新增2至3條，預估2027年大陸與越南產能比重將達到1:1。 ", "ts": "36:02", "who": "CFO", "seg": 30}]}, {"title": "產品與技術", "points": [{"text": "高壓±400V/800V HVDC BBU進行中，±400V進度較快，預期明年年中放量；800V預計明年年底或後年量產。", "ts": "07:18", "who": "CEO", "seg": 10}, {"text": "單顆高壓BBU產品產值約為原本低壓產品的5至10倍。 ", "ts": "36:23", "who": "CFO", "seg": 30}, {"text": "Telecom與Light Electric Vehicle（LEV）庫存調整已告一段落，需求逐漸回溫。 ", "ts": "39:03", "who": "CEO", "seg": 33}]}, {"title": "產業與競爭", "points": [{"text": "隨著GPU/ASIC瓦數顯著提升，BBU邁向高壓與高功率密度為必然趨勢，技術門檻大幅提高。 ", "ts": "06:51", "who": "CEO", "seg": 9}]}, {"title": "客戶", "points": [{"text": "持續與全球四大CSP及主要SI系統廠保持緊密合作與多個POC專案開發。", "ts": "08:12", "who": "CEO", "seg": 11}]}, {"title": "Q&A", "points": [{"text": "問：第四季與明年營收、毛利率趨勢及訂單能見度？／答：第四季穩定成長，客戶反饋正面；毛利率將透過產品組合調整盡力維持或提升。", "ts": "15:42", "who": "CEO", "seg": 17}, {"text": "問：2026年資本支出及產能配置？／答：2026年資本支出約6億元，明年約8-10億元；高壓產線增2-3條，2027年越南與大陸產能比為1:1。", "ts": "35:40", "who": "CFO", "seg": 30}, {"text": "問：高壓HVDC產品的驗證進度與產值差異？／答：±400V預計明年年中量產，800V預計明年底；高壓單顆產值約低壓的5-10倍。", "ts": "36:15", "who": "CFO", "seg": 30}, {"text": "問：電池芯成本上漲是否能轉嫁給客戶？／答：今年各式元件全面上漲，公司積極與客戶溝通調整價格與產品組合，目標維持或提升毛利率。", "ts": "41:04", "who": "CEO", "seg": 35}, {"text": "問：是否有開發NVIDIA 19吋規格的HVDC BBU？／答：有配合客戶需求進行開發與搭配。", "ts": "61:13", "who": "CEO", "seg": 45}]}], "quotes": []}, {"key": "6691_2026-11-06", "code": "6691", "name": "洋基工程", "date": "2026-11-06", "segs": [{"i": 0, "ts": "00:01:20", "sec": 80, "who": "講者", "role": "公司", "text": "各位投資先進午安，我是今天的法說會主持人寬量國際 QC 執行長 Alex Lee 李紅機。"}, {"i": 1, "ts": "00:01:29", "sec": 89, "who": "講者", "role": "公司", "text": "歡迎各位參與由台灣指數公司主辦的洋基工程法說會。"}, {"i": 2, "ts": "00:01:34", "sec": 94, "who": "講者", "role": "公司", "text": "今天參與的公司代表有董事長劉士元先生，以及財務長陳志豪先生。"}, {"i": 3, "ts": "00:01:45", "sec": 105, "who": "講者", "role": "公司", "text": "大家好。"}, {"i": 4, "ts": "00:01:46", "sec": 106, "who": "劉士元", "role": "公司", "text": "大家好，我是洋基劉士元，大家午安。"}, {"i": 5, "ts": "00:01:51", "sec": 111, "who": "劉士元", "role": "公司", "text": "洋基第三季財務數字以及法說會簡報皆已公告於公司官網及公開資訊觀測站，供各位下載參閱。"}, {"i": 6, "ts": "00:02:03", "sec": 123, "who": "劉士元", "role": "公司", "text": "本次法說會首先將由陳財務長向大家說明洋基第三季的經營成果、營運展望，以及策略佈局。"}, {"i": 7, "ts": "00:02:13", "sec": 133, "who": "劉士元", "role": "公司", "text": "接著由劉董事長將在 QA 環節中回答所有投資人問題。"}, {"i": 8, "ts": "00:02:18", "sec": 138, "who": "劉士元", "role": "公司", "text": "我們現在先請財務長來我們進行今天的簡報，謝謝。"}, {"i": 9, "ts": "00:02:24", "sec": 144, "who": "陳志豪", "role": "公司", "text": "好，謝謝主持人。"}, {"i": 10, "ts": "00:02:26", "sec": 146, "who": "陳志豪", "role": "公司", "text": "那也謝謝各位螢幕前的這個投資先進來參加今天的法說會。"}, {"i": 11, "ts": "00:02:32", "sec": 152, "who": "陳志豪", "role": "公司", "text": "那首先我想先感謝台灣證券交易所以及台灣指數公司以及寬量團隊讓我們有機會來這邊做這一次的參加這一次的法說會。"}, {"i": 12, "ts": "00:02:44", "sec": 164, "who": "陳志豪", "role": "公司", "text": "那接下來的內容如主持剛剛所提到的會分成營運成果還有洋基的佈局、我們的競爭優勢以及未來長期的展望幾個項目來說明。"}, {"i": 13, "ts": "00:02:56", "sec": 176, "who": "陳志豪", "role": "公司", "text": "那我想洋基公司成立於 1980 年，那到今天已經 46 年了。"}, {"i": 14, "ts": "00:03:01", "sec": 181, "who": "陳志豪", "role": "公司", "text": "那我們過去長期以來一直是以無塵室跟機電空調為我們的整個技術核心。"}, {"i": 15, "ts": "00:03:07", "sec": 187, "who": "陳志豪", "role": "公司", "text": "那在 2021 年的時候呢，公司決定公司決定以這個以無塵室跟機電空調為我們的這個技術核心來做未來的發展。"}, {"i": 16, "ts": "00:03:23", "sec": 203, "who": "陳志豪", "role": "公司", "text": "那我們採取的方式呢是以多元多元化的一個方式來包括跨領域跨地區跨產業的方式來追求公司的持續成長。"}, {"i": 17, "ts": "00:03:36", "sec": 216, "who": "陳志豪", "role": "公司", "text": "那我們追蹤的目標呢就是希望能夠提高總股東報酬這樣的一個方式來最後能夠回饋到股東的身上。"}, {"i": 18, "ts": "00:03:47", "sec": 227, "who": "陳志豪", "role": "公司", "text": "那截至到今天我們洋基工程已經從一個無塵室機電空調的一個承包商升級為一個高科技廠房的總承包商這樣的一個角色。"}, {"i": 19, "ts": "00:03:59", "sec": 239, "who": "陳志豪", "role": "公司", "text": "那以下就讓我稍微介紹一下我們今年的一個營運成果。"}, {"i": 20, "ts": "00:04:04", "sec": 244, "who": "陳志豪", "role": "公司", "text": "那剛好公司也在昨天經由董事會通過我們第三季的一個財務報告。"}, {"i": 21, "ts": "00:04:10", "sec": 250, "who": "陳志豪", "role": "公司", "text": "所以由我這邊來跟各位做一個簡單的分享。"}, {"i": 22, "ts": "00:04:14", "sec": 254, "who": "陳志豪", "role": "公司", "text": "首先是我們在稅後淨利的部分，那 2026 年 Q3 的這個獲利年增率是 137.3%，那稅後淨利是 17.5 億元。"}, {"i": 23, "ts": "00:04:26", "sec": 266, "who": "陳志豪", "role": "公司", "text": "那營業收入呢也達到了 146.5 億，那營業毛利跟營業利益呢分別也達到了 24.7 跟 22.2 億元的這樣的一個成長。"}, {"i": 24, "ts": "00:04:38", "sec": 278, "who": "陳志豪", "role": "公司", "text": "YOY 的成長率分別都超過了 150%。"}, {"i": 25, "ts": "00:04:41", "sec": 281, "who": "陳志豪", "role": "公司", "text": "那相對於我們過去的成長率來講，不但歷史新高，那成長率也是在過去過去的這個經驗上絕無僅有。"}, {"i": 26, "ts": "00:04:53", "sec": 293, "who": "陳志豪", "role": "公司", "text": "那我們相信未來還能夠持續在開創這樣的一個金人的成長。"}, {"i": 27, "ts": "00:04:59", "sec": 299, "who": "陳志豪", "role": "公司", "text": "那至於 EPS 的部分，單季的這個 EPS 也達到是 3.16。"}, {"i": 28, "ts": "00:05:04", "sec": 304, "who": "陳志豪", "role": "公司", "text": "那為認列營收的部分也達到了 571 億。"}, {"i": 29, "ts": "00:05:07", "sec": 307, "who": "陳志豪", "role": "公司", "text": "那這個數字呢跟我們去年的 550 億來相比，也是持續的成長。"}, {"i": 30, "ts": "00:05:14", "sec": 314, "who": "陳志豪", "role": "公司", "text": "那尤其我們在第三季的時候呢，也持續承接了多個工程案件，然後讓這個未認列營收的數字呢能夠持續增加。"}, {"i": 31, "ts": "00:05:27", "sec": 327, "who": "陳志豪", "role": "公司", "text": "那接下來看一下我們今年前三季的一個獲利的一個情形。"}, {"i": 32, "ts": "00:05:33", "sec": 333, "who": "陳志豪", "role": "公司", "text": "那稅後淨利的部分達到了 40.6 億元，那 YOY 的成長達到了 102.5%。"}, {"i": 33, "ts": "00:05:41", "sec": 341, "who": "陳志豪", "role": "公司", "text": "那營業收入呢也達到了 327.6 億，營業毛利跟營業利益分別達到 57.7 億跟 51.5 億元。"}, {"i": 34, "ts": "00:05:51", "sec": 351, "who": "陳志豪", "role": "公司", "text": "EPS 一到九月份的 EPS 也達到了 30.62 元。"}, {"i": 35, "ts": "00:05:58", "sec": 358, "who": "陳志豪", "role": "公司", "text": "那這個數字我想是遠超過於我們歷年來的一個表現。"}, {"i": 36, "ts": "00:06:05", "sec": 365, "who": "陳志豪", "role": "公司", "text": "那當然它主要的來源就是我們在 2024 年 2025 年分別打入新的這個供應鏈，那承接了幾個大型的專案。"}, {"i": 37, "ts": "00:06:16", "sec": 376, "who": "陳志豪", "role": "公司", "text": "那規模從 110 到 210 不等的這專案。"}, {"i": 38, "ts": "00:06:19", "sec": 379, "who": "陳志豪", "role": "公司", "text": "那隨著工程的持續進行，那我們也按月依照完工百分比法做收入的一個認列。"}, {"i": 39, "ts": "00:06:26", "sec": 386, "who": "陳志豪", "role": "公司", "text": "那當然在這個整個 AI 的發展的趨勢之下呢，我們可以看到公司的這個業務會持續的一個成長。"}, {"i": 40, "ts": "00:06:36", "sec": 396, "who": "陳志豪", "role": "公司", "text": "那這邊也在進一步來跟各位報告我們就是收入的一個分類的部分。"}, {"i": 41, "ts": "00:06:43", "sec": 403, "who": "陳志豪", "role": "公司", "text": "那各位可以看到就是我們 1 到 9 月的營收，如同剛剛跟各位報告已經達到了 327.6 億元。"}, {"i": 42, "ts": "00:06:49", "sec": 409, "who": "陳志豪", "role": "公司", "text": "那跟 2023 年相比，來成長了 2.1 倍。"}, {"i": 43, "ts": "00:06:55", "sec": 415, "who": "陳志豪", "role": "公司", "text": "那單一專案承接的規模也超過 200 億元。"}, {"i": 44, "ts": "00:07:00", "sec": 420, "who": "陳志豪", "role": "公司", "text": "那這個是我們歷年来能承接最大的一個專案。"}, {"i": 45, "ts": "00:07:07", "sec": 427, "who": "陳志豪", "role": "公司", "text": "那主要的收入來源除了這個 半導體 PCB 以外，這是我們長期在深根著墨的兩個產業。"}, {"i": 46, "ts": "00:07:19", "sec": 439, "who": "陳志豪", "role": "公司", "text": "那特別是在半導體的部分，那長期以來我們合作的對象包括台灣的龍頭的廠商都是我們主要都是我們服務的一個客戶。"}, {"i": 47, "ts": "00:07:31", "sec": 451, "who": "陳志豪", "role": "公司", "text": "那另外在半導體的部分，那我們在 2024 年 2025 年分別打入了國際型大廠的供應鏈。"}, {"i": 48, "ts": "00:07:40", "sec": 460, "who": "陳志豪", "role": "公司", "text": "那對於公司未來的發展其實會有相當大的這個注意。"}, {"i": 49, "ts": "00:07:45", "sec": 465, "who": "陳志豪", "role": "公司", "text": "那也我想各位從新聞媒體上也看到就是我們的客戶也承諾就是帶著洋基公司一起在國際上面來打拼。"}, {"i": 50, "ts": "00:07:56", "sec": 476, "who": "陳志豪", "role": "公司", "text": "然後來進一步來來發展。"}, {"i": 51, "ts": "00:07:58", "sec": 478, "who": "陳志豪", "role": "公司", "text": "那除了半導體以外，PCB 是我們另外一個重要的產業的收入來源。"}, {"i": 52, "ts": "00:08:04", "sec": 484, "who": "陳志豪", "role": "公司", "text": "那我们在這個產業裡面已經著墨超過 40 年。"}, {"i": 53, "ts": "00:08:09", "sec": 489, "who": "陳志豪", "role": "公司", "text": "那從早期在台灣發展，後來跟著客戶到 中國大陸以及泰國來進一步來做廠務工程的這個新建。"}, {"i": 54, "ts": "00:08:20", "sec": 500, "who": "陳志豪", "role": "公司", "text": "那近期來講在泰國這邊，我們都陸續有新廠陸續的落成，陸續的落成。"}, {"i": 55, "ts": "00:08:27", "sec": 507, "who": "陳志豪", "role": "公司", "text": "那未來我們也會持續跟客戶來做配合。"}, {"i": 56, "ts": "00:08:31", "sec": 511, "who": "陳志豪", "role": "公司", "text": "那除了這兩個產業以外呢，那另外一個就是各位最近會相當關注到的 AI 數據中心。"}, {"i": 57, "ts": "00:08:40", "sec": 520, "who": "陳志豪", "role": "公司", "text": "那這部分我們在 2024 年也承接了一個 AI 數據中心的專案，那地點就在桃園的龜山數據中心。"}, {"i": 58, "ts": "00:08:49", "sec": 529, "who": "陳志豪", "role": "公司", "text": "那未來我們會希望能夠在 以這個為基礎，那累積相關的技術經驗，那進一步往東南亞跟美國來尋找更更好的機會，來參與 AI 數據中心的一個發展。"}, {"i": 59, "ts": "00:09:06", "sec": 546, "who": "陳志豪", "role": "公司", "text": "那另外還有一個值得一提的部分，就是剛剛提到說多元化的部分。"}, {"i": 60, "ts": "00:09:12", "sec": 552, "who": "陳志豪", "role": "公司", "text": "那當然除了高科技產業，我們也不能忘記一般的民生商辦的這樣的一個範圍。"}, {"i": 61, "ts": "00:09:18", "sec": 558, "who": "陳志豪", "role": "公司", "text": "所以在前兩年我們也承接了高雄奧斯迪 複合型商辦的這個機電工程的專案。"}, {"i": 62, "ts": "00:09:26", "sec": 566, "who": "陳志豪", "role": "公司", "text": "那這個工程仍然持續在進行當中，那由於它是一個商辦大樓，它的這個整個工程的進度會的步調呢會跟高科技廠房會略有不同，所以一般的工程的時間會比較長一些。"}, {"i": 63, "ts": "00:09:41", "sec": 581, "who": "陳志豪", "role": "公司", "text": "所以這個部分也佔我們今年到 1 到 9 月的營收大約占了 5.5% 這樣的一個 一個收入的佔比。"}, {"i": 64, "ts": "00:09:52", "sec": 592, "who": "陳志豪", "role": "公司", "text": "好，那其次再來在說明一下我們就是就目前為止未認列營收的部分。"}, {"i": 65, "ts": "00:09:59", "sec": 599, "who": "陳志豪", "role": "公司", "text": "那先跟各位 投資先進來報告就是因為我們是屬於機電工程的產業，所以在收入的認列上面是採用完工百分比法。"}, {"i": 66, "ts": "00:10:11", "sec": 611, "who": "陳志豪", "role": "公司", "text": "也就是說所承接的合約金額會按照每個月的完工百分比跟完工進度來認列，逐月來認列營收。"}, {"i": 67, "ts": "00:10:22", "sec": 622, "who": "陳志豪", "role": "公司", "text": "那未認列的部分呢，我們我們會歸類在所謂的未認列營收這樣的項目裡面，也就是在未來時間內可以逐步反映或者是轉認列到營業收入的這個項目裡面。"}, {"i": 68, "ts": "00:10:38", "sec": 638, "who": "陳志豪", "role": "公司", "text": "那各位可以從圖表上面看到，我們在 2024 年的年底，那當時的未認列營收已經達到了這個 當時認為應該是歷史的新高，也就是 421 這樣的一個規模。"}, {"i": 69, "ts": "00:10:53", "sec": 653, "who": "陳志豪", "role": "公司", "text": "那我們在 2025 年也成功爭取了美系的這個大廠的工程專案。"}, {"i": 70, "ts": "00:11:00", "sec": 660, "who": "陳志豪", "role": "公司", "text": "那使著我們的未認列營收的這個金額呢，一下跳升到 553 億。"}, {"i": 71, "ts": "00:11:06", "sec": 666, "who": "陳志豪", "role": "公司", "text": "那在今年呢，雖然前 12 季， 我們逐步進行工程的施工，那把這金額逐步認列成為營收。"}, {"i": 72, "ts": "00:11:17", "sec": 677, "who": "陳志豪", "role": "公司", "text": "但在第三季的部分時間呢，我們仍然迅速的承接新的工程專案，也接近百億的這個工程的規模。"}, {"i": 73, "ts": "00:11:27", "sec": 687, "who": "陳志豪", "role": "公司", "text": "那使了我們未認列營收的這個金額一舉突破到 571 億以上這樣的一個規模。"}, {"i": 74, "ts": "00:11:33", "sec": 693, "who": "陳志豪", "role": "公司", "text": "那我們 目前仍然有一些專案持續在洽談當中，那當然有進一步的訊息，我們會來盡快來跟各位投資人來做報告。"}, {"i": 75, "ts": "00:11:43", "sec": 703, "who": "陳志豪", "role": "公司", "text": "那另外就這些專案可以認列的時間點呢，以早期來講，因為承接的可能是單一的比較小的這個工程專案。"}, {"i": 76, "ts": "00:11:51", "sec": 711, "who": "陳志豪", "role": "公司", "text": "那一般轉認列為收入的時間點大約會是在 6 個月到 12 個月之間。"}, {"i": 77, "ts": "00:11:58", "sec": 718, "who": "陳志豪", "role": "公司", "text": "那長一點也許在 18 個月。"}, {"i": 78, "ts": "00:12:00", "sec": 720, "who": "陳志豪", "role": "公司", "text": "那隨著我們現在 所承接的這個規模越來越大，那我們所 負責的範圍也比以往來的責任也比以往來的這個加重。"}, {"i": 79, "ts": "00:12:15", "sec": 735, "who": "陳志豪", "role": "公司", "text": "所以整個工程的期間也有可能從 12 個月到 24 個月不整。"}, {"i": 80, "ts": "00:12:21", "sec": 741, "who": "陳志豪", "role": "公司", "text": "那另外就是剛剛所報告到就是有關奧斯迪的這個專案的時間可能就會拉場到 3 到 4 年這樣的一個期間。"}, {"i": 81, "ts": "00:12:31", "sec": 751, "who": "陳志豪", "role": "公司", "text": "所以整個轉認列的時間點呢，還是要視我們當初規劃的工程進度來做認列。"}, {"i": 82, "ts": "00:12:38", "sec": 758, "who": "陳志豪", "role": "公司", "text": "那以我們最近期爭取到這個美系大廠的這個施工時間約為一年。"}, {"i": 83, "ts": "00:12:44", "sec": 764, "who": "陳志豪", "role": "公司", "text": "那到目前為止這個工程 已經進入到中後期的階段，那我們逐步來跟我們的客戶來做一些 系統或者是無塵室的交付。"}, {"i": 84, "ts": "00:12:57", "sec": 777, "who": "陳志豪", "role": "公司", "text": "那一切都還按照我們預計的工程在進行當中。"}, {"i": 85, "ts": "00:13:03", "sec": 783, "who": "陳志豪", "role": "公司", "text": "好，那我這邊接下來再簡單報告一下洋基公司對於未來的一個佈局以及客戶的需求。"}, {"i": 86, "ts": "00:13:14", "sec": 794, "who": "陳志豪", "role": "公司", "text": "那我們這邊會分從兩個部分來做一個報告。"}, {"i": 87, "ts": "00:13:17", "sec": 797, "who": "陳志豪", "role": "公司", "text": "那首先會來報告一下， 就是我們提到所謂多元化這樣的發展，但是除了多元化之外， 隨著而來的可能就會產生整合性的問題。"}, {"i": 88, "ts": "00:13:29", "sec": 809, "who": "陳志豪", "role": "公司", "text": "那怎麼樣來做工程跨產業的整合，或者是公種之間的整合，甚至說在工程裡面我們如何 在 這一條龍的服務裡面，從設計規劃驗收 到最後的一個階段，怎麼樣能夠來深化我們的整合能力。"}, {"i": 89, "ts": "00:13:50", "sec": 830, "who": "陳志豪", "role": "公司", "text": "那其次要跟各位報告的就是說，我們除了台灣的發展以外，我們也往海外來發展。"}, {"i": 90, "ts": "00:13:56", "sec": 836, "who": "陳志豪", "role": "公司", "text": "那我們如何在海外來佈局來建構未來的一個營收成長的來源。"}, {"i": 91, "ts": "00:14:03", "sec": 843, "who": "陳志豪", "role": "公司", "text": "那最後呢，我大概會簡略提一下有關數位化的一個發展。"}, {"i": 92, "ts": "00:14:08", "sec": 848, "who": "陳志豪", "role": "公司", "text": "那首先就整個系統分包延伸到整場的總承包，那我們這邊所需最需要的就是一個 完全的整合能力。"}, {"i": 93, "ts": "00:14:18", "sec": 858, "who": "陳志豪", "role": "公司", "text": "那這個整合能力如一開始跟各位報告，就是我們以無塵室跟機電 這是我們的核心的技術。"}, {"i": 94, "ts": "00:14:26", "sec": 866, "who": "陳志豪", "role": "公司", "text": "那我們把這個技術運用在跨產業的這個 實際的運用上面，實際的工程上面。"}, {"i": 95, "ts": "00:14:34", "sec": 874, "who": "陳志豪", "role": "公司", "text": "那當然各產業都會有略有不同，但是我們透過包括在公司設計了設置了所謂的設計中心。"}, {"i": 96, "ts": "00:14:43", "sec": 883, "who": "陳志豪", "role": "公司", "text": "那把所有的 設計的 圖表做一個規格化，設計的流程施工的步驟，建立標準的作業流程，那讓所有的這個工程都能按照一定的標準作業程序來進行，這是第一個。"}, {"i": 97, "ts": "00:15:01", "sec": 901, "who": "陳志豪", "role": "公司", "text": "那第二個我們也 從工程施工走向整合的服務。"}, {"i": 98, "ts": "00:15:07", "sec": 907, "who": "陳志豪", "role": "公司", "text": "就是說我們未來我們目前為止提供的服務並不是只有單純的設計規劃施工。"}, {"i": 99, "ts": "00:15:15", "sec": 915, "who": "陳志豪", "role": "公司", "text": "那我們還提供給客戶一個優質的建議，讓客戶能夠優化他的設計規劃。"}, {"i": 100, "ts": "00:15:23", "sec": 923, "who": "陳志豪", "role": "公司", "text": "那近舉例來說如何能夠達到最有效的一個節能效果，那如何能夠最有效的將 整個 電力配置在整個場3區。"}, {"i": 101, "ts": "00:15:35", "sec": 935, "who": "陳志豪", "role": "公司", "text": "這都是我們能夠提供的一個服務的範圍。"}, {"i": 102, "ts": "00:15:39", "sec": 939, "who": "陳志豪", "role": "公司", "text": "所以在兩年前我們透過整個設計中心， 來整合所有專案的一個規劃跟設計以及優化。"}, {"i": 103, "ts": "00:15:49", "sec": 949, "who": "陳志豪", "role": "公司", "text": "那這個設計中心未來不是只有應用在 台灣而已，那我們也應用在海外的這個 海外的這個發展。"}, {"i": 104, "ts": "00:16:00", "sec": 960, "who": "陳志豪", "role": "公司", "text": "那至於在海外的整個佈局呢，我們從最早期 最早期哦，我們主要的營收來源來自於台灣以及中國大陸。"}, {"i": 105, "ts": "00:16:11", "sec": 971, "who": "陳志豪", "role": "公司", "text": "那在 2022 年，那我們跟著客戶一起到了泰國來 來發展。"}, {"i": 106, "ts": "00:16:17", "sec": 977, "who": "陳志豪", "role": "公司", "text": "那 進一步呢我們也往馬來西亞美國來做 子公司的設立。"}, {"i": 107, "ts": "00:16:24", "sec": 984, "who": "陳志豪", "role": "公司", "text": "那這邊會稍微有點不一樣的就是在泰國這邊的發展，我們的發展策略是跟隨客戶來 朝向不同的國家來進行。"}, {"i": 108, "ts": "00:16:35", "sec": 995, "who": "陳志豪", "role": "公司", "text": "但是在馬來西亞這裡呢，我們 我們是完全一個陌生的環境，然後來尋求新的一個 機會。"}, {"i": 109, "ts": "00:16:44", "sec": 1004, "who": "陳志豪", "role": "公司", "text": "那新新的市場來找尋新的供應商以及新的客戶。"}, {"i": 110, "ts": "00:16:49", "sec": 1009, "who": "陳志豪", "role": "公司", "text": "所以這對我們來講是一個非常大的一個挑戰。"}, {"i": 111, "ts": "00:16:53", "sec": 1013, "who": "陳志豪", "role": "公司", "text": "但是非常 令人振奮的事情就是我們在今年其實馬來西亞這邊也陸續承接了一些工程專案。"}, {"i": 112, "ts": "00:17:03", "sec": 1023, "who": "陳志豪", "role": "公司", "text": "開始對當地的整個業務開始熟悉，那我們希望進一步把這樣的一個經驗擴展到日本以及美國，甚至說其他的一個地方。"}, {"i": 113, "ts": "00:17:14", "sec": 1034, "who": "陳志豪", "role": "公司", "text": "那另外也要在特別值得一提的就是在 日本的部分。"}, {"i": 114, "ts": "00:17:19", "sec": 1039, "who": "陳志豪", "role": "公司", "text": "我們在今年的 8 月份併購了一家日本公司，我們收購了其 51% 的股權。"}, {"i": 115, "ts": "00:17:26", "sec": 1046, "who": "陳志豪", "role": "公司", "text": "那當然透過這樣的方式可以快速的去取得當地的的一些資源。"}, {"i": 116, "ts": "00:17:31", "sec": 1051, "who": "陳志豪", "role": "公司", "text": "但是這不是我們所要的一個最終極的目標。"}, {"i": 117, "ts": "00:17:36", "sec": 1056, "who": "陳志豪", "role": "公司", "text": "我們需要的是把這樣的一個資源跟台灣的工程技術做一個整合。"}, {"i": 118, "ts": "00:17:44", "sec": 1064, "who": "陳志豪", "role": "公司", "text": "比如說日本對於無塵室機電空調的這個相關的法規規定，那如何跟台灣的這邊工程技術能夠進一步的配合。"}, {"i": 119, "ts": "00:17:52", "sec": 1072, "who": "陳志豪", "role": "公司", "text": "那這是我們希望能夠看到的，那甚至在人力資源上面，我們也可以透過全球性的一個整合來調配包括中國大陸、馬來西亞、泰國以及台灣的這個人力。"}, {"i": 120, "ts": "00:18:05", "sec": 1085, "who": "陳志豪", "role": "公司", "text": "那讓人人力能夠充分的發揮。"}, {"i": 121, "ts": "00:18:08", "sec": 1088, "who": "陳志豪", "role": "公司", "text": "那尤其在現在這個整個缺工的大缺工的一個時期哦，那如何運用 充分的運用人力，那會是積電工程公司能夠取勝的一個絕對的一個關鍵。"}, {"i": 122, "ts": "00:18:21", "sec": 1101, "who": "陳志豪", "role": "公司", "text": "那最後一個是 針對美國的部分。"}, {"i": 123, "ts": "00:18:25", "sec": 1105, "who": "陳志豪", "role": "公司", "text": "那我们在美國的子公司，我們也在亞利桑那這邊設立了一家子公司。"}, {"i": 124, "ts": "00:18:31", "sec": 1111, "who": "陳志豪", "role": "公司", "text": "那這個時間也將近了一年。"}, {"i": 125, "ts": "00:18:34", "sec": 1114, "who": "陳志豪", "role": "公司", "text": "那未來我們會 持續就工程團隊這邊來籌組合適的工程團隊。"}, {"i": 126, "ts": "00:18:40", "sec": 1120, "who": "陳志豪", "role": "公司", "text": "那但是另外一個方向有鑒於在日本的經驗，我們發現透過收購的方式可以讓我們快速的在當地來建立相關的，比如說客戶的清單也好，或供應鏈也好，甚至說當地的 這個 專業的人才也好。"}, {"i": 127, "ts": "00:18:59", "sec": 1139, "who": "陳志豪", "role": "公司", "text": "那我們希望透過這樣未來希望透過這樣的方式呢，能夠迅速在美國來進一步來發展。"}, {"i": 128, "ts": "00:19:08", "sec": 1148, "who": "陳志豪", "role": "公司", "text": "那我們預期希望說在明年的時間呢，我們可以有 從美國那邊得到更進一步的一些消息，得到一些業務的拓展。"}, {"i": 129, "ts": "00:19:20", "sec": 1160, "who": "陳志豪", "role": "公司", "text": "好，那目前為止呢，海外的營收大約占到我們整體營收的 14.3%。"}, {"i": 130, "ts": "00:19:26", "sec": 1166, "who": "陳志豪", "role": "公司", "text": "那我們希望未來隨著這個時間的推移，海外業務的拓展，那未來在日本跟馬來西亞都會有一些專案在明年會逐步的開始實施。"}, {"i": 131, "ts": "00:19:39", "sec": 1179, "who": "陳志豪", "role": "公司", "text": "那我們相信這樣的一個營收的比重會逐漸的來升高。"}, {"i": 132, "ts": "00:19:44", "sec": 1184, "who": "陳志豪", "role": "公司", "text": "好，其次是運用數位化工程與AI科技來提昇建廠與營運效率。"}, {"i": 133, "ts": "00:19:54", "sec": 1194, "who": "陳志豪", "role": "公司", "text": "那這個部分大概我們會分成兩個方面。"}, {"i": 134, "ts": "00:19:58", "sec": 1198, "who": "陳志豪", "role": "公司", "text": "一個是所謂並 3D 模組的建模。"}, {"i": 135, "ts": "00:20:02", "sec": 1202, "who": "陳志豪", "role": "公司", "text": "那這個東西對 工程業其實相當的一個重要，也就是說我們透過 最初的一個 3D 的模擬， 來模擬施工實際完成的一個狀況，來減少管線的一個碰撞，甚至 可以避免不需要的重工或者修復的作業。"}, {"i": 136, "ts": "00:20:21", "sec": 1221, "who": "陳志豪", "role": "公司", "text": "那對我們來講其實是可以大幅的去控制可能因為不必要的重工或者是修復所產生的額外的成本。"}, {"i": 137, "ts": "00:20:30", "sec": 1230, "who": "陳志豪", "role": "公司", "text": "那另外一個是在 AI 的運用上面。"}, {"i": 138, "ts": "00:20:33", "sec": 1233, "who": "陳志豪", "role": "公司", "text": "就是雖然有些 投資人或者是其他外部的人會認為說機電工程可能是一個比較偏向傳統的產業。"}, {"i": 139, "ts": "00:20:45", "sec": 1245, "who": "陳志豪", "role": "公司", "text": "但是在今天 AI 的這個大時代裡面，那我們怎麼樣運用這些技術能夠 讓我們提前做一些成本分析，或者是未來的一些預估， 來減少成本跟存貨不必必要的一些損耗。"}, {"i": 140, "ts": "00:21:02", "sec": 1262, "who": "陳志豪", "role": "公司", "text": "那進一步做成本的一些管控。"}, {"i": 141, "ts": "00:21:04", "sec": 1264, "who": "陳志豪", "role": "公司", "text": "這是我們未來要去 進行的一些方向。"}, {"i": 142, "ts": "00:21:08", "sec": 1268, "who": "陳志豪", "role": "公司", "text": "那最後呢，我们在施工上面未來我們也會朝向 預製跟模組化的方向來進行。"}, {"i": 143, "ts": "00:21:16", "sec": 1276, "who": "陳志豪", "role": "公司", "text": "那我們在目前在台中會有一個 已經有一個廠房。"}, {"i": 144, "ts": "00:21:21", "sec": 1281, "who": "陳志豪", "role": "公司", "text": "那我們會把這個部分進一步升級來作為我們的預製廠， 來減少 把所有 需要的部分呢在這邊先進行預製。"}, {"i": 145, "ts": "00:21:31", "sec": 1291, "who": "陳志豪", "role": "公司", "text": "那未來可以減少現場人力的一個需求。"}, {"i": 146, "ts": "00:21:35", "sec": 1295, "who": "陳志豪", "role": "公司", "text": "那當然這些東西能夠如實的來執行的話，對於客戶的這個 價值來講，第一個縮短工期，那接下來就是減少 公安的一個風險。"}, {"i": 147, "ts": "00:21:49", "sec": 1309, "who": "陳志豪", "role": "公司", "text": "那我們也可以協助客戶進一步來做減減碳來達成 ESG 的一個目標。"}, {"i": 148, "ts": "00:21:55", "sec": 1315, "who": "陳志豪", "role": "公司", "text": "好，那接下來是有關於洋基工程的競爭優勢。"}, {"i": 149, "ts": "00:22:01", "sec": 1321, "who": "陳志豪", "role": "公司", "text": "我們的競爭優勢其實 主要來自於幾個方向。"}, {"i": 150, "ts": "00:22:08", "sec": 1328, "who": "陳志豪", "role": "公司", "text": "那如同剛剛報告的，第一個是 跨產業的技術整合能力。"}, {"i": 151, "ts": "00:22:15", "sec": 1335, "who": "陳志豪", "role": "公司", "text": "那再來就是從施工到 走向 從施工過程中的這個整合能力。"}, {"i": 152, "ts": "00:22:22", "sec": 1342, "who": "陳志豪", "role": "公司", "text": "那這樣的一個整合能力呢，可以如同前面所報告的，就可以讓我們節省很多不必要的成本跟浪費。"}, {"i": 153, "ts": "00:22:31", "sec": 1351, "who": "陳志豪", "role": "公司", "text": "那這些成本對我們來最後反映出來的就是如螢幕上所 各位所看到的。"}, {"i": 154, "ts": "00:22:36", "sec": 1356, "who": "陳志豪", "role": "公司", "text": "第一個就是我們交付的速度。"}, {"i": 155, "ts": "00:22:42", "sec": 1362, "who": "陳志豪", "role": "公司", "text": "在過去一段時間裡面，可能在過去幾年期間，我們自己大概 對於說一年是不是可以完成一個 200 億以上的專案，大概大家都沒有這樣的一個經驗。"}, {"i": 156, "ts": "00:22:52", "sec": 1372, "who": "陳志豪", "role": "公司", "text": "可是透過我們過去很長一段時間的這個不斷的整合，那人員的訓練， 部門間的這些互動 互動學習，那讓我們 透過這些經驗的傳承，那加快了很多作業上面的速 速度。"}, {"i": 157, "ts": "00:23:09", "sec": 1389, "who": "陳志豪", "role": "公司", "text": "所以說 目前就是在台南的這一個專案裡面呢，到目前從年初到现在為止，目前都很順利的按照我們預計的工期 來 進行各項公種的這個 進行當中。"}, {"i": 158, "ts": "00:23:26", "sec": 1406, "who": "陳志豪", "role": "公司", "text": "那當然在這個過程當中，我們也 達到了所謂全方位系統整合的能力。"}, {"i": 159, "ts": "00:23:33", "sec": 1413, "who": "陳志豪", "role": "公司", "text": "那 像前面所講的，我們一般核心技術主要還是著重在 機電工程跟無塵室的這個方面的一個技術。"}, {"i": 160, "ts": "00:23:43", "sec": 1423, "who": "陳志豪", "role": "公司", "text": "但是透過 作為一個 總承包商的角色， 那我們可以更好的去知道 在 各個系統裡面如何的去做一個相互的配合。"}, {"i": 161, "ts": "00:23:55", "sec": 1435, "who": "陳志豪", "role": "公司", "text": "舉例來說以無塵室來講好了，那除了無塵室跟機電之外，他所要配合的 其他的系統包括水器化。"}, {"i": 162, "ts": "00:24:06", "sec": 1446, "who": "陳志豪", "role": "公司", "text": "也就是純水 特氣化學等其他的這些項目。"}, {"i": 163, "ts": "00:24:10", "sec": 1450, "who": "陳志豪", "role": "公司", "text": "那我們怎麼樣把這些東西 以 作為一個總承包商的一個角色把它整合在一起。"}, {"i": 164, "ts": "00:24:17", "sec": 1457, "who": "陳志豪", "role": "公司", "text": "那這是我們過去來講一直在磨練的一個能力。"}, {"i": 165, "ts": "00:24:21", "sec": 1461, "who": "陳志豪", "role": "公司", "text": "所以說洋基公司在目前為止等於說是 在台灣少數具有這個 全部整合能力的一家廠務工程公司。"}, {"i": 166, "ts": "00:24:31", "sec": 1471, "who": "陳志豪", "role": "公司", "text": "那當然最後反映出來的結果就是能夠 持續的與客戶配合。"}, {"i": 167, "ts": "00:24:35", "sec": 1475, "who": "陳志豪", "role": "公司", "text": "那除了既有的客戶之外，我們也持續的在 爭取新的客戶，打入新的供應鏈，來 進一步來拓展我們的營業範圍。"}, {"i": 168, "ts": "00:24:45", "sec": 1485, "who": "陳志豪", "role": "公司", "text": "那最後一點就是 我們的競爭優勢應該就是我們 的財務实力。"}, {"i": 169, "ts": "00:24:53", "sec": 1493, "who": "陳志豪", "role": "公司", "text": "那 在 9 月底為止，我們公司現 合併報表上面的這個現金及約當現金的金額來到了 67 億左右這樣的一個水準。"}, {"i": 170, "ts": "00:25:03", "sec": 1503, "who": "陳志豪", "role": "公司", "text": "那以往有些會覺得說公司的 這樣的一個運作，財務操作是不是過於保守。"}, {"i": 171, "ts": "00:25:11", "sec": 1511, "who": "陳志豪", "role": "公司", "text": "但是 對我們來講 如何去面對每一次 意外的一個風險或者 是 意外的發生，對我們來講是相當重要。"}, {"i": 172, "ts": "00:25:21", "sec": 1521, "who": "陳志豪", "role": "公司", "text": "如何保持充足的現金流量，以因應大型專案的這個款項的支應， 對我們也是非常重要。"}, {"i": 173, "ts": "00:25:31", "sec": 1531, "who": "陳志豪", "role": "公司", "text": "甚至不用提說 未來我們會在 台灣以外地區來加大投資的金額。"}, {"i": 174, "ts": "00:25:38", "sec": 1538, "who": "陳志豪", "role": "公司", "text": "那這些都會需要 呃 公司有充足的這個現金的資源， 來 才能實行這些計劃。"}, {"i": 175, "ts": "00:25:47", "sec": 1547, "who": "陳志豪", "role": "公司", "text": "那除了手上的現金之外呢，我們也跟 台灣的數家銀行有密切的往來。"}, {"i": 176, "ts": "00:25:54", "sec": 1554, "who": "陳志豪", "role": "公司", "text": "那 這些銀行也提供給我們充分的一個資源。"}, {"i": 177, "ts": "00:25:59", "sec": 1559, "who": "陳志豪", "role": "公司", "text": "那包括我們所需要的這個履約保履約保證或者是預付款保證的額度呢，我們都已經準備好了。"}, {"i": 178, "ts": "00:26:06", "sec": 1566, "who": "陳志豪", "role": "公司", "text": "就是一旦能夠 有更 大型的專案，我們都能夠與銀行這邊一起來合作。"}, {"i": 179, "ts": "00:26:13", "sec": 1573, "who": "陳志豪", "role": "公司", "text": "來 提供客戶所需要的保證。"}, {"i": 180, "ts": "00:26:18", "sec": 1578, "who": "陳志豪", "role": "公司", "text": "好，那其次就是在公司的發展策略上面。"}, {"i": 181, "ts": "00:26:24", "sec": 1584, "who": "陳志豪", "role": "公司", "text": "那我們除了剛剛講到說 多重的核心能力，整合的能力之外呢，那我們也具備了幾個 重要的一個 重要的一個關鍵的 項目。"}, {"i": 182, "ts": "00:26:38", "sec": 1598, "who": "陳志豪", "role": "公司", "text": "包括說工程的自由團隊。"}, {"i": 183, "ts": "00:26:40", "sec": 1600, "who": "陳志豪", "role": "公司", "text": "那我們的人數從 員工人數從 2019 年的 338 人，在這幾年中持續的成長到 今年的 9 月底已經來到 1115 位哦。"}, {"i": 184, "ts": "00:26:52", "sec": 1612, "who": "陳志豪", "role": "公司", "text": "那成長的比例相當於是 3.2 倍的人數哦。"}, {"i": 185, "ts": "00:26:57", "sec": 1617, "who": "陳志豪", "role": "公司", "text": "但是這些人數呢， 他並不是說用在現場的這個 實際的操作。"}, {"i": 186, "ts": "00:27:06", "sec": 1626, "who": "陳志豪", "role": "公司", "text": "而是說我們的專業核心能力在於整個工程進度的一個管理。"}, {"i": 187, "ts": "00:27:12", "sec": 1632, "who": "陳志豪", "role": "公司", "text": "那所以我們 除了自由的工程團隊之外，我們也有龐大的這個協力廠商。"}, {"i": 188, "ts": "00:27:17", "sec": 1637, "who": "陳志豪", "role": "公司", "text": "那剛提到就是說在今天這個大缺工的時代哦。"}, {"i": 189, "ts": "00:27:21", "sec": 1641, "who": "陳志豪", "role": "公司", "text": "那如果能夠掌握越多的協議廠商，對於 這個公司來講，其實就會具備更具備競爭力。"}, {"i": 190, "ts": "00:27:31", "sec": 1651, "who": "陳志豪", "role": "公司", "text": "那我們每天在 可能在各工程專案的這個進出的人數大約也到 5000 到 6000 人次哦。"}, {"i": 191, "ts": "00:27:40", "sec": 1660, "who": "陳志豪", "role": "公司", "text": "那這這邊就是體現我們 公司管理上面的核心技術的一個價值。"}, {"i": 192, "ts": "00:27:47", "sec": 1667, "who": "陳志豪", "role": "公司", "text": "那最後再提一下就是所謂策略備料的部分。"}, {"i": 193, "ts": "00:27:52", "sec": 1672, "who": "陳志豪", "role": "公司", "text": "那由於 工程專案大家會面臨到幾個風險，首先就是原材料價格變動的風險。"}, {"i": 194, "ts": "00:27:59", "sec": 1679, "who": "陳志豪", "role": "公司", "text": "那其次是缺料的風險。"}, {"i": 195, "ts": "00:28:02", "sec": 1682, "who": "陳志豪", "role": "公司", "text": "那這面對這兩個風險，我們採取兩個 做法人。"}, {"i": 196, "ts": "00:28:06", "sec": 1686, "who": "陳志豪", "role": "公司", "text": "那第一個就是我們分散供應商的供貨。"}, {"i": 197, "ts": "00:28:10", "sec": 1690, "who": "陳志豪", "role": "公司", "text": "也就是說我們有 為了每一每一項工程專案，我們都會有我們的採購部的同仁，來尋找充分的供應商。"}, {"i": 198, "ts": "00:28:19", "sec": 1699, "who": "陳志豪", "role": "公司", "text": "來為每一項工程專案來提供 這個充分的貨源。"}, {"i": 199, "ts": "00:28:25", "sec": 1705, "who": "陳志豪", "role": "公司", "text": "包括 工程當中所需要的原材料以及設備。"}, {"i": 200, "ts": "00:28:30", "sec": 1710, "who": "陳志豪", "role": "公司", "text": "那另外在 施工的初期，那我們就會完成約 40% 到 50% 的一個採購。"}, {"i": 201, "ts": "00:28:38", "sec": 1718, "who": "陳志豪", "role": "公司", "text": "那在工程進行到六成到七成的時候，我們的對外發包的這個 執行率大概已經達到八成到九成這樣執行率。"}, {"i": 202, "ts": "00:28:48", "sec": 1728, "who": "陳志豪", "role": "公司", "text": "那它最大的好處就是我們透過早期的備料。"}, {"i": 203, "ts": "00:28:52", "sec": 1732, "who": "陳志豪", "role": "公司", "text": "那可以鎖定成本，那讓 我們的這個 成本價格不會因為 可能在工程期間因為任何的 事故或者是其他原因造成原材料大幅的這個 移動。"}, {"i": 204, "ts": "00:29:11", "sec": 1751, "who": "陳志豪", "role": "公司", "text": "那使得工程成本有 大幅變動的這樣的情形哦。"}, {"i": 205, "ts": "00:29:13", "sec": 1753, "who": "陳志豪", "role": "公司", "text": "那另外一方面也同時保證了 就是 供應商能夠在我們需要的預計的時間點把 貨 包括原材料設備 進到我們的工地現場。"}, {"i": 206, "ts": "00:29:26", "sec": 1766, "who": "陳志豪", "role": "公司", "text": "那降低我們的庫存成本。"}, {"i": 207, "ts": "00:29:29", "sec": 1769, "who": "陳志豪", "role": "公司", "text": "那進一步來做這樣的一個管理。"}, {"i": 208, "ts": "00:29:31", "sec": 1771, "who": "陳志豪", "role": "公司", "text": "好，那最後這邊跟各位報告就是我們 過去的一些 實際的一些 成績。"}, {"i": 209, "ts": "00:29:39", "sec": 1779, "who": "陳志豪", "role": "公司", "text": "那各位可以看到剛提到的就是包括在愛斯摩爾還有 美光，這都是我們新爭取到的廠 幾個大型的客戶。"}, {"i": 210, "ts": "00:29:50", "sec": 1790, "who": "陳志豪", "role": "公司", "text": "那未來我們也會透過在日本的子公司來參與 雄本金融二廠的這個計劃。"}, {"i": 211, "ts": "00:30:00", "sec": 1800, "who": "陳志豪", "role": "公司", "text": "那另外在泰國跟馬來西亞，那我們這邊也會陸續有一些新的工程專案，會陸續的來做承接。"}, {"i": 212, "ts": "00:30:08", "sec": 1808, "who": "陳志豪", "role": "公司", "text": "那尤其在馬來西亞的部分，那我們目前也已經跟台灣的一些 公司 已經 開始洽談這些 工程廠務工程專案的一些 進度。"}, {"i": 213, "ts": "00:30:22", "sec": 1822, "who": "陳志豪", "role": "公司", "text": "那只是說目前來講金額可能會比較小一些。"}, {"i": 214, "ts": "00:30:26", "sec": 1826, "who": "陳志豪", "role": "公司", "text": "但是我相信在不久的將來，那我們會 這邊會有一個比較具體成果。"}, {"i": 215, "ts": "00:30:33", "sec": 1833, "who": "陳志豪", "role": "公司", "text": "那尤其馬來西亞 馬來西亞的部分呢 在 北部的部分，檳城這一塊也算是這個 半導體封測的一個區域。"}, {"i": 216, "ts": "00:30:43", "sec": 1843, "who": "陳志豪", "role": "公司", "text": "那南部會有數眾多的這個數據中心的一個規劃。"}, {"i": 217, "ts": "00:30:48", "sec": 1848, "who": "陳志豪", "role": "公司", "text": "那這都是我們未來 現在以及未來一直在 瞄準的這些目標。"}, {"i": 218, "ts": "00:30:55", "sec": 1855, "who": "陳志豪", "role": "公司", "text": "好，那最後就我們的這個長期的展望來看。"}, {"i": 219, "ts": "00:31:04", "sec": 1864, "who": "陳志豪", "role": "公司", "text": "那首先我們先看一下目前市場上的一些數據。"}, {"i": 220, "ts": "00:31:08", "sec": 1868, "who": "陳志豪", "role": "公司", "text": "那我們可以看到其實現在正在 AI 的浪潮浪潮上面，雖然近期有一些雜音。"}, {"i": 221, "ts": "00:31:14", "sec": 1874, "who": "陳志豪", "role": "公司", "text": "但是看起來 不管在 设备的資本支出或者是 這個 未來的投資，看起來都是持續的在增加當中的。"}, {"i": 222, "ts": "00:31:27", "sec": 1887, "who": "陳志豪", "role": "公司", "text": "那尤其在預估在 2023 2030 年全球AI資本支出有機會達到美金 3.68 兆。"}, {"i": 223, "ts": "00:31:35", "sec": 1895, "who": "陳志豪", "role": "公司", "text": "那我想這個我們公司已經準備好，而且未來也不會缺席這一塊。"}, {"i": 224, "ts": "00:31:41", "sec": 1901, "who": "陳志豪", "role": "公司", "text": "那不管他未來的地地點呢會是在美國、日本或者是台灣甚至馬來西亞其他的地點。"}, {"i": 225, "ts": "00:31:49", "sec": 1909, "who": "陳志豪", "role": "公司", "text": "那我們都已經有工程團隊預備在這邊，那隨時可以來進行這個相關的案件的承接。"}, {"i": 226, "ts": "00:31:55", "sec": 1915, "who": "陳志豪", "role": "公司", "text": "那這這邊 就是跟各位報告就是我們目前有的一些據點，包括 中國、日本還有 亞利桑那、馬來西亞、新加坡等等，都會是我們未來 持續推動的 業務的一些地點。"}, {"i": 227, "ts": "00:32:13", "sec": 1933, "who": "陳志豪", "role": "公司", "text": "那最後在這邊跟各位報告就是我們未來的一個目標。"}, {"i": 228, "ts": "00:32:19", "sec": 1939, "who": "陳志豪", "role": "公司", "text": "那如同ㄧ開始跟各位所說明的，我們最終的目標是希望維持一個高的 總股東報酬 全 總股東權益報酬率，這樣的一個 一個 一個一個目標。"}, {"i": 229, "ts": "00:32:36", "sec": 1956, "who": "陳志豪", "role": "公司", "text": "那更希望說這這些東西可以我們的經營成果跟獲利能夠維持 不但維持之外呢，能夠進一步 反饋給我們的這個同業。"}, {"i": 230, "ts": "00:32:47", "sec": 1967, "who": "陳志豪", "role": "公司", "text": "所以我們未來有機會來持續維持成長，那也希望能夠 不但成長之外呢，能夠持續 優於同業的這個獲利的成長。"}, {"i": 231, "ts": "00:33:01", "sec": 1981, "who": "陳志豪", "role": "公司", "text": "那這這邊就是我這邊做的一個簡單的一個說明。"}, {"i": 232, "ts": "00:33:10", "sec": 1990, "who": "陳志豪", "role": "公司", "text": "謝謝。"}, {"i": 233, "ts": "00:33:12", "sec": 1992, "who": "講者", "role": "公司", "text": "好，謝謝 Johnny 的 presentation。"}, {"i": 234, "ts": "00:33:16", "sec": 1996, "who": "講者", "role": "公司", "text": "我想接下來我們將進行今天的 Q&A。"}, {"i": 235, "ts": "00:33:19", "sec": 1999, "who": "講者", "role": "公司", "text": "那請各位投資先進將您的問題呢填寫於 Webex 的聊天室當中。"}, {"i": 236, "ts": "00:33:25", "sec": 2005, "who": "講者", "role": "公司", "text": "那首先我們將針對各位這個投資先進在會前所提出的問題進行回答。"}, {"i": 237, "ts": "00:33:33", "sec": 2013, "who": "講者", "role": "公司", "text": "接著我們會請現場工作人員會診現場的提問進行第二波的提問。"}, {"i": 238, "ts": "00:33:38", "sec": 2018, "who": "講者", "role": "公司", "text": "那我想去把現場這個之前的會前所提到的問題幫大家複誦一遍。"}, {"i": 239, "ts": "00:33:45", "sec": 2025, "who": "講者", "role": "公司", "text": "第一個問題是， 想請問公司在客戶需求暢旺在手訂單不斷累積的情況下，那是如何決定將資源分配在半導體 AI 資料中心或其他專案呢？那其中考量的因素大概是什麼？"}, {"i": 240, "ts": "00:40:48", "sec": 2448, "who": "劉士元", "role": "公司", "text": "我們的原則是呃不是哪個產業特別熱門，然後就會把所有的資源給投進去。"}, {"i": 241, "ts": "00:41:16", "sec": 2476, "who": "劉士元", "role": "公司", "text": "而是選擇來讓洋基能夠發揮工程專業優勢， 具有合理的獲利，而且能夠確實執行的專案。"}, {"i": 242, "ts": "00:41:26", "sec": 2486, "who": "劉士元", "role": "公司", "text": "那在資源的分配上，我們主要考量幾個因素。"}, {"i": 243, "ts": "00:41:31", "sec": 2491, "who": "劉士元", "role": "公司", "text": "包括客戶長期的合作夥伴關係， 專案獲利能力， 工程執行風險， 專業人力配置， 以及未來市場的成長 潛力。"}, {"i": 244, "ts": "00:41:46", "sec": 2506, "who": "劉士元", "role": "公司", "text": "半導體產業是洋基重要的核心市場。"}, {"i": 245, "ts": "00:41:51", "sec": 2511, "who": "劉士元", "role": "公司", "text": "我們會持續深化跟客戶的 一個合作夥伴關係，維持公司的競爭優勢。"}, {"i": 246, "ts": "00:42:01", "sec": 2521, "who": "劉士元", "role": "公司", "text": "AI 數據中心的部分是我們積極投入的一個新興市場。"}, {"i": 247, "ts": "00:42:11", "sec": 2531, "who": "劉士元", "role": "公司", "text": "那隨著全球 AI 算力需求的增加， 我們也會逐步投入更多的技術人才與資源，擴大相關的業務。"}, {"i": 248, "ts": "00:42:23", "sec": 2543, "who": "劉士元", "role": "公司", "text": "至於其他高科技產業的部分，包括了 IC 載版，"}, {"i": 249, "ts": "00:42:32", "sec": 2552, "who": "劉士元", "role": "公司", "text": "光通訊零組件，"}, {"i": 250, "ts": "00:42:37", "sec": 2557, "who": "劉士元", "role": "公司", "text": "以及海外的市場，"}, {"i": 251, "ts": "00:42:41", "sec": 2561, "who": "劉士元", "role": "公司", "text": "我們也會選擇有合理獲利， 以及長期發展潛力的專案， 來進行投入， 讓公司的業務佈局更加多元。"}, {"i": 252, "ts": "00:43:01", "sec": 2581, "who": "劉士元", "role": "公司", "text": "未來公司將持續採取動態式的調整。"}, {"i": 253, "ts": "00:43:08", "sec": 2588, "who": "劉士元", "role": "公司", "text": "在既有核心業務與新興市場之間， 取得一個平衡， 追求營收獲利長期穩健成長的一個方向。"}, {"i": 254, "ts": "00:43:24", "sec": 2604, "who": "劉士元", "role": "公司", "text": "謝謝。"}, {"i": 255, "ts": "00:43:26", "sec": 2606, "who": "講者", "role": "公司", "text": "好，謝謝董事長的回答。"}, {"i": 256, "ts": "00:43:28", "sec": 2608, "who": "講者", "role": "公司", "text": "那我們進行第二個 會前的投資人提問。"}, {"i": 257, "ts": "00:43:35", "sec": 2615, "who": "講者", "role": "公司", "text": "那想請問公司截至目前為止看到的在手訂單有多少？"}, {"i": 258, "ts": "00:43:44", "sec": 2624, "who": "講者", "role": "公司", "text": "那相較 9 月底的水位有何變化？"}, {"i": 259, "ts": "00:43:47", "sec": 2627, "who": "講者", "role": "公司", "text": "那另外可以進一步說明目前與客戶洽談訂單中東南亞與日本的比例大約是多少？"}, {"i": 260, "ts": "00:43:55", "sec": 2635, "who": "劉士元", "role": "公司", "text": "呃這一點我們讓 財務長來說明一下。"}, {"i": 261, "ts": "00:44:03", "sec": 2643, "who": "陳志豪", "role": "公司", "text": "好，謝謝主持人。"}, {"i": 262, "ts": "00:44:06", "sec": 2646, "who": "陳志豪", "role": "公司", "text": "呃如同剛剛在 呃 前面簡報裡面報告，就是說我們到 9 月底的 這個未認列營收的部分呢達到了 571 億這樣的一個 572 億的水準。"}, {"i": 263, "ts": "00:44:31", "sec": 2671, "who": "陳志豪", "role": "公司", "text": "那特別是在我們在第三季也就是 9 月下旬的時候， 其實 有取得將近一個億的 一個訂單。"}, {"i": 264, "ts": "00:44:42", "sec": 2682, "who": "陳志豪", "role": "公司", "text": "那這邊也要在進一步的來說明就是 也更新一下，就是我們到 10 月為止，其實 公司的主 訂單仍然持續在進行當中。"}, {"i": 265, "ts": "00:45:00", "sec": 2700, "who": "陳志豪", "role": "公司", "text": "所以就我手邊的一個數據，我們大約還有 61 億左右的這個 呃 未認 也就是合約金額可以在 6 月 10 月的時候來反映進來。"}, {"i": 266, "ts": "00:45:21", "sec": 2721, "who": "陳志豪", "role": "公司", "text": "所以到 10 月底的話，我們的未認列營收的金額，也就是 可能是大家比較習慣所謂的訂單的這個金額達到了將近大概 630 億左右這樣的一個水準。"}, {"i": 267, "ts": "00:45:41", "sec": 2741, "who": "陳志豪", "role": "公司", "text": "所以說 呃 公司 這邊 我們然持續在 爭取 呃 就是客戶這邊的一個訂單。"}, {"i": 268, "ts": "00:46:00", "sec": 2760, "who": "陳志豪", "role": "公司", "text": "那讓公司在明後年這邊可以持續來進一步的來發展。"}, {"i": 269, "ts": "00:46:09", "sec": 2769, "who": "陳志豪", "role": "公司", "text": "那另外有提到就是說關於東南亞以及日本的這個比例嘛。"}, {"i": 270, "ts": "00:46:18", "sec": 2778, "who": "陳志豪", "role": "公司", "text": "那 呃 目前來講，剛提到 包括泰國、馬來西亞， 其實日本都在比較初級的一個發展階段。"}, {"i": 271, "ts": "00:46:31", "sec": 2791, "who": "陳志豪", "role": "公司", "text": "所以這邊所佔到未認列營收的比重呢。"}, {"i": 272, "ts": "00:46:38", "sec": 2798, "who": "陳志豪", "role": "公司", "text": "差不多是 呃 東南亞的部分呢差不多是在 4% 左右。"}, {"i": 273, "ts": "00:46:47", "sec": 2807, "who": "陳志豪", "role": "公司", "text": "那另外日本的部分呢，差 大約會佔到差不多是在 5% 5% 這樣的一個水準。"}, {"i": 274, "ts": "00:47:01", "sec": 2821, "who": "陳志豪", "role": "公司", "text": "那當然會隨著未來時間的推移有這個比重會 再有一些變動。"}, {"i": 275, "ts": "00:47:11", "sec": 2831, "who": "陳志豪", "role": "公司", "text": "呃我這邊稍微再補充一下。"}, {"i": 276, "ts": "00:47:16", "sec": 2836, "who": "陳志豪", "role": "公司", "text": "剛我們財務長有提到 呃 截至目前為止我們的在手未認列的訂單大約也突破了歷史的新高。"}, {"i": 277, "ts": "00:47:33", "sec": 2853, "who": "陳志豪", "role": "公司", "text": "來到 630 多億。"}, {"i": 278, "ts": "00:47:36", "sec": 2856, "who": "陳志豪", "role": "公司", "text": "那超過網年的 500 多億的一個水準。"}, {"i": 279, "ts": "00:47:41", "sec": 2861, "who": "陳志豪", "role": "公司", "text": "那其實在這方面目前 包含在幾個市場，包括台灣。"}, {"i": 280, "ts": "00:47:50", "sec": 2870, "who": "陳志豪", "role": "公司", "text": "那 包含日本 以及在馬來西亞。"}, {"i": 281, "ts": "00:48:02", "sec": 2882, "who": "陳志豪", "role": "公司", "text": "目前在洽談的這個業務專案 的這個總額啊。"}, {"i": 282, "ts": "00:48:15", "sec": 2895, "who": "陳志豪", "role": "公司", "text": "呃 幾個專案加起來大於 600 多億這個數字。"}, {"i": 283, "ts": "00:48:30", "sec": 2910, "who": "陳志豪", "role": "公司", "text": "呃大於還 呃 算倍數以上。"}, {"i": 284, "ts": "00:48:58", "sec": 2938, "who": "陳志豪", "role": "公司", "text": "那我們這個過程在洽談，那客戶 目前 呃 隨著他建廠的需求的這個時程呢。"}, {"i": 285, "ts": "00:49:05", "sec": 2945, "who": "陳志豪", "role": "公司", "text": "那我們認為 我們是有相當的一定的信心， 可以把握 一些專案哦。"}, {"i": 286, "ts": "00:49:15", "sec": 2955, "who": "陳志豪", "role": "公司", "text": "那讓我們的這個在手的這個未認列的訂單哦。"}, {"i": 287, "ts": "00:49:25", "sec": 2965, "who": "陳志豪", "role": "公司", "text": "呃我們努力一個目標來突破千億以上。"}, {"i": 288, "ts": "00:49:33", "sec": 2973, "who": "陳志豪", "role": "公司", "text": "呃我這簡單的補充，謝謝。"}, {"i": 289, "ts": "00:49:36", "sec": 2976, "who": "講者", "role": "公司", "text": "好，謝謝董事長跟財務長的回答。"}, {"i": 290, "ts": "00:49:38", "sec": 2978, "who": "講者", "role": "公司", "text": "那下一個投資人提問是想請問公司在 2026 2027 年 全年的營收目標為何？"}, {"i": 291, "ts": "00:49:46", "sec": 2986, "who": "講者", "role": "公司", "text": "那另外是否有看到因為 AI 投資現金流吃緊而產生 AI 基礎建設推遲的現象呢？"}, {"i": 292, "ts": "00:49:50", "sec": 2990, "who": "劉士元", "role": "公司", "text": "呃是的。"}, {"i": 293, "ts": "00:49:54", "sec": 2994, "who": "劉士元", "role": "公司", "text": "呃洋基在 2025 年的營業額大概是 223 億元左右的一個水準。"}, {"i": 294, "ts": "00:50:09", "sec": 3009, "who": "劉士元", "role": "公司", "text": "那我們在 2025 年 去 預期 2026 年，我們原本的預期成長目標 差不多是 60 到 70% 左右。"}, {"i": 295, "ts": "00:50:31", "sec": 3031, "who": "劉士元", "role": "公司", "text": "哦。"}, {"i": 296, "ts": "00:50:32", "sec": 3032, "who": "劉士元", "role": "公司", "text": "那到截至 呃 Q3 為止， 我們營收 YoY 同期的比較，我們成長了 100 多%。"}, {"i": 297, "ts": "00:50:47", "sec": 3047, "who": "劉士元", "role": "公司", "text": "我想這個數字是 相當的好，超出我們原本的預期。"}, {"i": 298, "ts": "00:50:56", "sec": 3056, "who": "劉士元", "role": "公司", "text": "那總體來看 2026 年 我們預計這個 第四季 的營收 的狀況 隨著工程的這個 呃 的"}, {"i": 299, "ts": "00:51:17", "sec": 3077, "who": "劉士元", "role": "公司", "text": "施工的這個時程來看哦， 我們預期第四季可能會跟第三季差不多。"}, {"i": 300, "ts": "00:51:30", "sec": 3090, "who": "劉士元", "role": "公司", "text": "所以總體預計 呃 26 年的營收應該 呃 將算起來，應該可以比 25 年大約成長大約將近就是 100% 的這個數字左右。"}, {"i": 301, "ts": "00:51:57", "sec": 3117, "who": "劉士元", "role": "公司", "text": "然後有關 2027 年的部分哦。"}, {"i": 302, "ts": "00:52:05", "sec": 3125, "who": "劉士元", "role": "公司", "text": "那因為我們剛有提到我們的目前在手的未認列的這個這個金額哦。"}, {"i": 303, "ts": "00:52:16", "sec": 3136, "who": "劉士元", "role": "公司", "text": "呃目前是 600 多億。"}, {"i": 304, "ts": "00:52:19", "sec": 3139, "who": "劉士元", "role": "公司", "text": "而且我剛剛有提到我們的目標應該是 應該 在未來的一季左右以內我們目標是達到破千億以上的這個數字水準啦。"}, {"i": 305, "ts": "00:52:41", "sec": 3161, "who": "劉士元", "role": "公司", "text": "那我相信這個千億元以上 在 我們認列的時程大約 1 至 2 年左右的時間。"}, {"i": 306, "ts": "00:52:58", "sec": 3178, "who": "劉士元", "role": "公司", "text": "所以我們可以很樂觀的來看待 2027 年的成長 應該是非常值得期待。"}, {"i": 307, "ts": "00:53:14", "sec": 3194, "who": "劉士元", "role": "公司", "text": "謝謝。"}, {"i": 308, "ts": "00:53:15", "sec": 3195, "who": "講者", "role": "公司", "text": "好，謝謝董事長的回答。"}, {"i": 309, "ts": "00:53:19", "sec": 3199, "who": "講者", "role": "公司", "text": "那下一個投資人提問是想請問 這裡有兩個問題想請教。"}, {"i": 310, "ts": "00:53:26", "sec": 3206, "who": "講者", "role": "公司", "text": "第一次有關公安風險。"}, {"i": 311, "ts": "00:53:32", "sec": 3212, "who": "講者", "role": "公司", "text": "那貴公司去年的 職安未裁罰共 11 件。"}, {"i": 312, "ts": "00:53:42", "sec": 3222, "who": "講者", "role": "公司", "text": "那請問今年的改善情形為何？"}, {"i": 313, "ts": "00:53:49", "sec": 3229, "who": "講者", "role": "公司", "text": "那對客戶 的供應鏈評選影響又是如何呢？"}, {"i": 314, "ts": "00:53:57", "sec": 3237, "who": "講者", "role": "公司", "text": "那第二個想請教公司 是具有規劃盤點部分業務？"}, {"i": 315, "ts": "00:54:05", "sec": 3245, "who": "講者", "role": "公司", "text": "由適用或者符合金融會的永續經濟活動認定 的參考指引呢？"}, {"i": 316, "ts": "00:54:13", "sec": 3253, "who": "講者", "role": "公司", "text": "謝謝。"}, {"i": 317, "ts": "00:54:19", "sec": 3259, "who": "劉士元", "role": "公司", "text": "呃有關公安的部分我來簡單說明一下。"}, {"i": 318, "ts": "00:54:26", "sec": 3266, "who": "劉士元", "role": "公司", "text": "我很感謝這個 投資先進的這個提問哦。"}, {"i": 319, "ts": "00:54:33", "sec": 3273, "who": "劉士元", "role": "公司", "text": "因為公安這個議題是 呃我想一直以來是我們在工程行業哦，也特別是我們洋基工程 最重視的一個議題哦。"}, {"i": 320, "ts": "00:55:00", "sec": 3300, "who": "劉士元", "role": "公司", "text": "那確實我們去年的 11 件 呃 那個裁罰的事件。"}, {"i": 321, "ts": "00:55:10", "sec": 3310, "who": "劉士元", "role": "公司", "text": "透過我們今年一整年度的努力哦，我們包含 聘請第三方的專業單位來給我們做全 這個 全公司的這個公安的健檢。"}, {"i": 322, "ts": "00:55:42", "sec": 3342, "who": "劉士元", "role": "公司", "text": "以及駐廠 去去執行哦。"}, {"i": 323, "ts": "00:55:48", "sec": 3348, "who": "劉士元", "role": "公司", "text": "那我們今天把這個數字 很好了從 11 件 大大的降低到 大概是 2 件。"}, {"i": 324, "ts": "00:56:10", "sec": 3370, "who": "劉士元", "role": "公司", "text": "哦。"}, {"i": 325, "ts": "00:56:12", "sec": 3372, "who": "劉士元", "role": "公司", "text": "而且我們不但降低了這個公安的事件。"}, {"i": 326, "ts": "00:56:22", "sec": 3382, "who": "劉士元", "role": "公司", "text": "我們在幾個專案包括 桃園的這個數據中心。"}, {"i": 327, "ts": "00:56:32", "sec": 3392, "who": "劉士元", "role": "公司", "text": "我們也獲得了當地的這個主管機關 認同的一個 工程最高的一個討安獎。"}, {"i": 328, "ts": "00:57:04", "sec": 3424, "who": "劉士元", "role": "公司", "text": "有關安全的一個獎。"}, {"i": 329, "ts": "00:57:08", "sec": 3428, "who": "劉士元", "role": "公司", "text": "那以及 在台南美光的這個專案。"}, {"i": 330, "ts": "00:57:20", "sec": 3440, "who": "劉士元", "role": "公司", "text": "那也獲得這個台南政府這邊的一個 金安獎。"}, {"i": 331, "ts": "00:57:33", "sec": 3453, "who": "劉士元", "role": "公司", "text": "這都足足證明 我們的努力有確實得到了 很好的一個成果哦。"}, {"i": 332, "ts": "00:58:00", "sec": 3480, "who": "劉士元", "role": "公司", "text": "我想我們洋基 特別再次強調哦。"}, {"i": 333, "ts": "00:58:20", "sec": 3500, "who": "劉士元", "role": "公司", "text": "工程的現場危險性是高的哦。"}, {"i": 334, "ts": "00:58:33", "sec": 3513, "who": "劉士元", "role": "公司", "text": "那唯有安全是 呃回家唯一的道路。"}, {"i": 335, "ts": "00:58:45", "sec": 3525, "who": "劉士元", "role": "公司", "text": "我想這一點我們不會放鬆，也不會放手。 呃。"}, {"i": 336, "ts": "00:59:00", "sec": 3540, "who": "劉士元", "role": "公司", "text": "謝謝。"}, {"i": 337, "ts": "00:59:02", "sec": 3542, "who": "劉士元", "role": "公司", "text": "那第二個 ESG 的部分，我們請我們財務長來說明一下。"}, {"i": 338, "ts": "00:59:17", "sec": 3557, "who": "陳志豪", "role": "公司", "text": "好，謝謝董事長。那我這邊來簡單說明一下就是有關 呃 有關金管會 永續經濟活動認定參考指引的適用性的盤點這 相關的問題。"}, {"i": 339, "ts": "00:40:01", "sec": 2401, "who": "陳志豪", "role": "公司", "text": "那因為我們公司從兩年前其實就 呃推動 ESG 的 各項作業，包括永續報告書的一個編製。"}, {"i": 340, "ts": "00:41:11", "sec": 2471, "who": "陳志豪", "role": "公司", "text": "那今年跟去年開始我們就開始做溫室氣體盤查的這個相關的盤點作業哦。"}, {"i": 341, "ts": "00:41:35", "sec": 2495, "who": "陳志豪", "role": "公司", "text": "那確實 我們到目前為止還沒有開始適用這個 呃永續經濟活動認定參考指引的相關的盤點作業。"}, {"i": 342, "ts": "00:42:19", "sec": 2539, "who": "陳志豪", "role": "公司", "text": "那但是我們會 呃 應該不能說近期啊，就是我們在 未來的一兩年的時間，那就會開始 來試著去推動這樣 的一些作業。"}, {"i": 343, "ts": "00:43:53", "sec": 2633, "who": "陳志豪", "role": "公司", "text": "那我們目前有做的事情哦，包括幾個項目。"}, {"i": 344, "ts": "00:44:03", "sec": 2643, "who": "陳志豪", "role": "公司", "text": "第一個就是 ISO 146 14064 之一的這個溫室氣體報告，那以及 綠色供應鏈的這個採購。"}, {"i": 345, "ts": "00:44:59", "sec": 2699, "who": "陳志豪", "role": "公司", "text": "那供應鏈有序的管理，能源管理以及低碳的工程作業等等哦。"}, {"i": 346, "ts": "00:45:11", "sec": 2711, "who": "陳志豪", "role": "公司", "text": "這都是我們現在在 積極推動的項目。"}, {"i": 347, "ts": "00:45:19", "sec": 2719, "who": "陳志豪", "role": "公司", "text": "那尤其在溫室氣體盤點的部分，那我們從今年開始也開始把海外的子公司 納入我們盤點的項目。"}, {"i": 348, "ts": "00:45:51", "sec": 2751, "who": "陳志豪", "role": "公司", "text": "所以 呃 所以工作上面會 相對來講會比較多一些。"}, {"i": 349, "ts": "00:46:11", "sec": 2771, "who": "陳志豪", "role": "公司", "text": "所以我們會陸陸續續來執行這些 呃 跟推動這些 ESG 相關的這個作業，那以上謝謝。"}, {"i": 350, "ts": "00:52:19", "sec": 3139, "who": "講者", "role": "公司", "text": "好，謝謝 Johnny 還有董事長的回答。"}, {"i": 351, "ts": "00:52:32", "sec": 3152, "who": "講者", "role": "公司", "text": "那下一個投資人提問是想請問 與台系 這個產物同業來相比的話，那洋基工程的核心差異為何呢？"}, {"i": 352, "ts": "00:54:10", "sec": 3250, "who": "劉士元", "role": "公司", "text": "這個我們讓 呃發言人說明一下。"}, {"i": 353, "ts": "00:54:21", "sec": 3261, "who": "講者", "role": "公司", "text": "好，謝謝董事長。"}, {"i": 354, "ts": "00:54:33", "sec": 3273, "who": "講者", "role": "公司", "text": "呃 我想 呃目前在 無塵室跟機電空調上 的這個產業上面有底下 呃 不管是業務性質 或者市這個 呃 業務的範圍 都蠻相近的廠商。"}, {"i": 355, "ts": "00:56:06", "sec": 3366, "who": "講者", "role": "公司", "text": "那其實 過去的一段時間，過去的應該說 3 年到 5 年的時間點，那對於廠務工程的需求是非常的龐大。"}, {"i": 356, "ts": "00:56:15", "sec": 3375, "who": "講者", "role": "公司", "text": "所以各家在作業上面其實都 持續的在成長，那我們也都彼此相互的學習哦。"}, {"i": 357, "ts": "00:56:29", "sec": 3389, "who": "講者", "role": "公司", "text": "那就核心的差異來講，如同我剛剛在簡報裡面所 報告的 呃 內容哦。"}, {"i": 358, "ts": "00:56:39", "sec": 3399, "who": "講者", "role": "公司", "text": "我們大會會分成幾個方向，第一個是 呃 所謂技術整合的這個能力哦。"}, {"i": 359, "ts": "00:56:56", "sec": 3416, "who": "講者", "role": "公司", "text": "那 我們從推動這個多元化的這個 呃 政策開始，那我们就比較著重在於說 我的工程技術 的核心技術是不是能應用在不同的產業。"}, {"i": 360, "ts": "00:57:07", "sec": 3427, "who": "講者", "role": "公司", "text": "那應用在不同產業可能會產生什麼樣的相對的問題。"}, {"i": 361, "ts": "00:57:15", "sec": 3435, "who": "講者", "role": "公司", "text": "那在這些問題上面我們也排除具體的解決方案跟標準的作業程序。"}, {"i": 362, "ts": "00:57:33", "sec": 3453, "who": "講者", "role": "公司", "text": "那不管說在日本我們可能叫做手順書，或者是在台灣我們叫做 SOP 的標準作業流程。"}, {"i": 363, "ts": "00:57:51", "sec": 3471, "who": "講者", "role": "公司", "text": "那大家都把這些 呃 項目呢整合在一起。"}, {"i": 364, "ts": "00:58:05", "sec": 3485, "who": "講者", "role": "公司", "text": "那其次是 呃從 剛剛有提到說從工程的 這個 整合性的服務。"}, {"i": 365, "ts": "00:58:20", "sec": 3500, "who": "講者", "role": "公司", "text": "那我們從早期的這個 一條龍服務，可能也只做到 所謂設計規劃執行驗收等等這幾個項目。"}, {"i": 366, "ts": "00:59:00", "sec": 3540, "who": "講者", "role": "公司", "text": "那從前兩年開始，我們除了設計團隊之外，我們也另外增加了一個所謂 CSA，也就是有關土建的這個團隊。"}, {"i": 367, "ts": "00:59:33", "sec": 3573, "who": "講者", "role": "公司", "text": "那在今年我們甚至 申請了這個土建的這個 營造業的營業項目。"}, {"i": 368, "ts": "00:59:47", "sec": 3587, "who": "講者", "role": "公司", "text": "那我們就是希望能夠更完整的來服務客戶。"}, {"i": 369, "ts": "00:59:53", "sec": 3593, "who": "講者", "role": "公司", "text": "除了 剛提到的這個設計規劃和相關的機電工程之外，那我們也能夠在土建這邊找到合適的這個 引導場或者是配合的 這個相關的供應商。"}, {"i": 370, "ts": "01:00:26", "sec": 3626, "who": "講者", "role": "公司", "text": "來進一步 為客戶提供更深層 深一層的服務。"}, {"i": 371, "ts": "01:00:32", "sec": 3632, "who": "講者", "role": "公司", "text": "那最後是在海外佈局的這個方面。"}, {"i": 372, "ts": "01:00:41", "sec": 3641, "who": "講者", "role": "公司", "text": "那就我們目前來看哦，就是 我們在 除了東南亞地區、日本、美國都有據點。"}, {"i": 373, "ts": "01:00:58", "sec": 3658, "who": "講者", "role": "公司", "text": "那我們現在所要 呃著重的重點就是在於說 呃 除了 系統的整合之外，那怎麼樣在管理上面也能夠讓所有的地區 能領沉一身，然後大家能夠來彼此資源作業。"}, {"i": 374, "ts": "01:02:18", "sec": 3738, "who": "講者", "role": "公司", "text": "那充分運用人力 人手人力來執行公 客戶所需要的這些專案。"}, {"i": 375, "ts": "01:02:51", "sec": 3771, "who": "講者", "role": "公司", "text": "那更重要的一點就是說 呃我們可能同一個客戶會在不同的地方來進行 專案的一個 廠務工程的建設。"}, {"i": 376, "ts": "01:03:22", "sec": 3802, "who": "講者", "role": "公司", "text": "那怎麼樣把 A 的這個經驗複製到 B 的這個國家。"}, {"i": 377, "ts": "01:03:51", "sec": 3831, "who": "講者", "role": "公司", "text": "那這邊就會是我們未來的一個相當重要的一個重點。"}, {"i": 378, "ts": "01:04:01", "sec": 3841, "who": "講者", "role": "公司", "text": "那以上，謝謝。"}, {"i": 379, "ts": "01:04:06", "sec": 3846, "who": "講者", "role": "公司", "text": "好，謝謝董事長的說明。"}, {"i": 380, "ts": "01:04:10", "sec": 3850, "who": "講者", "role": "公司", "text": "那作為一個現場投資人提問也是最後一個現場提問是， 想請問 可以再描述一下 3Q26 毛利率下降的原因？"}, {"i": 381, "ts": "01:05:07", "sec": 3907, "who": "講者", "role": "公司", "text": "那未來的一季跟明後年的毛利率是怎麼看呢？"}, {"i": 382, "ts": "01:05:16", "sec": 3916, "who": "講者", "role": "公司", "text": "那另外再請教各位描述一下 9 月底接到的百億大單是什麼產業？"}, {"i": 383, "ts": "01:05:22", "sec": 3922, "who": "講者", "role": "公司", "text": "那 10 月底在手訂單的產業比重大概是如何？"}, {"i": 384, "ts": "01:06:01", "sec": 3961, "who": "劉士元", "role": "公司", "text": "呃美系客戶 我們看到的 這是在桃園的一個場區嘛。"}, {"i": 385, "ts": "01:06:51", "sec": 4011, "who": "劉士元", "role": "公司", "text": "那 呃這個 客戶那邊的 一些動態 呃我想我們就 呃我們不不做太多的這個評論。"}, {"i": 386, "ts": "01:07:07", "sec": 4027, "who": "劉士元", "role": "公司", "text": "那目前這一個廠區 跟我們在 爭取的幾個專案是 呃沒有相關的。"}, {"i": 387, "ts": "01:07:56", "sec": 4076, "who": "劉士元", "role": "公司", "text": "以上。"}, {"i": 388, "ts": "01:07:57", "sec": 4077, "who": "講者", "role": "公司", "text": "好，謝謝董事長的說明。"}, {"i": 389, "ts": "01:08:00", "sec": 4080, "who": "講者", "role": "公司", "text": "那作為一個現場投人提問也是今天法說會的最後一個現場提問是，想請問 可以再描述一下 3Q26 毛利率下降的原因？"}, {"i": 390, "ts": "01:09:07", "sec": 4147, "who": "講者", "role": "公司", "text": "那未來的一季跟明後年的毛利率是怎樣看呢？"}, {"i": 391, "ts": "01:09:16", "sec": 4156, "who": "講者", "role": "公司", "text": "那另外在請問可以再描述一下 9 月底接到的百億大單是什麼產業？"}, {"i": 392, "ts": "01:09:21", "sec": 4161, "who": "講者", "role": "公司", "text": "那 10 月底在手訂單的產業比重大概是如何？"}, {"i": 393, "ts": "01:09:37", "sec": 4177, "who": "劉士元", "role": "公司", "text": "呃這個問題由我這邊來做一個簡單的回覆。"}, {"i": 394, "ts": "01:09:41", "sec": 4181, "who": "劉士元", "role": "公司", "text": "那 呃 在 9 月底我們所承接到的這個專案主要就是 呃半導體的產業。"}, {"i": 395, "ts": "01:10:02", "sec": 4202, "who": "劉士元", "role": "公司", "text": "半導體的產業。"}, {"i": 396, "ts": "01:10:07", "sec": 4207, "who": "劉士元", "role": "公司", "text": "那這個部分其實剛剛董事長這邊稍微也有帶到了，就是 呃幾個產業其實案件陸續的這個 進來。"}, {"i": 397, "ts": "01:10:48", "sec": 4248, "who": "劉士元", "role": "公司", "text": "那當然前面洽談時間是比較久，那只是說到 9 月的 9 月的時候 才比較 呃確定下來，並且進行簽約。"}, {"i": 398, "ts": "01:11:03", "sec": 4263, "who": "劉士元", "role": "公司", "text": "那另外一個是有提到說 呃 有關比重的部分哦。"}, {"i": 399, "ts": "01:11:15", "sec": 4275, "who": "劉士元", "role": "公司", "text": "那我們 以目前未認列營收的這個 呃 金額大約 570 億這樣的一個金額來看哦。"}, {"i": 400, "ts": "01:11:39", "sec": 4299, "who": "劉士元", "role": "公司", "text": "那我們大概有 70%，也就是七成份比較集中在 半導體跟記憶體這樣的一個產業。"}, {"i": 401, "ts": "01:12:00", "sec": 4320, "who": "劉士元", "role": "公司", "text": "那另外會有差不多是在 呃 五個%左右集中在 PCB 的這個產業。"}, {"i": 402, "ts": "01:12:12", "sec": 4332, "who": "劉士元", "role": "公司", "text": "那當然就是說 呃這個並不代表說 呃未來 PCB 的建案比較少，或者是晶圓半導體建案比較多。"}, {"i": 403, "ts": "01:12:35", "sec": 4355, "who": "劉士元", "role": "公司", "text": "而是有時候洽談的時間會 比預期來得久。"}, {"i": 404, "ts": "01:12:44", "sec": 4364, "who": "劉士元", "role": "公司", "text": "那另外也有 呃 另外一個影響的因素會是在於說 呃整個施工期 跟規模大小也會影響到簽約的時間。"}, {"i": 405, "ts": "01:13:00", "sec": 4380, "who": "劉士元", "role": "公司", "text": "所以這個未來我們都還會持續在追蹤這些的 數字以及訂單進禁的這個時間點。"}, {"i": 406, "ts": "01:13:08", "sec": 4388, "who": "劉士元", "role": "公司", "text": "謝謝。"}, {"i": 407, "ts": "01:13:10", "sec": 4390, "who": "講者", "role": "公司", "text": "好，謝謝 Johnny 的回答。"}, {"i": 408, "ts": "01:13:14", "sec": 4394, "who": "講者", "role": "公司", "text": "那因為今天也時間的緣故，那今天的法說會呢 就到這邊結束。"}, {"i": 409, "ts": "01:13:21", "sec": 4401, "who": "講者", "role": "公司", "text": "那謝謝各位 投資先進線上的參與，如果你看還有其它的問題， 歡迎聯絡洋基發言人的窗口，謝謝大家。"}, {"i": 410, "ts": "01:13:30", "sec": 4410, "who": "講者", "role": "公司", "text": "謝謝大家。"}], "qa": null, "chars": 13370, "last_min": 74, "cpm": 182, "status": "full", "memo": [{"title": "亮點", "points": [{"text": "3Q26 獲利年增 137.3%，創歷史新高。", "ts": "00:04:04", "who": "CFO", "seg": 20}]}, {"title": "營收", "points": [{"text": "3Q26 營業收入 146.5 億元，YoY 163.9%。", "ts": "00:04:04", "who": "CFO", "seg": 20}, {"text": "前三季累計營業收入 327.6 億元，YoY 113.0%。", "ts": "00:05:27", "who": "CFO", "seg": 31}]}, {"title": "毛利與獲利", "points": [{"text": "3Q26 營業毛利 24.7 億元，YoY 151.7%；稅後淨利 17.5 億元，EPS 13.16 元。", "ts": "00:04:04", "who": "CFO", "seg": 20}, {"text": "前三季累計稅後淨利 40.6 億元，EPS 30.62 元，獲利年增 102.5%。", "ts": "00:05:27", "who": "CFO", "seg": 31}]}, {"title": "訂單與能見度", "points": [{"text": "第三季在手訂單 571 億元，訂單能見度 1.1.5 年。", "ts": "00:09:52", "who": "CFO", "seg": 64}]}, {"title": "Q&A", "points": [{"text": "問：公司在客戶需求暢旺在手訂單不斷累積的情況下，是如何決定將資源分配在半導體、AI 數據中心或其他專案呢？／答：我們的原則不是某個產業特別熱門就投進去，而是選擇讓洋基能夠發揮工程專業優勢、具合理獲利且確實執行的專案。", "ts": "00:34:46", "who": "董事長", "seg": 239}, {"text": "問：請問公司截至目前為止看見在手訂單有多少？相較九月底的水位有何變化？可以進一步說明目前與客戶洽談訂單中東南亞與日本的比例大約是多少？／答：截至十月底，在手訂單約 630 多億元，超過往年的 500 多億元水準；東南亞比例約在 4%，日本約在 5%。", "ts": "00:35:59", "who": "財務長", "seg": 239}, {"text": "問：請問公司在 2026-2027 年全年的營收目標為何？另外是否有看到因 AI 投資現金流吃緊而產生 AI 基礎建設推遲的現象呢？／答：2025 年營業額約 223 億元，2026 年預期成長 60-70%；3Q 營收 YoY 成長 100%，預期 2026 年第四季與第三季差不多，2026 年整體營收較 25 年成長約 100%。", "ts": "00:39:28", "who": "董事長", "seg": 239}, {"text": "問：想請問有關公安風險，貴公司去年的工安未裁罰共 11 件，請問今年的改善情形為何？對客戶的供應鏈評選影響又是如何？另外公司是否有規劃盤點部分業務？／答：洋基工程對工安要求極高，今年已將 11 件裁罰事件大幅降低到 2 件，並獲得桃園及台南政府的金安獎肯定。", "ts": "00:41:41", "who": "財務長", "seg": 243}, {"text": "問：想請問與台積同業來相比的話，洋基工程的核心差異為何？／答：洋基工程的核心差異在於系統整合能力、跨產業與地區的交付能力，以及扎實的財務實力。", "ts": "00:52:56", "who": "發言人", "seg": 305}, {"text": "問：想請問可以再描述一下 3Q26 毛利率下降的原因？未來一季跟明後年的毛利率是怎麼看呢？另外請教 9 月底接到的百億大單是什麼產業？ 10 月底在手訂單的產業比重大概是如何？／答：3Q 毛利率略降是正常專案組合變動，毛利率維持在穩定區間；9月底百億大單是半導體產業，10月底在手訂單約 7% 集中在半導體與記憶體產業，5% 集中在 PCB 產業。", "ts": "00:56:06", "who": "董事長", "seg": 323}]}], "quotes": []}, {"key": "3260_2026-11-06", "code": "3260", "name": "威剛", "date": "2026-11-06", "segs": [{"i": 0, "ts": "00:10", "sec": 10, "who": "主持人", "role": "主持人", "text": "各位投資先進下午好，歡迎參加凱基舉辦威剛科技的第三季線上法人說明會。今天主講的長官是林旻慧資深經理。那我們首先請林資深經理跟各位分享一下近期的營運概況，麻煩您。"}, {"i": 1, "ts": "00:28", "sec": 28, "who": "林旻慧", "role": "公司", "text": "各位投資先進，然後各位媒體朋友大家午安。非常歡迎大家參加今天威剛科技的線上法人說明會。那今天的會議流程當中呢，還是會跟各位先簡單做一下介紹，就是包括威剛科技還有我們第三季的財務資訊財務報告，那最後就會進到QA的時間。如果各位投資先進有任何的問題的話，可以在QA的時候歡迎隨時提出。在會議開始之前，還是提醒大家就是免責聲明，那以上的內容請大家參閱。"}, {"i": 2, "ts": "01:10", "sec": 70, "who": "林旻慧", "role": "公司", "text": "在這邊先簡單為各位做一下威剛的說明。威剛今年是已經成立第26年，那我們在2004年的時候掛牌。目前在全球約有2,000多名的員工，目前是全球第二大的記憶體模組還有SSD自有品牌的模組廠。同時我們在全球總共有超過110個以上的業務據點，銷售至110個國家與區域。另外在全球有13個地區的公司，分別是在五大洲都有我們的業務代表。同時我們在全球有5個營運的工廠，這5個工廠分別是在新北市、蘇州，在巴西、南美洲有2個營運工廠，在印度我們在2023年的時候也成立了我們第5個工廠。這5個工廠分別都有生產我們旗下包括我們在販售的DRAM模組、SSD、記憶卡、隨身碟，以及我們一些其他的周邊，甚至在手機上會應用到的例如說相關的記憶體，還有我們的車用等等的產品都有。"}, {"i": 3, "ts": "02:30", "sec": 150, "who": "林旻慧", "role": "公司", "text": "威剛是屬於在記憶體供應鏈的中游，那我們的上游包括了全球的記憶體供應商，如各位所熟知的包括韓系、美國、日本，以及中國大陸，以及台灣，這些有生產記憶體的原廠都是我們的供應鏈夥伴。在我們的下游包括了全球十大PC夥伴，除了蘋果之外其實都是我們的客戶。另外在一般的通路我們也有我們的自有品牌，就是ADATA的這個品牌在全球的通路銷售。另外在一般我們所謂的工業或是工控領域，例如說車用、工業電腦、網通等等的，我們也有經營工控相關的客戶群。"}, {"i": 4, "ts": "03:26", "sec": 206, "who": "林旻慧", "role": "公司", "text": "以上是簡單的威剛的公司說明。接下來會進入到第三季的財務資訊的報告。在報告第三季的財務資訊之前，先帶大家看一下過去幾個季度記憶體的合約價的走勢。首先這個是DRAM的合約價，我們可以看到其實在過去幾個季度，DRAM的合約價都是呈現非常強勁的走升的態勢。依照現在市場上的研調機構所提供的，第四季的合約價依舊是向上走升的幅度。另外在NAND Flash的合約價的部分，也可以看到過去幾個季度它的走勢非常的強，進入到了第四季依舊是上升的走勢。"}, {"i": 5, "ts": "04:23", "sec": 263, "who": "林旻慧", "role": "公司", "text": "在看完過去幾個季度的合約價之後，先跟各位報告我們在第三季的獲利，不管是營收、獲利都是在創歷史新高。包括我們的營業利益、稅後淨利跟EPS都是寫下一個新的里程碑。我們在第三季的營收達到530億元，季增了將近快40%；我們的營業利益是153億元，季增20%；在稅後淨利的部分是達到129億元；EPS是38.69元。"}, {"i": 6, "ts": "05:01", "sec": 301, "who": "林旻慧", "role": "公司", "text": "所以在今年的前三季，我們在各項的財務指標也都創下了歷史新高的新紀錄。包括我們在前三季的營收已經達到1,172億元，營業利益已經突破400億元是404億元，稅後淨利是336億元，前三季的每股盈餘是101.47元。而且我們在今年前三季的稅後淨利336億元，已經超越了公司過去成立25年以來的獲利總和。這也是為什麼我們剛剛強調今年前三季的獲利其實為公司寫下了一個新的里程碑。"}, {"i": 7, "ts": "05:46", "sec": 346, "who": "林旻慧", "role": "公司", "text": "這邊提供給大家的是第三季的合併損益表。我們可以看到第三季的毛利率是35.88%，營業利益是28.9%。在前三季的部分，我們平均的毛利率是42.32%，營業利益率是34.43%。"}, {"i": 8, "ts": "06:10", "sec": 370, "who": "林旻慧", "role": "公司", "text": "接下來是第三季的資產負債表。在存貨的部分，我們第三季底的存貨是549.5億元，照第二季還有持續上升的趨勢。在第三季的產品組合方面，如果用品項來看的話，DRAM目前還是公司的第一大營收來源，佔第三季的比重是73%；SSD的話佔比是22%；其他包括記憶卡、隨身碟、外接式硬碟還有其他周邊產品，分別佔比大約就是1到3%左右。如果以地區別來看的話，目前亞洲佔我們的營收比重是59%，美洲地區的話是31%，歐洲地區是6%，其他部分是4%。"}, {"i": 9, "ts": "07:12", "sec": 432, "who": "林旻慧", "role": "公司", "text": "以上就是威剛科技簡單的公司簡介，以及我們第三季還有前三季的財務營運狀況跟各位報告。接下來開放給大家QA的時間，也麻煩凱基證券這邊幫我們主持。歡迎所有的投資先進有任何問題都可以在線上提出，謝謝。"}, {"i": 10, "ts": "07:36", "sec": 456, "who": "主持人", "role": "主持人", "text": "好，謝謝。那我們接下來就進入QA的部分。各位投資先進有問題可以直接提出來，或者是將您的問題寫在聊天室。在會議之前有收集到幾個投資先進的問題，那我這邊先做提出。各位投資先進有問題的話也可以現在把握時間寫在聊天室。首先第一個問題是想請教一下對於毛利率底部的想法。如果DRAM跟NAND的價格幅度趨於平緩的話，毛利率是否可以回到2025年上半年起漲前的水準？"}, {"i": 11, "ts": "08:24", "sec": 504, "who": "林旻慧", "role": "公司", "text": "謝謝投資先進先提問的這一題。對於毛利率的看法，其實我可以先帶大家回顧一下，在價格起漲的那個時間點的時候，那個時候的DRAM跟NAND Flash價格大概的走勢情況。在這一波記憶體的整個供需結構性的變化之前，其實我們可以看到2024年的第四季跟2025年的第一季，這兩個季度DRAM跟NAND Flash的價格其實都是向下的趨勢。以DRAM來說的話，2024年第四季跟2025年第一季，單季大概都是跌可能大概是10%左右。NAND Flash的話其實在這兩個季度大概也都是下跌20%左右。"}, {"i": 12, "ts": "09:18", "sec": 558, "who": "林旻慧", "role": "公司", "text": "所以如果用那個時候的時間點來看的話，其實接下來包括現在今年的第四季跟未來的明年2027年，其實我們現在對於市場的看法都還是非常的正向。所謂正向就是我們覺得DRAM還是維持全年缺貨的趨勢，而且2027年缺貨的情況會比今年更為嚴重，就是這個缺口會更大。那價格的走勢還是非常穩定向上的，沒有任何會例如說不漲或者是轉跌的這個方向。所以相較於剛剛提到2024年的第四季跟2025年的第一季，其實這個態勢是完全不同的。那個時間點其實DRAM跟NAND兩個都是往下走的。"}, {"i": 13, "ts": "10:11", "sec": 611, "who": "林旻慧", "role": "公司", "text": "接下來的這幾個季度，剛剛提到DRAM我們覺得它還是非常的強勢，價格還是繼續往上。NAND Flash這邊一樣，可能即便它的漲幅比較趨於平緩，但是它還是非常的正向。所以我覺得至少在短期甚至2027年，毛利率是不是回到起漲前這個水準，我覺得這個是不需要擔心的。因為現在記憶體的市況跟那個時候差非常的多，價格走勢也完全不同，所以是不至於回到像起漲前的這個水準，這個是提供給大家參考的方向。"}, {"i": 14, "ts": "10:59", "sec": 659, "who": "主持人", "role": "主持人", "text": "好，謝謝。那第二個問題是想請教目前供貨顆粒中，DRAM跟NAND Flash來自於中國廠商的比例大概是多少？那明年這個比例又會如何的變化？那明年來自於中國廠商採購顆粒並銷往國外的比例是否會提升？伺服器的產品會有這樣的機會嗎？"}, {"i": 15, "ts": "11:24", "sec": 684, "who": "林旻慧", "role": "公司", "text": "我們目前中國大陸這邊的兩家記憶體供應商，就是長江存儲跟長鑫，這兩家都是我們的供應商之一。我們主要向他們採購的顆粒製成的產品，也是銷售在中國大陸。所以明年跟他們採購的比例會不會有什麼變化，我們目前其實像這兩家採購的比例佔我們的供應當中可能都還是10%以內。因為也主要就是銷售在中國大陸，所以這個完全就是取決於我們在中國大陸的營運規模。以目前的規劃我覺得應該是不至於有很大的變化，但就是要看我們在中國大陸營運的發展。所以佔我們整體的採購比重也沒有到非常的高。那是否會有銷往國外的比例是否會提升，因為目前我們是沒有銷往其他的區域或國家，所以目前可能也沒有這樣子的計劃。伺服器方面的產品，我們目前採用他們的都是以消費型的產品為主，不管是DRAM或NAND都是用在生產消費性的產品，所以這個目前應該也沒有辦法回答您。我們現在採購主要還是用在消費性的SSD跟DRAM module為主。"}, {"i": 16, "ts": "12:56", "sec": 776, "who": "主持人", "role": "主持人", "text": "謝謝。那第三個問題是想請教能否分享公司往企業級產品發展的策略？那是否有明後年預計達到伺服器營收比例的目標？"}, {"i": 17, "ts": "13:10", "sec": 790, "who": "林旻慧", "role": "公司", "text": "我們在企業級的產品，我們是從去年推出了一個品牌叫TRUSTA，主要就是在主打企業級應用的不管是DRAM或是eSSD。這個品牌目前在今年第四季有少量的開始出貨了，而且也通過很多大型客戶的送樣認證。目前是希望在明年能夠逐步的提高它出貨的比重。明年的目標來說的話，希望能夠達到佔我們整體營收可能高個位數的比例，這個是我們目前對於TRUSTA這個品牌在明年的營運的目標。"}, {"i": 18, "ts": "14:01", "sec": 841, "who": "林旻慧", "role": "公司", "text": "在策略方面，其實主要就是希望能夠拓展包括像現在很多的企業或者是國家，他們都希望發展小型的例如說資料中心或者是所謂的主權AI。這一些客戶他們其實可能對於上游原廠來說，可能是比較小規模的客戶，所以可能在備貨上或取貨上可能沒有這麼的容易。那這個也是我們在發展企業級產品的一個優勢，就是我們有非常充足而且穩定的貨源，能夠提供這一些客人這樣子的資源。同時間我們在全球有如剛剛前面在公司簡介裡面有提到的，我們在全球有5個區域都有製造的廠，所以也能夠滿足各個不同國家或不同區域的客戶的需求。"}, {"i": 19, "ts": "15:00", "sec": 900, "who": "林旻慧", "role": "公司", "text": "我覺得這兩個應該都是我們在發展這些企業級產品上很大的優勢。不管是貨源或是生產基地都能夠有多元化的發展，然後再加上我們長期在記憶體供應鏈深耕的優勢，相對於一些比較二線的客人，或者他們可能在採購上比較沒有那麼有優勢的客人上，我們能夠提供比較足夠的資源去讓他們發展他們需要的產品的應用。"}, {"i": 20, "ts": "15:35", "sec": 935, "who": "主持人", "role": "主持人", "text": "第四個問題是想跟公司請教如何看待明年NAND市場伺服器與非伺服器產品漲幅的差異？"}, {"i": 21, "ts": "15:45", "sec": 945, "who": "林旻慧", "role": "公司", "text": "在NAND的市場的話，其實我們現在可以看到的是，eSSD的需求確實是非常的強勁。但是因為這一塊的市場絕大多數還是掌握在上游原廠這些供應商的手上，所以這一塊的價格我們可能比較難去評斷說它未來明年的漲幅。但是這邊可以提供給大家參考的就是，我們現在看到整個產業的趨勢它確實是一個賣方市場。在供應上，絕大多數的產能其實都被例如說大型的CSP廠所包下了。所以未來的一年，其實不管是DRAM或是NAND，應該在這些產品上的價格其實是不用擔心的，依舊可以維持非常高檔跟高水準的價位，也沒有任何價格會大幅走跌的跡象。我覺得這個是大家在未來記憶體市場上可以很放心的一件事情。但是如果要分別講他們的產品漲幅的話，這個可能就真的取決於不同的供應商還有不同的客戶類型，可能會有不同的狀況，這個我們沒有辦法一一的評論。但是我覺得整體的市場資訊是可以提供給大家參考的。"}, {"i": 22, "ts": "17:30", "sec": 1050, "who": "主持人", "role": "主持人", "text": "那以上是預先收集的問題。線上的投資先進跟媒體朋友如果有問題的話，也歡迎提出來做交流。"}, {"i": 23, "ts": "18:26", "sec": 1106, "who": "主持人", "role": "主持人", "text": "好，如果線上的投資先進跟媒體朋友沒有新增的……現在聊天室有新增兩個問題。第一個問題是想請教對於第四季營運的看法。"}, {"i": 24, "ts": "18:41", "sec": 1121, "who": "林旻慧", "role": "公司", "text": "好，謝謝。順便跟大家公告一下，我們今天下午也正好公告了我們10月份的營收。我們10月份的營收月增大概是8.5%，是170.6億元；相較去年同期增加了28.2%左右。這個是我們今天下午剛公告的10月份的營收。順便帶到媒體問到的第四季營運的表現。以目前來看的話，因為我們沒有做財測，所以可能只能給大家一個初步簡單的方向。那目前的營運規劃來看的話，第四季的營收表現可能會相較於第三季稍微有一些調整，可能會略減一些。主要就是可能在年底的時候，例如說12月的時候會是比較多客戶的年底庫存的結算，相對來說可能在備貨上會比較保守一點。所以我們目前內部的看法是估第四季的營運可能會相較於第三季會稍微減少一些些這樣子。這個是目前對第四季營運初步的看法。"}, {"i": 25, "ts": "20:14", "sec": 1214, "who": "主持人", "role": "主持人", "text": "還有一個問題是請教美國期中選舉之後對於AI建設政策的改變，是否會影響記憶體的展望？"}, {"i": 26, "ts": "20:25", "sec": 1225, "who": "林旻慧", "role": "公司", "text": "好，謝謝。目前的話，因為其實現在大家看到的一些AI建設其實很多都已經是正在進行當中的，所以我們是覺得這個部分的話可能短期內還不會有太大的改變。但是可能在某一些的區域或是州，可能在未來的策略上做調整的時候，可能會影響到這些大型的AI公司或是CSP廠他們在未來的規劃。這個部分的話，我們覺得可能會影響到的是他們可能不會在……可能會影響到他們在美國當地的未來的投資，可是並不會影響到他們在全球性的投資。也就是說接下來他們可能反而會把這一些原本規劃在美國的投資轉往到其他海外的地區，可能也許是東南亞之類的。這個目前是我們對於在AI建設上，如果說他們真的有受到美國當地政府的影響的話，可能會往海外移動。但是我們覺得他們在全球的AI投資上是不會放慢腳步的，對。"}, {"i": 27, "ts": "21:49", "sec": 1309, "who": "主持人", "role": "主持人", "text": "目前聊天室的問題已回答到這裡。那我們接下來看還有沒有投資先進有問題要提出來的。"}, {"i": 28, "ts": "22:27", "sec": 1347, "who": "主持人", "role": "主持人", "text": "好，那如果線上的投資先進跟媒體朋友沒有新增的問題的話，那我們今天威剛科技的第三季線上法人說明會就先進行到這裡。那我們再次謝謝各位的參與，也謝謝林旻慧資深經理，謝謝。"}, {"i": 29, "ts": "22:45", "sec": 1365, "who": "林旻慧", "role": "公司", "text": "好，謝謝大家。那如果大家有任何問題，或者是之後有任何交流的需求的話，都歡迎跟凱基證券聯絡或是請我們再做安排，謝謝大家。"}, {"i": 30, "ts": "22:57", "sec": 1377, "who": "主持人", "role": "主持人", "text": "謝謝，謝謝。"}], "qa": null, "chars": 5068, "last_min": 23, "cpm": 221, "status": "full", "memo": [{"title": "亮點", "points": [{"text": "2026Q3營收、營業利益、稅後淨利與EPS皆創歷史新高，前三季累計獲利超越過去25年總和", "ts": "04:28", "who": "發言人", "seg": 5}, {"text": "前三季累計營收達1,172億元、稅後淨利336億元，EPS高達101.47元", "ts": "05:10", "who": "發言人", "seg": 6}]}, {"title": "營收", "points": [{"text": "2026Q3單季營收達530億元，季增近40%", "ts": "04:41", "who": "發言人", "seg": 5}, {"text": "剛公告10月營收170.6億元，月增約8.5%、年增約28.2%", "ts": "18:52", "who": "發言人", "seg": 24}, {"text": "從產品營收比重來看，2026Q3 DRAM佔73%、SSD佔22%、其他周邊佔1~3%", "ts": "06:35", "who": "發言人", "seg": 8}, {"text": "以地區營收比重來看，亞洲佔59%、美洲佔31%、歐洲佔6%、其他佔4%", "ts": "06:59", "who": "發言人", "seg": 8}]}, {"title": "毛利與獲利", "points": [{"text": "2026Q3單季營業利益153億元（季增20%）、稅後淨利129億元，單季EPS 38.69元", "ts": "04:47", "who": "發言人", "seg": 5}, {"text": "2026Q3單季毛利率35.88%，營業利益率28.9%", "ts": "05:52", "who": "發言人", "seg": 7}, {"text": "前三季平均毛利率42.32%，營業利益率34.43%", "ts": "06:01", "who": "發言人", "seg": 7}]}, {"title": "營運指引", "points": [{"text": "2026Q4因12月客戶年終盤點備貨偏保守，預期營收相較第三季略減", "ts": "19:30", "who": "發言人", "seg": 24}]}, {"title": "產品與技術", "points": [{"text": "針對企業級市場推出品牌TRUSTA，主打企業級DRAM與eSSD，2026Q4已少量出貨並通過大客戶驗證", "ts": "13:16", "who": "發言人", "seg": 17}, {"text": "TRUSTA企業級品牌目標在2027年營收比重達到高個位數（high single digit）水準", "ts": "13:46", "who": "發言人", "seg": 17}]}, {"title": "產業與競爭", "points": [{"text": "預期DRAM維持全年缺貨趨勢，2027年缺口將比2026年更為嚴重，價格走勢穩定向上", "ts": "09:33", "who": "發言人", "seg": 12}, {"text": "NAND Flash在eSSD需求強勁帶動下呈現賣方市場，主要原廠產能多被大型CSP包下，價格維持高檔", "ts": "16:21", "who": "發言人", "seg": 21}]}, {"title": "Q&A", "points": [{"text": "問：若DRAM與NAND漲幅趨緩，毛利率是否會跌回起漲前水準？／答：目前市況與結構和起漲前完全不同，DRAM維持缺貨，不至於跌回起漲前水準。", "ts": "08:25", "who": "發言人", "seg": 11}, {"text": "問：中國供應商採購佔比及銷往海外比例？／答：向長江存儲與長鑫存儲採購比重在10%以內，製成產品全數在中國銷售，暫無銷往國外或用於伺服器的規劃。", "ts": "11:24", "who": "發言人", "seg": 15}, {"text": "問：企業級產品策略與伺服器營收目標？／答：推廣TRUSTA品牌切入中小型企業與主權AI資料中心，具充足貨源與全球五大廠區優勢，2027年營收佔比目標為高個位數。", "ts": "13:11", "who": "發言人", "seg": 17}, {"text": "問：2027年NAND伺服器與非伺服器產品漲幅差異？／答：eSSD需求強勁且產能被CSP大廠包下，整體呈現賣方市場，產品價格具高度支撐。", "ts": "15:46", "who": "發言人", "seg": 21}, {"text": "問：2026Q4營運看法？／答：10月營收170.6億元月增8.5%，Q4受12月客戶庫存結算影響備貨轉保守，預估Q4營收較Q3略微減少。", "ts": "18:42", "who": "發言人", "seg": 24}, {"text": "問：美國期中選舉後AI政策若改變是否影響記憶體展望？／答：全球AI投資不會放慢，若美國本土投資受影響，資金也僅是轉往東南亞等海外地區佈建。", "ts": "20:25", "who": "發言人", "seg": 26}]}], "quotes": []}, {"key": "2451_2026-11-06", "code": "2451", "name": "創見", "date": "2026-11-06", "segs": [{"i": 0, "ts": "00:00:02", "sec": 2, "who": "司儀", "role": "主持人", "text": "創見資訊股份有限公司法人說明會正式開始。首先為各位介紹創見資訊今日與會的經營團隊：董事長束崇萬董事長、總經理張中凱張總經理、財務長紀文慧紀財務長。接下來是公司簡報時間，我們請張總經理就公司產品及營運概況為各位簡報，有請張總經理。"}, {"i": 1, "ts": "00:01:00", "sec": 60, "who": "總經理", "role": "公司", "text": "各位投資先進、法人代表大家好，各位午安。首先感謝各位前來參加創見資訊法人說明會。近年來由於AI快速的發展，為整個產業帶來新一波的機會與挑戰。創見除了繼續鞏固現有產品與市場的優勢以外，我們也會持續開發企業級的儲存、工業級的應用，以及Edge AI相關的新興市場。今天我會先從公司整體的營運佈局開始，向各位報告公司的核心競爭力以及未來發展方向，希望各位對創見長期成長的一個策略有更深入的了解。"}, {"i": 2, "ts": "00:02:20", "sec": 140, "who": "總經理", "role": "公司", "text": "首先很快介紹一下創見資訊。公司是成立於1989年，我們是以台灣為研發與製造中心，目前全球設有12個營運據點，全公司總人數超過1100人。產品方面我們提供超過2000項不同的產品，並擁有超過140項的專利，涵蓋了消費性以及工業用、嵌入式相關的產品。我們希望透過這樣的全球佈局，還有持續的研發投入，提供客戶最完整、可靠的產品與服務。"}, {"i": 3, "ts": "00:02:57", "sec": 177, "who": "總經理", "role": "公司", "text": "在全球我們現在設有12個營運據點，涵蓋了美洲、歐洲以及亞洲的主要市場。我們希望透過這樣的全球佈局，以台灣為研發製造中心，同時配合各地的業務與技術團隊，提供客戶最即時與在地化的服務。我們希望可以同時針對一些特定的營運據點，我們也設有倉庫，這樣可以提升我們全球的交貨以及物流能力，增加國際的競爭力。"}, {"i": 4, "ts": "00:03:37", "sec": 217, "who": "總經理", "role": "公司", "text": "在品牌經營還有企業永續發展方面，我們也持續提升品牌的價值。在品牌經營方面，創見已經連續19年獲得Interbrand台灣國際品牌認證的認可。在2025年整體的品牌價值已經超過了9900萬美金。這不但反映出創見長期深耕國際市場的結果，同時也反映出客戶對於創見品質、產品設計還有國際競爭力的認可。在企業永續方面，創見在2023年入選台灣永續指數，這也是彰顯了創見在ESG以及公司治理方面的持續投入。"}, {"i": 5, "ts": "00:04:36", "sec": 276, "who": "總經理", "role": "公司", "text": "另一方面董事長束崇萬先生也再度獲選哈佛商業評論台灣企業領袖100強。這項評選主要是透過長期財務績效以及ESG的表現，其中又特別著重股東報酬以及企業價值的成長。這個肯定除了印證了創見長期穩健經營的理念，同時也彰顯創見不斷創造股東價值以及永續經營的理念。"}, {"i": 6, "ts": "00:05:10", "sec": 310, "who": "總經理", "role": "公司", "text": "除了董事長個人獲得肯定以外，創見也在2026年入選外資精選台灣企業100強。這項評鑑主要是以企業在市場上的經營成果、營收與獲利的成長，還有企業治理等方面進行綜合性的評估。這也再次彰顯了創見在國際市場的經營，維持穩健的財務體質以及維持公司核心競爭力的成果。"}, {"i": 7, "ts": "00:05:44", "sec": 344, "who": "總經理", "role": "公司", "text": "在全球供應鏈的佈局方面，我們持續加強國際的營運能力。創見也是首家在台灣獲得AEO認證的模組大廠。通過這項認證也代表我們在進出口管控還有供應鏈安全已經達到了國際化的水準。另一方面我們也在主要市場諸如美國、韓國、日本享有快速驗證與通關的便利服務，進一步縮短了整體物流的時間，增進整體營運的效率。在全球市場貿易環境多變及關稅政策不確定下，這項認證也可以增加創見在整體供應鏈管理的韌性。"}, {"i": 8, "ts": "00:06:45", "sec": 405, "who": "總經理", "role": "公司", "text": "我們創見是一個百分之百台灣製造研發的台灣模組廠。目前我們有15條高速SMT線，工廠的面積大概是35,000平方公尺，大概是11,000坪，月產能大概是1000萬片。這個產線是高度自動化，我們也同時不斷引進最新的技術與設備，同時我們也導入AI，提供即時的監控與反饋，進而提升整體產能利用率還有產品良率。"}, {"i": 9, "ts": "00:07:21", "sec": 441, "who": "總經理", "role": "公司", "text": "創見也持續進行產品研發，不斷投入研發與產品設計。另一方面透過台灣精品獎的肯定，展現出我們在技術創新、產品品質以及國際競爭力的成果。我想這個肯定不只是對我們產品創新的肯定，另一方面也是可以說明客戶對於整個創見產品品質的信任。藉由這個肯定可以加強在國際市場上的能見度，加速品牌的推廣。"}, {"i": 10, "ts": "00:08:03", "sec": 483, "who": "總經理", "role": "公司", "text": "多年以來創見持續採取多元產品設計的佈局。目前我們提供了超過2000款不同的產品，涵蓋了消費性以及工業用、嵌入式的產品。在嵌入式解決方案，這類市場和客戶多半都比較在乎產品的穩定性、可靠度，還有穩定的供貨以及售後服務，所以這也有助於創見可以培養更穩定與長期的客戶關係。在消費型產品我們持續推出符合數位生活、商業辦公等產品。我們希望透過這樣雙軌並行的產品策略，增加市場覆蓋度，同時減低市場單一化所帶來的風險。"}, {"i": 11, "ts": "00:09:06", "sec": 546, "who": "總經理", "role": "公司", "text": "當然現階段我們也是聚焦AI應用研發。隨著AI的發展會帶動資料中心的投資，另一方面也加速了整個工業自動化、Edge AI等相關的應用。對創見來說這是新興可以成長的市場，所以我們會從三個方向來切入：第一個是高速大容量的DDR5記憶體模組；第二是AI視覺攝影模組；第三是高可靠度、高容量、高效能的SSD模組。這三類產品都可以廣泛應用在Edge AI、AI Server或者是工業用電腦的各種應用場景。"}, {"i": 12, "ts": "00:10:13", "sec": 613, "who": "總經理", "role": "公司", "text": "除了AI與Edge AI的發展，創見也持續在各種不同領域開發嵌入式的應用。現階段其實這方面的市場客戶更在乎的是穩定的交貨、產品的穩定性可靠度，以及售後服務與技術支援能力。所以創見不但在這些市場提供標準化的產品或客製化的服務，我們更追求的是在客戶設計的初期就導入我們的產品，增加客戶的黏著度，培養長期的關係，創造雙贏局面。"}, {"i": 13, "ts": "00:11:00", "sec": 660, "who": "總經理", "role": "公司", "text": "在工控與嵌入式市場方面，我們會有三個主要的策略：第一個是產品組合升級，持續擴充企業級與工業產品的應用，滿足不同市場對於記憶體的穩定性、效能以及容量的需求。第二是全球在地的服務，搭配全球業務與技術團隊深入了解客戶需求，提供即時在地服務。第三是長期供貨的支持，持續加強供應鏈管理，減低因為供貨短缺造成客戶生產中斷的風險。"}, {"i": 14, "ts": "00:12:11", "sec": 731, "who": "總經理", "role": "公司", "text": "最後展望未來，我們還是很看好AI的發展，AI的發展會持續帶動整個記憶體的需求。我們會持續聚焦AI發展，掌握基礎建設所帶來的需求；另一方面持續擴充高效能記憶體與企業級儲存設備，同時深化Edge AI及Physical AI相關應用，並持續強化供應鏈管理、加強全球交付能力。把這三個面向管理好，我們都可以為公司創造更長遠成長的動能。以上。"}, {"i": 15, "ts": "00:13:11", "sec": 791, "who": "司儀", "role": "主持人", "text": "接下來我們請紀財務長就公司財務狀況為各位簡報，有請紀財務長。"}, {"i": 16, "ts": "00:13:28", "sec": 808, "who": "財務長", "role": "公司", "text": "各位投資先進大家下午好。我是財務長Karen，我這邊來跟大家報告一下這次法說會財務資訊的部分。首先先讓大家來看一下，從2025年第三季到今年第三季創見合併營收跟稅後淨利的表現。大家都知道記憶體在今年開始是一個突飛猛進的經營績效。折線圖藍色代表我們的合併營收，創見在第四季就已經突破去年一整年超過170億以上的營收了，在4月份就已經突破去年全年度的表現。第二季甚至創下单季達到188億的營收規模，稅後淨利的表現也都有極佳的獲利表現。"}, {"i": 17, "ts": "00:14:29", "sec": 869, "who": "財務長", "role": "公司", "text": "這邊先看到我們昨天有公告創見在第三季的財報表現。第三季單季季度營收是做到160億，跟去年同期相比大幅成長將近300%。跟第二季表現相比略略下滑，主要是第二季客戶有一些提前拉貨備貨的動作，但整體營收規模的成長動能都還是在。第三季單季毛利大概是91億，毛利率高達57%，獲利狀況相較同業都是蠻亮眼的表現。費用率部分維持在比較平穩的3到4個percent。第三季單季稅後淨利來到69億，單季EPS來到16.11元。"}, {"i": 18, "ts": "00:15:39", "sec": 939, "who": "財務長", "role": "公司", "text": "看到跟去年同期比較的損益狀況，營收、營業利益、稅後淨利跟去年同期相比都有大幅度的成長。累計到第三季為止的EPS是來到62.74元。再來看到資產負債表，各位比較關心的可能是存貨數字跟現金表現。創見長期以來都是維持比較低財務槓桿、低負債，加上穩定營運產生的現金流。截至第三季為止帳上現金餘額將近157億；存貨部分從去年底的52億成長到237億，營運資金流相當充足，存貨也持續跟原廠供應商維持良好合作關係積極補足庫存。負債比非常低，ROE跟ROA來到79%跟將近64%。"}, {"i": 19, "ts": "00:17:15", "sec": 1035, "who": "財務長", "role": "公司", "text": "再來看到跟同業的比較，年營收增長率創見表現超過300%，相當亮眼。毛利率目前YTD大概來到70%，淨利率表現遠遠高於同業的20%到30%，創見整體淨利率表現大概將近70%。流動比率也是相當良好，結構非常健全。"}, {"i": 20, "ts": "00:18:14", "sec": 1094, "who": "財務長", "role": "公司", "text": "再來看到產品銷售佔比狀況，截至第三季為止工控產品領域已經來到90%的佔比，涵蓋醫療、交通、智慧物聯網甚至軍事領域。細分看到地區別，特別Highlight中國區跟美洲區：中國區從去年的13%增加到18.4%，美洲區更是大幅躍進，從14.8%提升到25.3%。總結第三季單季EPS來到16.11元，YTD已經來到六十幾元。不論是營收、營業利益、稅後淨利甚至EPS成長幅度都很大。以上是我這邊關於財務資訊分析的部分，謝謝。"}, {"i": 21, "ts": "00:20:14", "sec": 1214, "who": "董事長", "role": "公司", "text": "感謝大家的參加。在座各位有沒有一些想要知道更詳細的資訊？"}, {"i": 22, "ts": "00:20:36", "sec": 1236, "who": "分析師", "role": "分析師", "text": "存貨的部分金額挺高的，不曉得存貨的平均單價是不是上升得比較快？那最近聽說美國期中選舉以後市場會有一些變化，會不會未來原料單價會往上跑？這個趨勢是不是已經確定了？"}, {"i": 23, "ts": "00:21:06", "sec": 1266, "who": "董事長", "role": "公司", "text": "我們的存貨主要就是DRAM跟Flash的顆粒。其實DRAM跟Flash顆粒在第三季，大概七八九月這個時候，價錢已經算是平穩，沒有繼續往上漲也沒有往下跌。所以我們目前庫存大部分就是第三季進貨的成本。以DRAM來講其實還是蠻緊缺的，原廠也是盡量希望把價錢穩定在現有水平上，沒有再加價錢，短期我不認為它會跌價，因為原廠還是希望維持合理獲利，也不會因為緊缺缺貨就漲價。所以我認為今年第四季的價錢會跟第三季差不多。供應商也不希望價錢有太多的變動，所以可以看到第四季DRAM跟Flash價錢會穩定在一個水平上面。當然第三季價錢比第二季、第一季都漲很多，只是到了第三季到目前第四季，價錢是比較穩定的。"}, {"i": 24, "ts": "00:23:06", "sec": 1386, "who": "分析師", "role": "分析師", "text": "可以說一下2027年的供需跟展望嗎？謝謝。"}, {"i": 25, "ts": "00:23:12", "sec": 1392, "who": "董事長", "role": "公司", "text": "現在目前除了DRAM跟Flash，其實現在非常緊缺的是PCB。我們也都只要庫存低於大概8個月，我們就開始要把PCB這個問題先解決掉。至於DRAM跟Flash，供應商一直跟我們協調明年的allocation狀況，他們的滿足率真的非常低，所以DRAM還是在非常緊缺的狀態。但Flash就比較好，大概跟我們所期望拿到的貨差不多，沒有太大差額。所以明年比較大的挑戰是怎麼樣拿到足夠的DRAM。目前來看明年上半年DRAM應該還是在非常緊缺的狀態。DDR4、DDR5都一樣，都在缺，滿足率都非常不好。"}, {"i": 26, "ts": "00:24:38", "sec": 1478, "who": "分析師", "role": "分析師", "text": "董事長我想請教一下毛利率的問題。我們看到第三季已經開始跟第二季有修正，那我想請教到Q4或者是明年逐季的話，是不是就逐季慢慢地往下，那大概會少多少？"}, {"i": 27, "ts": "00:25:01", "sec": 1501, "who": "董事長", "role": "公司", "text": "過去毛利率比較高，很大的原因就是去年DRAM大概在9月開始漲，9月以前其實都是很便宜的。對我們來講我們都一定會有一些合理的庫存，所以以DDR4來講其實都是3、4塊錢非常低的水準，一路漲到今年第三季，以2Gx8來講已經漲到50多塊錢一顆，從4塊錢漲到50多塊。在過去第一季、第二季大家可以看到很高的毛利率，最大的原因就是漲價因素我們取得的毛利率。到今年第三季基本上已經沒有什麼在漲價，我們還是有一些因為第一季、第二季的庫存，所以還是有50幾趴的毛利率。但是可以預計到今年第四季，毛利率也有可能再繼續往下調，我想大概就是5到10%的幅度，我的預估可能會再降5到10個%。我們過去在沒有漲價之前，毛利率大概在30到40之間，所以我想我們第四季或者明年第一季應該還是維持在30到40之間，這才是我們正常因為經營效率產生的獲利，而不是因為零件漲價產生的利潤。所以很務實地講，我們比較有信心的毛利率應該在30到40%之間，如果價格是穩定的狀態底下。"}, {"i": 28, "ts": "00:27:57", "sec": 1677, "who": "司儀", "role": "主持人", "text": "因為時間的關係，我們將再開放最後兩個問題。"}, {"i": 29, "ts": "00:28:13", "sec": 1693, "who": "董事長", "role": "公司", "text": "如果沒有問題的話，我們今天的法說會到此為止，謝謝各位的參加。"}, {"i": 30, "ts": "00:28:22", "sec": 1702, "who": "司儀", "role": "主持人", "text": "謝謝各位投資先進的提問，創見資訊法人說明會到此圓滿結束。非常感謝各位貴賓的蒞臨指導，期待下次再見，謝謝。"}], "qa": 22, "chars": 4683, "last_min": 28, "cpm": 165, "status": "full", "memo": [{"title": "營收", "points": [{"text": "2026年第三季單季合併營收達160億元，較去年同期大幅成長近300%。", "ts": "00:14:40", "who": "CFO", "seg": 17}, {"text": "2026年第二季創下單季營收188億元的歷史規模，第三季雖略有回落但仍處高檔。", "ts": "00:14:14", "who": "CFO", "seg": 16}, {"text": "2026年前4個月營收即突破去年全年度營收（超過170億元）。", "ts": "00:14:02", "who": "CFO", "seg": 16}]}, {"title": "毛利與獲利", "points": [{"text": "2026年第三季單季毛利約91億元，單季毛利率高達57%。", "ts": "00:15:02", "who": "CFO", "seg": 17}, {"text": "2026年第三季單季稅後淨利為69億元，單季EPS達16.11元。", "ts": "00:15:28", "who": "CFO", "seg": 17}, {"text": "2026年前三季累計EPS達62.74元，遠超去年全年水準。", "ts": "00:16:02", "who": "CFO", "seg": 18}, {"text": "前三季費用率維持在3%至4%的平穩區間；累計ROE達79%、ROA達64%。", "ts": "00:15:22", "who": "CFO", "seg": 17}]}, {"title": "營運指引", "points": [{"text": "董事長預估第四季毛利率可能較第三季下滑5%至10%，第四季或明年第一季毛利率預期維持在30%至40%區間。", "ts": "00:26:50", "who": "董事長", "seg": 27}, {"text": "第四季DRAM與Flash原料報價預計與第三季相當，維持平穩水平。", "ts": "00:22:08", "who": "董事長", "seg": 23}]}, {"title": "產能與擴產", "points": [{"text": "工廠面積約35,000平方公尺（約11,000坪），現有15條高速SMT生產線，月產能約1,000萬片。", "ts": "00:06:50", "who": "總經理", "seg": 8}, {"text": "產線高度自動化並導入AI進行即時監控與反饋，提升產能利用率與良率。", "ts": "00:07:05", "who": "總經理", "seg": 8}]}, {"title": "產品與技術", "points": [{"text": "提供超過2,000項產品，擁有逾140項專利，產品涵蓋消費性及工業用嵌入式應用。", "ts": "00:02:37", "who": "總經理", "seg": 2}, {"text": "聚焦AI發展三大方向：高速大容量DDR5模組、AI視覺攝影模組、高可靠度高效能SSD模組。", "ts": "00:09:28", "who": "總經理", "seg": 11}, {"text": "工控產品佔比已達90%，涵蓋醫療、交通、智慧物聯網及軍事領域。", "ts": "00:18:22", "who": "CFO", "seg": 20}]}, {"title": "客戶", "points": [{"text": "美洲區營收佔比自去年14.8%大幅提升至25.3%；中國區佔比自13.0%增長至18.4%。", "ts": "00:19:10", "who": "CFO", "seg": 20}]}, {"title": "股利與資本", "points": [{"text": "截至2026年第三季底，公司帳上現金餘額將近157億元，財務槓桿與負債比率維持在極低水平。", "ts": "00:16:32", "who": "CFO", "seg": 18}, {"text": "存貨金額自去年底的52億元增加至237億元，主要因應營運擴張並積極備料。", "ts": "00:16:38", "who": "CFO", "seg": 18}]}, {"title": "Q&A", "points": [{"text": "問：存貨金額偏高，存貨平均單價是否上漲？未來原料單價趨勢如何？／答：第三季DRAM與Flash報價平穩，未再大漲或大跌；原廠希望維持合理獲利，第四季報價應與第三季差不多持平。", "ts": "00:20:36", "who": "董事長", "seg": 22}, {"text": "問：2027年（明年）的供需與展望？／答：目前除了DRAM和Flash外，PCB非常緊缺，庫存低於8個月就要先解決。DRAM（DDR4/DDR5）明年上半年仍會非常緊缺，Flash供貨則相對穩定符合預期。", "ts": "00:23:06", "who": "董事長", "seg": 24}, {"text": "問：第三季毛利率已較第二季修正，第四季及明年的毛利率趨勢如何？／答：前兩季高毛利主因先前取得的低價庫存受惠於漲價。第三季起無漲價紅利，預估第四季毛利率可能再降5%至10%，合理常態毛利率預期在30%至40%區間。", "ts": "00:24:38", "who": "董事長", "seg": 26}]}], "quotes": []}, {"key": "8261_2026-11-03", "code": "8261", "name": "富鼎", "date": "2026-11-03", "segs": [{"i": 0, "ts": "00:00:00", "sec": 0, "who": "主持人", "role": "主持人", "text": "各位先生女士大家好，歡迎參加法人說明會。"}, {"i": 1, "ts": "00:00:03", "sec": 3, "who": "主持人", "role": "主持人", "text": "那今天我們公司非常榮幸邀請各位同仁來參加2026Q3的營運結果說明會。"}, {"i": 2, "ts": "00:00:07", "sec": 7, "who": "主持人", "role": "主持人", "text": "接下來為各位介紹我們公司的經營團隊，我們的總經理張嘉帥先生。"}, {"i": 3, "ts": "00:00:15", "sec": 15, "who": "主持人", "role": "主持人", "text": "以及我們的財務暨行銷處副總經理黃梅婷小姐。"}, {"i": 4, "ts": "00:00:20", "sec": 20, "who": "主持人", "role": "主持人", "text": "那首先請張嘉帥總經理為我們致詞。"}, {"i": 5, "ts": "00:00:29", "sec": 29, "who": "總經理", "role": "公司", "text": "首先我要感謝各位法人朋友跟投資先進來參加2026第三季的營運成績說明的說明會。"}, {"i": 6, "ts": "00:00:41", "sec": 41, "who": "總經理", "role": "公司", "text": "我想各位在過去幾個禮拜大概這些投資選擇的消息還是蠻震撼的。"}, {"i": 7, "ts": "00:00:49", "sec": 49, "who": "總經理", "role": "公司", "text": "一波一波AI大廠家的訊息顛覆面的一個。"}, {"i": 8, "ts": "00:00:57", "sec": 57, "who": "總經理", "role": "公司", "text": "那我們我們的判斷的想法是基本上這些大玩家過去基本上都防守很近。"}, {"i": 9, "ts": "00:01:07", "sec": 67, "who": "總經理", "role": "公司", "text": "也主這一波慢慢慢慢回歸到相對合理。"}, {"i": 10, "ts": "00:01:12", "sec": 72, "who": "總經理", "role": "公司", "text": "那另外一個現象就是說在過去一段時間看到一些包含我們的客戶在那邊。"}, {"i": 11, "ts": "00:01:19", "sec": 79, "who": "總經理", "role": "公司", "text": "基本上在去年第四季也開始慢慢看到一些AI落地的的一些慢慢在在。"}, {"i": 12, "ts": "00:01:27", "sec": 87, "who": "總經理", "role": "公司", "text": "有一些工作站或者用詞用的。"}, {"i": 13, "ts": "00:01:34", "sec": 94, "who": "總經理", "role": "公司", "text": "雖然不見得現在都都很成熟，但是這些概念的一些新的產品在慢慢浮現出來。"}, {"i": 14, "ts": "00:01:43", "sec": 103, "who": "總經理", "role": "公司", "text": "那 我們在判斷就是說這樣子AI應用的發展會賦予這樣子的公司來看。"}, {"i": 15, "ts": "00:01:53", "sec": 113, "who": "總經理", "role": "公司", "text": "就是說普通畢竟不是一個ok我們只靠的在在公司,我們也希望這樣子的互動，但那不是我們最核心的。"}, {"i": 16, "ts": "00:02:06", "sec": 126, "who": "總經理", "role": "公司", "text": "我們畢竟是一個 以這我們也加強的競爭力的導向這樣子的NB的公司的。"}, {"i": 17, "ts": "00:02:16", "sec": 136, "who": "總經理", "role": "公司", "text": "慢慢的節奏稍微慢一點，這樣我們有時間去追上這些領先的動能。"}, {"i": 18, "ts": "00:02:23", "sec": 143, "who": "總經理", "role": "公司", "text": "找它的產品，下一波的產品跟馬克單品我們就不能跟追上。"}, {"i": 19, "ts": "00:02:31", "sec": 151, "who": "總經理", "role": "公司", "text": "那甚至有一些要落地的產品，那也可以讓我有更大的機會，因為它畢竟不是拼最先進的技術。"}, {"i": 20, "ts": "00:02:41", "sec": 161, "who": "總經理", "role": "公司", "text": "那當然也有一個部分就是說在AI以外的領域來，過去我們的生意其實不是蠻產的。"}, {"i": 21, "ts": "00:02:50", "sec": 170, "who": "總經理", "role": "公司", "text": "就是說我們的一些PC的生意在第三季甚至我們的AI相關的不見最大宗的風電東西那邊主要還是賽。"}, {"i": 22, "ts": "00:03:05", "sec": 185, "who": "總經理", "role": "公司", "text": "但在這些在今年第三季甚至後面第四季都有相當的。"}, {"i": 23, "ts": "00:03:11", "sec": 191, "who": "總經理", "role": "公司", "text": "整個時間放下來事實上讓整個產業事實上有機會把資源重新配置到也許相對合理的狀況。"}, {"i": 24, "ts": "00:03:22", "sec": 202, "who": "總經理", "role": "公司", "text": "所以我們現在來看這個這個都有可能有短期的甚至中長期的可能都是一個好事。"}, {"i": 25, "ts": "00:03:31", "sec": 211, "who": "總經理", "role": "公司", "text": "那我講後面我要講我就請我們財務長就那個財務室直接跟各位報告。"}, {"i": 26, "ts": "00:03:40", "sec": 220, "who": "總經理", "role": "公司", "text": "謝謝各位。謝謝總經理，那接下來請財務長進行公司的營運報告說明。"}], "qa": null, "chars": 814, "last_min": 4, "cpm": 222, "status": "full", "memo": [{"title": "亮點", "points": [{"text": "第三季營收36.7億元，毛利率50.8%，EPS 3.84元。", "ts": "00:04:15", "who": "財務長", "seg": 26}]}, {"title": "營收", "points": [{"text": "第三季營收36.7億元，較上一季8.7%成長，比去年同期微幅增加1.6%。", "ts": "00:04:15", "who": "財務長", "seg": 26}, {"text": "預期2027年營收有機會看到市場需求復甦，毛利率預估27-3成。", "ts": "00:16:55", "who": "財務長", "seg": 26}]}, {"title": "毛利與獲利", "points": [{"text": "第三季毛利率50.8%，較上一季下滑0.3個百分點，較去年同期增加1.6個百分點。", "ts": "00:04:15", "who": "財務長", "seg": 26}, {"text": "第三季營業利益率19.01%，較去年同期6.93%顯著提升。", "ts": "00:09:00", "who": "財務長", "seg": 26}]}, {"title": "Q&A", "points": [{"text": "問：2026年Q4的營收展望為何？／答：目前看到整休狀況，主要原因在於第四季需求較弱，客戶庫存調整。", "ts": "00:15:45", "who": null, "seg": 26}]}], "quotes": []}, {"key": "6805_2026-11-03", "code": "6805", "name": "富世達", "date": "2026-11-03", "segs": [{"i": 0, "ts": "00:00:05", "sec": 5, "who": "講者", "role": "公司", "text": "各位投資先進大家安安，歡迎參加由富邦證券所主辦的富達股份有限公司法說會。"}, {"i": 1, "ts": "00:00:13", "sec": 13, "who": "講者", "role": "公司", "text": "首先為各位介紹公司出席經營團隊，歡迎徐安次總經理、邱志裕財務長以及游宣代理發言人。"}, {"i": 2, "ts": "00:00:25", "sec": 25, "who": "講者", "role": "公司", "text": "那今天法說議程將會有公司經營團隊進行公司狀況以及未來展望的簡報，再進行回復Q&A交流。"}, {"i": 3, "ts": "00:00:32", "sec": 32, "who": "講者", "role": "公司", "text": "那我就先將時間交給公司經營團隊，謝謝。"}, {"i": 4, "ts": "00:00:45", "sec": 45, "who": "Jerry", "role": "公司", "text": "各位下午好，那我是Jerry。"}, {"i": 5, "ts": "00:00:49", "sec": 49, "who": "Jerry", "role": "公司", "text": "那我先跟大家報告我們2026年第三季的營運的概況。"}, {"i": 6, "ts": "00:00:56", "sec": 56, "who": "Jerry", "role": "公司", "text": "那我们在报告前还是先说明一下，上面的资讯就是供大家参考，那没有任何的投资建议。"}, {"i": 7, "ts": "00:01:09", "sec": 69, "who": "Jerry", "role": "公司", "text": "那请大家就是就是参考就好。"}, {"i": 8, "ts": "00:01:13", "sec": 73, "who": "Jerry", "role": "公司", "text": "那，我先来报告综合损益表。"}, {"i": 9, "ts": "00:01:18", "sec": 78, "who": "Jerry", "role": "公司", "text": "公司在2026年前三季的营收为124.25亿，那相较于2025年前三季的84.38亿增长了39.87%，那YoY是47.25%。"}, {"i": 10, "ts": "00:01:36", "sec": 96, "who": "Jerry", "role": "公司", "text": "那营业毛利为43.37亿，那相较于去年同期的21.15亿增长了22.22亿，那YoY是105.06%。"}, {"i": 11, "ts": "00:01:49", "sec": 109, "who": "Jerry", "role": "公司", "text": "那累计毛利率为34.9%，那相较于去年同期25.07%的话是增长了接近了10个百分点。"}, {"i": 12, "ts": "00:02:00", "sec": 120, "who": "Jerry", "role": "公司", "text": "那主要的增长是因为我们在今年的产品组合，伺服器已经累计已经有到60几%，那相较于去年同期只有37%是增长，就是产品组合优化下，所以毛利率增长。"}, {"i": 13, "ts": "00:02:18", "sec": 138, "who": "Jerry", "role": "公司", "text": "那营业费用为7.13亿，那相较于去年同期成长2.53亿，那主要是研发费用的支出增加。"}, {"i": 14, "ts": "00:02:28", "sec": 148, "who": "Jerry", "role": "公司", "text": "那我们就是持续在投入招募招募人才以及投入新的专案，所以研发费用是持续增加。"}, {"i": 15, "ts": "00:02:38", "sec": 158, "who": "Jerry", "role": "公司", "text": "那本期净利的话是30.08亿，相较于去年同期增加了16.34亿，那YoY是118.92%。"}, {"i": 16, "ts": "00:02:50", "sec": 170, "who": "Jerry", "role": "公司", "text": "那EPS为43.88元，那相较于去年同期的20.04元增长了23.84元。"}, {"i": 17, "ts": "00:03:01", "sec": 181, "who": "Jerry", "role": "公司", "text": "那我们在2026年第三季单季的表现状况是单季的营业收入是45.02亿，相较于第二季的37.4亿QoQ增长了20%，那跟去年同期比的话YoY是增长26.25%。"}, {"i": 18, "ts": "00:03:20", "sec": 200, "who": "Jerry", "role": "公司",
