seg": 8}]}]}, {"key": "5269_2026-11-10", "code": "5269", "name": "祥碩", "date": "2026-11-10", "segs": [{"i": 0, "ts": "00:00:00", "sec": 0, "who": "主持人", "role": "主持人", "text": "各位午安，歡迎參加祥碩科技2026年第三季的營運說明會。"}, {"i": 1, "ts": "00:00:06", "sec": 6, "who": "主持人", "role": "主持人", "text": "本次會議由公司總經理暨發言人林哲偉先生主講。"}, {"i": 2, "ts": "00:00:42", "sec": 42, "who": "發言人", "role": "公司", "text": "第三季的財務數字，第三季營業收入為新台幣26.6億元，較上季減少2%，較去年同期減少33%。"}, {"i": 3, "ts": "00:00:54", "sec": 54, "who": "發言人", "role": "公司", "text": "營業毛利，本季為新台幣13.73億元，較上季增加0.3%，較去年同期減少32.5%。"}, {"i": 4, "ts": "00:01:06", "sec": 66, "who": "發言人", "role": "公司", "text": "營業毛利率率，本季為51.6%，較上季增加1.3個百分點，較去年同期增加0.6個百分點。"}, {"i": 5, "ts": "00:24:13", "sec": 1453, "who": "分析師", "role": "分析師", "text": "請問今年第三季的營收表現與產品組合為何？各產品線表現如何？"}, {"i": 6, "ts": "00:24:25", "sec": 1465, "who": "總經理林哲偉", "role": "公司", "text": "第三季host主控端產品佔整體營收74%，device裝置端產品佔5%，車用產品佔21%。"}], "qa": 5, "chars": 256, "last_min": 24, "cpm": 10, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "第三季營業收入為新台幣26.6億元，較上季減少2%，較去年同期減少33%。", "ts": "00:00:44", "who": "發言人", "seg": 2}]}, {"title": "毛利與獲利", "points": [{"text": "本季營業毛利為新台幣13.73億元，營業毛利率為51.6%。", "ts": "00:00:54", "who": "發言人", "seg": 3}]}, {"title": "Q&A", "points": [{"text": "問：請問今年第三季的營收表現與產品組合為何？各產品線表現如何？／答：第三季host主控端產品佔整體營收74%，device裝置端產品佔5%，車用產品佔21%。", "ts": "00:24:13", "who": "分析師/總經理林哲偉", "seg": 5}]}], "quotes": [{"report": "2026-11-11", "quotes": [{"cat": "本季實績", "text": "營業毛利，本季為新台幣13.73億元，較上季增加0.3%，較去年同期減少32.5%。", "anchor": "00:00:54", "who": "發言人", "seg": 3}, {"cat": "本季實績", "text": "營業毛利率率，本季為51.6%，較上季增加1.3個百分點，較去年同期增加0.6個百分點。", "anchor": "00:01:06", "who": "發言人", "seg": 4}]}]}, {"key": "3090_2026-11-10", "code": "3090", "name": "日電貿", "date": "2026-11-10", "segs": [{"i": 0, "ts": "00:00", "sec": 0, "who": "主持人", "role": "主持人", "text": "各位投資先進，大家午安。歡迎各位參加今日日電貿的說明會。首先介紹今天出席的長官：第一位是我們的余耀國總經理，第二位是我們的簡明毅副總經理，接下來是我們的蘇士昌資深協理，接下來是呂博毅資深協理，以及我們張曉鳳特別助理，接下來是我們的許淑惠協理，以及我們的王采苓經理。接下來我們把時間交給王采苓經理，謝謝。"}, {"i": 1, "ts": "01:20", "sec": 80, "who": "王采苓", "role": "公司", "text": "今天很歡迎各位法人先進來參加日電貿的法說會。今天的法說會，前面會先由我簡單介紹公司的基本資料，後面再請我們蘇協理來介紹我們市場跟產品的一些比例。日電貿公司成立於1993年1月4號，至今是邁入第34年。公司的資本額目前股本是28.7億。截至9月底，目前員工人數是418人。"}, {"i": 2, "ts": "02:35", "sec": 155, "who": "王采苓", "role": "公司", "text": "日電貿公司的總部是在新北市的新店，在大陸地區我們現在有蘇州、武漢、深圳跟香港，在東南亞和印度也都有營運據點。日電貿代理全球許多頂尖的品牌，在MLCC的部分有三星、Kyocera、KEMET還有信昌電。固態電容的部分有佳美工、Panasonic、KEMET、Kyocera跟AICTEK。"}, {"i": 3, "ts": "03:50", "sec": 230, "who": "王采苓", "role": "公司", "text": "2026年第三季的綜合損益表。2026年第三季的營收是58.6億元，相較於第二季51.5億元是增加了13%，與去年同期也是增加了44%。毛利率的部分，2026年第三季毛利率21%，第二季18%，也是相較於第二季是增加的。營業利益率也從第二季的11%提高到第三季的14%。"}, {"i": 4, "ts": "05:18", "sec": 318, "who": "王采苓", "role": "公司", "text": "2026年前三季的損益表。2026年前三季的營收是155億元，相較於去年同期的119億元是增加了30%。營業利益的部分，2026年前三季是20.3億，相較於去年同期的11.7億是增加了73%。本期淨利的部分，2026年前三季21.2億，相較於去年同期的9億是增加了136%。EPS的話，2026年前三季7.4元，相較於去年同期4.21元是增加了75%。"}, {"i": 5, "ts": "09:15", "sec": 555, "who": "蘇士昌", "role": "公司", "text": "在我們這個市場分佈來看的話，2026的第三季大概在資訊運算是29%，然後電源的部分是19%，代工的部分是13%。資訊運算的部分大概是增加了7.37個百分點，電源的部分增加了36%，代工的部分增加了14%。相較2025年的第三季來看，資訊運算的部分大概是增加了56個百分點，電源的部分增加了92個百分點。"}, {"i": 6, "ts": "11:18", "sec": 678, "who": "蘇士昌", "role": "公司", "text": "這一頁是產品分佈的部分。在2026的第三季，我們主要三個大的類別：第一個是陶瓷電容佔了52%，固態的部分佔了26%，電解的部分佔了大概9%。陶瓷電容的部分是增加了28%，固態的部分是衰退了4.89%。因為在第二季的時候，客戶有擔心第三季跟第四季會有一個缺貨的狀況，所以在第二季有提前備貨。"}, {"i": 7, "ts": "13:18", "sec": 798, "who": "蘇士昌", "role": "公司", "text": "營運摘要的部分，財務績效跟股東回報來看的話，其實我們就是公司連續20年以上維持這個獲利，而且今年前三季的營運績效已經突破歷史新高。產品轉型跟利潤優化來看，我們其實還是聚焦在AI相關的這些應用，Data Center還有AI的運算紅利。特別是這個高容值、高可靠度的MLCC，還有鋁質電容跟鉭質電容的這個產品。"}, {"i": 8, "ts": "14:30", "sec": 870, "who": "蘇士昌", "role": "公司", "text": "最後一個就是核心競爭力還有客群的深化。其實提供客戶一站式服務的附加價值，因為我們其實有非常齊全的代理產品線。特別是現在有一些原廠，他要因應客戶要交墨西哥、美國、東南亞，他的營收獲利其實沒辦法去Cover這個運費，他就會請我們幫忙Total Solution去提供給客戶。以上謝謝指教。"}], "qa": null, "chars": 1330, "last_min": 14, "cpm": 92, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "2026年前三季營運績效突破歷史新高。", "ts": "13:30", "who": "蘇士昌", "seg": 7}, {"text": "公司連續20年以上維持獲利並配發股利。", "ts": "13:25", "who": "蘇士昌", "seg": 7}]}, {"title": "營收", "points": [{"text": "2026Q3營收58.6億元，季增13%，年增44%。", "ts": "03:55", "who": "王采苓", "seg": 3}, {"text": "2026年前三季營收155億元，年增30%。", "ts": "05:25", "who": "王采苓", "seg": 4}, {"text": "資訊運算佔Q3營收29%，電源佔19%，代工佔13%。", "ts": "09:20", "who": "蘇士昌", "seg": 5}]}, {"title": "毛利與獲利", "points": [{"text": "2026Q3毛利率21%，優於Q2的18%。", "ts": "04:05", "who": "王采苓", "seg": 3}, {"text": "2026Q3營益率14%，較Q2的11%提升。", "ts": "04:25", "who": "王采苓", "seg": 3}, {"text": "2026年前三季EPS達7.4元，年增75%。", "ts": "06:05", "who": "王采苓", "seg": 4}]}, {"title": "產品與技術", "points": [{"text": "陶瓷電容（MLCC）佔Q3營收52%，固態電容佔26%。", "ts": "11:30", "who": "蘇士昌", "seg": 6}, {"text": "聚焦AI應用、資料中心及AI運算紅利。", "ts": "13:45", "who": "蘇士昌", "seg": 7}, {"text": "推廣高容值、高可靠度MLCC及鋁質/鉭質固態電容。", "ts": "13:55", "who": "蘇士昌", "seg": 7}]}, {"title": "客戶", "points": [{"text": "提供一站式服務，協助客戶全球供應鏈佈局。", "ts": "14:35", "who": "蘇士昌", "seg": 8}, {"text": "支援客戶在墨西哥、美國、東南亞的在地化需求。", "ts": "14:45", "who": "蘇士昌", "seg": 8}]}, {"title": "股利與資本", "points": [{"text": "公司目前股本為28.7億元。", "ts": "01:55", "who": "王采苓", "seg": 1}]}], "quotes": []}, {"key": "3026_2026-11-10", "code": "3026", "name": "禾伸堂", "date": "2026-11-10", "segs": [{"i": 0, "ts": "03:16:00", "sec": 11760, "who": "發言人", "role": "公司", "text": "首先在2026年的7到9月就是我們第三季的部分，我們的合併營收為45.38億元，然後我們的毛利率是29.8%，那這是一個季增3.6個百分點，然後年增11.6個百分點。"}, {"i": 1, "ts": "03:34:00", "sec": 12840, "who": "發言人", "role": "公司", "text": "那扣除掉營業費用之後，我們的營業淨利是8.93億元，那整個第三季歸屬母公司淨利為7.23億元，每股盈餘為4.36元。"}, {"i": 2, "ts": "06:07:00", "sec": 22020, "who": "發言人", "role": "公司", "text": "那我們的目標是希望說這個在第四季，第四季的時候被動元件的佔比可以達到50%，那我們會持續的努力。"}, {"i": 3, "ts": "20:40:00", "sec": 74400, "who": "發言人", "role": "公司", "text": "那我們的產能規劃就是希望在2026年的時候整體的產能可以比2025年增加30%，那到2027年的時候可以比2026年呢，整個YoY成長40%。"}], "qa": null, "chars": 260, "last_min": 1240, "cpm": 0, "status": "bad_ts", "memo": [{"title": "營收", "points": [{"text": "2026Q3合併營收為45.38億元，季增11%。", "ts": "03:22:00", "who": "發言人", "seg": 0}]}, {"title": "毛利與獲利", "points": [{"text": "2026Q3毛利率為29.8%，季增3.6個百分點，年增11.6個百分點。", "ts": "03:26:00", "who": "發言人", "seg": 0}, {"text": "2026Q3營業淨利為8.93億元，每股盈餘為4.36元。", "ts": "03:35:00", "who": "發言人", "seg": 1}]}, {"title": "營運指引", "points": [{"text": "預期2026Q4被動元件佔比可達50%。", "ts": "06:11:00", "who": "發言人", "seg": 2}]}, {"title": "產品與技術", "points": [{"text": "AI應用佔比從2025年的19%，提升至2026Q3的35%。", "ts": "06:52:00", "who": "發言人", "seg": 2}]}, {"title": "產能與擴產", "points": [{"text": "預計2026年產能較2025年增加30%，2027年較2026年增加40%。", "ts": "20:42:00", "who": "發言人", "seg": 3}]}], "quotes": []}, {"key": "3017_2026-11-10", "code": "3017", "name": "奇鋐", "date": "2026-11-10", "segs": [{"i": 0, "ts": "00:00:00", "sec": 0, "who": "講者", "role": "公司", "text": "AVC 2026年第三季財務數據"}, {"i": 1, "ts": "00:00:02", "sec": 2, "who": "講者", "role": "公司", "text": "各位投資先進大家午安，歡迎參加由富邦證券所主辦的奇鋐科技股份有限公司法說會。"}, {"i": 2, "ts": "00:00:10", "sec": 10, "who": "講者", "role": "公司", "text": "首先為大家介紹今天代表出席的經營團隊，我們歡迎陳奕成財務長、陳揚傑事業處副總經理。"}, {"i": 3, "ts": "00:00:17", "sec": 17, "who": "講者", "role": "公司", "text": "，大家好。"}, {"i": 4, "ts": "00:00:19", "sec": 19, "who": "講者", "role": "公司", "text": "還有沈新豪總經理特助。"}, {"i": 5, "ts": "00:00:22", "sec": 22, "who": "講者", "role": "公司", "text": "還有陳燕良。"}, {"i": 6, "ts": "00:00:25", "sec": 25, "who": "講者", "role": "公司", "text": "陳燕良財務資深經理。"}, {"i": 7, "ts": "00:00:27", "sec": 27, "who": "講者", "role": "公司", "text": "那今天法說會議程將由公司經營團隊進行2026年第三季公司營運成果及未來展望簡報後進行Q&A交流。"}, {"i": 8, "ts": "00:00:37", "sec": 37, "who": "講者", "role": "公司", "text": "那現在我们就把時間交給公司經營團隊。"}, {"i": 9, "ts": "00:00:41", "sec": 41, "who": "講者", "role": "公司", "text": "謝謝這個富邦證券幫我們安排這個法說會。"}, {"i": 10, "ts": "00:00:45", "sec": 45, "who": "講者", "role": "公司", "text": "感謝各位投資先進還有這個媒體先進。"}, {"i": 11, "ts": "00:00:49", "sec": 49, "who": "講者", "role": "公司", "text": "那因為待會我们就先有那個B耳，他做一個我們的第三季財務數字的一个presentation。"}, {"i": 12, "ts": "00:00:58", "sec": 58, "who": "講者", "role": "公司", "text": "那待會再執行這個Q&A，感謝大家。"}, {"i": 13, "ts": "00:01:03", "sec": 63, "who": "講者", "role": "公司", "text": "年開始"}, {"i": 14, "ts": "00:11:11", "sec": 671, "who": "財務長", "role": "公司", "text": "大家好，因為"}, {"i": 15, "ts": "00:11:13", "sec": 673, "who": "財務長", "role": "公司", "text": "所有事先所收集的一些問題，不能回答的別的公司的問題就"}, {"i": 16, "ts": "00:11:21", "sec": 681, "who": "財務長", "role": "公司", "text": "不能幫人家回答，所以那個會delete掉。"}, {"i": 17, "ts": "00:11:25", "sec": 685, "who": "財務長", "role": "公司", "text": "所以我們就我就"}, {"i": 18, "ts": "00:11:27", "sec": 687, "who": "財務長", "role": "公司", "text": "一一這邊有20幾個題目，我們有分，我就請我們三位同仁跟各位這個回答報告。第一條是這個"}, {"i": 19, "ts": "00:13:34", "sec": 814, "who": "發言人", "role": "公司", "text": "目前ASIC的部分，是全部都已經有導入這個雙向的，雙面的水冷板。"}, {"i": 20, "ts": "00:13:40", "sec": 820, "who": "發言人", "role": "公司", "text": "那以及部分的GPU客戶也有導入雙面水冷板。"}, {"i": 21, "ts": "00:13:44", "sec": 824, "who": "發言人", "role": "公司", "text": "那其它的客戶目前都在評估當中。"}, {"i": 22, "ts": "00:13:47", "sec": 827, "who": "發言人", "role": "公司", "text": "那這個雙面的水冷板基本上就跟這個VPD的設計是有直接的關聯的。"}, {"i": 23, "ts": "00:13:53", "sec": 833, "who": "發言人", "role": "公司", "text": "那就像我們剛剛前面提到的，我們已經有交給客人這個雙面的水冷板。"}, {"i": 24, "ts": "00:13:58", "sec": 838, "who": "發言人", "role": "公司", "text": "那後續也會依照客戶的不同需求去配合各個世代平台的設計。"}, {"i": 25, "ts": "00:14:04", "sec": 844, "who": "發言人", "role": "公司", "text": "謝謝。"}, {"i": 26, "ts": "00:15:22", "sec": 922, "who": "發言人", "role": "公司", "text": "我們有事非常多不同的材料，那鑽石銅是一部分。"}, {"i": 27, "ts": "00:15:29", "sec": 929, "who": "發言人", "role": "公司", "text": "那鑽石銅我們在Notebook上應用，現在"}, {"i": 28, "ts": "00:15:33", "sec": 933, "who": "發言人", "role": "公司", "text": "性能會好一些，但是Server目前這邊"}, {"i": 29, "ts": "00:15:37", "sec": 937, "who": "發言人", "role": "公司", "text": "加工有點困難，所以還在研發中，目前沒有大規模導入。"}, {"i": 30, "ts": "00:15:41", "sec": 941, "who": "發言人", "role": "公司", "text": "那如果有新的進展再跟大家分享，謝謝。"}, {"i": 31, "ts": "00:16:04", "sec": 964, "who": "發言人", "role": "公司", "text": "數量是持續有增加的。"}, {"i": 32, "ts": "00:16:08", "sec": 968, "who": "發言人", "role": "公司", "text": "那"}, {"i": 33, "ts": "00:16:10", "sec": 970, "who": "發言人", "role": "公司", "text": "也開始迎應AI"}, {"i": 34, "ts": "00:16:12", "sec": 972, "who": "發言人", "role": "公司", "text": "也陸陸續續有些客戶在明年要量產案子。"}, {"i": 35, "ts": "00:16:16", "sec": 976, "who": "發言人", "role": "公司", "text": "也導入水冷的，對，所以會持續變好。"}, {"i": 36, "ts": "00:16:19", "sec": 979, "who": "發言人", "role": "公司", "text": "那我們對明年通用伺服器的展望也是積極正向的，謝謝。"}, {"i": 37, "ts": "00:16:41", "sec": 1001, "who": "發言人", "role": "公司", "text": "針對ASIC"}, {"i": 38, "ts": "00:16:46", "sec": 1006, "who": "發言人", "role": "公司", "text": "這邊的競爭對手是否有增加的問題，先做說明。"}, {"i": 39, "ts": "00:16:50", "sec": 1010, "who": "發言人", "role": "公司", "text": "其實在過去來說，我們在許多的專上面"}, {"i": 40, "ts": "00:16:57", "sec": 1017, "who": "發言人", "role": "公司", "text": "量小的時候，我們甚至都是都是我們客戶的"}, {"i": 41, "ts": "00:17:00", "sec": 1020, "who": "發言人", "role": "公司", "text": "唯一供應商。"}, {"i": 42, "ts": "00:17:01", "sec": 1021, "who": "發言人", "role": "公司", "text": "那就其實前幾次法說會有跟大家說明，"}, {"i": 43, "ts": "00:17:04", "sec": 1024, "who": "發言人", "role": "公司", "text": "當量起來，當產品從小量變大量的時候呢，"}, {"i": 44, "ts": "00:17:09", "sec": 1029, "who": "發言人", "role": "公司", "text": "出貨量增加的時候，客戶自然會為了要分擔風險，"}, {"i": 45, "ts": "00:17:12", "sec": 1032, "who": "發言人", "role": "公司", "text": "去考慮更多的供應商，避免過度的依賴單一的來人。"}, {"i": 46, "ts": "00:17:18", "sec": 1038, "who": "發言人", "role": "公司", "text": "那這其實是一個很自然、也非常尋常的"}, {"i": 47, "ts": "00:17:22", "sec": 1042, "who": "發言人", "role": "公司", "text": "那個客戶從小量變大量的結構性的變化。"}, {"i": 48, "ts": "00:17:27", "sec": 1047, "who": "發言人", "role": "公司", "text": "可以說的是奇鋐仍然在散熱的領域呢，保持著領先的地位。"}, {"i": 49, "ts": "00:17:33", "sec": 1053, "who": "發言人", "role": "公司", "text": "然後呢，在未來也持續會以低明的"}, {"i": 50, "ts": "00:17:36", "sec": 1056, "who": "發言人", "role": "公司", "text": "地位呢，與客戶"}, {"i": 51, "ts": "00:17:40", "sec": 1060, "who": "發言人", "role": "公司", "text": "開發"}, {"i": 52, "ts": "00:17:41", "sec": 1061, "who": "發言人", "role": "公司", "text": "推進各項的ASIC專案，這個是不會變的。"}, {"i": 53, "ts": "00:17:45", "sec": 1065, "who": "發言人", "role": "公司", "text": "價格方面來說呢，之前也有提到，"}, {"i": 54, "ts": "00:17:50", "sec": 1070, "who": "發言人", "role": "公司", "text": "其實對我們ASIC的客戶來說是對於所有AI的專案而言，現在最重要的"}, {"i": 55, "ts": "00:17:55", "sec": 1075, "who": "發言人", "role": "公司", "text": "交期，最重要的是"}, {"i": 56, "ts": "00:17:57", "sec": 1077, "who": "發言人", "role": "公司", "text": "在AI的這個"}, {"i": 57, "ts": "00:17:59", "sec": 1079, "who": "發言人", "role": "公司", "text": "戰意當中可以取得先機。"}, {"i": 58, "ts": "00:18:01", "sec": 1081, "who": "發言人", "role": "公司", "text": "反過來看呢，散熱其實佔AI的整體bom一直以來都是一個"}, {"i": 59, "ts": "00:18:07", "sec": 1087, "who": "發言人", "role": "公司", "text": "低百分比的部位。"}, {"i": 60, "ts": "00:18:11", "sec": 1091, "who": "發言人", "role": "公司", "text": "所以在現在來說，對ASIC客戶，對他們重要的是能否持續的保持跟我們良好的合作關係，"}, {"i": 61, "ts": "00:18:19", "sec": 1099, "who": "發言人", "role": "公司", "text": "能否持續得到我們最大的支持，"}, {"i": 62, "ts": "00:18:21", "sec": 1101, "who": "發言人", "role": "公司", "text": "反而價格呢，是排在他們優先順序後面的。"}, {"i": 63, "ts": "00:18:24", "sec": 1104, "who": "發言人", "role": "公司", "text": "也因此我們在價格上面現在還沒有確切感受到太太明顯的壓力。"}, {"i": 64, "ts": "00:18:31", "sec": 1111, "who": "發言人", "role": "公司", "text": "對於客戶而言就是確保產品能夠完全符合他們的要求，"}, {"i": 65, "ts": "00:18:38", "sec": 1118, "who": "發言人", "role": "公司", "text": "遠比價格來的重要。"}, {"i": 66, "ts": "00:18:42", "sec": 1122, "who": "財務長", "role": "公司", "text": "本來供需嘛，價格就是供需決定，那現在目前看起來好像也是"}, {"i": 67, "ts": "00:18:49", "sec": 1129, "who": "財務長", "role": "公司", "text": "這個"}, {"i": 68, "ts": "00:18:50", "sec": 1130, "who": "財務長", "role": "公司", "text": "供局還是延研不足這個需求，大概是這樣子。"}, {"i": 69, "ts": "00:19:07", "sec": 1147, "who": "發言人", "role": "公司", "text": "我們已經有出一些大陸那邊的客戶了，對。"}, {"i": 70, "ts": "00:19:12", "sec": 1152, "who": "發言人", "role": "公司", "text": "那歐美的客戶有在送樣，對。"}, {"i": 71, "ts": "00:19:16", "sec": 1156, "who": "發言人", "role": "公司", "text": "那我們是做零件起家的。"}, {"i": 72, "ts": "00:19:20", "sec": 1160, "who": "發言人", "role": "公司", "text": "所以我們剛說出貨是已經出這個整個機器，"}, {"i": 73, "ts": "00:19:23", "sec": 1163, "who": "發言人", "role": "公司", "text": "但即使我們沒有出這個機器，"}, {"i": 74, "ts": "00:19:25", "sec": 1165, "who": "發言人", "role": "公司", "text": "既有歐美的客戶"}, {"i": 75, "ts": "00:19:29", "sec": 1169, "who": "發言人", "role": "公司", "text": "的這個CDU的部件，"}, {"i": 76, "ts": "00:19:31", "sec": 1171, "who": "發言人", "role": "公司", "text": "我們已經出貨已經超過好幾年的。"}, {"i": 77, "ts": "00:19:34", "sec": 1174, "who": "發言人", "role": "公司", "text": "所以我們的優勢就是我們在部件設計的能力非常強。"}, {"i": 78, "ts": "00:19:38", "sec": 1178, "who": "發言人", "role": "公司", "text": "那很多時候系統的性能差異就是看部件，部件很重要嘛，這第一個。"}, {"i": 79, "ts": "00:19:43", "sec": 1183, "who": "發言人", "role": "公司", "text": "第二是我們的量產，穩定規模量產的能力非常好。"}, {"i": 80, "ts": "00:19:48", "sec": 1188, "who": "發言人", "role": "公司", "text": "所以客戶挑選我們會，他會很放心。"}, {"i": 81, "ts": "00:19:53", "sec": 1193, "who": "發言人", "role": "公司", "text": "對，那後續我們當然持續會推進我們在這個產品的規劃。"}, {"i": 82, "ts": "00:19:59", "sec": 1199, "who": "發言人", "role": "公司", "text": "那如果大家這幾天有看這個"}, {"i": 83, "ts": "00:20:02", "sec": 1202, "who": "發言人", "role": "公司", "text": "News應該有看到我們有一些"}, {"i": 84, "ts": "00:20:04", "sec": 1204, "who": "發言人", "role": "公司", "text": "我們我們有一些佈局嘛，對，所以我們就會把這個東西當作我們接下來重點持續去推進中，"}, {"i": 85, "ts": "00:20:11", "sec": 1211, "who": "發言人", "role": "公司", "text": "不管是部件或是整機，對，謝謝。"}, {"i": 86, "ts": "00:20:16", "sec": 1216, "who": "財務長", "role": "公司", "text": "好，那下一題是這個"}, {"i": 87, "ts": "00:20:19", "sec": 1219, "who": "財務長", "role": "公司", "text": "AWS的那個T3哈，"}, {"i": 88, "ts": "00:20:21", "sec": 1221, "who": "財務長", "role": "公司", "text": "異能的出貨有delay嗎？"}, {"i": 89, "ts": "00:20:23", "sec": 1223, "who": "財務長", "role": "公司", "text": "有新的競爭者加入嗎？"}, {"i": 90, "ts": "00:20:26", "sec": 1226, "who": "財務長", "role": "公司", "text": "那還有分享這個AWS T3跟T4這個"}, {"i": 91, "ts": "00:20:31", "sec": 1231, "who": "財務長", "role": "公司", "text": "異能"}, {"i": 92, "ts": "00:20:32", "sec": 1232, "who": "財務長", "role": "公司", "text": "那個滲透率就是penetration的看法呢？那這題請來回答哈。行吧。"}, {"i": 93, "ts": "00:20:39", "sec": 1239, "who": "發言人", "role": "公司", "text": "以後我們這種問題我們會直接槓掉。"}, {"i": 94, "ts": "00:20:41", "sec": 1241, "who": "發言人", "role": "公司", "text": "我們不針對單一客戶單一專案說明，對對對，不好分享。"}, {"i": 95, "ts": "00:20:47", "sec": 1247, "who": "發言人", "role": "公司", "text": "對，但可以說的就是整個，就像我們mention所整個趨勢就是水冷的滲透率導入率會越來越高。"}, {"i": 96, "ts": "00:20:54", "sec": 1254, "who": "發言人", "role": "公司", "text": "不管是GPU，不管是ASIC，不管是"}, {"i": 97, "ts": "00:20:57", "sec": 1257, "who": "發言人", "role": "公司", "text": "其他的CPU或散熱零件，因為最後是一個系統。"}, {"i": 98, "ts": "00:21:02", "sec": 1262, "who": "發言人", "role": "公司", "text": "客戶都會一直往全水冷的方向邁進。"}, {"i": 99, "ts": "00:21:07", "sec": 1267, "who": "發言人", "role": "公司", "text": "對，所以我們對這個趨勢是非常有信心的，我們也準備好我們自己，謝謝。"}, {"i": 100, "ts": "00:21:13", "sec": 1273, "who": "財務長", "role": "公司", "text": "這已經準備好了，其實這個"}, {"i": 101, "ts": "00:21:17", "sec": 1277, "who": "財務長", "role": "公司", "text": "滲透率一直是越來越高，那"}, {"i": 102, "ts": "00:21:20", "sec": 1280, "who": "財務長", "role": "公司", "text": "下一題是"}, {"i": 103, "ts": "00:21:21", "sec": 1281, "who": "財務長", "role": "公司", "text": "的比重，"}, {"i": 104, "ts": "00:21:23", "sec": 1283, "who": "財務長", "role": "公司", "text": "在大年在明年"}, {"i": 105, "ts": "00:21:24", "sec": 1284, "who": "財務長", "role": "公司", "text": "有機會超越GPU的比重嗎？"}, {"i": 106, "ts": "00:21:28", "sec": 1288, "who": "財務長", "role": "公司", "text": "看法有沒有變嗎？那其中"}, {"i": 107, "ts": "00:21:30", "sec": 1290, "who": "財務長", "role": "公司", "text": "的散熱跟這個車系"}, {"i": 108, "ts": "00:21:33", "sec": 1293, "who": "財務長", "role": "公司", "text": "的營收跟機殼的營收貢獻"}, {"i": 109, "ts": "00:21:35", "sec": 1295, "who": "財務長", "role": "公司", "text": "大致可佔多少呢？那這題請來回答哈。來。"}, {"i": 110, "ts": "00:21:39", "sec": 1299, "who": "發言人", "role": "公司", "text": "好，謝謝財務長。"}, {"i": 111, "ts": "00:21:40", "sec": 1300, "who": "發言人", "role": "公司", "text": "那針對第一個部分，就是ASIC比重在2027年是否會超越GPU"}, {"i": 112, "ts": "00:21:47", "sec": 1307, "who": "發言人", "role": "公司", "text": "的看法呢？我們還是維持之前跟大家分享的，也就是在2027年"}, {"i": 113, "ts": "00:21:56", "sec": 1316, "who": "發言人", "role": "公司", "text": "ASIC的營收貢獻將會超越GPU。"}, {"i": 114, "ts": "00:21:57", "sec": 1317, "who": "發言人", "role": "公司", "text": "那這裡必須得還是跟大家提一下，"}, {"i": 115, "ts": "00:22:00", "sec": 1320, "who": "發言人", "role": "公司", "text": "GPU的客戶NVIDIA、AMD、GPU的客戶認識我們非常非常重要的客戶，"}, {"i": 116, "ts": "00:22:06", "sec": 1326, "who": "發言人", "role": "公司", "text": "也在過去幾年跟他們的合作來說，"}, {"i": 117, "ts": "00:22:11", "sec": 1331, "who": "發言人", "role": "公司", "text": "培養了良好的關係，我們也在未來持續會支持"}, {"i": 118, "ts": "00:22:15", "sec": 1335, "who": "發言人", "role": "公司", "text": "然後呢，並且付出我們最好的研發團隊跟他們一起挑戰下一代的"}, {"i": 119, "ts": "00:22:21", "sec": 1341, "who": "發言人", "role": "公司", "text": "晶片也好，系統也好，Rack也好。"}, {"i": 120, "ts": "00:22:25", "sec": 1345, "who": "發言人", "role": "公司", "text": "那"}, {"i": 121, "ts": "00:22:26", "sec": 1346, "who": "發言人", "role": "公司", "text": "當然我們同樣重視GPU，也重視ASIC的客戶的合作關係。"}, {"i": 122, "ts": "00:22:32", "sec": 1352, "who": "發言人", "role": "公司", "text": "不過呢，還是必須得提的，奇鋐一直以來都是一家以終端客戶"}, {"i": 123, "ts": "00:22:37", "sec": 1357, "who": "發言人", "role": "公司", "text": "以終端需求為導向的一家公司。"}, {"i": 124, "ts": "00:22:42", "sec": 1362, "who": "發言人", "role": "公司", "text": "ASIC"}, {"i": 125, "ts": "00:22:43", "sec": 1363, "who": "發言人", "role": "公司", "text": "之所以會成長大過於GPU"}, {"i": 126, "ts": "00:22:47", "sec": 1367, "who": "發言人", "role": "公司", "text": "底層邏輯還是我們很多的ASIC，我們很多的CSP客戶"}, {"i": 127, "ts": "00:22:51", "sec": 1371, "who": "發言人", "role": "公司", "text": "逐漸的轉向用來了他們自己的ASIC晶片。"}, {"i": 128, "ts": "00:22:57", "sec": 1377, "who": "發言人", "role": "公司", "text": "對，所以呢，跟著客戶長期的需求"}, {"i": 129, "ts": "00:23:02", "sec": 1382, "who": "發言人", "role": "公司", "text": "一直以來都是我們的宗旨。"}, {"i": 130, "ts": "00:23:03", "sec": 1383, "who": "發言人", "role": "公司", "text": "然後呢，也因此我們在明年開始就會看到這個轉捩點，造成我們在明年預計來說"}, {"i": 131, "ts": "00:23:11", "sec": 1391, "who": "發言人", "role": "公司", "text": "AI server這個區塊"}, {"i": 132, "ts": "00:23:13", "sec": 1393, "who": "發言人", "role": "公司", "text": "ASIC的總營收會比GPU的來得高。"}, {"i": 133, "ts": "00:23:16", "sec": 1396, "who": "發言人", "role": "公司", "text": "那"}, {"i": 134, "ts": "00:23:17", "sec": 1397, "who": "發言人", "role": "公司", "text": "當然我覺得另外一個其實在這個時間點"}, {"i": 135, "ts": "00:23:20", "sec": 1400, "who": "發言人", "role": "公司", "text": "也蠻有必要提的，其實我們也一直在看"}, {"i": 136, "ts": "00:23:22", "sec": 1402, "who": "發言人", "role": "公司", "text": "不只是"}, {"i": 137, "ts": "00:23:24", "sec": 1404, "who": "發言人", "role": "公司", "text": "過去的贏家是誰，現在的贏家是誰，"}, {"i": 138, "ts": "00:23:27", "sec": 1407, "who": "發言人", "role": "公司", "text": "還有未來的贏家會有哪些？"}, {"i": 139, "ts": "00:23:29", "sec": 1409, "who": "發言人", "role": "公司", "text": "所以其實除了現在看得到的GPU跟大型的CSP客戶以外，"}, {"i": 140, "ts": "00:23:35", "sec": 1415, "who": "發言人", "role": "公司", "text": "我們今年其實有另外一個側重點就是要放在一些新的"}, {"i": 141, "ts": "00:23:40", "sec": 1420, "who": "發言人", "role": "公司", "text": "AI startup"}, {"i": 142, "ts": "00:23:41", "sec": 1421, "who": "發言人", "role": "公司", "text": "一些新的AI晶片，"}, {"i": 143, "ts": "00:23:43", "sec": 1423, "who": "發言人", "role": "公司", "text": "如同像Krock"}, {"i": 144, "ts": "00:23:44", "sec": 1424, "who": "發言人", "role": "公司", "text": "這樣子的公司，我們都會爭取在最早的時間"}, {"i": 145, "ts": "00:23:48", "sec": 1428, "who": "發言人", "role": "公司", "text": "跟他們開始合作，跟他們培養關係，"}, {"i": 146, "ts": "00:23:51", "sec": 1431, "who": "發言人", "role": "公司", "text": "了解他們的長線roadmap，並且為他們"}, {"i": 147, "ts": "00:23:56", "sec": 1436, "who": "發言人", "role": "公司", "text": "下一代，下下一代甚至"}, {"i": 148, "ts": "00:23:58", "sec": 1438, "who": "發言人", "role": "公司", "text": "下下下代"}, {"i": 149, "ts": "00:24:00", "sec": 1440, "who": "發言人", "role": "公司", "text": "的晶片結構散熱需求做提前的預備。"}, {"i": 150, "ts": "00:24:02", "sec": 1442, "who": "發言人", "role": "公司", "text": "謝謝。"}, {"i": 151, "ts": "00:24:06", "sec": 1446, "who": "財務長", "role": "公司", "text": "這個"}, {"i": 152, "ts": "00:24:08", "sec": 1448, "who": "財務長", "role": "公司", "text": "反正就是"}, {"i": 153, "ts": "00:24:10", "sec": 1450, "who": "財務長", "role": "公司", "text": "未來的合作就是更加緊密哈，那下一題是"}, {"i": 154, "ts": "00:24:16", "sec": 1456, "who": "財務長", "role": "公司", "text": "更新產能擴充計劃，"}, {"i": 155, "ts": "00:24:17", "sec": 1457, "who": "財務長", "role": "公司", "text": "明年度就是2027年那個主要的隨人版跟機殼的擴張的產能是多少呢？"}, {"i": 156, "ts": "00:24:23", "sec": 1463, "who": "財務長", "role": "公司", "text": "那越南還是會買地嗎？"}, {"i": 157, "ts": "00:24:26", "sec": 1466, "who": "財務長", "role": "公司", "text": "那有越南之外的區域的擴點計劃嗎？那這一題請B回答哈。好。"}, {"i": 158, "ts": "00:24:31", "sec": 1471, "who": "財務長", "role": "公司", "text": "謝謝財務長。"}, {"i": 159, "ts": "00:24:33", "sec": 1473, "who": "財務長", "role": "公司", "text": "好，那這個就像我們剛剛前面提到的，明年的水輪產能的擴規劃是要在擴五成以上。"}, {"i": 160, "ts": "00:24:40", "sec": 1480, "who": "財務長", "role": "公司", "text": "那我們現有的水用產能水冷產能就像我們之前說的大概是一個月是可以做一咪的量。"}, {"i": 161, "ts": "00:24:46", "sec": 1486, "who": "財務長", "role": "公司", "text": "那未來就是以這個數字再往上擴。"}, {"i": 162, "ts": "00:24:50", "sec": 1490, "who": "財務長", "role": "公司", "text": "那同時我們的機殼產能也會持續的往上增加。"}, {"i": 163, "ts": "00:24:54", "sec": 1494, "who": "財務長", "role": "公司", "text": "那擴產我們現階段一樣會是以越南為主。"}, {"i": 164, "ts": "00:24:57", "sec": 1497, "who": "財務長", "role": "公司", "text": "那我們越南也是有這個買這個新的土地。"}, {"i": 165, "ts": "00:25:01", "sec": 1501, "who": "財務長", "role": "公司", "text": "那大概有多大呢？大概就是這個1.5個大案生靈公園這樣子。"}, {"i": 166, "ts": "00:25:07", "sec": 1507, "who": "財務長", "role": "公司", "text": "對，或者是80個足球場。"}, {"i": 167, "ts": "00:25:09", "sec": 1509, "who": "財務長", "role": "公司", "text": "對，那所以其實是目前這個地部分我想是夠用的。"}, {"i": 168, "ts": "00:25:13", "sec": 1513, "who": "財務長", "role": "公司", "text": "對，那未來也會持續的再去做這個擴產的計劃。"}, {"i": 169, "ts": "00:25:17", "sec": 1517, "who": "財務長", "role": "公司", "text": "那我們也會因應客戶的需求去擴增剛剛這個提到的CDU相關的產能。"}, {"i": 170, "ts": "00:25:24", "sec": 1524, "who": "財務長", "role": "公司", "text": "對，那未來我們也會有CDU的產品去出貨給客戶。"}, {"i": 171, "ts": "00:25:28", "sec": 1528, "who": "財務長", "role": "公司", "text": "謝謝。"}, {"i": 172, "ts": "00:25:31", "sec": 1531, "who": "財務長", "role": "公司", "text": "謝謝啊。"}, {"i": 173, "ts": "00:25:36", "sec": 1536, "who": "財務長", "role": "公司", "text": "呃"}, {"i": 174, "ts": "00:25:36", "sec": 1536, "who": "財務長", "role": "公司", "text": "下一題是呃"}, {"i": 175, "ts": "00:25:37", "sec": 1537, "who": "財務長", "role": "公司", "text": "雙向異能的開發進度，"}, {"i": 176, "ts": "00:25:39", "sec": 1539, "who": "財務長", "role": "公司", "text": "還有它的瓶頸是什麼呢？"}, {"i": 177, "ts": "00:25:41", "sec": 1541, "who": "財務長", "role": "公司", "text": "那客戶預聚什麼時候會導入呢？"}, {"i": 178, "ts": "00:25:44", "sec": 1544, "who": "財務長", "role": "公司", "text": "那這一題我們取來回答哈。秀。"}, {"i": 179, "ts": "00:25:46", "sec": 1546, "who": "發言人", "role": "公司", "text": "好，謝謝財務長。"}, {"i": 180, "ts": "00:25:48", "sec": 1548, "who": "發言人", "role": "公司", "text": "雙向適應方面，我們跟客戶持續取得非常好的進展。"}, {"i": 181, "ts": "00:25:54", "sec": 1554, "who": "發言人", "role": "公司", "text": "那在客戶這邊的"}, {"i": 182, "ts": "00:25:57", "sec": 1557, "who": "發言人", "role": "公司", "text": "樣品的測試中呢，我們目前"}, {"i": 183, "ts": "00:26:01", "sec": 1561, "who": "發言人", "role": "公司", "text": "還是保持著散熱效能"}, {"i": 184, "ts": "00:26:02", "sec": 1562, "who": "發言人", "role": "公司", "text": "第一名的"}, {"i": 185, "ts": "00:26:04", "sec": 1564, "who": "發言人", "role": "公司", "text": "的位置。"}, {"i": 186, "ts": "00:26:07", "sec": 1567, "who": "發言人", "role": "公司", "text": "繼續引領著產業的開發。"}, {"i": 187, "ts": "00:26:12", "sec": 1572, "who": "發言人", "role": "公司", "text": "那至於客戶什麼時候會導入呢？我們"}, {"i": 188, "ts": "00:26:16", "sec": 1576, "who": "發言人", "role": "公司", "text": "就如我們之前一樣派的做法，我們是不會提供"}, {"i": 189, "ts": "00:26:21", "sec": 1581, "who": "發言人", "role": "公司", "text": "目前看不到的東西這種"}, {"i": 190, "ts": "00:26:24", "sec": 1584, "who": "發言人", "role": "公司", "text": "比較推測性的預估。"}, {"i": 191, "ts": "00:26:28", "sec": 1588, "who": "發言人", "role": "公司", "text": "就就時程來說，主要還是看技術的成熟度以及客戶"}, {"i": 192, "ts": "00:26:37", "sec": 1597, "who": "發言人", "role": "公司", "text": "實際的"}, {"i": 193, "ts": "00:26:39", "sec": 1599, "who": "發言人", "role": "公司", "text": "導入時程。"}, {"i": 194, "ts": "00:26:42", "sec": 1602, "who": "發言人", "role": "公司", "text": "那當然現在這項技術還在"}, {"i": 195, "ts": "00:26:48", "sec": 1608, "who": "發言人", "role": "公司", "text": "算是出初期的"}, {"i": 196, "ts": "00:26:52", "sec": 1612, "who": "發言人", "role": "公司", "text": "技術堆積還有開發的時段，我們這裡就沒有辦法跟大家講"}, {"i": 197, "ts": "00:26:57", "sec": 1617, "who": "發言人", "role": "公司", "text": "確確切切的導入時程。"}, {"i": 198, "ts": "00:27:03", "sec": 1623, "who": "財務長", "role": "公司", "text": "謝謝回答啊，那"}, {"i": 199, "ts": "00:27:05", "sec": 1625, "who": "財務長", "role": "公司", "text": "下一題是呃"}, {"i": 200, "ts": "00:27:09", "sec": 1629, "who": "財務長", "role": "公司", "text": "說明機殼機櫃的明年"}, {"i": 201, "ts": "00:27:14", "sec": 1634, "who": "財務長", "role": "公司", "text": "2027年的成長動能。"}, {"i": 202, "ts": "00:27:17", "sec": 1637, "who": "財務長", "role": "公司", "text": "那怎麼看機箱事業的cross margin？"}, {"i": 203, "ts": "00:27:21", "sec": 1641, "who": "財務長", "role": "公司", "text": "就是毛利率的變化呢？那這題請回答哈。謝老闆。"}, {"i": 204, "ts": "00:27:27", "sec": 1647, "who": "發言人", "role": "公司", "text": "呃我們生意的邏輯都一樣，我們就做散熱跟機構，這第一個。"}, {"i": 205, "ts": "00:27:35", "sec": 1655, "who": "發言人", "role": "公司", "text": "第二個，我持續優化我們的生產製造，優化我們的規模體量。"}, {"i": 206, "ts": "00:27:42", "sec": 1662, "who": "發言人", "role": "公司", "text": "然後長期追求我們每一個產品的毛利率，"}, {"i": 207, "ts": "00:27:49", "sec": 1669, "who": "發言人", "role": "公司", "text": "淨利率都是提升的，這樣我們的整體corporate level才會有提升嘛。"}, {"i": 208, "ts": "00:27:54", "sec": 1674, "who": "發言人", "role": "公司", "text": "所以我們散熱機構都很看好，我們會持續成長，謝謝。"}, {"i": 209, "ts": "00:28:17", "sec": 1697, "who": "財務長", "role": "公司", "text": "那下一題是呃"}, {"i": 210, "ts": "00:28:19", "sec": 1699, "who": "財務長", "role": "公司", "text": "AI由雲端向H端發展。"}, {"i": 211, "ts": "00:28:22", "sec": 1702, "who": "財務長", "role": "公司", "text": "啊"}, {"i": 212, "ts": "00:28:24", "sec": 1704, "who": "財務長", "role": "公司", "text": "就是邊緣嘛，在HAI，那奇鋐AVC有的商機是什麼呢？"}, {"i": 213, "ts": "00:28:34", "sec": 1714, "who": "財務長", "role": "公司", "text": "那HAI目前"}, {"i": 214, "ts": "00:28:37", "sec": 1717, "who": "財務長", "role": "公司", "text": "或者是未來的營收佔比要怎麼看？那這題就選我們那個AI專案的負責人來回答。好來。"}, {"i": 215, "ts": "00:28:51", "sec": 1731, "who": "發言人", "role": "公司", "text": "謝謝謝財務長。"}, {"i": 216, "ts": "00:28:54", "sec": 1734, "who": "發言人", "role": "公司", "text": "如果如果當然後續大家想要找討論企業導入AI的，這是我的"}, {"i": 217, "ts": "00:29:08", "sec": 1748, "who": "發言人", "role": "公司", "text": "現在目前公司另外責任，所以也非常"}, {"i": 218, "ts": "00:29:12", "sec": 1752, "who": "發言人", "role": "公司", "text": "對啊，非常喜歡跟大家討論、分享、交流這些事情。"}, {"i": 219, "ts": "00:29:17", "sec": 1757, "who": "發言人", "role": "公司", "text": "那當然回答那個回答財務長的問題，"}, {"i": 220, "ts": "00:29:21", "sec": 1761, "who": "發言人", "role": "公司", "text": "HAI這件事情呢，其實HAI的優勢來自於主要兩個點，第一就是他個人隱私性，"}, {"i": 221, "ts": "00:29:30", "sec": 1770, "who": "發言人", "role": "公司", "text": "第二就是他相比雲端的"}, {"i": 222, "ts": "00:29:36", "sec": 1776, "who": "發言人", "role": "公司", "text": "串接模型來說呢，有更低的延遲。"}, {"i": 223, "ts": "00:29:39", "sec": 1779, "who": "發言人", "role": "公司", "text": "其實呢，在消費性的領域"}, {"i": 224, "ts": "00:29:43", "sec": 1783, "who": "發言人", "role": "公司", "text": "光這兩個用處跟這兩個特性，我們就已經有看到非常多"}, {"i": 225, "ts": "00:29:52", "sec": 1792, "who": "發言人", "role": "公司", "text": "很棒也很有吸引的一些應用的構想。"}, {"i": 226, "ts": "00:29:56", "sec": 1796, "who": "發言人", "role": "公司", "text": "然後也期待未來幾年它能夠"}, {"i": 227, "ts": "00:30:02", "sec": 1802, "who": "發言人", "role": "公司", "text": "有相當好的一個發展。"}, {"i": 228, "ts": "00:30:07", "sec": 1807, "who": "發言人", "role": "公司", "text": "那起宏呢，起家於做筆電還有做機的散熱，"}, {"i": 229, "ts": "00:30:17", "sec": 1817, "who": "發言人", "role": "公司", "text": "對這個領域非常的熟悉，"}, {"i": 230, "ts": "00:30:21", "sec": 1821, "who": "發言人", "role": "公司", "text": "然後呢，所有相關的客戶也都是我們既有且合作非常久的合作夥伴。"}, {"i": 231, "ts": "00:30:31", "sec": 1831, "who": "發言人", "role": "公司", "text": "如果產業真的朝著HAI的方向發展，"}, {"i": 232, "ts": "00:30:39", "sec": 1839, "who": "發言人", "role": "公司", "text": "我們自然會透過"}, {"i": 233, "ts": "00:30:42", "sec": 1842, "who": "發言人", "role": "公司", "text": "既有的客戶來啟動更多的專案。"}, {"i": 234, "ts": "00:30:47", "sec": 1847, "who": "財務長", "role": "公司", "text": "謝謝啊，這個"}, {"i": 235, "ts": "00:30:52", "sec": 1852, "who": "財務長", "role": "公司", "text": "我們其實"}, {"i": 236, "ts": "00:30:55", "sec": 1855, "who": "財務長", "role": "公司", "text": "反正都是有合作開發了。"}, {"i": 237, "ts": "00:31:02", "sec": 1862, "who": "財務長", "role": "公司", "text": "隨輪的方案我們AVC都不會放棄，那下一題是"}, {"i": 238, "ts": "00:31:06", "sec": 1866, "who": "財務長", "role": "公司", "text": "市場會擔憂"}, {"i": 239, "ts": "00:31:10", "sec": 1870, "who": "財務長", "role": "公司", "text": "CSPAI投資變現能力"}, {"i": 240, "ts": "00:31:17", "sec": 1877, "who": "財務長", "role": "公司", "text": "跟不上這個Capex的投入，"}, {"i": 241, "ts": "00:31:21", "sec": 1881, "who": "財務長", "role": "公司", "text": "那呢我們奇宏怎麼看？"}, {"i": 242, "ts": "00:31:25", "sec": 1885, "who": "財務長", "role": "公司", "text": "那客戶在後續年度AI這個Data center研發投入有沒有變化呢？那這題我們請來回答哈。"}, {"i": 243, "ts": "00:31:35", "sec": 1895, "who": "發言人", "role": "公司", "text": "好，謝謝財務長。當然我們"}, {"i": 244, "ts": "00:31:42", "sec": 1902, "who": "發言人", "role": "公司", "text": "只能發表我們從客戶這邊接觸到的一些訊息，還有我們自己的一些理解。"}, {"i": 245, "ts": "00:31:49", "sec": 1909, "who": "發言人", "role": "公司", "text": "我們也不是CSP這邊的策略部門，所以沒有辦法為他們做做最全面的發言。"}, {"i": 246, "ts": "00:32:02", "sec": 1922, "who": "發言人", "role": "公司", "text": "那但其實我們以我們理解來說，對終端客戶，對所有的CSP而言，"}, {"i": 247, "ts": "00:32:10", "sec": 1930, "who": "發言人", "role": "公司", "text": "其實這這這這並不是投資AI投資"}, {"i": 248, "ts": "00:32:17", "sec": 1937, "who": "發言人", "role": "公司", "text": "模型投資算力投資data center也好，"}, {"i": 249, "ts": "00:32:21", "sec": 1941, "who": "發言人", "role": "公司", "text": "這不是一個短期的投資報酬或者是變現率的問題，而是"}, {"i": 250, "ts": "00:32:32", "sec": 1952, "who": "發言人", "role": "公司", "text": "確確實在實有關他們公司存亡生死的問題。"}, {"i": 251, "ts": "00:32:41", "sec": 1961, "who": "發言人", "role": "公司", "text": "那"}, {"i": 252, "ts": "00:32:43", "sec": 1963, "who": "發言人", "role": "公司", "text": "從我們可以看得到的角度來看，"}, {"i": 253, "ts": "00:32:48", "sec": 1968, "who": "發言人", "role": "公司", "text": "以及從我們接收到的訂單還有forecast來看，"}, {"i": 254, "ts": "00:32:56", "sec": 1976, "who": "發言人", "role": "公司", "text": "客戶其實寧願超額去下單，也不認因為下單不足而面臨供應的短缺。"}, {"i": 255, "ts": "00:33:04", "sec": 1984, "who": "發言人", "role": "公司", "text": "那從我們這邊可以看得到的部份來說，需求"}, {"i": 256, "ts": "00:33:14", "sec": 1994, "who": "發言人", "role": "公司", "text": "還是非常的強勁。"}, {"i": 257, "ts": "00:33:19", "sec": 1999, "who": "發言人", "role": "公司", "text": "那當然我們最近也有看到很多新聞上面表示融資環境變得越來越困難，"}, {"i": 258, "ts": "00:33:28", "sec": 2008, "who": "發言人", "role": "公司", "text": "但終端客戶從我們角度來說，還是沒有辦法承擔放緩投資的"}, {"i": 259, "ts": "00:33:41", "sec": 2021, "who": "發言人", "role": "公司", "text": "長期的代價。"}, {"i": 260, "ts": "00:33:46", "sec": 2026, "who": "發言人", "role": "公司", "text": "所以在接下來幾年，我們依舊認為CSP客戶也好，"}, {"i": 261, "ts": "00:33:57", "sec": 2037, "who": "發言人", "role": "公司", "text": "GPU客戶也好，甚至AI新創也好，他們"}, {"i": 262, "ts": "00:34:03", "sec": 2043, "who": "發言人", "role": "公司", "text": "還是會找到辦法來克服這個"}, {"i": 263, "ts": "00:34:09", "sec": 2049, "who": "發言人", "role": "公司", "text": "融資籌資的困難，但不會因為遇到這些"}, {"i": 264, "ts": "00:34:16", "sec": 2056, "who": "發言人", "role": "公司", "text": "這類型的困難而放下他們"}, {"i": 265, "ts": "00:34:21", "sec": 2061, "who": "發言人", "role": "公司", "text": "目前的領先地位，又或者是放緩他們前進的腳步。"}, {"i": 266, "ts": "00:34:29", "sec": 2069, "who": "財務長", "role": "公司", "text": "謝謝回答啊，那"}, {"i": 267, "ts": "00:34:33", "sec": 2073, "who": "財務長", "role": "公司", "text": "下一題是呃"}, {"i": 268, "ts": "00:34:36", "sec": 2076, "who": "財務長", "role": "公司", "text": "手機還有平板VC哈，"}, {"i": 269, "ts": "00:34:42", "sec": 2082, "who": "財務長", "role": "公司", "text": "今年跟明年的貢獻"}, {"i": 270, "ts": "00:34:46", "sec": 2086, "who": "財務長", "role": "公司", "text": "各是多少呢？"}, {"i": 271, "ts": "00:34:50", "sec": 2090, "who": "財務長", "role": "公司", "text": "會不會有其他客戶這個"}, {"i": 272, "ts": "00:34:56", "sec": 2096, "who": "財務長", "role": "公司", "text": "這個VC的出貨呢，這題我們請來回答哈。"}, {"i": 273, "ts": "00:35:01", "sec": 2101, "who": "發言人", "role": "公司", "text": "single digit，謝謝。"}, {"i": 274, "ts": "00:35:05", "sec": 2105, "who": "發言人", "role": "公司", "text": "這個不好意思啊，這個有時候不方便這個哈，這一題就是大概就是這樣子，反正就是"}, {"i": 275, "ts": "00:35:58", "sec": 2158, "who": "發言人", "role": "公司", "text": "這種這種這種就大概就是這樣子，我們應該是"}, {"i": 276, "ts": "00:36:00", "sec": 2160, "who": "發言人", "role": "公司", "text": "吧，"}, {"i": 277, "ts": "00:36:01", "sec": 2161, "who": "發言人", "role": "公司", "text": "就chamber應該是比較"}, {"i": 278, "ts": "00:36:05", "sec": 2165, "who": "發言人", "role": "公司", "text": "之前的之前以前我們的那個主力，那現在是corporate這些比較多了哈。"}, {"i": 279, "ts": "00:36:08", "sec": 2168, "who": "發言人", "role": "公司", "text": "那跟那個chassis的，那下一題是"}, {"i": 280, "ts": "00:36:11", "sec": 2171, "who": "發言人", "role": "公司", "text": "我們的關鍵零組件短缺"}, {"i": 281, "ts": "00:36:16", "sec": 2176, "who": "發言人", "role": "公司", "text": "造成的這個"}, {"i": 282, "ts": "00:36:17", "sec": 2177, "who": "發言人", "role": "公司", "text": "長短料狀況解決了沒有？"}, {"i": 283, "ts": "00:36:20", "sec": 2180, "who": "發言人", "role": "公司", "text": "那"}, {"i": 284, "ts": "00:36:22", "sec": 2182, "who": "發言人", "role": "公司", "text": "AVC奇鋐在NV還有ASIC客戶的產品的進度是怎樣呢？那這題我請回答哈。"}, {"i": 285, "ts": "00:36:29", "sec": 2189, "who": "發言人", "role": "公司", "text": "好，謝謝財務長。"}, {"i": 286, "ts": "00:36:31", "sec": 2191, "who": "發言人", "role": "公司", "text": "那就像我們剛剛前面說的，我們已經有開始出這個雙面的水冷板，"}, {"i": 287, "ts": "00:36:43", "sec": 2203, "who": "發言人", "role": "公司", "text": "那也會依照客戶的不同需求來去做客製化的設計。"}, {"i": 288, "ts": "00:36:48", "sec": 2208, "who": "發言人", "role": "公司", "text": "那我們的ASP跟用量還有他的設計複雜度是有直接相關聯的。"}, {"i": 289, "ts": "00:36:56", "sec": 2216, "who": "發言人", "role": "公司", "text": "所以雙面水冷板的ASP跟他的這個複雜度都會比較高。"}, {"i": 290, "ts": "00:37:00", "sec": 2220, "who": "發言人", "role": "公司", "text": "所以我們對於整個雙面水冷板或者未來如果在水冷板上有其他新的變化，"}, {"i": 291, "ts": "00:37:06", "sec": 2226, "who": "發言人", "role": "公司", "text": "這個發展我們都會是正向看待。"}, {"i": 292, "ts": "00:37:10", "sec": 2230, "who": "發言人", "role": "公司", "text": "謝謝。"}, {"i": 293, "ts": "00:37:12", "sec": 2232, "who": "財務長", "role": "公司", "text": "好，那下一題是"}, {"i": 294, "ts": "00:37:13", "sec": 2233, "who": "財務長", "role": "公司", "text": "水冷趨勢明確，"}, {"i": 295, "ts": "00:37:15", "sec": 2235, "who": "財務長", "role": "公司", "text": "但市場競爭，"}, {"i": 296, "ts": "00:37:17", "sec": 2237, "who": "財務長", "role": "公司", "text": "例如這個中國廠商或是台灣的"}, {"i": 297, "ts": "00:37:21", "sec": 2241, "who": "財務長", "role": "公司", "text": "在這邊寫在我們的Cool Master等級競爭狀況的分析。"}, {"i": 298, "ts": "00:37:25", "sec": 2245, "who": "財務長", "role": "公司", "text": "那"}, {"i": 299, "ts": "00:37:26", "sec": 2246, "who": "財務長", "role": "公司", "text": "明年產品單價提升的幅度"}, {"i": 300, "ts": "00:37:31", "sec": 2251, "who": "財務長", "role": "公司", "text": "是不是可以比照今年更高？"}, {"i": 301, "ts": "00:37:33", "sec": 2253, "who": "財務長", "role": "公司", "text": "那"}, {"i": 302, "ts": "00:37:34", "sec": 2254, "who": "財務長", "role": "公司", "text": "明年到後年的毛利率的趨勢的看法，那這題我們請回答哈。"}, {"i": 303, "ts": "00:37:40", "sec": 2260, "who": "財務長", "role": "公司", "text": "謝謝財務長。"}, {"i": 304, "ts": "00:37:42", "sec": 2262, "who": "財務長", "role": "公司", "text": "不回答其他競爭對手的問題，"}, {"i": 305, "ts": "00:37:46", "sec": 2266, "who": "財務長", "role": "公司", "text": "也沒有辦法透露客戶單一客戶狀況。"}, {"i": 306, "ts": "00:37:50", "sec": 2270, "who": "財務長", "role": "公司", "text": "那還是一樣，我們就是專心做好散熱跟機構，"}, {"i": 307, "ts": "00:37:54", "sec": 2274, "who": "財務長", "role": "公司", "text": "做好我們的產品組合。"}, {"i": 308, "ts": "00:37:57", "sec": 2277, "who": "財務長", "role": "公司", "text": "那剛剛也提到很多產品嘛，包括雙面水。"}, {"i": 309, "ts": "00:38:00", "sec": 2280, "who": "財務長", "role": "公司", "text": "所以複雜度會提升，"}, {"i": 310, "ts": "00:38:01", "sec": 2281, "who": "財務長", "role": "公司", "text": "相對應能的話，我們單價也會跟著提升。"}, {"i": 311, "ts": "00:38:05", "sec": 2285, "who": "財務長", "role": "公司", "text": "那"}, {"i": 312, "ts": "00:38:06", "sec": 2286, "who": "財務長", "role": "公司", "text": "目前來看，"}, {"i": 313, "ts": "00:38:07", "sec": 2287, "who": "財務長", "role": "公司", "text": "從過去這兩三年吹瑞克跟我們接下來看，"}, {"i": 314, "ts": "00:38:11", "sec": 2291, "who": "財務長", "role": "公司", "text": "至少到2028、2029，"}, {"i": 315, "ts": "00:38:18", "sec": 2298, "who": "財務長", "role": "公司", "text": "我們對於這個"}, {"i": 316, "ts": "00:38:21", "sec": 2301, "who": "財務長", "role": "公司", "text": "P乘Q嘛，就是價格跟出貨趨勢，"}, {"i": 317, "ts": "00:38:27", "sec": 2307, "who": "財務長", "role": "公司", "text": "我們都還是很有信心的。"}, {"i": 318, "ts": "00:38:29", "sec": 2309, "who": "財務長", "role": "公司", "text": "我們對自己會"}, {"i": 319, "ts": "00:38:31", "sec": 2311, "who": "財務長", "role": "公司", "text": "會有個明"}, {"i": 320, "ts": "00:38:32", "sec": 2312, "who": "財務長", "role": "公司", "text": "會有個積極的看法。"}, {"i": 321, "ts": "00:38:36", "sec": 2316, "who": "財務長", "role": "公司", "text": "那"}, {"i": 322, "ts": "00:38:41", "sec": 2321, "who": "財務長", "role": "公司", "text": "對，就分享趨勢，那沒有沒有數字。"}, {"i": 323, "ts": "00:38:43", "sec": 2323, "who": "財務長", "role": "公司", "text": "因為這題是優單位他們比較清楚他們的低線。"}, {"i": 324, "ts": "00:38:38", "sec": 2318, "who": "財務長", "role": "公司", "text": "所以我們"}, {"i": 325, "ts": "00:38:41", "sec": 2321, "who": "財務長", "role": "公司", "text": "如果你這個剛剛講的，我們用量多，"}, {"i": 326, "ts": "00:38:44", "sec": 2324, "who": "財務長", "role": "公司", "text": "那你的複雜度更高的話，那看起來產值是不是會更高？"}, {"i": 327, "ts": "00:38:48", "sec": 2328, "who": "財務長", "role": "公司", "text": "這個是"}, {"i": 328, "ts": "00:38:50", "sec": 2330, "who": "財務長", "role": "公司", "text": "看起來就是一個趨勢，只是說"}, {"i": 329, "ts": "00:38:54", "sec": 2334, "who": "財務長", "role": "公司", "text": "你這啊會不會比競能好，這個有時候要看我們的剛剛有講的我們的的，"}, {"i": 330, "ts": "00:38:58", "sec": 2338, "who": "財務長", "role": "公司", "text": "我們公司這個生產效率的提升嘛，自動化"}, {"i": 331, "ts": "00:39:01", "sec": 2341, "who": "財務長", "role": "公司", "text": "我們的cost down的這個狀況。"}, {"i": 332, "ts": "00:39:03", "sec": 2343, "who": "財務長", "role": "公司", "text": "所以這個跟補充報告一下，所以"}, {"i": 333, "ts": "00:39:06", "sec": 2346, "who": "財務長", "role": "公司", "text": "趨勢還是我們的業務他講的這個我們就很安心啦。"}, {"i": 334, "ts": "00:39:09", "sec": 2349, "who": "財務長", "role": "公司", "text": "來，第二下一題是這個"}, {"i": 335, "ts": "00:39:11", "sec": 2351, "who": "財務長", "role": "公司", "text": "GPU跟ASIC在明年的水冷採用的趨勢，"}, {"i": 336, "ts": "00:39:17", "sec": 2357, "who": "財務長", "role": "公司", "text": "那內容含量value的比較，那這題我請回答哈。"}, {"i": 337, "ts": "00:39:24", "sec": 2364, "who": "發言人", "role": "公司", "text": "謝謝財務長。"}, {"i": 338, "ts": "00:39:25", "sec": 2365, "who": "發言人", "role": "公司", "text": "那個GPUASIC的"}, {"i": 339, "ts": "00:39:29", "sec": 2369, "who": "發言人", "role": "公司", "text": "水冷採用趨勢content value的比較。"}, {"i": 340, "ts": "00:39:31", "sec": 2371, "who": "發言人", "role": "公司", "text": "水冷採用趨勢其實還是要分為兩個"}, {"i": 341, "ts": "00:39:36", "sec": 2376, "who": "發言人", "role": "公司", "text": "大的區塊來看，第一個區塊是"}, {"i": 342, "ts": "00:39:39", "sec": 2379, "who": "發言人", "role": "公司", "text": "運算晶片，computer chip"}, {"i": 343, "ts": "00:39:42", "sec": 2382, "who": "發言人", "role": "公司", "text": "GPU又或者ASIC的運算晶片的水冷採用。"}, {"i": 344, "ts": "00:39:46", "sec": 2386, "who": "發言人", "role": "公司", "text": "然後呢第二個區塊要看的是其他部件的，CPU也好，memory也好，transceiver"}, {"i": 345, "ts": "00:39:52", "sec": 2392, "who": "發言人", "role": "公司", "text": "power"}, {"i": 346, "ts": "00:39:53", "sec": 2393, "who": "發言人", "role": "公司", "text": "等等。"}, {"i": 347, "ts": "00:39:55", "sec": 2395, "who": "發言人", "role": "公司", "text": "第一個部分GPU，ASIC運算晶片的水冷採用率呢，"}, {"i": 348, "ts": "00:40:02", "sec": 2402, "who": "發言人", "role": "公司", "text": "其實到2027年底的時候，"}, {"i": 349, "ts": "00:40:06", "sec": 2406, "who": "發言人", "role": "公司", "text": "我們目前看起來應該會是100%，就是所有的GPU所有的ASIC在所有的專案裡面都會是用"}, {"i": 350, "ts": "00:40:15", "sec": 2415, "who": "發言人", "role": "公司", "text": "業冷的方案。"}, {"i": 351, "ts": "00:40:16", "sec": 2416, "who": "發言人", "role": "公司", "text": "至於說其他這一些"}, {"i": 352, "ts": "00:40:22", "sec": 2422, "who": "發言人", "role": "公司", "text": "零件部件來說呢，"}, {"i": 353, "ts": "00:40:24", "sec": 2424, "who": "發言人", "role": "公司", "text": "也會逐漸的提升，但是會依照個別客戶對於他們自己的rack level，system level的"}, {"i": 354, "ts": "00:40:31", "sec": 2431, "who": "發言人", "role": "公司", "text": "構想以及未來的規劃"}, {"i": 355, "ts": "00:40:34", "sec": 2434, "who": "發言人", "role": "公司", "text": "有所不同的進展。"}, {"i": 356, "ts": "00:40:36", "sec": 2436, "who": "發言人", "role": "公司", "text": "可以說的是我們"}, {"i": 357, "ts": "00:40:39", "sec": 2439, "who": "發言人", "role": "公司", "text": "已經看到非常明確的趨勢就是"}, {"i": 358, "ts": "00:40:41", "sec": 2441, "who": "發言人", "role": "公司", "text": "每一代每一代之間，不管是GPU或者是ASIC也好，"}, {"i": 359, "ts": "00:40:45", "sec": 2445, "who": "發言人", "role": "公司", "text": "其實他每代得treade裡面的系統複雜度都逐漸在提升。"}, {"i": 360, "ts": "00:40:50", "sec": 2450, "who": "發言人", "role": "公司", "text": "那就如剛才Eric也有提到，艷良也有提到的，就是我們是做total thermomechanical solution。"}, {"i": 361, "ts": "00:40:58", "sec": 2458, "who": "發言人", "role": "公司", "text": "我們是拿這客戶的"}, {"i": 362, "ts": "00:41:01", "sec": 2461, "who": "發言人", "role": "公司", "text": "整機系統，"}, {"i": 363, "ts": "00:41:02", "sec": 2462, "who": "發言人", "role": "公司", "text": "針對整機系統做解決方案的。"}, {"i": 364, "ts": "00:41:04", "sec": 2464, "who": "發言人", "role": "公司", "text": "那隨著系統的複雜度提升，"}, {"i": 365, "ts": "00:41:07", "sec": 2467, "who": "發言人", "role": "公司", "text": "我們的價值量，"}, {"i": 366, "ts": "00:41:09", "sec": 2469, "who": "發言人", "role": "公司", "text": "我們的"}, {"i": 367, "ts": "00:41:11", "sec": 2471, "who": "發言人", "role": "公司", "text": "know-how，"}, {"i": 368, "ts": "00:41:12", "sec": 2472, "who": "發言人", "role": "公司", "text": "我們的經驗，"}, {"i": 369, "ts": "00:41:13", "sec": 2473, "who": "發言人", "role": "公司", "text": "也就就會"}, {"i": 370, "ts": "00:41:15", "sec": 2475, "who": "發言人", "role": "公司", "text": "逐漸的越來越重要。"}, {"i": 371, "ts": "00:41:17", "sec": 2477, "who": "發言人", "role": "公司", "text": "可以說的是，雖然說整體趨勢並不是一個線性的成長，"}, {"i": 372, "ts": "00:41:22", "sec": 2482, "who": "發言人", "role": "公司", "text": "但可以說的是在過去幾代的"}, {"i": 373, "ts": "00:41:27", "sec": 2487, "who": "發言人", "role": "公司", "text": "trade to trade的comparison，也就是每個"}, {"i": 374, "ts": "00:41:31", "sec": 2491, "who": "發言人", "role": "公司", "text": "前一代跟現代trade"}, {"i": 375, "ts": "00:41:35", "sec": 2495, "who": "發言人", "role": "公司", "text": "的價值量做比較的話，"}, {"i": 376, "ts": "00:41:37", "sec": 2497, "who": "發言人", "role": "公司", "text": "我們其實都是有看到至少雙位數的價值量的提升。"}, {"i": 377, "ts": "00:41:37", "sec": 2497, "who": "發言人", "role": "公司", "text": "所以這對我們未來來說，"}, {"i": 378, "ts": "00:41:39", "sec": 2499, "who": "發言人", "role": "公司", "text": "將持續會是一個很好的機會。"}, {"i": 379, "ts": "00:41:40", "sec": 2500, "who": "發言人", "role": "公司", "text": "我們也持續"}, {"i": 380, "ts": "00:41:41", "sec": 2501, "who": "發言人", "role": "公司", "text": "非常期待我們客戶"}, {"i": 381, "ts": "00:41:43", "sec": 2503, "who": "發言人", "role": "公司", "text": "推出"}, {"i": 382, "ts": "00:41:45", "sec": 2505, "who": "發言人", "role": "公司", "text": "越來越困難的系統架構，"}, {"i": 383, "ts": "00:41:47", "sec": 2507, "who": "發言人", "role": "公司", "text": "然後呢"}, {"i": 384, "ts": "00:41:48", "sec": 2508, "who": "發言人", "role": "公司", "text": "以換取我們可以提供"}, {"i": 385, "ts": "00:41:51", "sec": 2511, "who": "發言人", "role": "公司", "text": "越來越複雜，"}, {"i": 386, "ts": "00:41:52", "sec": 2512, "who": "發言人", "role": "公司", "text": "越來越專業，"}, {"i": 387, "ts": "00:41:53", "sec": 2513, "who": "發言人", "role": "公司", "text": "也越來越高品質的散熱解決方案。"}, {"i": 388, "ts": "00:41:56", "sec": 2516, "who": "發言人", "role": "公司", "text": "謝謝。"}, {"i": 389, "ts": "00:42:01", "sec": 2521, "who": "財務長", "role": "公司", "text": "這今天的第22題了。"}, {"i": 390, "ts": "00:42:04", "sec": 2524, "who": "財務長", "role": "公司", "text": "其實我們刪掉很多問題，但是問到同業的，所以那個其他問題就不能回答了。"}, {"i": 391, "ts": "00:42:12", "sec": 2532, "who": "財務長", "role": "公司", "text": "那"}, {"i": 392, "ts": "00:42:15", "sec": 2535, "who": "財務長", "role": "公司", "text": "這這個"}, {"i": 393, "ts": "00:42:19", "sec": 2539, "who": "財務長", "role": "公司", "text": "這第22個問題是"}, {"i": 394, "ts": "00:42:22", "sec": 2542, "who": "財務長", "role": "公司", "text": "今年跟明年的Capex跟那個籌資的計劃，那那這一條請回答哈。"}, {"i": 395, "ts": "00:42:31", "sec": 2551, "who": "財務長", "role": "公司", "text": "好，謝謝財務長。"}, {"i": 396, "ts": "00:42:33", "sec": 2553, "who": "財務長", "role": "公司", "text": "好，那這個就像我們剛剛前面提到的，我們現在1到3季的Capex是120億嘛。"}, {"i": 397, "ts": "00:42:39", "sec": 2559, "who": "財務長", "role": "公司", "text": "那我們今年度預計的total的Capex會是150億左右。"}, {"i": 398, "ts": "00:42:47", "sec": 2567, "who": "財務長", "role": "公司", "text": "那明年度的話，我們就是在150億到200億之間。"}, {"i": 399, "ts": "00:42:51", "sec": 2571, "who": "財務長", "role": "公司", "text": "那就是一樣是主要是在越南這邊去做擴廠。"}, {"i": 400, "ts": "00:42:55", "sec": 2575, "who": "財務長", "role": "公司", "text": "然後中國這邊也會再去購買一些新的設備。"}, {"i": 401, "ts": "00:42:58", "sec": 2578, "who": "財務長", "role": "公司", "text": "那目前暫時是沒有這個相關的籌資計劃。"}, {"i": 402, "ts": "00:43:03", "sec": 2583, "who": "財務長", "role": "公司", "text": "因為我想大家如果有看我們的財報的話，應該看到我們的現金是有大概800億左右。"}, {"i": 403, "ts": "00:43:09", "sec": 2589, "who": "財務長", "role": "公司", "text": "對，所以未來如果真的有需要，我們會再依照相關的規定去辦理公告。"}, {"i": 404, "ts": "00:43:18", "sec": 2598, "who": "財務長", "role": "公司", "text": "好，謝謝大家。"}, {"i": 405, "ts": "00:43:21", "sec": 2601, "who": "講者", "role": "公司", "text": "好，那當我們非常謝謝經團隊的分享，那我們今天奇宏法說會到這邊告一段落，謝謝。"}], "qa": null, "chars": 6588, "last_min": 43, "cpm": 152, "status": "full", "memo": [{"title": "營收", "points": [{"text": "2026年第三季單季營收為590.89億元，較去年同期成長52%。", "ts": "00:01:53", "who": "講者", "seg": 13}]}, {"title": "毛利與獲利", "points": [{"text": "2026年第三季毛利率為33.86%，營業利益率為28.53%，每股盈餘為29.32元。", "ts": "00:01:53", "who": "講者", "seg": 13}]}, {"title": "Q&A", "points": [{"text": "問：今年第四季及明年度的營收毛利率方向以及產品線北成長的強弱排序？／答：Q4與明年的營運依然抱持正向看法，水冷會是主要成長動能。", "ts": "00:11:34", "who": "財務長", "seg": 18}, {"text": "問：銅價塑膠及其他材料價格的上漲，對Gross Margin的影響，有辦法轉價嗎？／答：原料價格變動會反應在客戶報價上，雙方對成本變化有清楚依據。", "ts": "00:12:31", "who": "財務長", "seg": 18}, {"text": "問：雙面水冷板設計是成為ASIC與GPU設計的主流嗎？怎麼看客戶明後年世代水冷板設計的變化？／答：雙面水冷板設計與VPD的設計有直接關聯，目前ASIC與部分GPU客戶已導入雙面水冷板。", "ts": "00:13:13", "who": "財務長", "seg": 18}, {"text": "問：Corporated新測試的材質是什麼呢？鑽石銅會是主要開發的材料嗎？／答：我們有非常多不同的材料，鑽石銅是一部分，在Notebook上應用效能會好一些。", "ts": "00:15:05", "who": "發言人", "seg": 25}, {"text": "問：通用伺服器的散熱需求是什麼呢？有因為供應鏈的缺料來delay嗎？／答：數量是持續有增加的，也開始迎應AI，有些客戶在明年要量產案子也導入水冷的。", "ts": "00:15:48", "who": "發言人", "seg": 30}, {"text": "問：ASIC散熱競爭者有增加嗎？有見到來自ASIC客戶降價的壓力嗎？／答：當量變大時客戶為了分擔風險會考慮更多供應商，奇鋐在水冷領域保持領先地位。", "ts": "00:16:27", "who": "財務長", "seg": 36}]}], "quotes": []}, {"key": "2356_2026-11-10", "code": "2356", "name": "英業達", "date": "2026-11-10", "segs": [{"i": 0, "ts": "00:00:14", "sec": 14, "who": "講者", "role": "公司", "text": "好，各位下午好。"}, {"i": 1, "ts": "00:01:32", "sec": 92, "who": "財務長", "role": "公司", "text": "好，謝謝Angela。"}, {"i": 2, "ts": "00:01:34", "sec": 94, "who": "財務長", "role": "公司", "text": "各位投資界的朋友們，大家好。"}, {"i": 3, "ts": "00:01:38", "sec": 98, "who": "財務長", "role": "公司", "text": "現在我開始針對我們第三季，也就是前三季的一個營運表現做簡單的說明。"}, {"i": 4, "ts": "00:01:45", "sec": 105, "who": "財務長", "role": "公司", "text": "那相關的資訊我們同時也會在公開資訊觀測站上面做公布。"}, {"i": 5, "ts": "00:01:50", "sec": 110, "who": "財務長", "role": "公司", "text": "那細節的部分就請各位，數字細節部分就參照公告的數字。"}, {"i": 6, "ts": "00:01:56", "sec": 116, "who": "財務長", "role": "公司", "text": "我們在前三季，就是2020的前三季，我們的業績是7422億元。"}], "qa": null, "chars": 149, "last_min": 2, "cpm": 77, "status": "part", "memo": [{"title": "亮點", "points": [{"text": "前三季營收達7,422億元，較去年同期成長43%。", "ts": "00:02:00", "who": "財務長", "seg": 6}, {"text": "前三季EPS為2.47元，高於去年同期的1.85元。", "ts": "00:02:56", "who": "財務長", "seg": 6}]}, {"title": "營收", "points": [{"text": "前三季營收成長主要受價格因素帶動，銷售量亦有相關影響。", "ts": "00:02:13", "who": "財務長", "seg": 6}, {"text": "前三季產品組合與大類型的組合部分有些許差異。", "ts": "00:02:23", "who": "財務長", "seg": 6}, {"text": "前三季營收年增達43%，主要來自資金運用上的成本壓力。", "ts": "00:03:04", "who": "財務長", "seg": 6}, {"text": "伺服器產品的佔比已突破五成以上。", "ts": "00:06:38", "who": "財務長", "seg": 6}]}, {"title": "毛利與獲利", "points": [{"text": "前三季營業毛利率較去年同期比例有減少，但營業毛利金額增加18%。", "ts": "00:02:28", "who": "財務長", "seg": 6}, {"text": "前三季營業利益率為2.47元，高於去年同期1.85元。", "ts": "00:02:56", "who": "財務長", "seg": 6}, {"text": "第三季營業毛利率與毛利金額較第二季呈現大致相當。", "ts": "00:04:05", "who": "財務長", "seg": 6}]}, {"title": "產能與擴產", "points": [{"text": "持續在海外布線，包含墨西哥、泰國、美國等地。", "ts": "00:09:11", "who": "財務長", "seg": 6}]}, {"title": "Q&A", "points": [{"text": "問：2027年Notebook與伺服器等展望？／答：Notebook預期持平，伺服器與ASIC成長動能強勁。", "ts": "00:17:53", "who": "分析師", "seg": 6}, {"text": "問：2027年GPU與ASIC佔比？／答：GPU與ASIC數量與營收佔大部分，且維持高雙位數成長。", "ts": "00:20:41", "who": "分析師", "seg": 6}, {"text": "問：伺服器毛利率表現？／答：標準伺服器毛利率相對保守，客單價提升。", "ts": "00:21:26", "who": "分析師", "seg": 6}, {"text": "問：CSP與Neocloud優勢？／答：CSP與Neocloud優勢仍可看好，未見改變。", "ts": "00:19:03", "who": "分析師", "seg": 6}, {"text": "問：存貨風險與存貨週轉？／答：存貨週轉天數約40-50天，存貨風險可控。", "ts": "00:13:30", "who": "分析師", "seg": 6}, {"text": "問：現金需求與資本支出？／答：資金運用與資本支出維持穩定，無重大變動。", "ts": "00:14:48", "who": "分析師", "seg": 6}]}], "quotes": []}, {"key": "2049_2026-11-10", "code": "2049", "name": "上銀", "date": "2026-11-10", "segs": [{"i": 0, "ts": "00:00", "sec": 0, "who": "主持人", "role": "主持人", "text": "科技股份有限公司法人說明會正式開始。"}, {"i": 1, "ts": "00:30", "sec": 30, "who": "主持人", "role": "主持人", "text": "今天的說明會將由陳助總向各位報告上銀科技今年第三季的營運成果及未來展望。"}, {"i": 2, "ts": "00:50", "sec": 50, "who": "卓永財", "role": "公司", "text": "感謝各位投資先進、股東女士今天蒞臨上銀科技2026年第三季的法人說明會。"}, {"i": 3, "ts": "02:58", "sec": 178, "who": "陳宏明", "role": "公司", "text": "接著由我來報告上銀科技2026年第三季的營運狀況。"}, {"i": 4, "ts": "03:03", "sec": 183, "who": "陳宏明", "role": "公司", "text": "首先我們看到的是營業收入，2025年第三季的營收是81.1億元，較上一季75.08億元增加了8%，那較去年同期的59.95億元增加了35%。"}, {"i": 5, "ts": "04:16", "sec": 256, "who": "陳宏明", "role": "公司", "text": "接下來我們看到的是營業毛利的部分，在第三季的一個毛利率是36.3%，較上一季增加2.1%，那較去年同期增加了7.7%。"}, {"i": 6, "ts": "06:55", "sec": 415, "who": "陳宏明", "role": "公司", "text": "接著我們看到基本每股盈餘EPS，第三季的EPS是3.48元，較上一季的2.4元增加了1.08元，那較去年同期的1.26元增加了2.22元。"}], "qa": null, "chars": 313, "last_min": 7, "cpm": 45, "status": "part", "memo": [{"title": "營收", "points": [{"text": "2026年第三季營收為81.1億元，季增8%，年增35%。", "ts": "03:03", "who": "陳宏明", "seg": 4}]}, {"title": "毛利與獲利", "points": [{"text": "2026年第三季毛利率為36.3%，季增2.1%，年增7.7%。", "ts": "04:16", "who": "陳宏明", "seg": 5}, {"text": "2026年第三季EPS為3.48元，季增1.08元，年增2.22元。", "ts": "06:55", "who": "陳宏明", "seg": 6}]}], "quotes": [{"report": "2026-11-10", "quotes": [{"cat": "本季實績", "text": "首先我們看到的是營業收入，2025年第三季的營收是81.1億元，較上一季75.08億元增加了8%，那較去年同期的59.95億元增加了35%。", "anchor": "03:03", "who": "陳宏明", "seg": 4}, {"cat": "本季實績", "text": "接下來我們看到的是營業毛利的部分，在第三季的一個毛利率是36.3%，較上一季增加2.1%，那較去年同期增加了7.7%。", "anchor": "04:16", "who": "陳宏明", "seg": 5}, {"cat": "本季實績", "text": "接著我們看到基本每股盈餘EPS，第三季的EPS是3.48元，較上一季的2.4元增加了1.08元，那較去年同期的1.26元增加了2.22元。", "anchor": "06:55", "who": "陳宏明", "seg": 6}]}]}, {"key": "4939_2026-11-09", "code": "4939", "name": "亞洲電材", "date": "2026-11-09", "segs": [{"i": 0, "ts": "00:00:16", "sec": 16, "who": "發言人", "role": "公司", "text": "各位投資先進、法人朋友大家好。首先感謝國泰證券協助辦理本次的法人說明會，也謝謝大家長期以來對於亞電的關注跟支持。那我們今天的話會向大家介紹一下亞電2026年前三季的營運成果，還有公司的核心競爭能力，然後跟未來產品跟技術佈局的部分。"}, {"i": 1, "ts": "00:00:44", "sec": 44, "who": "發言人", "role": "公司", "text": "那這邊的話是本次法說會的免責聲明。有關未來市場發展、產品規劃還有營運展望的部分，都是依照我們目前公司所掌握到的資訊來跟大家做一個說明。那未來的話還是會受到市場的環境還有客戶需求，還有一些不確定性因素的影響，那實際結果可能跟預期會有差異，請提供給各位先進做參考。"}, {"i": 2, "ts": "00:01:14", "sec": 74, "who": "發言人", "role": "公司", "text": "那今天的簡報主要會分為四個部分，包含公司的概況還有主要產品的部分，那第二個部分的話是公司核心競爭能力，第三個部分的話是在今年前三季的營運狀況，那最後的話也是我們特別要跟大家說明的部分，就是在我們公司未來產品發展方向的技術佈局的部分。"}, {"i": 3, "ts": "00:01:46", "sec": 106, "who": "發言人", "role": "公司", "text": "那亞電的話是成立於2003年，那我們在2011年9月掛牌，總部是在竹北市。生產據點的部分則是在中國的昆山跟東台。目前的話我們全球的員工人數有241人。我們亞電的話是長期都是專注在電子材料的研發跟製造，過去的話主要是以軟性印刷電路板，就是FPC相關的材料為我們的核心業務。那近年來因為電子產業朝高頻高速的發展，所以說我們也有在持續的轉型擴大我們產品應用的部分。"}, {"i": 4, "ts": "00:02:32", "sec": 152, "who": "發言人", "role": "公司", "text": "從公司發展的歷程部分我們可以看到，其實亞電從2003年成立以後，基本上就是投入電子材料的技術開發。那早期的部分的話我們是以FPC相關的材料為主，那陸續推出了包含了EMI、導電膠跟一些高頻材料的部分。在2018年開始的時候我們就是有擴廠的動作，那就是設立了東台新廠，那一直到近年來的話其實都一直在做新產線的佈置。連化線的部分在今年3月的部分的話也已經正式投入量產。"}, {"i": 5, "ts": "00:03:12", "sec": 192, "who": "發言人", "role": "公司", "text": "主要生產據點的部分剛剛有提到主要是在昆山跟東台的部分。我們是透過這兩個生產據點的配置，依照公司不同產品的特性跟客戶需求去做適當的生產安排，去提高整個公司的營運效率。"}, {"i": 6, "ts": "00:03:31", "sec": 211, "who": "發言人", "role": "公司", "text": "這邊的話是主要產品的部分。我們可以看到我們主要產品的部分包含了基板跟各類的覆蓋膜、純膠，然後複合補強板這些。還有到EMI跟導電膠的部分，那基本上都是廣泛應用在所有的各類的電子產品。我們目前的話就是持續的朝高附加價值的材料去做發展，透過產品組合的調整的話去提高公司的獲利能力。"}, {"i": 7, "ts": "00:04:03", "sec": 243, "who": "發言人", "role": "公司", "text": "這邊這一頁的話主要是要跟大家說明PI，也就是聚醯亞胺材料特性的部分。PI的話它是屬於高性能的工業塑料，那在耐高溫、尺寸安定性還有機械強度跟電氣性能的部分的話都有很好的表現。所以說我們在亞電基本上長期累積PI相關的材料配方還有一些製程技術的部分，透過這個核心能力的部分也是我們未來發展一些高階膜材的重要基礎。"}, {"i": 8, "ts": "00:04:39", "sec": 279, "who": "發言人", "role": "公司", "text": "在純膠的發展歷程部分，我們其實公司從早期的環氧樹脂材料開始，逐步的朝高耐熱、低吸水率還有低傳輸損耗的產品去做發展。那這邊的話我們可以看到除了持續的朝低損耗的材料發展之外，我們目前的話其實也研發的方向朝碳氫的部分去做開發。這邊的話主要是要應應我們低損耗的部分，那我們這邊的話是Df的部分是已經小於萬分之五。"}, {"i": 9, "ts": "00:05:24", "sec": 324, "who": "發言人", "role": "公司", "text": "電磁波屏蔽膜就是我們說的EMI的部分，這個也是我們公司長期投入研發的一個重要產品之一。從2007年開始的投入到現在，我們現在後續建立了自主專利開發，然後到PI式的EMI，那這些的話都是我們多年累積下來的經驗。主要的話是因為現在的電子產品的部分朝高頻高速輕薄化的一些發展，所以說在整個電磁干擾防護的部分的話就變得越來越重要，所以說我們也會有相關產品的技術。"}, {"i": 10, "ts": "00:06:05", "sec": 365, "who": "發言人", "role": "公司", "text": "導電膠的部分也是我們公司自有技術跟專利佈局下的一個產品。從早期開發到現在的部分，我們持續的在改善它的導電性跟儲存的穩定性，跟剝離強度還有一些可靠度的部分。我們基本上希望透過產品性能的提升，去滿足不同材料對於不同電子產品對於材料的要求，拓展更多的應用的機會。"}, {"i": 11, "ts": "00:06:36", "sec": 396, "who": "發言人", "role": "公司", "text": "在自製PI覆蓋膜的部分，我們從2017年開始投入，基本上我們去逐步的提升我們的材料性能跟製程能力的部分。這邊的話也是朝著超薄型、高尺寸安定性還有低吸濕的方向去做發展。"}, {"i": 12, "ts": "00:07:00", "sec": 420, "who": "發言人", "role": "公司", "text": "在產品應用的部分我們可以看到，除了我們傳統的3C的應用之外，我們目前的話也是延伸到車載，然後醫療甚至到機器人的部分的話都是有所涉略。這個部分的話我們希望透過不同的市場的開拓，去降低對單一產業的依賴，去創造更多元的營收來源。"}, {"i": 13, "ts": "00:07:29", "sec": 449, "who": "發言人", "role": "公司", "text": "這邊的話是我們公司歷年來的股利發放狀況。我們基本上就是一直會去依據過去的營運結果，還有資金需求跟未來展望的部分去評估一個穩定的股利政策。我們可以看到我們2025年的部分雖然是虧損，但是我們還是配發了0.25元的現金股利，未來我們還是會朝這個方向持續穩定的股利政策去做發展。"}, {"i": 14, "ts": "00:08:03", "sec": 483, "who": "發言人", "role": "公司", "text": "接下來是核心競爭能力的部分。我們公司的競爭優勢的話主要有三個，第一個的話就是我們的專業研發團隊跟我們的材料技術的部分。因為我們亞電主要是在高分子材料配方，還有精密塗佈跟功能性膜材的部分是有多年的經驗，所以說我們可以依照客戶的需求去做產品的開發跟調整。那這邊也延伸到我們第二個競爭優勢的話就是我們差異化的策略。在亞電的部分我們不是追求單一產品的規模，我們是希望透過我們的高附加價值然後跟特殊功能的發展，去創造我們產品的差異化，透過產品升級的部分去提升我們的整個產品價值。那最後一個的話則是我們精密的設備跟製程管理能力的部分，包含我們有Roll-to-roll的製造設備，那跟線上的參數的回饋，然後CCD跟膜厚監控的部分的話，基本上都是我們提升產品品質跟製程穩定性的一個重要的配置。"}, {"i": 15, "ts": "00:09:23", "sec": 563, "who": "發言人", "role": "公司", "text": "接下來的話跟大家報告一下前三季營運狀況的部分。首先我們看到在第三季的合併損益表的部分，我們可以看到第三季的營收的部分的話大概是4.98億，那相較於第二季的部分的話QoQ的成長有14.53%，那跟去年同期相比的話有32%的成長，那這邊的話就是表示我們公司的營運規模是持續的在擴大。不過我們可以看到，雖然說第三季的營收的部分有上去，但是在毛利率的表現的部分的話相較於第二季的部分是有減少的。這邊的話主要是因為我們在今年上半年的時候有原物料漲價，基本上它在第三季的時候有逐步的開始反映出來。那我們有一部分雖然說轉嫁給我們的客戶，但是對毛利率還是有造成一定的影響。"}, {"i": 16, "ts": "00:10:24", "sec": 624, "who": "發言人", "role": "公司", "text": "那第三季總結來說的話，營業利益的部分的話大概是3,364萬，那稅後淨利的部分是2,246萬，那EPS的話是0.23。"}, {"i": 17, "ts": "00:10:39", "sec": 639, "who": "發言人", "role": "公司", "text": "這邊是我們的營收結構的部分。我們可以看到我們的營收來源主要還是在PI類的部分，那這邊PI的話包含了覆蓋膜、補強板跟複合膜相關的產品。另外在高頻材料、基材跟導電相關產品的部分也都是有營收貢獻。我們最近幾年的話基本上為了提高我們的獲利，所以說我們就是朝著高附加價值去調整我們的產品結構，希望提高我們高毛利產品的銷售比重。"}, {"i": 18, "ts": "00:11:23", "sec": 683, "who": "發言人", "role": "公司", "text": "接下來是資產負債表的部分。截至9月底的時候，我們可以看到我們公司的總資產的部分大概是31億，那股東權益的部分大概是16億，負債的部分的話是15億，負債比率的話是49.5%。現金的部分大概是4.48億。我們可以看到在整個營運成果的部分的話，第三季的存貨週轉天數從第二季的105天下降到84天，應收帳款週轉天數也從216天下降到203天，整個營運資金的管理的部分的話都是略有改善。"}, {"i": 19, "ts": "00:12:06", "sec": 726, "who": "發言人", "role": "公司", "text": "在現金流量的部分，前三季的營業活動淨現金流出大概是1.43億，這邊的話主要是受到我們整個營運規模擴大，所以說應收帳款跟存貨都是有增加的。另外在取得不動產、廠房設備的支出的部分大概有1.14億，這邊的話主要是我們持續的投入一些相關生產設備跟產能建置的支出。剛剛提到我們第三季季底的話我們的現金大概是4.48億，未來的話我們還是會去加強我們的應收帳款跟存貨的管理，去提高我們整個營運資金的使用效率。"}, {"i": 20, "ts": "00:12:56", "sec": 776, "who": "發言人", "role": "公司", "text": "在資本支出的部分的話，我們也會配合我們新產品的開發跟市場需求的部分，基本上我們都會是採分階段的投資策略去逐步的投入。"}, {"i": 21, "ts": "00:13:10", "sec": 790, "who": "發言人", "role": "公司", "text": "接下來最後一個部分的話就是我們公司未來發展的重要方向。這邊的話也是我們要跟大家重點說明的一個部分。亞電的話基本上近年來的話積極推動就是產品跟產業的轉型，希望我們可以從原本的FPC材料領域朝高階電子產品的部分去做發展。"}, {"i": 22, "ts": "00:13:36", "sec": 816, "who": "主管", "role": "公司", "text": "OK，接下來由我來補充一下。我們現在從軟板產業，這幾年也在積極轉型，從原來的軟板材料裡面在一些高速、高頻這個材料進到AI的應用。這裡可以看到我們大概是從MPI系列，因為我們以前是做PI嘛，我們大概是從到東台新廠的時候我們就積極要來把它轉型做到氟樹脂，所以對應的比如說M8、M9、M10，也就是從我們現在的MPI這個M7這一個材料轉到PTFE。那這個Df目前我們的水準大概在萬分之三。"}, {"i": 23, "ts": "00:14:31", "sec": 871, "who": "主管", "role": "公司", "text": "從材料最頂級的電性能要最好，在高速、高頻下目前來講PTFE是一個最好的選項。大概在兩年前我們在想要推廣這個材料的時候，思考一個題目，就是因為軟板以前的解法是用一種叫做LCP的方法在解，全部都是熱塑型的解法，廣泛用在蘋果。那因為現在在高速應用的時候，這個大概是LCP是一個極致了，它大概是到萬分之二十，也都差不多在一個M8的水準，大概就到LCP。如果你要再更高階，這部分就要用到氟樹脂的這個系列下去。"}, {"i": 24, "ts": "00:15:28", "sec": 928, "who": "主管", "role": "公司", "text": "因為這個氟樹脂類目前因為在做M9以上，遇到就是那個碳氫，遇到你Df要做到萬分之七到萬分之九確實是很難，所以它只能加Q布，也就是從原來的玻璃布要再upgrade到石英布，你電性能才能符合。那因為PTFE的特性非常好，但是因為Q布又不好加工以外，Q布事實上它的產量也受到一些限制，所以也因為這樣因為因應未來他們也定義一個方向，看是不是用PTFE加上一個叫Coreless，就是希望因為布有一個經緯線，這塊對電性還是有影響，所以就一個大趨勢會有人出來，大家現在統稱叫Coreless，也就是無布化的趨勢。"}, {"i": 25, "ts": "00:16:33", "sec": 993, "who": "主管", "role": "公司", "text": "那這個其實無布化在ABF其實在另外一個材料，或是早期RCC，這個其實在硬板裡面事實上已經被討論很久了。因為它現在這個原材料都短缺情況之下，我們也看好在M9、M9+、M10，也希望用Coreless的PTFE的基板能夠進入這個供應鏈裡面，這是第一個我們強調的。"}, {"i": 26, "ts": "00:17:03", "sec": 1023, "who": "主管", "role": "公司", "text": "那另外第二個部分就是在PP的部分，因為你現在若玩PTFE或是玩LCP它加工溫度非常的高，大概溫度要到400度這種高壓機，這個確實是有一些很強的技術門檻。所以在這塊裡面其實還有一個解決方案就是Hydrocarbon，也就是熱固型的這個解決方案，包括PP裡面含Q布也好或是Coreless。我們主要的途徑就是因為PTFE這個氟膜，這是我們在軟板裡面我們另外一個核心五次元架構能力，所以未來把我們現在的這個結合Hydrocarbon加上PTFE的樹脂會做一些mix的一個解法。"}, {"i": 27, "ts": "00:18:00", "sec": 1080, "who": "主管", "role": "公司", "text": "那目前剛剛我們Monica大概有提到我們在碳氫部分，我們的Df目前已經做到在萬分之五左右。那我們再搭上這個PTFE的這個特性的話，我相信這個部分在M9、M10這個部分的空間就很大。這大概是我們的技術路徑，這個就是在AI的材料部分。那另外一個轉型，另外一個轉型就是我們就是半導體。另外我們這個抗翹曲膜事實上我們在多年前就已經有設計，那目前這個企劃也在進行中，主要我們現在因為針對也有一些在有些關鍵的核心技術我們用在半導體的一些其他應用，所以這題我們是持續在進行推廣。不過因為最近這個PTFE這個題目，我們還是放比較多的心思在這個AI應用上面。"}, {"i": 28, "ts": "00:19:01", "sec": 1141, "who": "主管", "role": "公司", "text": "另外一個就是我們的專利佈局。因為老實說做材料就是千金難買早知道，如果說已經看到這個需求的時候我們再介入這一個開發的話，事實上這個時間都太晚了。所以你也可以看到剛剛Monica在介紹我們之前那個材料，其實我們所有材料在開發我們大概都是至少都10年前，或是20年前事實上我們就已經做了很大的佈局。好，那今天大概就跟各位先進報告到這裡。"}, {"i": 29, "ts": "00:19:38", "sec": 1178, "who": "主持人", "role": "主持人", "text": "好，那我們謝謝公司的說明。那我們現在就進入Q&A的時間。那這邊的話有兩題要請教公司。首先第一題的話是主要請教PTFE Hybrid產品客戶驗證的進度。公司目前積極發展PTFE搭配PP的Hybrid材料，請問目前客戶驗證的進度如何？已經進入哪些階段？是材料測試、打樣、PCB端製程驗證，還是已經進入客戶正式量產？另外預計最快何時有機會取得客戶認證並開始小量出貨或量產？以上請教公司。"}, {"i": 30, "ts": "00:20:20", "sec": 1220, "who": "主管", "role": "公司", "text": "OK，我剛剛也大概有提一下，因為現在因為光纖這個伺服器板廠商現在生意都非常的好，那其實現在都在缺料。那其實你要做高階，我們現在在玩這個AI的材料裡面，你真的要更高階的部分就像現在是M9材料。那大概M9材料現在已經有答案了，就是一般都是用Q布去解，去用碳氫樹脂用Q布作為基板，那做成M9的Q布的PP去解。那這個在M9的部分大概是這樣子。那我個人是判斷，因為你到2027、2028這個Q布這一端的因為這裡面其實還有一些方案，就是我們現在講這個PTFE方案，部分人家是看好這件事情。因為這個Q布上剛剛在講Coreless，就把Coreless的這個方案用在我們的M10的PTFE的基板，上這個用M10它大概做出來做到M10的結構，那它加上這個M9的PP，M9的PP就是你用石英布去去做，那當然也可以做M9或是M9+，這個是有一個比較大的機會，這是在高階的部分。"}, {"i": 31, "ts": "00:21:50", "sec": 1310, "who": "主管", "role": "公司", "text": "說實話蠻看好這個方案，那這個現在目前都還在進行中。那剛剛還有一個我剛剛可能要補充一下，就是現在其實在最高階的材料裡面它現在M9已經有答案，但是當你要到M10這邊的方案的部分，現在這一題其實大家目前就是說良率上的爬升事實上這也是蠻大的問題。所以這一題也是我們一個比較大的機會。比較大的機會就是說我們可以用PTFE Film，也就是說我們亞電有什麼不一樣，就是我們在PTFE膜的這邊的製程上面的進展上面我們是比較早期投入，所以更用這個PTFE的這個樹脂去混搭這個Hydrocarbon來做解決方案。那目前這些事情我們都算在進行中，比較不方便跟各位先進講詳細，因為這也是保密。那這一題是我個人是這個方案是覺得是在長期來看是蠻有機會。"}, {"i": 32, "ts": "00:22:54", "sec": 1374, "who": "主持人", "role": "主持人", "text": "好，謝謝公司的說明。第二題是想跟公司請教高階高速材料與國際競爭者的差異。目前國際材料廠持續朝M8、M9甚至更高階材料發展，台灣廠商也積極佈局PTFE及低損耗材料，請問亞洲電材在高速材料的競爭優勢主要昰甚麼？相較於日系材料廠及國內同業，公司在材料配方、加工技術、成本或客戶認證上最具差異化的地方在哪裡？"}, {"i": 33, "ts": "00:23:30", "sec": 1410, "who": "主管", "role": "公司", "text": "我之前其實是蠻先進硬板廠，硬板廠大家都很有名，因為他們就是用玻纖布含浸的製程做。那我們這幾年就是因為軟板部分是不一樣的，大概就是沒有沒有所謂的布，也就是沒有布的一個process去做。也就是做軟板裡面我們做的東西大概就是沒有布的一個技術在發展。那這麼多年來我們就是為了像早期的MPI，包括LCP，那後來我們就進階到氟樹脂的這種。也就是說現在目前對亞電來講，我們跟一般材料廠商比較我們會有不一樣的地方就是這個氟膜的這個氟樹脂這一塊的掌握，大概是我們跟跟一般材料廠商會比較大的一個比較，也就是這塊我們專注了很長的時間在進行。那用這樣一個膜去做出一個混搭，比如說我們對它加上Hydrocarbon，把它做成這種熱固型的PP的一個模式來進行。那這樣方向來說的話，後面在做M10這一塊的空間我們就會這個空間的一個設計會變成是，我認為是就會變成一些亮點會出現，也就是差異性會出來。"}, {"i": 34, "ts": "00:25:04", "sec": 1504, "who": "主持人", "role": "主持人", "text": "好，謝謝公司的回答。那我們今天亞電的線上法說就到此結束，謝謝。"}], "qa": null, "chars": 6147, "last_min": 25, "cpm": 245, "status": "full", "memo": [{"title": "營收", "points": [{"text": "2026年第三季營收約4.98億元，季增14.53%，年增32%，營運規模持續擴大。", "ts": "00:09:34", "who": "發言人", "seg": 15}]}, {"title": "毛利與獲利", "points": [{"text": "第三季毛利率較第二季下滑，主因上半年原物料漲價於第三季逐步反映。", "ts": "00:10:01", "who": "發言人", "seg": 15}, {"text": "第三季營業利益為3,364萬元，稅後淨利為2,246萬元，單季EPS為0.23元。", "ts": "00:10:28", "who": "發言人", "seg": 16}]}, {"title": "產品與技術", "points": [{"text": "積極佈局AI與高頻高速材料，從MPI逐步轉向氟樹脂（PTFE）領域，對應M8、M9、M10規格。", "ts": "00:14:08", "who": "主管", "seg": 22}, {"text": "現有PTFE材料之介電損耗（Df）水準約在萬分之3左右。", "ts": "00:14:27", "who": "主管", "seg": 22}, {"text": "為因應玻纖布在更高階傳輸產生的經緯線電性影響，積極朝無布化（Coreless）趨勢發展PTFE基板。", "ts": "00:16:17", "who": "主管", "seg": 24}, {"text": "針對半導體相關應用，公司亦持續推廣抗膠殘膜等關鍵技術。", "ts": "00:18:27", "who": "主管", "seg": 27}]}, {"title": "股利與資本", "points": [{"text": "維持穩定股利政策，2025年雖虧損仍配發0.25元現金股利。", "ts": "00:07:47", "who": "發言人", "seg": 13}, {"text": "截至2026年9月底，公司總資產約31億元，負債比率為49.5%，現金約4.48億元。", "ts": "00:11:30", "who": "發言人", "seg": 18}, {"text": "前三季資本支出中，取得不動產、廠房及設備支出約1.14億元。", "ts": "00:12:28", "who": "發言人", "seg": 19}]}, {"title": "Q&A", "points": [{"text": "問：PTFE Hybrid產品客戶驗證進度及何時開始小量出貨或量產？／答：目前高階M9多採Q布搭配碳氫樹脂，但到M10時良率爬升是關鍵問題；公司提早佈局PTFE薄膜與樹脂混合熱固型PP配方，目前各項驗證仍在進行中，長期來看深具機會。", "ts": "00:19:48", "who": "主管", "seg": 29}, {"text": "問：亞洲電材相較日系材料廠及同業在高速材料的競爭優勢與差異化為何？／答：公司長年深耕軟板無布化製程，具備氟薄膜與氟樹脂的核心掌握力，能結合熱固型樹脂做成熱固型PP，在M10領域形成顯著差異化亮點。", "ts": "00:22:56", "who": "主管", "seg": 32}]}], "quotes": []}, {"key": "8299_2026-11-06", "code": "8299", "name": "群聯", "date": "2026-11-06", "segs": [{"i": 0, "ts": "00:00:00", "sec": 0, "who": "講者", "role": "公司", "text": "This is Jeff Oiler. I'm head of research at Macquire in Taiwan."}, {"i": 1, "ts": "00:00:04", "sec": 4, "who": "講者", "role": "公司", "text": "So very happy to be co-hosting uh Phison's third quarter earnings conference with Phison CEO K.S. Pua."}, {"i": 2, "ts": "00:00:11", "sec": 11, "who": "講者", "role": "公司", "text": "Uh K.S. will do a uh presentation to go over the earnings."}, {"i": 3, "ts": "00:00:14", "sec": 14, "who": "講者", "role": "公司", "text": "Um and then we'll go into Q&A."}, {"i": 4, "ts": "00:00:16", "sec": 16, "who": "講者", "role": "公司", "text": "So a lot going on in AI, in tech, in NAND and memory."}, {"i": 5, "ts": "00:00:21", "sec": 21, "who": "講者", "role": "公司", "text": "So looking forward to begin with what K.S. has to say."}, {"i": 6, "ts": "00:00:22", "sec": 22, "who": "講者", "role": "公司", "text": "So thank you K.S. for letting me join with you."}, {"i": 7, "ts": "00:00:24", "sec": 24, "who": "講者", "role": "公司", "text": "Pass over to you."}, {"i": 8, "ts": "00:00:25", "sec": 25, "who": "K.S. Pua", "role": "公司", "text": "Yeah. Thanks, uh, Jeff."}, {"i": 9, "ts": "00:00:26", "sec": 26, "who": "K.S. Pua", "role": "公司", "text": "Uh, good afternoon, good morning, uh, distinguished men to join Phison our NC23 our, uh, earning call."}, {"i": 10, "ts": "00:00:34", "sec": 34, "who": "K.S. Pua", "role": "公司", "text": "So let's restart."}, {"i": 11, "ts": "00:00:41", "sec": 41, "who": "K.S. Pua", "role": "公司", "text": "Okay. Uh, this is our breakdown of our CQ3's, uh, revenue."}, {"i": 12, "ts": "00:00:47", "sec": 47, "who": "K.S. Pua", "role": "公司", "text": "So in this chart you can see by our definition, our so-called the AI ecosystem module."}, {"i": 13, "ts": "00:00:55", "sec": 55, "who": "K.S. Pua", "role": "公司", "text": "Uh, over 50%, 57% of our Q3 total revenue and the growth QoQ at 88%."}, {"i": 14, "ts": "00:01:03", "sec": 63, "who": "K.S. Pua", "role": "公司", "text": "This to show the AI, uh, related ecosystem SSD, boot drive, adaptive, the demand is still getting very strong."}, {"i": 15, "ts": "00:01:12", "sec": 72, "who": "K.S. Pua", "role": "公司", "text": "The reason we show our embedded ODM industrial, the QoQ here just want to some analysts that may write, okay."}, {"i": 16, "ts": "00:01:21", "sec": 81, "who": "K.S. Pua", "role": "公司", "text": "They say, hey, the consumer market, the embedded market, PC, smartphone, IoT."}, {"i": 17, "ts": "00:01:25", "sec": 85, "who": "K.S. Pua", "role": "公司", "text": "Yes, this market now they have a headwind and, uh, the trailer is a cost increase that much."}, {"i": 18, "ts": "00:01:31", "sec": 91, "who": "K.S. Pua", "role": "公司", "text": "The consumer may not able to take it."}, {"i": 19, "ts": "00:01:33", "sec": 93, "who": "K.S. Pua", "role": "公司", "text": "So embed ODM our CQ3 with minus 7%."}, {"i": 20, "ts": "00:01:37", "sec": 97, "who": "K.S. Pua", "role": "公司", "text": "Uh, and the industrial module with minus 30% in the QoQ."}, {"i": 21, "ts": "00:01:43", "sec": 103, "who": "K.S. Pua", "role": "公司", "text": "Uh, if Phison, we still stock in the consumer or embedded market, then we may suffer increasedly some other module house CQ3 revenue dropping."}, {"i": 22, "ts": "00:01:53", "sec": 113, "who": "K.S. Pua", "role": "公司", "text": "I think they're mainly stuck in this industrial."}, {"i": 23, "ts": "00:01:56", "sec": 116, "who": "K.S. Pua", "role": "公司", "text": "But again, we have our solution in the enterprise AI and related business."}, {"i": 24, "ts": "00:02:02", "sec": 122, "who": "K.S. Pua", "role": "公司", "text": "Okay."}, {"i": 25, "ts": "00:02:03", "sec": 123, "who": "K.S. Pua", "role": "公司", "text": "And the controller-wise, even though, uh, this year, the smartphone declining, PC declining, retail SSD frozen, but our total controller shipment by unit will increase, by revenue it will increase."}, {"i": 26, "ts": "00:02:18", "sec": 138, "who": "K.S. Pua", "role": "公司", "text": "Means what? Means Phison we win the market share in our controllers business."}, {"i": 27, "ts": "00:02:22", "sec": 142, "who": "K.S. Pua", "role": "公司", "text": "And the retail is, uh, since early this year, we already highlight, retail is not our focus at this moment, so it's only 2% of our business."}, {"i": 28, "ts": "00:02:32", "sec": 152, "who": "K.S. Pua", "role": "公司", "text": "But, again, after the other two, three quarters, this declining in embedded industrial definitely will bounce back."}, {"i": 29, "ts": "00:02:41", "sec": 161, "who": "K.S. Pua", "role": "公司", "text": "Why? Because a lot of device equipment they still have to renew, they have to upgrade."}, {"i": 30, "ts": "00:02:48", "sec": 168, "who": "K.S. Pua", "role": "公司", "text": "So we keep our R&D development in this two field to make sure after two, three, four quarters, we will back to this industrial to secure our share and our gross margin."}, {"i": 31, "ts": "00:02:59", "sec": 179, "who": "K.S. Pua", "role": "公司", "text": "Let me have a mandarin to explain since a more mandarin speaker here."}, {"i": 32, "ts": "00:03:04", "sec": 184, "who": "K.S. Pua", "role": "公司", "text": "第三季呢，我們的營收是有顯著的成長，特別呢在AI生態系統相關呢，我們的QoQ成長88%，總營收呢佔我們的50%以上，這個符合我們當初的預估。"}, {"i": 33, "ts": "00:03:17", "sec": 197, "who": "K.S. Pua", "role": "公司", "text": "那，我們今天要特別強調呢，在嵌入式ODM跟工業應用這塊可以看到，這個是手機PC，其實整個銷量是下來的，我們也策略性的選擇呢，低價的生意不錯。"}, {"i": 34, "ts": "00:03:31", "sec": 211, "who": "K.S. Pua", "role": "公司", "text": "那工業用呢是因為所有的成本缺料跟這個太高，這個單價太高，所以呢造成整個需求瞬間的這個減少。"}, {"i": 35, "ts": "00:03:39", "sec": 219, "who": "K.S. Pua", "role": "公司", "text": "那對我們呢，看到有30%的一個衰退。"}, {"i": 36, "ts": "00:03:43", "sec": 223, "who": "K.S. Pua", "role": "公司", "text": "消費類呢是更嚴重，40%。"}, {"i": 37, "ts": "00:03:45", "sec": 225, "who": "K.S. Pua", "role": "公司", "text": "那我們要強調一個控制器呢，雖然今年的消費性市場幾乎是冷凍，那PC消退，然後手機下降，但是我們的出貨量還在成長，營收也在成長。"}, {"i": 38, "ts": "00:03:59", "sec": 239, "who": "K.S. Pua", "role": "公司", "text": "這表示什麼？"}, {"i": 39, "ts": "00:04:00", "sec": 240, "who": "K.S. Pua", "role": "公司", "text": "表示呢我們過去的努力，技術努力，我們的這個Market share是在成長的。"}, {"i": 40, "ts": "00:04:06", "sec": 246, "who": "K.S. Pua", "role": "公司", "text": "總個市場是衰退，我們出貨量還在成長，表示我們的成長率挺高的。"}, {"i": 41, "ts": "00:04:11", "sec": 251, "who": "K.S. Pua", "role": "公司", "text": "那這編我要特別的強調一次，群聯電子呢如果過去沒有努力在AI的生態系統企業級適應這邊去找力的話呢，我們如果只在這個生意，那就符合某些分析師講的衰退。"}, {"i": 42, "ts": "00:04:26", "sec": 266, "who": "K.S. Pua", "role": "公司", "text": "那，我們同業裡面也出現這樣的情況了哦。"}, {"i": 43, "ts": "00:04:29", "sec": 269, "who": "K.S. Pua", "role": "公司", "text": "那，我們從年初已經開始有特別的強調，我們呢研發資源會往AI落地企業級應用來這個加碼。"}, {"i": 44, "ts": "00:04:38", "sec": 278, "who": "K.S. Pua", "role": "公司", "text": "那也因為有我們的這個過去的努力，所以第三季呢我們的營收還是有很顯著的一個成長。"}, {"i": 45, "ts": "00:04:46", "sec": 286, "who": "K.S. Pua", "role": "公司", "text": "這邊呢我覺得有必要呢做一個比較詳細的報告，讓免免得說這個螢幕混珠，覺得這個評估來評估去，沒有看到一個重點啦。"}, {"i": 46, "ts": "00:04:57", "sec": 297, "who": "K.S. Pua", "role": "公司", "text": "Uh 30 minutes ago we just released our earnings."}, {"i": 47, "ts": "00:05:03", "sec": 303, "who": "K.S. Pua", "role": "公司", "text": "Our gross margin in the CQ3 is 51 billion, gross profit QoQ 15% and gross profit up 700% YoY."}, {"i": 48, "ts": "00:05:13", "sec": 313, "who": "K.S. Pua", "role": "公司", "text": "Revenue wise CQ3 86 billion is a all-time high, follow our expectations."}, {"i": 49, "ts": "00:05:22", "sec": 322, "who": "K.S. Pua", "role": "公司", "text": "This part we like to show you gross margin wise, since CQ2 we are ready to highlight."}, {"i": 50, "ts": "00:05:30", "sec": 330, "who": "K.S. Pua", "role": "公司", "text": "To maintain the 60 mid 60% gross margin is not a reality because the market, the cost increasing, but we still able to close to 60% gross margin."}, {"i": 51, "ts": "00:05:46", "sec": 346, "who": "K.S. Pua", "role": "公司", "text": "But as a CQ1 I also keep highlighting that the gross margin rate will decline, but the amount, total amount of gross margin actually we are increasing."}, {"i": 52, "ts": "00:05:56", "sec": 356, "who": "K.S. Pua", "role": "公司", "text": "So this is to show our business configurations we move more into enterprise, even though embedded ODM consumer industrial declining, but our gross margin still able to increase."}, {"i": 53, "ts": "00:06:10", "sec": 370, "who": "K.S. Pua", "role": "公司", "text": "這邊在強調一次，當然過去講說低價庫存單，這個我想講的在某個領域是對的，在消費類啦等等是對的。"}, {"i": 54, "ts": "00:06:20", "sec": 380, "who": "K.S. Pua", "role": "公司", "text": "但是呢，雖然我一直認為說要維持一個高於60%的一個毛利率，以我們來講是一個很困難的工作。"}, {"i": 55, "ts": "00:06:29", "sec": 389, "who": "K.S. Pua", "role": "公司", "text": "那，我們努力呢會維持我們的相對好的毛利率，但是呢我們認為我們毛利率會增加，這個就是我們今天證明。"}, {"i": 56, "ts": "00:06:38", "sec": 398, "who": "K.S. Pua5", "role": "公司", "text": "那我想呢往後的毛利毛利的成長呢是我們可以期待的，也是我們努力的，而且我認為我們是可以達到的。"}, {"i": 57, "ts": "00:06:50", "sec": 410, "who": "K.S. Pua", "role": "公司", "text": "Earning per share 138 is our all-time high."}, {"i": 58, "ts": "00:06:54", "sec": 414, "who": "K.S. Pua", "role": "公司", "text": "We have a around 20 EPS growth from CQ2."}, {"i": 59, "ts": "00:07:00", "sec": 420, "who": "K.S. Pua", "role": "公司", "text": "So back to the income stateme et's see, I don't see any more questions on there.  I think, uh, maybe pass it back to you for final comments?  Okay, last, uh, you know, uh, since the last six months, we've been challenged to, okay, low cost inventory.  Please don't come to us to mention anything about low-cost inventory because low-cost inventory in the consumer SSD, yes, but not much dedicated to Phison.  They may lead to the more module house, they are not consistent invested into R&D.  We are good because, uh, heavy investment for many years, enterprise we proof, we prove.  When I start to talk about AI data platform to the market, they also ask, hey, who are you?  Why you have a confidence you can make it?  My answer is sorry, I don't know if I can make it or not.  But, enterprise SSD last seven years, we prove it.  In the AI data platform business, we invest three years already, we hire people, we keep investing, we engage.  I believe with the Phison heavy R&D investment, our commitment, our smart, working hard, next year, please wait to see how we deliver our result to you, not only AI ecosystem, but also AI data platform.  So, please trust to us, not to blame us too much.  Not too much negative, please, because we are working hard.  Today we prove something saying six months ago, we we prove, we prove we are good.  So, give us more encouragement, we will deliver more back to you.  Thank you.  Great, thanks, KS.  Thanks for including me and thanks everyone for joining today.  Have a good night.  Yeah, thank you."}], "qa": null, "chars": 56464, "last_min": 32, "cpm": 1756, "status": "full", "memo": [{"title": "亮點", "points": [{"text": "群聯2026年第三季單季營收達86億元創歷史新高，毛利率為51%，毛利年增700%、季增15%。", "ts": "00:05:03", "who": "CEO", "seg": 47}]}, {"title": "毛利與獲利", "points": [{"text": "群聯2026年第三季單季毛利達51億元，毛利率為51%。", "ts": "00:05:03", "who": "CEO", "seg": 47}]}, {"title": "Q&A", "points": [{"text": "問：請教關於第三季依ASP與模組的成長與改良？／答：主要是Unit Shipment單顆出貨量增加，ASP價格相對平穩且包含部分新產品客製化。說明如下…", "ts": "00:29:46", "who": "分析師", "seg": 277}, {"text": "問：關於PC需求及NAND Flash記憶體定價，請問群聯對2027-2028年毛利率的看法？／答：PC需求自CQ2已預見下滑，但群聯營收與毛利持續成長。說明如下…", "ts": "00:35:36", "who": "分析師", "seg": 301}, {"text": "問：關於中國曝光與虹生控股表現，以及2027年中國PC與消費市場的看法？／答：虹生控股預計在香港上市，群聯維持與其合作並持續布局企業級AI方案。說明如下…", "ts": "00:42:21", "who": "分析師", "seg": 301}, {"text": "問：針對AI Adapter Plus與NVIDIA Partner等產品商業化成果量化？／答：Pascal企業級AI方案推廣兩年，明年將公布具體數據。說明如下…", "ts": "00:45:51", "who": "分析師", "seg": 301}, {"text": "問：關於整體中國曝光度以及鴻海等同業在香港上市的影響？／答：虹生控股預計11月12日於香港IPO上市，群聯與其合作表現穩健，明年將持續推動企業級AI方案。說明如下…", "ts": "00:46:21", "who": "分析師", "seg": 301}, {"text": "問：關於電力供應瓶頸對硬體（記憶體晶片）需求的潛在影響？／答：電力供應是約束之一，記憶體需求依賴伺服器與供應鏈投資，群聯致力提供更具能源效率的AI方案。說明如下…", "ts": "00:55:18", "who": "分析師", "seg": 301}]}], "quotes": []}, {"key": "6781_2026-11-06", "code": "6781", "name": "AES-KY", "date": "2026-11-06", "segs": [{"i": 0, "ts": "01:32", "sec": 92, "who": "主持人 Angela", "role": "主持人", "text": "AES的管理層與與會的投資人，大家下午好。我是華華研究證券的分析師Angela。非常榮幸今天能夠邀請到AES的管理層，總經理Jerry Song、財務長Amy Zhang，來舉辦第三季的法人說明會。今天的議程會先由財務長更新三季度的季報，接下來由總經理分享公司的營運展望，再來會由我來主持問答的環節。"}, {"i": 1, "ts": "02:14", "sec": 134, "who": "財務長 Amy Zhang", "role": "公司", "text": "各位投資先進午安，我是代表AES-KY的財務長張純娟。接下來由我跟各位簡介AES-KY 2026年Q3及1到3季的財務狀況表現。首先我們看到的第一頁是風險提示項目，請各位投資先進自行參閱。"}, {"i": 2, "ts": "02:42", "sec": 162, "who": "財務長 Amy Zhang", "role": "公司", "text": "首先我們看到的是第三季的數據。我們2026年Q3營業數字是52.34億，QoQ成長是8.87%，YoY成長是26.76%。接下來是毛利及毛利率，Q3毛利金額是18.98億，毛利率是36.27%，QoQ成長是1.10%，YoY成長是31.61%。"}, {"i": 3, "ts": "03:12", "sec": 192, "who": "財務長 Amy Zhang", "role": "公司", "text": "接下來是營業淨利及營業費用，本季的營業淨利是12.85億，QoQ衰退1.95%，YoY成長是34.17%。接下來是稅前淨利及稅前淨利率，2026年Q3稅前淨利是13.51億，QoQ衰退2.49%，YoY成長33.28%。"}, {"i": 4, "ts": "03:41", "sec": 221, "who": "財務長 Amy Zhang", "role": "公司", "text": "接下來是淨利及淨利率，2026年Q3淨利是10.67億，QoQ衰退2.43%，YoY成長33.71%。接下來是我們單季的EPS是12.5，QoQ衰退2.42%，YoY成長36.69%。以上是我們Q3的財務數據更新。"}, {"i": 5, "ts": "04:09", "sec": 249, "who": "財務長 Amy Zhang", "role": "公司", "text": "接下來我們來看1到3季的財務數據。首先我們看到的是營業收入，2026年1到3季營業收入是145億，YoY成長是26.28%。接下來是毛利及毛利率，1到3季毛利是54.12億，毛利率是37.14%，YoY成長是27.95%。"}, {"i": 6, "ts": "04:38", "sec": 278, "who": "財務長 Amy Zhang", "role": "公司", "text": "接下來是營業淨利及營業費用，前三季營業淨利是36.09億，YoY成長是34.17%。稅前淨利金額是38.92億，YoY成長是25.07%。稅後淨利金額是30.70億，YoY成長是25.21%。最後看每股EPS，1到3季每股EPS是35.95，YoY成長是25.22%。以上就是AES-KY 1到3季財務數據更新。"}, {"i": 7, "ts": "05:31", "sec": 331, "who": "主持人 Angela", "role": "主持人", "text": "謝謝Amy的更新。接下來我們由我們的總經理來做一些展望的分享。"}, {"i": 8, "ts": "05:39", "sec": 339, "who": "總經理 Jerry Song", "role": "公司", "text": "各位投資先進大家下午好，我是AES-KY的Jerry宋為哲。很高興有機會又可以跟大家分享一下整個公司的狀況。我記得去年的時候我們預期今年會是資料中心成長很強勁的一年，實際上大概跟我們預期也差不多。業界對於資料中心下游硬體的成長大概沒有太大的疑問。"}, {"i": 9, "ts": "06:14", "sec": 374, "who": "總經理 Jerry Song", "role": "公司", "text": "今年大概還是圍繞在幾個部分。第一，我們業績構成主要還是大家最關心的資料中心。我們去年講過今年會是低壓BBU轉高壓的過渡時間。我們現在看法還是一樣，隨著GPU、TPU或ASIC晶片耗電需求不斷上升，往高壓走是必經過程。"}, {"i": 10, "ts": "07:05", "sec": 425, "who": "總經理 Jerry Song", "role": "公司", "text": "我們本來預計今年年底高壓BBU有機會量產，不過看起來正負400伏進度會比較明顯一些，800伏部分會稍微慢一點。主要原因是除了BBU本身具挑戰外，系統端SI包含電源、Supercapacitor等整合挑戰也蠻多的。"}, {"i": 11, "ts": "07:59", "sec": 479, "who": "總經理 Jerry Song", "role": "公司", "text": "展望明年，我們與下游SI及CSP保持良好溝通，覺得明年的需求整體還是會非常強勁。隨著GPU與ASIC晶片疊代，Power需求上升，在HVDC尚未全數Ready時，會先採用傳統低壓產品線去做建設。只要Power需求上升，BBU這塊我們覺得明年依然是非常強勁的一年。"}, {"i": 12, "ts": "10:04", "sec": 604, "who": "總經理 Jerry Song", "role": "公司", "text": "對於公司其他幾個Segment，除了AI資料中心伺服器外，我們更希望整個公司有更多多元業務。Telecom部分今年已經開始量產，預計明年會進一步放大。明年我們陸續在AGV、AMR、Robotics這塊業務，在明年都會放量，客戶都是國際一線大客戶，產品ASP也挺高。"}, {"i": 13, "ts": "11:37", "sec": 697, "who": "總經理 Jerry Song", "role": "公司", "text": "如果BBU明年的成長是一定幅度的話，我們對於明年其他新生意成長的預期，成長幅度會大於BBU的成長幅度。也就是說BBU非常強勁，但我們對其他新生意的看法，明年會是開發結果的一年，到了後年會是整體週期的放量期。"}, {"i": 14, "ts": "13:36", "sec": 816, "who": "總經理 Jerry Song", "role": "公司", "text": "我們公司也一直在尋找併購或新生意機會，非常認真看待併購這件事，藉由併購的方式取得人才與市場。總而言之，我們覺得明年還是成長強勁的一年，我們更著重於多元產品線的擴展。"}, {"i": 15, "ts": "15:04", "sec": 904, "who": "主持人 Angela", "role": "主持人", "text": "非常謝謝總經理強勁的說明展望。接下來我們進入問題的環節，我們先針對事前收集到的問題提問。"}, {"i": 16, "ts": "15:21", "sec": 921, "who": "主持人 Angela", "role": "主持人", "text": "第一題是關於第四季的展望與訂單能見度，請問公司如何看待第四季營收與毛利率走勢？訂單能見度是否能延伸到明年上半年？客戶交貨排程是否明朗？"}, {"i": 17, "ts": "15:42", "sec": 942, "who": "總經理 Jerry Song", "role": "公司", "text": "第四季我們基本上應該是一樣非常穩定的成長。我們跟CSP客戶互動密切，目前客人反饋相當正面，沒有看到太大明顯的修正。毛利率主要還是因為產品組合變化，公司會儘可能維持毛利率甚至增加毛利率方向努力。"}, {"i": 18, "ts": "16:37", "sec": 997, "who": "主持人 Angela", "role": "主持人", "text": "第二題是關於產業展望，公司如何看待2027年BBU市場成長？主要動能來自滲透率提升、新資料中心容量，還是每MW價值量增加？"}, {"i": 19, "ts": "16:53", "sec": 1013, "who": "總經理 Jerry Song", "role": "公司", "text": "這三個都會有。新客戶貢獻使滲透率增加；資料中心隨著GPU瓦數上升帶動容量；高壓與高Power產品也讓每瓦單價提高。隨著產品從早期3kW、5kW走到16kW、20kW以上，單位瓦數單價越高，挑戰與零件成本也越高。"}, {"i": 20, "ts": "18:48", "sec": 1128, "who": "總經理 Jerry Song", "role": "公司", "text": "關於新客戶貢獻，我們有好幾個新客戶機會，一直跟各大CSP與SI合作，終端客戶都會發酵。"}, {"i": 21, "ts": "19:32", "sec": 1172, "who": "主持人 Angela", "role": "主持人", "text": "第三題是關於滲透率，目前各大雲端供應商BBU導入程度有何差異？AI與一般伺服器採用率是否不同？"}, {"i": 22, "ts": "19:54", "sec": 1194, "who": "總經理 Jerry Song", "role": "公司", "text": "終端客戶一旦決定BBU架構後，不論是採用自研ASIC還是NVIDIA GPU，都會依據機櫃瓦數選擇對應的BBU數量。CSP廠商主要導入BBU設計後，傳統伺服器與AI Inference/Training伺服器都會採用BBU架構，差別在於選用的Power大小與BBU數量不同。"}, {"i": 23, "ts": "23:21", "sec": 1401, "who": "主持人 Angela", "role": "主持人", "text": "第四題是關於HVDC高壓直流架構影響，客戶若轉上高壓直流架構後，BBU配置與對AES供應鏈地位有何影響？"}, {"i": 24, "ts": "23:44", "sec": 1424, "who": "總經理 Jerry Song", "role": "公司", "text": "電池備援牽涉到Sidecar架構，包含PSU、CBU、電池等。高壓架構能量密度高，但在安全與安規挑戰極大。我們能提供不同的配套Solution，對於能解決高難度技術的廠商來說，在競爭Barrier、單價與Profit上都是好事。"}, {"i": 25, "ts": "28:50", "sec": 1730, "who": "主持人 Angela", "role": "主持人", "text": "第五題是關於競爭門檻，AES贏得新BBU專案的主要優勢是什麼？"}, {"i": 26, "ts": "29:11", "sec": 1751, "who": "總經理 Jerry Song", "role": "公司", "text": "電池本身是相對危險的產品線，從低瓦數一路累積技術經驗到高瓦數，需要龐大的Design guideline與可靠度累積，新供應商很難跳過低階直接做高階。終端CSP對有Shipping track record的廠商信任度高，這是我們最大優勢。"}, {"i": 27, "ts": "31:19", "sec": 1879, "who": "主持人 Angela", "role": "主持人", "text": "第七題關於HVDC商業化進度，目前高壓產品完成哪些驗證？何時能有顯著營收貢獻？最大的研發瓶頸為何？"}, {"i": 28, "ts": "31:56", "sec": 1916, "who": "總經理 Jerry Song", "role": "公司", "text": "正負400V與8
