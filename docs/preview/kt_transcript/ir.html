"text": "那营业毛利为17.12亿，那相较于第二季的话是成长4.39亿，那QoQ是增长了34.49%。"}, {"i": 19, "ts": "00:03:36", "sec": 216, "who": "Jerry", "role": "公司", "text": "那跟去年同期比的话YoY是增长7.25亿，那YoY是73.53%。"}, {"i": 20, "ts": "00:03:39", "sec": 219, "who": "Jerry", "role": "公司", "text": "那毛利率的话单季已经增长到38.03%，那相较于第二季的34.05%高出约接近四个百分点。"}, {"i": 21, "ts": "00:03:51", "sec": 231, "who": "Jerry", "role": "公司", "text": "那相较于去年同期的27.66%的话成长了10.37个百分点。"}, {"i": 22, "ts": "00:03:59", "sec": 239, "who": "Jerry", "role": "公司", "text": "那主要就是产品组合优化，那我们的产线持续优化制程以及导入自动化，所以我们的margin持续往上。"}, {"i": 23, "ts": "00:04:10", "sec": 250, "who": "Jerry", "role": "公司", "text": "那单季的营业费用是2.52亿，相较第二季的话成长约一层，那相较于去年同期的话成长约三成。"}, {"i": 24, "ts": "00:04:20", "sec": 260, "who": "Jerry", "role": "公司", "text": "那主要就是营运规模有持续往上，那我们相关费用也是持续增加。"}, {"i": 25, "ts": "00:04:27", "sec": 267, "who": "Jerry", "role": "公司", "text": "那再來就是我們單季的獲利為18.11元，相較於第二季的12.39元的話，QoQ成長是46.17%。"}, {"i": 26, "ts": "00:04:38", "sec": 278, "who": "Jerry", "role": "公司", "text": "那第三，跟去年同期的10.02元的話，YoY是成長了80.74%。"}, {"i": 27, "ts": "00:04:46", "sec": 286, "who": "Jerry", "role": "公司", "text": "那在產品組合的部分的話，2026年累計到第三季的話，我們的伺服器已經占比到65.1%。"}, {"i": 28, "ts": "00:04:57", "sec": 297, "who": "Jerry", "role": "公司", "text": "那伺服器的YoY成長為183.97%。"}, {"i": 29, "ts": "00:05:04", "sec": 304, "who": "Jerry", "role": "公司", "text": "那在資產負債表的部分，2026年9月30的現金及約當現金為92.01億。"}, {"i": 30, "ts": "00:05:13", "sec": 313, "who": "Jerry", "role": "公司", "text": "那相較於QoQ的話，去年同期的話是增加了33.62億。"}, {"i": 31, "ts": "00:05:22", "sec": 322, "who": "Jerry", "role": "公司", "text": "那跟第二季相比的話是略減少3.46億，主要是因為我們第三季有發放鼓勵，所以我們的現金有略減。"}, {"i": 32, "ts": "00:05:30", "sec": 330, "who": "Jerry", "role": "公司", "text": "那應收帳款及票據的話，第二季第三季是46.81億。"}, {"i": 33, "ts": "00:05:36", "sec": 336, "who": "Jerry", "role": "公司", "text": "那相較於去年同期增加了17.53億。"}, {"i": 34, "ts": "00:05:43", "sec": 343, "who": "Jerry", "role": "公司", "text": "然後跟第二季比的話是增增加了18.81億，那主要就是我們第二季第三季單季的營收相較於第二季跟去年同期都增加。"}, {"i": 35, "ts": "00:05:55", "sec": 355, "who": "Jerry", "role": "公司", "text": "那我們的存貨增為30.81億，相較於第二季跟去年同期的話都是增加，那主要就是我們依客戶訂單需求去備貨，所以我們的庫存有增加。"}, {"i": 36, "ts": "00:06:09", "sec": 369, "who": "Jerry", "role": "公司", "text": "那現在的負債為91.12億。"}, {"i": 37, "ts": "00:06:14", "sec": 374, "who": "Jerry", "role": "公司", "text": "那相較於去年同期跟第二季都是增加，那主要就是營運規模擴大，那應付進貨有增加，所以應付款項都增加。"}, {"i": 38, "ts": "00:06:25", "sec": 385, "who": "Jerry", "role": "公司", "text": "那每股淨值為141.18元，相較於第二季跟去年同期增加，那主要就是公司有持續獲利，所以我們的每股淨值是持續往上。"}, {"i": 39, "ts": "00:06:38", "sec": 398, "who": "Jerry", "role": "公司", "text": "那2026年9月底的流動比率為204.3%。"}, {"i": 40, "ts": "00:06:44", "sec": 404, "who": "Jerry", "role": "公司", "text": "那速動比率為167.1%，那負債比率為48.19%。"}, {"i": 41, "ts": "00:06:50", "sec": 410, "who": "Jerry", "role": "公司", "text": "那相較於過去都算都算維持在一定水準。"}, {"i": 42, "ts": "00:06:56", "sec": 416, "who": "Jerry", "role": "公司", "text": "那目前我們的現金流量量26年的資本支出26年第三季的資本支出累計為1.93億。"}, {"i": 43, "ts": "00:07:07", "sec": 427, "who": "Jerry", "role": "公司", "text": "那期末現金月為92.01，自由現金流量還有20.33億。"}, {"i": 44, "ts": "00:07:15", "sec": 435, "who": "Jerry", "role": "公司", "text": "那目前這是我們公司的第三季的營運狀況。"}, {"i": 45, "ts": "00:07:20", "sec": 440, "who": "Jerry", "role": "公司", "text": "那我們接下來就進行QA。"}, {"i": 46, "ts": "00:07:24", "sec": 444, "who": "講者", "role": "公司", "text": "好，那接下來進行QA意見交流，那由於會時間關係，我們僅就事前所彙整的問題進行回復，那先將時間交給公司經營團隊，謝謝。"}, {"i": 47, "ts": "00:07:35", "sec": 455, "who": "講者", "role": "公司", "text": "好，那第一個題目是問第四季跟明年營收毛利率的方向，並說明各產品明年幾季的成長展望。"}, {"i": 48, "ts": "00:07:44", "sec": 464, "who": "講者", "role": "公司", "text": "那這邊就是由我來回答，第四季跟明年我們都維持正向的看法，那成長主要是來自伺服器的產品。"}, {"i": 49, "ts": "00:07:51", "sec": 471, "who": "講者", "role": "公司", "text": "就是隨著NV新平台還有各個ASIC專案陸續放量，依人滲透率的提高，伺服器產品的出貨會持續的增加。"}, {"i": 50, "ts": "00:08:01", "sec": 481, "who": "講者", "role": "公司", "text": "那毛利率也是會隨著伺服器產品的比重提高，加上制程的優化，自動化毛利率會持續的改善。"}, {"i": 51, "ts": "00:08:10", "sec": 490, "who": "講者", "role": "公司", "text": "那滑軌也會是隨著伺服器專案完成認證進入量產去逐步貢獻。"}, {"i": 52, "ts": "00:08:16", "sec": 496, "who": "講者", "role": "公司", "text": "第二題是問三澤Meta XT2軸成價格變化，下半年華為Meta X9出貨備貨量與前代比較規格跟價格的變化。"}, {"i": 53, "ts": "00:08:29", "sec": 509, "who": "講者", "role": "公司", "text": "那這邊是請許總來回答。"}, {"i": 54, "ts": "00:08:31", "sec": 511, "who": "許總", "role": "公司", "text": "大家好。"}, {"i": 55, "ts": "00:08:33", "sec": 513, "who": "許總", "role": "公司", "text": "那針對華為的部分就是我們在下半年的這個這新機型已經配合客戶的需求已經開始在出貨了。"}, {"i": 56, "ts": "00:08:42", "sec": 522, "who": "許總", "role": "公司", "text": "那那個量的部分受到機體的這個缺貨的影響，有稍微的延後。"}, {"i": 57, "ts": "00:08:49", "sec": 529, "who": "許總", "role": "公司", "text": "那在新一代的轉折在設計上面也是朝著這個輕薄化的這個方向在發展。"}, {"i": 58, "ts": "00:08:56", "sec": 536, "who": "許總", "role": "公司", "text": "那因為強度結構要求的比較高，所以說下一代也會導入新的這個材料去做這個研發。"}, {"i": 59, "ts": "00:09:06", "sec": 546, "who": "許總", "role": "公司", "text": "那在價格的部分來講的話，我們每一代的產品都有都需要跟客人重新地做這個議價。"}, {"i": 60, "ts": "00:09:16", "sec": 556, "who": "講者", "role": "公司", "text": "好，那第三題是問說前三季手機營收較去年同期下滑兩成，全年手機營收的看法，手機軸成利用率跟毛利率目前多少？"}, {"i": 61, "ts": "00:09:29", "sec": 569, "who": "講者", "role": "公司", "text": "那這題請財務長Jerry回答。"}, {"i": 62, "ts": "00:09:32", "sec": 572, "who": "Jerry", "role": "公司", "text": "那我們今年目前手機轉折的營收相較去年同期減少，主要就是兩個原因。"}, {"i": 63, "ts": "00:09:40", "sec": 580, "who": "Jerry", "role": "公司", "text": "一個是我們在新舊機轉換的時程，所以手機的營收有掉。"}, {"i": 64, "ts": "00:09:46", "sec": 586, "who": "Jerry", "role": "公司", "text": "那第二個是記憶體這一些零件現在目前價格比較高，所以客戶有影響到出貨量。"}, {"i": 65, "ts": "00:09:55", "sec": 595, "who": "Jerry", "role": "公司", "text": "但我們目前手機轉軸就是以客戶需求有持續在出貨中。"}, {"i": 66, "ts": "00:10:02", "sec": 602, "who": "Jerry", "role": "公司", "text": "那，我們目前看就是透過MM的自製以及製程優化，那維持我們hinge的一定的毛利水準。"}, {"i": 67, "ts": "00:10:11", "sec": 611, "who": "Jerry", "role": "公司", "text": "但我們目前基本上公司的發展著重其實是在伺服器產品。"}, {"i": 68, "ts": "00:10:18", "sec": 618, "who": "講者", "role": "公司", "text": "對，好。"}, {"i": 69, "ts": "00:10:19", "sec": 619, "who": "講者", "role": "公司", "text": "那下一個是問明年度華為摺疊機推出的規劃，有哪些機種跟富世達預期可以拿到多少訂單？"}, {"i": 70, "ts": "00:10:27", "sec": 627, "who": "講者", "role": "公司", "text": "那這題請許總回答。"}, {"i": 71, "ts": "00:10:30", "sec": 630, "who": "許總", "role": "公司", "text": "對，這問題就是說客戶的產品規劃和推出的時程是屬於客戶的商業機密，所以我們這邊不方便代為回復。"}, {"i": 72, "ts": "00:10:42", "sec": 642, "who": "許總", "role": "公司", "text": "但我們跟華為一直都是一個長期合作的一個夥伴關係。"}, {"i": 73, "ts": "00:10:48", "sec": 648, "who": "許總", "role": "公司", "text": "所以在下一代的機種也是在積極在參與，也是主要的這個轉折供應商。"}, {"i": 74, "ts": "00:10:55", "sec": 655, "who": "許總", "role": "公司", "text": "那未來的這個訂單的需求會依照客戶的這個規劃和市場的需求來定定。"}, {"i": 75, "ts": "00:11:04", "sec": 664, "who": "講者", "role": "公司", "text": "好，那下一個問說Apple今年推出摺疊機後，全球摺疊機市場跟市佔率怎麼變化？"}, {"i": 76, "ts": "00:11:11", "sec": 671, "who": "講者", "role": "公司", "text": "記憶體等零件價格，明年怎麼看華為跟全球摺疊機手機市場的成長幅度？"}, {"i": 77, "ts": "00:11:18", "sec": 678, "who": "講者", "role": "公司", "text": "這題我們請財務長來回答。"}, {"i": 78, "ts": "00:11:21", "sec": 681, "who": "Jerry", "role": "公司", "text": "今年就是多了一個國際品牌加入摺疊手機市場嘛。"}, {"i": 79, "ts": "00:11:27", "sec": 687, "who": "Jerry", "role": "公司", "text": "那我們我們公司看是覺得會會提高整體摺疊機的能見度與滲透率，那也會刺激換機需求。"}, {"i": 80, "ts": "00:11:37", "sec": 697, "who": "Jerry", "role": "公司", "text": "那加上Apple的手機他定定價也是是蠻高的，所以大家的接受度對於這個摺疊手機過去都覺得他很貴。"}, {"i": 81, "ts": "00:11:47", "sec": 707, "who": "Jerry", "role": "公司", "text": "那現在我覺得Apple出了價格就定在那邊，大家應該接下來幾年都會接受這個價格。"}, {"i": 82, "ts": "00:11:55", "sec": 715, "who": "Jerry", "role": "公司", "text": "那明年各品牌和整體市場的成長幅度，我覺得這就是看各家對產品的規劃。"}, {"i": 83, "ts": "00:12:02", "sec": 722, "who": "Jerry", "role": "公司", "text": "那但我們基本上認為摺疊手機長期發展來看應該都還是正向的。"}, {"i": 84, "ts": "00:12:08", "sec": 728, "who": "講者", "role": "公司", "text": "好，那第六題問說1比1.4較寬螢幕的摺疊機會成為主流嗎？摺疊機的軸承設計趨勢？"}, {"i": 85, "ts": "00:12:17", "sec": 737, "who": "講者", "role": "公司", "text": "那這邊我們請許總來回答。"}, {"i": 86, "ts": "00:12:21", "sec": 741, "who": "許總", "role": "公司", "text": "對這個問題是各品牌的手機策略是有點不太一樣。"}, {"i": 87, "ts": "00:12:28", "sec": 748, "who": "許總", "role": "公司", "text": "像比如說像Motor的部分還是這個實力的小摺為他的一個主力。"}, {"i": 88, "ts": "00:12:35", "sec": 755, "who": "許總", "role": "公司", "text": "那這個我們也有在做。"}, {"i": 89, "ts": "00:12:36", "sec": 756, "who": "許總", "role": "公司", "text": "那另外就是說很像打開這種翻螢幕的橫折機在市場上目前看起來接受度也是不錯的。"}, {"i": 90, "ts": "00:12:43", "sec": 763, "who": "許總", "role": "公司", "text": "所以也是會是一個主要的一個方向。"}, {"i": 91, "ts": "00:12:46", "sec": 766, "who": "許總", "role": "公司", "text": "但是你說全部都是一樣，應該也是不太可能。"}, {"i": 92, "ts": "00:12:50", "sec": 770, "who": "許總", "role": "公司", "text": "那對轉軸來講的話就是這個平的寬度越寬，那它相對的這個力局會比較大，所以對轉軸的努力要求也會相對的比較高。"}, {"i": 93, "ts": "00:13:03", "sec": 783, "who": "許總", "role": "公司", "text": "那這個像現在Apple做的機器跟三星比起來他有天後。"}, {"i": 94, "ts": "00:13:07", "sec": 787, "who": "許總", "role": "公司", "text": "所以未來是朝向輕薄化的這個設計還是比較重要。"}, {"i": 95, "ts": "00:13:15", "sec": 795, "who": "講者", "role": "公司", "text": "好，那第七題是問其他手機平板MB軸成產品客戶的佈局進度，那這邊也是請許總來回答。"}, {"i": 96, "ts": "00:13:25", "sec": 805, "who": "許總", "role": "公司", "text": "就我們現在所到的案件講話就是在大機的這種立舉會比較高的情況下很多產品。"}, {"i": 97, "ts": "00:13:38", "sec": 818, "who": "許總", "role": "公司", "text": "產品都會用到這個樓性品。"}, {"i": 98, "ts": "00:13:41", "sec": 821, "who": "許總", "role": "公司", "text": "那譬如說我們現在也有接觸到大大多大螢幕的這種產品，還有就是那個電子書的部分。"}, {"i": 99, "ts": "00:13:49", "sec": 829, "who": "許總", "role": "公司", "text": "那這個都在進行這個prototype的這個開發。"}, {"i": 100, "ts": "00:13:54", "sec": 834, "who": "許總", "role": "公司", "text": "那相信在過一陣子就會有些樣品可以讓大家看到。"}, {"i": 101, "ts": "00:14:03", "sec": 843, "who": "許總", "role": "公司", "text": "那另外筆電的部分我們還是跟這些國際的大廠在繼續在合作。"}, {"i": 102, "ts": "00:14:10", "sec": 850, "who": "講者", "role": "公司", "text": "好，第八題問今年明年華為滑軌營收展望，通用伺服器滑軌跟AI的的怎麼看。"}, {"i": 103, "ts": "00:14:19", "sec": 859, "who": "講者", "role": "公司", "text": "那，我們今年伺服器產品營收就是會維持倍數成長，那目前有多項專案在進行中，明年就是會維持高度的成長。"}, {"i": 104, "ts": "00:14:29", "sec": 869, "who": "講者", "role": "公司", "text": "那下一個也就是繼續問就是說，客服說明T3氣冷水冷華軌認證出貨時程供應比重跟其他ASIC滑軌進度為何。"}, {"i": 105, "ts": "00:14:42", "sec": 882, "who": "講者", "role": "公司", "text": "AWS Training Three的花貴我們是以通過客戶的認證，那出貨時程配合客戶也配合就是ODM的系統建置進度。"}, {"i": 106, "ts": "00:15:00", "sec": 900, "who": "講者", "role": "公司", "text": "那其他客戶的滑軌專案目前也都是在持續的認證中，那後續就會依客戶的排程還有需求來配合出貨。"}, {"i": 107, "ts": "00:15:01", "sec": 901, "who": "講者", "role": "公司", "text": "好，那下一個是第10題問NVVR滑軌出貨進度跟客戶的數量，怎麼看VR滑軌的市佔率？"}, {"i": 108, "ts": "00:15:10", "sec": 910, "who": "講者", "role": "公司", "text": "那這邊也是有回答，VR平臺的滑軌我們現在是就是配合多家客戶正在進行認證中，那會依就是客戶的量產時程來導入。"}, {"i": 109, "ts": "00:15:21", "sec": 921, "who": "講者", "role": "公司", "text": "那市佔率的話就要看各個專案認證的結構跟客戶的分配。"}, {"i": 110, "ts": "00:15:26", "sec": 926, "who": "講者", "role": "公司", "text": "那策略上就是會先把品質跟交起來做好，積極爭取在量產初期就導入。"}, {"i": 111, "ts": "00:15:33", "sec": 933, "who": "講者", "role": "公司", "text": "好，第11題問NVRubin Ultra Switch機櫃1.5U或是0.75U在滑軌設計上的差異為何？"}, {"i": 112, "ts": "00:15:43", "sec": 943, "who": "講者", "role": "公司", "text": "那這題我們請許總來回答。"}, {"i": 113, "ts": "00:15:47", "sec": 947, "who": "許總", "role": "公司", "text": "就滑軌的操作上來講就是這個現在水冷的部分會以華順度為一個很重要的一個指標。"}, {"i": 114, "ts": "00:15:56", "sec": 956, "who": "許總", "role": "公司", "text": "那因為那個如果他左右邊的滑軌滑得不順的話，會對於這個盲差的部分會受到影響。"}, {"i": 115, "ts": "00:16:05", "sec": 965, "who": "許總", "role": "公司", "text": "所以在這個滑軌設計上來講重量的考量是一個很大的一個因素。"}, {"i": 116, "ts": "00:16:11", "sec": 971, "who": "許總", "role": "公司", "text": "那另外就是說像0.75U的這個雖然他的厚度比較薄，但是他的重量並沒有減輕多少。"}, {"i": 117, "ts": "00:16:19", "sec": 979, "who": "許總", "role": "公司", "text": "所以說對於說華規來講，比較薄的這種0.75U反而是一比較不好設計的。"}, {"i": 118, "ts": "00:16:33", "sec": 993, "who": "講者", "role": "公司", "text": "好，謝謝，那第12題問說AI伺服器華軌單價走勢價格持續上升新增的功能或設計有哪些跟新功能製造的難度為何？"}, {"i": 119, "ts": "00:16:45", "sec": 1005, "who": "講者", "role": "公司", "text": "那這邊也是請許總回答。"}, {"i": 120, "ts": "00:16:48", "sec": 1008, "who": "許總", "role": "公司", "text": "我們現在做這個水冷伺服器的這種滑軌來講就是它的重量比較重嘛，所以也遇到說在插拔的時候因為重量重會有這種慣性上的這個需求。"}, {"i": 121, "ts": "00:17:01", "sec": 1021, "who": "許總", "role": "公司", "text": "所以那個指檔的強度啊，還有要做緩衝啊，以及剛才提到的就是兩邊的這種平行度的要求都會比較高。"}, {"i": 122, "ts": "00:17:11", "sec": 1031, "who": "許總", "role": "公司", "text": "所以在這種水冷滑軌跟氣冷滑軌比起來來講它的要求的這個強度的這個相對的是高很多的。"}, {"i": 123, "ts": "00:17:21", "sec": 1041, "who": "許總", "role": "公司", "text": "所以也讓這個滑軌的價值也會變得比較高。"}, {"i": 124, "ts": "00:17:28", "sec": 1048, "who": "講者", "role": "公司", "text": "好，下一題是請問QD華軌產能利用率目前伺服器毛利率的區間跟後續毛利長幅度怎麼看？"}, {"i": 125, "ts": "00:17:37", "sec": 1057, "who": "講者", "role": "公司", "text": "那這題請財務長來回答。"}, {"i": 126, "ts": "00:17:41", "sec": 1061, "who": "Jerry", "role": "公司", "text": "目前快接頭的新產能已經開出來，那我們的產能現在是4.5KK，那比之前提到的3KK多了50%。"}, {"i": 127, "ts": "00:17:52", "sec": 1072, "who": "Jerry", "role": "公司", "text": "那加動力就是隨著客戶的訂單排產會逐步爬升。"}, {"i": 128, "ts": "00:17:58", "sec": 1078, "who": "Jerry", "role": "公司", "text": "那目前滑軌產能還是維持之前講的350K套。"}, {"i": 129, "ts": "00:18:02", "sec": 1082, "who": "Jerry", "role": "公司", "text": "那未來當然會是後續專案認證的進度，那我們再安排後續的擴產。"}, {"i": 130, "ts": "00:18:08", "sec": 1088, "who": "Jerry", "role": "公司", "text": "那毛利率基本上伺服器遠高於轉軸產品。"}, {"i": 131, "ts": "00:18:14", "sec": 1094, "who": "Jerry", "role": "公司", "text": "那我們隨著伺服器的比重提高加上自動化以及製程優化，那整體毛利率仍有往上的空間。"}, {"i": 132, "ts": "00:18:24", "sec": 1104, "who": "講者", "role": "公司", "text": "好，第14題是問說預計快接頭今年明年營收，跟今年明年GPU、NVIDIA、AMD、ASIC快接頭對我們的貢獻或比重是多少？"}, {"i": 133, "ts": "00:18:39", "sec": 1119, "who": "講者", "role": "公司", "text": "那這邊我來回答。"}, {"i": 134, "ts": "00:18:40", "sec": 1120, "who": "講者", "role": "公司", "text": "今年伺服器的產品營收倍數成長，那快接頭就是最主要的貢獻來源。"}, {"i": 135, "ts": "00:18:46", "sec": 1126, "who": "講者", "role": "公司", "text": "那目前快接頭是以GPU平臺為主，那明年會隨著更多ASIC專案進入量產，就是ASIC的比重會會逐步提高。"}, {"i": 136, "ts": "00:18:55", "sec": 1135, "who": "講者", "role": "公司", "text": "所以我們會預期快接頭人士就是伺服器業務的重要成長動能。"}, {"i": 137, "ts": "00:19:01", "sec": 1141, "who": "講者", "role": "公司", "text": "那下一個問說AWST3快接頭的出貨進度，跟一冷出貨時程有沒有延跟預計T3世代的比重？"}, {"i": 138, "ts": "00:19:15", "sec": 1155, "who": "講者", "role": "公司", "text": "那我們這邊回覆是AWS Training Tree的快接頭目前就是在配合客戶的時程來在出貨中。"}, {"i": 139, "ts": "00:19:22", "sec": 1162, "who": "講者", "role": "公司", "text": "那藝人的版本的放量也是就是跟著客戶的的規劃，那我們這邊的產能是已經準備好了。"}, {"i": 140, "ts": "00:19:31", "sec": 1171, "who": "講者", "role": "公司", "text": "那下一個問說GoogleTPUNSP1接頭的開發進度，TPUView會不會以快接頭取代現有的固定式接頭跟客戶的考量是什麼？那兩種方法的優缺點為何？"}, {"i": 141, "ts": "00:19:46", "sec": 1186, "who": "講者", "role": "公司", "text": "這邊也請許總來回答。"}, {"i": 142, "ts": "00:19:50", "sec": 1190, "who": "許總", "role": "公司", "text": "OK。"}, {"i": 143, "ts": "00:19:51", "sec": 1191, "who": "許總", "role": "公司", "text": "那這個NSP1的這個接頭，我們現在已經通過U洛的這個認證了。"}, {"i": 144, "ts": "00:19:59", "sec": 1199, "who": "許總", "role": "公司", "text": "那接下來就是配合客戶的這個需求進行下一步的這個市場的驗證。"}, {"i": 145, "ts": "00:20:06", "sec": 1206, "who": "許總", "role": "公司", "text": "那在這個TPUView的部分會不會使用會不會以快接頭取代？"}, {"i": 146, "ts": "00:20:16", "sec": 1216, "who": "許總", "role": "公司", "text": "那這個業界常看到的做法是混搭，就是說那個像冷板到翠的這個部分會用內部的管路會用固定的方式來節省空間嘛。"}, {"i": 147, "ts": "00:20:26", "sec": 1226, "who": "許總", "role": "公司", "text": "那在穿到機櫃和Manful這部分會用那個快接頭。"}, {"i": 148, "ts": "00:20:32", "sec": 1232, "who": "許總", "role": "公司", "text": "那View的部分可能就是說可能就會用到是不是要用盲差的這個方式來做。"}, {"i": 149, "ts": "00:20:41", "sec": 1241, "who": "許總", "role": "公司", "text": "那以我們的角度來看的話就是接觸到的訊息來看的話就是說基本上就是要做比較容易維護的部分就會用到這個快接頭了。"}, {"i": 150, "ts": "00:20:53", "sec": 1253, "who": "許總", "role": "公司", "text": "那要不然他的這個維修成本會相對的是會比較高的。"}, {"i": 151, "ts": "00:20:59", "sec": 1259, "who": "許總", "role": "公司", "text": "所以以未來的晶片功耗和系統的複雜度來看到快接頭這部分是比例是相對的是會約越多。"}, {"i": 152, "ts": "00:21:12", "sec": 1272, "who": "講者", "role": "公司", "text": "好，第17題問說Maya300塊接頭數量針對富世達的貢獻怎麼評估？"}, {"i": 153, "ts": "00:21:20", "sec": 1280, "who": "講者", "role": "公司", "text": "跟微軟ASIC還有其他AI新創客戶快接頭的進度？"}, {"i": 154, "ts": "00:21:26", "sec": 1286, "who": "講者", "role": "公司", "text": "那這邊我來回覆，快接頭數量越多，當然就是對富世達的貢獻會越高。"}, {"i": 155, "ts": "00:21:31", "sec": 1291, "who": "講者", "role": "公司", "text": "那除了已經量產的平臺以外，就是其他CHP的ASIC專案，我們也都持續在配合客戶在的進度在送樣跟驗證中。"}, {"i": 156, "ts": "00:21:41", "sec": 1301, "who": "講者", "role": "公司", "text": "那下一個問說OCPOCP開放標準盲差接頭PPNCBMQC跟GQD還有維形接頭的開發進度和客戶的導入意願？"}, {"i": 157, "ts": "00:21:53", "sec": 1313, "who": "講者", "role": "公司", "text": "這題我們請許總來回答。"}, {"i": 158, "ts": "00:21:57", "sec": 1317, "who": "許總", "role": "公司", "text": "那這個OCP這種開放標準的好處就是說客戶可以有多家供應商的選擇。"}, {"i": 159, "ts": "00:22:06", "sec": 1326, "who": "許總", "role": "公司", "text": "然後像我們現在在做也是互相都是有都可以完成這個相容性的測試。"}, {"i": 160, "ts": "00:22:11", "sec": 1331, "who": "許總", "role": "公司", "text": "那以這個PPNC來看的話就是他是下一代的高流高流量的盲差的标准。"}, {"i": 161, "ts": "00:22:19", "sec": 1339, "who": "許總", "role": "公司", "text": "那我們公司的PPNC的樣品也是完成了開發，現在在做交叉驗證的這個階段。"}, {"i": 162, "ts": "00:22:31", "sec": 1351, "who": "許總", "role": "公司", "text": "然後BMQC的部分來講的話就是它的流量比較比比PPNC來得小。"}, {"i": 163, "ts": "00:22:38", "sec": 1358, "who": "許總", "role": "公司", "text": "所以目前我們沒有受到客戶這樣子的需求，所以我們這這個是我們沒有開發的。"}, {"i": 164, "ts": "00:22:45", "sec": 1365, "who": "許總", "role": "公司", "text": "那至於那個ZQD的部分現在正在正在開發當中。"}, {"i": 165, "ts": "00:22:52", "sec": 1372, "who": "許總", "role": "公司", "text": "那維形接頭的這個開發目前有幾個案子正在正在做，就是用在光通訊的部分。"}, {"i": 166, "ts": "00:23:05", "sec": 1385, "who": "講者", "role": "公司", "text": "好，那接著下一個投資人問說ZQD原本使用快接頭，跟原本的ZQUDMQD在設計上有什麼差異跟ASP是多少？"}, {"i": 167, "ts": "00:23:18", "sec": 1398, "who": "講者", "role": "公司", "text": "那這邊也是請許總來回復。"}, {"i": 168, "ts": "00:23:24", "sec": 1404, "who": "許總", "role": "公司", "text": "針對ZQD這個跟我們現在在用的UQD以及MQD的差別就在於說那ZQD是為了下一代這個高功耗的平臺設計的規範。"}, {"i": 169, "ts": "00:23:37", "sec": 1417, "who": "許總", "role": "公司", "text": "那主要他標榜就是那個零壓降。"}, {"i": 170, "ts": "00:23:40", "sec": 1420, "who": "許總", "role": "公司", "text": "就是流量的部分它的損失是很小的。"}, {"i": 171, "ts": "00:23:44", "sec": 1424, "who": "許總", "role": "公司", "text": "那但是它的結構相對很複雜。"}, {"i": 172, "ts": "00:23:47", "sec": 1427, "who": "許總", "role": "公司", "text": "原來我們用的這個UQD跟MQD是用這個平接頭。"}, {"i": 173, "ts": "00:23:52", "sec": 1432, "who": "許總", "role": "公司", "text": "就是兩個接頭對接的是平面對平面，所以它的分離的時候這個漏漏下來的水很小的，分離歇油量的水很小的。"}, {"i": 174, "ts": "00:24:02", "sec": 1442, "who": "許總", "role": "公司", "text": "那ZQD他用的是兩顆球法，所以兩個原球對原球，所以這個分離歇油量會相對的會比較高一點。"}, {"i": 175, "ts": "00:24:10", "sec": 1450, "who": "許總", "role": "公司", "text": "那這個是主要的差別。"}, {"i": 176, "ts": "00:24:16", "sec": 1456, "who": "許總", "role": "公司", "text": "那像我們這個規格開發出來以後啊，大部分很多家都會進行這個都會投入去開發。"}, {"i": 177, "ts": "00:24:25", "sec": 1465, "who": "許總", "role": "公司", "text": "但是那個能夠通過認證的啊，就是一路追追到低要通過認證的相對也是比較少的。"}, {"i": 178, "ts": "00:24:32", "sec": 1472, "who": "許總", "role": "公司", "text": "再加上說還有一些實戰的這個出貨經驗。"}, {"i": 179, "ts": "00:24:37", "sec": 1477, "who": "許總", "role": "公司", "text": "所以包含那個一些測試的設備驗證的這些方法都是各家的一個know-how。"}, {"i": 180, "ts": "00:24:47", "sec": 1487, "who": "許總", "role": "公司", "text": "那至於說這個價格的部分來講，ZQD的部分因為現在預期到12月才會開始進入這個量產的準備。"}, {"i": 181, "ts": "00:24:58", "sec": 1498, "who": "許總", "role": "公司", "text": "所以這個部分我們還還不方便公告，謝謝。"}, {"i": 182, "ts": "00:25:04", "sec": 1504, "who": "講者", "role": "公司", "text": "好，謝謝，那20題是問QD非ABC客戶的貢獻多少，跟客戶是什麼類型的，以及怎麼看明年ABC以外客戶的成長？"}, {"i": 183, "ts": "00:25:21", "sec": 1521, "who": "講者", "role": "公司", "text": "快接頭跟滑軌在中國客戶或是非CSP客戶的佈局？"}, {"i": 184, "ts": "00:25:23", "sec": 1523, "who": "講者", "role": "公司", "text": "那我來回覆，ABC以外的QD客戶營收就是現在是持續在增加當中，那主要也就是其他的伺服器廠跟系統廠。"}, {"i": 185, "ts": "00:25:32", "sec": 1532, "who": "講者", "role": "公司", "text": "那明年就是隨著客戶的完成認證進入量產，那我們預期ABC以外客戶的貢獻會持續的成長。"}, {"i": 186, "ts": "00:25:41", "sec": 1541, "who": "講者", "role": "公司", "text": "那中國跟非CSP客戶方面，伺服器的產品就是有持續的在送樣跟出貨，那會跟就是依據市場的需求跟規範來做佈局。"}, {"i": 187, "ts": "00:25:53", "sec": 1553, "who": "講者", "role": "公司", "text": "那下一題問說，今年明年資本支出計劃更新各QD滑軌產品現在在中國跟越南的產能，明年自動化的比率多少跟怎麼評估自動化設備的效益？"}, {"i": 188, "ts": "00:26:06", "sec": 1566, "who": "講者", "role": "公司", "text": "那這邊我們請財務長Jerry來回覆。"}, {"i": 189, "ts": "00:26:08", "sec": 1568, "who": "Jerry", "role": "公司", "text": "目前資本支出剛有簡報有講，截至到第三季的話大約約1.9億。"}, {"i": 190, "ts": "00:26:17", "sec": 1577, "who": "Jerry", "role": "公司", "text": "那主要就是我們用在伺服器產品的擴產和投入自動化。"}, {"i": 191, "ts": "00:26:24", "sec": 1584, "who": "Jerry", "role": "公司", "text": "那明年的資本支出現在還在編預算。"}, {"i": 192, "ts": "00:26:27", "sec": 1587, "who": "Jerry", "role": "公司", "text": "那我們基本上明年一定會在持續擴，目前就是有在規劃明年的擴產。"}, {"i": 193, "ts": "00:26:35", "sec": 1595, "who": "Jerry", "role": "公司", "text": "那基本上就是老闆跟總經理他們還在評依客戶的需求還在評估中。"}, {"i": 194, "ts": "00:26:43", "sec": 1603, "who": "講者", "role": "公司", "text": "好，那下一個投資人問說，其他精密機構零件的開發進度？"}, {"i": 195, "ts": "00:26:49", "sec": 1609, "who": "講者", "role": "公司", "text": "那我們這邊請許總來回覆。"}, {"i": 196, "ts": "00:26:52", "sec": 1612, "who": "許總", "role": "公司", "text": "這部分來講我們有在開發這個結合馬達跟精密減速機的部分的這種產品，就是直行器。"}, {"i": 197, "ts": "00:27:02", "sec": 1622, "who": "許總", "role": "公司", "text": "另外就是在行星滾珠桿以及減速機的部分，我們現在是有跟美國的公司做這個做這個簽了DNA，然後持續現在也在開始送樣。"}, {"i": 198, "ts": "00:27:21", "sec": 1641, "who": "講者", "role": "公司", "text": "好，23題投資人問說，明年預計Server相關營收在QD跟導軌分別成長多少？"}, {"i": 199, "ts": "00:27:29", "sec": 1649, "who": "講者", "role": "公司", "text": "那我們剛剛有提到就是快接頭人士伺服器業務中的成長動能，那原因有有三點。"}, {"i": 200, "ts": "00:27:36", "sec": 1656, "who": "講者", "role": "公司", "text": "第一個就是GPU跟ASIC平台的量產，那第二個是藝人導入率的提高，那第三個是每櫃的用量增加跟延伸延伸到recommend for跟Power rack上。"}, {"i": 201, "ts": "00:27:49", "sec": 1669, "who": "講者", "role": "公司", "text": "那滑軌就是隨著AI伺服器專案的完成認證進入量產會逐步的放大貢獻。"}, {"i": 202, "ts": "00:27:57", "sec": 1677, "who": "講者", "role": "公司", "text": "那下一個投資人問說Server業務未來的成長性，可否分享NV跟ASIC相關的接單狀況？"}, {"i": 203, "ts": "00:28:04", "sec": 1684, "who": "講者", "role": "公司", "text": "那我們這邊回覆是伺服器的業務成長性就是一樣是維持正向的看法。"}, {"i": 204, "ts": "00:28:10", "sec": 1690, "who": "講者", "role": "公司", "text": "那在NV平臺上的VR相關產品是已經陸續的出貨，那明年會持續的在放量。"}, {"i": 205, "ts": "00:28:18", "sec": 1698, "who": "講者", "role": "公司", "text": "ASIC方面就會有多個CHP的客戶去逐步的進入量產或驗證。"}, {"i": 206, "ts": "00:28:25", "sec": 1705, "who": "講者", "role": "公司", "text": "那25題是問說今年第四季跟明年各業務佔比比重跟展望如何？"}, {"i": 207, "ts": "00:28:32", "sec": 1712, "who": "講者", "role": "公司", "text": "那這邊我們請財務長來回覆。"}, {"i": 208, "ts": "00:28:38", "sec": 1718, "who": "Jerry", "role": "公司", "text": "就照我剛剛簡報，我們第三季的產品組合是伺服器佔比為81.3%。"}, {"i": 209, "ts": "00:28:44", "sec": 1724, "who": "Jerry", "role": "公司", "text": "那摺疊手機15.5%，那Notebook是2.6%，其他是0.6%。"}, {"i": 210, "ts": "00:28:50", "sec": 1730, "who": "Jerry", "role": "公司", "text": "那我們目前是不提供未來的營收佔比預估。"}, {"i": 211, "ts": "00:28:57", "sec": 1737, "who": "Jerry", "role": "公司", "text": "但總結今天的問題上來講，其實我們接下來NV的VR200的相關產品已經在出貨了嘛。"}, {"i": 212, "ts": "00:29:06", "sec": 1746, "who": "Jerry", "role": "公司", "text": "那明年也會持續有其他ASIC的隨人快接頭或滑軌的產品都會陸續出貨。"}, {"i": 213, "ts": "00:29:14", "sec": 1754, "who": "Jerry", "role": "公司", "text": "那基本上伺服器的比重我認為會維持在高佔比。"}, {"i": 214, "ts": "00:29:20", "sec": 1760, "who": "Jerry", "role": "公司", "text": "那我們摺疊手機跟Notebook轉軸就是公司的穩定基本盤。"}, {"i": 215, "ts": "00:29:26", "sec": 1766, "who": "Jerry", "role": "公司", "text": "那我們的這部分就會隨著客戶的新機時程，那會有營收的波動。"}, {"i": 216, "ts": "00:29:32", "sec": 1772, "who": "Jerry", "role": "公司", "text": "那以上是我們目前今天QA的回答。"}, {"i": 217, "ts": "00:29:40", "sec": 1780, "who": "講者", "role": "公司", "text": "好，那今天感謝公司經營團隊的回覆以及分享。"}, {"i": 218, "ts": "00:29:46", "sec": 1786, "who": "講者", "role": "公司", "text": "那今天富達法說會就在這邊告一段落。"}, {"i": 219, "ts": "00:29:48", "sec": 1788, "who": "講者", "role": "公司", "text": "那感謝各位投資先進的參與，謝謝大家。"}], "qa": null, "chars": 7320, "last_min": 30, "cpm": 246, "status": "full", "memo": [{"title": "亮點", "points": [{"text": "2026年前三季營收為124.25億元，年成長39.87%。", "ts": "00:01:14", "who": "Jerry", "seg": 8}, {"text": "前三季營業毛利為43.37億元，毛利率為34.90%。", "ts": "00:01:36", "who": "Jerry", "seg": 10}, {"text": "前三季稅後淨利為43.88億元，EPS為43.88元。", "ts": "00:02:38", "who": "Jerry", "seg": 15}]}, {"title": "營收", "points": [{"text": "2026年第三季單季營業收入為45.02億元，季增20%，年增26.25%。", "ts": "00:03:00", "who": "Jerry", "seg": 16}]}, {"title": "毛利與獲利", "points": [{"text": "2026年第三季單季毛利率為38.03%，較第二季高出約4個百分點。", "ts": "00:03:39", "who": "Jerry", "seg": 20}, {"text": "2026年第三季單季稅後淨利為18.11億元，EPS為18.11元。", "ts": "00:04:27", "who": "Jerry", "seg": 25}]}, {"title": "產品與技術", "points": [{"text": "伺服器產品組合佔比在2026年前三季已累計達65.10%。", "ts": "00:04:46", "who": "Jerry", "seg": 27}]}, {"title": "Q&A", "points": [{"text": "問：第四季跟明年營收毛利率的方向並說明各產品明年幾季的成長展望？／答：第四季跟明年我們都維持正向的看法，成長主要來自伺服器的產品。", "ts": "00:07:35", "who": "Jerry", "seg": 47}, {"text": "問：摺疊手機周成價格變化，下半年華為Meta摺疊手機出貨備貨量與前代比較，規格跟價格的變化？／答：華為下半年的摺疊新機型已開始出貨，量受記憶體缺貨影響有稍微延後。", "ts": "00:08:16", "who": "Jerry", "seg": 52}, {"text": "問：前三季手機營收較去年同期下滑兩成，全年手機營收看法，手機周成利用率跟毛利率目前多少？／答：手機轉型的營收較去年同期減少主要有兩個原因，新舊機轉換時程與記憶體零組件價格高。", "ts": "00:09:16", "who": "Jerry", "seg": 60}, {"text": "問：明年度華為摺疊機推出的規劃有哪些機種，富世達預期可以拿到多少訂單？／答：客戶的產品規劃屬於商業機密不便回答，但我們跟華為一直維持長期合作夥伴關係。", "ts": "00:10:19", "who": "Jerry", "seg": 69}, {"text": "問：Apple今年推出摺疊機後，全球摺疊機市場跟市占率怎麼變化？／答：今年多了國際品牌加入摺疊手機市場，會提高整體摺疊機的能見度與滲透率。", "ts": "00:11:04", "who": "Jerry", "seg": 75}, {"text": "問：1比1.4較寬螢幕的摺疊機會成為主流嗎，摺疊機的軸承設計趨勢？／答：各品牌的產品策略有點不太一樣，薄型化跟輕量化是主要方向。", "ts": "00:12:09", "who": "Jerry", "seg": 84}]}], "quotes": []}, {"key": "4991_2026-11-03", "code": "4991", "name": "環宇-KY", "date": "2026-11-03", "segs": [{"i": 0, "ts": "01:46", "sec": 106, "who": "主持人 Anthony", "role": "主持人", "text": "各位投資先進午安，歡迎參加今天由元大證券舉辦的環宇-KY線上法人說明會。我是今天的主持人，元大證券投資銀行業務部的Anthony。首先感謝各位投資先進今天撥冗參與，也很榮幸邀請到環宇-KY的經營團隊與各位分享公司的營運現況及未來發展。今天出席的公司代表包括總執行長安寶信先生、財快部門副總Claire，以及總執行長特助Kelly。今天的會議首先將由安寶信總執行長為各位進行開場及公司介紹，接著由Claire副總進行營運總結及未來展望，最後再由Kelly特助為各位說明公司的財務資訊。接下來就把時間交給安寶信總執行長，請安總為我們進行今天的法說會，謝謝。"}, {"i": 1, "ts": "02:34", "sec": 154, "who": "CEO 安寶信", "role": "公司", "text": "好，各位好。我想最近一些大消息，這個Marvell跟Lumentum的大消息，讓我們這個已經很興奮的產業更加興奮。不過我們是從另一個角度看，我覺得這是一個蠻正面的一個趨勢。對GCS來講是一個美國based的生產基地，那未來的一些政治上面的一些限制，我想對我們應該都是挺正面的。那從上個quarter提到的關於基板上面，現在算供貨穩定，但並不代表未來也是如此，所以我們也是很積極的在拓寬不同的source、不同的vendor還有生產base，就是make sure說將來如果又回到有限制的狀況之下，我們能夠一方面能應變，一方面能夠在這個大環境之下能夠持續的為客戶供貨。所以我話不多說，我們就請Claire對上一季做一個summarize，然後這一季做一個預測 guidance。"}, {"i": 2, "ts": "04:14", "sec": 254, "who": "CFO Claire", "role": "公司", "text": "好，各位好，那我接下來就是為各位進行Q3的一個營運總結以及Q4的一個展望。Q3的部分我們的revenue達到了美金26.4個million，gross margin也回升至47%。Operating expense的部分達到7.3個million，佔營收27.7%，稅後淨利達到5個million。那operating expense比上一季的預期略低的原因，主要是因為100mW的CW laser的進度有所delay至下一季以及Q2 2027年，因此這個部分的話比上一季的預期略低。關於營收的一個product mix的部分，AOC的產品回升至71%，主要的原因也是因為磷化銦基板供應回穩，那gross margin也因此提升回47%。"}, {"i": 3, "ts": "05:32", "sec": 332, "who": "CFO Claire", "role": "公司", "text": "那關於Q4的展望的話，revenue的部分因為AOC的產品需求持續的強勁，那公司我們也因為投資了威利富，有額外的產能，所以因此我們期望可以達到30到34個million。Gross margin的部分也因為我們的主力產品仍然放在AOC，因此gross margin我們預期可以達到46到50%區間。Operating expense的部分，像剛剛所說的，因為CW laser有所推遲，因此在Q4開始會進行amortization，預期會提高至7.6到8.6個million區間。以上，謝謝。"}, {"i": 4, "ts": "06:27", "sec": 387, "who": "主持人 Anthony", "role": "主持人", "text": "謝謝Brian跟Claire。接下來我們把時間交給總執行長特助Kelly，為各位說明公司的財務資訊。"}, {"i": 5, "ts": "06:36", "sec": 396, "who": "CEO特助 Kelly", "role": "公司", "text": "大家好，接下來由我來跟大家報告一下在2026年第三季度環宇-KY的這個財務資訊的資料。那現在請大家翻到投影片的第四頁，投影片的第四頁是有關於各季度的綜合損益表的說明資料。那首先我們就營業收入的部分來進行說明。在2026年第三季度的營業收入金額大概是在新台幣8.44億元，那相較於本年度第二季度也就是上一季度的營收表現來看，以原幣美金數相比的話，這個營收大概是增加了8.37%，跟台幣數相比的話大概是增加了9.7%。那接下來以產品類別來看的話，在無線射頻晶圓代工的這個部分，本季度較前一季度的營收金額略減了7.64%，那這個主要的原因是因為RF foundry的代工營收在第一季的時候因為有部分的生產出貨的時程delay到第二季，所以使得第二季的營收表現來講是相對比較高的情況，兩相比較之下RF營收有略減的情形。那另外在光電晶圓代工的這個部分，本季度的營收較上一季度相比大概降低了37%，那這邊主要是因為公司有調整接單客戶的部分，改以重要的客戶或者是未來預計會投片生產的客戶訂單為主。那接下來在自有品牌光元件AOC的這個部分，本季度的營收較上一季度相比的話大概是增加了25.8%，那主要是因為在第二季的時候有受到基板供應限制，那造成累積晶圓原料短缺的影響出貨減少，那隨著基板跟KGD廠商供應逐漸的回穩，那本季度的銷量有較上一季度增加，所以營收也有跟著提高。"}, {"i": 6, "ts": "08:51", "sec": 531, "who": "CEO特助 Kelly", "role": "公司", "text": "那接下來我們再看2026年第三季度相較於去年同期的營收比較，以原幣美金數相比的話，在2026年第三季的營收大概是增加了46.5%，台幣數相比大概增加了55%。那同樣的我們也以產品類別來進行分析，在2026年第三季在無線射頻晶圓代工這邊的營收較去年同期有增加了大概98%，主要是因為平均代工的價格有提高還有出貨增加所產生的。那在Opto foundry光電晶圓代工的這個部分的話，本季度的營收較去年同期相比大概是略減2.2%。那自有品牌光電元件AOC的這個部分，跟去年同期的營收相比的話大概增加了39%，主要也是因為受惠於Data Center跟AI的需求增加銷量提高所產生的。"}, {"i": 7, "ts": "09:56", "sec": 596, "who": "CEO特助 Kelly", "role": "公司", "text": "那接下來是有關於毛利率分析的部分，大家可以看到在2026年第三季營業毛利的金額大概是在新台幣的3.97億元，毛利率大概是47%。那跟上一個季度相比，上一季度的毛利率是43.3%相比的話大概是增加了3.7%，主要的原因有以下幾點：第一點就是主要是本季度自有品牌光電元件AOC的這個銷量增加，那我們可以從產品組合比重來看的話，自有品牌光電元件的這個產品收入營收比重有提高，在2026年第二季營收比重大概是61%，本季度的話大概是在71%左右。那第二點的部分就是，本季度自由品牌光電元件的這個部分有反映了原料成本上升，所以這個也有價格調漲的情形。那第三個部分是因為本季度認列的存貨跌價及呆滯損失的金額有比較減少的情形。兩期相比毛利率增加的主要原因，主要還是由於AOC的銷售量增加所產生的。那毛利率的部分跟去年第三季的毛利率相比的話差異不大。"}, {"i": 8, "ts": "11:31", "sec": 691, "who": "CEO特助 Kelly", "role": "公司", "text": "那接下來是營業費用的部分，我們可以看到在2026年第三季營業費用的金額大概是在新台幣的2.34億元，那跟上一季度的相比的話差異不會太大，大概只差了0.2%左右。那同樣的營業費用跟去年同期相比的話，這個營業費用大概增加了53%，主要是因為有發行限制員工權利新股，那依照會計準則的規定認列較高的酬勞成本，那還有一些員工及董監酬勞估列數增加所產生的。那本季度的營業費用率大概是在27.8%。綜合以上的說明，在2026年第三季我們產生了營業利益的金額大概是在新台幣的1.63億元，營業利益率大概是19.3%。"}, {"i": 9, "ts": "12:30", "sec": 750, "who": "CEO特助 Kelly", "role": "公司", "text": "那接下來是營業外收入跟支出的部分，請大家先看到投影片的第五頁。投影片的第五頁我們可以看到在2026年第三季營業外收入的金額大概是在新台幣的3119萬元左右，那跟上一季度的相比的話收入大概是減少了12%左右，主要是因為本季度採用權益法認列的這個投資利益的金額有減少的情形。跟大家說明一下，在2026年第三季權益法認列投資利益的金額大概是在新台幣1391萬元左右，那跟上一季度相比大概有減少了28.7%，主要是因為對上海常州嘉認列的投資利益有減少的情形。那接下來就是我們跟去年同期相比的話，在2026年第三季的營業外收入相比大概增加了135%，主要是因為在2026年第一季開始我們對長光華芯因為沒有具有投資沒有重大的影響力，所以對它採用的會計處理的部分已經轉列到所謂的FVOCI想像下，那所以本季度對長光華芯認列的投資損失減少。所以綜合以上的說明的話，在2026年第三季我們產生的稅前淨利的金額大概是在新台幣的1.93億元。那第三季的時候我們認列的所得稅費用大概是在新台幣3885萬元左右，產生的稅後淨利的金額大概是在新台幣的1.54億元，歸屬於母公司淨利的金額大概是在新台幣的1.59億元。第三季2026年第三季基本每股的EPS是在新台幣1.33元，稀釋的美股EPS是在新台幣1.31元。本季度研發費用佔營收的比重大概是6.9%。那接下來各季度營業收入的資訊再請大家參考相關的資料。"}, {"i": 10, "ts": "15:05", "sec": 905, "who": "CEO特助 Kelly", "role": "公司", "text": "那下一張投影片第六頁，主要是各季度產品比重跟毛利率的資訊。如同剛剛有跟大家報告的，在2026年第三季產品比重的部分，RF foundry大概是20%，Opto foundry大概是26%，AOC的部分大概是71%。那跟上一季度相比的話，RF foundry的比重大概下降了3%，Opto foundry大概下降了4%，AOC的部分則是成長了約10%。"}, {"i": 11, "ts": "15:45", "sec": 945, "who": "CEO特助 Kelly", "role": "公司", "text": "那接下來請翻到投影片的第七頁。投影片第七頁是年度綜合損益表的說明。那我們一樣先從營業收入這邊開始進行，在2026年前三季的營業收入金額大概是在新台幣的23.29億元，那我們同樣的跟去年同期的營業收入相比的話，以原幣美金數相比的話營收大概是增加了52.1%，跟台幣數相比的話大概增加了54%。營收較去年同期增加的原因，主要也是因為剛剛提到AI跟Data Center需求，那也有帶動了自有品牌光電元件AOC跟相關的Opto foundry營收成長外，另外就是射頻晶圓代工這個部分它的平均售價有上升，那也帶動了相關的代工營收提高。在2026年前三季的營業成本金額大概是在新台幣12.09億元，接下來看營業毛利的部分，在2026年度前三季營業毛利的金額大概是在新台幣的11.2億元左右，毛利率大概是在48%。那跟去年同期的毛利率相比的話大概增加了3.7%，主要的原因有以下兩點：第一點也就是指剛剛有提到的，因為自由品牌光電元件AOC產品的銷售量增加，所以毛利也有提高。再來是前三季度的這個RF跟Opto foundry這個代工的平均售價也有提高的情況，那有產生有利的價格差，使得毛利率的部分也有增加。那再來是營業費用的部分，在2026年前三季營業費用的金額大概是在新台幣的6.77億元，那跟去年同期相比大概增加了2.67億元，大概是65%。那這邊主要增加的原因，除了有研發費用增加之外，那另外剛剛有提到的發行限制員工權利新股認列的較高的酬勞成本，那也使得這個管理費用有增加的情形。綜合以上的說明在2026年前三季產生的營業利益的金額大概是在新台幣的4.42億元，營業利益率大概是19%。"}, {"i": 12, "ts": "18:31", "sec": 1111, "who": "CEO特助 Kelly", "role": "公司", "text": "接下來是營業外收支的部分，請翻到投影片的第八頁。我們從投影片的第八頁可以看到在2026年前三季營業外收入的金額大概是新台幣的1.3億元，那跟去年同期相比的話這個部分金額是有增加的，主要是因為在2026年前三季我們認列的這個投資損失的金額較去年同期減少之外，那另外在今年度就是2026年第一季的時候也有認列處分投資的相關利益所產生。那跟大家報告一下就是在2026年前三季這邊有認列的投資損益的情況，那首先在2026年前三季對長光華芯這個部分我們還是有認列了一些投資損失金額大概是在新台幣1.05億元，那對上海常州嘉的部分在2026年前三季認列的投資利益金額大概是新台幣5694萬元左右，合計就是在2026年前三季來看的話，總共認列了投資損失大概是4850萬元左右。那接下來請大家再翻回投影片的第七頁，所以綜合以上的說明的話在2026年前三季我們產生的稅前淨利的金額大概是在新台幣5.73億元，前三季認列的所得稅費用大概是新台幣1.17億元，所以產生的稅後淨利的金額大概是在新台幣的4.55億元，歸屬於母公司稅後淨利的金額部分大概是在新台幣4.65億元。前三季每股基本盈餘每股EPS大概是新台幣3.91元，稀釋每股EPS大概是新台幣3.85元。研發費用以前三季前三季的這個在營收比重來看的話大概是9.7%，ROA的話是13.66%，ROE是15.63%。那接下來相關的資訊再請大家參考投影片的內容。那接下來請翻到投影片的第九頁，投影片的第九頁是資產負債表的部分。首先我們看到現金及約當現金的部分，在2026年9月30號現金及約當現金的餘額大概是在新台幣的25.09億元，那跟去年同期相比增加了144%，主要是來自於營業活動的現金流入增加，那在第一季的時候也完成了現金增資的作業。應收帳款的部分在2026年9月30號的餘額大概是在新台幣的4.08億元，存貨的部分大概是新台幣5.22億元。那接下來看到的是在2026年9月30號採用權益法的帳面投資金額是新台幣2.95億元，那這個部分的話目前只剩下對對上海常州嘉的投資。那跟去年同期相比下降的原因的部分，主要是我們在第一季有做了一些對長光華芯的這個投資處分，那另外剛剛也有提到對長光華芯的這個投資轉列至FVOCI的科目向下所產生的。接下來是固定資產的部分，在2026年9月30號固定資產的餘額大概是在新台幣的8.54億元，總資產金額大概是53.93億元。那接下來看負債的部分，應付帳款跟其他應付款在2026年9月30號的餘額大概是在新台幣的2.4億元左右，長期借款在這個季度底它的餘額大概是在1.47億元。總負債的部分在2026年9月30號的餘額大概是在新台幣6.87億元，股東權益金額大概是47.05億元。那接下來我們看到流動比率的部分，流動比率在2026年9月30號大概是967%，負債比率大概是13%，應收帳款週轉天數大概是45天左右，存貨週轉天數的部分大概是在129天。那接下來投影片第十頁是季度現金流量表的說明，大家可以看到的是在2026年第三季度來看，期初的現金餘額大概是在新台幣22.32億元，本季度來自於營業活動產生的淨現金流入金額大概是新台幣1.02億元，其他流動資產減少產生的淨現金流入數大概是在新台幣的2.14億元，購置固定資產產生的現金流出金額大概是在新台幣的677萬元左右，本期處分採用權益法投資產生的這個現金流入數大概是新台幣2370萬元左右。整體來講，本季度現金增加的金額大概是新台幣2.77億元，期末的現金餘額大概是新台幣25.09億元，自由現金流量產生的淨現金流入數大概是在新台幣3580萬元左右。那以上的說明結束，接下來是Q&A時間。"}, {"i": 13, "ts": "25:05", "sec": 1505, "who": "主持人 Anthony", "role": "主持人", "text": "接下來進入Q&A時間。今天的提問將採線上文字的方式進行，請各位投資先進直接於Webex會議中的聊天訊息欄位輸入問題。另外公司將優先回覆會前以收到的提問，接著再依序的回覆各位於會議中提出的問題。接下來就把時間交給環宇-KY的經營團隊，謝謝。"}, {"i": 14, "ts": "25:20", "sec": 1520, "who": "經營團隊", "role": "公司", "text": "好，謝謝各位投資人。那針對投資人在會前提問的問題先請我們的團隊先回覆。第一個問題投資人問到目前市場及業務未來的展望如何？"}, {"i": 15, "ts": "25:38", "sec": 1538, "who": "CEO 安寶信", "role": "公司", "text": "這個問題相當的general，我想市場大家看到的跟我們看到的應該很類似。我們看到應該今年、明年都是相當穩定的一個成長嘛。那客戶面我想那幾個大的player在短期內應該也不會有太大的變化，即使美國祭出這種FCC的限制也不會說今天公布明天就要實行，一定會有一個timeline。那大家都在anticipate這個事情在發生，也會做一些適當的一個布局。所以我覺得整個展望吧，應該是沒有太大的變化。應該我個人覺得今年、明年是相當穩定。"}, {"i": 16, "ts": "26:27", "sec": 1587, "who": "經營團隊", "role": "公司", "text": "接下來是有關CW laser 100mW驗證及出貨進度，目前的進度如何？"}, {"i": 17, "ts": "26:36", "sec": 1596, "who": "CEO 安寶信", "role": "公司", "text": "好，那個我們100mW稍微有些delay，那delay細節我們不用做太詳細的說明，但是我們現在是目標是在明年在第三季的時候能夠開始做量產，準備開始上量。那所以最最近這大半年的時間內就會focus在第一個是可靠度的驗證，第二個就是跟客戶之間的送樣，然後他們的verification。"}, {"i": 18, "ts": "27:15", "sec": 1635, "who": "經營團隊", "role": "公司", "text": "接下來是投資人問到之前有聽到100G PD 9月份出貨開始回升，想請問第四季的營收展望如何？營收動能可以持續嗎？"}, {"i": 19, "ts": "27:27", "sec": 1647, "who": "CEO 安寶信", "role": "公司", "text": "剛剛那個guidance有提到嘛，就是第四季會因為就是因為這個原因供貨穩定，然後在不同的生產的基地都同時開可以供貨，所以對對這個最起碼對100G的一個穩定供貨是相當有信心。"}, {"i": 20, "ts": "27:54", "sec": 1674, "who": "經營團隊", "role": "公司", "text": "接下來是請問200G產品認證的進度跟放量的時間點？"}, {"i": 21, "ts": "28:02", "sec": 1682, "who": "CEO 安寶信", "role": "公司", "text": "200G的產品我們事實上有一個客戶已經開始要上量，那因為現在在原來的設計因為受到基板的一個限制呢，我們現在會導入另外一個基板，然後在再做這個上量的準備。那我們是希望在明年在第二季開始的時候能夠有一個比較顯著的營收貢獻。"}, {"i": 22, "ts": "28:34", "sec": 1714, "who": "經營團隊", "role": "公司", "text": "接下來是磷化銦襯底晶片供應狀況跟價格的變化為何？"}, {"i": 23, "ts": "28:42", "sec": 1722, "who": "CEO 安寶信", "role": "公司", "text": "供應狀況是價格變化當然是往上，現在是供不應求。那我們基本上剛剛我看有些問題也是說對2027年，我們基本上2027年的基板都已經鎖定了，供貨不應該有問題。那裡面的變數呢可能還是回歸到表現在政治上面的一些一些不確定性，這是將來也是需要單單核准。那你做這個核准的這個動作就有可能會一些delay啊事情發生。但是整體的供應量我想我們是27年應該是沒有問題的。"}, {"i": 24, "ts": "29:28", "sec": 1768, "who": "經營團隊", "role": "公司", "text": "那公司目前的產能跟稼動率的狀況？"}, {"i": 25, "ts": "29:33", "sec": 1773, "who": "CEO 安寶信", "role": "公司", "text": "稼動率是more than 100%啦，就是cannot make enough。"}, {"i": 26, "ts": "29:42", "sec": 1782, "who": "經營團隊", "role": "公司", "text": "那接下來是投資人的提問，張先生的提問：貴公司先前法說會說明未來產能擴充將以結盟同業為主，台灣光通訊雷射龍頭廠聯亞在10月法說證實2年內PT級CW雷射產能將巨幅擴張6倍，既威利富後，貴公司是否可能演議結盟目前產能利用率處於歷史最低檔的全新？全新具備設計晶圓代工切割封裝測試完整產能能力，合規貴公司目前建立完整產線需求，結合有廠抗衡產能龐大的雷射領導廠聯亞，及同樣合併同業成為化合物半導體龍頭廠的穩懋，能否有助避免公司將來因產能不足？"}, {"i": 27, "ts": "30:30", "sec": 1830, "who": "CEO 安寶信", "role": "公司", "text": "我想這個這個是非常specific，我想我們不要針對個別公司做做做任何評論。但是這個產能我覺得不光是量，然後從一個策略的角度來看，可能也要做一些分散風險的一些動作，所以不要全部集中在一個地方，這個是我們現在在在看的。"}, {"i": 28, "ts": "31:00", "sec": 1860, "who": "經營團隊", "role": "公司", "text": "接下來是張先生的提問：貴公司因磷化銦基板耗盡補充不及導致7月營收大跌，公司努力與日本廠商商泰原料多元來源供應的可行，有廠同業頂元因建立長期充足的磷化銦基板等材料，近年斬獲多筆大單，成功擴張PT市佔，請問公司目前的磷化銦基板戰略庫存可組量生產的時間為多久？"}, {"i": 29, "ts": "31:26", "sec": 1886, "who": "CEO 安寶信", "role": "公司", "text": "就跟剛剛提到的，2027年沒問題，2028年的話我們也正在跟這個供應商在談。那至於頂元他們那個我想也是個別的公司我們也不方便做做評論。"}, {"i": 30, "ts": "31:44", "sec": 1904, "who": "經營團隊", "role": "公司", "text": "接下來是投資人Spender David的提問，請問磷化銦基板的產能供應是否能延續到明年下半年及200G PD公司的狀況？"}, {"i": 31, "ts": "31:55", "sec": 1915, "who": "CEO 安寶信", "role": "公司", "text": "這個我剛剛應該都說明過了，我想就不需要再再重複說明了。"}, {"i": 32, "ts": "32:03", "sec": 1923, "who": "經營團隊", "role": "公司", "text": "接下來是投資人許雲蘭的提問，能否請公司comment AI CSP目前現金流轉負，融資成本增加對未來AI資本支出動能的影響？"}, {"i": 33, "ts": "32:16", "sec": 1936, "who": "CEO 安寶信", "role": "公司", "text": "我想這個是跟我們隔了好幾層，我想這個應該是對對這個CSP他們的一個看法。那但是雖然這個comment在，這個現象在發生，但是我們還是沒有看到有任何slow down的一個現象。那至於說未來未來到什麼時候這個東西會不會發生，我們就很難做這些預測了。"}, {"i": 34, "ts": "32:53", "sec": 1973, "who": "經營團隊", "role": "公司", "text": "接下來是投資人張先生的提問：目前貴公司的磊晶基板材料大多委託全新化合物半導體公司生產，請問公司原生產生磊晶片的MOCVD機台目前是封存還是轉為研發用？將來是否可能演議出租給副材或有廠，或取磊晶技術移轉利益或出售呢？"}, {"i": 35, "ts": "33:18", "sec": 1998, "who": "CEO 安寶信", "role": "公司", "text": "我們沒有MOCVD機台，所以也沒有所謂的這個出租轉售的問題，謝謝。"}, {"i": 36, "ts": "33:29", "sec": 2009, "who": "經營團隊", "role": "公司", "text": "接下來是洪哲Albert的提問：中系客戶與美系客戶的200G PD分別有多少比例已完成認證？多少已穩定量產拉貨？可以給個區間比例嗎？目前環宇在200G PD的市佔率大概多少？比以往在100G PD高嗎？現在很多公司在做PD，好奇目前環宇的優勢在哪？良率效能或價格優勢？2027年磷化銦基板與磊晶的需求又有多少取得供應承諾？中國以外來源何時能達到有意義的比例？目前最限制出貨的是基板、磊晶、晶圓製造良率還是後端測試與封裝？CW laser目前進度以及送樣的客戶類型？客戶訂單有多少是最終端專案拉動？多少為避免缺料而提前備貨？公司目前訂單能見度與庫存如何？"}, {"i": 37, "ts": "34:34", "sec": 2074, "who": "CEO 安寶信", "role": "公司", "text": "OK，這問題挺多的，我一個個來哈。那個別客戶不管是中系美系都是我們的客戶，不太方便在這邊做一個區分。那剛剛也提到的已經有些客戶已經開始準備上量。那我們現在受的局限還是在基板這方面，所以我們會基板這個地方再做一個diversification分散的一個一個動作。那你現在要講說我們200G PD市佔率，這根本就沒法提，因為我們還正在上量，那肯定是没有過去100G高。那現在100G的PD，我想我們現在為什麼PD，我覺得我們還是良率跟效能吧。我們的規格肯定比別人好，所以你在做模組設計的時候可以省掉一些其他的extra cost，一些component之類的。那我們是四吋的生產，我想很多還是在兩吋跟三吋，三吋甚至於還有兩吋，所以我們在一個價格上面不能說是絕對的優勢，但是絕對是有競爭力。那像剛剛提到的27年的基板沒問題，磊晶也沒問題。中國以外的還需要點時間，我覺得27年是在一個往上爬的階段，可能要到28年以後吧才會比較有意義的一個比例。限制出貨就是基板吧，我想其他的其他的沒有什麼太大的問題，我覺得從磊晶、晶圓製造、後段的部分應該都不是一個bottleneck。基板的產能也不是bottleneck，我想你去問AXT他們產能今年會double，明年再double，這個不是問題，這個這個問題是一個政治上的問題。CW laser剛剛也提到過了，我們是希望能夠在明年中間的時候能夠開始做上量的準備。至於說這個是實際還是有double booking，我覺得double booking是絕對有的，但是多少不知道。我想這個因為缺貨的關係大家都panic，所以在這種狀況之下的話我們基本上是沒有庫存啦，反正生產的基本上就很快就拉出去了。能見度的訂單我們foundry的訂單都到明年的明年的6月，在PD的這邊到27年整年應該客戶都沒有給我們訂單，但是都有給我們一些forecast，我們也做相應的準備。"}, {"i": 38, "ts": "37:52", "sec": 2272, "who": "經營團隊", "role": "公司", "text": "接下來是投資人許雲蘭的提問，請問Lumentum與Marvell合併對光通產業的影響？"}, {"i": 39, "ts": "38:00", "sec": 2280, "who": "CEO 安寶信", "role": "公司", "text": "我個人覺得是個正面，這個顯然就是Marvell準備要跟Broadcom做head on的一個competition。那他過去只能在電的晶片上面，那現在有了光的晶片，我想他整個portfolio是相當的完整。那我覺得這可能就是個期頭吧，可能其他做電的也會開始思考是不是要做類似的一些整合。那但是對整體的supply/demand應該應該不會有太大的影響吧，我個人覺得啦。只是說這個你說這個價錢會不會有些受到影響，那你如果Marvell跟跟這個跟這個Broadcom黑洞在競爭，能夠挑戰Broadcom的一個領導地位，那我相信這個在在價錢上面可能就會有一些些調整。那這對整個產業也我覺得也是一件好事情，因為現在很多東西實在是貴的貴的有點不像話。"}, {"i": 40, "ts": "39:23", "sec": 2363, "who": "經營團隊", "role": "公司", "text": "接下來是投資人全燈Xavier的提問，請問100mW CW laser delay到2027年Q2的原因？"}, {"i": 41, "ts": "39:32", "sec": 2372, "who": "CEO 安寶信", "role": "公司", "text": "原因不方便細說了，主要是因為還是跟客戶之間的一些feedback回來要做些調整，主要是這個原因。"}, {"i": 42, "ts": "39:44", "sec": 2384, "who": "經營團隊", "role": "公司", "text": "接下來是臺台中銀投信Scott的提問，請問26年100G PD較25年的市佔是否有變化以及27年如何看待？"}, {"i": 43, "ts": "39:54", "sec": 2394, "who": "CEO 安寶信", "role": "公司", "text": "25年跟26年，26年我想市佔率應該沒有差差太多。27年的話就可能稍微有一點點影響，因為我們在今年發生的這個基板短缺的狀況，那客戶端也對supplier做一些調整，影響不大，但是我們因為同時開了很多不同區域的一個供貨的能力供貨的能力，所以我我是挺有信心的話我們可以把這個market share在最起碼維持住。"}, {"i": 44, "ts": "40:51", "sec": 2451, "who": "經營團隊", "role": "公司", "text": "接下來是投資人Lisa Chen的提問，70mW占比為何？目前及未來的狀況？那威利富目前狀況如何？"}, {"i": 45, "ts": "41:04", "sec": 2464, "who": "CEO 安寶信", "role": "公司", "text": "70mW的占比因為我們老師講沒有什麼占比，現在還是在一個sample階段。那我們70個mW也是一樣的一些客戶的feedback回來在做一些調整。那我們自己的產能主力會是在100個mW，那70個mW我們以前也提過會leverage我們的合作的那個partner由他來主要是由他那邊來來做提供。威利富這邊的話我們，欸我們那個公告了沒有？公告還沒，會後。對，所以現在可以講嗎？應該可以吧，今天會公告嘛。OK，那我們今天董事會也通過了對威利富增資的一個一個議案嘛，那目的就是要增加他那邊的產能，然後把一些設備缺的設備做一個補齊。將來威利富會是我們在美國以外的一個一個很重要的一個生產生產基地。"}, {"i": 46, "ts": "42:27", "sec": 2547, "who": "經營團隊", "role": "公司", "text": "接下來是投資人洪哲Albert的提問，200G PD所需的InP基板和磊晶片與100G PD是否共用供應鏈？目前限制出貨的是基板磊晶產能還是公司自己的製程與良率？材料價格有沒有辦法反映給客戶？第二題200G PD的競爭者和100G時代有什麼不同？客戶選擇環宇主要是看價格、品質、交期還是產能？公司認為自己的市佔會如何變化？"}, {"i": 47, "ts": "43:08", "sec": 2588, "who": "CEO 安寶信", "role": "公司", "text": "我想剛剛這些問題前面都有講過嘛，我在重複一下好了。基板是一樣的，磊晶片的結構不一樣。供應鏈當然是可以共用。那限制出貨的主要是基板。那其他的都沒有什麼問題。那材料價格我們是會反映給客戶，但是有時候這個反映給客戶的速度有時候還趕不上這個材料價格的一個增長，所以這個這個年頭就是型勢比人強，我們只好積極的應對就是。200G的競爭者跟100G有什麼不一樣？200G這邊的話是Silicon Germanium的PD有佔到一席，但是他們的因為物理性質的關係，所以整個模組的設計會比較複雜一些。所以我覺得這是一個對我們來講是一個好事情，我們在InP的規格還是會比Silicon Germanium的好很多。那我想剛剛也提過了我們客戶選擇我們，就是一個品質交期產能，價格是secondary。市佔的話我剛剛提到100G應該是相當穩定，那200G我們剛開始我們會在積極的去爭取市佔率。"}, {"i": 48, "ts": "44:50", "sec": 2690, "who": "經營團隊", "role": "公司", "text": "接下來是投資人秀峰的提問，請問為什麼淨利成長營業現金流卻下降？"}, {"i": 49, "ts": "44:56", "sec": 2696, "who": "CEO特助 Kelly", "role": "公司", "text": "我這邊說明一下，這位投資人您提到的問題是有看到就是這一季度的這個營業活動的現金流下降，那這邊主要的原因應該是這個應收帳款增加還沒有收現，但是整體來看的話我們應收帳款的周轉天數是在45天左右，那這個部分也是跟跟過去相比其實沒有差異太大，也都在合理的這個客戶的授信期間之內。"}, {"i": 50, "ts": "45:53", "sec": 2753, "who": "經營團隊", "role": "公司", "text": "接下來是投資人Nick Huang的提問，台幣匯率波動對公司的影響？"}, {"i": 51, "ts": "46:02", "sec": 2762, "who": "CEO特助 Kelly", "role": "公司", "text": "我這邊說明一下，那基本上我們現在公司的營運主體還是在美國GCS LLC這邊，那主要的這個收付款項的部分還是以美金為主，那台幣波動的部分目前對公司來講影響不大。"}, {"i": 52, "ts": "46:27", "sec": 2787, "who": "經營團隊", "role": "公司", "text": "接下來是投資人Paul的提問，您好，如何看待上海常州嘉光電26年Q3的盈利比26Q1、Q2較差和上海常州嘉光電26年Q4及27年的展望為何？謝謝。"}, {"i": 53, "ts": "46:45", "sec": 2805, "who": "CEO 安寶信", "role": "公司", "text": "這個我們不方便做評論吧，因為這個還是有其他的股東在這邊，在這個常州嘉這邊。"}, {"i": 54, "ts": "47:00", "sec": 2820, "who": "經營團隊", "role": "公司", "text": "接下來是投資人大衛璞的提問，請問今明兩年產能及擴產的規劃為何？"}, {"i": 55, "ts": "47:07", "sec": 2827, "who": "CEO 安寶信", "role": "公司", "text": "今年我們基本上就像剛剛提到的，在台灣以外的生產基地，然後威利富這邊的增資跟產能擴張，然後我們在美國這邊的話也會把clean room做做一些擴張，然後把一些bottleneck的tool也會補齊，這個應該在明年Q2的時候可以完成吧。那明年的計劃的話是是有一些計劃但是現在不太方便跟各位報告。"}, {"i": 56, "ts": "47:46", "sec": 2866, "who": "經營團隊", "role": "公司", "text": "接下來是投資人洪哲Albert的提問，剛剛提到200G客戶要上量，因為基板限制，所以會導入另外一個基板，另外一個基板是什麼意思？"}, {"i": 57, "ts": "47:58", "sec": 2878, "who": "CEO 安寶信", "role": "公司", "text": "另外一個廠家的基板，因為原來那個廠家的量供應不如我們的預期，所以我們會導入另外一個基板的廠商。"}, {"i": 58, "ts": "48:26", "sec": 2906, "who": "經營團隊", "role": "公司", "text": "接下來是統一投顧Jeffery的提問，想請問管理層剛剛有提到200G PD因為基板限制問題，是因為上游磊晶問題嗎？還是更上游的基板問題？"}, {"i": 59, "ts": "48:41", "sec": 2921, "who": "CEO 安寶信", "role": "公司", "text": "我說明一下，這個限制不是因為100G的那種限制，出口管制幹嘛的。那因為我們在做200G的時候當初因為有這個中國這個問題，所以我們事實上導入的是國外，中國以外的基板廠商。那但是這個基板廠商它自己本身在提升產能的上面沒有預期的好，那我們現在就就可能要回到說從中國那邊拿基板，然後還是要回歸到這個出口管制的這些流程。就像我剛剛提到的，我們在27年中國以外的基板的供應還沒有辦法做到一個合適的level，所以還是要rely on中國的出口。"}, {"i": 60, "ts": "50:04", "sec": 3004, "who": "經營團隊", "role": "公司", "text": "接下來是玉山James的提問，能否具體針對200G PD和100mW CW laser驗證進度、小批量出貨、大批量出貨的時間點做說明？"}, {"i": 61, "ts": "50:18", "sec": 3018, "who": "CEO 安寶信", "role": "公司", "text": "200G PD所有的驗證都已經完成，那現在剛剛提到的我們現在對這個客戶這個需求我們要做好準備，所以要做一個incremental的一個verification，這樣子的話對大批量我們就比較能夠有把握、能夠能夠掌控得住。我想這個時間點應該在明年Q2的時候能夠發生吧。那100mW的CW是小批量是要在明年Q3的時候，Q4的時候我們可以做大批量的出貨。"}, {"i": 62, "ts": "51:06", "sec": 3066, "who": "經營團隊", "role": "公司", "text": "接下來是投資人David的提問，請問公司對未來光通訊領域的InP和矽光PD兩者應用的想法？"}, {"i": 63, "ts": "51:17", "sec": 3077, "who": "CEO 安寶信", "role": "公司", "text": "InP是不會被完全取代，因為你這個物理特性你要發光你就必須在這種材料之下才能。那矽則矽有它的限制，我的理解是矽的PD你大概做到200G吧，再往上push就就有困難了，所以將來400G的PD是應該還是InP為主。那我剛剛也講到矽的PD跟對InP的PD在規格上面還是有差距，所以客戶在設計矽的PD它的設計跟用InP的PD的設計會不一樣。理論上這個這個矽的PD可能需要更多的Some know-how吧，可能會比較複雜一點。那那我覺得in the long run這個again這個InP是不會被被取代，那矽也有它的一個生存的一個空間，我想這兩者或許有些衝突吧，但是不是一個完全全全面的一個你升我長的這種局面。"}, {"i": 64, "ts": "52:48", "sec": 3168, "who": "經營團隊", "role": "公司", "text": "接下來是摩台投信研究處林竣婷的提問，想請問公司基板部分我們蓋2027年供應無虞，但存貨的部分實際上QQ是負的11%，因此想確認我們是通過長約的方式來做確保供應嗎？"}, {"i": 65, "ts": "53:03", "sec": 3183, "who": "CEO 安寶信", "role": "公司", "text": "對，我們是經過長約的方式。那我說明一下，因為基板這部分並不是我們直接去買，我們是經過我們的磊晶的廠商去做這些。那我們是跟磊晶的廠商說我們需要多少，他去跟基板的廠商說能夠把我們這個量能夠把它鎖住。那當然裡面會牽涉到一些prepayment的term啊這些都是在進行。所以基本上是以長約的方式來確保供應，沒錯的。"}, {"i": 66, "ts": "53:41", "sec": 3221, "who": "經營團隊", "role": "公司", "text": "接下來是投資人Ashley的提問，請問100G PD和200G PD ASP的差異？"}, {"i": 67, "ts": "53:47", "sec": 3227, "who": "CEO 安寶信", "role": "公司", "text": "這個不方便評論。"}, {"i": 68, "ts": "53:53", "sec": 3233, "who": "經營團隊", "role": "公司", "text": "接下來是投資人Lisa Chen的提問，威利富現在產能及近期產出可否在細部更新？"}, {"i": 69, "ts": "53:59", "sec": 3239, "who": "CEO 安寶信", "role": "公司", "text": "這個也不太方便，因為還是那樣威利富不是我們獨家的一個shareholder，我想很多的information是是不方便在公開的場合跟大家說明。"}, {"i": 70, "ts": "54:21", "sec": 3261, "who": "經營團隊", "role": "公司", "text": "接下來是Lisa Chen的提問，未來的費用都會這樣高嗎？員工認股權影響未來每個季度嗎？"}, {"i": 71, "ts": "54:30", "sec": 3270, "who": "CEO特助 Kelly", "role": "公司", "text": "先說明一下，Lisa您剛剛問的問題是限制員工權利新股的認列酬勞成本的部分，這個會依照就是發行RSA的這個發行的計的期間的這個部分去去做一個攤銷。所以只要是有發行RSA的部分就是會在依發行辦法內容去去做费用的認列計算。那費用的部分剛剛在Claire在先前報告的時候已經有提供這個guidance的資料作為參考。"}, {"i": 72, "ts": "55:38", "sec": 3338, "who": "經營團隊", "role": "公司", "text": "接下來是駿宇資本Amy Hsiao的提問，公司好，請教目前美系IDM廠也在積極尋找200G PD外包產能，是否代表200G PD收發模組量產瓶頸？公司目前是否也一樣從26年Q4開始逐步量產？以及在這種狀況下，200G PD的價格是否可持續維持較高的水準？"}, {"i": 73, "ts": "56:04", "sec": 3364, "who": "CEO 安寶信", "role": "公司", "text": "我想這個美系IDM，我想大家都知道是誰，前陣子也是傳了很多。據我的理解跟他們內部的談這個方面可能是有一些變化。那基本上我覺得對對這些以laser為主的廠來看的話，它生產laser所能拿到的revenue跟這個利潤遠高於PD。所以在這個狀況之下他們自己會做一些調整。我不覺得這是代表1.6T收發模組是一個是一個瓶頸。200G的PD我們剛剛已經講過了，我們是從26年Q4開始小批量的出貨。那我們希望在27年Q2的時候能夠開始大批量的出貨。在這種狀況之下，200G PD的價格是否可持續維持較高的水準？我想相對於100G肯定是如此，但是能不能夠一直持續，我想這個這個supply跟demand永遠都是如此，你到這個量很大時候供貨很穩定的時候，這個價錢自然做一些調整。"}, {"i": 74, "ts": "57:44", "sec": 3464, "who": "經營團隊", "role": "公司", "text": "我想時間關係，那今天的法說會就到此結束。那各位投資人可以離開會議，謝謝。"}, {"i": 75, "ts": "58:04", "sec": 3484, "who": "CEO 安寶信", "role": "公司", "text": "好，謝謝。"}], "qa": null, "chars": 12971, "last_min": 58, "cpm": 223, "status": "full", "memo": [{"title": "亮點", "points": [{"text": "2026Q3單季營收達8.44億元，毛利率回升至47%。", "ts": "04:26", "who": "CFO", "seg": 2}]}, {"title": "營收", "points": [{"text": "2026Q3營業收入為新台幣8.44億元，季增9.7%。", "ts": "07:03", "who": "CEO特助", "seg": 5}, {"text": "2026年前三季累計營業收入達23.29億元，年增54%。", "ts": "16:00", "who": "CEO特助", "seg": 11}]}, {"title": "毛利與獲利", "points": [{"text": "2026Q3單季毛利率回升至47%，營業利益為1.63億元。", "ts": "10:06", "who": "CEO特助", "seg": 7}, {"text": "2026Q3單季EPS為1.33元，年前三季累計EPS為3.91元。", "ts": "14:40", "who": "CEO特助", "seg": 9}]}, {"title": "營運指引", "points": [{"text": "預估2026Q4營收介於美金3,000萬至3,400萬元區間。", "ts": "05:46", "who": "CFO", "seg": 3}, {"text": "預估2026Q4毛利率維持在46%至50%區間。", "ts": "05:58", "who": "CFO", "seg": 3}, {"text": "預估2026Q4營業費用為美金760萬至860萬元。", "ts": "06:19", "who": "CFO", "seg": 3}]}, {"title": "產能與擴產", "points": [{"text": "目前產能利用率超過100%，產能呈現滿載。", "ts": "29:34", "who": "CEO", "seg": 25}]}, {"title": "產品與技術", "points": [{"text": "100mW CW Laser驗證略有延遲，目標2027Q3開始量產。", "ts": "26:50", "who": "CEO", "seg": 17}, {"text": "200G產品預計於2027Q2開始帶來顯著營收貢獻。", "ts": "28:24", "who": "CEO", "seg": 21}]}, {"title": "Q&A", "points": [{"text": "問：對明年（2027）市場與業務展望為何？／答：預估明年整體產業與公司營運將保持穩健成長。", "ts": "25:40", "who": "CEO", "seg": 15}, {"text": "問：100mW CW Laser出貨與量產進度？／答：進度略有延遲，預計明年第三季開始量產。", "ts": "26:50", "who": "CEO", "seg": 17}, {"text": "問：200G產品客戶認證與貢獻時程？／答：已有客戶開始量產，預計明年第二季起有顯著營收貢獻。", "ts": "28:24", "who": "CEO", "seg": 21}, {"text": "問：磷化銦（InP）基板供應與價格趨勢？／答：價格呈上升趨勢，但2027年供貨量已完成鎖定。", "ts": "29:00", "who": "CEO", "seg": 23}, {"text": "問：目前產能利用率狀況為何？／答：目前產能利用率高於100%。", "ts": "29:34", "who": "CEO", "seg": 25}]}], "quotes": [{"report": "2026-11-11", "quotes": [{"cat": "展望", "text": "所以我話不多說，我們就請Claire對上一季做一個summarize，然後這一季做一個預測 guidance。", "anchor": "02:34", "who": "CEO 安寶信", "seg": 1}, {"cat": "展望", "text": "好，各位好，那我接下來就是為各位進行Q3的一個營運總結以及Q4的一個展望。", "anchor": "04:14", "who": "CFO Claire", "seg": 2}, {"cat": "本季實績", "text": "Q3的部分我們的revenue達到了美金26.4個million，gross margin也回升至47%。", "anchor": "04:14", "who": "CFO Claire", "seg": 2}, {"cat": "本季實績", "text": "Operating expense的部分達到7.3個million，佔營收27.7%，稅後淨利達到5個million。", "anchor": "04:14", "who": "CFO Claire", "seg": 2}, {"cat": "營益率與費用", "text": "那operating expense比上一季的預期略低的原因，主要是因為100mW的CW laser的進度有所delay至下一季以及Q2 2027年，因此這個部分的話比上一季的預期略低。", "anchor": "04:14", "who": "CFO Claire", "seg": 2}, {"cat": "營收", "text": "那關於Q4的展望的話，revenue的部分因為AOC的產品需求持續的強勁，那公司我們也因為投資了威利富，有額外的產能，所以因此我們期望可以達到30到34個million。", "anchor": "05:32", "who": "CFO Claire", "seg": 3}, {"cat": "毛利率", "text": "Gross margin的部分也因為我們的主力產品仍然放在AOC，因此gross margin我們預期可以達到46到50%區間。", "anchor": "05:32", "who": "CFO Claire", "seg": 3}, {"cat": "營益率與費用", "text": "Operating expense的部分，像剛剛所說的，因為CW laser有所推遲，因此在Q4開始會進行amortization，預期會提高至7.6到8.6個million區間。", "anchor": "05:32", "who": "CFO Claire", "seg": 3}, {"cat": "本季實績", "text": "在2026年第三季度的營業收入金額大概是在新台幣8.44億元，那相較於本年度第二季度也就是上一季度的營收表現來看，以原幣美金數相比的話，這個營收大概是增加了8.37%，跟台幣數相比的話大概是增加了9.7%。", "anchor": "06:36", "who": "CEO特助 Kelly", "seg": 5}, {"cat": "營收", "text": "那接下來以產品類別來看的話，在無線射頻晶圓代工的這個部分，本季度較前一季度的營收金額略減了7.64%，那這個主要的原因是因為RF foundry的代工營收在第一季的時候因為有部分的生產出貨的時程delay到第二季，所以使得第二季的營收表現來講是相對比較高的情況，兩相比較之下RF營收有略減的情形。", "anchor": "06:36", "who": "CEO特助 Kelly", "seg": 5}, {"cat": "營收", "text": "那另外在光電晶圓代工的這個部分，本季度的營收較上一季度相比大概降低了37%，那這邊主要是因為公司有調整接單客戶的部分，改以重要的客戶或者是未來預計會投片生產的客戶訂單為主。", "anchor": "06:36", "who": "CEO特助 Kelly", "seg": 5}, {"cat": "營收", "text": "那接下來在自有品牌光元件AOC的這個部分，本季度的營收較上一季度相比的話大概是增加了25.8%，那主要是因為在第二季的時候有受到基板供應限制，那造成累積晶圓原料短缺的影響出貨減少，那隨著基板跟KGD廠商供應逐漸的回穩，那本季度的銷量有較上一季度增加，所以營收也有跟著提高。", "anchor": "06:36", "who": "CEO特助 Kelly", "seg": 5}, {"cat": "本季實績", "text": "那接下來我們再看2026年第三季度相較於去年同期的營收比較，以原幣美金數相比的話，在2026年第三季的營收大概是增加了46.5%，台幣數相比大概增加了55%。", "anchor": "08:51", "who": "CEO特助 Kelly", "seg": 6}, {"cat": "營收", "text": "那跟上一個季度相比，上一季度的毛利率是43.3%相比的話大概是增加了3.7%，主要的原因有以下幾點：第一點就是主要是本季度自有品牌光電元件AOC的這個銷量增加，那我們可以從產品組合比重來看的話，自有品牌光電元件的這個產品收入營收比重有提高，在2026年第二季營收比重大概是61%，本季度的話大概是在71%左右。", "anchor": "09:56", "who": "CEO特助 Kelly", "seg": 7}, {"cat": "展望", "text": "第一個問題投資人問到目前市場及業務未來的展望如何？", "anchor": "25:20", "who": "經營團隊", "seg": 14}, {"cat": "展望", "text": "我們看到應該今年、明年都是相當穩定的一個成長嘛。", "anchor": "25:38", "who": "CEO 安寶信", "seg": 15}, {"cat": "展望", "text": "所以我覺得整個展望吧，應該是沒有太大的變化。", "anchor": "25:38", "who": "CEO 安寶信", "seg": 15}, {"cat": "營收", "text": "接下來是投資人問到之前有聽到100G PD 9月份出貨開始回升，想請問第四季的營收展望如何？", "anchor": "27:15", "who": "經營團隊", "seg": 18}, {"cat": "展望", "text": "2027年磷化銦基板與磊晶的需求又有多少取得供應承諾？", "anchor": "33:29", "who": "經營團隊", "seg": 36}]}]}, {"key": "3006_2026-11-02", "code": "3006", "name": "晶豪科", "date": "2026-11-02", "segs": [{"i": 0, "ts": "00:00:26", "sec": 26, "who": "主持人", "role": "主持人", "text": "好，各位投資先進午安，歡迎蒞臨晶豪科技股份有限公司法人說明會。本次很榮幸邀請到經營團隊為各位針對公司發展情況及未來展望進行簡報說明。簡報說明後將進入問與答的階段，歡迎各位投資先進踴躍提問。接下來向各位介紹今日的與會經營團隊。首先是董事長暨總經理張明健張總，您好。第二位是張冠群財務長。第三位是公司發言人吳鴻基特別助理。那接下來我們把時間交給公司，謝謝。"}, {"i": 1, "ts": "00:01:25", "sec": 85, "who": "董事長", "role": "公司", "text": "謝謝常佑，那謝謝凱基證券提供我們一個那麼大的場地，來供晶豪科技舉行這次的法說會。我想感謝各位投資先進在百忙之中抽空來參加這一次的晶豪法說會。那首先呢，我們請吳特助先講一下我們近期的營運狀況，那講完以後我們再做 Q&A。謝謝各位。"}, {"i": 2, "ts": "00:02:02", "sec": 122, "who": "發言人", "role": "公司", "text": "各位投資先進大家午安。那接下來由我來大概說明一下我們的第三季的一個。好，首先我們來看一下，公司我們大概就是目前產品線主要以記憶體為主，這個部分約莫大概都超過大概 90% 以上。那尤其今年因為記憶體的價格漲得非常的高，所以可能差不多在 95% 的狀況了。那另外我們就還有一個類比數位的 Audio 產品線，那這部分 maybe 接近 5% 左右。另外還有 Motor Driver、Wireless SoC，另外還有我們有新產品開發的產線，這邊還有 Sensor 的 IC。那這部分大概都還是屬於初期的階段。那整體的產品線大概是像這樣子。那我們大概除了產品以外，當然還有提供我們的客戶包含技術、服務等等這些相關的服務項目。"}, {"i": 3, "ts": "00:03:19", "sec": 199, "who": "發言人", "role": "公司", "text": "好，那我們來看一下我們整個 2026 年到目前為止，我們的營收的一個表現狀況。我們先把時間拉回到 2021 年的。那為什麼看 2021？因為那一年是缺貨潮，上次在前一波在塞港，然後整個市場上的一個狀況表現，不只是記憶體，是全面性的 IC 的缺貨。我們當年度的 record high 是在一個月 23.7 億，整個年度大概是 238 億。那我們也知道後來發現那個缺貨潮是一個大家預期會發生後面要缺貨的一個期待造成的結果，但實際上到最後發現我們那個期待並沒有發生，所以到那一年的第四季以後，整個營收的 trend 就開始往下。那後面就整個進入一個寒冬期，一直到去年這個時候，去年第三季我們來這邊做說明的時候，還是在很擔心的整個年度還沒辦法轉正。那個年度所幸我們是在去年到尾巴，到最後有在第四季有上來，所以去年才勉強轉成整個年度有獲利。"}, {"i": 4, "ts": "00:04:49", "sec": 289, "who": "發言人", "role": "公司", "text": "那延續到去年年底，那時候已經看到跟大家那時候有覺得記憶體應該是會開始回復一個好的光景，但是會好到什麼樣程度，那時候還說不准。那我們來看一下到今年，延續到去年年底的這一個超過 20 億以後，就一路從 20 億爬到到 3 月份到第二季就到 40 億了，從 20、30 到 40 的一個月營收，到第三季就可以到 70 億了。所以你會看到我們的營收的表現在整個一季一季大概是一個階梯式的一個爬升。那為什麼會是這個狀況呢？因為我們的記憶體跟客戶這邊談定的價格，有蠻大比重是屬於 contract 價格的一個談定，那這個部分大概是一季一季談。所以基本上整個爬升狀況就會跟著一季一季的階梯式，除了還有部分的 spot price 以外會反應得比較快速，那屬於 contract price 部分大概都一季一季上來，所以就會有一季一季爬升的這種 pattern 的一個狀況。"}, {"i": 5, "ts": "00:06:09", "sec": 369, "who": "發言人", "role": "公司", "text": "那整個延續到第三季的狀況呢，我們的第三季的單季的營收是大概 221.5 億。那我們可以看一下，我們剛剛有提到 2021 年是我們之前的年度 record high 大概是 238 億多，所以可以看得到我們現在目前 Q3 的單季營收已經接近我們過去 record high 的那個年度的全年度營收。所以今年度的一個狀況表現是非常亮麗。那基本上呢，還是來自於整個市場價格的一個爬升幅度，從年初到第三季爬升幅度非常可觀。那至於量的部分其實以現在我們合作的晶圓廠他們能夠提供給我們在現階段的量，相對它的增產的幅度其實相對是比較受限的，在現階段來看。所以基本上它還是從價的表現上得到的這個結果，主要是這樣子。"}, {"i": 6, "ts": "00:07:13", "sec": 433, "who": "發言人", "role": "公司", "text": "那我們再來看一下從損益的角度來看，整個從去年的第四季我們說那時候開始看到市場回溫了，那 Q1、Q2、Q3 毛利率是最近的四個季度一路從毛利率從三十幾趴到四十幾趴，到 Q2 的時候接近 70，Q3 的時候又再爬得更高，快到 80，已經到 77.44。那整體來看，這個部分就是剛剛提到的營收、毛利因為價格的爬升速度非常快、非常大，所以有這麼好的一個表現。那營業利益相對的我們也可以看得到，從去年底的第四季大概 20% 到超過 30% 到過半 51%，那我們 Q3 已經接近 60%。所以這個也是相對的這樣的一個爬升的狀況。所以整個第三季的 EPS 大概是已經爬到 36.79。"}, {"i": 7, "ts": "00:08:22", "sec": 502, "who": "發言人", "role": "公司", "text": "好，那如果在跟上一季的比較，跟去年同期的比較來看，我們看看營業收入跟去年同期比已經相對的增加了五倍多。那當然如果從營業利益角度來看，那是更沒辦法去比較，因為去年這個時候營業利益還沒有打正。那如果跟上一期在 Q2 的比較來看的話，營收有接近六成的成長，營業利益有超過八成的一個成長性。那最近的稅後淨利從 Q2 也是從 20 爬升到 36.79，那去年同期大概剛好是處於一個 break even，從負轉正的一個過程。"}, {"i": 8, "ts": "00:09:08", "sec": 548, "who": "發言人", "role": "公司", "text": "好，那整體來講剛剛提到本業在第三季的表現，量其實還是算是持平的，主要還是來自於價的一個爬升，價格在市場上的一個亮麗的表現。所以也導致營收跟毛利還有營業利益剛剛提到的，都有大幅度的一個成長性。那業外的部分相對的就是之前的季度大概還有匯兌的一個收益，這一季因為台幣相對於美金的一個變動性，所以這個部分我們相對有回吐一些。不過目前看起來 Q4 因為美金又開始在成長，所以 Q4 可能還會再有一些正的利益的回饋回來。"}, {"i": 9, "ts": "00:09:57", "sec": 597, "who": "發言人", "role": "公司", "text": "那如果從資產負債表的角度來看，大家通常會很在意我們的存貨。那我們來看一下，從去年的第三季從七十幾，到今年的第二季大概是 80 億左右，那到 Q3 9 月底的時候到 90 億。那其實上如果說這個季度跟 Q2 的季底來比的話雖然有成長，但是因為這個是以價來算的，以成本價來算，所以還是來自於價的成長性為主。也就是說相對的大家可以想像我們的確在 cost 這邊會在晶圓廠這邊的調價或封裝測試這邊的調價，對我們存貨的這邊成長會有一定的一個影響，從這邊會有拉升上來。那量也許有多一點，但不會有那麼大的一個比重。"}, {"i": 10, "ts": "00:11:06", "sec": 666, "who": "發言人", "role": "公司", "text": "那另外在短借，資產負債表在短借的這邊，看得到我們 Q2 維持了一個 10 億的一個短借的借款。那是因為我們在 Q2 我們有發行 CB，那時候正在一個案子在等著定價競拍的過程。那因為 CB 還沒發行，我們這個原來已經寫在 CB 的案子裡面預計要償還的貸款，就在等到 CB 發行後這邊才能夠做清償。那這個部分我們在 10 月份，10 月 2 號已經掛牌了，所以這部分其實在 10 月份已經清償掉。也就是說目前短借的部分這邊我們其實在 10 月份目前也已經全部償還完，那後面就看營運上還沒有需要再有新的融資的需求，我們再看後面的一個計劃狀況。"}, {"i": 11, "ts": "00:12:01", "sec": 721, "who": "發言人", "role": "公司", "text": "好，那整體我們再來看一下 Q3 的一個 update。我們之前提過傳統的記憶體，我們這邊所指的傳統記憶體主要就是指 HBM 以外的，屬於單顆的這種 DRAM 或者是其他的一個產品線。那這個部分因為 AI 的需求導致 HBM 把傳統記憶體的，因為 HBM 也是要拿 DRAM 去疊層它的 CoWoS 的一個製程去疊成多晶片的一個解決方案。那這個部分它 HBM 把 DRAM 產能吸走了以後，那傳統記憶體這邊的供應端就出現缺口。那這個部分我們從去年我們就一直提到說 LLM 出來就訓練推到推理跟思考，包含到後來到代理，那目前實體 AI 也實現了。那這個對我們的意義是什麼呢？這意義是說，因為記憶體的供需稀缺，這個部分的結構性已經改變了，那我們看到的的確應該已經降低了景氣循環的這種特性，在記憶體這個市場上現在看起來應該不再像以前這樣來用景氣循環來看。"}, {"i": 12, "ts": "00:13:19", "sec": 799, "who": "發言人", "role": "公司", "text": "好，那因為傳統記憶體的產能受限的狀況下，它已經進入一個極度稀缺的狀況，所以缺貨的一個狀況已經也從 DDR5、DDR4 蔓延到我們之前在上半年有跟各位先進報告過 D2、D3 這邊，也已經通通蔓延出來，甚至於到 Flash。所以這個部分在今年看到是從一路過來，D2、D3 還有 Flash 的價格都是持續在翻身，那目前也還是。那到第四季也可以被這樣子來期待。那在第三季我們還看到一個重點，就是在 D2、D3 的供應上面，目前主要就是除了我們以外還有國內的大廠，國內大廠就是有晶圓廠的我們其他的競爭同業。那因為他的客戶那邊對他的晶圓廠的使用的經濟效益上面，他還是去生產比較大顆的像 DDR4 的這樣的產品對他而言是比較有他的一個效益在，所以他們也就決定在 Q3 過程當中看到他包含停供或者是減供。那這部分就變成是他的客戶也會來跟我們這邊尋，那相對的就是說在我們這邊我們的比重 D3、D2 的供應量相對是最高的，我們 D2、D3 這兩個產品加起來在我們的營收比大概有超過 50%，所以目前我們大概是整個市場上在 D2、D3 的主要的一個供應者。那包含我們的競爭的其他同業他已經減少供給的狀況下，目前幾乎大概都是由我們這邊來在提供這一個市場的需求。"}, {"i": 13, "ts": "00:15:13", "sec": 913, "who": "發言人", "role": "公司", "text": "那傳統的記憶體的一個，傳統的 DRAM 也在這個過程當中需求因為包含 PC、NB 或手機它必須要搭配 AI 應用的這些系統，那所以它搭配更多的記憶體，所以也因為這樣子它造成了傳統記憶體的 DRAM 需求在這個過程當中有成長的一個狀況。那所以也帶動了剛剛提到非 HBM 的記憶體的需求也起來。再加上屬於是地端 Edge 端的 AI 應用的需求，這邊已經開始陸陸續續看到一些應用系統，比較明顯可以看得到比較大的系統像機器人、自駕的計程車，這個已經都落地在實現了。那所以我們可以期待的是說未來蓬勃起飛很多大大小小的搭載 AI 應用系統這樣子的終端的一個應用陸陸續續會出來，所以對於傳統 DRAM 的需求的一個成長性是適度的非常可觀的。"}, {"i": 14, "ts": "00:16:18", "sec": 978, "who": "發言人", "role": "公司", "text": "好，那 Q3 大概大家會比較在意的是說，因為記憶體的價格在這段時間漲的幅度非常非常的高，那終端應用系統是不是扛得起？那就說如果他的應用的搭載的記憶體它的 BOM 表裡面需要承載的這個部分的成本的比重太高，它是不是能夠轉嫁到它的消費者的身上去，它是不是賣得掉？所以的確這個部分是一個 issue。那屬於消費性的產品基本上它會比較必須要考慮到這一個層次的問題。但是我們可以說我們的產品線因為同時是供給到消費型或者是高階或者是商務需求，其實對我們而言我們賣的是同樣的一個規格的產品，可能只是說它會有比較高規格的需求的時候可能對一些可靠性要求比較高，但對我們而言設計跟開發的還是同一個產品，只是透過我們的一些測試驗證多一些程序去確認這個規格要求的一個達標。"}, {"i": 15, "ts": "00:17:30", "sec": 1050, "who": "發言人", "role": "公司", "text": "所以對我們而言其實打交的都是同樣的記憶體 IC。那如果消費型這邊的記憶體它扛不住的話，其實其他的高階應用需求的拉貨還是非常暢旺，整體來看其實還是一直在缺貨的狀況。目前我們要客戶跟我們要的量我們還是交不足的，所以我們不太擔心消費型這邊是不是會有遲滯的一個觀望，因為整體來講還是一個缺貨。那我們再來看一下就是大概整個這樣看起來剛剛提到從 Q1 到 Q3 獲利、營收持續大幅提升的狀況下，那至少看到今年狀況應該都還不錯，Q4 應該還是可以維持一個樂觀的預期。那 2027 年明年那還是沒辦法看到這一個交貨的一個缺貨潮是不是能夠被滿足，目前看起來還是一個預期還是一個缺貨的狀態。那但是對我們而言比較重要的課題，我們還是要在晶圓的一個產能上面還有後段的一個產能上面繼續要去努力，這個是我們持續從今年年初到現在談到的都是這一個課題。"}, {"i": 16, "ts": "00:18:50", "sec": 1130, "who": "發言人", "role": "公司", "text": "那另外除了營運以外，我們也跟大家報告一下我們之前有提過，針對於 Edge AI 的一個加速器的一個應用，在低端的一個應用上面，我們提供給在 AI Computing 這邊的一個我們叫做 aiPIM，就是提供 AI 應用的一個加速器的記憶體產品，希望未來能夠提供給客戶這樣的 solution。那這部分我們已經 Silicon 在 Tape out 在第三季的時候，我們已經 Tape out 出去了。好，那另外就是我們在之前報告過我們有發行一個，也感謝凱基幫我們做這部分的一個服務，我們在晶豪科二這一個有擔保的可轉債，我們已經在 10 月 2 號在完成競拍後在 10 月 2 號掛牌完成了。好，那這個是整個第三季的一個 update，跟大家做個說明。謝謝。"}, {"i": 17, "ts": "00:19:54", "sec": 1194, "who": "主持人", "role": "主持人", "text": "好，那我們謝謝公司的說明。那接下來的話我們進行到 QA 的階段。那我們要請要提問的投資人這邊舉個手，那我們投過麥克風這邊來做提問。"}, {"i": 18, "ts": "00:20:21", "sec": 1221, "who": "分析師", "role": "分析師", "text": "董長您好，請教一下那個第四季產品的 ASP 跟量的看法？那因為公司目前的主要問題還是受限於利基電代工產能的提供，那公司以此為營運目標的話，怎麼去努力爭取更多的產能跟供給給客戶的量？謝謝。"}, {"i": 19, "ts": "00:20:51", "sec": 1251, "who": "董事長", "role": "公司", "text": "有關於那個力積電產能，那因為力積電已經舉行過法說會，他有在找其他的 Fab。那另外一個就是因為現在力積電他做記憶體代工，其實他在這個整個產業界是有他獨特的地方。所以因為力積電其實他目前少算有有三個 Fab。那以前 DRAM 不好的時候他主力是放在第三個 Fab。那因為後來有一個銅鑼那個廠已經賣給那個美光了嘛，所以他的那個 P1、P2 這兩個廠的話，最早他也是做 DRAM 的，只不過是說後來他轉型做邏輯代工。但是邏輯代工的的競爭者其實是比做記憶體的代工多很多。所以這個整體還是看那個力積電他們怎麼規劃，不過他們已經有在尋找其他的產能。那另外一個你說那個 Q4 的那個的價跟量嘛，那量大概可能差異不會太大。因為事實上我們除了那個 DRAM 以外，我們還有其他的那個產品，NOR、NAND 這些這類產品。那價格的話其實 4Q 事實上是比那個 3Q 來得高啦，但是成本也是逐漸增加嘛，所以要維持毛利應該基本上不是一個大問題啦，大概我只能回答到這邊。"}, {"i": 20, "ts": "00:23:02", "sec": 1382, "who": "主持人", "role": "主持人", "text": "好，我們謝謝公司的的回覆。那接下來的話還有投資人這邊要做提問嗎？"}, {"i": 21, "ts": "00:23:19", "sec": 1399, "who": "投資人", "role": "分析師", "text": "董長你好。在那個 COVID-19 那年公司賺很多錢，後來給看一下好像那個股息配發率有 50%。那今年因為公司的獲利看起來隨便摸摸都超過 100 塊啊。那因為公司是 IC 設計公司，也不用去像 DRAM 廠擴充產能，也不需要像 DRAM 模組廠商去備貨備很多的料源，那可不可以給一個明年的股利發放的一個看法？謝謝。"}, {"i": 22, "ts": "00:23:53", "sec": 1433, "who": "董事長", "role": "公司", "text": "其實說說那個我們不用那個太多備貨其實不完全正確啦。事實上我們公司內我們公司也有做一些 eMMC、eMCP 的產品。那這些其實是是我們我們是要去外購那個 NAND，有很多是搭配我們自己的 DRAM。那我覺得在這一波在漲的時候，我自己覺得像像我自己覺得我們公司當年那個 NAND 的存貨我自己覺得就是不夠多。像那個 Phison，他就存貨很多，他在這一波上漲期間他就他就賺了很多錢。所以你說去年的那個明年的配息率的話，我們現在這個是要經過董事會討論啦，但是，大概在在那個三到五成，大概這個這個之間啦。"}, {"i": 23, "ts": "00:25:12", "sec": 1512, "who": "主持人", "role": "主持人", "text": "好，那謝謝公司的回覆。那接下來的話還有要提出問題的嗎？"}, {"i": 24, "ts": "00:25:30", "sec": 1530, "who": "投資人", "role": "分析師", "text": "董長想請教一下那個，因為您剛提到說現在目前 DDR3 跟 2 的話，連國內的大廠都退出了，因為他們去做 4 或做 5 或做 HBM。那這樣看起來力積電的產能又不足，那因為這些很多的 DDR2 的話或 3 的話是 embedded，一定需要的基礎的。那是可以也認為說基本上明年的價格基本上也可以維持一個蠻好的價格呢？以這個供給面來看的話好像也沒有什麼明顯的增加的情況，謝謝。"}, {"i": 25, "ts": "00:26:13", "sec": 1573, "who": "董事長", "role": "公司", "text": "對，那因為因為這個供給量在那個 2027 年應該是沒什麼增加，我自己覺得價格應該是可以維持。"}, {"i": 26, "ts": "00:26:33", "sec": 1593, "who": "主持人", "role": "主持人", "text": "好，那這邊還有投資人要提問嗎？好，那如果沒有投資人要提問的話，那我們今天的法說會就到這邊結束。那我們謝謝公司的參與，也謝謝投資先進的參與。"}, {"i": 27, "ts": "00:26:57", "sec": 1617, "who": "董事長", "role": "公司", "text": "好，那謝謝各位。"}], "qa": 18, "chars": 6430, "last_min": 27, "cpm": 239, "status": "full", "memo": [{"title": "營收", "points": [{"text": "2026Q3 單季營收達 221.5 億元（YoY +519%），逼近 2021 全年營收 238 億元高點水準。", "ts": "00:06:11", "who": "發言人", "seg": 5}, {"text": "2026 年單月營收逐季呈階梯式爬升，由年初 20 億元攀升至 Q3 單月突破 70 億元（最高 79.05 億元）。", "ts": "00:05:08", "who": "發言人", "seg": 4}]}, {"title": "毛利與獲利", "points": [{"text": "2026Q3 毛利率達 77.44%，營業利益率達 59.37%，單季稅後 EPS 為 36.79 元。", "ts": "00:07:38", "who": "發言人", "seg": 6}, {"text": "獲利大幅成長主因記憶體合約價與現貨價漲勢強勁，價格逐季攀升帶動利潤跳增。", "ts": "00:07:44", "who": "發言人", "seg": 6}]}, {"title": "營運指引", "points": [{"text": "延續前三季強勁趨勢，預期 2026Q4 營收與獲利可維持高檔，2027 年亦維持樂觀看待。", "ts": "00:18:04", "who": "發言人", "seg": 15}]}, {"title": "產能與擴產", "points": [{"text": "晶圓代工廠投片產能相對受限，晶圓及後段封測產能供給仍為後續營運重點努力目標。", "ts": "00:06:51", "who": "發言人", "seg": 5}]}, {"title": "產品與技術", "points": [{"text": "記憶體 IC 營收占比逾 90%~95%，其中 DDR2 與 DDR3 營收合計占比超過 50%。", "ts": "00:02:24", "who": "發言人", "seg": 2}, {"text": "提供 Edge AI 邊緣運算加速解決方案之 aiPIM 晶片已於 2026Q3 完成 Tape out。", "ts": "00:18:50", "who": "發言人", "seg": 16}]}, {"title": "產業與競爭", "points": [{"text": "AI 需求帶動 HBM 排擠晶圓產能，傳統記憶體缺貨潮由 DDR5/DDR4 擴大蔓延至 DDR3/DDR2 及 Flash。", "ts": "00:12:18", "who": "發言人", "seg": 11}, {"text": "國內同業大廠陸續停供或減供 DDR2/DDR3 產能，公司已成為市場主要關鍵供應商。", "ts": "00:14:00", "who": "發言人", "seg": 12}]}, {"title": "股利與資本", "points": [{"text": "10 億元短期借款已於 2026 年 10 月隨可轉換公司債（晶豪科二）掛牌募資完成後全數清償完畢。", "ts": "00:11:38", "who": "發言人", "seg": 10}, {"text": "董事長表示明年股利配發率預估約落在 30% 至 50% 之間，最終仍需經董事會決議。", "ts": "00:25:00", "who": "董事長", "seg": 22}]}, {"title": "Q&A", "points": [{"text": "問：第四季產品 ASP 與出貨量看法為何？代工產能受限如何因應？／答：力積電亦在尋找其他晶圓廠產能；第四季出貨量與第三季差異不大，ASP 比第三季高，維持毛利基本無虞。", "ts": "00:20:21", "who": "董事長", "seg": 18}, {"text": "問：今年獲利大幅提升且資本支出較低，明年股利發放政策為何？／答：因有外購 NAND 備貨需求，配息率需經董事會討論，預估大概落在三到五成之間。", "ts": "00:23:19", "who": "董事長", "seg": 21}, {"text": "問：國內大廠退出 DDR2/DDR3 且為嵌入式需求，2027 年價格能否維持？／答：2027 年整體供給量未見明顯增加，預期價格應能維持良好水準。", "ts": "00:25:30", "who": "董事長", "seg": 24}]}], "quotes": []}, {"key": "6271_2026-10-30", "code": "6271", "name": "同欣電", "date": "2026-10-30", "segs": [{"i": 0, "ts": "00:05", "sec": 5, "who": "主持人", "role": "主持人", "text": "各位投資先進大家午安，歡迎大家參加永豐金證券主辦的同欣電2026年第三季線上法人說明會。今天法說會主講人為呂紹萍總經理及黃嘉麗營運長。會議開始首先先請同欣電幫我們簡報2026年第三季公司營運成果。"}, {"i": 1, "ts": "00:44", "sec": 44, "who": "呂紹萍", "role": "公司", "text": "各位法人朋友、投資界的先進，大家午安大家好。謝謝各位來參加這一次的法人說明會。首先我請我們的營運長兼財務長來跟各位報告一下我們第三季的營收以及財務資訊，謝謝。"}, {"i": 2, "ts": "01:04", "sec": 64, "who": "黃嘉麗", "role": "公司", "text": "各位法人先進大家好，現在由我來跟各位報告一下同欣電子第三季各全年的財務狀況。2026年3Q營收的部分是34.92億，相較於2Q 31.53億，營收的部分大概成長10.8個百分點，10.8%。"}, {"i": 3, "ts": "01:24", "sec": 84, "who": "黃嘉麗", "role": "公司", "text": "那在毛利率的部分，我們3Q毛利率是33.7%，那相較於2Q的31.1%，毛利率的部分成長了2.6個百分點。那在營業費用的部分，營業費用率的部分約當跟上一季是持平的。那金額的增加主要是因為獲利的成長，提列了相關的一些酬勞獎金費用等等，旅費、運費也增加，所以這個部分導致營業費用的上升，可是整體來講營業費用率大概維持在13%左右。"}, {"i": 4, "ts": "01:58", "sec": 118, "who": "黃嘉麗", "role": "公司", "text": "那營業淨利的部分是7.24億，營業利益率是20.7%。那在業外的部分是1億6800，相較於2Q的是8000萬，那增加了大概8700萬，那主要有兩個原因，一個原因是我們有一些股利的收入，第二個有一些金融資產的評價。那整體來講3Q的稅後淨利是7.58億，那EPS是3.62元。那在2Q的部分是5.21億，是2.49元，那整個獲利成長是成長了大概46%。"}, {"i": 5, "ts": "02:36", "sec": 156, "who": "黃嘉麗", "role": "公司", "text": "那我們看一下YoY的比較。那我們今年3Q 34.92億對上去年的28.5億，那整個營收的部分是成長22.5%。那在毛利率的部分，今年3Q是33.7%，去年3Q是27.2%，毛利率的部分是成長了6.5個百分點。那營業費用率的部分約當持平在13%左右。那整體來講的獲利表現的話，我們是7億5800今年3Q的部分，相較於去年3Q的部分是4億7800，那整個獲利跟YoY來比較來講的話是成長了58.4%，那EPS是3.62元。"}, {"i": 6, "ts": "03:25", "sec": 205, "who": "黃嘉麗", "role": "公司", "text": "那我們看一下1到9月份，1到9月份的營收是94.65億，那相較於去年1到9月份87.25億，營收部分是成長8.5%。那在毛利率的部分，我們在1到9月是31.1%，那在去年27.2%，那毛利率的部分成長了3.9個百分點。那在營業費用率的部分約當持平大概13.3%左右。整個稅後淨利的部分是16.74億，相較於去年11.33億，那稅後淨利的部分是成長大概將近48%，那EPS 1到9月份是8塊錢。"}, {"i": 7, "ts": "04:13", "sec": 253, "who": "黃嘉麗", "role": "公司", "text": "那我們看一下資產負債表的部分。整體來講現金約當現金的部分43.7億，那在透過損益按公允價值衡量的金融資產是46.32億，整體來講現金的部分是增加的。那應收帳款的部分22.72億，那跟去年大概佔總資產比率是約當持平。那在存貨的部分是22.36億，約當佔總資產6.2%，比去年度1到9月份成長蠻多，兩億多，成長了蠻多的。所以這個部分主要是因為原物料之前的短缺，讓我們原物料有些備料庫存的一些部分，所以存貨的部分有大幅上升。"}, {"i": 8, "ts": "05:01", "sec": 301, "who": "黃嘉麗", "role": "公司", "text": "那固定資產的部分大概約當維持持平大概30%左右。那整體來講總資產是363.16億，那總負債部分是84.23億，負債比是23.2%，那股東權益是278.93億。那1到9月份我們的折舊費用是8.35億，資本支出的部分是5.99億，EBITDA是30億。那我們看一下Capital Expenditure的部分，我們在2025年大概是14億左右，那我們在今年1到9月份大概是5億9900。以上是針對於財務的部分做一個簡要說明報告，謝謝。"}, {"i": 9, "ts": "05:49", "sec": 349, "who": "呂紹萍", "role": "公司", "text": "接下來讓我跟各位報告各個產品線第三季的狀況。1到9月份全部的營收是成長8個%。第三季跟第二季比較QoQ是11%。RF module是QoQ成長2%；另外就是Hybrid module是QoQ是成長2%；陶瓷基板QoQ是成長8%；那整個影像產品是成長16%。以整個產品的市場別來看的話，最大的還是汽車相關的產品，但是這個比例已經稍微下降了，已經從64%降到63%，到60%對不起。"}, {"i": 10, "ts": "07:05", "sec": 425, "who": "呂紹萍", "role": "公司", "text": "第四季我們本來在年初的時候預期是第四季會比第三季稍微下降，那其他的傳統的產品看起來是跟隨著這樣子我們過去的營收的季節性的變化，就是一二三逐季成長，然後第四季稍微下降。但是因為AI相關的東西還是成長的很快，所以現在看起來第四季比第三季還是稍微的成長。"}, {"i": 11, "ts": "07:47", "sec": 467, "who": "主持人", "role": "主持人", "text": "好，謝謝我們兩位長官的說明。我想接下來我們就直接進入這個Q&A的環節。各位如果有任何疑問可以打在這個對話框裡面，那我會為各位覆誦。"}, {"i": 12, "ts": "08:31", "sec": 511, "who": "主持人", "role": "主持人", "text": "有位法人問到2027年的光通訊年營收增加的比率，以及組成的結構，有一些生意是TIA、PCBA跟FAU，是如何去看待我們在光通客人的銷售的比重？"}, {"i": 13, "ts": "09:00", "sec": 540, "who": "呂紹萍", "role": "公司", "text": "現在看起來2027年的光通訊營收的成長，我想還是成長的非常大了，客人也要求我們準備好產能。那這個佔比，成長最快的因為FAU的基期比較低，所以如果用百分比來看的話是FAU光學對位的這一部分成長當然會最快，其次是TIA、Driver這些的背面、就是說後端的die service這一部分是第二快，PCBA是最後一個，但是這三個項目都是成長比較大，而且都是非常健康的成長。"}, {"i": 14, "ts": "09:42", "sec": 582, "who": "主持人", "role": "主持人", "text": "那再請問到第三季的Gross Margin相較第二季有大幅的提升，那主要的原因是為什麼？那以上一次的這個guidance，長期的margin鎖定在30到35，那這次還有機會再上修嗎？"}, {"i": 15, "ts": "10:02", "sec": 602, "who": "呂紹萍", "role": "公司", "text": "我想成長毛利率成長的主要原因還是第一個，營收增加當然會讓我們的毛利率比較增加了，這是第一個原因。第二個原因當然還是產品組合了，就是比較健康的產品、毛利率比較高的產品的比重成長的比較快。那我們的長期的目標到目前為止，上一次跟各位報告我們原來的目標是25到30，那這次調整到30到35，看起來未來可見的未來應該還是維持在這個範圍之內。"}, {"i": 16, "ts": "10:46", "sec": 646, "who": "主持人", "role": "主持人", "text": "那法人有接著問到800G後公司開始有接這個FAU的生意，那從過往的純電性PCBA跨入光打件，主要客戶是M客戶還有其他合作的公司嗎？那還有就是資本支出這一部分主要是consign還是自行採購？"}, {"i": 17, "ts": "11:31", "sec": 691, "who": "呂紹萍", "role": "公司", "text": "FAU主動對位的這個生意是去年12月開始的，目前為止量產的客戶是只有一位了，那到底是哪一家我們不太方便說明。第二就是說我們還有在持續開發新的客人，也是有牽涉到FAU的主動對位，這一部分我們也繼續在開發。主要的設備一部分是客人consign，一部分是我們自己資本支出。然後2027年預估FAU的出貨量，我們是去年才開始的嘛，今年量比較少，因為還是有一個學習曲線，同時我們從手動的設備跟我們的設備供應商合作開發自動設備，8月份進來到10月底已經客人認可了，所以我們會持續的引進更多自動的機器，目前看起來應該是2027年比2026年成長非常高的一個比例。"}, {"i": 18, "ts": "13:12", "sec": 792, "who": "主持人", "role": "主持人", "text": "有法人問到未來這個1.6T產值可能再增加EIC跟PIC flip chip這樣的驗證情況下，2027年底這樣的路徑有沒有改變？"}, {"i": 19, "ts": "13:30", "sec": 810, "who": "呂紹萍", "role": "公司", "text": "目前看起來沒有改變，那我們持續在跟客人開發這樣的產品，但目前為止還沒有完全的認證完畢。那這個1.6T的客人跟800G的客人是不一樣的，所以這個1.6T的生產應該是疊加上去。"}, {"i": 20, "ts": "14:12", "sec": 852, "who": "主持人", "role": "主持人", "text": "請教其他各產品線的內容，在2027年的YoY，那知道公司有一些新的momentum，包括在Ceramic、Image跟細電容的部分，是否可以說明？"}, {"i": 21, "ts": "14:30", "sec": 870, "who": "呂紹萍", "role": "公司", "text": "Ceramic目前為止2027年比較確定的可以開始新的量產的品項是厚銅的AMB基板，用在電動車，事實上是hybrid的車子上面的基板，AMB的基板，2026年的第四季開始小量生產，那2027年就會數量慢慢增加，這是比較確定的部分。那其他還有新的開發的產品，我們也持續在努力了。影像感測器這邊，因為自動駕駛的成長，所以現在看起來影像感測器還是非常健康的成長2027年。那細電容我們還在認證當中，到目前進展都一切順利的。"}, {"i": 22, "ts": "15:38", "sec": 938, "who": "主持人", "role": "主持人", "text": "請教在2026年第三季影像產品的成長幅度最大，那主要成長的產品類別是什麼？"}, {"i": 23, "ts": "15:48", "sec": 948, "who": "呂紹萍", "role": "公司", "text": "第三季通常都是手機的成長的最大的一個季度了，所以我們做這個不可見光的影像感測器的RW這一部分成長的很快。另外就是車用的影像感測器的封測也成長的很快，那主要還是因為自動駕駛現在逐漸的普遍，然後數量開始增加。"}, {"i": 24, "ts": "16:43", "sec": 1003, "who": "主持人", "role": "主持人", "text": "請教公司目前這個GaN跟Silicon Carbide的這個佈局的現況，主要的客戶大概是哪一些客戶？那公司鎖定的產品有哪一些？"}, {"i": 25, "ts": "17:00", "sec": 1020, "who": "呂紹萍", "role": "公司", "text": "有關GaN的部分主要還是新的Data Center的供電的架構有點改變，從原來的48伏變成800伏DC了。所以從800伏DC一直到6伏、48伏6伏這一段，就是800伏變48伏這是一段，我們用650伏的GaN串兩個來做這樣的應用。然後48伏變成6伏的部分就是用100伏的GaN，那這兩個產品都目前還在繼續認證當中。Silicon Carbide有一部分小量的車用的產品已經小量的在出貨，但是我們也在開發將來Data Center從我們的電網進來到800伏DC這一段需要一個固態變壓器，這一部分的Silicon Carbide的模組。我們第一個階段是用discrete，就是說我們去qualify高壓的Silicon Carbide的單顆的封裝，同時我們也在跟相關的客人開發從電網到800伏DC的功率模組，這些都持續在進行。"}, {"i": 26, "ts": "18:47", "sec": 1127, "who": "主持人", "role": "主持人", "text": "有位法人問到陶瓷基板的部分，陶瓷基板在未來的光通訊的散熱，或是功率元件上面是不是有角色的存在？"}, {"i": 27, "ts": "19:00", "sec": 1140, "who": "呂紹萍", "role": "公司", "text": "到目前為止我們看到很清楚的會成長的部分，是光通訊因為它現在傳輸的速度越來越高，所以它都是多波長的光在一個光纖裡面，所以它對波長的控制的穩定度就非常重要。那我們很清楚的看到第一個就是這個熱電轉換器來把這個功率元件的雷射溫度控制在比較穩定的範圍，這個我們已經看到量開始逐漸增加。另外一個就是說將來的雷射都會變成外加雷射，那這一部分的功率也在提升，所以我們也數量在增加。本來這一部分的基板都是日本供應商，我們現在也打入一家大的雷射元件的製造商，開始小量的出貨，明年看起來這個數量會大幅的增加。"}, {"i": 28, "ts": "20:09", "sec": 1209, "who": "主持人", "role": "主持人", "text": "講到陶瓷基板，想請教update一下，之前說過ABF載板用陶瓷基板做core這樣的技術，公司是否有進展？"}, {"i": 29, "ts": "20:23", "sec": 1223, "who": "呂紹萍", "role": "公司", "text": "到目前為止進展還算符合我們的預期。如果你們去比較陶瓷基板和玻璃基板，它不管在機械強度、散熱，甚至最重要的一點就是說，玻璃基板如果你有微裂micro-crack，它會延伸，但是陶瓷基板因為它是結晶的東西所以它不會延伸，這個對可靠性是非常重要的。但是陶瓷基板有一個致命的缺點就是它沒有辦法做到大的尺寸，像510x515mm這樣的尺寸，這是最重要的ABF板廠生產的尺寸範圍。所以我們就用同的方法，我們現在基本想法就是把比較小的尺寸，也就是說將來最後客人需要的substrate size，譬如說是120x120mm，我們就用這麼大的尺寸，這個是在陶瓷基板可以供應的範圍沒有問題，然後我們把它排列出來做成一個大板，然後再交給板廠去做。那我們也跟一家客人合作，我們做了一些樣品，他們都有一個試產線，試產線是四分之一的尺寸，大概250x250mm這樣的範圍，那我們也拼了一個板子給他們看，他們很滿意。目前他們希望我們再重新做一次，讓他們可以走他們的流程，做完之後做可靠性實驗。如果這個結果是正向的，那他們就願意去跟他們的中端客人還有將來生產interposer的半導體廠去推薦這樣的想法。我想應該到明年下半年，這樣的試做把ABF壓上去做完可靠性實驗應該會完成，希望在明年下半年的時候我們的板廠的客人可以拿著這個結果去跟最終的系統客人以及做interposer的半導體客人去推薦。"}, {"i": 30, "ts": "23:01", "sec": 1381, "who": "主持人", "role": "主持人", "text": "想請問公司目前RW的產能的UTR大概多少？那光通訊的TIA這邊需求持續在增長，那是否在RF、Image這樣的產品的Gross Margin可以繼續改善？"}, {"i": 31, "ts": "23:21", "sec": 1401, "who": "呂紹萍", "role": "公司", "text": "這問題非常好。是的，我們現在的RW產能的利用率有提高了。當然本身影像感測器的RW的成長，尤其第三季它的成長比較高。明年我想也應該這個影像感測器應該會逐步的再恢復增加。當然成長最快的還是光通訊的這個TIA和Driver這一部分的RW的需求持續在成長，而且成長得非常快。最後是我們希望矽電容的RW的生意在明年也應該可以接續接棒，然後繼續成長。當然如果你的產能利用率提高，我們的毛利率當然會改善的。"}, {"i": 32, "ts": "24:39", "sec": 1479, "who": "主持人", "role": "主持人", "text": "請問第四季的展望已經上修比Q3好，對嗎？"}, {"i": 33, "ts": "24:49", "sec": 1489, "who": "呂紹萍", "role": "公司", "text": "是的沒有問題，是比第三季好，但是我們的第三季的QoQ是比較高的，第四季的QoQ的成長率是沒有那麼高。"}, {"i": 34, "ts": "25:06", "sec": 1506, "who": "主持人", "role": "主持人", "text": "這邊有位法人問到，請問支援同集團的MOS封測在2027年的營收貢獻及展望？"}, {"i": 35, "ts": "25:17", "sec": 1517, "who": "呂紹萍", "role": "公司", "text": "我們集團裡面的需求都是標準的比較低功率的MOSFET的封測，那我們因為原來不是做這種標準產品低功率的產品，所以我們還是逐步的穩穩的來增加了，初步我們會先小量的試產、學習，然後再做下一步的打算。"}, {"i": 36, "ts": "25:59", "sec": 1559, "who": "主持人", "role": "主持人", "text": "想請問在2026年第四季公司在四大產品線的這個QoQ成長動能的排序？"}, {"i": 37, "ts": "26:08", "sec": 1568, "who": "呂紹萍", "role": "公司", "text": "我想成長最快的還是RF，就是光通訊的這一部分。那第二個就是我們的影像感測器，然後我們的Hybrid。那陶瓷基板事實上是原來我們的季節性的變動，所以第四季的陶瓷基板應該會稍微往下修正。"}, {"i": 38, "ts": "26:50", "sec": 1610, "who": "主持人", "role": "主持人", "text": "想請問公司過去FAU在對位的時間上面蠻長的，請問這個時間上的效率是否有提升？目前狀況如何？如何改善對位時間的throughput？"}, {"i": 39, "ts": "27:10", "sec": 1630, "who": "呂紹萍", "role": "公司", "text": "對位時間的改善，第一個是我們新進來的機器是比較自動化的，所以它速度會比較快。第二個就是說製程上面也是有改進的空間，但是這些都要客人認可，客人也相當配合我們，持續在改善當中。是不是在15分鐘以內？是的，而且比這個稍微快很多。"}, {"i": 40, "ts": "27:58", "sec": 1678, "who": "主持人", "role": "主持人", "text": "想請問剛剛提到RW還有手機還有光通訊還有Silicon Capacitor，那這樣子的情況下，明年是否這個RW的稼動率有機會回到以前幫中國手機做RW時候的產能利用率的水準？"}, {"i": 41, "ts": "28:23", "sec": 1703, "who": "呂紹萍", "role": "公司", "text": "現在比較確定可以快速成長的還是光通訊的TIA和Driver，Silicon Cap才剛剛起步，所以數量還沒有很清楚。整個綜合看起來應該還沒有達到以前我們在2022年的時候那樣的peak的那樣的水準，目前為止看起來還沒有到那個水準。"}, {"i": 42, "ts": "29:07", "sec": 1747, "who": "主持人", "role": "主持人", "text": "想請問公司第四季的毛利看法如何？第四季展望上修主要原因為何？"}, {"i": 43, "ts": "29:18", "sec": 1758, "who": "呂紹萍", "role": "公司", "text": "毛利率的看法就是剛剛跟各位報告的30到35之間，這個我們應該是沒有問題的。那Q4上升的主要原因，光通的成長是快速的，那同時我們的影像感測器也是很健康的成長，再加上我們的Hybrid也客人調整一下庫存，所以它的數量也增加。"}, {"i": 44, "ts": "30:54", "sec": 1854, "who": "主持人", "role": "主持人", "text": "請問我們的光通訊的客戶在TIA的known good die之後做完大概是送去哪裡做封裝呢？"}, {"i": 45, "ts": "31:05", "sec": 1865, "who": "呂紹萍", "role": "公司", "text": "光通訊的大客戶他供應的TIA和Driver，如果是短距離的光通模組，以前大部分是在中國大陸，那現在也有逐步的把它移到東南亞去了，所以我們的零件就是送到這兩個地方。那長距離的就留在同欣這邊繼續做完完整的光通模組，那這個數量比短距離的就差很多了，但是它的附加價值比較高。"}, {"i": 46, "ts": "32:07", "sec": 1927, "who": "主持人", "role": "主持人", "text": "請問公司未來有機會與Lumentum有業務往來嗎？"}, {"i": 47, "ts": "32:15", "sec": 1935, "who": "呂紹萍", "role": "公司", "text": "我們雷射的這一部分、雷射晶棒的這一部分，我們一直想要跟Lumentum的公司交易，但是到目前為止進度還是有限。那最近有聽到說我們目前有一個大客戶有可能跟Lumentum合作、合併，那如果這個事情真的成功的話，我想對我們去爭取他們的生意就有很大的幫助。"}, {"i": 48, "ts": "32:56", "sec": 1976, "who": "主持人", "role": "主持人", "text": "感謝各位投資先進的參加，因為時間關係那我們今天的同欣電線上法說會就到此結束，謝謝大家，謝謝。"}, {"i": 49, "ts": "33:16", "sec": 1996, "who": "呂紹萍", "role": "公司", "text": "謝謝。"}, {"i": 50, "ts": "33:17", "sec": 1997, "who": "黃嘉麗", "role": "公司", "text": "謝謝。"}], "qa": null, "chars": 6110, "last_min": 33, "cpm": 184, "status": "full", "memo": [{"title": "營收", "points": [{"text": "2026Q3 營收為 34.92 億元，季增 10.8%，年增 22.5%。", "ts": "01:14", "who": "CFO", "seg": 2}, {"text": "2026年前三季累計營收達 94.65 億元，年增 8.5%。", "ts": "03:28", "who": "CFO", "seg": 6}, {"text": "第三季產品線季增長幅：影像產品季增 16%、陶瓷基板季增 8%、RF模組季增 2%、混合模組季增 2%。", "ts": "06:13", "who": "CEO", "seg": 9}, {"text": "車用產品營收佔比微降，由 64% 降至約 63%。", "ts": "06:55", "who": "CEO", "seg": 9}]}, {"title": "毛利與獲利", "points": [{"text": "2026Q3 毛利率為 33.7%，季增 2.6 個百分點，年增 6.5 個百分點。", "ts": "01:26", "who": "CFO", "seg": 3}, {"text": "2026Q3 營業淨利 7.24 億元，營業利益率 20.7%，營業費用率約維持在 13%。", "ts": "01:58", "who": "CFO", "seg": 4}, {"text": "2026Q3 稅後淨利為 7.58 億元，季增 46%，單季 EPS 為 3.62 元。", "ts": "02:22", "who": "CFO", "seg": 4}, {"text": "2026年前三季稅後淨利 16.74 億元，年增 48%，累計 EPS 達 8.00 元。", "ts": "03:58", "who": "CFO", "seg": 6}]}, {"title": "營運指引", "points": [{"text": "原先預期第四季營收將季減，但受 AI 需求驅動，預估第四季比第三季微幅成長。", "ts": "07:33", "who": "CEO", "seg": 10}, {"text": "長期毛利率目標區間由原本的 25%~30% 上調至 30%~35%，且預期未來將維持在此水準。", "ts": "10:32", "who": "CEO", "seg": 15}, {"text": "第四季產品線季增動能排序為：RF光通訊最快，其次為影像感測器與混合模組，陶瓷基板因季節性向下修正。", "ts": "26:08", "who": "CEO", "seg": 37}]}, {"title": "產能與擴產", "points": [{"text": "2026年前三季資本支出為 5.99 億元，2025全年則約為 14 億元。", "ts": "05:24", "who": "CFO", "seg": 8}, {"text": "FAU 自動設備於 10 月底獲客戶認可，後續將持續引進更多自動化機台以提高產能。", "ts": "12:41", "who": "CEO", "seg": 17}, {"text": "RW（重建晶圓）產能利用率持續提升，主要由影像感測器及光通訊 TIA/Driver 需求帶動。", "ts": "23:25", "who": "CEO", "seg": 31}]}, {"title": "產品與技術", "points": [{"text": "車用厚銅 AMB 陶瓷基板將於 2026Q4 小量生產，2027年放量增加。", "ts": "14:40", "who": "CEO", "seg": 21}, {"text": "ABF 載板以陶瓷為 Core 的技術正與客戶合作，預計 2027 下半年完成試作與可靠度驗證。", "ts": "22:23", "who": "CEO", "seg": 29}, {"text": "資料中心供電架構由 48V 轉為 800V DC，帶動 650V GaN 與 100V GaN 封裝需求，目前持續認證中。", "ts": "17:10", "who": "CEO", "seg": 25}, {"text": "光通訊 1.6T 產品持續與客戶共同開發，認證時程不變，其量產為疊加於 800G 之上。", "ts": "13:30", "who": "CEO", "seg": 19}]}, {"title": "客戶", "points": [{"text": "FAU 主動對位目前已有 1 家量產客戶，並持續開發新客戶中。", "ts": "11:41", "who": "CEO", "seg": 17}, {"text": "光通訊短距離模組客戶封裝多已移往中國大陸與東南亞，長距離完整模組則留在同欣電生產。", "ts": "31:15", "who": "CEO", "seg": 45}]}, {"title": "Q&A", "points": [{"text": "問：2027年光通訊營收展望與結構？／答：光通訊 2027 年需求與產能將大幅成長，FAU 基期低成長百分比最快，其次為 TIA/Driver 等後段 die service，再者為 PCBA。", "ts": "09:00", "who": "CEO", "seg": 13}, {"text": "問：第三季毛利率大增原因及未來目標？／答：主因營收成長帶動規模效益及高毛利產品比重提升，長期目標維持在 30%~35%。", "ts": "10:04", "who": "CEO", "seg": 15}, {"text": "問：800G 後跨入 FAU 業務的客戶與設備資本支出狀況？／答：目前 1 家量產客戶並持續開發新客，設備一部分由客戶 Consign、一部分為自行投資，自動化對位設備已獲認可。", "ts": "11:33", "who": "CEO", "seg": 17}, {"text": "問：ABF 載板以陶瓷基板做 Core 的進展？／答：可靠性極佳且無微裂痕延伸風險，正透過拼板方式解決尺寸限制，預計 2027 下半年完成試作與可靠度測試。", "ts": "20:24", "who": "CEO", "seg": 29}, {"text": "問：第四季展望轉為上修的原因？／答：光通訊快速成長、影像感測器穩健，加上混合模組客戶調節庫存後拉貨回升。", "ts": "29:26", "who": "CEO", "seg": 43}, {"text": "問：未來與 Lumentum 的合作機會？／答：目前有大客戶可能與 Lumentum 合作或合併，若成真將對爭取雷射晶棒生意有很大幫助。", "ts": "32:15", "who": "CEO", "seg": 47}]}], "quotes": []}, {"key": "2301_2026-10-30", "code": "2301", "name": "光寶科", "date": "2026-10-30", "segs": [{"i": 0, "ts": "04:41", "sec": 281, "who": "主持人", "role": "主持人", "text": "各位投資先進與媒體朋友午安，歡迎蒞臨光寶科技 2026 年第三季的法人說明會。第三季是光寶 AI 轉型成果持續兌現的一季，我們近年來聚焦 AI 基礎建設的策略投資與技術佈局，已逐步展現具體的營運成果，不僅帶動營收成長，同步提升獲利能力、投入資本報酬及全球供應能力。"}, {"i": 1, "ts": "05:14", "sec": 314, "who": "主持人", "role": "主持人", "text": "同時透過策略投資與關鍵技術的佈局，光寶正加速由電源供應商升級為 Solution Provider，進一步拓展從電網到機櫃、從供電到散熱的 AI 基礎建設核心領域，打造中長期的成長新動能。今日與會的高階主管有光寶科技總經理邱森彬、財務長林進中。"}, {"i": 2, "ts": "06:21", "sec": 381, "who": "主持人", "role": "主持人", "text": "首先我們請 KT 財務長說明今年第三季與前三季的營運成果。"}, {"i": 3, "ts": "06:29", "sec": 389, "who": "財務長", "role": "公司", "text": "大家午安。首先跟大家報告一下光寶科第三季營運的一個成果。第三季光寶科營收新台幣 574 億，營業毛利 149 億，毛利率 25.9%，營業利益 87 億，營業利益率 15.1%，稅後的淨利為 74 億，每股盈餘創下歷史的新高新台幣 3.27 元。"}, {"i": 4, "ts": "07:08", "sec": 428, "who": "財務長", "role": "公司", "text": "總體來說，第三季的營收年增 28%，季增 9%。當中雲端物聯網的部門營收年成長將近 6 成。營業毛利年增 32%，毛利率 25.9%，年增 0.9 個百分點，優於上半年的 24.7%。營業利益年增 85%，營業利益率 15.1%，年增 4.7 個百分點，也是優於上半年的 12.8%。主要是受惠於新一代 AIDC 基礎建設的需求強勁，高價值事業比重的持續增加，同時也是因為全球產能擴充所帶來的經濟效應規模，及我們的智慧製造優化成果帶動獲利成長。"}, {"i": 5, "ts": "08:34", "sec": 514, "who": "財務長", "role": "公司", "text": "接下來跟大家報告一下 2026 年前三季的營運成果。前三季營業收入為新台幣 1,535 億，年增 26%；營業毛利 386 億，毛利率 25.2%；營業利益 210 億，營業利益率 13.7%；稅後淨利為 183 億，每股淨利 8.08 元，年增 64%，持續創造新高。"}, {"i": 6, "ts": "10:05", "sec": 605, "who": "財務長", "role": "公司", "text": "第三季三大部門營收年增 28%，營業利益 87 億，年增 85%。其中雲端物聯網部門營收 338 億，年增 57%，佔比 59%，營業利益 71 億，年增超過一倍。光電部門營收 81 億，年增 17%，佔比 14%，營業利益 7 億，年增 19%。資訊及消費性電子部門營收 155 億，年減 6%，佔比 27%，營業利益 16 億，年減 3%。低軌衛星電源出貨倍增帶動部門營收年減優於整體市場。"}, {"i": 7, "ts": "12:14", "sec": 734, "who": "財務長", "role": "公司", "text": "第三季流動資產中，應收帳款季增 21 億，存貨季增 110 億，為管理關鍵材料供貨與客戶安全庫存需求啟動策略性採購備料。流動負債中短期借款季增 105 億，應付帳款季增 77 億。速動比率與流動比率分別為 0.82 與 1.27 倍。前三季資本支出達新台幣 131 億，ROIC 達 34% 的穩健表現。另外光寶在 10 月也已完成了 360 億元的首筆永續連結聯貸案。"}, {"i": 8, "ts": "19:27", "sec": 1167, "who": "總經理", "role": "公司", "text": "謝謝。首先要謝謝各位投資夥伴以及媒體朋友今天的蒞臨。第三季我們延續第二季跟各位報告的，按照既定計畫在第三季又創了一些新高。我們將持續深化在電源的儲能與轉能、散熱的解決方案、系統級機櫃以及高速光通訊等關鍵領域的佈局，持續以 AI 作為核心成長的引擎。"}, {"i": 9, "ts": "20:59", "sec": 1259, "who": "總經理", "role": "公司", "text": "我們在今年 6 月收購了 APIC，強化我們在 DCDC Power Brick 的關鍵技術，並在 10 月 OCP 展示全系列 800V DCDC Brick 產品；7 月投資 DenseLight，佈局光引擎與光模組；9 月投資波蘭專業液冷製造商 DCS，並展出 2.6MW 企業級 CDU 液冷散熱。今天董事會決議將立能精密的製造分割出去，未來與 DCS 緊密合作加速液冷散熱發展。此外董事會也宣布策略投資控股新安芮，拓展高功率變壓器及高電感器技術能力。"}, {"i": 10, "ts": "24:04", "sec": 1444, "who": "總經理", "role": "公司", "text": "展望第四季，雲端電源的事業還是持續展現出年、季雙成長的趨勢。產品應用包括 ASIC 伺服器上的 8.5kW PSU 以及 BBU 的量產，新一代 Vera Rubin 1,100kW 和 Helios 42 吋 Power Shelf 的量產也都會在第四季持續擴大。同時次世代 AI 電源管理系統 800V DC 的 Power Rack 也會在第四季進入最後驗證階段。這不僅能為第四季注入新動能，也讓我們非常樂觀看待明年的發展。"}, {"i": 11, "ts": "25:48", "sec": 1548, "who": "分析師", "role": "分析師", "text": "管理層好，想請教一下，昨天有另外一家電源大廠提到美國建置資料中心碰到缺電與資金困難，想了解貴司在這方面的看法？"}, {"i": 12, "ts": "26:21", "sec": 1581, "who": "總經理", "role": "公司", "text": "從客戶端來看確實有一些電力供應的問題，第一季拉貨力道較弱，第二季問題解決後拉貨力道爆衝，第三季看起來有些微 slowdown。電力永遠是個 bottleneck，但從客戶 Capex 來看今年幾乎沒有下修趨勢，對明年 AI 發展依然非常樂觀，明年 Capex 看起來還是會持續增加。"}, {"i": 13, "ts": "28:05", "sec": 1685, "who": "分析師", "role": "分析師", "text": "想請教缺料對 PSU、BBU 是否造成出貨遞延？第四季是否維持年、季雙成長？800V 產品出貨時程為何？以及第三季毛利率較第二季下滑的原因？"}, {"i": 14, "ts": "28:47", "sec": 1727, "who": "總經理", "role": "公司", "text": "毛利率部分，第一季與第二季因為出貨遞延造成第二季毛利率偏高，下半年整體毛利率跟上半年比持續會有成長趨勢。缺料部分從去年就針對 PCB、高壓電容、半導體做策略性備料，加上第二季海運出貨調節，第四季客戶拉貨我們都能配合。800V 產品預計 11 月送第二批樣進行系統認證，出貨期預計落在明年第一季。"}, {"i": 15, "ts": "31:00", "sec": 1860, "who": "財務長", "role": "公司", "text": "補充一下，季跟季之間因拉貨變動會有波動，大家應看上半年的平均狀況，第三季結果優於上半年平均值。"}, {"i": 16, "ts": "31:42", "sec": 1902, "who": "分析師", "role": "分析師", "text": "想請教費用支出方面，研發費用是否維持 5% 至 5.5% 還是會加大力道？另外亞洲擴產與資本支出的最新規劃金額？"}, {"i": 17, "ts": "32:47", "sec": 1967, "who": "總經理", "role": "公司", "text": "RD 佔比目前大概維持在 5% 上下，我們期待至少要到 6%，北美建置 lab 人才陸續就位，朝 6% 比重推進沒有變。擴產部分越南廣寧新廠下個月正式開幕，高雄二期 12 月拿到使用執照，這兩廠讓海外產能翻倍，足以支撐未來兩到三年的需求。德州廠預計明年第二季正式營運，產能可支應未來三到五年需求。"}, {"i": 18, "ts": "35:23", "sec": 2123, "who": "財務長", "role": "公司", "text": "Capex 原先提過今年大約 180 億，因為最近的額外佈局，今年 Capex 支出會提升到 197 億。預估明年跟客戶討論的產能擴充，明年 Capex 支出應該會比今年還要來得高。"}, {"i": 19, "ts": "36:08", "sec": 2168, "who": "分析師", "role": "分析師", "text": "第三季毛利率是否有一次性挹注？如何看第四季毛利率與產品線表現？"}, {"i": 20, "ts": "36:31", "sec": 2191, "who": "總經理", "role": "公司", "text": "第三季沒有一次性挹注，毛利表現符合預期。第四季雲端有機會呈現季與年雙成長，透過產品組合優化，毛利不會有太大問題，下半年整體毛利率一定優於上半年。消費性電子下半年衰退約 20%，但低軌衛星出貨翻倍補足缺口，其他產品線維持年成長 5% 到 10% 目標前進。"}, {"i": 21, "ts": "38:20", "sec": 2300, "who": "分析師", "role": "分析師", "text": "今年 AI 營收佔比超過 30%，目前對明年 AI 佔比的想法？"}, {"i": 22, "ts": "38:28", "sec": 2308, "who": "總經理", "role": "公司", "text": "明年雲端 ASP 提升，包括 8.5kW PSU、1,100kW Power Shelf 以及 Power Rack，我預估明年 AI 佔比在全公司整體營收上應該會有機會達到四到五成之間。"}, {"i": 23, "ts": "39:25", "sec": 2365, "who": "分析師", "role": "分析師", "text": "想了解整體費用率預估，以及 DCDC Brick 預計何時能有營收貢獻？"}, {"i": 24, "ts": "40:09", "sec": 2409, "who": "總經理", "role": "公司", "text": "研發比重期望達到 6%，整體費用率大概在 11% 到 12% 是比較合理的。DCDC 產品已推到 CSP 客戶手上，預估至少明年第三季 DCDC Brick 應該就可以帶來一部分的營收。"}, {"i": 25, "ts": "42:00", "sec": 2520, "who": "分析師", "role": "分析師", "text": "第三季費用絕對金額下滑是否有一次性因素？存貨天數拉長是否有備抵跌價損失壓力？另外 Helios 42 吋 Power Shelf 的規格？"}, {"i": 26, "ts": "42:22", "sec": 2542, "who": "財務長", "role": "公司", "text": "費用沒有一次性因素。存貨提存比例跟過去幾季比較起來，維持在非常穩定的水準，並無惡化狀況。"}, {"i": 27, "ts": "43:09", "sec": 2589, "who": "總經理", "role": "公司", "text": "第四季客戶拉貨速度會比第三季好。Helios 因為客戶保密協定不便談太詳細規格，但從設計角度來看零件挑選均有考量，不會有重大瓶頸。"}, {"i": 28, "ts": "47:12", "sec": 2832, "who": "分析師", "role": "分析師", "text": "Capex 調增約 10%，主要增加在哪一塊？"}, {"i": 29, "ts": "47:26", "sec": 2846, "who": "財務長", "role": "公司", "text": "主要重點在產能擴充持續增加投資，同時提高整體自動化功能。"}, {"i": 30, "ts": "48:02", "sec": 2882, "who": "分析師", "role": "分析師", "text": "800V DC 規格從 660kW 更新到 880kW，主要原因為何？"}, {"i": 31, "ts": "48:42", "sec": 2922, "who": "總經理", "role": "公司", "text": "原本是 1MW，考量時程先規劃 660kW，過程中發現做到 880kW 沒有問題便直接跳升。架構上是一樣的，我們會配合客戶做相應的客製化處理。"}, {"i": 32, "ts": "50:10", "sec": 3010, "who": "分析師", "role": "分析師", "text": "擴產是否有包含 BBU？明年 PSU 與 BBU 的成長性如何？"}, {"i": 33, "ts": "50:26", "sec": 3026, "who": "總經理", "role": "公司", "text": "BBU 需求來看明年相較今年至少提升 30% 左右。明年成長性來看 PSU 依然大於 BBU，因為 PSU 包含企業端等更多應用場域。"}, {"i": 34, "ts": "51:17", "sec": 3077, "who": "分析師", "role": "分析師", "text": "車用產品這幾季表現不錯的原因？"}, {"i": 35, "ts": "51:31", "sec": 3091, "who": "總經理", "role": "公司", "text": "車用比去年同期成長，明年也會成長。主要是車燈模組做專案挑選提高獲利，加上車內 safety 監控鏡頭模組通過客戶認證並開始出貨，墊高車用營收成長。"}, {"i": 36, "ts": "53:02", "sec": 3182, "who": "分析師", "role": "分析師", "text": "請教液冷業務進展與客戶驗證狀況？PSU 明年產能成長幅度？"}, {"i": 37, "ts": "53:33", "sec": 3213, "who": "總經理", "role": "公司", "text": "BBU 產能主要放在美國，美洲與亞洲同步擴充近三成。首款 120kW CDU 在第三季已順利出貨量產，第四季量會放大，下一代 220kW CDU 已在設計階段。立能精密分割出去也是為了以更具彈性方式加速液冷產品事業發展。"}, {"i": 38, "ts": "56:06", "sec": 3366, "who": "分析師", "role": "分析師", "text": "想了解 2027 年三大事業部成長幅度與獲利目標？原物料長約與備料狀況？"}, {"i": 39, "ts": "57:18", "sec": 3438, "who": "總經理", "role": "公司", "text": "資通訊消費產品預估明年持平，低軌衛星則維持成長趨勢；光電部門公控與新能源成長強勁，明年維持約 10% 成長；雲端電源明年高瓦數佔比提高帶動 ASP，AI 伺服器電源有機會維持約七成左右成長，帶動毛利向上提升。半導體等關鍵物料多簽三年長約鎖定產能，並以半年為週期檢視調整備料。"}, {"i": 40, "ts": "62:06", "sec": 3726, "who": "分析師", "role": "分析師", "text": "BBU 明年成長率預估？先前提到兩家 CSP 新客戶訂單目前進展如何？"}, {"i": 41, "ts": "62:24", "sec": 3744, "who": "總經理", "role": "公司", "text": "BBU 明年預估也是 30% 以上成長。CSP 客戶最近 audit 越南工廠順利通過，正式產品研發預計在 2028 年左右會看到來自其他 CSP 訂單帶來的另一波顯著成長。"}, {"i": 42, "ts": "65:05", "sec": 3905, "who": "分析師", "
