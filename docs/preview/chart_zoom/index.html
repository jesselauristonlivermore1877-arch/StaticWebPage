<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖表放大</title><style>
:root{--bg:#f6f5f1;--ink:#1d1d1b;--ink2:#5c5b57;--line:#dcd9d0;--acc:#b0842f;--card:#fff;--up:#c8361e;--dn:#1e7b4f;--eq:#b0842f;--px:#5b7fa8}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--ink:#ecebe7;--ink2:#a4a29c;--line:#34363b;--acc:#d6a54a;--card:#1f2125;--up:#e2604a;--dn:#3fae7a;--eq:#d6a54a;--px:#7fa3cc}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0}
.m{color:var(--ink2);font-size:13px;margin:0 0 12px}.note{color:var(--ink2);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}.zoom{margin-left:auto;font:inherit;font-size:12px;padding:2px 10px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--acc);cursor:pointer}
canvas{width:100%;height:180px;display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.ov.on{display:flex}.ovbox{background:var(--card);border-radius:10px;width:min(1400px,100%);height:min(860px,100%);padding:12px 14px;display:flex;flex-direction:column}
.ovbox canvas{flex:1;height:auto}.x{font:inherit;padding:2px 12px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink);cursor:pointer;margin-left:auto}
</style></head><body><main>
<h1>訊號區／原型訊號區：權益曲線與台指走勢加「放大」（第 5c 項）</h1>
<p class="m"><b>示意資料</b>。每張圖右上一顆「放大」→ 整張蓋滿畫面（手機也一樣）；按「關閉」、Esc 或點外面回來。放大後圖重畫成大尺寸（不是把小圖拉大），十字線、數字標籤跟小圖同一套。</p>
<div class="grid">
<div class="card"><div class="hd"><h2>GEA5 權益曲線</h2><button class="zoom" data-k="eq">⤢ 放大</button></div><canvas id="c_eq"></canvas></div>
<div class="card"><div class="hd"><h2>台指期走勢（訊號標在圖上）</h2><button class="zoom" data-k="px">⤢ 放大</button></div><canvas id="c_px"></canvas></div>
</div>
<p class="note" style="margin-top:12px">原型訊號區的每張圖同一顆按鈕、同一個放大視窗（模組前綴 zm-，不碰既有樣式）。</p>
<div class="ov" id="ov"><div class="ovbox"><div class="hd"><h2 id="ovt"></h2><button class="x" id="ovx">關閉</button></div><canvas id="c_big"></canvas></div></div>
<script>
let seed=5;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const N=400,EQ=[0],PX=[22000];for(let i=1;i<N;i++){EQ.push(EQ[i-1]+(rnd()-0.44)*60000);PX.push(PX[i-1]+(rnd()-0.48)*180)}
const SIG=[...Array(14)].map((_,i)=>({i:20+i*27,d:i%2?-1:1}));
function draw(cv,k){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;const g=cv.getContext("2d");g.scale(r,r);
 const cs=getComputedStyle(document.documentElement),A=k==="eq"?EQ:PX,mx=Math.max(...A),mn=Math.min(...A),pad=46,x=i=>i/(N-1)*(w-pad-6)+6,y=v=>h-18-(v-mn)/(mx-mn)*(h-30);
 g.font="11px system-ui";g.fillStyle=cs.getPropertyValue("--ink2");g.strokeStyle=cs.getPropertyValue("--line");
 for(let t=0;t<=4;t++){const v=mn+(mx-mn)*t/4,yy=y(v);g.beginPath();g.moveTo(6,yy);g.lineTo(w-pad,yy);g.stroke();g.fillText(k==="eq"?(v/1e4).toFixed(0)+" 萬":v.toFixed(0),w-pad+4,yy+4)}
 g.strokeStyle=cs.getPropertyValue(k==="eq"?"--eq":"--px");g.lineWidth=1.5;g.beginPath();A.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)));g.stroke();
 if(k==="px")SIG.forEach(s=>{g.fillStyle=cs.getPropertyValue(s.d>0?"--up":"--dn");const xx=x(s.i),yy=y(PX[s.i])+(s.d>0?10:-10);g.beginPath();g.moveTo(xx,yy-s.d*6);g.lineTo(xx-4,yy);g.lineTo(xx+4,yy);g.fill()});}
const ov=document.getElementById("ov"),big=document.getElementById("c_big");let cur=null;
const redraw=()=>{draw(document.getElementById("c_eq"),"eq");draw(document.getElementById("c_px"),"px");if(cur)draw(big,cur)};
document.querySelectorAll(".zoom").forEach(b=>b.onclick=()=>{cur=b.dataset.k;document.getElementById("ovt").textContent=b.previousElementSibling.textContent;ov.classList.add("on");draw(big,cur)});
const close=()=>{ov.classList.remove("on");cur=null};document.getElementById("ovx").onclick=close;ov.onclick=e=>{if(e.target===ov)close()};addEventListener("keydown",e=>{if(e.key==="Escape")close()});
addEventListener("resize",redraw);redraw();
</script></main></body></html>
