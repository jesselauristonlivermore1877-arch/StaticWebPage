<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件專題</title>
<style>
/* 預覽：根因追蹤「事件專題」子頁（雲端R 11-15）。資料＝同資料夾 <key>.json，由 tools/rc_dossier.py 的 topic() 產生（正式版同一段程式）。沿用 rd- 樣式，新增的用 rt- 前綴 */
:root{--bg:#EDE7DA;--card:#fff;--ink:#1B2A4A;--ink2:#5d5a50;--line:#DDD4BF;--acc:#B8862B;--up:#C8361E;--dn:#1F7A4D;
  --g1:#1F5FA8;--g1b:#E3EEFA;--g2:#8A6A2B;--g2b:#F6EBD3;--g3:#7A4A9C;--g3b:#F0E6F7;--bad:#9A2E1F;--badb:#FBE6E2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--card:#1f2228;--ink:#ecebe7;--ink2:#a9a69e;--line:#363a42;--acc:#d6a54a;--up:#ff6b57;--dn:#4cc38a;
  --g1:#8cbcf5;--g1b:#1d2d42;--g2:#e0bf7a;--g2b:#3a3020;--g3:#cfa6ee;--g3b:#33263f;--bad:#ff9d8f;--badb:#43231f}}
:root[data-theme="dark"]{--bg:#15171b;--card:#1f2228;--ink:#ecebe7;--ink2:#a9a69e;--line:#363a42;--acc:#d6a54a;--up:#ff6b57;--dn:#4cc38a;
  --g1:#8cbcf5;--g1b:#1d2d42;--g2:#e0bf7a;--g2b:#3a3020;--g3:#cfa6ee;--g3b:#33263f;--bad:#ff9d8f;--badb:#43231f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
.rd-wrap{max-width:980px;margin:0 auto;padding:16px 16px 60px}
.rd-hd{background:linear-gradient(135deg,#1B2A4A 0%,#26406e 70%,#B8862B 140%);color:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.rd-hd small{display:inline-block;background:#F3E3C0;color:#1B2A4A;font-weight:900;border-radius:6px;padding:1px 10px;font-size:13px}
.rd-hd h1{font-size:22px;line-height:1.35;margin:8px 0 4px}
.rd-hd p{margin:0;font-size:13px;opacity:.9}
.rd-sel{margin-top:8px;font-size:13px}.rd-sel select{font:inherit;border-radius:6px;padding:2px 6px}
.rd-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
.rd-kpi div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.rd-kpi b{display:block;font-size:24px;line-height:1.2}.rd-kpi span{font-size:12px;color:var(--ink2)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;min-width:0}
h2{font-size:17px;margin:0 0 8px;border-left:4px solid var(--acc);padding-left:8px}
h2 small{font-size:12px;color:var(--ink2);font-weight:400;margin-left:6px}
.rd-g{display:inline-block;font-size:12px;font-weight:900;border-radius:5px;padding:0 6px;margin-right:6px;white-space:nowrap;vertical-align:1px}
.rd-g.g1{color:var(--g1);background:var(--g1b)}.rd-g.g2{color:var(--g2);background:var(--g2b)}.rd-g.g3{color:var(--g3);background:var(--g3b)}.rd-g.no{color:var(--bad);background:var(--badb)}
.rd-li{border-top:1px dashed var(--line);padding:7px 0}.rd-li:first-of-type{border-top:0}
.rd-t{color:var(--ink2);font-size:12px;margin-right:6px;white-space:nowrap}
.rd-src{font-size:12px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}.rd-src a{color:var(--acc)}
.rd-hy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rd-hy>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.rd-hy h3{font-size:15px;margin:0 0 4px}.rd-hy h3 small{display:block;font-size:12px;color:var(--acc);font-weight:900}
.rd-hy p{margin:0 0 6px;font-size:14px}
.rd-hy ul{margin:2px 0 6px;padding-left:18px;font-size:13px}.rd-hy li{margin:2px 0}
.rd-lab{font-size:12px;font-weight:900}.rd-lab.s{color:var(--up)}.rd-lab.a{color:var(--dn)}.rd-lab.m{color:var(--ink2)}
.rd-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px;width:100%;min-width:max-content}
th,td{padding:3px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:700}th:first-child,td:first-child{text-align:left}
.up{color:var(--up)}.dn{color:var(--dn)}
.rd-view{background:var(--g2b);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:14px}
.rd-note{font-size:12px;color:var(--ink2);margin:6px 0 0}
.rd-foot{font-size:12px;color:var(--ink2);text-align:center;margin-top:18px}
.rd-rule{font-size:13px;margin:0;padding-left:18px}.rd-rule li{margin:2px 0}
.rd-empty{color:var(--ink2);font-size:14px}
.rd-f-stage{font-size:13px;font-weight:900;color:var(--acc);margin:10px 0 2px;letter-spacing:.05em}
.rd-f-stage:first-child{margin-top:0}
.rd-f-tag{display:inline;font-size:11px;font-weight:700;border:1px solid var(--g1);color:var(--g1);border-radius:5px;padding:0 5px;margin-left:4px;overflow-wrap:anywhere;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rd-f-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rd-f-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rd-f-card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.rd-f-card h3{font-size:15px;margin:0 0 4px}
.rd-f-card p{margin:0 0 6px;font-size:14px}
.rd-f-q{font-size:13px;color:var(--ink2);margin:0 0 6px}
.rd-f-off{background:var(--g1b);border-radius:6px;padding:6px 8px;margin:4px 0;font-size:14px}
.rd-f-off details{font-size:12px;color:var(--ink2);margin-top:2px}.rd-f-off summary{cursor:pointer}
.rd-f-ul{margin:2px 0 6px;padding-left:18px;font-size:13px}.rd-f-ul li{margin:3px 0;overflow-wrap:anywhere}
.rd-f-key{background:var(--g2b);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:14px}
.rd-f-mk{font-size:11px;font-weight:900;color:var(--bad);white-space:nowrap}
tr.rd-f-ev td{background:var(--badb)}
@media (max-width:640px){.rd-f-g2,.rd-f-g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.rd-hy{grid-template-columns:minmax(0,1fr)}.rd-kpi b{font-size:20px}.rd-hd h1{font-size:19px}}

.rt-tier{display:inline-block;font-size:12px;font-weight:900;border-radius:5px;padding:0 6px;margin-right:6px;white-space:nowrap;vertical-align:1px}
.rt-tier.t0{color:var(--g1);background:var(--g1b)}.rt-tier.t1{color:var(--g2);background:var(--g2b)}.rt-tier.t2{color:var(--bad);background:var(--badb)}
.rt-filter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.rt-filter button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.rt-filter button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.rt-grp{font-size:12px;font-weight:900;color:var(--acc);letter-spacing:.05em}
.rt-pc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rt-kol{border-left:3px solid var(--g3);padding:2px 0 2px 10px;margin:6px 0}
.rt-kol q{font-size:14px}
.rt-doj{background:var(--badb);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px}
@media (max-width:640px){.rt-pc{grid-template-columns:minmax(0,1fr)}}
</style></head><body><div class="rd-wrap" id="rt">載入中…</div>
<script>
(async () => {
  const $ = document.getElementById("rt");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const A = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener nofollow">${esc(t)}</a>` : esc(t);
  const sgn = (v, d = 2, u = "%") => v == null || isNaN(v) ? "—" : `<span class="${v > 0 ? "up" : v < 0 ? "dn" : ""}">${v > 0 ? "+" : ""}${Number(v).toFixed(d)}${u}</span>`;
  let idx;
  try { idx = await (await fetch("index.json", {cache: "no-store"})).json(); } catch (e) { $.textContent = "讀不到 index.json：" + e; return; }
  const L = idx.list || [];
  if (!L.length) { $.textContent = "還沒有事件專題"; return; }
  const want = new URLSearchParams(location.search).get("k");
  const key = (L.find(x => x.key === want) || L[L.length - 1]).key;
  let J;
  try { J = await (await fetch(key + ".json", {cache: "no-store"})).json(); } catch (e) { $.textContent = "讀不到 " + key + ".json：" + e; return; }
  const TI = Object.fromEntries((J.tiers || []).map((t, i) => [t, "t" + i]));
  const tier = t => `<span class="rt-tier ${TI[t] || "t2"}">${esc(t)}</span>`;
  const cnt = t => (J.timeline || []).filter(r => r.tier === t).length;
  const D = J.doj || null;
  let h = `<div class="rd-hd"><small>預覽・根因追蹤 事件專題</small><h1>${esc(J.title)}</h1><p>${esc(J.lead || "")}</p>
    <p style="margin-top:6px">期間 ${esc(J.range[0])}～${esc(J.range[1])}｜產出 ${esc((J.built || "").replace("T", " "))}</p>
    ${L.length > 1 ? `<div class="rd-sel">其他專題：<select onchange="location.search='?k='+this.value">${L.map(x => `<option value="${esc(x.key)}"${x.key === key ? " selected" : ""}>${esc(x.title)}</option>`).join("")}</select></div>` : ""}</div>
  <div class="rd-kpi"><div><b style="color:var(--g1)">${cnt(J.tiers[0])}</b><span>${esc(J.tiers[0])}</span></div><div><b style="color:var(--g2)">${cnt(J.tiers[1])}</b><span>${esc(J.tiers[1])}</span></div>
    <div><b style="color:var(--bad)">${cnt(J.tiers[2])}</b><span>${esc(J.tiers[2])}</span></div><div><b style="color:var(--g3)">${(J.market.kol || []).length}</b><span>意見領袖原話</span></div></div>`;
  // ① 時間軸（三級）
  h += `<section><h2>時間軸<small>每一列都附出處；依可信度分三級，可以只看某一級</small></h2>
    <div class="rt-filter" role="group" aria-label="篩選可信度"><button type="button" data-t="" aria-pressed="true">全部 ${(J.timeline || []).length}</button>${J.tiers.map(t => `<button type="button" data-t="${esc(t)}" aria-pressed="false">${esc(t)} ${cnt(t)}</button>`).join("")}</div><div id="rt-tl">` +
    (J.timeline || []).map(r => `<div class="rd-li" data-tier="${esc(r.tier)}"><span class="rd-t">${esc(r.t)}</span>${tier(r.tier)}${r.ev ? `<span class="rd-f-tag">${esc(r.ev)}</span> ` : ""}${esc(r.text)}
      ${(r.quotes || []).length ? `<details class="rd-src"><summary>官方原文（程式逐字核對）</summary>${r.quotes.map(q => "“" + esc(q) + "”").join("<br>")}</details>` : ""}
      <div class="rd-src">${A(r.u, r.src)}・${esc(r.check || "")}${r.note ? "・" + esc(r.note) : ""}</div></div>`).join("") + `</div>
    <p class="rd-note">${esc((J.rules || {})["三級"] || "")}</p></section>`;
  // ② 美國司法部
  if (D) h += `<section><h2>美國司法部的說法<small>${esc(D.status)}</small></h2>
    <div class="rt-doj">${D.official ? `<span class="rt-tier t0">官方原文核到</span>${A(D.official.u, D.official.title)}` : `<span class="rt-tier t1">媒體轉述、未見官方原文</span>${esc(D.label)}`}</div>
    <ul class="rd-f-ul">${(D.media || []).map(m => `<li><span class="rd-t">${esc(m.t)}</span>${esc(m.text)}<div class="rd-src">${A(m.u, m.src)}・權威媒體・${esc(m.check || "")}</div></li>`).join("") || "<li>沒有核對通過的權威報導</li>"}</ul>
    <p class="rd-note">程式查過司法部新聞稿：${esc((D.tried || []).join("；"))}。找不到官方原文，所以只列權威媒體的轉述，不寫成司法部正式聲明。</p></section>`;
  // ③ 各方角力
  const R0 = (J.rumors || [])[0];
  h += `<section><h2>各方角力<small>角色＋公開表態＋出處；不點名指控個人為事實</small></h2><div class="rt-pc">` +
    (J.parties || []).map(p => `<div class="rd-f-card"><div class="rt-grp">${esc(p.group)}</div><h3>${esc(p.name)}</h3><p class="rd-f-q">${esc(p.role)}</p>` +
      (p.official || []).map(o => `<div class="rd-f-off"><span class="rt-tier t0">官方證實</span>${esc(o.zh)}<details><summary>官方原文（程式逐字核對）</summary>“${esc(o.quote)}” — ${A(o.u, o.src)}</details></div>`).join("") +
      (p.note === "rumor" ? (R0 ? `<div class="rd-f-off" style="background:var(--badb)"><span class="rt-tier t2">市場傳聞（未證實）</span>據${esc((R0.src || {}).provider || "網路媒體")}報導「${esc(R0.title)}」，官方未證實；文中 ${R0.clues.length} 條線索逐條查證見<a href="#rt-rumor">下方</a>。</div>` : "<p class='rd-empty'>目前沒有</p>")
        : `<div class="rd-lab m">權威報導（候選 ${p.media_n} 則，列核對通過的 ${p.media.length} 則）</div><ul class="rd-f-ul">${p.media.map(m => `<li><span class="rd-t">${esc(m.t)}</span>${esc(m.text)}<div class="rd-src">${A(m.u, m.src)}・${esc(m.check || "")}</div></li>`).join("") || "<li>沒有核對通過的權威報導</li>"}</ul>`) +
      (p.doj ? `<p class="rd-note">司法部：${esc(p.doj.status)}（見上方）</p>` : "") + `</div>`).join("") + `</div></section>`;
  // ④ 對市場的意涵
  const M = J.market || {}, T = M.tw || {}, V = M.valuation || {}, P = M.path || null;
  const groups = [...new Set((M.kol || []).map(k => k.g || "其他"))];
  h += `<section><h2>對市場的意涵<small>官方說法、權威報導、本站資料；意見領袖觀點另外標示</small></h2><p><b>${esc(M.q)}</b></p>
    <ul class="rd-f-ul">${(M.points || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` +
    (T.ok ? `<div class="rd-f-key">本站資料：台廠供應鏈 ${T.n} 檔，${esc(T.base)}→${esc(T.days[T.days.length - 1])} 累計漲跌中位數 ${sgn(T.med_cum)}（同期加權指數 ${sgn(T.twii_cum)}）；累計下跌 ${T.n_dn_cum} 檔。逐檔見${A(J.full_u, "事件完整版")}「市場反應」。</div>` : "") +
    (V.ok ? `<div class="rd-f-key">本站資料：${V.n} 檔有法人前瞻 EPS，事件前版本到現在 ${V.n_same} 檔沒變、${V.n_moved} 檔有變；看不到法人因這件事集體下修。</div>` : "") +
    ((M.us || []).length ? `<p class="rd-note">美股：${M.us.map(u => `${esc(u.name || u.sym)}（${esc(u.sym)}）${u.rows.length ? esc(u.rows[0].d.slice(5)) + "→" + esc(u.rows[u.rows.length - 1].d.slice(5)) + " 收盤 " + u.rows[0].c + "→" + u.rows[u.rows.length - 1].c : ""}`).join("；")}（只描述先後，不代表因果）</p>` : "") +
    (P && (P.media || []).length ? `<div class="rd-lab m" style="margin-top:8px">權威報導（${esc(P.name)}，列核對通過的 ${P.media.length} 則）</div><ul class="rd-f-ul">${P.media.map(m => `<li><span class="rd-t">${esc(m.t)}</span>${esc(m.text)}<div class="rd-src">${A(m.u, m.src)}・${esc(m.check || "")}</div></li>`).join("")}</ul>` : "") +
    `<div class="rd-lab m" style="margin-top:10px"><span class="rd-g g3">意見領袖觀點</span>個人看法、不是事實；原話由程式對逐字稿逐字核對，逐字稿是語音轉寫、可能有錯字</div>` +
    groups.map(g => `<div class="rd-f-stage">▍${esc(g)}</div>` + (M.kol || []).filter(k => (k.g || "其他") === g).map(k => `<div class="rt-kol">${k.lab ? `<span class="rd-f-tag">${esc(k.lab)}</span> ` : ""}<q>${esc(k.quote)}</q><div class="rd-src">${A(k.u, k.src + " " + (k.ep || ""))}・${esc(k.date || "")}・節目時間 ${esc(k.t)}</div></div>`).join("")).join("") +
    `<p class="rd-note">本站不給自己的評等與目標價；報導裡的分析師說法是整理他人公開資料，非本站建議。</p></section>`;
  // ⑤ 市場傳聞（未證實）
  for (const R of J.rumors || []) {
    const st = c => c.status === "官方核到" || c.status === "官方紀錄核到" ? `<span class="rt-tier t0">${esc(c.status)}</span>` : c.status === "權威媒體有報導" ? '<span class="rt-tier t1">權威媒體有報導</span>' : '<span class="rt-tier t2">未證實</span>';
    const S = R.src || {};
    h += `<section id="rt-rumor"><h2>市場傳聞（未證實）<small>非權威來源，只列查證結果；不用肯定語氣、不點名個人</small></h2>
      <div class="rd-f-card"><h3>據${esc(S.provider || "網路媒體")}報導「${esc(R.title)}」，官方未證實</h3>
      <p class="rd-f-q">來源：${A(R.u, (S.provider || "") + "（Yahoo 新聞轉載）")}・${esc(R.pub || "")}。「${esc(S.provider || "")}」${S.authority ? "在" : "<b>不在</b>"}本站共用權威名單。</p>
      <ul class="rd-f-ul">${R.clues.map(c => `<li>${st(c)} ${esc(c.text)}<div class="rd-src">${esc(c.why)}</div></li>`).join("")}</ul>
      <p class="rd-note">${esc(R.note || "")} 各條的官方紀錄與金額明細見${A(J.full_u, "事件完整版")}。</p></div></section>`;
  }
  // ⑥ 規則
  h += `<section><h2>本專題的規則</h2><ul class="rd-rule">${Object.entries(J.rules || {}).map(([k, v]) => `<li><b>${esc(k)}</b>：${esc(v)}</li>`).join("")}</ul>
    <p class="rd-note">完整的事件經過、起因、影響路徑、市場反應逐檔表：${A(J.full_u, "事件完整版")}。</p></section>
    <div class="rd-foot">整理自官方公告與公開報導，僅供參考，非投資建議</div>`;
  $.innerHTML = h;
  const btns = [...document.querySelectorAll(".rt-filter button")];
  btns.forEach(b => b.addEventListener("click", () => {
    btns.forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    document.querySelectorAll("#rt-tl .rd-li").forEach(li => { li.style.display = !b.dataset.t || li.dataset.tier === b.dataset.t ? "" : "none"; });
  }));
})();
</script></body></html>
