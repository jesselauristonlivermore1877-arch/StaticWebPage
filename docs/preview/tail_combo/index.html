<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>尾部相依現行組合</title><style>
:root{--up:#E5484D;--down:#12A366;--acc:#D9A441;--rv-ttm:#B79CFF;--rv-fwd:#3FC4FF;
  --bg:#000;--surface:#111;--raise:#1E1E1E;--ink-1:#F5F5F5;--ink-2:#A3A3A3;--ink-3:#666;--line:#2A2A2A}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--rv-ttm:#6A44E0;--rv-fwd:#0073C4;--acc:#B0842F;
  --bg:#F4F6F4;--surface:#FFF;--raise:#EDF0EE;--ink-1:#0F161D;--ink-2:#44515E;--ink-3:#68757F;--line:#DDE3E0}}
:root[data-theme="light"]{--rv-ttm:#6A44E0;--rv-fwd:#0073C4;--acc:#B0842F;
  --bg:#F4F6F4;--surface:#FFF;--raise:#EDF0EE;--ink-1:#0F161D;--ink-2:#44515E;--ink-3:#68757F;--line:#DDE3E0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink-1);font:15px/1.7 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:21px;margin:0 0 4px} .pv-m{color:var(--ink-2);font-size:13px;margin:0 0 14px}
.pv-t{float:right;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--raise);color:var(--ink-1);border-radius:999px;padding:2px 10px;cursor:pointer}
.pv-f{color:var(--ink-2);font-size:13px;text-align:center;margin-top:18px}
/* 尾部相依：現行組合（tc-）── 預覽與正式版共用；只用全站色票變數 */
.tc{white-space:normal}
.tc-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 12px}
.tc-lab{color:var(--ink-2);font-size:13px}
.tc-pill{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--raise);color:var(--ink-1);border-radius:999px;padding:3px 12px;cursor:pointer}
.tc-pill.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.tc-dim{color:var(--ink-3);font-size:12px;flex-basis:100%}
.tc-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.tc-card h3{font-size:15px;margin:0 0 8px;color:var(--ink-1)}
.tc-card h4{font-size:13px;margin:12px 0 6px;color:var(--ink-2);font-weight:600}
.tc-p{color:var(--ink-2);font-size:13px;margin:0 0 8px}
.tc-ol{margin:0;padding-left:20px;font-size:14px;line-height:1.75;color:var(--ink-1)} .tc-ol li{margin:2px 0}
.tc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:0 0 12px}
.tc-grid .tc-card{margin:0}
.tc-sc{width:100%;height:auto;display:block}
.tc-sl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2);margin:4px 0 6px}
.tc-sl i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tc-d0{background:var(--ink-3);opacity:.5} .tc-do{border:1.2px solid var(--ink-2);background:none} .tc-d1{background:var(--ink-2)} .tc-d3{background:var(--acc)}
.tc-dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13px;font-variant-numeric:tabular-nums}
.tc-dl dt{color:var(--ink-2)} .tc-dl dd{margin:0;color:var(--ink-1)}
.tc-lam{font-size:13px}
.tc-lr{display:grid;grid-template-columns:minmax(96px,auto) 1fr 44px;align-items:center;gap:8px;margin:6px 0}
.tc-ln{color:var(--ink-1);white-space:nowrap} .tc-lr b{text-align:right;font-variant-numeric:tabular-nums}
.tc-lt{position:relative;height:14px;background:var(--raise);border-radius:4px}
.tc-lt i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.tc-lt em,.tc-lk em{position:absolute;top:-3px;bottom:-3px;border-left:1.5px dashed var(--ink-1)}
.tc-lk{color:var(--ink-3);font-size:12px;margin-top:6px} .tc-lk em{position:relative;display:inline-block;height:10px;top:1px;margin-right:6px}
.tc-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.tc-k div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tc-k b{display:block;font-size:20px;color:var(--ink-1);font-variant-numeric:tabular-nums} .tc-k span{color:var(--ink-2);font-size:12px}
.tc-stk{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--raise)}
.tc-stk i{display:block;height:100%}
.tc-leg{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-1);margin-top:6px;font-variant-numeric:tabular-nums}
.tc-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

</style></head><body><main>
<button class="pv-t" id="pvT">深色／淺色</button>
<h1>尾部相依：現行組合（GEA5／GEA6＋GEA_s）</h1>
<p class="pv-m">預覽｜取代「策略組合」頁籤現在用同一支策略兩組設定畫的尾部圖｜<b>歷史回測統計，非投資建議</b></p>
<div id="tcRoot">載入中…</div>
<p class="pv-f">歷史回測統計，非投資建議｜產生：tools/tail_combo.py＋tcBlock（正式版同一段程式）</p>
</main><script>
/* ── 尾部相依：現行組合（雲端舊29，Evans 2026-11-22）────────────────────────
   tcBlock(data) → DOM。data＝tools/tail_combo.py 產出的 tail_combo.json。
   預覽（StaticWebPage docs/preview/tail_combo/）與正式版（template.html「策略組合」頁籤）用同一段程式；
   樣式前綴 tc-，只用全站既有色票變數（--surface --raise --line --ink-1/2/3 --acc --rv-fwd --rv-ttm）。
   數字全部由 Python 算好放在 JSON，這裡只負責畫，不自己重算統計。 */
function tcBlock(J) {
  if (!J || !J.basis || !J.legs) return null;
  const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const n0 = v => (v == null || v !== v) ? "—" : (Math.round(v) || 0).toLocaleString("en-US");
  const pc = (v, d) => (v == null || v !== v) ? "—" : (v * 100).toFixed(d == null ? 0 : d) + "%";
  const sg = v => (v == null || v !== v) ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
  const COL = {g5: "var(--acc)", g6: "var(--rv-fwd)", gs: "var(--rv-ttm)"};
  const NM = id => (J.legs[id] || {}).name || id;
  const SIDE = id => (J.legs[id] || {}).side || "";
  const LAB = id => NM(id) + "（" + SIDE(id) + "）";
  const BZ = [["closed", "已平倉", "整筆交易的損益記在出場那天：問「哪幾筆會一起賠」"],
              ["m2m", "每日評價", "每天收盤的帳面浮動（含還抱著的單）：問「哪幾天帳上一起難看」"]];
  const st = {bz: "closed"};
  const root = mk("div", "tc");
  const bar = mk("div", "tc-bar"), body = mk("div");
  root.appendChild(bar); root.appendChild(body);

  function scatter(P) {
    const W = 360, H = 300, L = 46, R = 18, T = 10, B = 34;
    const xs = P.pts.map(p => p[1]), ys = P.pts.map(p => p[2]);
    // 軸範圍取 0.5%～99.5% 分位（少數極端日不把整團壓扁）；超出的點貼邊、畫空心圈
    const span = a => { const s = a.slice().sort((u, v) => u - v), q = f => s[Math.min(s.length - 1, Math.max(0, Math.round(f * (s.length - 1))))];
      const lo = Math.min(0, q(0.005)), hi = Math.max(0, q(0.995)), pad = (hi - lo) * 0.06 || 1; return [lo - pad, hi + pad]; };
    const [x0, x1] = span(xs), [y0, y1] = span(ys);
    const cx = v => Math.min(x1, Math.max(x0, v)), cy = v => Math.min(y1, Math.max(y0, v));
    const X = v => L + (cx(v) - x0) / (x1 - x0) * (W - L - R), Y = v => T + (y1 - cy(v)) / (y1 - y0) * (H - T - B);
    // 各自最痛 10% 的門檻＝落在尾部那群裡最大（最不痛）的一天
    const thx = Math.max(...P.pts.filter(p => p[3] & 1).map(p => p[1])), thy = Math.max(...P.pts.filter(p => p[3] & 2).map(p => p[2]));
    let g = "";
    if (isFinite(thx) && isFinite(thy))
      g += `<rect x="${L}" y="${Y(thy).toFixed(1)}" width="${(X(thx) - L).toFixed(1)}" height="${(H - B - Y(thy)).toFixed(1)}" fill="var(--acc)" opacity=".10"/>`;
    const tick = (lo, hi) => { const r = hi - lo, s0 = Math.pow(10, Math.floor(Math.log10(r / 4))), s = [1, 2, 5, 10].map(k => k * s0).find(k => r / k <= 5);
      const o = []; for (let v = Math.ceil(lo / s) * s; v <= hi; v += s) o.push(Math.round(v)); return o; };
    tick(x0, x1).forEach(v => g += `<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-width="${v === 0 ? 1.2 : .6}"/>`
      + `<text x="${X(v)}" y="${H - B + 14}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${n0(v)}</text>`);
    tick(y0, y1).forEach(v => g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.2 : .6}"/>`
      + `<text x="${L - 5}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--ink-3)">${n0(v)}</text>`);
    if (isFinite(thx)) g += `<line x1="${X(thx)}" x2="${X(thx)}" y1="${T}" y2="${H - B}" stroke="var(--acc)" stroke-dasharray="4 3"/>`;
    if (isFinite(thy)) g += `<line x1="${L}" x2="${W - R}" y1="${Y(thy)}" y2="${Y(thy)}" stroke="var(--acc)" stroke-dasharray="4 3"/>`;
    const out = p => p[1] < x0 || p[1] > x1 || p[2] < y0 || p[2] > y1;
    const dot = (p, r, fill, op, stroke) => `<circle cx="${X(p[1]).toFixed(1)}" cy="${Y(p[2]).toFixed(1)}" r="${r}" ${out(p) ? `fill="none" stroke="${fill}" stroke-width="1.2"` : `fill="${fill}" fill-opacity="${op}"${stroke ? ` stroke="${stroke}" stroke-width="1"` : ""}`}><title>${J.dates[p[0]]}　${NM(P.x)} ${n0(p[1])}／${NM(P.y)} ${n0(p[2])} 點</title></circle>`;
    P.pts.filter(p => p[3] === 0).forEach(p => g += dot(p, 2, "var(--ink-3)", .35));
    P.pts.filter(p => p[3] === 1 || p[3] === 2).forEach(p => g += dot(p, 2.6, "var(--ink-2)", .7));
    P.pts.filter(p => p[3] === 3).forEach(p => g += dot(p, 4.2, "var(--acc)", .95, "var(--surface)"));
    g += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${LAB(P.x)} 當日損益（點）</text>`;
    g += `<text transform="translate(11 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="11" fill="var(--ink-2)">${LAB(P.y)}</text>`;
    return `<svg class="tc-sc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${NM(P.x)} 對 ${NM(P.y)} 每日損益散點">${g}</svg>`;
  }

  function lamBars(B) {
    // 三組 λ 一眼比較；虛線＝完全獨立（10%）
    const rows = Object.values(B.pairs);
    const mx = Math.max(0.7, ...rows.map(p => p.lam_b || 0));
    let h = "";
    rows.forEach(p => {
      const w = (p.lam_b || 0) / mx * 100, ind = J.tail / mx * 100;
      h += `<div class="tc-lr"><span class="tc-ln">${NM(p.x)} × ${NM(p.y)}</span><span class="tc-lt"><i style="width:${w.toFixed(1)}%;background:${p.x === "g5" && p.y === "g6" ? "var(--ink-3)" : "var(--acc)"}"></i><em style="left:${ind.toFixed(1)}%"></em></span><b>${pc(p.lam_b)}</b></div>`;
    });
    return `<div class="tc-lam">${h}<div class="tc-lk"><em></em>虛線＝兩支完全無關時的 ${pc(J.tail)}；條越長，最痛的日子越會撞在一起</div></div>`;
  }

  function lines(B) {
    // 5 行結論：全部由 JSON 數字組字，每週更新跟著變
    const P = B.pairs, t = B.trio, a = P.g5_gs, b = P.g6_gs, c = P.g5_g6, ind = J.tail;
    const vs = l => l <= ind * 1.25 ? "跟完全無關差不多" : l <= ind * 2 ? "略高於完全無關" : "明顯偏高";
    const gsc = t.contrib.gs, lc = t.contrib.g5.pct + t.contrib.g6.pct;
    return [
      `<b>${Math.max(a.lam_b, b.lam_b) <= ind * 2 ? "多空搭配真的有分散" : "多空搭配的分散有限"}</b>：GEA5 × GEA_s 的尾部相依 ${pc(a.lam_b)}、GEA6 × GEA_s ${pc(b.lam_b)}，${vs(Math.max(a.lam_b, b.lam_b))}（完全無關＝${pc(ind)}）；平常相關 ${sg(a.rho_all)}／${sg(b.rho_all)}，${Math.max(a.rho_all, b.rho_all) <= 0.1 ? "接近零或略負" : "偏正"}。`,
      `<b>GEA5 跟 GEA6 是近親</b>：尾部相依 ${pc(c.lam_b)}、平常相關 ${sg(c.rho_all)} —— 最痛的日子有將近一半撞在一起，兩支一起放主要是加碼，不是分散。`,
      `<b>三支同一天都最痛</b>：${t.all3} 天／${n0(t.days)} 天＝${t.all3_pct.toFixed(2)}%；三支完全無關會是 ${t.indep_pct.toFixed(2)}%，把 GEA5、GEA6 當同一支、GEA_s 跟它無關則約 ${(ind * ind * 100).toFixed(1)}% —— 實際數字貼近${Math.abs(t.all3_pct - ind * ind * 100) < Math.abs(t.all3_pct - t.indep_pct) ? "後者" : "前者"}。`,
      `<b>組合（三支各 1 口）最痛 ${pc(ind)} 的 ${t.combo_tail_days} 天</b>：虧損 ${pc(lc / 100)} 來自兩支多方、GEA_s 占 ${gsc.pct.toFixed(0)}%，其中 ${gsc.up_days} 天 GEA_s 是賺的（替組合擋了一部分）。`,
      `<b>白話</b>：比例越低越分散。` + (Math.max(a.lam_b, b.lam_b) <= ind * 2
        ? "空方那支在多方最痛的日子大多沒有一起倒，這就是多空搭配的意義；但它擋不住每一次，三支一起最痛的日子仍然存在。"
        : "這段樣本裡空方那支在多方最痛的日子也常一起倒，搭配的效果要打折。")];
  }

  function trio(B) {
    const t = B.trio, ids = ["g5", "g6", "gs"];
    let seg = "", leg = "";
    ids.forEach(i => { const v = t.contrib[i]; const w = Math.max(0, v.pct);
      seg += `<i style="width:${w}%;background:${COL[i]}" title="${NM(i)} ${v.pct}%"></i>`;
      leg += `<span><i style="background:${COL[i]}"></i>${LAB(i)}　${n0(v.pts)} 點（${v.pct.toFixed(1)}%）・當天賺錢 ${v.up_days} 天</span>`; });
    const box = mk("div", "tc-trio");
    box.innerHTML = `<div class="tc-k">
        <div><b>${t.all3_pct.toFixed(2)}%</b><span>三支同一天都在各自最痛 ${pc(J.tail)}（${t.all3} 天／${n0(t.days)} 天）</span></div>
        <div><b>${t.indep_pct.toFixed(2)}%</b><span>三支完全無關時的比例（${pc(J.tail)} × ${pc(J.tail)} × ${pc(J.tail)}）</span></div>
        <div><b>${(J.tail * J.tail * 100).toFixed(1)}%</b><span>假如 GEA5、GEA6 是同一支、GEA_s 跟它無關</span></div></div>
      <h4>組合（三支各 1 口）最痛 ${pc(J.tail)} 的 ${t.combo_tail_days} 天，共虧 ${n0(t.combo_tail_loss)} 點，各支貢獻</h4>
      <div class="tc-stk">${seg}</div><div class="tc-leg">${leg}</div>`;
    return box;
  }

  function draw() {
    bar.innerHTML = "";
    bar.appendChild(mk("span", "tc-lab", "口徑"));
    BZ.forEach(([k, n]) => { const b = mk("button", "tc-pill" + (st.bz === k ? " on" : ""), n);
      b.onclick = () => { st.bz = k; draw(); }; bar.appendChild(b); });
    const z = BZ.find(x => x[0] === st.bz);
    bar.appendChild(mk("span", "tc-dim", z[2]));
    body.innerHTML = "";
    const B = J.basis[st.bz];
    const s1 = mk("section", "tc-card");
    s1.innerHTML = `<h3>結論（${z[1]}口徑）</h3><ol class="tc-ol">${lines(B).map(x => "<li>" + x + "</li>").join("")}</ol>`;
    body.appendChild(s1);
    const s2 = mk("section", "tc-card");
    s2.innerHTML = `<h3>尾部相依一覽（下尾 ${pc(J.tail)}）</h3><p class="tc-p">一支在它自己最痛的 ${pc(J.tail)} 日子裡，另一支也落在它自己最痛 ${pc(J.tail)} 的比例。</p>` + lamBars(B);
    body.appendChild(s2);
    const grid = mk("div", "tc-grid");
    Object.values(B.pairs).forEach(P => {
      const c = mk("section", "tc-card tc-pair");
      c.innerHTML = `<h3>${NM(P.x)} × ${NM(P.y)}</h3>` + scatter(P)
        + `<div class="tc-sl"><span><i class="tc-d0"></i>平常日</span><span><i class="tc-d1"></i>只有一支最痛</span><span><i class="tc-d3"></i>兩支同一天都最痛</span><span><i class="tc-do"></i>超出範圍、貼邊</span></div>`
        + `<dl class="tc-dl"><dt>尾部相依</dt><dd><b>${pc(P.lam_b)}</b>（完全無關＝${pc(J.tail)}）</dd>`
        + `<dt>平常相關</dt><dd>${sg(P.rho_all)}</dd>`
        + `<dt>同一天都最痛</dt><dd>${P.both} 天／比較 ${n0(P.days)} 天</dd>`
        + `<dt>那幾天平均</dt><dd>${NM(P.x)} ${n0(P.both_mean[P.x])}、${NM(P.y)} ${n0(P.both_mean[P.y])} 點</dd></dl>`;
      grid.appendChild(c);
    });
    body.appendChild(grid);
    const s3 = mk("section", "tc-card");
    s3.innerHTML = `<h3>三支一起</h3>`;
    s3.appendChild(trio(B));
    body.appendChild(s3);
    const s4 = mk("section", "tc-card"), ck = Object.entries(J.check || {});
    s4.innerHTML = `<h3>怎麼算的</h3><ul class="tc-ol">`
      + `<li>樣本：台指期 1 分K ${J.from} ～ ${J.asof}；每支固定 1 口、每筆出場扣來回 ${n0(J.slip)} 點；單位＝台指期點數（× 200＝新台幣）。</li>`
      + `<li>各自最痛 ${pc(J.tail)}：把那一支的每日損益由小排到大，取最前面 ${pc(J.tail)} 的天數（只收虧損日）。兩支都沒有部位變動的日子不算進來。</li>`
      + `<li>尾部相依＝其中一支落在它最痛 ${pc(J.tail)} 的日子裡，另一支也落在它自己最痛 ${pc(J.tail)} 的比例；完全無關時約 ${pc(J.tail)}。</li>`
      + `<li>核對：` + ck.map(([k, c]) => `${NM(k)} 跟 MultiCharts 交易明細 ${c.same}／${c.mc_trades} 筆進出時間與方向相同、價格只差換月還原的一個常數${c.only_mc_warmup ? `（第一筆落在指標暖機段，未計）` : ""}${c.py_after_mc ? `；明細匯出（${c.mc_to}）之後另有 ${c.py_after_mc} 筆同一套程式算出` : ""}`).join("；") + `。</li></ul>`;
    body.appendChild(s4);
  }
  draw();
  return root;
}

(function(){
  var r = document.documentElement, k = "pvTheme";
  try { var s = localStorage.getItem(k); if (s) r.setAttribute("data-theme", s); } catch (e) {}
  document.getElementById("pvT").onclick = function () {
    var cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    var nx = cur === "light" ? "dark" : "light"; r.setAttribute("data-theme", nx);
    try { localStorage.setItem(k, nx); } catch (e) {}
  };
