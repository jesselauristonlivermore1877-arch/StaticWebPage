<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>持續事件追蹤卡</title>
<!-- 預覽（雲端新17 11-21）：根因追蹤「持續事件」卡。資料 ../../data/root_cause/threads.json（tools/rc_thread.py 產出，root_cause.py 每班更新）。
     Evans 點頭後才搬進 template.html（根因追蹤頁籤，候選根因上方）；前綴 rcth-。網站不連這一頁。 -->
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--mut:#5d6878;--line:#e2e6ec;--acc:#1f5fbf;--accb:#e8f0fc;--ok:#167a4a;--okb:#e6f4ec;--warn:#9a5b00;--warnb:#fbf1e0;--bad:#b3261e;--badb:#fbe9e7;--up:#c0392b;--dn:#1e8449}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1a2029;--ink:#e6e9ee;--mut:#9aa5b4;--line:#2b333f;--acc:#7fb0ff;--accb:#1d2a3f;--ok:#5fd19a;--okb:#16291f;--warn:#f0b75c;--warnb:#2d2414;--bad:#ff8a80;--badb:#2e1a19;--up:#ff7b6b;--dn:#5fd19a}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1a2029;--ink:#e6e9ee;--mut:#9aa5b4;--line:#2b333f;--acc:#7fb0ff;--accb:#1d2a3f;--ok:#5fd19a;--okb:#16291f;--warn:#f0b75c;--warnb:#2d2414;--bad:#ff8a80;--badb:#2e1a19;--up:#ff7b6b;--dn:#5fd19a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.rcth{max-width:1080px;margin:0 auto;padding:16px}
.rcth-pv{font-size:13px;color:var(--warn);background:var(--warnb);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.rcth-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.rcth-card h2{font-size:19px;margin:4px 0 8px;line-height:1.4}
.rcth-card h3{font-size:16px;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.rcth-card h3 small{font-weight:400;color:var(--mut);font-size:12px;margin-left:6px}
.rcth-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.rcth-chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accb);color:var(--acc);white-space:nowrap}
.rcth-chip.ok{background:var(--okb);color:var(--ok)}.rcth-chip.warn{background:var(--warnb);color:var(--warn)}.rcth-chip.bad{background:var(--badb);color:var(--bad)}
.rcth-mut{color:var(--mut);font-size:13px}
.rcth-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.rcth-day{flex:0 0 auto;min-width:104px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
.rcth-day b{display:block;font-size:13px}
.rcth-day.top{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.rcth-tl{list-style:none;margin:0;padding:0}
.rcth-tl li{display:grid;grid-template-columns:92px 1fr;gap:4px 12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rcth-tl li:last-child{border-bottom:0}
.rcth-t{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.rcth-who{font-weight:600;margin-right:6px}
.rcth-src{grid-column:2;font-size:12px;color:var(--mut)}
.rcth-src a{color:var(--acc);word-break:break-all}
.rcth-turn{background:var(--warnb);border-radius:8px;padding:8px 12px}
.rcth-turn p{margin:4px 0 0;font-size:12px;color:var(--mut)}
.rcth-q{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rcth-q th,.rcth-q td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rcth-q td.n,.rcth-q th.n{text-align:right}
.rcth-scroll{overflow-x:auto}
.rcth-up{color:var(--up)}.rcth-dn{color:var(--dn)}
.rcth-verdict{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--accb)}
.rcth-rule{font-size:12px;color:var(--mut);margin:0;padding-left:18px}
.rcth-foot{font-size:12px;color:var(--mut);text-align:center;margin:8px 0 24px}
@media (max-width:600px){.rcth{padding:12px}.rcth-card{padding:12px}.rcth-tl li{grid-template-columns:1fr}.rcth-src{grid-column:1}.rcth-card h2{font-size:17px}}
</style>
</head>
<body>
<div class="rcth" id="app"><div class="rcth-card">載入中…</div></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
const sg = (v, d = 2) => v == null ? "—" : `<span class="${v > 0 ? "rcth-up" : v < 0 ? "rcth-dn" : ""}">${v > 0 ? "+" : ""}${Number(v).toFixed(d)}%</span>`;
const A = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener nofollow">${esc(t)}</a>` : esc(t);
const stCls = s => s === "官方確認" ? "ok" : s === "確認" ? "" : s === "媒體報導" ? "warn" : "bad";
const md = s => String(s || "").slice(5, 16).replace("-", "/").replace("T", " ");
function card(T) {
  const days = (T.days || []).map(d => `<div class="rcth-day ${d.rank === 1 ? "top" : ""}"><b>${esc(md(d.date))}${d.mode === "us_only" ? "（盤前）" : ""}</b>` +
    `${d.rank ? `第 ${d.rank} 名` : "未列"}${d.carried ? "（帶入）" : ""}<br><span class="rcth-chip ${stCls(d.status)}">${esc(d.status || "")}</span>` +
    `${d.quant ? `<br>量化：${esc(d.quant)}` : ""}</div>`).join("");
  // 11-21 總指揮：權威標籤標的是出處、不是發言者 → 移到出處那一行，寫成「出處：權威媒體」
  const tl = (T.timeline || []).map(r => `<li><span class="rcth-t">${esc(md(r.pub))}</span><div><span class="rcth-who">${esc(r.who)}</span>${esc(r.t)}</div>` +
    `<div class="rcth-src">${r.auth ? `<span class="rcth-chip ${r.auth === "官方" ? "ok" : ""}">出處：${esc(r.auth)}</span> ` : ""}${A(r.u, r.src)}・${esc(r.check)}${r.hedged ? "・轉述語氣" : ""}</div></li>`).join("");
  const tu = (T.turning || []).map(r => `<li><span class="rcth-t">${esc(md(r.pub))}</span><div>${esc(r.t)}</div><div class="rcth-src">${A(r.u, r.src)}・${esc(r.check)}</div></li>`).join("");
  const Q = T.quant_test || {};
  const qr = (Q.rows || []).map(r => `<tr><td>${esc(md(r.date))}</td><td class="n">${sg(r.twii)}</td><td class="n">${r.twii_z != null ? Math.abs(r.twii_z).toFixed(1) : "—"}</td>` +
    `<td class="n">${sg(r.sox)}</td><td class="n">${sg(r.nq)}</td><td class="n">${r.rank ? "第 " + r.rank + " 名" : "未列"}${r.carried ? "（帶入）" : ""}</td>` +
    `<td>${esc(r.quant || "—")}</td><td class="n">${r.foreign != null ? (r.foreign > 0 ? "+" : "") + Number(r.foreign).toFixed(1) : "—"}</td>` +
    `<td style="white-space:normal;min-width:200px">${(r.others || []).map(o => esc(o.title)).join("；") || "—"}</td></tr>`).join("");
  const O = T.official;
  const vc = Q.verdict === "支持" ? "ok" : Q.verdict === "部分支持" ? "warn" : Q.verdict === "不支持" ? "bad" : "";
  return `<div class="rcth-card">
  <div class="rcth-mut">持續事件｜${esc(T.born)} 起，最近一次 ${esc(T.last)}</div>
  <h2>${esc(T.title)}</h2>
  <div class="rcth-chips"><span class="rcth-chip ${stCls(T.status)}">${esc(T.status)}</span>` +
    (T.spec || T.names || []).slice(0, 4).map(n => `<span class="rcth-chip">${esc(n)}</span>`).join("") + `</div>
  ${O ? `<div class="rcth-mut">原出處：${A(O.u, (O.src || "") + "：" + (O.t || ""))}（${esc(md(O.pub))}）</div>` : ""}
  <h3>每日根因排名<small>事件期間每一班根因追蹤裡，這件事排第幾、核對狀態、量化核對</small></h3>
  <div class="rcth-days">${days}</div>
  <h3>各方表態<small>日期｜誰｜說了什麼（原標題）｜出處；每筆程式打開出處核對，只收官方與權威媒體</small></h3>
  ${tl ? `<ul class="rcth-tl">${tl}</ul>` : '<p class="rcth-mut">目前沒有核對通過的表態</p>'}
  <h3>市場關注的轉折點<small>報導中提到、尚未有結果的決定；只列事實與出處，本站不預測結果</small></h3>
  ${tu ? `<div class="rcth-turn"><ul class="rcth-tl">${tu}</ul><p>待觀察：以上決定的後續官方公告與權威報導。</p></div>` : '<p class="rcth-mut">目前沒有</p>'}
  <h3>量化檢驗：大跌是不是主要由這一件事驅動<small>用本站族群漲跌與外資資料照實呈現，不硬湊</small></h3>
  <div class="rcth-scroll"><table class="rcth-q"><thead><tr><th>台股日</th><th class="n">加權</th><th class="n">標準差倍數</th><th class="n">費半</th><th class="n">NQ</th><th class="n">這件事排名</th><th>宣稱族群量化</th><th class="n">宣稱族群外資（億）</th><th>同日其他量化支持的確認根因</th></tr></thead><tbody>${qr}</tbody></table></div>
  <div class="rcth-verdict"><span class="rcth-chip ${vc}">${esc(Q.verdict || "—")}</span> ${esc(Q.why || "")}</div>
  <p class="rcth-mut">規則：${esc(Q.rule || "")}</p>
  <details><summary class="rcth-mut">各方表態篩選統計</summary><p class="rcth-mut">${Object.entries(T.tl_stat || {}).map(([k, v]) => esc(k) + " " + v).join("、")}</p></details>
</div>`;
}
fetch("../../data/root_cause/threads.json?_=" + Date.now(), {cache: "no-cache"}).then(r => r.ok ? r.json() : null).catch(() => null).then(J => {
  const app = document.getElementById("app");
  if (!J) { app.innerHTML = '<div class="rcth-card">讀不到 data/root_cause/threads.json</div>'; return; }
  const L = (J.threads || []).slice().sort((a, b) => (b.timeline || []).length - (a.timeline || []).length || b.last.localeCompare(a.last));
  app.innerHTML = `<div class="rcth-pv">預覽：根因追蹤「持續事件」卡（資料截至 ${esc(J.asof)}，產出 ${esc(String(J.built || "").replace("T", " "))}）。核准後放進根因追蹤頁籤、候選根因上方。</div>` +
    (L.map(card).join("") || '<div class="rcth-card">目前沒有持續中的事件</div>') +
    `<div class="rcth-card"><h3 style="border:0;margin-top:0;padding-top:0">規則</h3><ul class="rcth-rule">${Object.entries(J.rules || {}).map(([k, v]) => `<li><b>${esc(k)}</b>：${esc(v)}</li>`).join("")}</ul></div>` +
    `<div class="rcth-foot">${esc(J.note || "整理公開資訊，非投資建議")}</div>`;
});
</script>
</body>
</html>
