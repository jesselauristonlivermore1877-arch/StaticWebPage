<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GEA 會員區（預覽）</title>
<!-- 11-05 重出：下面第一段 <style> 是正式頁原樣（一字未改）；第二段只有這次新功能那一小塊（pv- 前綴）。資料全部是示意。 -->
<style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#18202b;--line:#26303d;--tx:#d5dde7;--mut:#8593a3;--acc:#f0b429;--up:#e5484d;--dn:#2fb36b;--blue:#4c8dff;--cyan:#22c3d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--blue)}
button,select,input{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.num{font-variant-numeric:tabular-nums;text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;background:#0e141c;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header .logo{font-weight:800;letter-spacing:1px;color:var(--acc)}
header nav{display:flex;gap:6px;flex-wrap:wrap}
header nav button{border:none;background:none;padding:6px 12px;border-radius:6px;color:var(--mut)}
header nav button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
header .me{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.pv{background:#3a2a05;color:#ffd77a;border-color:#6b4d0a}
main{padding:12px 16px}
.page{display:none}.page.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;min-width:0}
.grid2>*{min-width:0}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{color:var(--mut);font-weight:500;text-align:left;position:sticky;top:0;background:var(--panel)}
.scroll{overflow:auto}
.note{font-size:12px;color:var(--mut)}
/* 看盤區 */
.wtop{padding:6px 10px;gap:6px 8px;font-size:13px}.wtop select,.wtop input{padding:2px 6px;font-size:12px}.wtop button{padding:2px 8px;font-size:12px}
.wgrid{display:grid;gap:6px;height:calc(100vh - 190px);min-height:560px;margin-bottom:10px}
.wgrid.a4{grid-template-rows:repeat(2,minmax(0,1fr))}.wgrid.v{height:auto}.wgrid.v .wbx{height:82vh}
.wbx{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0;min-height:0}
.wbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--line)}
.wbar select{padding:1px 4px;font-size:12px}.wbar .zb{padding:0 7px;font-size:13px;line-height:20px;min-width:24px}
.wbx .wch{flex:1;min-height:0;position:relative;overflow:hidden}
.wthumb{position:absolute;right:66px;top:22px;z-index:6;pointer-events:none;color:#0b0f14;background:#f0b429;font-size:11px;font-weight:600;padding:0 5px;border-radius:4px}.wthumb:empty{display:none}
.wsb{height:12px;margin:2px 6px 5px;position:relative;background:#141b24;border-radius:6px;cursor:pointer;touch-action:none}.wsb .wsbt{position:absolute;top:2px;bottom:2px;min-width:10px;background:#3b4a5c;border-radius:4px;cursor:grab}.wsb .wsbt:hover,.wsb .wsbt.drag{background:#5b7088}
.wleg{position:absolute;left:0;top:0;right:60px;bottom:0;z-index:5;pointer-events:none;font-size:11px;line-height:15px}
.wleg .wl0,.wleg .wlp{position:absolute;left:6px;right:0;background:#0b0f14b0;padding:0 4px;border-radius:4px;width:max-content;max-width:100%;white-space:normal}
.wleg .wl0{top:3px}.wleg i{font-style:normal;margin-right:2px}
.wside{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.wside{grid-template-columns:1fr}}
@media (max-width:760px){.wgrid{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:none!important;height:auto}.wgrid .wbx{height:80vh}}
/* 盤勢儀表側欄（10-28 上正式站；dh- 前綴） */
.dh-wrap{display:flex;gap:8px;align-items:stretch}.dh-wrap>.wgrid{flex:1;min-width:0}
.dh{width:330px;flex:none;height:calc(100vh - 190px);min-height:560px;overflow-y:auto;margin:0 0 10px;padding:8px 10px;font-size:12px;white-space:normal}
.dh.off{width:34px;padding:8px 4px;overflow:hidden}.dh.off .dh-body{display:none}.dh-hd{display:flex;align-items:center;gap:6px}.dh-hd b{color:#f0b429;font-size:13px}
.dh h4{margin:10px 0 5px;font-size:12px;color:#f0b429}.dh .dh-tag{font-size:10px;border:1px solid #3b4a5c;border-radius:3px;padding:0 4px;margin-left:4px;color:#9fb0c2;font-weight:normal}
.dh-g{display:grid;grid-template-columns:1fr 1fr;gap:5px}.dh-c{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:5px 7px}.dh-c b{display:block;font-size:16px;margin-top:1px}.dh-c span{color:#8a93a3;font-size:11px}.dh-w{grid-column:1/3}
.dh .u{color:#e5484d}.dh .d{color:#2fb36b}.dh table{width:100%;border-collapse:collapse}.dh td,.dh th{padding:2px 3px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.dh td:first-child,.dh th:first-child{text-align:left;white-space:normal}.dh th{color:#8a93a3;font-weight:normal}.dh tr.ck{cursor:pointer}.dh tr.ck:hover td{background:#1e2533}
.dh-tabs{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0}.dh-tabs button{padding:1px 7px;font-size:12px}
.dh-pop{position:fixed;right:350px;bottom:12px;width:540px;max-width:calc(100vw - 370px);background:var(--panel);border:1px solid #f0b429;border-radius:8px;padding:8px 10px;z-index:50;display:none;box-shadow:0 6px 24px #000a}
.dh-pop .x{float:right;cursor:pointer;color:#8a93a3}.dh-pc{height:240px;margin-top:6px}.dh-spark{height:46px;margin-top:3px}
/* 盤中化（10-29 晚【新】總指揮零）：資金流向、權證內外盤；dhf- 前綴 */
.dhf-sec{display:grid;grid-template-columns:minmax(0,96px) 1fr 58px 44px;gap:4px;align-items:center;padding:2px 2px;cursor:pointer;border-radius:4px}
.dhf-sec:hover,.dhf-sec.on{background:#1e2533}.dhf-sec .n{text-align:right;white-space:nowrap}.dhf-sec .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhf-bar{position:relative;height:12px}.dhf-bar:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--line)}.dhf-bar i{position:absolute;top:2px;height:8px;border-radius:2px}
.dhf-sub{margin:2px 0 6px 6px;padding-left:6px;border-left:2px solid #f0b429}
.dhf-st{font-size:10px;border-radius:3px;padding:0 4px;margin-left:4px;font-weight:normal}.dhf-st.ok{background:#1d3a2a;color:#2fb36b}.dhf-st.late{background:#5a1d22;color:#ffb3b8}.dhf-st.post{background:#2a3242;color:#c6d1de}
.dhf-old{opacity:.55}
.pf-wrap{padding:10px 12px;font-size:13px;white-space:normal}.pf-wrap .dh-hd b{font-size:15px}.pf-wrap h4{margin:10px 0 4px}
.pf-g{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}.pf-c .dh-g{grid-template-columns:repeat(4,minmax(0,1fr))}.pf-c .dh-w{grid-column:span 2}
.pf-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pf-top table{width:100%}
.dh.mini:not(.off){width:220px}.dhm-row{display:flex;justify-content:space-between;gap:6px;padding:1px 0}.dhm-go{width:100%;margin:6px 0 2px}
@media (max-width:900px){.pf-g,.pf-top{grid-template-columns:minmax(0,1fr)}.pf-c .dh-g{grid-template-columns:1fr 1fr}.pf-c .dh-w{grid-column:1/3}}.dhf-tg{font-size:10px;border-radius:3px;padding:0 3px;margin-left:3px;background:#3a2f12;color:#f0b429;white-space:nowrap;cursor:help}
@media (max-width:900px){.dh-wrap{flex-direction:column}.dh,.dh.off{width:auto;height:auto;min-height:0;max-height:none}.dh.off .dh-body{display:block}.dh-pop{right:8px;left:8px;width:auto;max-width:none}}
.wbx.rt details.dd[open] .chips{left:auto;right:0}
.wsub{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;margin:3px 0}
.wsub select,.wbar select{padding:2px 6px;font-size:12px}.wsub button{padding:1px 8px;font-size:12px}
/* 10-31 手機 390：＋其他策略… 下拉不超出策略卡；權證表外層可橫向捲、縮字級欄距、購｜售可換行（整頁不橫捲） */
#labExt,#sigAdd,#hFam{max-width:100%;min-width:0;box-sizing:border-box;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.dhf-tw{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:600px){#labExt,#sigAdd{width:100%}#hFam{max-width:100%}#dhfWBox td,#dhfWBox th{padding:2px 2px;font-size:11px}#dhfWBox td .note{white-space:normal!important;font-size:10px}}
.chip .x{margin-left:4px;color:var(--mut);cursor:pointer}.chip .x:hover{color:var(--up)}
details.dd{position:relative}details.dd summary{cursor:pointer;list-style:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:13px;background:var(--panel2)}
details.dd[open] .chips{position:absolute;z-index:30;top:30px;left:0;width:520px;max-width:80vw;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 8px 24px #000a}
.gloss h4{margin:12px 0 6px;font-size:14px;color:var(--acc)}.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px 16px}
.gnote{background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7}
.hud td{font-family:Consolas,monospace;font-size:13px;padding:3px 8px;border-bottom:1px solid #0b0f14}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:12px;border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{border-color:var(--acc);color:var(--acc)}
.slider{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.ftab td:first-child{color:var(--mut)}
.pat{font-size:16px;font-weight:700}
.hl td{background:#2b2410}
/* 訊號區 */
.heat{display:grid;grid-template-columns:28px repeat(18,minmax(0,1fr));gap:2px;font-size:10px;width:100%;max-width:100%;min-width:0}
.heat.wide{overflow-x:auto;grid-template-columns:28px repeat(20,minmax(16px,1fr))}
.heat div{min-width:0;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;cursor:pointer;color:#0008;position:relative}
.heat .ax{background:none;color:var(--mut);cursor:default;aspect-ratio:auto}
.heat .ax,.heat .axb{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:9px}
.heat .sel{outline:2px solid #fff;z-index:2}
.heat .axb{background:none;color:var(--mut);cursor:default;aspect-ratio:auto;align-items:flex-start}
.tip{border-bottom:1px dotted var(--mut);cursor:help}
.heat .pick::after{content:attr(data-p);position:absolute;inset:auto auto -1px -1px;font-size:9px;color:#fff;background:#000a;padding:0 2px;border-radius:2px}
#sChart{height:520px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#sEq{height:220px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:6px}.pager button[disabled]{opacity:.4;cursor:default}
th.srt{cursor:pointer;user-select:none}th.srt:hover{color:var(--acc)}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.kpi div{background:var(--panel2);border-radius:8px;padding:8px 10px}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut)}
.mtx td{text-align:right;font-size:12px;padding:3px 6px}
.pos{font-size:22px;font-weight:800}
.tick{transition:background .4s}.flash{background:#3a2a05}
/* 客戶選單區 */
.menu td,.menu th{font-size:13px}
.menu tr.off td{opacity:.45}
.adm input[type=checkbox],.menu input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pk .card{cursor:pointer;margin:0}.pk .card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.big{font-size:22px;font-weight:800}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 10px}
.modal.on{display:flex}.modal .box{background:var(--panel);border-radius:10px;padding:14px;max-width:1150px;width:100%}
.modal img{width:100%;border-radius:6px;margin-top:8px;background:#fff}
/* 登入 */
#login{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#1d2633,#07090c);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#login .box{width:420px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
#login h1{margin:0 0 4px;font-size:22px;color:var(--acc)}
.btnline{width:100%;padding:12px;border:none;border-radius:8px;background:#06c755;color:#fff;font-weight:700;font-size:15px;margin-top:14px}
.btnmail{width:100%;padding:10px;margin-top:8px}
@media print{header,#login,.noprint{display:none!important}body{background:#fff;color:#000}.card{border-color:#ccc;background:#fff}th{background:#fff}}
#p-signal:not(.lab) #sGrid{grid-template-columns:1fr}#p-signal:not(.lab) #sRight{display:none}
</style>
<style>

</style>
</head>
<body>
<header>
  <span class="logo">GEA</span>
  <nav id="nav"><button data-p="watch">看盤區</button><button data-p="signal" class="on">訊號區</button><button data-p="flow">盤中資金</button></nav>
  <span class="badge pv"><span>預覽・</span>示意資料（11-05 重出）</span>
  <span class="me"><span>王示意・LINE 登入</span><span class="badge">到期 2027-12-31</span><button>登出</button></span>
</header>
<main>
<section class="page on" id="p-signal">
  <div class="card"><h3>客戶網址只剩三個頁籤（會員站正式樣式；回 <a href="./">/admin 那一頁</a>）</h3>
    <div class="note">頁首只剩「看盤區、訊號區、盤中資金」；原型研究、客戶選單區、管理三個頁籤客戶看不到、網址打進去也 403。Evans 自己的帳號在右上多一顆「管理」，直接跳到中繼 /admin。</div></div>
  <div class="card"><h3>訊號區：只顯示這位客戶訂閱的策略</h3>
    <div class="row" style="gap:6px"><button class="on">GEA5</button><button>GEA6</button></div>
    <div class="note" style="margin-top:6px">拿掉策略選單與「＋其他策略」；沒訂閱的策略連名稱都不出現。下面的K線、權益曲線、月損益、交易明細都照現行訊號區，不動。</div></div>
</section>
</main>
<script>

</script>
</body>
</html>
