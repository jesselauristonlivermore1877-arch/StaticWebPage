<h1>市場 ▸ 軌跡流向：熱力格轉折線改色（預覽，C44）</h1>
<div class="pv">預覽頁（不從網站連過來）。Evans 11-17：「族群 X 日 3 日平均動能那邊有畫虛線，但很不明顯」。改法：轉折線由紅／綠細虛線改成<b>藍色加粗虛線</b>（底下墊一層背景色描邊，紅格、綠格上都看得到），方向改在熱力格上緣用 ▲紅（向上）／▼綠（向下）標；圖說改白話。只動熱力格，日K、流向圖不變。新版＝正式 template 同一段程式；資料日 2026-11-16。往下捲到「族群 × 日」那張看。</div>
<div class="th">主題：<button onclick="th('dark')">深色</button><button onclick="th('light')">淺色</button></div>
<div class="cols"><section><h2>舊（現在正式站）</h2><div id="a"></div></section><section><h2>新（藍色虛線）</h2><div id="b"></div></section></div>
</main><script>

  const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

    root.innerHTML = "";

    const J0 = J, N0 = J0.dates.length;

    const last = n0last, today = J.dn[last] != null ? `<span class="tf-chip">${md(J.dates[last])}　向下翻轉 <b class="tf-dn">${pct(J.dn[last])}</b>　向上翻轉 <b class="tf-up">${pct(J.up[last])}</b>　動能為正 <b>${pct(J.pos[last])}</b>（${J.secs.length} 族）</span>` : "";

    function draw() {
    body.innerHTML = "";

    // 圖層標記：[索引, 方向(+1 紅／−1 綠), 圖層, 說明]；爆量依「這張圖」收盤比前一日收盤分漲跌（不看 K 棒紅綠）

      const out = [];

        const a = J0[SRC], g = J.off - 1; return g >= 0 && a[g] ? a[g][3] : (J0[SRC + "_prev"] ?? null); };
      (J.layers || []).forEach(q => {
        if (!LY[q.key]) return;
        if (q.by_close) (q.idx || []).forEach(i => { const b = K[i], p = prevC(i); if (!b || p == null) return;

      kbox.innerHTML = "";

      const W = WW, H = Math.round(WW < 600 ? 260 : 330), L = 4, R = 56, TOP = 22, BOT = 26, PW = W - L - R, PH = H - TOP - BOT;

      }
            for (let i = 0; i < n; i += Math.ceil(n / (WW < 600 ? 4 : 6))) {
        const t = sv("text", {x: X(i), y: H - 6, "font-size": 12, fill: INK2, "text-anchor": "middle"}); t.textContent = J.dates[i].slice(2, 7).replace("-", "/"); if (!i) t.setAttribute("text-anchor", "start"); s.appendChild(t);
      }

        if (!b) return;
        const c = b[3] >= b[0] ? UP : DN;
        s.appendChild(sv("line", {x1: X(i), x2: X(i), y1: Y(b[1]), y2: Y(b[2]), stroke: c, "stroke-width": 1}));
        s.appendChild(sv("rect", {x: X(i) - bw / 2, y: Y(Math.max(b[0], b[3])), width: bw, height: Math.max(1, Math.abs(Y(b[0]) - Y(b[3]))), fill: c}));
      });
      (J.turns || []).forEach(t => {
        const b = K[t[0]]; if (!b) return;
        const x = X(t[0]);
        if (t[1] < 0) { const y = Y(b[1]) - 6; s.appendChild(sv("path", {d: `M${x - 6},${y - 10}L${x + 6},${y - 10}L${x},${y}Z`, fill: DN})); }
        else { const y = Y(b[2]) + 6; s.appendChild(sv("path", {d: `M${x - 6},${y + 10}L${x + 6},${y + 10}L${x},${y}Z`, fill: UP})); }
      });
      const marks = layerMarks(J, K);
      const slotU = {}, slotD = {};
      marks.forEach(([i, dir, q]) => { const b = K[i]; if (!b) return;
        const x = X(i);
        let y;
        if (dir > 0) { const k2 = slotU[i] = (slotU[i] || 0) + 1; y = Y(b[2]) + 6 + (tmap[i] && tmap[i][1] > 0 ? 12 : 0) + k2 * 17 - 8; }
        else { const k2 = slotD[i] = (slotD[i] || 0) + 1; y = Y(b[1]) - 6 - (tmap[i] && tmap[i][1] < 0 ? 12 : 0) - k2 * 17 + 8; }
        s.appendChild(sv("circle", {cx: x, cy: y, r: 8, fill: dir > 0 ? UP : DN, stroke: "rgba(0,0,0,.55)", "stroke-width": 1}));
        const t = sv("text", {x, y: y + 3.6, "font-size": 10, fill: "#fff", "text-anchor": "middle", "font-weight": 700}); t.textContent = q.ch; s.appendChild(t); });
      const hl = sv("line", {x1: 0, x2: 0, y1: TOP, y2: H - BOT, stroke: INK2, "stroke-dasharray": "3 3", opacity: 0});
      s.appendChild(hl);
      const mv = ev => {
        const r = s.getBoundingClientRect(), x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        const i = Math.max(0, Math.min(n - 1, Math.floor((x / r.width * W - L) / (PW / n))));
        const b = K[i]; hl.setAttribute("x1", X(i)); hl.setAttribute("x2", X(i)); hl.setAttribute("opacity", 1);
        const t = tmap[i];
        kread.innerHTML = `${J.dates[i]}　` + (b ? `開 ${b[0].toLocaleString()}　高 ${b[1].toLocaleString()}　低 ${b[2].toLocaleString()}　收 ${b[3].toLocaleString()}` : "（無資料）") +

          marks.filter(m => m[0] === i).map(m => `　<b class="${m[1] > 0 ? "tf-up" : "tf-dn"}">［${m[2].ch}］${m[3]}</b>`).join("");
      };

        (SRC === "txf" ? `　｜台指期日K到 ${J.txf_last}（每週更新，最新幾天可能還沒有）` : ""));

        const t = sv("text", {x: X(i), y: H - 6, "font-size": 12, fill: INK2, "text-anchor": i ? "middle" : "start"}); t.textContent = J.dates[i].slice(2, 7).replace("-", "/"); s.appendChild(t);
      }
      const mv = ev => {
        const r = s.getBoundingClientRect(), x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        const i = Math.max(0, Math.min(n - 1, Math.floor((x / r.width * W - L) / (PW / n))));
        fread.innerHTML = `${J.dates[i]}　<span class="tf-up">向上翻轉 ${pct(J.up[i])}</span>　<span class="tf-dn">向下翻轉 ${pct(J.dn[i])}</span>　<span style="color:${ACC}">動能為正 ${pct(J.pos[i])}</span>`;
      };
      s.addEventListener("mousemove", mv); s.addEventListener("touchstart", mv, {passive: true});
      fbox.appendChild(s);
      fbox.appendChild(mk("div", "tf-sub", `上格金線＝3 日平均動能為正的族群占比。下格紅柱（往上）＝當天由負翻正的族群占比、綠柱（往下）＝由正翻負的占比；深色＝超過門檻（虛線）的全面轉折日。`));
    }
    root2.appendChild(fbox);

    // ── 熱力格 ──
    root2.appendChild(mk("div", "tf-h", "族群 × 日　3 日平均動能（紅正綠負；藍色虛線＝全面轉折日）"));
    const hread = mk("div", "tf-read", "移到格子上看族群與數值");
    const hbox = mk("div", "tf-box");
    hbox.appendChild(hread);
    {
      const m = J.secs.length, LB = WW < 600 ? 104 : 150, W = WW, R = 8, RH = WW < 600 ? 16 : 15, TOP = 16, BOT = 22, PW = W - LB - R, H = TOP + m * RH + BOT;
      const cw = PW / n;
      const s = sv("svg", {class: "tf-svg", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "族群動能熱力格"});
      const col = v => v == null ? "transparent" : (v >= 0 ? UP : DN);
      J.secs.forEach((sec, r) => {
        const t = sv("text", {x: LB - 6, y: TOP + r * RH + RH * .75, "font-size": WW < 600 ? 10.5 : 11.5, fill: INK2, "text-anchor": "end"}); t.textContent = WW < 600 && sec.length > 8 ? sec.slice(0, 8) + "…" : sec; s.appendChild(t);
        J.heat[r].forEach((v, i) => {
          if (v == null) return;
          s.appendChild(sv("rect", {x: LB + i * cw, y: TOP + r * RH + 1, width: cw + .3, height: RH - 2, fill: col(v), opacity: (0.15 + 0.85 * Math.min(1, Math.abs(v) / 2.5)).toFixed(2)}));
        });
      });
      // 🟢 11-17（雲端新1 C44，Evans「虛線很不明顯」）：轉折線改藍色加粗虛線（紅底綠底都看得到）＋底下墊一層背景色描邊；方向改由上緣 ▲紅／▼綠 表示
      (J.turns || []).forEach(t => { const x = LB + (t[0] + .5) * cw;
        s.appendChild(sv("line", {x1: x, x2: x, y1: TOP, y2: TOP + m * RH, stroke: TFBG, "stroke-width": 4, "stroke-dasharray": "6 4", opacity: .55}));
        s.appendChild(sv("line", {x1: x, x2: x, y1: TOP, y2: TOP + m * RH, stroke: TURN, "stroke-width": 2.2, "stroke-dasharray": "6 4"}));
        s.appendChild(sv("path", {d: t[1] > 0 ? `M${x - 5},${TOP - 2}L${x + 5},${TOP - 2}L${x},${TOP - 11}Z` : `M${x - 5},${TOP - 11}L${x + 5},${TOP - 11}L${x},${TOP - 2}Z`, fill: t[1] > 0 ? UP : DN})); });
      for (let i = 0; i < n; i += Math.ceil(n / (WW < 600 ? 4 : 6))) {
        const t = sv("text", {x: LB + (i + .5) * cw, y: H - 6, "font-size": 12, fill: INK2, "text-anchor": i ? "middle" : "start"}); t.textContent = J.dates[i].slice(2, 7).replace("-", "/"); s.appendChild(t);
      }
      const mv = ev => {
        const r = s.getBoundingClientRect(), p = ev.touches ? ev.touches[0] : ev;
        const x = (p.clientX - r.left) / r.width * W, y = (p.clientY - r.top) / r.height * H;
        const i = Math.floor((x - LB) / cw), k = Math.floor((y - TOP) / RH);
        if (i < 0 || i >= n || k < 0 || k >= m) return;
        const v = J.heat[k][i];
        hread.innerHTML = `${J.dates[i]}　${J.secs[k]}（${J.n_mem[k]} 檔）　3 日平均動能 <b class="${v > 0 ? "tf-up" : "tf-dn"}">${sg(v)}</b>`;
      };
      s.addEventListener("mousemove", mv); s.addEventListener("touchstart", mv, {passive: true});
      hbox.appendChild(s);
      hbox.appendChild(mk("div", "tf-sub", `<b style="color:${TURN}">┆ 藍色虛線</b>＝全面轉折日（很多族群同一天翻轉）；上緣 <span class="tf-up">▲</span> 向上轉折、<span class="tf-dn">▼</span> 向下轉折。格子紅＝3 日平均動能為正、綠＝為負，顏色越深數值越大。`));
    }
    root2.appendChild(hbox);
    }
    draw();
    let rz = null;
    window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (root.isConnected) draw(); }, 250); });

    // ── 歷史統計 ──
    root.appendChild(mk("div", "tf-h", `歷史統計（${J.first}～${J.asof}，${J.days} 個交易日）`));
    const pc = v => v == null ? "—" : (v >= 90 || v <= 10 ? `<b>${v}</b>` : v);
    const st = J.stat || {}, row = (nm, o) => o ? `<tr><td>${nm}</td><td>${o.n}</td><td>${sg(o.m5)}</td><td>${o.up5 ?? "—"}%</td><td>${pc(o.pct5)}</td><td>${sg(o.m20)}</td><td>${o.up20 ?? "—"}%</td><td>${pc(o.pct20)}</td></tr>` : "";
    const base = st.down || {};
    const tb = mk("div", "tf-scroll", `<table class="tf-tbl"><thead><tr><th>之後的加權指數</th><th>次數</th><th>5 日平均</th><th>5 日上漲機率</th><th>比隨機（分位）</th><th>20 日平均</th><th>20 日上漲機率</th><th>比隨機（分位）</th></tr></thead><tbody>` +
      row("▼ 全面向下轉折日", st.down) + row("▲ 全面向上轉折日", st.up) +
      (J.layers || []).map(q => q.rows.map(r => row(`［${q.ch}］${r[0]}`, r[1])).join("")).join("") +
      `<tr><td>（對照）所有交易日</td><td>—</td><td>${sg(base.bm5)}</td><td>${base.bup5 ?? "—"}%</td><td>50</td><td>${sg(base.bm20)}</td><td>${base.bup20 ?? "—"}%</td><td>50</td></tr></tbody></table>`);
    root.appendChild(tb);
    const nts = (J.layers || []).flatMap(q => (q.notes || []).map(t => `［${q.ch}］${t}`));
    if (nts.length) root.appendChild(mk("div", "tf-sub", nts.join("<br>")));
    const p3 = J.pre3 || {};
    root.appendChild(mk("div", "tf-sub", "怎麼看：「比隨機」＝事件之後的平均漲跌，放在同樣次數隨機抽日子（2,000 次）的第幾分位；50 附近＝跟隨便哪一天差不多，粗體（≥ 90 或 ≤ 10）才算明顯偏多或偏空。" +
      `動能轉折日描述的是「族群同時轉向」這件事本身，之後的漲跌跟一般日子分不太出來：3 日平均要等動能真的翻過來才確認，向上轉折前 3 天加權平均已經先漲 ${sg(p3.up)}、向下轉折前 3 天已經先跌 ${sg(p3.down)}（一般 3 天 ${sg(p3.all)}），確認時大半段已經走完，所以是看盤時的結構提示，不是單獨的方向訊號。` +
      (J.foot ? "　" + J.foot : "")));
  });
  return root;
}
