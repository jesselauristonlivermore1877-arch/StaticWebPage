        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/www_cache
          key: www-cache-${{ env.WWW_CACHE_DAY }}-${{ github.run_id }}

      # 🔴 10-05（Evans：無人值守，每一個失敗都要寄信）：上面「失敗就沿用上一份、不擋上線」的步驟，失敗時網站照常更新，
      #    但以前整個 run 還是綠的、沒人知道。這一步在資料提交之後檢查，有任何一項失敗就讓這次 run 標成失敗 → GitHub 寄信。
      - name: 失敗通報
        if: always()
        run: |
          F=0
          if [ -s "$RUNNER_TEMP/soft_fail.txt" ]; then echo "::error::這幾項失敗（資料已用上一份）："; cat "$RUNNER_TEMP/soft_fail.txt"; F=1; fi
          for s in "corp:${{ steps.corp.outcome }}" "quant:${{ steps.quant.outcome }}" "world:${{ steps.world.outcome }}" "pickedm:${{ steps.pickedm.outcome }}"; do
            case "$s" in *:failure) echo "::error::步驟 ${s%%:*} 失敗（處置股行事曆＝corp、量化數字檔＝quant、職位表全球資料＝world、選股 EDM＝pickedm）"; F=1;; esac
          done
          if [ "$F" = 1 ]; then exit 1; fi
          echo "✓ 這一班沒有被吞掉的失敗"
