# 放在 staticWebPage repo 的 .github/workflows/daily.yml
#
# 為什麼 Action 放在網頁 repo 而不是程式 repo：
#   程式 repo 一被 push，Render 就會重新部署一次。每天自動跑就等於每天重啟一次，
#   永豐長測會被打斷。放在網頁 repo，每天的 commit 只落在網頁這邊，Render 完全不受影響。
# re-register 2026-08-11
name: 每日戰情更新

on:
  workflow_dispatch:        # 也可以在網頁上手動按「Run workflow」（cron-job.org 15:40／18:40／21:20 也是打這個）
  # 🔴 10-05（Evans：無人值守）：以前唯一的觸發來源是 cron-job.org（同一支 PAT，11-11 到期）→ 加 GitHub 排程當第二條路。
  #    重複跑沒關係（同一個 concurrency group 排隊、沒變動不提交）；GitHub 排程常延遲 5～30 分鐘。
  schedule:
    - cron: "25 8 * * *"    # 台北 16:25（15:40 那班之後）
    - cron: "5 14 * * *"    # 台北 22:05（21:20 那班之後）

permissions:
  contents: write           # 要把產出 commit 回這個 repo

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 10-12 晚：35 分讓 job 比 world 步驟（25 分）先到上限 → 整班連提交一起被取消；改成大於各步上限加總，world 超時只砍那步、照樣提交

    steps:
      - name: 排程延遲量測
        run: |
          echo "排定時間 (UTC) : ${{ github.event.schedule }}"
          echo "實際啟動 (UTC) : $(date -u +%H:%M)"
          echo "實際啟動 (台北) : $(TZ=Asia/Taipei date +%H:%M)"
          echo "↑ 累積幾天就知道真實延遲分布，再決定要不要把 cron 往前挪。"

      - name: 取出網頁 repo（產出物落在這）
        uses: actions/checkout@v4
        with:
          path: site

      - name: 取出程式 repo
        uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales   # ← 改成你的 GitHub 帳號
          path: code
          # 程式 repo 若是 private，取消下一行註解，並在 Settings → Secrets 加 CODE_REPO_TOKEN
          token: ${{ secrets.CODE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      # 🔴 openpyxl 是中信 ETF adapter（pcf/ctbc.py）要的 —— 它的 PCF 是 base64 xlsx。
      #    2026-09-07 首班漏了它，00406A／00983A／00995A 三檔當場退回第三方站
      #    （第三方只給股票那 79.63%，期貨／選擇權／保證金全沒有）。
      #    ⚠️ 本機有裝所以 selftest 全綠，**只有正式環境會炸**（SOP 雷區 82）。
      # 🔴 curl-cffi 是野村／元大／第一金／凱基／安聯要的（憑證鏈不合規，見雷區 69）。
      - name: 安裝套件
        run: pip install -c "$GITHUB_WORKSPACE/code/requirements-lock.txt" requests feedparser pandas numpy yfinance curl-cffi openpyxl

      # 10-11（總指揮 15:50 第 3 項）：族群分類改動照生效日 —— sector_map_pending.csv 裡已到生效日的列先併進工作區的
      #   sector_map.csv（不 commit；正式併入由 tools/sector_map_apply.py --commit 做），生效日前的班照舊分類。
      - name: 族群分類依生效日套用（只改工作區）
        working-directory: code
        run: python tools/sector_map_apply.py

      # 🟢 10-26 11:15（總指揮雲端 2）：綜合損益表（財報公布期每天抓當季）與董事會通過／自結公告排在 build_web 之前
      #    → 河流圖、本年 CY、個股頁當班就吃到新財報（以前排在後面，晚一班）。對照表在後面那段用這班的 river.json 印。
      - name: 新財報入帳（綜合損益表・董事會通過／自結）
        working-directory: code
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python is_hist.py ../site/data --max 8 || { echo "::warning::綜合損益表回補失敗（三率、十年季度表這班不更新）"; echo "綜合損益表回補失敗（三率、十年季度表這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          python fin_status.py ../site/data --no-table || { echo "::warning::財報入帳狀態失敗（董事會通過／自結這班不更新）"; echo "財報入帳狀態失敗（董事會通過／自結這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }

      - name: 產出資料與網頁
        working-directory: code
        run: |
          python build_web.py \
            --out ../site/data \
            --private-out "${{ runner.temp }}/private"
        # 私有版（VIP）寫進 runner 的暫存目錄，跑完就隨機器銷毀，
        # 永遠不會進到任何 repo。要看 VIP 就在自己電腦跑。

      # 🟢 GEA 2026-09-01：程式策略頁籤的圖。
      # 圖由 pub_render.py 在 Colab 產、隨程式 repo 一起 commit；
      # 這一步只負責搬到網頁 repo 的 data/strategy/pub/，
      # 對應前端的 SIMG = "data/strategy/pub/"。
      #
      # 整個目錄先砍再複製是刻意的：檔名改過或某張不再產出時，舊圖要跟著消失，
      # 不然頁面會引用到一張沒人維護的殘檔，而且沒有人會發現。
      #
      # 來源不在就只警告不中止 —— 策略圖沒同步到不該擋掉整天的籌碼更新。
      - name: 同步策略頁籤的圖
        run: |
          SRC=code/static/bt/precomp/pub
          # 圖必須放在 index.html 旁邊：前端的 SIMG 是相對路徑，
          # 而網頁本體是 docs/index.html。放 repo 根目錄的 data/ 會 404。
          DST=site/docs/data/strategy/pub
          if [ ! -d "$SRC" ]; then
            echo "::warning::找不到 $SRC —— 策略圖這次不同步（頁面會缺圖）"
            exit 0
          fi
          # 用 rm -rf + cp 而不是 rsync：runner 上 rsync 不保證存在，
          # 而且這裡要的就是「整個目錄換成來源那一份」，語意更直接。
          case "$DST/" in *docs/preview/*) echo "::error::DST 落在 docs/preview/ 底下，不刪"; exit 1;; esac
          echo "[寫檔稽核] 整個刪除 $DST（接著從 $SRC 複製）"
          rm -rf "$DST"
          mkdir -p "$DST"
          cp "$SRC"/*.png "$DST"/
          N=$(ls -1 "$DST"/*.png 2>/dev/null | wc -l)
          echo "策略圖同步 $N 張 → $DST"
          # 對帳：web_data.json 記了幾張、磁碟上就該有幾張。
          # 對不上代表程式 repo 那邊的圖與 JSON 不是同一輪產的。
          python - <<'PY'
          import json, os, sys
          p = "site/data/web_data.json"
          d = json.load(open(p, encoding="utf-8"))
          want = (d.get("strategy") or {}).get("images") or []
          have = set(os.listdir("site/docs/data/strategy/pub")) if os.path.isdir("site/docs/data/strategy/pub") else set()
          miss = [x for x in want if x not in have]
          print(f"JSON 記 {len(want)} 張，磁碟上 {len(have)} 張")
          if miss:
              print("::warning::缺這幾張：" + ", ".join(miss[:8]))
          PY

      # 🟢 第六批（09-27）：處置股／個股行事曆／公司基本資料 → docs/data/{disposal,calendar,company}.json
      # 全是證交所／櫃買／公開資訊觀測站官方 API。失敗就沿用上一份，不擋當天更新（continue-on-error）。
      - name: 處置股・行事曆・基本資料
        id: corp
        working-directory: code
        continue-on-error: true
        timeout-minutes: 12
        env:
          PYTHONUNBUFFERED: "1"
        run: python corp_events.py ../site/data

      # 🟢 量化統計日報（10-04 Evans）：數字檔一定要在 build_web 寫完 web_data.json、corp_events 寫完 disposal.json 之後才產
      #    （以前在 build_web 裡面跑，讀到上一班的 web_data，把別天的數字檔蓋掉）。已有日報的數字檔凍結不覆寫。
      - name: 量化統計日報數字檔
        id: quant
        working-directory: code
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python quant_facts.py ../site/data
          python quant_verify.py ../site/data
          # 10-04 v2 合進 main：把通過核對的量化統計日報、日報刷新進 docs/data/macro.json（不打網路）
          python tools/preview_macro.py ../site --formal --light

      # 🟢 第七批（09-27）：官方職位表（每 30 天自動核對出處頁）＋全球資料（BIS 各國政策利率、16 種貨幣匯率、全球前 50 大市值每週）
      #    → docs/data/officials.json、docs/data/world.json。失敗沿用上一份，不擋當天更新。
      - name: 官方職位表・全球資料
        id: world
        working-directory: code
        continue-on-error: true
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # 10-12：每支印耗時（三班在 35 分被取消，定位是 insider 逐人回補 11.5 分）
          T(){ local s=$SECONDS; "$@"; local r=$?; echo "  ⏱ $2 用 $((SECONDS-s)) 秒（步驟累計 $SECONDS 秒）"; return $r; }
          T python registry_verify.py ../site/data
          T python officials.py ../site/data
          T python world_data.py ../site/data
          T python sector_pe.py ../site/data || { echo "::warning::產業本益比分位失敗（流向總覽第四條線這班不更新）"; echo "產業本益比分位失敗（流向總覽第四條線這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python industry_notes.py ../site/data || { echo "::warning::產業動向發布失敗（個股研究 → 產業動向這班不更新）"; echo "產業動向發布失敗（個股研究 → 產業動向這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python fin_status.py ../site/data --table-only || { echo "::warning::財報入帳對照表失敗（只影響 log）"; echo "財報入帳對照表失敗（只影響 log）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python ir_hist.py ../site/data --max 12 || { echo "::warning::法說歷史回補失敗（法說反應這班不更新）"; echo "法說歷史回補失敗（法說反應這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python contrib.py ../site/data || { echo "::warning::大盤點數貢獻失敗（這班不更新）"; echo "大盤點數貢獻失敗（這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python mi_react.py ../site/data || { echo "::warning::重訊反應失敗（這班不更新）"; echo "重訊反應失敗（這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python news_heat.py ../site/data || { echo "::warning::新聞熱度失敗（這班不更新）"; echo "新聞熱度失敗（這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python insider.py ../site/data || { echo "::warning::內部人持股失敗（這班不更新）"; echo "內部人持股失敗（這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python capital.py ../site/data || { echo "::warning::籌資動態失敗（這班不更新）"; echo "籌資動態失敗（這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python warrant.py ../site/data || { echo "::warning::權證籌碼失敗（這班不更新）"; echo "權證籌碼失敗（這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python ps_river.py ../site/data || { echo "::warning::股價營收比河流失敗（這班不更新）"; echo "股價營收比河流失敗（這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python margin_otc.py ../site/data || { echo "::warning::上櫃逐檔信用失敗（搜尋框上櫃融資融券這班不更新）"; echo "上櫃逐檔信用失敗（搜尋框上櫃融資融券這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python media_rank.py ../site/data || { echo "::warning::國內財經媒體流量排名失敗（沿用上一份）"; echo "國內財經媒體流量排名失敗（沿用上一份）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python impact.py ../site/data --export || { echo "::warning::影響判定索引失敗（Worker 用舊索引）"; echo "影響判定索引失敗（Worker 用舊索引）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python attention.py ../site/data || { echo "::warning::關注度排行失敗（這班不更新）"; echo "關注度排行失敗（這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          # 🟢 10-25 17:10（雲端 6）：個股頁補充資料（外資持股比、融資使用率、五年除權息）→ data/stock_extra.json，要在 stock_lookup 前面
          T python stock_extra.py ../site/data || { echo "::warning::個股補充資料失敗（外資持股比／融資使用率／股利沿用上一份）"; echo "個股補充資料失敗（外資持股比／融資使用率／股利沿用上一份）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          T python stock_lookup.py ../site/data || { echo "::warning::個股查詢資料失敗（搜尋框資訊框這班不更新）"; echo "個股查詢資料失敗（搜尋框資訊框這班不更新）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          # 🟢 10-25：頁首國際指數＋公司債利差「信用風險升溫」紅標（TG 兩個 secret 沒設時只上網頁）
          T python world_idx.py ../site/data || { echo "::warning::國際指數／公司債利差失敗（沿用上一份）"; echo "國際指數／公司債利差失敗（沿用上一份）" >> "$RUNNER_TEMP/soft_fail.txt"; }
          # 🟢 10-26 02:50（總指揮 雲端 6）：上櫃熱門股證券商進出排行每天存一份（只有當天、沒有歷史；存滿 1～2 個月再做分點分類）→ data/broker_hot/
          T python broker_hot.py ../site/data || { echo "::warning::上櫃熱門股券商進出排行失敗（這班沒存）"; echo "上櫃熱門股券商進出排行失敗（這班沒存）" >> "$RUNNER_TEMP/soft_fail.txt"; }

      # 健康檢查放在提交之前，而且允許它擋下這次更新：
      # 數字荒謬時，寧可網站停在昨天的正確資料，也不要蓋上今天的錯誤資料。
      # （只有「不可能的數字」才會 exit 1；缺漏只是警告，不會擋。）
      - name: 健康檢查
        working-directory: code
        run: python check_web.py ../site/data/web_data.json

      - name: 提交
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🔴 09-27（Evans）：正式建置不可以動到預覽資料夾 —— 有任何變動（改、刪、新增）就不提交
          if [ -n "$(git status --porcelain --untracked-files=all -- docs/preview)" ]; then
            echo "::error::正式建置動到 docs/preview/，不提交："
            git status --porcelain --untracked-files=all -- docs/preview
            exit 1
          fi
          echo "✓ docs/preview/ 沒有被動到"
          git add data docs
          if git diff --staged --quiet; then
            echo "今天沒有任何變動，不提交。"
          else
            git commit -m "每日更新 $(TZ=Asia/Taipei date +%F)"
            # 10-25：同一段時間別的排程（即時信息流、國際指數）也改了 docs/index.html、world_idx.json → rebase 衝突整班沒推上（run 372）。
            #        衝突時以這一班剛產出的為準（rebase 的 -X theirs＝正在重放的本班 commit）；其他檔照常合併。
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      # 🔴 10-05（Evans：無人值守，每一個失敗都要寄信）：上面「失敗就沿用上一份、不擋上線」的步驟，失敗時網站照常更新，
      #    但以前整個 run 還是綠的、沒人知道。這一步在資料提交之後檢查，有任何一項失敗就讓這次 run 標成失敗 → GitHub 寄信。
      - name: 失敗通報
        if: always()
        run: |
          F=0
          if [ -s "$RUNNER_TEMP/soft_fail.txt" ]; then echo "::error::這幾項失敗（資料已用上一份）："; cat "$RUNNER_TEMP/soft_fail.txt"; F=1; fi
          for s in "corp:${{ steps.corp.outcome }}" "quant:${{ steps.quant.outcome }}" "world:${{ steps.world.outcome }}"; do
            case "$s" in *:failure) echo "::error::步驟 ${s%%:*} 失敗（處置股行事曆＝corp、量化數字檔＝quant、職位表全球資料＝world）"; F=1;; esac
          done
          if [ "$F" = 1 ]; then exit 1; fi
          echo "✓ 這一班沒有被吞掉的失敗"
