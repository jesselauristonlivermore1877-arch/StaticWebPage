      #    讀程式 repo data/roll/roll_spread.xlsx 的 TX 分頁（W／datafeed 換月後更新 xlsx，這步每班重產）；csv 每列跟 xlsx 原值逐格核對，沒過 exit 1、不寫檔 → 沿用上一份；只記 ⚠ 不擋上線。
