# 放在 staticWebPage repo 的 .github/workflows/daily.yml
#
# 為什麼 Action 放在網頁 repo 而不是程式 repo：
#   程式 repo 一被 push，Render 就會重新部署一次。每天自動跑就等於每天重啟一次，
#   永豐長測會被打斷。放在網頁 repo，每天的 commit 只落在網頁這邊，Render 完全不受影響。
# re-register 2026-08-11
name: 每日戰情更新

on:
  schedule:
    # GitHub 的 cron 用 UTC，換算台北要 +8
    # 避開整點/半點：GitHub 的排程是全球共用佇列，:00 和 :30 最壅塞，
    # 碎數分鐘拿到執行權的機會較高。（注意：GitHub 不會為你多開機器，
    # 這是排隊順位問題，不是資源問題 —— 所以碎數只是「比較不會塞」，不保證準時。）
    - cron: "9 7 * * 1-5"     # 台北 15:09 — 期權籌碼、三大法人已出，先更新一版
    - cron: "9 13 * * 1-5"    # 台北 21:09 — 主動ETF(18:00)、信用交易(21:00) 出齊，這版才完整
  workflow_dispatch:        # 也可以在網頁上手動按「Run workflow」

permissions:
  contents: write           # 要把產出 commit 回這個 repo

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 排程延遲量測
        run: |
          echo "排定時間 (UTC) : ${{ github.event.schedule }}"
          echo "實際啟動 (UTC) : $(date -u +%H:%M)"
          echo "實際啟動 (台北) : $(TZ=Asia/Taipei date +%H:%M)"
          echo "↑ 累積幾天就知道真實延遲分布，再決定要不要把 cron 往前挪。"

      - name: 取出網頁 repo（產出物落在這）
        uses: actions/checkout@v4
        with:
          path: site

      - name: 取出程式 repo
        uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales   # ← 改成你的 GitHub 帳號
          path: code
          # 程式 repo 若是 private，取消下一行註解，並在 Settings → Secrets 加 CODE_REPO_TOKEN
          token: ${{ secrets.CODE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install requests feedparser pandas numpy yfinance curl-cffi

      - name: 產出資料與網頁
        working-directory: code
        run: |
          python build_web.py \
            --out ../site/data \
            --private-out "${{ runner.temp }}/private"
        # 私有版（VIP）寫進 runner 的暫存目錄，跑完就隨機器銷毀，
        # 永遠不會進到任何 repo。要看 VIP 就在自己電腦跑。

      # 健康檢查放在提交之前，而且允許它擋下這次更新：
      # 數字荒謬時，寧可網站停在昨天的正確資料，也不要蓋上今天的錯誤資料。
      # （只有「不可能的數字」才會 exit 1；缺漏只是警告，不會擋。）
      - name: 健康檢查
        working-directory: code
        run: python check_web.py ../site/data/web_data.json

      - name: 提交
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "今天沒有任何變動，不提交。"
          else
            git commit -m "每日更新 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase origin main   # ⬅️ 補上這行，把遠端的新進度拉下來合併
            git push origin HEAD:main
          fi
