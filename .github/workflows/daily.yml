      - name: 提交
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🔴 09-27（Evans）：正式建置不可以動到預覽資料夾 —— 有任何變動（改、刪、新增）就不提交
          if [ -n "$(git status --porcelain --untracked-files=all -- docs/preview)" ]; then
            echo "::error::正式建置動到 docs/preview/，不提交："
            git status --porcelain --untracked-files=all -- docs/preview
            exit 1
          fi
          echo "✓ docs/preview/ 沒有被動到"
          git add data docs
          if git diff --staged --quiet; then
            echo "今天沒有任何變動，不提交。"
          else
            git commit -m "每日更新 $(TZ=Asia/Taipei date +%F)"
            # 10-25：同一段時間別的排程（即時信息流、國際指數）也改了 docs/index.html、world_idx.json → rebase 衝突整班沒推上（run 372）。
            #        衝突時以這一班剛產出的為準（rebase 的 -X theirs＝正在重放的本班 commit）；其他檔照常合併。
            # 11-12（雲端P）：別的排程同一刻推 → 「cannot lock ref」整班沒推上（run 43196363217）→ 最多 4 次，每次先重新 rebase
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              [ "$i" = 4 ] && exit 1
              echo "推送第 $i 次沒成功，$((i * 10)) 秒後重試"; sleep $((i * 10))
            done
          fi

      - name: 保存證交所 www 快取
