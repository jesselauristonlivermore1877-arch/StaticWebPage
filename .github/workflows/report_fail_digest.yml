# report_fail_digest.yml ─ 指定個股報告「沒上架」每日彙總（雲端H 11-08，【舊】總指揮 11-08 第 1c 項）
#   company_report_run.yml 沒上架的那班不再逐篇發 TG，改記一筆到 data/report_failures/<台北日期>.jsonl；
#   這支每天台北 21:43 讀「過去 24 小時」的記錄，發一則 TG：幾篇沒過、原因前 3、各篇代號。沒有就不發。
name: 指定報告沒上架彙總

on:
  workflow_dispatch:
    inputs:
      send:
        description: "1＝發 TG；0＝只印出（測試用）"
        required: false
        default: "0"
      hours:
        description: "往回看幾小時（預設 24）"
        required: false
        default: "24"
  schedule:
    - cron: "43 13 * * *"     # 台北 21:43

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 彙總＋TG
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SEND: ${{ github.event_name == 'schedule' && '1' || inputs.send }}
          HOURS: ${{ inputs.hours || '24' }}
        run: |
          echo "觸發：${{ github.event_name }}　send=$SEND　往回 ${HOURS} 小時"
          python3 - <<'PY'
          import collections, glob, json, os, re, urllib.parse, urllib.request, datetime as dt
          TZ = dt.timezone(dt.timedelta(hours=8))
          now = dt.datetime.now(TZ); since = now - dt.timedelta(hours=float(os.environ.get("HOURS") or 24))
          R = []
          for p in sorted(glob.glob("data/report_failures/*.jsonl")):
              for line in open(p, encoding="utf-8"):
                  try: r = json.loads(line)
                  except ValueError: continue
                  try: at = dt.datetime.fromisoformat(r["at"]).replace(tzinfo=TZ)
                  except (KeyError, ValueError): continue
                  if at >= since: R.append(r)
          print(f"[digest] 過去 {os.environ.get('HOURS') or 24} 小時（{since:%m-%d %H:%M} 起）沒上架 {len(R)} 筆")
          if not R:
              print("[digest] 沒有沒上架的報告，不發 TG"); raise SystemExit(0)
          C = collections.Counter()
          for r in R:
              for x in (r.get("reasons") or [r.get("stage") or "不明"]):
                  C[re.sub(r"：….*$", "", str(x))[:60]] += 1     # 「禁用字「布局」：…原句」只留到冒號前
          codes = sorted({r["code"] for r in R})
          top = "\n".join(f"{i}. {k}（{n} 次）" for i, (k, n) in enumerate(C.most_common(3), 1))
          stg = collections.Counter(r.get("stage") or "不明" for r in R)
          msg = (f"GEA：指定個股報告 過去 {os.environ.get('HOURS') or 24} 小時有 {len(R)} 篇沒上架"
                 f"（{'、'.join(f'{k} {v}' for k, v in stg.most_common())}）。\n原因前 3：\n{top}\n"
                 f"代號：{'、'.join(codes)}\n（上架的照常逐篇通知；明細 data/report_failures/）")
          print(msg)
          if os.environ.get("SEND") != "1":
              print("[digest] send≠1，只印不發"); raise SystemExit(0)
          tok, chat = os.environ.get("TG_BOT_TOKEN"), os.environ.get("TG_CHAT_ID")
          if not tok or not chat:
              print("[digest] 沒有 TG secret，沒發"); raise SystemExit(1)
          q = urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode()
          with urllib.request.urlopen(f"https://api.telegram.org/bot{tok}/sendMessage", q, timeout=20) as h:
              print("[digest] TG HTTP", h.status)
          PY
