# market_alert.yml ─ 盤勢緊急通知（總指揮 2026-11-06 D3；程式 CustomerServiceANDSales/tools/market_alert.py）
#   起因：11-05 夜盤台指期 -2,946 點（-7.03%），媒體 22:39 起陸續發文，網站沒有跑馬燈也沒有 TG
#   （news_live 台北 23:07 之後到隔天 07:07 沒有班次，夜盤新聞又被評為 C 級、沒上頁首跑馬燈）。
#   每 15 分鐘：① 期交所行情台指期近月（日盤／夜盤）漲跌幅 ≥2% 注意、≥3% 緊急，每跨 1% 通知一次
#             ② 金管會、央行、證交所、期交所新聞稿標題有盤勢字眼
#             ③ 權威媒體（同即時信息流名單）標題有台股／台指期＋崩跌／暴漲字眼，或主管機關對盤勢表態
#   → docs/data/market_alert.json（網站頂端通知條讀這份，前端由雲端 C 接）＋TG。
#   GitHub 排程會掉班 → 夜盤時段另請 W 在本機排程跑同一支程式（TODO「雲端D 11-06 第二輪」）。
#   這兩個檔只有這個 workflow 寫 → 推不上時 reset 到最新 main 再把這一班的檔放回去（不重跑，TG 不會重推）。
name: 盤勢緊急通知

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write     # 11-08（雲端H）：有新的價格觸發時叫 root_cause.yml（workflow_dispatch）

concurrency:
  group: market-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - run: pip install -c "$GITHUB_WORKSPACE/code/requirements-lock.txt" feedparser requests numpy
      - name: 記下跑前的價格觸發
        working-directory: site
        run: python3 -c "import json;d=json.load(open('data/market_alert_state.json',encoding='utf-8'));print('\n'.join(k for k in d.get('sent',{}) if k.startswith('px|')))" > "$RUNNER_TEMP/px_before.txt" 2>/dev/null || true
      - name: 盤勢偵測＋TG
        working-directory: code
        env:
          PYTHONUNBUFFERED: "1"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "觸發：${{ github.event_name }}　排定（UTC）：${{ github.event.schedule }}　實際啟動（台北）：$(TZ=Asia/Taipei date +%H:%M)"
          python tools/market_alert.py ../site/data
      - name: 提交
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          F="docs/data/market_alert.json data/market_alert_state.json"
          git add $F
          if git diff --staged --quiet; then echo "沒有變動，不提交。"; exit 0; fi
          git commit -qm "data: 盤勢緊急通知 $(TZ=Asia/Taipei date '+%F %H:%M')"
          mkdir -p "$RUNNER_TEMP/ma/docs/data" "$RUNNER_TEMP/ma/data"
          for f in $F; do cp "$f" "$RUNNER_TEMP/ma/$f"; done
          for i in 1 2 3 4; do
            git push -q origin HEAD:main && exit 0
            git fetch -q origin main && git reset -q --hard origin/main
            for f in $F; do cp "$RUNNER_TEMP/ma/$f" "$f"; done
            git add $F
            git diff --staged --quiet || git commit -qm "data: 盤勢緊急通知 $(TZ=Asia/Taipei date '+%F %H:%M')"
            sleep $((2 ** i))
          done
          exit 1
      # 11-08（雲端H，【舊】總指揮 11-08 第 2 項）：這一班有「新的」價格觸發（state.sent 多了 px| 鍵）→ 叫根因追蹤一次；
      #   同一個台股日已有 docs/data/root_cause/<日期>.json、或根因追蹤已有手動觸發班在跑／排隊，就不叫。
      - name: 有新的價格觸發就叫根因追蹤
        if: success()
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json;d=json.load(open('data/market_alert_state.json',encoding='utf-8'));print('\n'.join(k for k in d.get('sent',{}) if k.startswith('px|')))" > "$RUNNER_TEMP/px_after.txt" || exit 0
          new=$(comm -13 <(sort -u "$RUNNER_TEMP/px_before.txt") <(sort -u "$RUNNER_TEMP/px_after.txt"))
          echo "這一班新的價格觸發：${new:-（無）}"
          [ -n "$new" ] || exit 0
          tw=$(TZ=Asia/Taipei date +%F)
          # 11-08（雲端H2，第 27 條）：07:30 盤前班寫的是 mode=us_only（只看美股），不算「已有結果」——盤中價格觸發照樣要叫完整班
          if [ -f "docs/data/root_cause/$tw.json" ] && ! grep -q '"mode": *"us_only"' "docs/data/root_cause/$tw.json"; then echo "台股日 $tw 已有根因追蹤結果，不重叫"; exit 0; fi
          runs=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/root_cause.yml/runs?created=>=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=20" \
            | python3 -c "import json,sys;print(sum(1 for r in json.load(sys.stdin).get('workflow_runs',[]) if r.get('event')=='workflow_dispatch' and r.get('status')!='completed'))" 2>/dev/null || echo 0)
          if [ "${runs:-0}" != "0" ]; then echo "根因追蹤已有 $runs 班在跑／排隊，不重叫"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/root_cause.yml/dispatches" \
            -d '{"ref":"main","inputs":{"cases":"","blind":"0","trigger":"market_alert"}}')
          echo "叫根因追蹤（台股日 $tw）：HTTP $code（204＝成功）"
      # 11-06（總指揮）：任何一步失敗就推 TG（掉班＝超過 30 分鐘沒跑，由程式讀 state 的 ran 偵測、下一班推）
      - name: 失敗警告
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -o /dev/null -w "TG HTTP %{http_code}\n" "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=⚠️ 盤勢緊急通知 workflow 失敗（台北 $(TZ=Asia/Taipei date '+%m/%d %H:%M')），這一班沒有更新、沒有推通知：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
