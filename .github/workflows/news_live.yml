# news_live.yml ─ 即時信息流（Evans 2026-09-28；程式 news_live.py，TODO「即時信息流」第 2 步）
#   盤中每 30 分鐘增量抓常駐人物與熱門議題的新聞，只收權威來源（路透、美聯社、彭博、日經、中央社），不追數量。
#   盤後到半夜每小時一次（國際新聞不挑時間；例：2026-09-28 15:41 黃仁勳紐約會晤李在鎔、崔泰源）。
#   GitHub 排程常延遲 → 準點請用 cron-job.org 打 workflow_dispatch（待 Evans 設定，TODO「待我動手」）。
#   只寫 data/news_live.json 與 docs/data/news_live.json；不跟 daily-build 同組，不會排在每日班後面。
name: 即時信息流

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "往回抓幾小時（預設 2）"
        required: false
        default: "2"
  schedule:
    - cron: "*/30 0-5 * * 1-5"     # 台北 08:00～13:30 盤中，每 30 分鐘
    - cron: "7 6-15,23 * * *"      # 台北 07:07、14:07～23:07 每小時

permissions:
  contents: write

concurrency:
  group: news-live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - run: pip install -c "$GITHUB_WORKSPACE/code/requirements-lock.txt" feedparser requests numpy pypdf cryptography
      - name: 即時信息流
        working-directory: code
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # 10-05：地緣政治 AI 判斷（結果快取 data/registry/geo_ai.json）；10-25：每則一行結論（data/registry/news_gist.json）
          # 10-04：記下每一班是誰觸發的（GitHub 排程／cron-job.org 打 API＝workflow_dispatch），查平日為什麼只跑約 16 班
          GH_EVENT: ${{ github.event_name }}
          GH_SCHEDULE: ${{ github.event.schedule }}
          GH_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "觸發：${{ github.event_name }}　排定（UTC）：${{ github.event.schedule }}　實際啟動（台北）：$(TZ=Asia/Taipei date +%H:%M)"
          python news_live.py ../site/data --hours "${{ inputs.hours || '2' }}"
      - name: 提交
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_live.json docs/data/news_live.json data/registry/news_layers.json data/registry/news_big_weights.json data/registry/geo_ai.json data/registry/news_gist.json
          if git diff --staged --quiet; then
            echo "沒有變動，不提交。"
            exit 0
          fi
          git commit -m "data: 即時信息流 $(TZ=Asia/Taipei date '+%F %H:%M')"
          # 每日班可能同時提交 → 重試 4 次（2、4、8、16 秒）
          # 🔴 10-04：09-30、10-01 10:00 那兩班 rebase 撞到 news_live.json 衝突、重試 4 次都卡在未解決的衝突 →
          #    衝突時 abort、把這一班的結果先存起來、reset 到最新 main、用程式重併（news_live.py --merge-from），再提交。
          cp data/news_live.json "$RUNNER_TEMP/mine.json"
          cp data/registry/news_gist.json "$RUNNER_TEMP/gist.json"     # 10-25：新聞一行結論快取（重併時 reset 會洗掉，要併回來）
          for i in 1 2 3 4; do
            if git pull --rebase origin main; then
              git push origin HEAD:main && exit 0
            else
              echo "rebase 衝突（第 $i 次）→ 改用程式重併"
              git rebase --abort 2>/dev/null || true
              git fetch origin main && git reset --hard origin/main
              python3 -c "import json,sys;p='data/registry/news_gist.json';a=json.load(open(p,encoding='utf-8'));a.update(json.load(open(sys.argv[1],encoding='utf-8')));json.dump(a,open(p,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))" "$RUNNER_TEMP/gist.json"
              (cd ../code && python news_live.py ../site/data --merge-from "$RUNNER_TEMP/mine.json")
              git add data/news_live.json docs/data/news_live.json data/registry/news_layers.json data/registry/news_big_weights.json data/registry/geo_ai.json data/registry/news_gist.json
              git diff --staged --quiet || git commit -m "data: 即時信息流 $(TZ=Asia/Taipei date '+%F %H:%M')（重併）"
              git push origin HEAD:main && exit 0
            fi
            sleep $((2 ** i))
          done
          exit 1

      # 🟢 10-26 02:50（總指揮 雲端 1～4）：法說「高成長指引」即時警報（程式 ir_alert.py）
      #    第一段：偵測新聞＋重大訊息＋新上傳的法說簡報 → data/ir_alert.json、docs/data/ir_alert.json、data/ir_trigger 標「重磅」，推上；
      #    rebase 衝突就 reset 到最新 main 重跑偵測（還沒推 TG，重跑不會重複推）。
      #    第二段：推上之後才推 TG，推過的標 sent 再推一次。失敗不擋即時信息流。
      - name: 法說重磅偵測
        if: always()
        continue-on-error: true
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          F="data/ir_alert.json docs/data/ir_alert.json data/ir_trigger"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd ../code && PYTHONUNBUFFERED=1 python ir_alert.py ../site/data) || exit 1
            git add $F 2>/dev/null || true
            if git diff --staged --quiet; then echo "法說重磅：沒有變動。"; exit 0; fi
            git commit -qm "data: 法說重磅偵測 $(TZ=Asia/Taipei date '+%F %H:%M')"
            git push -q origin HEAD:main && break
            sleep $((2 ** i))
          done
      - name: 法說重磅 TG
        if: always()
        continue-on-error: true
        working-directory: site
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          (cd ../code && PYTHONUNBUFFERED=1 python ir_alert.py ../site/data --send)
          git add data/ir_alert.json 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -qm "data: 法說重磅已推 TG $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((2 ** i))
          done
