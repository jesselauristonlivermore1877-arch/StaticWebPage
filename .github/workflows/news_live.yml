# news_live.yml ─ 即時信息流（Evans 2026-09-28；程式 news_live.py，TODO「即時信息流」第 2 步）
#   盤中每 30 分鐘增量抓常駐人物與熱門議題的新聞，只收權威來源（路透、美聯社、彭博、日經、中央社），不追數量。
#   盤後到半夜每小時一次（國際新聞不挑時間；例：2026-09-28 15:41 黃仁勳紐約會晤李在鎔、崔泰源）。
#   GitHub 排程常延遲 → 準點請用 cron-job.org 打 workflow_dispatch（待 Evans 設定，TODO「待我動手」）。
#   只寫 data/news_live.json 與 docs/data/news_live.json；不跟 daily-build 同組，不會排在每日班後面。
name: 即時信息流

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "往回抓幾小時（預設 2）"
        required: false
        default: "2"
  schedule:
    - cron: "*/30 0-5 * * 1-5"     # 台北 08:00～13:30 盤中，每 30 分鐘
    - cron: "7 6-15,23 * * *"      # 台北 07:07、14:07～23:07 每小時

permissions:
  contents: write

concurrency:
  group: news-live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install feedparser
      - name: 即時信息流
        working-directory: code
        env:
          PYTHONUNBUFFERED: "1"
        run: python news_live.py ../site/data --hours "${{ inputs.hours || '2' }}"
      - name: 提交
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_live.json docs/data/news_live.json
          if git diff --staged --quiet; then
            echo "沒有變動，不提交。"
            exit 0
          fi
          git commit -m "data: 即時信息流 $(TZ=Asia/Taipei date '+%F %H:%M')"
          # 每日班可能同時提交 → 重試 4 次（2、4、8、16 秒）
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
