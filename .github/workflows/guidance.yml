# ============================================================================
# guidance.yml ─ 法說與報告擷取（每天台北 10:00；也可手動按）
#
#   ⚠️ 放哪：**StaticWebPage** repo 的 .github/workflows/guidance.yml
#   搭配：guidance.py 放 CustomerServiceANDSales 根目錄
#   需要：StaticWebPage → Settings → Secrets → GEMINI_API_KEY（2026-09-22 已放）
#
#   來源全部是公開一手資料：MOPS 法說一覽 → 官方錄音（ffmpeg 抽聲音）＋ 中文簡報 PDF，再加報告整理頁。
#   已處理過的文件記在 data/guidance.json，不會重送 Gemini；免費層撞到每日上限就存檔收工，
#   下一次接著跑。第一次會比較久（156 檔的最新一場法說 ＋ 近半年報告），之後每週只跑新的。
#   跟 daily.yml 同一個 concurrency group，不會對撞。
# ============================================================================
name: 法說與報告擷取

on:
  workflow_dispatch:
    inputs:
      max:
        description: "這次最多送幾份給 Gemini"
        required: false
        default: "150"
  schedule:
    - cron: "0 2 * * *"      # 每天台北 10:00（免費層每日額度每天重置；補完之後每天只會跑到新的）

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: checkout 程式 repo
        uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests feedparser certifi numpy

      # 錄音要用 ffmpeg 把影片的聲音抽出來（1 小時 → 約 14 MB），runner 沒有就裝
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 擷取（這段 log 貼回來）
        working-directory: code
        continue-on-error: true           # 中途出錯也要往下走到 commit，不然整輪白做
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUIDANCE_BUDGET_MIN: "90"       # 程式自己在 90 分鐘收工（job 時限 120）
        run: python guidance.py ../site/data --max ${{ inputs.max || '150' }}

      - name: 河流圖前瞻試算（不寫檔，只印對帳數字）
        working-directory: code
        continue-on-error: true
        run: python river.py ../site/data

      - name: commit
        if: always()                      # 失敗、手動取消也照樣把已經做完的存回去
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/guidance.json docs/data/ir
          if git diff --staged --quiet; then
            echo "沒有新東西，不提交。"
          else
            git commit -m "data: 法說與報告擷取 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
