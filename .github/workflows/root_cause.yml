# root_cause.yml ─ 根因追蹤（雲端F 11-06；程式 CustomerServiceANDSales/tools/root_cause.py）
#   只能手動觸發（預覽階段；Evans 點頭前不接正式排程、不接網站與通知）。
#   輸入台股日（可附美股日）→ 價格／族群觸發 → 免費結構化來源＋Gemini 中英日韓搜尋 → Gemini 歸因 → 程式逐筆打開出處核對＋量化傳導 → 排序
#   → docs/data/root_cause/<日期>.json；中間檔 data/root_cause/<日期>/（不對外）。最後跑盲測檢查（tests/root_cause_blind.py）。
#   Gemini 走 GEMINI_API_KEY（api 線、heavy），額度狀態跟其他 workflow 共用 data/gemini_quota/。
#   11-08（雲端H，【舊】總指揮 11-08 第 2 項）接正式排程：每天 07:30 台北（週一～五）對前一晚美股跑一次；
#     market_alert 有新的價格觸發時也會叫一次（同一個台股日已有結果就不重跑）。沒給 cases 時：台股日＝最近一個已收盤的平日（台北 14:00 前取前一個平日），美股日＝台股日的前一個平日。
name: 根因追蹤

on:
  schedule:
    - cron: "30 23 * * 0-4"   # 台北週一～五 07:30（盤前，只看昨晚美股）
    # 🟢 11-16（雲端舊13；【舊】裁示「15:40 補跑完整班：要」）：盤後固定補一班完整班，蓋掉早上的 us_only；
    #   同一個台股日已有完整結果（market_alert 叫過、或手動跑過）就跳過，不重打 Gemini。
    # 🟢 11-17（雲端舊20）：15:40 → 16:10。Gemini 搜尋額度台灣 16:00（冬令）才重置；11-17 早班四語搜尋全部「額度用完」，
    #   15:40 再跑一樣打不到 → 改在重置後跑，才算「額度恢復後自動補跑」。
    - cron: "10 8 * * 1-5"    # 台北週一～五 16:10（盤後完整班；🟢 11-21 遇到休市日改跑「非交易日官方政策班」）
    # 🟢 11-21（雲端新17；【新】總指揮派工，Evans 11-21 週六晚：金管會週末公布全面禁空，根因追蹤沒更新）
    #   非交易日官方政策班：只收官方或權威來源確認的政策（tools/rc_offday.py），不算價格與量化；下個交易日的班把它併進當天政策回應。
    - cron: "10 2,8,14 * * 6,0"   # 台北週六、週日 10:10、16:10、22:10
    - cron: "10 2,14 * * 1-5"     # 台北週一～五 10:10、22:10：只在休市日跑（交易日直接結束）
  workflow_dispatch:
    inputs:
      offday:
        description: "1＝非交易日官方政策班（日期＝今天台北；交易日不跑）；其他輸入不看"
        required: false
        default: "0"
      cases:
        description: "台股日[:美股日]，逗號分隔（例 2026-11-06:2026-11-05）；留空＝最近已收盤的台股平日＋其前一個美股平日"
        required: false
        default: ""
      trigger:
        description: "誰叫的（排程／market_alert／手動），只寫進 log 與 commit"
        required: false
        default: "手動"
      blind:
        description: "跑完是否跑盲測檢查（1／0）"
        required: false
        default: "1"
      us_only:
        description: "1＝盤前班（只看昨晚美股，台股日＝今天）；W 本機 07:25 打 dispatch 用這個（11-16【舊】裁示：07:30 GitHub 排程延遲 3～4.5 小時，改由 W 打、排程留備援）"
        required: false
        default: "0"
      hints:
        description: "指定必查的候選原因（分號分隔；11-17 加：一樣搜尋＋出處核對，沒通過不上卡）；留空＝照常"
        required: false
        default: ""
      resanitize:
        description: "只對已發布的根因 JSON 重跑敏感字關卡（日期逗號分隔，all＝全部；不打 Gemini、不跑搜尋）；留空＝照常"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: root-cause
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 檢查輸入
        env:
          CASES: ${{ inputs.cases }}
        run: |
          # 11-08 實測（run 42440696476）：root_cause.py 要台股日當天已有加權指數，07:30 用「今天」會「不是台股交易日」→
          #   台北 14:00 前取前一個平日、14:00 後取今天；美股日＝台股日的前一個平日（國定假日由程式擋，log 會寫）。
          prevwd() { local d="$1"; while :; do d=$(date -d "$d -1 day" +%F); [ "$(date -d "$d" +%u)" -le 5 ] && { echo "$d"; return; }; done; }
          # 11-08（雲端H2，第 27 條）：07:30 排程班＝只看昨晚美股（--us-only，台股日＝今天、還沒開盤）；手動／market_alert 照舊
          #   11-16：只有 07:30 那個 cron 是盤前班；15:40 那個 cron 走下面「沒給 cases」的完整班（14:00 後台股日＝今天）
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 23 * * 0-4" ]; } || [ "${{ inputs.us_only }}" = "1" ]; then
            if [ -z "$CASES" ]; then CASES=$(TZ=Asia/Taipei date +%F); echo "US_ONLY=1" >> "$GITHUB_ENV"; fi
          fi
          #   11-16：07:30 GitHub 排程只當備援 —— W 07:25 已打過盤前班（同台股日已有任何結果）就跳過，兩邊不重複跑
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 23 * * 0-4" ]; then echo "PRE_SCHED=1" >> "$GITHUB_ENV"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "10 8 * * 1-5" ]; then echo "FULL_SCHED=1" >> "$GITHUB_ENV"; fi
          if [ -z "$CASES" ]; then
            today=$(TZ=Asia/Taipei date +%F)
            if [ "$(TZ=Asia/Taipei date +%H%M)" -ge 1400 ] && [ "$(date -d "$today" +%u)" -le 5 ]; then tw=$today; else tw=$(prevwd "$today"); fi
            us=$(prevwd "$tw")
            CASES="$tw:$us"
          fi
          echo "觸發：${{ github.event_name }}（${{ inputs.trigger || '排程' }}）　cases=$CASES　台北 $(TZ=Asia/Taipei date '+%F %H:%M')"
          echo "CASES=$CASES" >> "$GITHUB_ENV"
          [[ "$CASES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(:[0-9]{4}-[0-9]{2}-[0-9]{2})?(,[0-9]{4}-[0-9]{2}-[0-9]{2}(:[0-9]{4}-[0-9]{2}-[0-9]{2})?)*$ ]] || { echo "✗ cases 格式不對：$CASES"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: StaticWebPage
      - uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: CustomerServiceANDSales
      - name: 盤前備援班：同台股日已有結果（W 07:25 跑過）就跳過
        if: env.PRE_SCHED == '1'
        working-directory: StaticWebPage
        run: |
          tw="${CASES%%:*}"; f="docs/data/root_cause/$tw.json"
          if [ -f "$f" ]; then echo "台股日 $tw 已有根因結果（W 早班或其他班跑過），07:30 備援班跳過"; echo "RC_SKIP=1" >> "$GITHUB_ENV"
          else echo "台股日 $tw 還沒有結果 → 備援班照跑盤前（W 早班沒跑到）"; fi
      - name: 盤後完整班：同台股日已有完整結果就跳過
        if: env.FULL_SCHED == '1'
        working-directory: StaticWebPage
        run: |
          tw="${CASES%%:*}"; tw="${tw%%,*}"; f="docs/data/root_cause/$tw.json"
          # 11-17（雲端舊20）：已有完整結果、但那一份的 Gemini 四語搜尋全部失敗（額度用完時只靠免費新聞池）→ 不跳過，重跑一次
          deg=$( [ -f "$f" ] && python3 -c "import json,sys; g=[x for x in json.load(open(sys.argv[1])).get('gemini') or [] if str(x.get('task','')).startswith('搜尋')]; print(1 if g and not any(x.get('ok') for x in g) else 0)" "$f" || echo 0)
          if [ -f "$f" ] && ! grep -q '"mode": *"us_only"' "$f" && [ "$deg" != "1" ]; then echo "台股日 $tw 已有完整根因結果，16:10 班跳過"; echo "RC_SKIP=1" >> "$GITHUB_ENV"
          else echo "台股日 $tw：$( [ -f "$f" ] && { [ "$deg" = "1" ] && echo '已有結果但搜尋全失敗（降級）' || echo '只有盤前 us_only'; } || echo '還沒有結果' ) → 跑完整班"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
          pip install -c "$GITHUB_WORKSPACE/CustomerServiceANDSales/requirements-lock.txt" requests certifi numpy feedparser yfinance curl_cffi googlenewsdecoder
      - name: 判斷非交易日（週末、休市日 → 非交易日官方政策班）
        if: inputs.resanitize == ''
        working-directory: CustomerServiceANDSales
        run: |
          ev="${{ github.event_name }}"; sch="${{ github.event.schedule }}"
          td=$(python -c "import sys,datetime as d;sys.path.insert(0,'tools');import rc_offday as O;print(1 if O.is_trading('../StaticWebPage',d.datetime.now(d.timezone(d.timedelta(hours=8))).date()) else 0)")
          echo "台北 $(TZ=Asia/Taipei date '+%F %a %H:%M')：$( [ "$td" = 1 ] && echo 交易日 || echo 非交易日 )　觸發 $ev ${sch}"
          off=0
          [ "$ev" = "workflow_dispatch" ] && [ "${{ inputs.offday }}" = "1" ] && off=1
          [ "$ev" = "schedule" ] && [ "$sch" = "10 2,8,14 * * 6,0" ] && off=1
          [ "$ev" = "schedule" ] && { [ "$sch" = "10 2,14 * * 1-5" ] || [ "$sch" = "10 8 * * 1-5" ]; } && [ "$td" = 0 ] && off=1
          if [ "$off" = 1 ] && [ "$td" = 1 ]; then echo "今天是交易日 → 非交易日官方政策班不跑"; echo "RC_SKIP=1" >> "$GITHUB_ENV"
          elif [ "$off" = 1 ]; then echo "→ 非交易日官方政策班"; echo "OFFDAY=1" >> "$GITHUB_ENV"
          elif [ "$sch" = "10 2,14 * * 1-5" ]; then echo "交易日 → 10:10／22:10 這班只給休市日用，結束"; echo "RC_SKIP=1" >> "$GITHUB_ENV"; fi
      - name: 非交易日官方政策班
        if: env.OFFDAY == '1' && env.RC_SKIP != '1'
        working-directory: CustomerServiceANDSales
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_STATE: ${{ github.workspace }}/StaticWebPage/data/gemini_quota/root_cause.json
          GEMINI_QUOTA_SHARED: ${{ github.workspace }}/StaticWebPage/data/gemini_quota
          GEMINI_TASK_ROUTE: api
        run: python tools/root_cause.py --site ../StaticWebPage --offday today
      - name: 敏感字關卡重跑（resanitize）
        if: inputs.resanitize != ''
        working-directory: CustomerServiceANDSales
        run: python tools/root_cause.py --site ../StaticWebPage --resanitize "${{ inputs.resanitize }}"
      - name: 根因追蹤
        id: rc
        if: inputs.resanitize == '' && env.RC_SKIP != '1' && env.OFFDAY != '1'
        working-directory: CustomerServiceANDSales
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_STATE: ${{ github.workspace }}/StaticWebPage/data/gemini_quota/root_cause.json
          GEMINI_QUOTA_SHARED: ${{ github.workspace }}/StaticWebPage/data/gemini_quota
          GEA_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GEA_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_TASK_ROUTE: api
          RC_HINTS: ${{ inputs.hints }}
        run: |
          IFS=',' read -ra L <<< "$CASES"
          for c in "${L[@]}"; do
            tw="${c%%:*}"; us=""; [[ "$c" == *:* ]] && us="${c#*:}"
            echo "::group::根因追蹤 $tw ${us:+（美股 $us）}"
            python tools/root_cause.py --site ../StaticWebPage --tw "$tw" ${us:+--us "$us"} ${US_ONLY:+--us-only} ${RC_HINTS:+--hints "$RC_HINTS"} || echo "✗ $tw 失敗（繼續下一個）"
            echo "::endgroup::"
          done
      - name: 盲測檢查
        if: inputs.blind == '1' && inputs.resanitize == '' && env.RC_SKIP != '1' && env.OFFDAY != '1'
        working-directory: CustomerServiceANDSales
        continue-on-error: true
        run: |
          ds=$(echo "$CASES" | tr ',' '\n' | cut -d: -f1 | tr '\n' ' ')
          python tests/root_cause_blind.py ../StaticWebPage $ds
      - name: 提交
        if: always()
        working-directory: StaticWebPage
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gemini_quota data/root_cause docs/data/root_cause 2>/dev/null || true
          if git diff --staged --quiet; then echo "沒有變動"; exit 0; fi
          git commit -qm "data: 根因追蹤（${{ inputs.trigger || '排程' }}${FULL_SCHED:+・盤後完整班}${{ inputs.resanitize && '・敏感字關卡重跑' || '' }}${US_ONLY:+・盤前只看美股}${OFFDAY:+・非交易日官方政策班}）$(TZ=Asia/Taipei date '+%F %H:%M')：$CASES"
          # 11-26【新】：15:52 班跟別班同時改 data/root_cause/px/NQ.json → rebase 衝突、整班失敗（結果與 TG 旗標都沒存）。
          #   這班產出的檔以這班為準（rebase 時 -X theirs＝套用中的本班 commit）；還是失敗就 abort 再重試，不留半套狀態。
          for i in 1 2 3 4; do
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((2 ** i))
          done
          exit 1
