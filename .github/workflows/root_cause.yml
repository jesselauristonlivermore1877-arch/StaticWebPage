# root_cause.yml ─ 根因追蹤（雲端F 11-06；程式 CustomerServiceANDSales/tools/root_cause.py）
#   只能手動觸發（預覽階段；Evans 點頭前不接正式排程、不接網站與通知）。
#   輸入台股日（可附美股日）→ 價格／族群觸發 → 免費結構化來源＋Gemini 中英日韓搜尋 → Gemini 歸因 → 程式逐筆打開出處核對＋量化傳導 → 排序
#   → docs/data/root_cause/<日期>.json；中間檔 data/root_cause/<日期>/（不對外）。最後跑盲測檢查（tests/root_cause_blind.py）。
#   Gemini 走 GEMINI_API_KEY（api 線、heavy），額度狀態跟其他 workflow 共用 data/gemini_quota/。
#   預定正式排程（等 Evans 點頭才加）：每天 07:30 台北對前一晚美股跑一次（cron "30 23 * * 0-4"），異常觸發時由 market_alert 叫。
name: 根因追蹤（手動）

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "台股日[:美股日]，逗號分隔（例 2026-11-06:2026-11-05,2025-04-07,2024-08-05）"
        required: true
        default: "2026-11-06:2026-11-05,2025-04-07,2024-08-05"
      blind:
        description: "跑完是否跑盲測檢查（1／0）"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: root-cause
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 檢查輸入
        env:
          CASES: ${{ inputs.cases }}
        run: |
          [[ "$CASES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(:[0-9]{4}-[0-9]{2}-[0-9]{2})?(,[0-9]{4}-[0-9]{2}-[0-9]{2}(:[0-9]{4}-[0-9]{2}-[0-9]{2})?)*$ ]] || { echo "✗ cases 格式不對：$CASES"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: StaticWebPage
      - uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: CustomerServiceANDSales
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
          pip install -c "$GITHUB_WORKSPACE/CustomerServiceANDSales/requirements-lock.txt" requests certifi numpy feedparser yfinance curl_cffi googlenewsdecoder
      - name: 根因追蹤
        id: rc
        working-directory: CustomerServiceANDSales
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_STATE: ${{ github.workspace }}/StaticWebPage/data/gemini_quota/root_cause.json
          GEMINI_QUOTA_SHARED: ${{ github.workspace }}/StaticWebPage/data/gemini_quota
          GEA_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GEA_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_TASK_ROUTE: api
          CASES: ${{ inputs.cases }}
        run: |
          IFS=',' read -ra L <<< "$CASES"
          for c in "${L[@]}"; do
            tw="${c%%:*}"; us=""; [[ "$c" == *:* ]] && us="${c#*:}"
            echo "::group::根因追蹤 $tw ${us:+（美股 $us）}"
            python tools/root_cause.py --site ../StaticWebPage --tw "$tw" ${us:+--us "$us"} || echo "✗ $tw 失敗（繼續下一個）"
            echo "::endgroup::"
          done
      - name: 盲測檢查
        if: inputs.blind == '1'
        working-directory: CustomerServiceANDSales
        continue-on-error: true
        env:
          CASES: ${{ inputs.cases }}
        run: |
          ds=$(echo "$CASES" | tr ',' '\n' | cut -d: -f1 | tr '\n' ' ')
          python tests/root_cause_blind.py ../StaticWebPage $ds
      - name: 提交
        if: always()
        working-directory: StaticWebPage
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gemini_quota data/root_cause docs/data/root_cause 2>/dev/null || true
          if git diff --staged --quiet; then echo "沒有變動"; exit 0; fi
          git commit -qm "data: 根因追蹤（手動）$(TZ=Asia/Taipei date '+%F %H:%M')：${{ inputs.cases }}"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((2 ** i)); done
          exit 1
