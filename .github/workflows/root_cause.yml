# root_cause.yml ─ 根因追蹤（雲端F 11-06；程式 CustomerServiceANDSales/tools/root_cause.py）
#   只能手動觸發（預覽階段；Evans 點頭前不接正式排程、不接網站與通知）。
#   輸入台股日（可附美股日）→ 價格／族群觸發 → 免費結構化來源＋Gemini 中英日韓搜尋 → Gemini 歸因 → 程式逐筆打開出處核對＋量化傳導 → 排序
#   → docs/data/root_cause/<日期>.json；中間檔 data/root_cause/<日期>/（不對外）。最後跑盲測檢查（tests/root_cause_blind.py）。
#   Gemini 走 GEMINI_API_KEY（api 線、heavy），額度狀態跟其他 workflow 共用 data/gemini_quota/。
#   11-08（雲端H，【舊】總指揮 11-08 第 2 項）接正式排程：每天 07:30 台北（週一～五）對前一晚美股跑一次；
#     market_alert 有新的價格觸發時也會叫一次（同一個台股日已有結果就不重跑）。沒給 cases 時：台股日＝最近一個已收盤的平日（台北 14:00 前取前一個平日），美股日＝台股日的前一個平日。
name: 根因追蹤

on:
  schedule:
    - cron: "30 23 * * 0-4"   # 台北週一～五 07:30
  workflow_dispatch:
    inputs:
      cases:
        description: "台股日[:美股日]，逗號分隔（例 2026-11-06:2026-11-05）；留空＝最近已收盤的台股平日＋其前一個美股平日"
        required: false
        default: ""
      trigger:
        description: "誰叫的（排程／market_alert／手動），只寫進 log 與 commit"
        required: false
        default: "手動"
      blind:
        description: "跑完是否跑盲測檢查（1／0）"
        required: false
        default: "1"
      resanitize:
        description: "只對已發布的根因 JSON 重跑敏感字關卡（日期逗號分隔，all＝全部；不打 Gemini、不跑搜尋）；留空＝照常"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: root-cause
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 檢查輸入
        env:
          CASES: ${{ inputs.cases }}
        run: |
          # 11-08 實測（run 42440696476）：root_cause.py 要台股日當天已有加權指數，07:30 用「今天」會「不是台股交易日」→
          #   台北 14:00 前取前一個平日、14:00 後取今天；美股日＝台股日的前一個平日（國定假日由程式擋，log 會寫）。
          prevwd() { local d="$1"; while :; do d=$(date -d "$d -1 day" +%F); [ "$(date -d "$d" +%u)" -le 5 ] && { echo "$d"; return; }; done; }
          # 11-08（雲端H2，第 27 條）：07:30 排程班＝只看昨晚美股（--us-only，台股日＝今天、還沒開盤）；手動／market_alert 照舊
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$CASES" ]; then
            CASES=$(TZ=Asia/Taipei date +%F); echo "US_ONLY=1" >> "$GITHUB_ENV"
          fi
          if [ -z "$CASES" ]; then
            today=$(TZ=Asia/Taipei date +%F)
            if [ "$(TZ=Asia/Taipei date +%H%M)" -ge 1400 ] && [ "$(date -d "$today" +%u)" -le 5 ]; then tw=$today; else tw=$(prevwd "$today"); fi
            us=$(prevwd "$tw")
            CASES="$tw:$us"
          fi
          echo "觸發：${{ github.event_name }}（${{ inputs.trigger || '排程' }}）　cases=$CASES　台北 $(TZ=Asia/Taipei date '+%F %H:%M')"
          echo "CASES=$CASES" >> "$GITHUB_ENV"
          [[ "$CASES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(:[0-9]{4}-[0-9]{2}-[0-9]{2})?(,[0-9]{4}-[0-9]{2}-[0-9]{2}(:[0-9]{4}-[0-9]{2}-[0-9]{2})?)*$ ]] || { echo "✗ cases 格式不對：$CASES"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: StaticWebPage
      - uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: CustomerServiceANDSales
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
          pip install -c "$GITHUB_WORKSPACE/CustomerServiceANDSales/requirements-lock.txt" requests certifi numpy feedparser yfinance curl_cffi googlenewsdecoder
      - name: 敏感字關卡重跑（resanitize）
        if: inputs.resanitize != ''
        working-directory: CustomerServiceANDSales
        run: python tools/root_cause.py --site ../StaticWebPage --resanitize "${{ inputs.resanitize }}"
      - name: 根因追蹤
        id: rc
        if: inputs.resanitize == ''
        working-directory: CustomerServiceANDSales
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_QUOTA_STATE: ${{ github.workspace }}/StaticWebPage/data/gemini_quota/root_cause.json
          GEMINI_QUOTA_SHARED: ${{ github.workspace }}/StaticWebPage/data/gemini_quota
          GEA_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GEA_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_TASK_ROUTE: api
        run: |
          IFS=',' read -ra L <<< "$CASES"
          for c in "${L[@]}"; do
            tw="${c%%:*}"; us=""; [[ "$c" == *:* ]] && us="${c#*:}"
            echo "::group::根因追蹤 $tw ${us:+（美股 $us）}"
            python tools/root_cause.py --site ../StaticWebPage --tw "$tw" ${us:+--us "$us"} ${US_ONLY:+--us-only} || echo "✗ $tw 失敗（繼續下一個）"
            echo "::endgroup::"
          done
      - name: 盲測檢查
        if: inputs.blind == '1' && inputs.resanitize == ''
        working-directory: CustomerServiceANDSales
        continue-on-error: true
        run: |
          ds=$(echo "$CASES" | tr ',' '\n' | cut -d: -f1 | tr '\n' ' ')
          python tests/root_cause_blind.py ../StaticWebPage $ds
      - name: 提交
        if: always()
        working-directory: StaticWebPage
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gemini_quota data/root_cause docs/data/root_cause 2>/dev/null || true
          if git diff --staged --quiet; then echo "沒有變動"; exit 0; fi
          git commit -qm "data: 根因追蹤（${{ inputs.trigger || '排程' }}${{ inputs.resanitize && '・敏感字關卡重跑' || '' }}${US_ONLY:+・盤前只看美股}）$(TZ=Asia/Taipei date '+%F %H:%M')：$CASES"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((2 ** i)); done
          exit 1
