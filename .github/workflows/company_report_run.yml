# company_report_run.yml ─ 指定個股 AI 研究報告（【新】總指揮 10-30 一、六）
#   手動觸發、輸入股票代號 → 走本機同一套 tools/company_report.py（數字由程式從公開資訊觀測站與站上資料產生、
#   文字走 GEMINI_API_KEY 那條線、雲端 company_verify 同一道關卡全過才寫檔）→ 打包 company_reports.json → 推上 → TG。
#   兩個 repo 取到同層的 CustomerServiceANDSales／StaticWebPage，路徑跟本機一樣（gemini_task 的 _inbox、company_report 的 SITE 不用改）。
#   11-09（Evans 裁示 C，雲端M）：company_report 先找官方逐字稿（docs/data/ir/tr、research/ir_v2），沒有就回「這家沒有官方逐字稿」不產。
name: 指定個股報告

on:
  workflow_dispatch:
    inputs:
      code:
        description: "股票代號（例 2308）"
        required: true
      deck:
        description: "法說簡報 PDF 網址（選填；不填用 river.json 記的最新簡報）"
        required: false
        default: ""
      focus:
        description: "重點主題（選填；例：HVDC 高壓直流電源）"
        required: false
        default: ""
      kind:
        description: "ir＝法說即時報告；pick＝指定報告（網站放「指定報告」區）"
        required: false
        default: "ir"

permissions:
  contents: write

concurrency:
  group: company-report-run
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 檢查輸入
        env:
          CODE: ${{ inputs.code }}
          DECK: ${{ inputs.deck }}
          KIND: ${{ inputs.kind }}
        run: |
          [[ "$CODE" =~ ^[0-9]{4,6}[A-Z]?$ ]] || { echo "✗ 股票代號格式不對：$CODE"; exit 1; }
          [[ -z "$DECK" || "$DECK" =~ ^https://mopsov\.twse\.com\.tw/nas/STR/[0-9A-Za-z_]+\.pdf$ ]] || { echo "✗ 簡報網址只收公開資訊觀測站 mopsov /nas/STR/*.pdf"; exit 1; }
          [[ "$KIND" == "ir" || "$KIND" == "pick" ]] || { echo "✗ kind 只能 ir 或 pick"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: StaticWebPage
      - uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: CustomerServiceANDSales
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      # 10-30：法說簡報 PDF 有 AES 加密，pypdf 解密要 cryptography（第一次跑「cryptography>=3.1 is required」整份沒讀到）
      - run: pip install -c "$GITHUB_WORKSPACE/CustomerServiceANDSales/requirements-lock.txt" requests certifi numpy pypdf cryptography
      - name: 產報告
        id: make
        working-directory: CustomerServiceANDSales
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 10-30 Gemini 429 空轉：撞 429 的模型記在 data/gemini_quota/（各 workflow 一檔、跟著 commit），所有 workflow 讀聯集 → 當天不再打
          GEMINI_QUOTA_STATE: ${{ github.workspace }}/StaticWebPage/data/gemini_quota/company_report_run.json
          GEMINI_QUOTA_SHARED: ${{ github.workspace }}/StaticWebPage/data/gemini_quota
          GEA_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}     # 全部模型用完時每個額度日 TG 一次
          GEA_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_TASK_ROUTE: api
          CODE: ${{ inputs.code }}
          DECK: ${{ inputs.deck }}
          FOCUS: ${{ inputs.focus }}
          KIND: ${{ inputs.kind }}
        run: |
          echo "since=$(date +%s)" >> "$GITHUB_OUTPUT"
          args=("$CODE" --no-push)
          [ -n "$DECK" ] && args+=(--deck "$DECK")
          [ -n "$FOCUS" ] && args+=(--focus "$FOCUS")
          [ "$KIND" = "pick" ] && args+=(--kind pick)
          # 11-08（雲端H）：輸出留一份給「沒上架記錄」抓原因（關卡沒過的清單、Traceback 最後一行）
          set -o pipefail
          python tools/company_report.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/make.log" || {
            rc=$?
            # 11-09（雲端M）：exit 3＝這家沒有官方逐字稿（Evans 11-09：沒逐字稿不產）→ 摘要寫清楚
            grep -q "這家沒有官方逐字稿" "$RUNNER_TEMP/make.log" && echo "### $CODE：這家沒有官方逐字稿，不產報告" >> "$GITHUB_STEP_SUMMARY"
            exit $rc; }
      - name: 核對＋打包（同「公司產業報告上網頁」）
        working-directory: CustomerServiceANDSales
        run: python company_verify.py ../StaticWebPage/data ../StaticWebPage/docs/data/company_reports.json
      - name: 提交
        # 11-08（雲端H，【舊】總指揮 11-08 第 1 項）：company_reports.json 是整包打包檔，別班（每日建置、公司產業報告上網頁、
        #   本機推報告）同時推就 pull --rebase 衝突 → 11-07 4904、2451、1326、6213 關卡全過卻推不上，舊版 TG 照報「已上架」。
        #   改成每次重試都 reset 到最新 main → 放回這一班的報告檔 → 重跑同一道打包關卡 → 確認清單裡真的有這篇 → 推。
        id: commit
        working-directory: StaticWebPage
        env:
          CODE: ${{ inputs.code }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fail() { echo "✗ $1"; echo "$1" > "$RUNNER_TEMP/commit_fail.txt"; exit 1; }
          keep=$(git status --porcelain --untracked-files=all -- "data/company_report/${CODE}_*" data/gemini_quota/company_report_run.json | cut -c4-)
          echo "這一班的檔："; echo "$keep"
          md=$(echo "$keep" | grep -E "^data/company_report/${CODE}_[0-9-]+\.md$" | head -1)
          [ -n "$md" ] || fail "沒有新報告（data/company_report 沒有新的 ${CODE}_*.md）"
          rdate=$(basename "$md" .md); rdate=${rdate#${CODE}_}
          tar -cf "$RUNNER_TEMP/mine.tar" $keep
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main && git clean -fdq data/company_report
            tar -xf "$RUNNER_TEMP/mine.tar"
            (cd ../CustomerServiceANDSales && python company_verify.py ../StaticWebPage/data ../StaticWebPage/docs/data/company_reports.json) > "$RUNNER_TEMP/verify.log" 2>&1 \
              || { tail -20 "$RUNNER_TEMP/verify.log"; fail "打包關卡失敗（company_verify）"; }
            python3 -c "import json,sys;d=json.load(open('docs/data/company_reports.json',encoding='utf-8'));sys.exit(0 if any(r.get('code')==sys.argv[1] and r.get('date')==sys.argv[2] for r in d.get('reports',[])) else 1)" "$CODE" "$rdate" \
              || { tail -20 "$RUNNER_TEMP/verify.log"; fail "打包後清單裡沒有 ${CODE}（${rdate}），打包關卡沒收"; }
            echo "✓ 打包後清單有 ${CODE}（${rdate}）"
            git add data/gemini_quota data/company_report docs/data/company_reports.json
            git diff --staged --quiet && fail "沒有新報告（跟 main 上的一樣）"
            git commit -qm "data: 指定個股報告 $CODE $(TZ=Asia/Taipei date '+%F %H:%M')（雲端 Actions：數字程式產生、文字 Gemini API、關卡全過）"
            if git push -q origin HEAD:main; then
              echo "✓ 第 $i 次推上 main：$(git rev-parse --short HEAD)"
              echo "pushed=1" >> "$GITHUB_OUTPUT"; echo "rdate=$rdate" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "第 $i 次推不上（main 有新 commit），reset 重來"; sleep $((2 ** i))
          done
          fail "推不上 main（重試 5 次）"
      - name: TG 通知（只發已上架）
        # 11-08（雲端H）：TG 只發「已上架」＝提交步驟確認清單裡有這篇且推上 main 才發；沒上架的不逐篇發，記進 data/report_failures/，
        #   由 report_fail_digest.yml 每天彙總一則（幾篇沒過、原因前 3）。
        if: always() && steps.commit.outputs.pushed == '1'
        working-directory: CustomerServiceANDSales
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CODE: ${{ inputs.code }}
          FOCUS: ${{ inputs.focus }}
          KIND: ${{ inputs.kind }}
          SINCE: ${{ steps.make.outputs.since }}
        run: python tools/report_tg.py "$CODE" --kind "$KIND" --focus "$FOCUS" --since "${SINCE:-0}"
      - name: 沒上架記錄（給每日彙總）
        if: always() && steps.make.outcome != 'skipped' && steps.commit.outputs.pushed != '1'
        working-directory: StaticWebPage
        env:
          CODE: ${{ inputs.code }}
          KIND: ${{ inputs.kind }}
          MAKE_OUTCOME: ${{ steps.make.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - > "$RUNNER_TEMP/fail.json" <<'PY'
          import ast, json, os, re, datetime as dt
          T = os.environ["RUNNER_TEMP"]
          def rd(n):
              try: return open(os.path.join(T, n), encoding="utf-8", errors="replace").read()
              except OSError: return ""
          log, cf = rd("make.log"), rd("commit_fail.txt").strip()
          stage, reasons = "", []
          m = re.search(r"關卡沒過 → 不推：(\[.*\])\s*$", log, re.M)
          if "這家沒有官方逐字稿" in log:
              # 11-09（Evans 裁示 C，雲端M）：沒有官方逐字稿不出 Gemini 制式報告 → 每日彙總列「缺逐字稿」
              stage, reasons = "缺逐字稿", ["這家沒有官方逐字稿"]
          elif "逐字稿裡挑不到公司人員的原話" in log:
              stage, reasons = "缺逐字稿", ["逐字稿裡挑不到公司人員的原話"]
          elif m:
              stage = "本機關卡沒過"
              try: reasons = [str(x) for x in ast.literal_eval(m.group(1))]
              except Exception: reasons = [m.group(1)[:200]]
          elif "Traceback (most recent call last)" in log:
              stage = "程式錯誤"
              last = [l for l in log.splitlines() if re.match(r"^\w*(Error|Exception)\b", l.strip())]
              reasons = [last[-1].strip()[:200] if last else "Traceback"]
          elif os.environ.get("MAKE_OUTCOME") == "success":
              stage, reasons = "提交失敗", [cf or "提交失敗（原因見 log）"]
          else:
              x = [l.strip() for l in log.splitlines() if l.strip().startswith("✗")]
              stage, reasons = "產報告失敗", [x[-1][:200] if x else "產報告失敗（原因見 log）"]
          now = dt.datetime.now(dt.timezone(dt.timedelta(hours=8)))
          print(json.dumps({"at": now.strftime("%Y-%m-%dT%H:%M"), "code": os.environ["CODE"], "kind": os.environ["KIND"],
                            "event": os.environ["EVENT"], "stage": stage, "reasons": reasons, "run": os.environ["RUN_URL"]}, ensure_ascii=False))
          PY
          echo "沒上架記錄："; cat "$RUNNER_TEMP/fail.json"
          F="data/report_failures/$(TZ=Asia/Taipei date +%F).jsonl"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p data/report_failures && cat "$RUNNER_TEMP/fail.json" >> "$F"
            git add "$F" && git commit -qm "data: 指定個股報告沒上架記錄 ${{ inputs.code }} $(TZ=Asia/Taipei date '+%F %H:%M')"
            git push -q origin HEAD:main && { echo "✓ 已記錄 $F"; exit 0; }
            sleep $((2 ** i))
          done
          exit 1
