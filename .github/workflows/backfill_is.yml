# ============================================================================
# backfill_is.yml ─ 綜合損益表 40 季回補（toalpha 補強第 1 項：三率百分位、十年季度表）
#   怎麼跑：GitHub → StaticWebPage → Actions →「回補綜合損益表」→ Run workflow
#   is_hist.py 一次抓到 max 張表（40 季 × 上市櫃＝80 張；MOPS 一張 10～80 秒）；可重複執行，抓過的季不再抓。
#   跟 daily.yml 同一個 concurrency group，不會對撞。每日班平常每班也會補 8 張。
# ============================================================================
name: 回補綜合損益表與法說歷史

on:
  workflow_dispatch:
    inputs:
      max:
        description: "這次最多抓幾張表"
        required: false
        default: "80"

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - name: checkout 程式 repo
        uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests numpy
      - name: 回補
        working-directory: code
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python is_hist.py ../site/data --max ${{ inputs.max }}
          python ir_hist.py ../site/data --max 60
      - name: commit
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/is_hist.json docs/data/is_q.json data/ir_hist.json docs/data/ir_react.json
          if git diff --staged --quiet; then
            echo "沒有變動，不提交。"
          else
            git commit -m "data: 回補綜合損益表 $(TZ=Asia/Taipei date '+%F %H:%M')"
            for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((2 ** i)); done
            exit 1
          fi
