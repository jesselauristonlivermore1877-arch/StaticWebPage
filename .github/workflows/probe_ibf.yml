# 國票下單主機連線探針（W 2026-11-29，【新】總指揮派工二）：從 GitHub runner（不同的對外 IP）測 203.75.31.195／.83／.36 的 TCP 443。
# 只印 runner 對外 IP 與連線結果，不帶任何帳號或金鑰；用完就刪。
name: 國票連線探針（暫時）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 測 TCP 443
        run: |
          echo "runner 對外 IP：$(curl -s --max-time 10 https://api.ipify.org)"
          for ip in 203.75.31.195 203.75.31.83 203.75.31.36; do
            for i in 1 2 3; do
              t0=$(date +%s%3N)
              if timeout 5 bash -c "exec 3<>/dev/tcp/$ip/443" 2>/dev/null; then r="通 $(( $(date +%s%3N) - t0 )) ms"; else r="不通（5 秒）"; fi
              echo "$ip:443 第 $i 次：$r"
            done
          done
