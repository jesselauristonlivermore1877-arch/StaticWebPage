# backfill_tdcc.yml ─ 集保股權分散表（400／1000 張以上大戶）歷史回補（第七批 21，Evans 09-27）
#   程式：CustomerServiceANDSales 的 tdcc.py；來源：集保「股權分散表查詢」逐檔逐週（開放資料只有最新一週）
#   只補追蹤名單（sector_map.csv 26 大類）× 集保可查的 51 週。
name: 回補集保大戶

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests feedparser certifi
      - name: 抓片 ${{ matrix.shard }}
        working-directory: code
        run: python tdcc.py --backfill ../out --shard ${{ matrix.shard }} --of 8
      - uses: actions/upload-artifact@v4
        with:
          name: tdcc-${{ matrix.shard }}
          path: out/
          if-no-files-found: warn
          retention-days: 1

  merge:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: daily-build
      cancel-in-progress: false
    steps:
      # 🔴 09-28：要拿最新的 main（不是觸發時那個 commit）——抓片期間每日班可能已經提交過同一個檔，舊 checkout 會在 rebase 時 add/add 衝突
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy requests feedparser
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: tdcc-*
          merge-multiple: true
      - name: 併進 tdcc_hist.json
        working-directory: code
        run: python tdcc.py --merge ../dl --data ../data
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tdcc_hist.json docs/data/tdcc.json
          if git diff --staged --quiet; then
            echo "tdcc_hist.json 沒有變化，不提交。"
          else
            git commit -m "data(第七批 21): 回補集保大戶 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
