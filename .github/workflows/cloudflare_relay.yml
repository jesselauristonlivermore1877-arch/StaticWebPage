# cloudflare_relay.yml ─ 部署並測試「下單訊號雲端中繼」gea-signal-relay（Evans 2026-10-11 15:50 派工；協定見 CustomerServiceANDSales TODO.md 同段）
#   程式：本 repo cloudflare/relay（wrangler.toml、src/worker.js、test.mjs）。跟即時信息流 gea-live 分開部署。
#   secrets：沿用 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。
#   RELAY_PUB_TOKEN／RELAY_ADMIN_TOKEN：第一次部署時產生，存進 D1 資料庫 gea-relay-keys 的 keys 表（Evans 從 Cloudflare 主控台複製，
#     路徑寫在 TODO 雲端段），再設成 Worker secret；之後每次部署沿用同一組（不會換，除非 mode=rotate）。log 只印遮罩。
#   mode：deploy＝部署＋自動測試；test＝只測試；rotate＝換新兩組 token 後部署＋測試（換完發送端與管理端要改用新值）。
#     subs＝套用正式訂閱規則（總指揮 2026-10-18 23:55 第 1 項）：gea 頻道 GEA5、GEA6 上架；w_office、evans_nb 訂閱改 GEA5,GEA6；
#           再印用戶／策略狀態與「模擬誰會收到」（不送任何訊號、不部署、不印 token）。管理 token 只在 Actions 裡從 D1 取。
#   測試時同時 wrangler tail 收每次呼叫的 CPU／牆鐘（stats）。不寫 repo 任何檔案。
name: Cloudflare 下單訊號中繼

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy＝部署＋測試；test＝只測試；rotate＝換 token＋部署＋測試；stats＝近 24 小時 CPU（GraphQL，Worker＋Durable Object）；subs＝套用正式訂閱（GEA5、GEA6 上架，舊客戶改 GEA5,GEA6）；conns＝只印連線明細（每條連線的代號、連上時間、閒置秒數、機房）"
        required: false
        default: "deploy"

permissions:
  contents: read

concurrency:
  group: cloudflare-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB: gea-relay-keys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: 安裝 wrangler、ws
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::缺 CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID"; exit 1; fi
          npm i -g wrangler@4.147.0 >/dev/null 2>&1
          npm i --no-save ws@8.18.0 >/dev/null 2>&1
          wrangler --version
      - name: 取得（或第一次產生）RELAY_PUB_TOKEN／RELAY_ADMIN_TOKEN（存 D1 gea-relay-keys）
        run: |
          set -o pipefail
          ID=$(wrangler d1 list --json | python3 -c "import json,sys; print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='$DB'), ''))")
          if [ -z "$ID" ]; then echo "第一次：建 D1 $DB"; wrangler d1 create "$DB" >/dev/null; fi
          wrangler d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS keys(name TEXT PRIMARY KEY, value TEXT NOT NULL, created TEXT NOT NULL)" >/dev/null
          get() { wrangler d1 execute "$DB" --remote --json --command "SELECT value FROM keys WHERE name='$1'" | python3 -c "import json,sys; r=json.load(sys.stdin)[0]['results']; print(r[0]['value'] if r else '')"; }
          for K in RELAY_PUB_TOKEN RELAY_ADMIN_TOKEN; do
            V=$(get $K)
            if [ -z "$V" ] || [ "${{ inputs.mode }}" = "rotate" ]; then
              [ "${{ inputs.mode }}" = "test" ] || [ "${{ inputs.mode }}" = "stats" ] || [ "${{ inputs.mode }}" = "subs" ] || [ "${{ inputs.mode }}" = "conns" ] && { echo "::error::$K 還沒產生（先跑 deploy）"; exit 1; }
              V=$(openssl rand -hex 32)
              echo "::add-mask::$V"
              wrangler d1 execute "$DB" --remote --yes --command "INSERT INTO keys(name,value,created) VALUES('$K','$V',datetime('now')) ON CONFLICT(name) DO UPDATE SET value=excluded.value, created=excluded.created" >/dev/null
              echo "$K：新產生 ${V:0:4}…（共 ${#V} 字）"
            else
              echo "::add-mask::$V"
              echo "$K：沿用 ${V:0:4}…（共 ${#V} 字）"
            fi
            echo "$K=$V" >> "$GITHUB_ENV"
          done
          echo "▶ Evans 複製位置：Cloudflare 主控台 → Storage & databases → D1 SQL database → $DB → Console，執行 SELECT * FROM keys"
      - name: 部署＋設定 Worker secret
        if: inputs.mode != 'test' && inputs.mode != 'stats' && inputs.mode != 'subs' && inputs.mode != 'conns'
        run: |
          set -o pipefail
          wrangler deploy 2>&1 | tee deploy.log
          python3 -c "import json,os; json.dump({k: os.environ[k] for k in ('RELAY_PUB_TOKEN','RELAY_ADMIN_TOKEN')}, open('/tmp/sec.json','w'))"
          wrangler secret bulk /tmp/sec.json; rm -f /tmp/sec.json
          sleep 15
      - name: 套用正式訂閱規則（mode=subs）
        if: inputs.mode == 'subs'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          W = "https://gea-signal-relay.jesselauristonlivermore1877.workers.dev"
          H = {"Authorization": "Bearer " + os.environ["RELAY_ADMIN_TOKEN"], "Content-Type": "application/json", "User-Agent": "gea-relay-admin/1.0"}    # 沒有 UA 會被 Cloudflare 擋 403（10-19 第一次跑）
          def call(path, body=None):
              r = urllib.request.Request(W + path, None if body is None else json.dumps(body).encode(), H, method="GET" if body is None else "POST")
              return json.load(urllib.request.urlopen(r, timeout=30))
          before = call("/admin/state?ch=gea")
          print("── 改之前")
          for u in before["users"]: print("  用戶 %-12s subs=%-12s exp=%-10s 在線 %d 最後連線 %s" % (u["id"], u["subs"], u["exp"], u["online"], u["last_seen"]))
          for x in before["strategies"]: print("  策略 %-10s %s 保留 %d 則" % (x["code"], "上架" if x["listed"] else "下架", x["kept"]))
          ids = {u["id"] for u in before["users"]}
          for c in ("GEA5", "GEA6"):
              r = call("/admin/strategy?ch=gea&code=" + c, {"listed": True}); print("✓ 上架", c, "→", r["strategy"]["listed"])
          for i in ("w_office", "evans_nb"):
              if i not in ids: print("✗ 沒有用戶", i); continue
              r = call("/admin/set?ch=gea&id=" + i, {"subs": "GEA5,GEA6"}); print("✓ 訂閱", i, "→", r["user"]["subs"])
          after = call("/admin/state?ch=gea")
          print("── 改之後")
          for u in after["users"]: print("  用戶 %-12s subs=%-12s exp=%-10s 在線 %d" % (u["id"], u["subs"], u["exp"], u["online"]))
          for x in after["strategies"]: print("  策略 %-10s %s" % (x["code"], "上架" if x["listed"] else "下架"))
          print("── 模擬誰會收到（不送任何東西）")
          for c in ("GEA5", "GEA6", "GEA_NEW_X"):
              r = call("/admin/simulate?ch=gea", {"strategy": c})
              print("  %s（%s）：" % (c, "上架" if r["listed"] else "下架／未登記"), "；".join("%s %s（%s）" % (u["id"], "收" if u["receive"] else "不收", u["why"]) for u in r["users"]))
          bad = [u["id"] for u in after["users"] if u["id"] in ("w_office", "evans_nb") and u["subs"] != "GEA5,GEA6"]
          if bad: raise SystemExit("✗ 沒改成功：%s" % bad)
          print("✓ 正式訂閱規則套用完成")
          PY
      - name: 自動測試（1 發 3 收；同時 tail 收 CPU）
        if: inputs.mode != 'stats' && inputs.mode != 'subs' && inputs.mode != 'conns'
        run: |
          W=https://gea-signal-relay.jesselauristonlivermore1877.workers.dev
          for i in 1 2 3 4 5 6; do C=$(curl -s -o /dev/null -w "%{http_code}" "$W/"); echo "GET / → $C"; [ "$C" = 200 ] && break; sleep 10; done
          (timeout 150 wrangler tail gea-signal-relay --format json > tail.jsonl 2> tail.err &) ; sleep 12
          set +e
          BASE=$W node test.mjs; RC=$?
          sleep 15; pkill -f "wrangler tail" ; sleep 2
          python3 - <<'PY'
          import json, collections
          ev = collections.defaultdict(list); shown = 0
          raw = open("tail.jsonl", encoding="utf-8", errors="replace").read()
          print("  tail.jsonl %d 字" % len(raw))
          dec, i, objs = json.JSONDecoder(), 0, []
          while True:                                          # wrangler tail --format json 是多行縮排、一個接一個 → 串流解碼
              j = raw.find("{", i)
              if j < 0: break
              try: o, i = dec.raw_decode(raw, j); objs.append(o)
              except Exception: i = j + 1
          for e in objs:
              if not isinstance(e, dict): continue
              if shown < 3:                                    # 先印原始結構定位（10-11：event 有時是字串）
                  print("  樣本：", json.dumps({k: (v if not isinstance(v, (dict, list)) else type(v).__name__) for k, v in e.items()}, ensure_ascii=False)[:300]); shown += 1
              x = e.get("event")
              x = x if isinstance(x, dict) else {}
              req = x.get("request") if isinstance(x.get("request"), dict) else {}
              if x.get("webSocketEventType") or x.get("getWebSocketEvent"):
                  kind = "ws " + str(x.get("webSocketEventType") or "event")
              elif req:
                  kind = "HTTP /" + (req.get("url", "").split("?")[0].split("/", 3)[-1])
              else:
                  kind = str(e.get("eventType") or e.get("executionModel") or "其他")
              ev[kind].append((e.get("cpuTime") or 0, e.get("wallTime") or 0, e.get("outcome")))
          print("── CPU（wrangler tail，每次呼叫 ms）")
          for k, L in sorted(ev.items()):
              c = sorted(a for a, _, _ in L); w = sorted(b for _, b, _ in L)
              print("  %-22s %4d 次｜CPU 中位 %s、最大 %s｜牆鐘 中位 %s、最大 %s｜outcome %s" % (k, len(L), c[len(c)//2], c[-1], w[len(w)//2], w[-1], dict(collections.Counter(o for _, _, o in L))))
          print("tail 共", sum(map(len, ev.values())), "筆")
          PY
          tail -3 tail.err
          exit $RC
      - name: 連線明細（mode=conns；deploy／rotate 跑完也印）
        if: always() && (inputs.mode == 'conns' || inputs.mode == 'deploy' || inputs.mode == 'rotate')
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          W = "https://gea-signal-relay.jesselauristonlivermore1877.workers.dev"
          H = {"Authorization": "Bearer " + os.environ["RELAY_ADMIN_TOKEN"], "User-Agent": "gea-relay-admin/1.0"}
          st = json.load(urllib.request.urlopen(urllib.request.Request(W + "/admin/state?ch=gea", None, H), timeout=30))
          print("頻道 gea｜最後序號 %s｜發送端在線 %s｜本次清掉殭屍 %s" % (st["last_seq"], st["pubs_online"], st.get("swept", "（舊版沒有）")))
          for u in st["users"]: print("  用戶 %-12s 在線 %d 條｜subs=%s｜最後連線 %s" % (u["id"], u["online"], u["subs"], u["last_seen"]))
          if "conns" not in st: print("（中繼還是舊版，沒有逐條連線明細）")
          for c in st.get("conns", []): print("  連線 %-3s %-12s 連上 %s｜閒置 %4d 秒｜機房 %s" % (c["role"], c["id"], c["since"], c["idle_s"], c["colo"]))
          PY
      - name: CPU 用量（GraphQL 近 24 小時；Worker 與 Durable Object 分開）
        if: inputs.mode == 'stats'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime as dt
          now = dt.datetime.now(dt.timezone.utc); t0 = now - dt.timedelta(hours=24)
          V = {"a": os.environ["CLOUDFLARE_ACCOUNT_ID"], "s": t0.strftime("%Y-%m-%dT%H:%M:%SZ"), "e": now.strftime("%Y-%m-%dT%H:%M:%SZ")}
          Q = {
            "Worker": """query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){
              workersInvocationsAdaptive(limit:200,filter:{scriptName:"gea-signal-relay",datetime_geq:$s,datetime_leq:$e}){
                sum{requests errors} quantiles{cpuTimeP50 cpuTimeP99 wallTimeP99} dimensions{status datetimeHour}}}}}""",
            "Durable Object": """query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){
              durableObjectsInvocationsAdaptiveGroups(limit:200,filter:{scriptName:"gea-signal-relay",datetime_geq:$s,datetime_leq:$e}){
                sum{requests errors wallTime} quantiles{cpuTimeP50 cpuTimeP99} dimensions{datetimeHour}}}}}""",
          }
          for name, q in Q.items():
              r = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", json.dumps({"query": q, "variables": V}).encode(),
                                         {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"})
              try: J = json.load(urllib.request.urlopen(r, timeout=60))
              except Exception as e: print(name, "GraphQL 失敗：", e); continue
              if J.get("errors"): print(name, "errors：", json.dumps(J["errors"], ensure_ascii=False)[:500])
              acc = ((((J.get("data") or {}).get("viewer") or {}).get("accounts") or [{}])[0]) or {}
              rows = next(iter(acc.values()), []) if acc else []
              print("──", name, len(rows), "列")
              for x in sorted(rows, key=lambda x: str(x.get("dimensions"))):
                  print("  ", json.dumps(x, ensure_ascii=False)[:240])
          PY
