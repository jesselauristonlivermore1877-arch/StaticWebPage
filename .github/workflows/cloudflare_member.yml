# cloudflare_member.yml ─ 部署並測試「GEA 會員區」gea-member（Evans 2026-10-18 17:05 派工「預覽轉正式」；設計見 CustomerServiceANDSales TODO 同日段）
#   程式：本 repo cloudflare/member（wrangler.toml、src/worker.js、test.mjs）。網頁與資料不在這裡：由私有 repo 的 tools/member_push.py 上傳到 D1（API token 沒有 KV 權限）。
#   secrets：沿用 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID；選用 LINE_CHANNEL_ID、LINE_CHANNEL_SECRET（Evans 建好 LINE Login channel 後設，沒設就不開 LINE 登入）。
#   ADMIN_TOKEN：第一次部署時產生，存進 D1 gea-member 的 keys 表（Evans 從 Cloudflare 主控台複製，設成本機使用者變數 GEA_MEMBER_ADMIN_TOKEN），
#     再設成 Worker secret；之後每次部署沿用（mode=rotate 才換）。log 只印遮罩。
#   mode：deploy＝部署＋自動測試；test＝只測試；rotate＝換 ADMIN_TOKEN 後部署＋測試；usage＝只查 Cloudflare 用量（最近 7 天每支 Worker 每天請求數、方案；10-19 總指揮本機段 4）；
#         page＝不部署 Worker，只把私有 repo main 的 research/preview_b/index.html（看盤區網頁）上傳到 D1（10-29 晚【新】總指揮零：雲端沒有 token、連不到 workers.dev，
#               改由這裡上傳；比對 SHA 才傳、要有 <!--GEA_ME--> 注入點，同 tools/member_push.py；資料檔照舊由本機 member_push 傳）。
name: Cloudflare 會員區

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy＝部署＋測試；test＝只測試；rotate＝換管理 token＋部署＋測試；usage＝只查用量；page＝只上傳看盤區網頁"
        required: false
        default: "deploy"

permissions:
  contents: read

concurrency:
  group: cloudflare-member
  cancel-in-progress: false

jobs:
  usage:
    if: inputs.mode == 'usage'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare 用量（GraphQL 分析：最近 7 天每支 Worker 每天請求數；Workers 方案）
        shell: python
        run: |
          import json, os, urllib.request, datetime as dt
          tok, acc = os.environ["CLOUDFLARE_API_TOKEN"], os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def call(url, body=None):
              r = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers={"authorization": "Bearer " + tok, "content-type": "application/json"})
              try: return json.load(urllib.request.urlopen(r, timeout=30))
              except urllib.error.HTTPError as e: return {"http": e.code, "body": e.read()[:300].decode("utf-8", "replace")}
          e = dt.date.today(); s = e - dt.timedelta(days=6)
          q = "query($a:String!,$s:Date!,$e:Date!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:1000,filter:{date_geq:$s,date_leq:$e}){sum{requests errors subrequests} dimensions{date scriptName}}}}}"
          r = call("https://api.cloudflare.com/client/v4/graphql", {"query": q, "variables": {"a": acc, "s": str(s), "e": str(e)}})
          if r.get("errors") or "http" in r: print("✗ GraphQL 讀不到（API token 可能沒有 Account Analytics 讀取權限）：", json.dumps(r, ensure_ascii=False)[:500])
          else:
              rows = r["data"]["viewer"]["accounts"][0]["workersInvocationsAdaptive"]; day = {}
              for x in sorted(rows, key=lambda x: (x["dimensions"]["date"], x["dimensions"]["scriptName"])):
                  d = x["dimensions"]["date"]; day[d] = day.get(d, 0) + x["sum"]["requests"]
                  print(f'{d}　{x["dimensions"]["scriptName"]:<20} 請求 {x["sum"]["requests"]:>8,}　錯誤 {x["sum"]["errors"]:>6,}　子請求 {x["sum"]["subrequests"]:>8,}')
              for d, n in sorted(day.items()): print(f"合計 {d}（UTC）：{n:,} 次＝免費額度 10 萬的 {n / 1000:.1f}%")
          for u in ("/workers/account-settings", "/subscriptions"):
              r = call("https://api.cloudflare.com/client/v4/accounts/" + acc + u)
              print("方案資訊", u, "：", json.dumps(r.get("result", r), ensure_ascii=False)[:600])
  member:
    if: inputs.mode != 'usage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/member
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      DB: gea-member
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: 安裝 wrangler
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::缺 CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID"; exit 1; fi
          npm i -g wrangler@4.147.0 >/dev/null 2>&1
          wrangler --version
      - name: 取得（或第一次建立）D1 gea-member，填進 wrangler.toml
        run: |
          set -o pipefail
          ID=$(wrangler d1 list --json | python3 -c "import json,sys; print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='$DB'), ''))")
          if [ -z "$ID" ]; then echo "第一次：建 D1 $DB"; wrangler d1 create "$DB" >/dev/null
            ID=$(wrangler d1 list --json | python3 -c "import json,sys; print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='$DB'), ''))"); fi
          [ -n "$ID" ] || { echo "::error::D1 id 取不到"; exit 1; }
          echo "D1 $DB：$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          wrangler d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS keys(name TEXT PRIMARY KEY, value TEXT NOT NULL, created TEXT NOT NULL)" >/dev/null
      - name: 取得（或第一次產生）ADMIN_TOKEN（存 D1 gea-member 的 keys 表）
        run: |
          set -o pipefail
          get() { wrangler d1 execute "$DB" --remote --json --command "SELECT value FROM keys WHERE name='$1'" | python3 -c "import json,sys; r=json.load(sys.stdin)[0]['results']; print(r[0]['value'] if r else '')"; }
          V=$(get ADMIN_TOKEN)
          if [ -z "$V" ] || [ "${{ inputs.mode }}" = "rotate" ]; then
            [ "${{ inputs.mode }}" = "test" ] && { echo "::error::ADMIN_TOKEN 還沒產生（先跑 deploy）"; exit 1; }
            V=$(openssl rand -hex 32)
            echo "::add-mask::$V"
            wrangler d1 execute "$DB" --remote --yes --command "INSERT INTO keys(name,value,created) VALUES('ADMIN_TOKEN','$V',datetime('now')) ON CONFLICT(name) DO UPDATE SET value=excluded.value, created=excluded.created" >/dev/null
            echo "ADMIN_TOKEN：新產生 ${V:0:4}…（共 ${#V} 字）"
          else
            echo "::add-mask::$V"
            echo "ADMIN_TOKEN：沿用 ${V:0:4}…（共 ${#V} 字）"
          fi
          echo "ADMIN_TOKEN=$V" >> "$GITHUB_ENV"
          echo "▶ Evans 複製位置：Cloudflare 主控台 → Storage & databases → D1 SQL database → $DB → Console，執行 SELECT * FROM keys"
      - name: 取看盤區網頁（私有 repo main）
        if: inputs.mode == 'page'
        uses: actions/checkout@v4
        with:
          repository: jesselauristonlivermore1877-arch/CustomerServiceANDSales
          path: code
          token: ${{ secrets.CODE_REPO_TOKEN }}
          sparse-checkout: research/preview_b/index.html
          sparse-checkout-cone-mode: false
      - name: 上傳看盤區網頁 index.html
        if: inputs.mode == 'page'
        working-directory: code
        shell: python
        run: |
          import hashlib, json, os, sys, urllib.request
          B, tok = "https://gea-member.jesselauristonlivermore1877.workers.dev", os.environ["ADMIN_TOKEN"]
          def call(m, path, body=None, h=None):
              hh = {"authorization": "Bearer " + tok, "user-agent": "gea-member-push"}; hh.update(h or {})
              with urllib.request.urlopen(urllib.request.Request(B + path, data=body, method=m, headers=hh), timeout=120) as r: return json.loads(r.read() or b"{}")
          b = open("research/preview_b/index.html", "rb").read(); sha = hashlib.sha256(b).hexdigest()
          if b"<!--GEA_ME-->" not in b: sys.exit("✗ index.html 沒有 <!--GEA_ME--> 注入點，不上傳")
          remote = {f["name"]: f.get("sha") for f in call("GET", "/api/admin/files")["files"]}
          print("本地 %s（%d 位元組）；正式站 %s" % (sha[:12], len(b), (remote.get("index.html") or "沒有")[:12]))
          if remote.get("index.html") == sha: print("✓ 正式站已是同一版，不用傳"); sys.exit(0)
          r = call("PUT", "/api/admin/file?name=index.html", b, {"x-ct": "text/html; charset=utf-8"})
          assert r.get("sha") == sha, "✗ 上傳後雜湊不符"
          print("✓ 已上傳 index.html", sha[:12])
      - name: 部署＋設定 Worker secret
        if: inputs.mode != 'test' && inputs.mode != 'page'
        run: |
          set -o pipefail
          wrangler deploy 2>&1 | tee deploy.log
          python3 - <<'PY'
          import json, os
          s = {"ADMIN_TOKEN": os.environ["ADMIN_TOKEN"]}
          if os.environ.get("LINE_CHANNEL_ID") and os.environ.get("LINE_CHANNEL_SECRET"):
              s["LINE_CHANNEL_ID"] = os.environ["LINE_CHANNEL_ID"]; s["LINE_CHANNEL_SECRET"] = os.environ["LINE_CHANNEL_SECRET"]
          print("Worker secrets：", "、".join(s))
          json.dump(s, open("/tmp/sec.json", "w"))
          PY
          wrangler secret bulk /tmp/sec.json; rm -f /tmp/sec.json
          sleep 15
      - name: 自動測試
        run: |
          W=https://gea-member.jesselauristonlivermore1877.workers.dev
          for i in 1 2 3 4 5 6; do C=$(curl -s -o /dev/null -w "%{http_code}" "$W/"); echo "GET / → $C"; [ "$C" = 200 ] && break; sleep 10; done
          BASE=$W node test.mjs
