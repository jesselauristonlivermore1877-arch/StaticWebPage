# 一次性：驗證 GEMINI_API_KEY 是哪一把（只印末 4 碼與長度，不印完整值），驗完即刪
name: 金鑰驗證（一次性）
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 末 4 碼、長度、HTTP 狀態碼
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "末 4 碼：${K: -4}"
          echo "長度：${#K}"
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "x-goog-api-key: $K" https://generativelanguage.googleapis.com/v1beta/models)
          echo "HTTP 狀態碼：$code"
