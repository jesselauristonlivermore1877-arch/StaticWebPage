name: diag-twse

# 手動觸發專用。不排程、不碰任何資料、不 commit 任何東西。
# 只做一件事：從 GitHub 的出口 IP 打一次那些端點，
# 拿來跟 Evans 本機那份對照。用完連同 diag_twse_actions.py 一起刪。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: run probe
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python diag_twse_actions.py
