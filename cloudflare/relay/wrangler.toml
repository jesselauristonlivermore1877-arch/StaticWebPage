# gea-signal-relay ── 下單訊號雲端中繼（Evans 2026-10-11 15:50 派工；協定見 CustomerServiceANDSales TODO.md 同段）
#   獨立 Worker，不跟即時信息流 gea-live 混在一起（CPU 上限各自計算）。
#   一個頻道＝一個 Durable Object（SQLite 後端、Hibernation API）；免費方案只能用 SQLite 後端。
#   secrets：RELAY_PUB_TOKEN、RELAY_ADMIN_TOKEN（由 .github/workflows/cloudflare_relay.yml 產生並設定）；TG_BOT_TOKEN、TG_CHAT_ID（同 workflow 從 repo secret 帶入）。
#   contracts.json：W 跑 CustomerServiceANDSales ordermachine/tools/contracts.py --sign 產生，部署時打包進 GET /contracts。
name = "gea-signal-relay"
main = "src/worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

# 11-01：每小時踢掉服務期間外的連線；台北 09:00 那班發到期前 3 天提醒
[triggers]
crons = ["0 * * * *"]

[vars]
RELAY_CHANNELS = "gea"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[observability]
enabled = true
